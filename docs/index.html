a TC al ingreso; la TC precoz subestima la necrosis y es más confiable a los 5 a 7 días si la evolución no es buena. La CPRE diagnóstica no está indicada.","fuente":"Atlanta revisada (Banks 2013); Hermes: Pancreatitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué hidratación indicás?","opciones":["Ringer lactato a 1,5 ml/kg/h con reevaluación frecuente; bolo de 10 ml/kg solo si hay hipovolemia","Solución fisiológica 20 ml/kg en bolo y luego 3 ml/kg/h","Restricción hídrica","Coloides"],"explicacion":"La reanimación moderada con Ringer lactato redujo la sobrecarga de volumen sin empeorar la evolución frente a la agresiva (ensayo WATERFALL). Se reduce o suspende el aporte si aparecen signos de sobrecarga.","fuente":"iLATAM-AP 2026 y ensayo WATERFALL; Hermes: Pancreatitis aguda"},{"tipo":"Medidas generales","pregunta":"¿Cuándo empieza a comer?","opciones":["Alimentación oral precoz según tolerancia; en la forma leve puede empezar de inmediato","Ayuno hasta que se normalice la lipasa","Nutrición parenteral","Sonda nasoyeyunal"],"explicacion":"La alimentación oral se reinicia dentro de las 24 a 48 horas si se tolera, y en los cuadros leves puede comenzar de inmediato. Esperar a que baje la lipasa no tiene fundamento; la nutrición artificial se reserva para quien no tolera la vía oral.","fuente":"Hermes: Pancreatitis aguda"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No: no hay indicación de antibióticos profilácticos","Imipenem profiláctico","Ceftriaxona durante 7 días","Metronidazol"],"explicacion":"No se indican antibióticos profilácticos en pancreatitis, ni siquiera necrotizante. Se reservan para necrosis infectada, colangitis u otra infección documentada.","fuente":"Hermes: Pancreatitis aguda"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo hacés la colecistectomía?","opciones":["En la misma internación","A las 6 a 8 semanas","No hace falta si la lipasa se normaliza","Solo después de una CPRE con esfinterotomía de rutina"],"explicacion":"En la pancreatitis biliar leve, la colecistectomía en la internación índice redujo los eventos biliares recurrentes de 17 % a 5 % (ensayo PONCHO). La CPRE se reserva para colangitis o cálculo confirmado.","fuente":"Ensayo PONCHO; Hermes: Manejo de la pancreatitis biliar"}]},{"id":"hernia-01","tema":"Hernia inguinal","anio":1,"titulo":"Bulto inguinal que molesta al esfuerzo","vineta":"Varón de 42 años, albañil, ASA I, sin cirugías pélvicas previas. Tumoración inguinal derecha reducible desde hace 8 meses, que le molesta al hacer fuerza. Examen: hernia inguinal indirecta derecha reducible; lado izquierdo normal.","pasos":[{"tipo":"Estudios","pregunta":"¿Necesitás imágenes antes de operar?","opciones":["No: el diagnóstico es clínico","Ecografía obligatoria","TC de abdomen y pelvis","Resonancia de la región inguinal"],"explicacion":"El diagnóstico de la hernia inguinal es clínico en la mayoría de los casos. La ecografía dinámica, TC o RM se reservan para hernia oculta, obesidad, recurrencia o diagnóstico dudoso.","fuente":"Hermes: Hernia inguinal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué reparación indicás si contás con experiencia y recursos?","opciones":["Reparación laparoendoscópica (TEP o TAPP) con malla","Espera vigilada","Shouldice como primera elección","Herniorrafia de Bassini"],"explicacion":"HerniaSurge 2023 recomienda la vía laparoendoscópica en la hernia primaria unilateral por menos dolor posoperatorio y crónico, con experiencia y recursos. Al ser sintomática, se opera; la reparación sin malla queda para casos seleccionados.","fuente":"HerniaSurge 2023; Hermes: Hernia inguinal"},{"tipo":"Técnica","pregunta":"¿Qué malla usás por vía laparoendoscópica?","opciones":["Malla de polipropileno pesada (más de 70 g/m²)","Malla liviana (menos de 50 g/m²)","Malla parcialmente absorbible","No hace falta malla"],"explicacion":"En la vía laparoendoscópica HerniaSurge recomienda malla pesada, sobre todo en hernias grandes y directas: la liviana no reduce el dolor y aumenta la recurrencia. La liviana se recomienda en Lichtenstein.","fuente":"HerniaSurge 2023, capítulo de mallas"},{"tipo":"Fármaco","pregunta":"¿Indicás profilaxis antibiótica?","opciones":["No: en la reparación laparoendoscópica no se sugiere profilaxis","Cefazolina 2 g IV preincisión","Ceftriaxona durante 3 días","Amoxicilina-clavulánico durante 7 días"],"explicacion":"HerniaSurge 2023 no sugiere profilaxis antibiótica en la reparación laparoendoscópica en ningún paciente ni ambiente. En la reparación abierta con malla solo se sugiere en pacientes de alto riesgo o ambientes con alta infección.","fuente":"HerniaSurge 2023, capítulo de profilaxis"},{"tipo":"Técnica","pregunta":"¿Dónde no podés fijar la malla en un TEP o TAPP?","opciones":["En los triángulos del dolor y funesto, por debajo del tracto iliopúbico","En el ligamento de Cooper","En la pared abdominal anterior por encima del tracto iliopúbico","En el tubérculo púbico"],"explicacion":"Por debajo del tracto iliopúbico están el triángulo funesto (vasos ilíacos externos) y el del dolor (ramo genital del genitofemoral y nervio cutáneo femoral lateral). Fijar ahí produce hemorragia grave o neuralgia crónica.","fuente":"Fromont 2006 (EMC TAPP); Hermes: Reparación preperitoneal de hernia inguinal"}]},{"id":"hernia-02","tema":"Hernia inguinal","anio":1,"titulo":"Hernia que no entra hace 30 horas","vineta":"Varón de 76 años con hernia inguinal derecha conocida. Hace 30 horas quedó irreductible y dolorosa, con vómitos. La piel sobre la hernia está eritematosa y caliente. Leucocitos 15.000/mm³.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás según HerniaSurge 2023?","opciones":["Hernia agudamente irreductible con sospecha de estrangulación","Hernia incarcerada","Hernia crónicamente irreductible","Hernia estrangulada confirmada"],"explicacion":"HerniaSurge 2023 propone abandonar el término \"incarcerada\". \"Estrangulada\" se reserva para cuando la imagen o la cirugía la confirman. Es agudamente irreductible porque antes se reducía y los síntomas son de inicio agudo.","fuente":"HerniaSurge 2023, capítulo de urgencia; Hermes: Hernia inguinal estrangulada"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Cirugía de urgencia inmediata, sin intentar la reducción manual","Intentar la reducción manual y observar","Antibióticos y reevaluar a las 24 horas","TC y cirugía programada"],"explicacion":"Cambios en la piel, más de 24 horas de evolución y leucocitosis son signos de estrangulación. La reducción manual se intenta solo sin sospecha de isquemia; con sospecha, la cirugía es inmediata (recomendación fuerte).","fuente":"HerniaSurge 2023, algoritmo de la hernia agudamente irreductible"},{"tipo":"Técnica","pregunta":"El asa parece violácea. ¿Cómo decidís si resecar?","opciones":["Liberar el anillo, calentar con compresas tibias y reevaluar color, peristaltismo y pulsos antes de resecar","Resecar siempre todo segmento de color anormal","Reducir el asa al abdomen sin evaluarla","Decidir solo por el sangrado del borde de sección"],"explicacion":"Primero se libera el cuello y se da tiempo a la recuperación con fisiología corregida; luego se valoran color, peristaltismo y pulsos mesentéricos. Ningún signo aislado garantiza viabilidad, y reducir sin evaluar oculta un asa necrótica.","fuente":"Hermes: Hernia inguinal estrangulada y Resección intestinal en isquemia"},{"tipo":"Técnica","pregunta":"Resecaste un asa necrótica con anastomosis, sin derrame fecal. ¿Cómo reparás la hernia?","opciones":["Malla plana de polipropileno macroporosa","Malla biológica obligatoria","Sin reparación: se difiere siempre","Malla microporosa de PTFE"],"explicacion":"Con estrangulación o resección intestinal (campo limpio-contaminado), HerniaSurge 2023 sugiere malla macroporosa de polipropileno. WSES 2017 coincide en permitir malla sintética sin derrame entérico macroscópico.","fuente":"HerniaSurge 2023; WSES 2017; Hermes: Hernia inguinal estrangulada"}]},{"id":"pared-01","tema":"Eventraciones","anio":2,"titulo":"Eventración en una fumadora diabética","vineta":"Mujer de 58 años con eventración supraumbilical sintomática, 2 años después de una laparotomía mediana. IMC 33, fuma 20 cigarrillos por día, diabetes tipo 2 con HbA1c de 8,4 %. Defecto palpable de unos 6 cm.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís para planificar la cirugía?","opciones":["TC (o RM) de la pared abdominal","Solo examen físico","Ecografía de partes blandas","Radiografía de abdomen"],"explicacion":"EHS 2023 recomienda TC o RM antes de operar una eventración: define ancho y área del defecto, contenido, músculos y otros defectos, y anticipa si la fascia cerrará sin separación de componentes.","fuente":"EHS 2023, eventración de línea media; Hermes: Eventración de la pared abdominal"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás antes de operar?","opciones":["Dejar de fumar al menos 4 semanas antes, HbA1c menor de 7 % y descenso de peso supervisado","Operar ya, sin optimizar","Dejar de fumar el día anterior a la cirugía","Exigir IMC menor de 25 antes de operar"],"explicacion":"EHS 2023 recomienda preoptimizar: la abstinencia de menos de 4 semanas no reduce complicaciones, el objetivo glucémico es HbA1c menor de 7 % y el descenso de peso es dirigido. Exigir un IMC normal puede demorar indefinidamente una cirugía sintomática.","fuente":"EHS 2023; Hermes: Optimización preoperatoria en hernia ventral"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué reparación indicás?","opciones":["Malla con cierre del defecto en posición retromuscular","Sutura simple del defecto","Malla intraperitoneal en puente sin cerrar el defecto","Malla onlay como primera elección"],"explicacion":"EHS 2023 recomienda malla (la sutura sola recidiva 30 %), cierre del defecto en vez de puente y plano retromuscular, que tuvo menos recurrencia y seroma que el onlay. El onlay se prefiere en la urgencia, no en la cirugía electiva.","fuente":"EHS 2023, eventración de línea media"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis antibiótica indicás?","opciones":["Cefazolina","Vancomicina de rutina","Ninguna","Ceftriaxona más metronidazol durante 5 días"],"explicacion":"EHS 2023 sugiere una dosis única de profilaxis en la reparación de eventraciones. La cefazolina es el agente de elección para la cirugía limpia de pared; la vancomicina se reserva para colonización por SAMR o alergia grave.","fuente":"EHS 2023; ASHP/IDSA/SIS/SHEA 2013"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["2 g IV dentro de los 60 minutos previos a la incisión; repetir si la cirugía supera 4 horas","1 g IV al cerrar la piel","2 g IV cada 8 horas durante 7 días","500 mg VO la noche anterior"],"explicacion":"La dosis es de 2 g (3 g si pesa 120 kg o más) dentro de la hora previa a la incisión, para tener niveles en el tejido al cortar. EHS 2023 sugiere una segunda dosis si la cirugía dura más de 4 horas. Prolongarla no reduce la infección.","fuente":"ASHP/IDSA/SIS/SHEA 2013; EHS 2023"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás después de la cirugía?","opciones":["Movilización activa según tolerancia y evitar cargas y esfuerzos con Valsalva durante 4 semanas","Reposo en cama durante 2 semanas","Faja obligatoria durante 6 meses","Volver a levantar peso a la semana"],"explicacion":"EHS 2023 sugiere movilizarse activamente desde el inicio, evitar cargas y ejercicios con Valsalva durante 4 semanas (tiempo de integración de la malla) y usar faja solo por comodidad durante 6 semanas.","fuente":"EHS 2023, cuidados posoperatorios"}]}];
const INTERVALOS = [0, 1, 3, 7, 16, 35]; // días por nivel de repetición espaciada
const DIA = 86400000;
const CLAVE = 'pase-de-sala-progreso-v1';
const SESION = 5;

function leer() { try { return JSON.parse(localStorage.getItem(CLAVE)) || {} } catch (e) { return {} } }
function guardar(p) { try { localStorage.setItem(CLAVE, JSON.stringify(p)) } catch (e) {} }
let prog = leer();
let estado = { pantalla: 'inicio' };

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ahora = () => Date.now();
const mezclar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]] } return b };
const fecha = t => new Date(t).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });

function nivel(id) { return (prog[id] && prog[id].nivel) || 0 }
function pendiente(id) { const p = prog[id]; return p && p.vence <= ahora() }
function dominado(id) { return nivel(id) >= 3 }

function colaSesion() {
  const vencidos = CASOS.filter(c => pendiente(c.id)).sort((a, b) => prog[a.id].vence - prog[b.id].vence);
  const nuevos = CASOS.filter(c => !prog[c.id]);
  return mezclar(vencidos).concat(mezclar(nuevos)).slice(0, SESION).map(c => c.id);
}

function agrupar(clave) {
  const g = {};
  CASOS.forEach(c => { const k = c[clave]; (g[k] = g[k] || []).push(c) });
  return g;
}

function barra(nombre, lista) {
  const n = lista.length, d = lista.filter(c => dominado(c.id)).length, v = lista.filter(c => prog[c.id] && !dominado(c.id)).length;
  return `<div class="bar"><div class="bar-head"><span>${esc(nombre)}</span><span>${d}/${n} dominados</span></div>
  <div class="track" role="img" aria-label="${d} dominados y ${v} en práctica de ${n}"><i class="dom" style="width:${d / n * 100}%"></i><i class="vis" style="width:${v / n * 100}%"></i></div></div>`;
}

function inicio() {
  const cola = colaSesion();
  const vencidos = CASOS.filter(c => pendiente(c.id)).length;
  const nuevos = CASOS.filter(c => !prog[c.id]).length;
  const dom = CASOS.filter(c => dominado(c.id)).length;
  const porAnio = agrupar('anio'), porTema = agrupar('tema');
  const proximo = CASOS.map(c => prog[c.id]).filter(p => p && p.vence > ahora()).sort((a, b) => a.vence - b.vence)[0];
  $('#app').innerHTML = `
  <header class="top"><div><p class="eyebrow">Residencia de cirugía general</p><h1>Pase de sala</h1></div><span class="badge">${CASOS.length} casos</span></header>
  <div class="stats">
    <div class="stat"><b>${vencidos}</b><span>para repasar hoy</span></div>
    <div class="stat"><b>${nuevos}</b><span>sin ver</span></div>
    <div class="stat"><b>${dom}</b><span>dominados</span></div>
  </div>
  <div class="row">
    <button class="btn" id="b-sesion" ${cola.length ? '' : 'disabled'}>${cola.length ? `Empezar sesión · ${cola.length} caso${cola.length > 1 ? 's' : ''}` : 'Nada pendiente hoy'}</button>
  </div>
  ${!cola.length && proximo ? `<p class="muted">El próximo repaso vence el ${fecha(proximo.vence)}. Mientras, podés repasar un tema.</p>` : ''}
  <section class="panel" aria-labelledby="t-tema"><h2 id="t-tema">Repasar un tema</h2>
    <div class="temas">${Object.entries(porTema).map(([t, l]) => `<button class="tema" data-tema="${esc(t)}"><span>${esc(t)}<small>${l.length} ${l.length === 1 ? 'caso' : 'casos'} · ${l[0].anio}.º año</small></span><span class="badge">${l.filter(c => dominado(c.id)).length}/${l.length}</span></button>`).join('')}</div>
  </section>
  <section class="panel" aria-labelledby="t-av"><h2 id="t-av">Avance por año del programa</h2>
    <div class="bars">${Object.keys(porAnio).sort().map(a => barra(a + '.º año', porAnio[a])).join('')}</div>
    <div class="legend"><span><i style="background:var(--scrub)"></i>Dominado (3 aciertos espaciados)</span><span><i style="background:var(--iodine);opacity:.55"></i>En práctica</span></div>
  </section>
  <details><summary>Respaldo del progreso</summary>
    <div style="display:grid;gap:8px;margin-top:10px">
      <p class="muted">El progreso queda guardado en este teléfono. Copiá este código para respaldarlo o pegá uno anterior para restaurarlo.</p>
      <textarea id="respaldo" aria-label="Código de respaldo">${esc(JSON.stringify(prog))}</textarea>
      <div class="row"><button class="btn sec" id="b-copiar">Copiar código</button><button class="btn sec" id="b-restaurar">Restaurar desde el código</button></div>
      <p class="msg" id="msg-resp"></p>
    </div></details>`;
  $('#b-sesion').onclick = () => cola.length && empezar(cola, 'Sesión del día');
  document.querySelectorAll('.tema').forEach(b => b.onclick = () => empezar(mezclar(CASOS.filter(c => c.tema === b.dataset.tema)).map(c => c.id), b.dataset.tema));
  $('#b-copiar').onclick = () => { const t = $('#respaldo'); navigator.clipboard && navigator.clipboard.writeText(t.value).then(() => $('#msg-resp').textContent = 'Código copiado.', () => { t.select(); $('#msg-resp').textContent = 'Seleccioné el código: copialo manualmente.' }) || (t.select(), $('#msg-resp').textContent = 'Seleccioné el código: copialo manualmente.') };
  $('#b-restaurar').onclick = () => { try { const p = JSON.parse($('#respaldo').value); if (typeof p !== 'object' || !p) throw 0; prog = p; guardar(prog); inicio(); $('#msg-resp') && ($('#msg-resp').textContent = 'Progreso restaurado.') } catch (e) { $('#msg-resp').textContent = 'El código no es válido: copiá el texto completo del respaldo.' } };
}

function empezar(ids, etiqueta) {
  estado = { pantalla: 'caso', cola: ids, i: 0, etiqueta, paso: 0, res: [], orden: null };
  caso();
}

function caso() {
  const c = CASOS.find(x => x.id === estado.cola[estado.i]);
  const p = c.pasos[estado.paso];
  if (!estado.orden) estado.orden = mezclar(p.opciones.map((t, k) => ({ t, k })));
  const resp = estado.respondido;
  const pasos = c.pasos.map((_, k) => `<i class="${k < estado.res.length ? (estado.res[k] ? 'ok' : 'no') : k === estado.paso ? 'act' : ''}"></i>`).join('');
  const esDosis = p.tipo === 'Dosis';
  $('#app').innerHTML = `
  <header class="top"><div><p class="eyebrow">${esc(estado.etiqueta)} · caso ${estado.i + 1} de ${estado.cola.length}</p><h2>${esc(c.titulo)}</h2></div><button class="badge" id="b-salir" style="border:0">Salir</button></header>
  <article class="vineta"><p class="eyebrow">${esc(c.tema)} · ${c.anio}.º año</p><p>${esc(c.vineta)}</p><div class="pasos" aria-label="Paso ${estado.paso + 1} de ${c.pasos.length}">${pasos}</div></article>
  <section class="hoja"><div class="margen" aria-hidden="true">${esc(p.tipo)}</div><div class="hoja-body">
    <p class="eyebrow">Paso ${estado.paso + 1} de ${c.pasos.length} · ${esc(p.tipo)}</p>
    <h3>${esc(p.pregunta)}</h3>
    <div class="ops">${estado.orden.map(o => {
      let cl = 'op' + (esDosis ? ' dosis' : '');
      if (resp) { if (o.k === 0) cl += ' ok'; else if (o.k === resp.k) cl += ' no' }
      return `<button class="${cl}" data-k="${o.k}" ${resp ? 'disabled' : ''}>${esc(o.t)}</button>`
    }).join('')}</div>
    ${resp ? `<div class="feedback ${resp.k === 0 ? '' : 'no'}"><strong>${resp.k === 0 ? 'Correcto.' : 'La respuesta es: ' + esc(p.opciones[0])}</strong><p>${esc(p.explicacion)}</p><p class="fuente">${esc(p.fuente)}</p></div>
    <button class="btn" id="b-sig">${estado.paso + 1 < c.pasos.length ? 'Siguiente paso' : 'Ver resultado del caso'}</button>` : ''}
  </div></section>`;
  $('#b-salir').onclick = () => { estado = { pantalla: 'inicio' }; inicio() };
  document.querySelectorAll('.op:not([disabled])').forEach(b => b.onclick = () => { estado.respondido = { k: +b.dataset.k }; estado.res.push(+b.dataset.k === 0); caso(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }) });
  if (resp) $('#b-sig').onclick = () => {
    estado.respondido = null; estado.orden = null;
    if (estado.paso + 1 < c.pasos.length) { estado.paso++; caso(); window.scrollTo(0, 0) } else cierre(c);
  };
}

function cierre(c) {
  const ok = estado.res.filter(Boolean).length, n = estado.res.length, pct = ok / n;
  const prev = prog[c.id] || { nivel: 0, intentos: 0 };
  let nivelN = prev.nivel;
  if (pct >= 0.85) nivelN = Math.min(prev.nivel + 1, INTERVALOS.length - 1);
  else if (pct < 0.6) nivelN = 1;
  else nivelN = Math.max(prev.nivel, 1);
  const vence = ahora() + INTERVALOS[nivelN] * DIA;
  prog[c.id] = { nivel: nivelN, vence, intentos: prev.intentos + 1, ultimo: Math.round(pct * 100), fallos: c.pasos.map((p, k) => estado.res[k] ? null : p.tipo).filter(Boolean) };
  guardar(prog);
  const quedan = estado.i + 1 < estado.cola.length;
  $('#app').innerHTML = `
  <header class="top"><div><p class="eyebrow">${esc(estado.etiqueta)} · caso ${estado.i + 1} de ${estado.cola.length}</p><h2>${esc(c.titulo)}</h2></div></header>
  <section class="panel"><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${ok}/${n}</b><span>pasos correctos</span></div><div class="stat"><b>${Math.round(pct * 100)}%</b><span>del caso</span></div></div>
    <ul class="res-list">${c.pasos.map((p, k) => `<li><span class="m ${estado.res[k] ? 'ok' : 'no'}">${estado.res[k] ? '✓' : '✗'}</span><span>${esc(p.tipo)}: ${esc(p.opciones[0])}</span></li>`).join('')}</ul>
    <p class="next-review">Vuelve ${INTERVALOS[nivelN] === 0 ? 'hoy' : INTERVALOS[nivelN] === 1 ? 'mañana' : 'en ' + INTERVALOS[nivelN] + ' días (' + fecha(vence) + ')'}</p>
  </section>
  <div class="row">${quedan ? '<button class="btn" id="b-otro">Siguiente caso</button>' : ''}<button class="btn ${quedan ? 'sec' : ''}" id="b-ini">Volver al inicio</button></div>`;
  if (quedan) $('#b-otro').onclick = () => { estado.i++; estado.paso = 0; estado.res = []; caso(); window.scrollTo(0, 0) };
  $('#b-ini').onclick = () => { estado = { pantalla: 'inicio' }; inicio(); window.scrollTo(0, 0) };
}

function arrancar(datos) {
  if (datos && datos.estado && datos.estado.pantalla === 'caso') { estado = datos.estado; caso() } else inicio();
}
window.claude?.hot?.snapshot?.(() => ({ estado }));
window.claude?.hot?.ready ? window.claude.hot.ready(arrancar) : arrancar(window.claude?.hot?.data ?? {});
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
</body>
