o se extrapola a mujeres, por la frecuencia de hernias crurales y su riesgo de estrangulación.","fuente":"Hermes: Hernia inguinal"}]},{"id":"umb-01","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical en un cirrótico","vineta":"Varón de 58 años con cirrosis alcohólica, abstinente, ascitis controlada con diuréticos, MELD 12. Hernia umbilical de 2 cm sintomática, con piel sana.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Lo operás en forma programada?","opciones":["Sí, tras optimizar la función hepática y la ascitis, porque el MELD es menor de 15","No, nunca se opera un cirrótico","Solo si se complica","Sí, pero de urgencia"],"explicacion":"La reparación electiva es segura en cirróticos con MELD menor de 15 tras optimizar; la urgencia multiplica por siete la mortalidad, y entre 26 % y 37 % de los no operados termina en una reparación urgente.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales; Hermes: Hernia umbilical del adulto"},{"tipo":"Técnica","pregunta":"¿Qué técnica indicás?","opciones":["Reparación abierta con malla onlay o preperitoneal","Sutura simple","Malla intraperitoneal laparoscópica","Plicatura sin malla"],"explicacion":"La sutura recidiva alrededor del 15 % a los 6 meses y la laparoscopia con ascitis aumentó las complicaciones sistémicas y la mortalidad.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Medidas generales","pregunta":"¿Qué medida perioperatoria es clave?","opciones":["Controlar la ascitis antes y después de la cirugía para evitar la fuga y la recurrencia","Suspender los diuréticos una semana antes","Dieta hiperproteica sin restricción de sodio","Paracentesis evacuadora cada día durante un mes"],"explicacion":"La ascitis no controlada aumenta la presión sobre la reparación, la fuga de líquido y la infección; se optimiza con el equipo de hepatología.","fuente":"Hermes: Hernia umbilical del adulto"}]},{"id":"umb-02","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical en edad fértil","vineta":"Mujer de 30 años con una hernia umbilical de 1,5 cm, reducible y poco sintomática. Planea dos embarazos más.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo la operás?","opciones":["Postergar la reparación hasta después del último embarazo si es posible","Ahora mismo con malla","Durante el primer embarazo","Nunca"],"explicacion":"Un embarazo posterior aumenta 1,6 veces la recurrencia, y la hernia rara vez se complica durante la gestación. Por eso se sugiere esperar al último embarazo.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Técnica","pregunta":"Si no pudiera esperar, ¿qué técnica sugiere la guía?","opciones":["Sutura del defecto","Malla intraperitoneal","Malla retromuscular amplia","Separación de componentes"],"explicacion":"En mujeres que se van a embarazar, la malla redujo la recurrencia pero casi duplicó el dolor crónico (17,5 % frente a 9,5 %), por lo que se sugiere sutura si la cirugía no puede postergarse.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Medidas generales","pregunta":"¿Qué le indicás mientras espera?","opciones":["Pautas de alarma de incarceración (dolor, irreductibilidad, vómitos)","Faja abdominal permanente","Reposo","Ninguna indicación"],"explicacion":"Con hernia reducible se observa, pero la paciente debe consultar ante dolor persistente, irreductibilidad o vómitos.","fuente":"Hermes: Hernia umbilical del adulto"}]},{"id":"ped-01","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Bulto inguinal en un lactante","vineta":"Lactante de 4 meses, nacido a término, con un bulto inguinal derecho que aparece al llorar y se reduce solo. Examen normal en reposo; testículos en las bolsas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hernia inguinal indirecta por persistencia del conducto peritoneovaginal","Hidrocele no comunicante","Testículo retráctil","Adenopatía"],"explicacion":"Un bulto intermitente que aumenta con el llanto y se reduce es una hernia indirecta por un proceso vaginal permeable.","fuente":"Hermes: Hernia inguinal en el niño"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reparación programada pronta por el riesgo de incarceración","Observar hasta los 2 años","Braguero","Operar solo si se incarcera"],"explicacion":"Toda hernia inguinal pediátrica se repara porque no se cierra sola y el riesgo de incarceración es alto en lactantes (12 % a término, 39 % en prematuros).","fuente":"Guía EUPSA 2022; Hermes: Hernia inguinal en el niño"},{"tipo":"Técnica","pregunta":"¿En qué consiste la reparación?","opciones":["Ligadura alta del saco, sin malla ni reconstrucción del piso, abierta o laparoscópica","Lichtenstein con malla","Reparación de Shouldice","Malla preperitoneal"],"explicacion":"El defecto es el proceso vaginal permeable: se liga el saco preservando deferente y vasos. No se usa malla. Abierta y laparoscópica tienen resultados similares.","fuente":"Guía EUPSA 2022; Hermes: Hernia inguinal en el niño"}]},{"id":"ped-02","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Bolsa escrotal vacía","vineta":"Lactante de 8 meses con el testículo izquierdo no palpable en la bolsa; se palpa en el conducto inguinal y no desciende con maniobras.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Testículo no descendido palpable","Testículo retráctil","Hidrocele","Hernia inguinal"],"explicacion":"Un testículo palpable en el conducto que no baja a la bolsa con maniobras es un testículo no descendido; el retráctil puede llevarse a la bolsa y se queda.","fuente":"EAU, guías de urología pediátrica"},{"tipo":"Estudios","pregunta":"¿Pedís una ecografía?","opciones":["No: no cambia la conducta en el testículo palpable","Sí, siempre","Sí, resonancia","Sí, cariotipo de rutina"],"explicacion":"La imagen no aporta en el testículo palpable y no localiza de forma confiable el no palpable, que se estudia por laparoscopia.","fuente":"EAU, guías de urología pediátrica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo lo operás?","opciones":["Orquidopexia entre los 6 y los 12 meses, completada antes de los 18 meses","A los 5 años","En la pubertad","No se opera, se trata con hormonas"],"explicacion":"La cirugía temprana preserva la fertilidad y facilita el control del riesgo tumoral. El tratamiento hormonal no se recomienda como estándar.","fuente":"EAU, guías de urología pediátrica"}]},{"id":"ped-03","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Dolor escrotal súbito en un adolescente","vineta":"Varón de 14 años con dolor escrotal izquierdo súbito e intenso desde hace 3 horas, náuseas. Testículo ascendido, horizontal, reflejo cremastérico ausente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Torsión testicular","Epididimitis","Torsión de hidátide","Orquitis urliana"],"explicacion":"Dolor súbito, testículo alto y horizontal y cremastérico ausente en un adolescente son torsión hasta demostrar lo contrario.","fuente":"Hermes: Torsión testicular"},{"tipo":"Estudios","pregunta":"¿Esperás la ecografía Doppler para decidir?","opciones":["No: con alta sospecha clínica se explora de inmediato","Sí, siempre","Sí, una centellografía","Sí, un urocultivo"],"explicacion":"Una ecografía normal no descarta la torsión y la demora reduce la viabilidad, que cae mucho después de las 6 horas. Con sospecha alta, el quirófano no espera la imagen.","fuente":"Hermes: Torsión testicular"},{"tipo":"Técnica","pregunta":"El testículo recupera el color tras destorcerlo. ¿Qué hacés?","opciones":["Orquidopexia bilateral","Orquidopexia solo del lado afectado","Orquiectomía","Cerrar sin fijar"],"explicacion":"La anomalía de fijación (badajo de campana) suele ser bilateral, por lo que se fijan ambos testículos. Si el testículo no es viable, se extirpa y se fija el contralateral.","fuente":"Hermes: Torsión testicular"}]},{"id":"var-01","tema":"Várices de miembros inferiores","anio":1,"titulo":"Várices sintomáticas","vineta":"Mujer de 48 años con pesadez y edema vespertino en la pierna derecha y várices en el territorio de la safena interna. Eco Doppler: reflujo de la unión safenofemoral y de la safena interna en todo el muslo. Sin úlcera.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás en CEAP clínica?","opciones":["C2 o C3 (várices con o sin edema), de causa primaria por insuficiencia de la safena interna","C6","C0","C5"],"explicacion":"La clasificación CEAP clínica va de C0 (sin signos) a C6 (úlcera activa): C2 son várices, C3 edema, C4 cambios cutáneos, C5 úlcera cicatrizada.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Medias de compresión para los síntomas, actividad física, control de peso y elevación","Reposo en cama","Calor local","Anticoagulación"],"explicacion":"La compresión alivia los síntomas y el edema, junto con ejercicio, descenso de peso y elevación. No corrige el reflujo.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento definitivo es de primera elección?","opciones":["Ablación térmica endovenosa de la safena interna","Safenectomía con fleboextracción como primera opción","Escleroterapia con espuma de la unión safenofemoral como estándar","Ligadura del cayado sola"],"explicacion":"ESVS 2022 recomienda la ablación térmica endovenosa (láser o radiofrecuencia) sobre la cirugía para la insuficiencia de safena interna, por menor dolor y recuperación más rápida con resultados similares. La cirugía sigue siendo opción donde no hay ablación.","fuente":"ESVS 2022, enfermedad venosa crónica"}]},{"id":"ano-01","tema":"Patología anal","anio":1,"titulo":"Sangrado y prolapso al defecar","vineta":"Varón de 45 años con sangrado rojo rutilante al final de la defecación y prolapso que se reduce solo. Constipación crónica. Anoscopia: hemorroides internas de grado II.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado tienen y qué más evaluás?","opciones":["Grado II (prolapsan y se reducen solas); evaluar colonoscopia según edad y síntomas","Grado IV","Grado I","Grado III, no requiere otro estudio"],"explicacion":"Las internas se gradúan de I (no prolapsan) a IV (irreductibles). El sangrado no debe atribuirse a hemorroides sin descartar otras causas según edad y síntomas.","fuente":"ASCRS 2018, hemorroides; Hermes: Enfermedad hemorroidal"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero?","opciones":["Aumentar la fibra y el agua y no pujar ni demorar en el inodoro","Hemorroidectomía","Dieta sin residuos","Reposo"],"explicacion":"La modificación de la dieta con fibra y líquidos y los hábitos de defecación son la primera línea (recomendación fuerte 1B).","fuente":"ASCRS 2018, hemorroides"},{"tipo":"Conducta quirúrgica","pregunta":"Persisten los síntomas. ¿Qué procedimiento indicás?","opciones":["Ligadura con bandas elásticas en el consultorio","Hemorroidectomía de Milligan-Morgan","Esfinterotomía","Hemorroidopexia de urgencia"],"explicacion":"Para grados I a III que no responden al tratamiento médico, la ligadura elástica es el procedimiento ambulatorio más eficaz. La hemorroidectomía se reserva para grado III y IV o fracaso.","fuente":"ASCRS 2018, hemorroides"}]},{"id":"ano-02","tema":"Patología anal","anio":1,"titulo":"Dolor anal con bulto azulado","vineta":"Mujer de 33 años con dolor anal intenso de 36 horas y un nódulo azulado, tenso, en el margen anal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hemorroide externa trombosada","Absceso perianal","Fisura anal","Prolapso rectal"],"explicacion":"Un nódulo azulado, tenso y doloroso en el margen anal, de aparición brusca, es una trombosis hemorroidal externa.","fuente":"ASCRS 2018, hemorroides"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás con 36 horas de evolución?","opciones":["Escisión del trombo con anestesia local","Incisión y drenaje simple del coágulo","Ligadura con banda elástica","Hemorroidectomía de urgencia de los tres paquetes"],"explicacion":"En las primeras 72 horas, la escisión resuelve los síntomas más rápido y recurre menos que la incisión simple. Después, el manejo suele ser médico porque el dolor ya está cediendo.","fuente":"ASCRS 2018, hemorroides; revisión AAFP"},{"tipo":"Medidas generales","pregunta":"Si tuviera 6 días de evolución, ¿qué indicarías?","opciones":["Baños de asiento, analgesia, fibra y ablandadores de materia fecal","Escisión urgente","Antibióticos","Reposo absoluto"],"explicacion":"Pasadas las 72 horas la trombosis tiende a resolver sola y se trata en forma conservadora, salvo dolor intenso o necrosis.","fuente":"ASCRS 2018, hemorroides"}]},{"id":"ano-03","tema":"Patología anal","anio":1,"titulo":"Tumefacción perianal fluctuante","vineta":"Varón de 35 años sin comorbilidades. Dolor perianal de 3 días, tumefacción fluctuante a las 5 en posición de litotomía, sin celulitis extensa. Afebril, no diabético.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Absceso perianal","Hemorroide trombosada","Fisura anal","Quiste pilonidal"],"explicacion":"Dolor y tumefacción fluctuante perianal es un absceso de origen criptoglandular.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés y cuándo?","opciones":["Drenaje quirúrgico dentro de las 24 horas","Antibióticos y control en una semana","Esperar que fistulice espontáneamente","Punción con aguja fina"],"explicacion":"El absceso se drena siempre. Sin signos sistémicos ni factores de riesgo de infección necrosante, ACPGBI propone operar dentro de las 24 horas de la decisión.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Técnica","pregunta":"¿Cómo lo drenás?","opciones":["Incisión cerca del esfínter, amplia, rompiendo tabiques, sin buscar el orificio interno ni taponar de rutina","Incisión radial alejada del ano y taponaje apretado","Buscar la fístula con estilete y abrirla siempre","Colocar sedal en todos los casos"],"explicacion":"En el absceso primario no se busca el orificio interno ni se trata la fístula. La incisión va cerca del esfínter para evitar un trayecto largo, y no se tapona de rutina.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No: en el absceso no complicado bien drenado no hacen falta","Sí, 14 días","Sí, siempre ciprofloxacina y metronidazol","Sí, una dosis única de vancomicina"],"explicacion":"Los antibióticos y los cultivos tienen poco valor en el absceso no complicado drenado; se reservan para celulitis extensa, inmunosupresión, diabetes o signos sistémicos.","fuente":"ACPGBI 2021, urgencias colorrectales"}]},{"id":"osto-01","tema":"Ostomías","anio":1,"titulo":"Colostomía con bordes oscuros","vineta":"Paciente en el día 1 de una operación de Hartmann. La colostomía está oscura en la mucosa visible. Afebril, abdomen blando.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo evaluás la extensión de la isquemia?","opciones":["Introducir un tubo de ensayo iluminado o un endoscopio por el estoma para ver si la mucosa por debajo de la fascia está viable","TC con contraste","Esperar a que se desprenda","Biopsia"],"explicacion":"La evaluación clínica y endoscópica es más útil que la TC. Lo que define la conducta es si la isquemia llega por debajo de la fascia.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Conducta quirúrgica","pregunta":"La necrosis se extiende por debajo de la fascia. ¿Qué indicás?","opciones":["Reoperación urgente para movilizar o resecar y rehacer el estoma","Observación","Curaciones locales","Antibióticos solos"],"explicacion":"Un estoma no viable por debajo de la fascia puede perforarse dentro del abdomen y causar peritonitis; se reopera para rehacerlo con intestino viable.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Medidas generales","pregunta":"¿Qué medida preoperatoria reduce las complicaciones de los estomas programados?","opciones":["Marcación preoperatoria del sitio por estomaterapia","Hacer el estoma siempre en la línea media","Ubicarlo en un pliegue cutáneo","Decidir el sitio durante la cirugía sin marcar"],"explicacion":"Marcar un sitio que el paciente vea y maneje, a través del recto anterior y lejos de pliegues y cicatrices, reduce fugas y complicaciones.","fuente":"Hermes: Complicaciones de ostomías"}]},{"id":"osto-02","tema":"Ostomías","anio":1,"titulo":"Ileostomía de alto débito","vineta":"Paciente con ileostomía en asa hace 5 días tras una resección anterior baja. Débito de 2200 ml/día, sed, creatinina en aumento.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Ileostomía de alto débito con deshidratación","Fuga anastomótica","Íleo","Obstrucción del estoma"],"explicacion":"Un débito mayor de 1,5 a 2 litros por día con signos de deshidratación y caída de la función renal es una ileostomía de alto débito, causa frecuente de reinternación.","fuente":"Hermes: Ileostomía"},{"tipo":"Medidas generales","pregunta":"¿Qué indicación de líquidos es correcta?","opciones":["Restringir los líquidos hipotónicos (agua, té) y dar solución de rehidratación oral con sodio","Tomar mucha agua","Solo jugos de fruta","Suspender toda ingesta oral"],"explicacion":"El agua y los líquidos hipotónicos aumentan la pérdida de sodio por el estoma. Se restringen y se reemplazan por una solución oral con alta concentración de sodio, con hidratación IV si hace falta.","fuente":"Hermes: Ileostomía"},{"tipo":"Fármaco","pregunta":"¿Qué fármaco reduce el débito?","opciones":["Loperamida antes de las comidas","Metoclopramida","Laxantes osmóticos","Eritromicina"],"explicacion":"La loperamida enlentece el tránsito y reduce el débito; se toma antes de las comidas. Los proquinéticos y laxantes lo empeoran.","fuente":"Hermes: Ileostomía"}]},{"id":"gastro-01","tema":"Ostomías","anio":1,"titulo":"Gastrostomía para alimentación","vineta":"Varón de 72 años con disfagia por un ACV hace 3 semanas, sin recuperación de la deglución prevista en el próximo mes. Necesita alimentación enteral prolongada.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué acceso enteral indicás?","opciones":["Gastrostomía endoscópica percutánea","Sonda nasogástrica indefinida","Nutrición parenteral","Yeyunostomía quirúrgica abierta como primera opción"],"explicacion":"Cuando se prevé alimentación enteral por más de 4 a 6 semanas, la gastrostomía percutánea es la vía de elección por menor desplazamiento y mejor tolerancia que la sonda nasogástrica.","fuente":"Hermes: Gastrostomía"},{"tipo":"Medidas generales","pregunta":"La sonda se sale al 7.º día. ¿Qué hacés?","opciones":["No reintroducirla a ciegas: el trayecto no está maduro, se evalúa con endoscopia o radiología","Reintroducir una sonda Foley a ciegas y alimentar","Esperar a que cierre","Alimentar por la boca de inmediato"],"explicacion":"Antes de la maduración del trayecto (unas 4 semanas) el estómago puede separarse de la pared; una sonda reintroducida a ciegas puede quedar en la cavidad peritoneal y causar peritonitis al alimentar.","fuente":"Hermes: Gastrostomía"},{"tipo":"Medidas generales","pregunta":"¿Qué cuidado previene la complicación del tope interno enterrado?","opciones":["Rotar la sonda y moverla hacia adentro y afuera, sin apretar el tope externo","Fijar el tope externo bien apretado","No moverla nunca","Cambiarla cada semana"],"explicacion":"Un tope externo demasiado ajustado empuja el interno dentro de la pared gástrica (buried bumper). Se deja un margen de movilidad y se rota la sonda.","fuente":"Hermes: Gastrostomía"}]},{"id":"ano-04","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Dolor anal desgarrante de 3 meses","vineta":"Mujer de 32 años con dolor anal intenso durante y después de defecar desde hace 3 meses, con sangrado escaso. Fisura en la línea media posterior con bordes indurados, colgajo centinela y fibras del esfínter interno visibles. Continencia normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Fisura anal crónica primaria","Fisura anal aguda","Fisura secundaria a enfermedad de Crohn","Fístula perianal"],"explicacion":"Más de 6 semanas de evolución, colgajo centinela, papila hipertrófica y fibras del esfínter interno expuestas definen la cronicidad. La ubicación posterior en la línea media es típica; las laterales obligan a buscar otra causa.","fuente":"WSES-AAST 2021; Hermes: Fisura anal"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Fibra y agua para ablandar la materia fecal, baños de asiento y analgesia","Dieta sin residuos","Laxantes estimulantes diarios","Ninguna, solo cirugía"],"explicacion":"Corregir la consistencia fecal es la base de todo tratamiento: las heces duras perpetúan la lesión.","fuente":"WSES-AAST 2021; Hermes: Fisura anal"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento farmacológico de primera línea indicás?","opciones":["Bloqueante cálcico tópico (diltiazem al 2 % o nifedipina)","Corticoide tópico","Antibiótico oral","Dilatación anal manual"],"explicacion":"Los bloqueantes cálcicos tópicos tienen eficacia similar a los nitratos con menos cefalea, y son la primera línea en la fisura crónica. La dilatación manual está contraindicada por la incontinencia que causa.","fuente":"ASCRS 2023, fisura anal"},{"tipo":"Dosis","pregunta":"¿Cómo se aplica?","opciones":["Pomada aplicada en el ano 2 a 3 veces por día durante al menos 6 a 8 semanas","Una única aplicación","Una vez por semana durante un mes","Solo cuando duele, durante 3 días"],"explicacion":"La relajación química del esfínter necesita constancia: se aplica varias veces por día durante al menos 6 semanas antes de considerar el fracaso.","fuente":"ASCRS 2023, fisura anal; WSES-AAST 2021"},{"tipo":"Conducta quirúrgica","pregunta":"No cicatriza tras 8 semanas de tratamiento correcto. ¿Qué indicás?","opciones":["Esfinterotomía lateral interna, o toxina botulínica si se prefiere evitar el riesgo de incontinencia","Fistulotomía","Dilatación anal forzada","Hemorroidectomía"],"explicacion":"La esfinterotomía lateral interna es el tratamiento más eficaz de la fisura crónica refractaria en pacientes sin incontinencia previa; la toxina botulínica es una alternativa con menos riesgo funcional pero más recurrencia.","fuente":"ASCRS 2023, fisura anal"}]},{"id":"ano-05","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Orificio que supura después de un absceso","vineta":"Varón de 40 años al que le drenaron un absceso perianal hace 4 meses. Persiste un orificio externo a 2 cm del margen anal que supura en forma intermitente. Al tacto se palpa un cordón hacia la línea media posterior.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Fístula perianal","Fisura anal","Quiste pilonidal","Hidradenitis supurativa"],"explicacion":"Un orificio externo que supura tras el drenaje de un absceso, con un trayecto palpable hacia el canal anal, es una fístula de origen criptoglandular.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Estudios","pregunta":"¿Cuándo pedís una resonancia pélvica?","opciones":["Si la fístula parece compleja, recidivada, anterior en una mujer o se sospecha Crohn","Siempre antes de cualquier fístula simple","Nunca","Solo si hay fiebre"],"explicacion":"La resonancia es el mapa preferido para fístulas complejas, recurrentes o en Crohn. En una fístula simple baja puede bastar el examen bajo anestesia.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"En el examen bajo anestesia es interesfinteriana baja. ¿Qué hacés?","opciones":["Fistulotomía","Colgajo de avance rectal","Colostomía","Antibióticos prolongados"],"explicacion":"La fistulotomía cura la fístula simple baja con mínimo riesgo para la continencia. Las técnicas que preservan el esfínter (sedal, colgajo, LIFT) se reservan para fístulas que comprometen más esfínter.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Técnica","pregunta":"Si comprometiera más de un tercio del esfínter externo, ¿qué harías en un primer tiempo?","opciones":["Colocar un sedal laxo para drenar y planificar una técnica que preserve el esfínter","Fistulotomía completa igual","Inyectar adhesivo de fibrina y dar el alta definitiva","Nada"],"explicacion":"Seccionar mucho esfínter arriesga incontinencia. El sedal laxo controla la sepsis y permite luego un colgajo de avance, LIFT u otra técnica conservadora.","fuente":"Hermes: Absceso y fístula anorrectal"}]},{"id":"pilo-01","tema":"Quiste pilonidal","anio":2,"titulo":"Dolor sacrococcígeo con tumefacción","vineta":"Varón de 20 años, peludo, con 3 días de dolor y tumefacción fluctuante en el pliegue interglúteo. Se ven dos fositas en la línea media. Afebril.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Absceso pilonidal","Absceso perianal","Hidradenitis supurativa","Quiste dermoide sacro"],"explicacion":"Fositas en la línea media del pliegue con un absceso adyacente son la presentación aguda de la enfermedad pilonidal.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés ahora?","opciones":["Incisión y drenaje, lateral a la línea media","Resección amplia del quiste de urgencia","Antibióticos solos","Colgajo romboidal de urgencia"],"explicacion":"El absceso se drena; la resección definitiva se planifica después, cuando la inflamación cede. Una incisión fuera de la línea media cicatriza mejor.","fuente":"ASCRS 2019, enfermedad pilonidal; Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"Meses después tiene enfermedad crónica sintomática. ¿Qué técnica evitás?","opciones":["Escisión con cierre primario en la línea media","Técnicas de cierre fuera de la línea media (Karydakis, Bascom)","Pit-picking","Destechado"],"explicacion":"El cierre en la línea media tiene más infección y recurrencia. Las técnicas que aplanan el pliegue y cierran fuera de la línea media son preferibles.","fuente":"ASCRS 2019, enfermedad pilonidal; Hermes: Quiste pilonidal"},{"tipo":"Medidas generales","pregunta":"¿Qué medida puede reducir la recurrencia?","opciones":["Depilación de la región (láser o rasurado) e higiene del pliegue","Reposo prolongado","Antibióticos profilácticos","Dieta"],"explicacion":"Eliminar el pelo de la zona reduce la recurrencia después del tratamiento.","fuente":"ASCRS 2019, enfermedad pilonidal"}]},{"id":"hernia-04","tema":"Hernias recidivadas","anio":2,"titulo":"Recurrencia tras un Lichtenstein","vineta":"Varón de 62 años operado con técnica de Lichtenstein hace 3 años. Presenta recurrencia inguinal derecha sintomática y reducible.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué pedís antes de operar?","opciones":["El protocolo quirúrgico de la operación anterior","Una TC de rutina","Una resonancia de rutina","Nada"],"explicacion":"Saber qué técnica, plano y malla se usaron orienta la vía de reparación y ayuda a entender el mecanismo de la falla.","fuente":"Hermes: Hernia inguinal recurrente"},{"tipo":"Conducta quirúrgica","pregunta":"¿Por qué vía la reparás?","opciones":["Posterior (TEP o TAPP), por un plano no operado","Anterior otra vez","Shouldice","Observación"],"explicacion":"Se prefiere el plano virgen: posterior tras una reparación anterior y anterior tras una posterior. Así se evita disecar tejido cicatricial con malla.","fuente":"HerniaSurge; Hermes: Hernia inguinal recurrente"},{"tipo":"Medidas generales","pregunta":"¿Cuándo derivarías a un centro especializado?","opciones":["Ante multirrecurrencia, ambos planos operados, infección de malla o dolor crónico complejo","En toda primera recurrencia","Nunca","Solo si el paciente lo pide"],"explicacion":"Las recurrencias múltiples o con ambos planos operados son técnicamente complejas y deben resolverse en unidades con experiencia en pared.","fuente":"Hermes: Hernia inguinal recurrente"}]},{"id":"hernia-05","tema":"Hernias recidivadas","anio":2,"titulo":"Bulto doloroso debajo del ligamento inguinal","vineta":"Mujer de 78 años con dolor y un bulto irreductible debajo del ligamento inguinal izquierdo desde hace 20 horas, con vómitos. Piel sin cambios. Leucocitos 12.000/mm³.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Hernia crural agudamente irreductible con posible estrangulación","Adenopatía inguinal","Hernia inguinal directa","Aneurisma femoral"],"explicacion":"Una masa irreductible debajo del ligamento inguinal en una mujer mayor, con vómitos, es una hernia crural complicada hasta demostrar otra cosa; es la hernia con más riesgo de estrangulación.","fuente":"Hermes: Hernia crural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Cirugía urgente","Reducción manual y control ambulatorio","Observación con analgesia","Cirugía programada en un mes"],"explicacion":"Ante vómitos y más de 20 horas de irreductibilidad se opera de urgencia; la reducción manual se intenta solo sin sospecha de isquemia.","fuente":"HerniaSurge 2023, urgencia"},{"tipo":"Técnica","pregunta":"Para liberar el anillo crural, ¿qué estructura debés proteger?","opciones":["La vena femoral, lateral al saco","El nervio ilioinguinal","El conducto deferente","La arteria epigástrica en la línea media"],"explicacion":"El anillo crural tiene la vena femoral por fuera; la sección para liberarlo se hace hacia medial, sobre el ligamento lacunar. La sutura de cierre tampoco debe comprimir la vena.","fuente":"Hermes: Hernia inguinal estrangulada"}]},{"id":"venosa-01","tema":"Enfermedad venosa crónica","anio":2,"titulo":"Úlcera maleolar interna","vineta":"Mujer de 66 años con una úlcera de 4 cm en el maléolo interno izquierdo de 5 meses, con lipodermatoesclerosis. Pulsos pedios palpables, índice tobillo-brazo 1,0. Eco Doppler: reflujo de la safena interna, sistema profundo competente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y en qué CEAP está?","opciones":["Úlcera venosa activa, CEAP C6","Úlcera arterial","Úlcera neuropática","Úlcera venosa cicatrizada, C5"],"explicacion":"Una úlcera maleolar interna con cambios cutáneos crónicos y reflujo venoso, con perfusión arterial normal, es una úlcera venosa activa (C6).","fuente":"ESVS 2022, enfermedad venosa crónica; Hermes: Úlcera venosa"},{"tipo":"Estudios","pregunta":"¿Por qué medís el índice tobillo-brazo antes de comprimir?","opciones":["Para descartar arteriopatía que contraindique la compresión intensa","Para diagnosticar el reflujo","Para clasificar la úlcera en CEAP","No hace falta"],"explicacion":"La compresión intensa sobre un miembro con mala perfusión puede producir necrosis. Un índice bajo obliga a reducir la compresión o evaluar la arteriopatía.","fuente":"ESVS 2022; Hermes: Úlcera venosa"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el tratamiento causal?","opciones":["Compresión multicomponente con presión de al menos 40 mmHg en el tobillo, elevación y ejercicio de la pantorrilla","Apósitos de plata sin compresión","Antibióticos por colonización","Reposo absoluto"],"explicacion":"La compresión es lo que cicatriza la úlcera venosa. Ningún apósito la reemplaza, y los antibióticos solo se usan si hay infección clínica.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo tratás el reflujo de la safena?","opciones":["En forma temprana, junto con la compresión","Solo después de que cicatrice, si recidiva","Nunca","Cuando la úlcera tenga más de 2 años"],"explicacion":"En el ensayo EVRA, la ablación temprana del reflujo superficial más compresión aceleró la cicatrización y redujo la recurrencia frente a diferirla.","fuente":"Ensayo EVRA; ESVS 2022"}]},{"id":"tep-01","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Disnea súbita en el día 6","vineta":"Mujer de 59 años en el día 6 de una histerectomía por cáncer. Disnea súbita, frecuencia 112, saturación 89 %, presión 125/80 mmHg. Angio-TC: embolia pulmonar segmentaria bilateral; sin dilatación del ventrículo derecho y troponina normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo estratificás el riesgo?","opciones":["Riesgo intermedio-bajo o bajo: estable, sin disfunción del ventrículo derecho ni troponina elevada","Riesgo alto","Riesgo intermedio-alto","No hace falta estratificar"],"explicacion":"El riesgo alto es la embolia con inestabilidad hemodinámica. En el estable, la disfunción del ventrículo derecho y la troponina elevada definen el intermedio-alto; esta paciente no tiene ninguna de las dos.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Anticoagulación con heparina de bajo peso molecular a dosis terapéutica","Trombólisis sistémica","Filtro de vena cava","Aspirina"],"explicacion":"La embolia estable se trata con anticoagulación. La trombólisis se reserva para el riesgo alto y el filtro, para la contraindicación absoluta de anticoagular.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Dosis","pregunta":"¿Con qué dosis de enoxaparina?","opciones":["1 mg/kg subcutánea cada 12 horas","40 mg subcutánea cada 24 horas","100 mg IV en bolo","0,5 mg/kg cada 48 horas"],"explicacion":"La dosis terapéutica es 1 mg/kg cada 12 horas (o 1,5 mg/kg cada 24 horas), ajustada a la función renal. 40 mg por día es la dosis profiláctica.","fuente":"ESC 2019, embolia pulmonar; ficha técnica de enoxaparina"},{"tipo":"Medidas generales","pregunta":"¿Cuánto dura la anticoagulación en esta paciente con cáncer activo?","opciones":["Al menos 3 a 6 meses, prolongándose mientras el cáncer esté activo","7 días","Solo durante la internación","De por vida en todos los casos sin reevaluar"],"explicacion":"Tras una embolia con factor transitorio quirúrgico se anticoagula al menos 3 meses, pero con cáncer activo se extiende y se reevalúa periódicamente.","fuente":"ESC 2019, embolia pulmonar"}]},{"id":"tep-02","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Embolia con hipotensión","vineta":"Varón de 64 años, 3 semanas después de una fractura de cadera. Disnea súbita, presión 78/50 mmHg pese a líquidos, ventrículo derecho dilatado en la ecografía. No operado recientemente ni con sangrado activo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene?","opciones":["Embolia pulmonar de riesgo alto","Riesgo intermedio-bajo","Riesgo bajo","No es embolia"],"explicacion":"La hipotensión persistente o el shock definen la embolia de riesgo alto, con mortalidad elevada a corto plazo.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Heparina no fraccionada y trombólisis sistémica","Solo heparina de bajo peso molecular","Aspirina","Diuréticos"],"explicacion":"En la embolia de riesgo alto sin contraindicación se indica trombólisis sistémica con heparina no fraccionada. Si está contraindicada o falla, embolectomía quirúrgica o tratamiento por catéter.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Dosis","pregunta":"¿Qué esquema de alteplasa?","opciones":["100 mg IV en 2 horas","10 mg IV en bolo único","1 g IV","100 mg IV en 24 horas"],"explicacion":"El esquema habitual es 100 mg de alteplasa en 2 horas; en el paro cardíaco se usa un esquema acelerado.","fuente":"ESC 2019, embolia pulmonar"}]},{"id":"arteria-01","tema":"Patología arterial periférica","anio":2,"titulo":"Dolor en la pantorrilla al caminar","vineta":"Varón de 64 años, fumador, hipertenso y dislipémico. Dolor en la pantorrilla derecha que aparece a las 3 cuadras y cede al detenerse. Pulsos femoral presente y poplíteo y distales ausentes. Índice tobillo-brazo 0,65.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Claudicación intermitente por arteriopatía periférica femoropoplítea","Estenosis del conducto lumbar","Isquemia crónica amenazante","Insuficiencia venosa"],"explicacion":"Dolor reproducible con el ejercicio que cede con el reposo, con índice tobillo-brazo menor de 0,9 y pulsos ausentes desde el poplíteo, es claudicación por arteriopatía. Sin dolor de reposo ni lesiones, no es amenazante.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica; Hermes: Enfermedad arterial periférica"},{"tipo":"Medidas generales","pregunta":"¿Qué indicación es la más eficaz para mejorar la distancia de marcha?","opciones":["Dejar de fumar y ejercicio supervisado (al menos 3 veces por semana durante 3 meses)","Reposo","Medias de compresión","Cirugía inmediata"],"explicacion":"El ejercicio supervisado mejora la distancia de marcha tanto como la revascularización en la claudicación, y dejar de fumar reduce la progresión y los eventos cardiovasculares.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento médico indicás para reducir eventos cardiovasculares?","opciones":["Antiagregante y estatina de alta intensidad","Anticoagulación con warfarina","Solo vasodilatadores","Ninguno"],"explicacion":"Todo paciente con arteriopatía sintomática recibe antiagregación (aspirina o clopidogrel), estatina de alta intensidad y control de la presión y la diabetes.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo revascularizás?","opciones":["Si la claudicación sigue limitando la vida pese a 3 meses de tratamiento óptimo","Ahora, siempre","Nunca en claudicantes","Solo con índice menor de 0,2"],"explicacion":"La claudicación se revasculariza solo si persiste la limitación con tratamiento médico y ejercicio, porque la amputación es rara en este estadio.","fuente":"ESC 2024 y ESVS 2024; Hermes: Enfermedad arterial periférica"}]},{"id":"arteria-02","tema":"Patología arterial periférica","anio":2,"titulo":"Pierna fría y dolorosa de golpe","vineta":"Mujer de 76 años con fibrilación auricular sin anticoagular. Dolor súbito en la pierna izquierda de 4 horas, pierna fría y pálida, sin pulso femoral, hipoestesia en el pie y movilidad de los dedos conservada.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y qué categoría de Rutherford?","opciones":["Isquemia aguda por embolia, categoría IIa (amenazada en forma marginal) o IIb","Isquemia crónica","Trombosis venosa profunda","Isquemia irreversible (III)"],"explicacion":"Dolor, palidez, ausencia de pulso y frialdad súbitos en una paciente con fibrilación auricular son embolia arterial. Con déficit sensitivo y motricidad conservada la extremidad está amenazada pero recuperable; la parálisis y el rigor serían irreversibles.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Fármaco","pregunta":"¿Qué indicás de inmediato?","opciones":["Heparina no fraccionada IV en bolo","Aspirina sola","Trombólisis sistémica","Esperar la angio-TC para iniciar tratamiento"],"explicacion":"Se anticoagula de inmediato con heparina IV para limitar la propagación del trombo, mientras se planifica la revascularización.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Revascularización urgente: embolectomía con catéter de Fogarty","Observación con heparina","Amputación primaria","Tratamiento médico y control ambulatorio"],"explicacion":"Una extremidad amenazada se revasculariza con urgencia; en una embolia femoral, la embolectomía con Fogarty es rápida y eficaz.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Técnica","pregunta":"Tras revascularizar, la pantorrilla está tensa y duele al estirar los dedos. ¿Qué hacés?","opciones":["Fasciotomía de los cuatro compartimentos de la pierna","Elevar y observar","Vendaje compresivo","Esperar la medición de presiones a las 24 horas"],"explicacion":"El síndrome compartimental por reperfusión se trata con fasciotomía completa de los cuatro compartimentos, sin esperar déficit motor ni ausencia de pulso.","fuente":"ESVS 2020; Hermes: Síndrome compartimental agudo de las extremidades"}]},{"id":"arteria-03","tema":"Patología arterial periférica","anio":2,"titulo":"Úlcera infectada en un pie diabético","vineta":"Varón de 68 años diabético. Úlcera plantar bajo la cabeza del primer metatarsiano con celulitis de 3 cm alrededor, sin signos sistémicos. La sonda toca hueso. Pulsos pedios ausentes, índice tobillo-brazo 0,6.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué problemas tiene que ordenar?","opciones":["Infección moderada con probable osteomielitis e isquemia","Úlcera neuropática pura sin infección","Celulitis leve sin isquemia","Gangrena seca"],"explicacion":"Celulitis de más de 2 cm o compromiso profundo define infección moderada; el contacto con hueso sugiere osteomielitis y el índice bajo indica isquemia. Hay que tratar las tres cosas.","fuente":"IWGDF/IDSA 2023, infección del pie diabético; Hermes: Pie diabético"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Radiografía del pie, cultivo de tejido profundo y evaluación vascular","Hisopado superficial de la úlcera","Solo un hemograma","Gammagrafía ósea como primer estudio"],"explicacion":"La radiografía busca osteomielitis y gas; el cultivo de tejido profundo o hueso (no el hisopado) orienta el antibiótico, y la evaluación vascular decide la revascularización.","fuente":"IWGDF/IDSA 2023"},{"tipo":"Medidas generales","pregunta":"¿Qué medida es indispensable para cicatrizar?","opciones":["Descarga efectiva de la presión plantar","Caminar normalmente","Reposo sin descarga","Apósitos especiales como única medida"],"explicacion":"Sin quitar la presión de la úlcera plantar no cicatriza; la descarga se adapta para que el paciente la cumpla.","fuente":"Hermes: Pie diabético"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés con la isquemia?","opciones":["Evaluar y revascularizar para permitir la cicatrización y salvar la extremidad","Amputación mayor directa","Solo antibióticos","Observar"],"explicacion":"Una úlcera con isquemia no cicatriza solo con antibióticos ni curaciones; la revascularización temprana mejora la cicatrización y el salvamento de la extremidad.","fuente":"IWGDF/IDSA 2023; Hermes: Isquemia crónica amenazante de la extremidad"}]},{"id":"mama-01","tema":"Patología mamaria","anio":2,"titulo":"Nódulo mamario en una mujer joven","vineta":"Mujer de 24 años con un nódulo de 2 cm en la mama derecha, móvil, elástico, indoloro, de bordes netos. Sin antecedentes familiares.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía mamaria","Mamografía","Resonancia","Biopsia quirúrgica directa"],"explicacion":"En mujeres menores de 30 a 35 años la ecografía es el estudio inicial por la densidad mamaria; la mamografía tiene baja sensibilidad a esa edad.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"La ecografía muestra un nódulo oval, circunscripto, paralelo a la piel. ¿Qué es lo más probable?","opciones":["Fibroadenoma (BI-RADS 3)","Carcinoma","Quiste complicado","Mastitis"],"explicacion":"Una lesión sólida oval, circunscripta y paralela a la piel en una mujer joven es típica de fibroadenoma, categoría probablemente benigna (BI-RADS 3).","fuente":"ACR BI-RADS; Hermes: Evaluación de la patología mamaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Control ecográfico a los 6 meses, o biopsia si crece o la paciente lo prefiere","Mastectomía","Resección urgente","Alta sin control"],"explicacion":"BI-RADS 3 tiene menos de 2 % de riesgo de malignidad y se controla a corto plazo. Se biopsia si crece, cambia o hay discordancia clínica.","fuente":"ACR BI-RADS"}]},{"id":"mama-02","tema":"Patología mamaria","anio":2,"titulo":"Nódulo sospechoso en una mujer de 56 años","vineta":"Mujer de 56 años con un nódulo de 1,8 cm en el cuadrante superoexterno derecho, duro e irregular. Mamografía: masa espiculada BI-RADS 5. Axila clínica y ecográficamente negativa.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo confirmás el diagnóstico?","opciones":["Biopsia con aguja gruesa guiada por imagen, con receptores y HER2","Biopsia escisional","Punción con aguja fina solamente","Resonancia sin biopsia"],"explicacion":"La biopsia con aguja gruesa confirma la invasión y da receptores hormonales y HER2, que definen el tratamiento antes de cualquier cirugía.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"Es un carcinoma ductal invasor, receptores positivos, HER2 negativo. ¿Qué cirugía indicás?","opciones":["Cirugía conservadora con biopsia de ganglio centinela y radioterapia posterior","Mastectomía radical modificada obligatoria","Vaciamiento axilar completo de entrada","Solo hormonoterapia"],"explicacion":"Un tumor de 1,8 cm en una mama de tamaño adecuado permite cirugía conservadora más radioterapia, con supervivencia equivalente a la mastectomía. La axila clínicamente negativa se estadifica con ganglio centinela.","fuente":"Hermes: Cáncer de mama; Cirugía axilar en cáncer de mama"},{"tipo":"Técnica","pregunta":"El ganglio centinela tiene metástasis en 1 de 2 ganglios. ¿Completás el vaciamiento?","opciones":["No: con cirugía conservadora, radioterapia y hasta 2 ganglios positivos, el ensayo Z0011 mostró que no hace falta","Sí, siempre","Sí, más mastectomía","Sí, más radioterapia axilar y vaciamiento"],"explicacion":"En el ACOSOG Z0011, en tumores T1-T2 con 1 o 2 ganglios centinela positivos tratados con cirugía conservadora y radioterapia, el vaciamiento no mejoró la supervivencia y aumentó el linfedema.","fuente":"Ensayo ACOSOG Z0011"}]},{"id":"trauma-04","tema":"Trauma avanzado","anio":2,"titulo":"Lesión esplénica en un paciente estable","vineta":"Varón de 25 años, caída de moto. Estable desde el ingreso. TC: laceración esplénica de 4 cm de profundidad (grado III de la AAST), sin extravasación de contraste ni otras lesiones.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué clase WSES tiene?","opciones":["Clase II (moderada): AAST III con estabilidad hemodinámica","Clase IV (grave)","Clase I","Clase III"],"explicacion":"WSES combina el grado anatómico con la hemodinamia: el grado III de la AAST en un paciente estable es clase II.","fuente":"WSES 2017, trauma esplénico; Hermes: Traumatismo esplénico"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Manejo no operatorio con vigilancia, con quirófano y angiografía disponibles","Esplenectomía","Esplenorrafia de rutina","Alta con control ambulatorio"],"explicacion":"El paciente estable sin otra indicación de laparotomía se maneja sin operar, siempre que haya vigilancia, controles seriados y capacidad de rescate.","fuente":"WSES 2017, trauma esplénico"},{"tipo":"Medidas generales","pregunta":"¿Qué controles hacés?","opciones":["Examen y hemoglobina seriados y reposo relativo las primeras horas","Ninguno","TC cada 6 horas","Laparoscopia diagnóstica"],"explicacion":"Se vigilan los signos vitales, el abdomen y la hemoglobina; ante deterioro se considera angioembolización o cirugía.","fuente":"WSES 2017, trauma esplénico"},{"tipo":"Fármaco","pregunta":"Si terminara esplenectomizado, ¿qué vacunas indicás?","opciones":["Neumococo, meningococo y Haemophilus influenzae b","Solo antigripal","Ninguna","BCG"],"explicacion":"La asplenia aumenta el riesgo de sepsis fulminante por gérmenes encapsulados; se vacuna contra neumococo, meningococo y Haemophilus, idealmente a partir de las 2 semanas de la cirugía, más antigripal anual.","fuente":"WSES 2017, trauma esplénico"}]},{"id":"trauma-05","tema":"Trauma avanzado","anio":2,"titulo":"Fractura de pelvis en libro abierto","vineta":"Mujer de 45 años atropellada. Presión 75/40 mmHg pese a 1 litro de cristaloides. Dolor pélvico, radiografía con diástasis de la sínfisis (libro abierto). FAST negativo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿De dónde sangra probablemente?","opciones":["De la pelvis (plexos venosos y fracturas, a veces arterias)","Del abdomen","Del tórax","No hay sangrado"],"explicacion":"Con FAST negativo y fractura en libro abierto, el shock es probablemente pélvico; el sangrado es mayormente venoso y óseo.","fuente":"WSES 2017, trauma pélvico; Hermes: Trauma pélvico"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés de inmediato?","opciones":["Colocar una faja pélvica a la altura de los trocánteres y transfundir con protocolo de transfusión masiva","Laparotomía exploradora","TC de pelvis antes de cualquier medida","Colocar sonda vesical"],"explicacion":"La faja pélvica reduce el volumen pélvico y el sangrado; se coloca sobre los trocánteres mayores. Se transfunde de forma balanceada y precoz.","fuente":"WSES 2017, trauma pélvico"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste inestable. ¿Qué opciones tenés?","opciones":["Packing preperitoneal y fijación externa, y angioembolización si hay sangrado arterial","Esperar 24 horas","Solo más cristaloides","Laparotomía con exploración del hematoma pélvico"],"explicacion":"En el inestable se combinan el packing preperitoneal, la fijación mecánica y la angioembolización según disponibilidad. Abrir el hematoma pélvico por laparotomía empeora el sangrado.","fuente":"WSES 2017, trauma pélvico"},{"tipo":"Medidas generales","pregunta":"Hay sangre en el meato uretral. ¿Colocás una sonda vesical?","opciones":["No sin antes estudiar la uretra (uretrografía retrógrada)","Sí, de inmediato","Sí, con fuerza si encuentra resistencia","Nunca se coloca sonda en trauma"],"explicacion":"La sangre en el meato con fractura pélvica sugiere lesión uretral; una sonda a ciegas puede completar una sección parcial. Se estudia primero y, si hay lesión, se coloca una cistostomía.","fuente":"WSES 2017, trauma pélvico"}]},{"id":"trauma-06","tema":"Trauma avanzado","anio":2,"titulo":"Lesión hepática con respuesta transitoria","vineta":"Varón de 30 años con trauma cerrado. Laceración hepática grado IV en la TC con extravasación de contraste arterial. Respondió a 2 unidades de sangre y se mantiene estable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Angioembolización, manteniendo el manejo no operatorio si sigue estable","Hepatectomía derecha de urgencia","Solo observación sin hacer nada con la extravasación","Alta en 24 horas"],"explicacion":"En el estable, el grado no obliga a operar. La extravasación arterial en el adulto puede tratarse con angioembolización dentro del manejo no operatorio.","fuente":"WSES 2020, trauma hepático; Hermes: Trauma hepático"},{"tipo":"Conducta quirúrgica","pregunta":"Se descompensa y lo llevás a quirófano con hemorragia hepática masiva. ¿Qué hacés primero?","opciones":["Compresión manual y packing perihepático, con maniobra de Pringle","Hepatectomía reglada inmediata","Ligadura de la vena cava","Sutura de todas las laceraciones"],"explicacion":"El control de daños hepático empieza por compresión, packing y Pringle para controlar el flujo. Las resecciones regladas en un paciente en shock aumentan la mortalidad.","fuente":"WSES 2020, trauma hepático; Hermes: Trauma hepático"},{"tipo":"Medidas generales","pregunta":"¿Qué complicaciones tardías vigilás?","opciones":["Biliomas, fístula biliar, hemobilia y pseudoaneurismas","Pancreatitis aguda","Úlcera duodenal","Ninguna"],"explicacion":"Las lesiones de alto grado pueden complicarse con colecciones biliares, hemobilia o pseudoaneurismas, que se manejan con drenaje, CPRE o embolización.","fuente":"Hermes: Trauma hepático"}]},{"id":"panc-02","tema":"Pancreatitis aguda","anio":2,"titulo":"Necrosis infectada a las 5 semanas","vineta":"Varón de 50 años con pancreatitis necrotizante hace 5 semanas. Fiebre y deterioro clínico. TC: necrosis encapsulada de 12 cm retrogástrica con burbujas de gas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Necrosis encapsulada infectada","Pseudoquiste no infectado","Colección aguda peripancreática","Absceso hepático"],"explicacion":"Después de 4 semanas, una colección con pared y contenido necrótico es necrosis encapsulada; el gas en su interior con deterioro clínico indica infección.","fuente":"Atlanta revisada; Hermes: Pancreatitis aguda necrotizante"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás?","opciones":["Un carbapenémico, ajustando luego por cultivo","Ninguno","Cefalexina","Ampicilina sola"],"explicacion":"Ante infección de la necrosis se indican antibióticos que penetren el páncreas, como los carbapenémicos, ajustados a los cultivos obtenidos al drenar.","fuente":"WSES 2019, pancreatitis grave"},{"tipo":"Dosis","pregunta":"¿Qué dosis de meropenem?","opciones":["1 g IV cada 8 horas","1 g VO cada 24 horas","100 mg IV cada 12 horas","6 g IV en bolo"],"explicacion":"La dosis de meropenem en infección intraabdominal es 1 g IV cada 8 horas, ajustada a la función renal.","fuente":"SIS/IDSA 2010, tabla de dosis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Abordaje escalonado: drenaje endoscópico transgástrico o percutáneo, y necrosectomía mínimamente invasiva si no mejora","Necrosectomía abierta de entrada","Solo antibióticos indefinidamente","Pancreatectomía total"],"explicacion":"En los ensayos PANTER y TENSION, el abordaje escalonado redujo las complicaciones mayores frente a la necrosectomía abierta. Una colección retrogástrica es ideal para el drenaje endoscópico.","fuente":"Ensayos PANTER y TENSION; WSES 2019"}]},{"id":"panc-03","tema":"Pancreatitis crónica","anio":2,"titulo":"Dolor y diarrea grasa en un bebedor","vineta":"Varón de 48 años con consumo de alcohol de 20 años y tabaquismo. Dolor epigástrico recurrente, pérdida de peso y deposiciones voluminosas, grasas y malolientes. TC: calcificaciones pancreáticas y Wirsung de 9 mm con litiasis cefálica.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Pancreatitis crónica calcificante con insuficiencia exocrina","Pancreatitis aguda recurrente sin cronicidad","Cáncer de páncreas seguro","Síndrome de intestino irritable"],"explicacion":"Calcificaciones, dilatación ductal y esteatorrea en un bebedor indican pancreatitis crónica con insuficiencia exocrina. Hay que excluir cáncer si aparece una masa o cambia el cuadro.","fuente":"Hermes: Pancreatitis crónica"},{"tipo":"Medidas generales","pregunta":"¿Qué medida es fundamental?","opciones":["Abstinencia total de alcohol y tabaco","Dieta sin grasas absoluta","Ayuno prolongado","Solo analgésicos"],"explicacion":"Dejar el alcohol y el tabaco reduce los episodios de dolor y la progresión. La dieta no debe ser pobre en grasas si se reemplazan las enzimas.","fuente":"UEG HaPanEU 2017, pancreatitis crónica; Hermes: Pancreatitis crónica"},{"tipo":"Fármaco","pregunta":"¿Qué indicás para la esteatorrea?","opciones":["Enzimas pancreáticas con las comidas","Loperamida","Antibióticos","Inhibidor de bomba como único tratamiento"],"explicacion":"La insuficiencia exocrina se trata con enzimas pancreáticas gastrorresistentes tomadas con las comidas.","fuente":"UEG HaPanEU 2017, pancreatitis crónica"},{"tipo":"Dosis","pregunta":"¿Qué dosis inicial de lipasa?","opciones":["40.000 a 50.000 unidades con cada comida principal y la mitad con las colaciones","1.000 unidades por día","500.000 unidades en ayunas","10.000 unidades por semana"],"explicacion":"La dosis inicial recomendada es de 40.000 a 50.000 unidades de lipasa en cada comida principal y la mitad en las colaciones, ajustando según la respuesta.","fuente":"UEG HaPanEU 2017, pancreatitis crónica"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste el dolor pese al tratamiento médico. ¿Qué indicás con Wirsung dilatado y litiasis?","opciones":["Cirugía de drenaje temprana (Partington-Rochelle o Frey según la cabeza) o endoscopia en centros con experiencia","Pancreatectomía total de entrada","Más opioides indefinidamente","Esperar 10 años"],"explicacion":"Con Wirsung dilatado y dolor, el drenaje está indicado; en el ensayo ESCAPE, la cirugía temprana alivió mejor el dolor que el escalonamiento endoscópico. Con masa cefálica se prefiere Frey o Beger.","fuente":"Ensayo ESCAPE; Hermes: Derivación del Wirsung en pancreatitis crónica"}]},{"id":"pared-03","tema":"Eventraciones","anio":2,"titulo":"Eventración irreductible con vómitos","vineta":"Mujer de 70 años con eventración mediana conocida, irreductible y dolorosa desde hace 10 horas, con vómitos. Estable, qSOFA negativo. TC: defecto de 5 cm con asa de delgado incarcerada sin signos de isquemia.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Cirugía urgente con evaluación del asa y reparación del defecto","Reducción manual forzada y alta","Observación 48 horas","Cirugía programada en 2 meses"],"explicacion":"Una eventración irreductible con oclusión se opera de urgencia para evaluar el intestino y reparar el defecto.","fuente":"EHS 2026, hernia ventral de urgencia; Hermes: Hernia ventral complicada y de urgencia"},{"tipo":"Técnica","pregunta":"El asa es viable, sin resección y sin contaminación. ¿Cómo reparás?","opciones":["Malla sintética permanente macroporosa en posición onlay, con cierre del defecto","Sutura simple","Malla biológica obligatoria","Dejar el defecto abierto"],"explicacion":"EHS 2026 sugiere reparar con malla en lugar de sutura en el defecto cerrable, y en urgencia prefiere la malla sintética macroporosa en onlay frente al plano retromuscular.","fuente":"EHS 2026, hernia ventral de urgencia"},{"tipo":"Conducta quirúrgica","pregunta":"Si el defecto midiera 14 cm y no pudiera cerrarse sin separación de componentes, ¿qué harías?","opciones":["Cerrar la cavidad (sin reconstrucción compleja) y derivar para una reparación planificada","Separación de componentes en la urgencia","Abdomen abierto de rutina","Malla puente intraperitoneal permanente"],"explicacion":"Ante un defecto no cerrable, EHS 2026 sugiere diferir la reconstrucción, cerrar la cavidad (piel, saco o malla absorbible) y derivar a un centro experto.","fuente":"EHS 2026, hernia ventral de urgencia"}]},{"id":"biliar-08","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Sepsis en un paciente de terapia intensiva","vineta":"Varón de 70 años en terapia intensiva por un politraumatismo hace 10 días, con nutrición parenteral. Fiebre y aumento de los requerimientos de vasopresor sin otro foco. Ecografía: vesícula distendida sin cálculos, pared de 6 mm, líquido perivesicular.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Colecistitis alitiásica","Colecistitis litiásica","Colangitis","Hallazgo normal en terapia intensiva"],"explicacion":"En el paciente crítico (trauma, quemaduras, ayuno, nutrición parenteral, vasopresores), la sepsis sin otro foco con vesícula distendida y alterada sugiere colecistitis alitiásica. La pared engrosada aislada no alcanza para el diagnóstico.","fuente":"Hermes: Colecistitis alitiásica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás en este paciente inestable?","opciones":["Colecistostomía percutánea","Colecistectomía abierta inmediata","Solo antibióticos","CPRE"],"explicacion":"En el paciente inestable la colecistostomía drena el foco con poco riesgo. La colecistectomía es definitiva cuando la fisiología lo permite.","fuente":"Hermes: Colecistitis alitiásica y Drenaje de la vesícula biliar"},{"tipo":"Medidas generales","pregunta":"No mejora a las 48 horas del drenaje. ¿Qué hacés?","opciones":["Buscar necrosis o perforación vesicular u otro foco, y considerar la cirugía","Esperar una semana más","Retirar el drenaje","Cambiar solo el antibiótico"],"explicacion":"El drenaje no corrige una vesícula necrótica o perforada; si no hay mejoría hay que reevaluar con imagen y considerar la colecistectomía.","fuente":"Hermes: Colecistitis alitiásica"}]},{"id":"vb-06","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Colecistitis con ictericia y un cálculo en el bacinete","vineta":"Mujer de 58 años con colecistitis crónica reagudizada e ictericia (bilirrubina 4 mg/dl). La colangiorresonancia muestra un cálculo impactado en el bacinete que comprime el hepático común desde afuera, sin litiasis coledociana.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Síndrome de Mirizzi","Coledocolitiasis","Colangiocarcinoma hiliar","Colangitis esclerosante"],"explicacion":"La compresión extrínseca del hepático común por un cálculo impactado en el bacinete o el cístico, con ictericia, define el Mirizzi. Si hay erosión de la pared y fístula colecistobiliar, se clasifica en tipos más avanzados.","fuente":"Hermes: Síndrome de Mirizzi"},{"tipo":"Conducta quirúrgica","pregunta":"En la cirugía encontrás inflamación densa del triángulo hepatocístico sin poder lograr la visión crítica. ¿Qué hacés?","opciones":["Colecistectomía subtotal (o conversión), sin disecar el triángulo a ciegas","Seguir disecando hasta encontrar el cístico","Seccionar la estructura tubular más gruesa","Abandonar la cirugía sin hacer nada"],"explicacion":"En el Mirizzi el hepático común está pegado al bacinete y es fácil lesionarlo. Sin visión crítica se recurre a una estrategia de rescate: colecistectomía subtotal, conversión o, en tipos con fístula, reparación de la vía biliar.","fuente":"SAGES Safe Cholecystectomy; Hermes: Síndrome de Mirizzi y Colecistectomía subtotal"},{"tipo":"Técnica","pregunta":"Si hubiera una fístula que comprometa más de la mitad de la circunferencia del hepático, ¿qué reparación es la habitual?","opciones":["Anastomosis biliodigestiva (hepaticoyeyunostomía en Y de Roux)","Sutura primaria sin tubo","Ligadura del hepático","Solo drenaje subhepático"],"explicacion":"Las fístulas grandes dejan un defecto que no se cierra sin estenosis; la reconstrucción con hepaticoyeyunostomía es la opción habitual. Los defectos pequeños pueden cerrarse sobre un tubo o con un colgajo de vesícula.","fuente":"Hermes: Síndrome de Mirizzi; Técnica de la anastomosis biliodigestiva"}]},{"id":"lap-01","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Neumoperitoneo en un paciente con cirugías previas","vineta":"Varón de 55 años con laparotomía mediana previa por una perforación. Se programa colecistectomía laparoscópica por litiasis sintomática.","pasos":[{"tipo":"Técnica","pregunta":"¿Cómo hacés el acceso inicial?","opciones":["Técnica abierta de Hasson o acceso por el punto de Palmer, lejos de la cicatriz","Aguja de Veress en el ombligo a ciegas","Trocar óptico directo sobre la cicatriz","No se puede operar por laparoscopia"],"explicacion":"Con cirugía previa hay riesgo de adherencias bajo la cicatriz; se entra con técnica abierta o en un sitio alejado, como el cuadrante superior izquierdo (punto de Palmer).","fuente":"Hermes: Neumoperitoneo con técnica abierta de Hasson; Principios de cirugía laparoscópica"},{"tipo":"Medidas generales","pregunta":"¿Con qué presión de neumoperitoneo trabajás habitualmente?","opciones":["12 a 15 mmHg","25 a 30 mmHg","2 a 4 mmHg","40 mmHg"],"explicacion":"Entre 12 y 15 mmHg se logra espacio de trabajo con repercusión hemodinámica y respiratoria tolerable; presiones mayores reducen el retorno venoso y la ventilación.","fuente":"Hermes: Principios de cirugía laparoscópica"},{"tipo":"Diagnóstico","pregunta":"Al insuflar cae bruscamente la capnografía, hay hipotensión y un soplo en rueda de molino. ¿Qué sospechás?","opciones":["Embolia gaseosa de CO2","Neumotórax a tensión","Reacción alérgica","Hipotermia"],"explicacion":"La caída del CO2 espirado con colapso hemodinámico y soplo en rueda de molino al insuflar indican embolia gaseosa: se suspende la insuflación, se desinfla, se coloca al paciente en decúbito lateral izquierdo con Trendelenburg y se ventila con oxígeno al 100 %.","fuente":"Hermes: Principios de cirugía laparoscópica"}]},{"id":"lap-02","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Identificación segura antes de clipar","vineta":"Colecistectomía laparoscópica programada en una mujer de 45 años. Disecaste el triángulo hepatocístico.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué tres criterios definen la visión crítica de seguridad?","opciones":["Triángulo hepatocístico libre de grasa y tejido, tercio inferior de la vesícula separado del lecho y solo dos estructuras entrando en la vesícula","Ver el colédoco, el hepático y la arteria hepática","Colangiografía normal, cístico corto y arteria única","Vesícula vacía, cístico clipado y lecho seco"],"explicacion":"La visión crítica de Strasberg tiene tres criterios; se documenta con foto o video antes de clipar. Su objetivo es evitar la falsa identificación del colédoco como cístico.","fuente":"SAGES Safe Cholecystectomy; Hermes: Prevención de lesiones durante la colecistectomía"},{"tipo":"Estudios","pregunta":"La anatomía sigue dudosa. ¿Qué podés agregar para aclararla?","opciones":["Colangiografía intraoperatoria o fluorescencia con verde de indocianina","Ecografía abdominal de control al día siguiente","TC intraoperatoria","Nada; clipar igual"],"explicacion":"Cuando la anatomía no es clara, la colangiografía o la fluorescencia ayudan a identificar los conductos. No sustituyen la visión crítica pero suman información.","fuente":"Hermes: Colangiografía peroperatoria por fluoroscopia y Colangiografía fluorescente con indocianina verde"},{"tipo":"Conducta quirúrgica","pregunta":"Si aun así no lográs la visión crítica, ¿qué hacés?","opciones":["Estrategia de rescate: colecistectomía subtotal, colecistostomía o conversión","Clipar la estructura que parece el cístico","Seguir disecando sin límite de tiempo","Seccionar todo lo que entra en la vesícula"],"explicacion":"Las estrategias de rescate evitan la lesión biliar cuando el triángulo es inseguro. Convertir no siempre resuelve el problema; la subtotal es muchas veces la opción más segura.","fuente":"SAGES Safe Cholecystectomy; Hermes: Colecistectomía subtotal"}]},{"id":"lesbil-01","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"Bilis por el drenaje al segundo día","vineta":"Mujer de 50 años en el día 2 de una colecistectomía laparoscópica. Por el drenaje salen 300 ml/día de bilis. Afebril, sin ictericia, abdomen blando. La colangiorresonancia muestra una vía biliar continua y sin estenosis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué lesión es la más probable?","opciones":["Fuga del muñón cístico o de un conducto de Luschka (Strasberg A)","Sección completa del colédoco (E)","Ligadura del hepático (E2)","Lesión lateral del hepático con estenosis (D)"],"explicacion":"Una fuga con vía biliar continua y sin estenosis es una lesión menor, generalmente del muñón cístico o de un conducto accesorio del lecho.","fuente":"WSES 2020, lesión biliar; Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Conducta quirúrgica","pregunta":"La fuga no disminuye. ¿Qué indicás?","opciones":["CPRE con esfinterotomía y prótesis biliar","Hepaticoyeyunostomía","Relaparotomía y sutura del colédoco","Retirar el drenaje"],"explicacion":"La CPRE baja la presión de la vía biliar y la fuga cierra en la gran mayoría; si hay una colección sin drenaje, se drena por vía percutánea.","fuente":"WSES 2020, lesión biliar"}]},{"id":"lesbil-02","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"Ictericia progresiva y clips sobre el hepático","vineta":"Varón de 42 años, 5 días después de una colecistectomía laparoscópica dificultosa. Ictericia progresiva (bilirrubina 8 mg/dl), fiebre y dolor. Ecografía: vía biliar intrahepática dilatada y colección subhepática. Colangiorresonancia: interrupción completa del hepático común a 2 cm de la confluencia.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tipo de lesión es?","opciones":["Lesión mayor, Strasberg E (tipo E2 por el nivel)","Lesión menor tipo A","Lesión tipo D lateral","Coledocolitiasis residual"],"explicacion":"La pérdida de continuidad de la vía principal es una lesión tipo E; el subtipo depende de la distancia a la confluencia (E1 más de 2 cm, E2 menos de 2 cm).","fuente":"Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés primero?","opciones":["Controlar la sepsis: drenaje percutáneo de la colección y de la vía biliar, antibióticos y soporte","Hepaticoyeyunostomía inmediata en el hospital donde ocurrió","Observar","Colocar una prótesis por CPRE para unir los extremos"],"explicacion":"Pasadas las primeras 72 horas, con colección e infección, primero se controla la sepsis y se define la anatomía; la reparación se hace con los tejidos en condiciones y por un equipo con experiencia.","fuente":"WSES 2020, lesión biliar; Hermes: Manejo percutáneo de la lesión biliar iatrogénica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es la reparación definitiva?","opciones":["Hepaticoyeyunostomía en Y de Roux, en un centro con experiencia","Anastomosis terminoterminal del colédoco","Coledocoduodenostomía","Prótesis biliar permanente"],"explicacion":"La hepaticoyeyunostomía en Y de Roux, con mucosa sana y sin tensión, es la reparación estándar de las lesiones tipo E; la anastomosis terminoterminal tiene alta tasa de estenosis.","fuente":"WSES 2020, lesión biliar; Hermes: Hepaticoyeyunostomía"},{"tipo":"Estudios","pregunta":"¿Qué estudio agregás antes de reparar?","opciones":["Evaluación de la arteria hepática derecha (angio-TC)","Endoscopia digestiva alta","Colonoscopia","Gammagrafía ósea"],"explicacion":"La lesión combinada de la arteria hepática derecha es frecuente en las lesiones altas y condiciona el nivel de la reconstrucción.","fuente":"Hermes: Lesión de la vía biliar principal en colecistectomía"}]},{"id":"tiroides-01","tema":"Patología tiroidea","anio":3,"titulo":"Nódulo tiroideo en una ecografía","vineta":"Mujer de 45 años con un nódulo tiroideo de 1,8 cm, sólido, hipoecoico, con microcalcificaciones y bordes irregulares. TSH normal. Sin adenopatías palpables.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["Punción con aguja fina guiada por ecografía","Centellograma tiroideo","Tiroidectomía directa","Control ecográfico en 2 años"],"explicacion":"Un nódulo sólido hipoecoico con microcalcificaciones y bordes irregulares es de alta sospecha; se punza desde 1 cm. El centellograma solo se pide con TSH baja.","fuente":"ATA 2015, nódulo tiroideo; Hermes: Nódulo tiroideo"},{"tipo":"Diagnóstico","pregunta":"La citología es Bethesda VI. ¿Qué significa?","opciones":["Maligno (habitualmente carcinoma papilar)","Benigno","No diagnóstico","Atipia de significado incierto"],"explicacion":"Bethesda VI es maligno, con más del 95 % de riesgo; la mayoría corresponde a carcinoma papilar.","fuente":"Sistema Bethesda; Hermes: Nódulo tiroideo"},{"tipo":"Estudios","pregunta":"¿Qué estudio hacés antes de operar?","opciones":["Ecografía de los compartimentos ganglionares central y lateral del cuello","PET-TC de rutina","Tiroglobulina para diagnóstico","Centellograma corporal total"],"explicacion":"La ecografía cervical preoperatoria busca metástasis ganglionares que cambiarían la extensión de la cirugía.","fuente":"ATA 2015, cáncer diferenciado de tiroides"},{"tipo":"Conducta quirúrgica","pregunta":"Es un tumor de 1,8 cm sin extensión extratiroidea ni ganglios. ¿Qué cirugía es aceptable?","opciones":["Lobectomía o tiroidectomía total, decidida con la paciente","Solo tiroidectomía total con vaciamiento central y lateral","Enucleación del nódulo","Observación obligatoria"],"explicacion":"Para tumores de 1 a 4 cm sin extensión extratiroidea ni ganglios, ATA 2015 acepta tanto la lobectomía como la tiroidectomía total; el vaciamiento se reserva para ganglios comprometidos.","fuente":"ATA 2015, cáncer diferenciado de tiroides"}]},{"id":"tiroides-02","tema":"Patología tiroidea","anio":3,"titulo":"Hormigueos después de una tiroidectomía total","vineta":"Mujer de 40 años en el primer día de una tiroidectomía total por bocio. Refiere parestesias peribucales y en los dedos. Signo de Chvostek positivo. Calcio total 7,0 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hipocalcemia por hipoparatiroidismo posoperatorio","Lesión del nervio laríngeo recurrente","Crisis tirotóxica","Hematoma cervical"],"explicacion":"Parestesias, Chvostek positivo y calcio bajo tras una tiroidectomía total indican hipoparatiroidismo, por lesión o desvascularización de las paratiroides.","fuente":"Hermes: Tiroidectomía"},{"tipo":"Fármaco","pregunta":"Con síntomas y calcio de 7 mg/dl, ¿qué indicás?","opciones":["Gluconato de calcio IV","Solo calcio oral","Levotiroxina","Furosemida"],"explicacion":"La hipocalcemia sintomática o grave se trata con calcio IV y monitoreo electrocardiográfico; luego se pasa a calcio oral con calcitriol.","fuente":"Society for Endocrinology 2016, hipocalcemia aguda"},{"tipo":"Dosis","pregunta":"¿Con qué dosis inicial?","opciones":["10 a 20 ml de gluconato de calcio al 10 % diluidos, en unos 10 minutos","100 ml al 10 % en bolo rápido","1 ml por vía subcutánea","500 mg por vía oral"],"explicacion":"Se administran 10 a 20 ml de gluconato de calcio al 10 % en 50 a 100 ml de dextrosa al 5 % en unos 10 minutos, con monitoreo, seguido de una infusión si persiste.","fuente":"Society for Endocrinology 2016, hipocalcemia aguda"},{"tipo":"Medidas generales","pregunta":"Para el alta, ¿qué indicás?","opciones":["Calcio oral más calcitriol, con control del calcio y de la PTH","Nada","Solo dieta rica en lácteos","Vitamina D en dosis única de por vida"],"explicacion":"El hipoparatiroidismo posoperatorio se maneja con calcio oral y calcitriol; la mayoría es transitorio, y se define como permanente si persiste más de 6 a 12 meses.","fuente":"Hermes: Tiroidectomía"}]},{"id":"tiroides-03","tema":"Patología tiroidea","anio":3,"titulo":"Enfermedad de Graves para cirugía","vineta":"Mujer de 30 años con enfermedad de Graves, bocio grande y oftalmopatía moderada. Recibe metimazol y está eutiroidea. Se decide tiroidectomía total.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué agregás en los días previos a la cirugía?","opciones":["Yoduro de potasio (solución de Lugol o SSKI)","Levotiroxina","Iodo radiactivo","Corticoides en dosis altas"],"explicacion":"En la enfermedad de Graves, el yoduro preoperatorio reduce la vascularización de la glándula y el sangrado intraoperatorio.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Lugol 5 a 7 gotas (o SSKI 1 a 2 gotas) 3 veces por día durante 10 días antes de la cirugía","1 gota por semana durante 3 meses","Una dosis única el día de la cirugía","50 gotas por día durante 2 días"],"explicacion":"ATA 2016 indica Lugol 5 a 7 gotas o SSKI 1 a 2 gotas tres veces por día, diluidas en agua o jugo, durante 10 días antes de la operación.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Tiroidectomía total","Lobectomía unilateral","Tiroidectomía subtotal bilateral","Istmectomía"],"explicacion":"En la enfermedad de Graves se prefiere la tiroidectomía total, porque elimina el riesgo de recurrencia con complicaciones similares a la subtotal.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Dosis","pregunta":"Después, ¿con qué dosis inicial de levotiroxina la reemplazás?","opciones":["Alrededor de 1,6 µg/kg/día, ajustando por TSH a las 6 a 8 semanas","10 µg/kg/día","25 µg por semana","No necesita reemplazo"],"explicacion":"La dosis de reemplazo completa es cercana a 1,6 µg/kg/día; se ajusta con la TSH a las 6 a 8 semanas.","fuente":"ATA 2016, hipertiroidismo"}]},{"id":"ulcera-01","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Melena y un coágulo en la úlcera","vineta":"Varón de 67 años que toma ibuprofeno por artrosis. Melena e hipotensión que responde a cristaloides. Hemoglobina 7,8 g/dl. Endoscopia a las 12 horas: úlcera bulbar posterior de 1,5 cm con vaso visible no sangrante.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué clasificación de Forrest tiene?","opciones":["Forrest IIa (vaso visible)","Forrest Ia","Forrest IIc","Forrest III"],"explicacion":"El vaso visible no sangrante es Forrest IIa, de alto riesgo de resangrado, por lo que requiere tratamiento endoscópico.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa; Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Medidas generales","pregunta":"¿Con qué umbral transfundís glóbulos rojos?","opciones":["Hemoglobina menor de 7 g/dl (8 si hay enfermedad cardiovascular)","Hemoglobina menor de 10 g/dl siempre","Nunca","Solo si la hemoglobina es menor de 5"],"explicacion":"La estrategia restrictiva, con umbral de 7 g/dl y objetivo de 7 a 9, reduce la mortalidad y el resangrado; en cardiópatas se usa un umbral más alto.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Fármaco","pregunta":"Después de la terapia endoscópica, ¿qué indicás?","opciones":["Inhibidor de la bomba de protones en dosis altas","Antiácidos","Bloqueante H2 en dosis bajas","Ninguno"],"explicacion":"Tras la hemostasia endoscópica de una úlcera de alto riesgo, el inhibidor de bomba en dosis altas reduce el resangrado.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Bolo IV de 80 mg y luego 8 mg/h (o bolos intermitentes en dosis altas) durante 72 horas","20 mg VO por día","40 mg IV por semana","80 mg IV dosis única"],"explicacion":"El esquema es un bolo de 80 mg seguido de infusión de 8 mg/h o bolos intermitentes en dosis altas durante 72 horas, y luego dos dosis diarias por vía oral.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Conducta quirúrgica","pregunta":"Resangra y falla una segunda endoscopia. ¿Qué hacés?","opciones":["Angioembolización transarterial o cirugía (duodenotomía con ligadura del vaso)","Tercera endoscopia de rutina","Más inhibidor de bomba","Transfundir y esperar"],"explicacion":"Si falla el segundo intento endoscópico, la embolización de la gastroduodenal o la cirugía con ligadura del vaso son las opciones de rescate.","fuente":"ESGE 2021; Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Fármaco","pregunta":"La biopsia muestra Helicobacter pylori. ¿Qué tratamiento de erradicación indicás donde no se conoce la resistencia a la claritromicina?","opciones":["Cuádruple con bismuto (inhibidor de bomba, bismuto, tetraciclina y metronidazol) durante 14 días","Triple con claritromicina durante 7 días","Amoxicilina sola","Solo inhibidor de bomba"],"explicacion":"Maastricht VI recomienda la cuádruple con bismuto durante 14 días cuando la resistencia a la claritromicina es alta o desconocida, y confirmar la erradicación con prueba de aliento.","fuente":"Maastricht VI/Florence 2022"}]},{"id":"ulcera-02","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Úlcera gástrica que no cicatriza","vineta":"Varón de 60 años con una úlcera de 2 cm en la curvatura menor del antro. Erradicó H. pylori y recibió inhibidor de bomba 12 semanas, pero la úlcera persiste. Las biopsias fueron negativas.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué hacés antes de decidir la cirugía?","opciones":["Repetir la endoscopia con biopsias múltiples para descartar cáncer","Operar sin más estudios","Suspender el tratamiento","Una TC alcanza"],"explicacion":"Toda úlcera gástrica refractaria obliga a repetir las biopsias, porque puede ser un cáncer; también se revisan el consumo de AINE y la erradicación.","fuente":"Hermes: Enfermedad ulcerosa péptica"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste refractaria y benigna. ¿Qué cirugía indicás?","opciones":["Gastrectomía distal incluyendo la úlcera, con reconstrucción tipo Billroth I o Y de Roux","Vagotomía troncular sola","Gastrectomía total","Fundoplicatura"],"explicacion":"La úlcera gástrica refractaria se reseca con una gastrectomía distal que la incluya; así se trata y se obtiene diagnóstico histológico completo.","fuente":"Hermes: Gastrectomía; Reconstrucción después de gastrectomía"},{"tipo":"Diagnóstico","pregunta":"Meses después tiene sudoración, palpitaciones y diarrea a los 20 minutos de comer. ¿Qué es?","opciones":["Síndrome de dumping temprano","Dumping tardío por hipoglucemia","Síndrome del asa aferente","Úlcera de la boca anastomótica"],"explicacion":"Los síntomas vasomotores y digestivos en los primeros 30 minutos se deben al
