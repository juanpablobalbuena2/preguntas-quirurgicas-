019, enfermedad pilonidal; Hermes: Quiste pilonidal"},{"tipo":"Medidas generales","pregunta":"¿Qué medida puede reducir la recurrencia?","opciones":["Depilación de la región e higiene del pliegue","Reposo prolongado y evitar estar sentado","Antibióticos profilácticos en ciclos mensuales","Dieta hipograsa y descenso de peso estricto"],"explicacion":"Eliminar el pelo de la zona reduce la recurrencia después del tratamiento.","fuente":"ASCRS 2019, enfermedad pilonidal"}]},{"id":"hernia-04","tema":"Hernias recidivadas","anio":2,"titulo":"Recurrencia tras un Lichtenstein","vineta":"Varón de 62 años operado con técnica de Lichtenstein hace 3 años. Presenta recurrencia inguinal derecha sintomática y reducible.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué pedís antes de operar?","opciones":["El protocolo quirúrgico de la operación anterior","Una TC de abdomen y pelvis de rutina","Una resonancia dinámica de la región inguinal con maniobra de Valsalva","Una ecografía para medir el defecto"],"explicacion":"Saber qué técnica, plano y malla se usaron orienta la vía de reparación y ayuda a entender el mecanismo de la falla.","fuente":"Hermes: Hernia inguinal recurrente"},{"tipo":"Conducta quirúrgica","pregunta":"¿Por qué vía la reparás?","opciones":["Posterior (TEP o TAPP), por un plano no operado","Anterior otra vez, con una malla más grande","Shouldice para evitar otra malla","Observación, porque recidivó una vez"],"explicacion":"Se prefiere el plano virgen: posterior tras una reparación anterior y anterior tras una posterior. Así se evita disecar tejido cicatricial con malla.","fuente":"HerniaSurge; Hermes: Hernia inguinal recurrente"},{"tipo":"Medidas generales","pregunta":"¿Cuándo derivarías a un centro especializado?","opciones":["Multirrecurrencia, ambos planos operados o infección de malla","En la primera recurrencia, aunque sea simple, reducible y por un solo plano","Cuando el defecto mida más de 1 cm en la ecografía","Cuando el paciente prefiera operarse en otro hospital"],"explicacion":"Las recurrencias múltiples o con ambos planos operados son técnicamente complejas y deben resolverse en unidades con experiencia en pared.","fuente":"Hermes: Hernia inguinal recurrente"}]},{"id":"hernia-05","tema":"Hernias recidivadas","anio":2,"titulo":"Bulto doloroso debajo del ligamento inguinal","vineta":"Mujer de 78 años con dolor y un bulto irreductible debajo del ligamento inguinal izquierdo desde hace 20 horas, con vómitos. Piel sin cambios. Leucocitos 12.000/mm³.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Hernia crural irreductible con posible estrangulación","Adenopatía inguinal abscedada con linfangitis","Hernia inguinal directa crónicamente irreductible","Aneurisma de la arteria femoral común trombosado"],"explicacion":"Una masa irreductible debajo del ligamento inguinal en una mujer mayor, con vómitos, es una hernia crural complicada hasta demostrar otra cosa; es la hernia con más riesgo de estrangulación.","fuente":"Hermes: Hernia crural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Cirugía de urgencia en las próximas horas","Reducción manual bajo sedación y control ambulatorio","Observación con analgesia","Cirugía programada en un mes"],"explicacion":"Ante vómitos y más de 20 horas de irreductibilidad se opera de urgencia; la reducción manual se intenta solo sin sospecha de isquemia.","fuente":"HerniaSurge 2023, urgencia"},{"tipo":"Técnica","pregunta":"Para liberar el anillo crural, ¿qué estructura debés proteger?","opciones":["La vena femoral, lateral al saco","El nervio ilioinguinal","El conducto deferente","La arteria epigástrica en la línea media"],"explicacion":"El anillo crural tiene la vena femoral por fuera; la sección para liberarlo se hace hacia medial, sobre el ligamento lacunar. La sutura de cierre tampoco debe comprimir la vena.","fuente":"Hermes: Hernia inguinal estrangulada"}]},{"id":"venosa-01","tema":"Enfermedad venosa crónica","anio":2,"titulo":"Úlcera maleolar interna","vineta":"Mujer de 66 años con una úlcera de 4 cm en el maléolo interno izquierdo de 5 meses, con lipodermatoesclerosis. Pulsos pedios palpables, índice tobillo-brazo 1,0. Eco Doppler: reflujo de la safena interna, sistema profundo competente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y en qué CEAP está?","opciones":["Úlcera venosa activa, CEAP C6","Úlcera arterial","Úlcera neuropática","Úlcera venosa cicatrizada, C5"],"explicacion":"Una úlcera maleolar interna con cambios cutáneos crónicos y reflujo venoso, con perfusión arterial normal, es una úlcera venosa activa (C6).","fuente":"ESVS 2022, enfermedad venosa crónica; Hermes: Úlcera venosa"},{"tipo":"Estudios","pregunta":"¿Por qué medís el índice tobillo-brazo antes de comprimir?","opciones":["Para descartar arteriopatía que contraindique la compresión","Para diagnosticar el reflujo de la safena","Para clasificar la úlcera en la CEAP","Para predecir el tiempo de cicatrización de la úlcera venosa activa"],"explicacion":"La compresión intensa sobre un miembro con mala perfusión puede producir necrosis. Un índice bajo obliga a reducir la compresión o evaluar la arteriopatía.","fuente":"ESVS 2022; Hermes: Úlcera venosa"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el tratamiento causal?","opciones":["Compresión multicomponente (40 mmHg en el tobillo)","Apósitos de plata y curaciones diarias, sin compresión","Antibióticos sistémicos por la colonización de la úlcera","Reposo en cama con el miembro elevado durante semanas"],"explicacion":"La compresión es lo que cicatriza la úlcera venosa. Ningún apósito la reemplaza, y los antibióticos solo se usan si hay infección clínica.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo tratás el reflujo de la safena?","opciones":["En forma temprana, junto con la compresión","Solo después de que cicatrice, si recidiva","No se trata: la compresión alcanza","Cuando la úlcera tenga más de 2 años"],"explicacion":"En el ensayo EVRA, la ablación temprana del reflujo superficial más compresión aceleró la cicatrización y redujo la recurrencia frente a diferirla.","fuente":"Ensayo EVRA; ESVS 2022"}]},{"id":"tep-01","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Disnea súbita en el día 6","vineta":"Mujer de 59 años en el día 6 de una histerectomía por cáncer. Disnea súbita, frecuencia 112, saturación 89 %, presión 125/80 mmHg. Angio-TC: embolia pulmonar segmentaria bilateral; sin dilatación del ventrículo derecho y troponina normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo estratificás el riesgo?","opciones":["Riesgo bajo o intermedio-bajo","Riesgo alto, por la hipoxemia","Riesgo intermedio-alto","No hace falta estratificar"],"explicacion":"El riesgo alto es la embolia con inestabilidad hemodinámica. En el estable, la disfunción del ventrículo derecho y la troponina elevada definen el intermedio-alto; esta paciente no tiene ninguna de las dos.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Heparina de bajo peso molecular a dosis terapéutica","Trombólisis sistémica con alteplasa","Filtro de vena cava inferior y luego anticoagulación","Aspirina más medias de compresión"],"explicacion":"La embolia estable se trata con anticoagulación. La trombólisis se reserva para el riesgo alto y el filtro, para la contraindicación absoluta de anticoagular.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Dosis","pregunta":"¿Con qué dosis de enoxaparina?","opciones":["1 mg/kg subcutánea cada 12 horas","40 mg subcutánea cada 24 horas","100 mg IV en bolo","0,5 mg/kg cada 48 horas"],"explicacion":"La dosis terapéutica es 1 mg/kg cada 12 horas (o 1,5 mg/kg cada 24 horas), ajustada a la función renal. 40 mg por día es la dosis profiláctica.","fuente":"ESC 2019, embolia pulmonar; ficha técnica de enoxaparina"},{"tipo":"Medidas generales","pregunta":"¿Cuánto dura la anticoagulación en esta paciente con cáncer activo?","opciones":["Al menos 3 a 6 meses, y mientras el cáncer esté activo","7 días, hasta el alta hospitalaria","Durante la internación y un mes más","De por vida, sin reevaluar el riesgo de sangrado"],"explicacion":"Tras una embolia con factor transitorio quirúrgico se anticoagula al menos 3 meses, pero con cáncer activo se extiende y se reevalúa periódicamente.","fuente":"ESC 2019, embolia pulmonar"}]},{"id":"tep-02","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Embolia con hipotensión","vineta":"Varón de 64 años, 3 semanas después de una fractura de cadera. Disnea súbita, presión 78/50 mmHg pese a líquidos, ventrículo derecho dilatado en la ecografía. No operado recientemente ni con sangrado activo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene?","opciones":["Riesgo alto","Riesgo intermedio-bajo","Riesgo bajo","Riesgo intermedio-alto"],"explicacion":"La hipotensión persistente o el shock definen la embolia de riesgo alto, con mortalidad elevada a corto plazo.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Trombólisis sistémica con heparina no fraccionada","Heparina de bajo peso molecular sin trombólisis","Aspirina y oxígeno a alto flujo","Diuréticos IV para descargar el ventrículo derecho dilatado"],"explicacion":"En la embolia de riesgo alto sin contraindicación se indica trombólisis sistémica con heparina no fraccionada. Si está contraindicada o falla, embolectomía quirúrgica o tratamiento por catéter.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Dosis","pregunta":"¿Qué esquema de alteplasa?","opciones":["100 mg IV en 2 horas","10 mg IV en bolo único","1 g IV","100 mg IV en 24 horas"],"explicacion":"El esquema habitual es 100 mg de alteplasa en 2 horas; en el paro cardíaco se usa un esquema acelerado.","fuente":"ESC 2019, embolia pulmonar"}]},{"id":"arteria-01","tema":"Patología arterial periférica","anio":2,"titulo":"Dolor en la pantorrilla al caminar","vineta":"Varón de 64 años, fumador, hipertenso y dislipémico. Dolor en la pantorrilla derecha que aparece a las 3 cuadras y cede al detenerse. Pulsos femoral presente y poplíteo y distales ausentes. Índice tobillo-brazo 0,65.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Claudicación intermitente por arteriopatía periférica","Claudicación neurógena por estenosis del conducto lumbar","Isquemia crónica amenazante de la extremidad","Insuficiencia venosa crónica sintomática"],"explicacion":"Dolor reproducible con el ejercicio que cede con el reposo, con índice tobillo-brazo menor de 0,9 y pulsos ausentes desde el poplíteo, es claudicación por arteriopatía. Sin dolor de reposo ni lesiones, no es amenazante.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica; Hermes: Enfermedad arterial periférica"},{"tipo":"Medidas generales","pregunta":"¿Qué indicación es la más eficaz para mejorar la distancia de marcha?","opciones":["Dejar de fumar y ejercicio supervisado durante 3 meses","Reposo y caminar lo mínimo para no provocar dolor","Medias de compresión elástica de alta presión","Revascularización inmediata por vía endovascular del eje femoropoplíteo"],"explicacion":"El ejercicio supervisado mejora la distancia de marcha tanto como la revascularización en la claudicación, y dejar de fumar reduce la progresión y los eventos cardiovasculares.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento médico indicás para reducir eventos cardiovasculares?","opciones":["Antiagregante y estatina de alta intensidad","Anticoagulación con warfarina, RIN 2 a 3","Vasodilatadores periféricos (pentoxifilina)","Estatina sola si el colesterol está alto"],"explicacion":"Todo paciente con arteriopatía sintomática recibe antiagregación (aspirina o clopidogrel), estatina de alta intensidad y control de la presión y la diabetes.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo revascularizás?","opciones":["Si sigue limitado tras 3 meses de tratamiento óptimo","Ahora, para evitar la progresión a amputación","Solo si aparece una úlcera en el pie","Cuando el índice tobillo-brazo baje de 0,2"],"explicacion":"La claudicación se revasculariza solo si persiste la limitación con tratamiento médico y ejercicio, porque la amputación es rara en este estadio.","fuente":"ESC 2024 y ESVS 2024; Hermes: Enfermedad arterial periférica"}]},{"id":"arteria-02","tema":"Patología arterial periférica","anio":2,"titulo":"Pierna fría y dolorosa de golpe","vineta":"Mujer de 76 años con fibrilación auricular sin anticoagular. Dolor súbito en la pierna izquierda de 4 horas, pierna fría y pálida, sin pulso femoral, hipoestesia en el pie y movilidad de los dedos conservada.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y qué categoría de Rutherford?","opciones":["Isquemia aguda embólica, Rutherford IIa o IIb","Isquemia crónica agudizada, Rutherford I","Flegmasía cerulea dolens por trombosis venosa","Isquemia irreversible, Rutherford III"],"explicacion":"Dolor, palidez, ausencia de pulso y frialdad súbitos en una paciente con fibrilación auricular son embolia arterial. Con déficit sensitivo y motricidad conservada la extremidad está amenazada pero recuperable; la parálisis y el rigor serían irreversibles.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Fármaco","pregunta":"¿Qué indicás de inmediato?","opciones":["Heparina no fraccionada IV en bolo","Aspirina sola","Trombólisis sistémica","Esperar la angio-TC para iniciar tratamiento"],"explicacion":"Se anticoagula de inmediato con heparina IV para limitar la propagación del trombo, mientras se planifica la revascularización.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Embolectomía urgente con catéter de Fogarty","Observación con heparina IV y Doppler a las 24 horas","Amputación primaria supracondílea","Tratamiento médico y control ambulatorio"],"explicacion":"Una extremidad amenazada se revasculariza con urgencia; en una embolia femoral, la embolectomía con Fogarty es rápida y eficaz.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Técnica","pregunta":"Tras revascularizar, la pantorrilla está tensa y duele al estirar los dedos. ¿Qué hacés?","opciones":["Fasciotomía de los cuatro compartimentos","Elevar el miembro y observar la evolución","Vendaje compresivo y analgesia con opioides","Esperar la medición de presiones a las 24 horas"],"explicacion":"El síndrome compartimental por reperfusión se trata con fasciotomía completa de los cuatro compartimentos, sin esperar déficit motor ni ausencia de pulso.","fuente":"ESVS 2020; Hermes: Síndrome compartimental agudo de las extremidades"}]},{"id":"arteria-03","tema":"Patología arterial periférica","anio":2,"titulo":"Úlcera infectada en un pie diabético","vineta":"Varón de 68 años diabético. Úlcera plantar bajo la cabeza del primer metatarsiano con celulitis de 3 cm alrededor, sin signos sistémicos. La sonda toca hueso. Pulsos pedios ausentes, índice tobillo-brazo 0,6.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué problemas tiene que ordenar?","opciones":["Infección moderada, probable osteomielitis e isquemia","Úlcera neuropática pura sin infección ni isquemia","Celulitis leve sin osteomielitis ni isquemia","Gangrena húmeda del antepié con sepsis"],"explicacion":"Celulitis de más de 2 cm o compromiso profundo define infección moderada; el contacto con hueso sugiere osteomielitis y el índice bajo indica isquemia. Hay que tratar las tres cosas.","fuente":"IWGDF/IDSA 2023, infección del pie diabético; Hermes: Pie diabético"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Radiografía, cultivo de tejido profundo y evaluación vascular","Hisopado superficial de la úlcera y radiografía","Hemograma y eritrosedimentación seriados","Gammagrafía ósea con leucocitos marcados como primer estudio y luego biopsia"],"explicacion":"La radiografía busca osteomielitis y gas; el cultivo de tejido profundo o hueso (no el hisopado) orienta el antibiótico, y la evaluación vascular decide la revascularización.","fuente":"IWGDF/IDSA 2023"},{"tipo":"Medidas generales","pregunta":"¿Qué medida es indispensable para cicatrizar?","opciones":["Descarga efectiva de la presión plantar","Caminar normalmente para estimular la circulación","Reposo relativo con calzado habitual","Apósitos con plata o hidrocoloide"],"explicacion":"Sin quitar la presión de la úlcera plantar no cicatriza; la descarga se adapta para que el paciente la cumpla.","fuente":"Hermes: Pie diabético"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés con la isquemia?","opciones":["Revascularizar para permitir la cicatrización","Amputación mayor directa por debajo de la rodilla","Antibióticos prolongados sin revascularizar","Observar la evolución con curaciones"],"explicacion":"Una úlcera con isquemia no cicatriza solo con antibióticos ni curaciones; la revascularización temprana mejora la cicatrización y el salvamento de la extremidad.","fuente":"IWGDF/IDSA 2023; Hermes: Isquemia crónica amenazante de la extremidad"}]},{"id":"mama-01","tema":"Patología mamaria","anio":2,"titulo":"Nódulo mamario en una mujer joven","vineta":"Mujer de 24 años con un nódulo de 2 cm en la mama derecha, móvil, elástico, indoloro, de bordes netos. Sin antecedentes familiares.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía mamaria","Mamografía","Resonancia","Biopsia quirúrgica directa"],"explicacion":"En mujeres menores de 30 a 35 años la ecografía es el estudio inicial por la densidad mamaria; la mamografía tiene baja sensibilidad a esa edad.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"La ecografía muestra un nódulo oval, circunscripto, paralelo a la piel. ¿Qué es lo más probable?","opciones":["Fibroadenoma (BI-RADS 3)","Carcinoma ductal (BI-RADS 5)","Quiste complicado","Mastitis granulomatosa"],"explicacion":"Una lesión sólida oval, circunscripta y paralela a la piel en una mujer joven es típica de fibroadenoma, categoría probablemente benigna (BI-RADS 3).","fuente":"ACR BI-RADS; Hermes: Evaluación de la patología mamaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Control ecográfico en 6 meses, o biopsia si crece","Mastectomía subcutánea preventiva","Resección quirúrgica en la próxima semana","Alta sin controles, por ser una lesión benigna"],"explicacion":"BI-RADS 3 tiene menos de 2 % de riesgo de malignidad y se controla a corto plazo. Se biopsia si crece, cambia o hay discordancia clínica.","fuente":"ACR BI-RADS"}]},{"id":"mama-02","tema":"Patología mamaria","anio":2,"titulo":"Nódulo sospechoso en una mujer de 56 años","vineta":"Mujer de 56 años con un nódulo de 1,8 cm en el cuadrante superoexterno derecho, duro e irregular. Mamografía: masa espiculada BI-RADS 5. Axila clínica y ecográficamente negativa.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo confirmás el diagnóstico?","opciones":["Biopsia con aguja gruesa guiada por imagen","Biopsia escisional con márgenes amplios","Punción con aguja fina para citología","Resonancia mamaria y luego cirugía"],"explicacion":"La biopsia con aguja gruesa confirma la invasión y da receptores hormonales y HER2, que definen el tratamiento antes de cualquier cirugía.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"Es un carcinoma ductal invasor, receptores positivos, HER2 negativo. ¿Qué cirugía indicás?","opciones":["Cirugía conservadora, ganglio centinela y radioterapia","Mastectomía radical modificada con vaciamiento","Cirugía conservadora con vaciamiento axilar completo de los tres niveles","Hormonoterapia primaria sin cirugía"],"explicacion":"Un tumor de 1,8 cm en una mama de tamaño adecuado permite cirugía conservadora más radioterapia, con supervivencia equivalente a la mastectomía. La axila clínicamente negativa se estadifica con ganglio centinela.","fuente":"Hermes: Cáncer de mama; Cirugía axilar en cáncer de mama"},{"tipo":"Técnica","pregunta":"El ganglio centinela tiene metástasis en 1 de 2 ganglios. ¿Completás el vaciamiento?","opciones":["No: con 1 o 2 ganglios y radioterapia, Z0011 no mostró beneficio","Sí, porque el ganglio centinela es positivo","Sí, y además convertir a mastectomía","Sí, con vaciamiento y radioterapia axilar complementaria"],"explicacion":"En el ACOSOG Z0011, en tumores T1-T2 con 1 o 2 ganglios centinela positivos tratados con cirugía conservadora y radioterapia, el vaciamiento no mejoró la supervivencia y aumentó el linfedema.","fuente":"Ensayo ACOSOG Z0011"}]},{"id":"trauma-04","tema":"Trauma avanzado","anio":2,"titulo":"Lesión esplénica en un paciente estable","vineta":"Varón de 25 años, caída de moto. Estable desde el ingreso. TC: laceración esplénica de 4 cm de profundidad (grado III de la AAST), sin extravasación de contraste ni otras lesiones.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué clase WSES tiene?","opciones":["Clase II (moderada)","Clase IV (grave)","Clase I (menor)","Clase III (grave)"],"explicacion":"WSES combina el grado anatómico con la hemodinamia: el grado III de la AAST en un paciente estable es clase II.","fuente":"WSES 2017, trauma esplénico; Hermes: Traumatismo esplénico"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Manejo no operatorio con vigilancia","Esplenectomía laparoscópica programada","Esplenorrafia de rutina por laparotomía","Alta con control ambulatorio en 48 horas"],"explicacion":"El paciente estable sin otra indicación de laparotomía se maneja sin operar, siempre que haya vigilancia, controles seriados y capacidad de rescate.","fuente":"WSES 2017, trauma esplénico"},{"tipo":"Medidas generales","pregunta":"¿Qué controles hacés?","opciones":["Examen y hemoglobina seriados","Sin controles si sigue estable","TC de abdomen con contraste cada 6 horas","Laparoscopia diagnóstica a las 24 h"],"explicacion":"Se vigilan los signos vitales, el abdomen y la hemoglobina; ante deterioro se considera angioembolización o cirugía.","fuente":"WSES 2017, trauma esplénico"},{"tipo":"Fármaco","pregunta":"Si terminara esplenectomizado, ¿qué vacunas indicás?","opciones":["Neumococo, meningococo y Hib","Antigripal anual y hepatitis B","Antitetánica y antigripal anual","BCG y triple viral de refuerzo"],"explicacion":"La asplenia aumenta el riesgo de sepsis fulminante por gérmenes encapsulados; se vacuna contra neumococo, meningococo y Haemophilus, idealmente a partir de las 2 semanas de la cirugía, más antigripal anual.","fuente":"WSES 2017, trauma esplénico"}]},{"id":"trauma-05","tema":"Trauma avanzado","anio":2,"titulo":"Fractura de pelvis en libro abierto","vineta":"Mujer de 45 años atropellada. Presión 75/40 mmHg pese a 1 litro de cristaloides. Dolor pélvico, radiografía con diástasis de la sínfisis (libro abierto). FAST negativo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿De dónde sangra probablemente?","opciones":["De la pelvis (venas y focos de fractura)","Del abdomen, aunque el FAST sea negativo","Del tórax, por un hemotórax no visto","De una fractura de fémur oculta"],"explicacion":"Con FAST negativo y fractura en libro abierto, el shock es probablemente pélvico; el sangrado es mayormente venoso y óseo.","fuente":"WSES 2017, trauma pélvico; Hermes: Trauma pélvico"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés de inmediato?","opciones":["Faja pélvica sobre los trocánteres y transfusión masiva","Laparotomía exploradora para buscar el sangrado","TC de pelvis con contraste para definir la fractura","Colocar sonda vesical y medir la diuresis"],"explicacion":"La faja pélvica reduce el volumen pélvico y el sangrado; se coloca sobre los trocánteres mayores. Se transfunde de forma balanceada y precoz.","fuente":"WSES 2017, trauma pélvico"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste inestable. ¿Qué opciones tenés?","opciones":["Packing preperitoneal, fijación externa y angioembolización","Transfundir y esperar 24 horas para fijar la pelvis en forma definitiva","Más cristaloides hasta normalizar la presión","Laparotomía con exploración del hematoma pélvico"],"explicacion":"En el inestable se combinan el packing preperitoneal, la fijación mecánica y la angioembolización según disponibilidad. Abrir el hematoma pélvico por laparotomía empeora el sangrado.","fuente":"WSES 2017, trauma pélvico"},{"tipo":"Medidas generales","pregunta":"Hay sangre en el meato uretral. ¿Colocás una sonda vesical?","opciones":["No, sin antes hacer una uretrografía retrógrada","Sí, de inmediato, para medir la diuresis horaria","Sí, con fuerza si encuentra resistencia","Sí, una sonda más fina con lubricante"],"explicacion":"La sangre en el meato con fractura pélvica sugiere lesión uretral; una sonda a ciegas puede completar una sección parcial. Se estudia primero y, si hay lesión, se coloca una cistostomía.","fuente":"WSES 2017, trauma pélvico"}]},{"id":"trauma-06","tema":"Trauma avanzado","anio":2,"titulo":"Lesión hepática con respuesta transitoria","vineta":"Varón de 30 años con trauma cerrado. Laceración hepática grado IV en la TC con extravasación de contraste arterial. Respondió a 2 unidades de sangre y se mantiene estable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Angioembolización y continuar el manejo no operatorio","Hepatectomía derecha reglada de urgencia","Observación clínica sin tratar la extravasación arterial","Alta a las 24 horas si la hemoglobina se mantiene"],"explicacion":"En el estable, el grado no obliga a operar. La extravasación arterial en el adulto puede tratarse con angioembolización dentro del manejo no operatorio.","fuente":"WSES 2020, trauma hepático; Hermes: Trauma hepático"},{"tipo":"Conducta quirúrgica","pregunta":"Se descompensa y lo llevás a quirófano con hemorragia hepática masiva. ¿Qué hacés primero?","opciones":["Compresión manual, packing perihepático y maniobra de Pringle","Hepatectomía reglada inmediata del segmento lesionado","Ligadura de la vena cava inferior suprahepática","Sutura profunda de las laceraciones con puntos en U"],"explicacion":"El control de daños hepático empieza por compresión, packing y Pringle para controlar el flujo. Las resecciones regladas en un paciente en shock aumentan la mortalidad.","fuente":"WSES 2020, trauma hepático; Hermes: Trauma hepático"},{"tipo":"Medidas generales","pregunta":"¿Qué complicaciones tardías vigilás?","opciones":["Biliomas, fístula biliar, hemobilia y pseudoaneurismas","Pancreatitis aguda y pseudoquiste pancreático","Úlcera duodenal de estrés con hemorragia digestiva alta","Hernia diafragmática y vólvulo gástrico"],"explicacion":"Las lesiones de alto grado pueden complicarse con colecciones biliares, hemobilia o pseudoaneurismas, que se manejan con drenaje, CPRE o embolización.","fuente":"Hermes: Trauma hepático"}]},{"id":"panc-02","tema":"Pancreatitis aguda","anio":2,"titulo":"Necrosis infectada a las 5 semanas","vineta":"Varón de 50 años con pancreatitis necrotizante hace 5 semanas. Fiebre y deterioro clínico. TC: necrosis encapsulada de 12 cm retrogástrica con burbujas de gas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Necrosis encapsulada infectada","Pseudoquiste no infectado","Colección aguda peripancreática","Absceso hepático"],"explicacion":"Después de 4 semanas, una colección con pared y contenido necrótico es necrosis encapsulada; el gas en su interior con deterioro clínico indica infección.","fuente":"Atlanta revisada; Hermes: Pancreatitis aguda necrotizante"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás?","opciones":["Un carbapenémico, ajustado luego por cultivo","No indico antibiótico hasta tener el cultivo","Cefalexina por vía oral durante 14 días","Ampicilina IV en monoterapia durante 7 días"],"explicacion":"Ante infección de la necrosis se indican antibióticos que penetren el páncreas, como los carbapenémicos, ajustados a los cultivos obtenidos al drenar.","fuente":"WSES 2019, pancreatitis grave"},{"tipo":"Dosis","pregunta":"¿Qué dosis de meropenem?","opciones":["1 g IV cada 8 horas","1 g VO cada 24 horas","100 mg IV cada 12 horas","6 g IV en bolo único diario"],"explicacion":"La dosis de meropenem en infección intraabdominal es 1 g IV cada 8 horas, ajustada a la función renal.","fuente":"SIS/IDSA 2010, tabla de dosis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Abordaje escalonado: drenaje y, si no mejora, necrosectomía","Necrosectomía abierta de entrada con lavado retroperitoneal continuo","Antibióticos prolongados sin drenaje mientras tolere","Pancreatectomía corporocaudal con esplenectomía"],"explicacion":"En los ensayos PANTER y TENSION, el abordaje escalonado redujo las complicaciones mayores frente a la necrosectomía abierta. Una colección retrogástrica es ideal para el drenaje endoscópico.","fuente":"Ensayos PANTER y TENSION; WSES 2019"}]},{"id":"panc-03","tema":"Pancreatitis crónica","anio":2,"titulo":"Dolor y diarrea grasa en un bebedor","vineta":"Varón de 48 años con consumo de alcohol de 20 años y tabaquismo. Dolor epigástrico recurrente, pérdida de peso y deposiciones voluminosas, grasas y malolientes. TC: calcificaciones pancreáticas y Wirsung de 9 mm con litiasis cefálica.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Pancreatitis crónica con insuficiencia exocrina","Pancreatitis aguda recurrente sin cambios crónicos","Adenocarcinoma de cabeza de páncreas con obstrucción","Enfermedad celíaca con malabsorción secundaria grave"],"explicacion":"Calcificaciones, dilatación ductal y esteatorrea en un bebedor indican pancreatitis crónica con insuficiencia exocrina. Hay que excluir cáncer si aparece una masa o cambia el cuadro.","fuente":"Hermes: Pancreatitis crónica"},{"tipo":"Medidas generales","pregunta":"¿Qué medida es fundamental?","opciones":["Abstinencia total de alcohol y tabaco","Dieta con menos de 20 g diarios de grasa","Ayuno durante las crisis de dolor","Analgésicos opioides en horario fijo"],"explicacion":"Dejar el alcohol y el tabaco reduce los episodios de dolor y la progresión. La dieta no debe ser pobre en grasas si se reemplazan las enzimas.","fuente":"UEG HaPanEU 2017, pancreatitis crónica; Hermes: Pancreatitis crónica"},{"tipo":"Fármaco","pregunta":"¿Qué indicás para la esteatorrea?","opciones":["Enzimas pancreáticas con las comidas","Loperamida","Antibióticos","Inhibidor de bomba como único tratamiento"],"explicacion":"La insuficiencia exocrina se trata con enzimas pancreáticas gastrorresistentes tomadas con las comidas.","fuente":"UEG HaPanEU 2017, pancreatitis crónica"},{"tipo":"Dosis","pregunta":"¿Qué dosis inicial de lipasa?","opciones":["40.000 a 50.000 unidades por comida principal","1.000 unidades por día, en el desayuno","500.000 unidades por día, en ayunas","10.000 unidades por semana, con la cena"],"explicacion":"La dosis inicial recomendada es de 40.000 a 50.000 unidades de lipasa en cada comida principal y la mitad en las colaciones, ajustando según la respuesta.","fuente":"UEG HaPanEU 2017, pancreatitis crónica"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste el dolor pese al tratamiento médico. ¿Qué indicás con Wirsung dilatado y litiasis?","opciones":["Drenaje quirúrgico temprano (Partington o Frey) o endoscópico","Pancreatectomía total de entrada con autotrasplante","Opioides en dosis crecientes sin límite de tiempo","Esperar 10 años hasta que el páncreas se agote"],"explicacion":"Con Wirsung dilatado y dolor, el drenaje está indicado; en el ensayo ESCAPE, la cirugía temprana alivió mejor el dolor que el escalonamiento endoscópico. Con masa cefálica se prefiere Frey o Beger.","fuente":"Ensayo ESCAPE; Hermes: Derivación del Wirsung en pancreatitis crónica"}]},{"id":"pared-03","tema":"Eventraciones","anio":2,"titulo":"Eventración irreductible con vómitos","vineta":"Mujer de 70 años con eventración mediana conocida, irreductible y dolorosa desde hace 10 horas, con vómitos. Estable, qSOFA negativo. TC: defecto de 5 cm con asa de delgado incarcerada sin signos de isquemia.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Cirugía urgente, evaluando el asa y reparando el defecto","Reducción manual bajo sedación y alta con faja","Observación 48 horas con sonda nasogástrica","Cirugía programada en 2 meses, tras optimizarla"],"explicacion":"Una eventración irreductible con oclusión se opera de urgencia para evaluar el intestino y reparar el defecto.","fuente":"EHS 2026, hernia ventral de urgencia; Hermes: Hernia ventral complicada y de urgencia"},{"tipo":"Técnica","pregunta":"El asa es viable, sin resección y sin contaminación. ¿Cómo reparás?","opciones":["Malla sintética macroporosa onlay, con cierre del defecto","Sutura simple del defecto sin malla","Malla biológica en posición intraperitoneal","Malla retromuscular con separación de componentes posterior"],"explicacion":"EHS 2026 sugiere reparar con malla en lugar de sutura en el defecto cerrable, y en urgencia prefiere la malla sintética macroporosa en onlay frente al plano retromuscular.","fuente":"EHS 2026, hernia ventral de urgencia"},{"tipo":"Conducta quirúrgica","pregunta":"Si el defecto midiera 14 cm y no pudiera cerrarse sin separación de componentes, ¿qué harías?","opciones":["Cerrar la cavidad y derivar para una reparación planificada","Separación de componentes anterior en la misma urgencia","Abdomen abierto con presión negativa de rutina","Malla puente intraperitoneal permanente de PTFE"],"explicacion":"Ante un defecto no cerrable, EHS 2026 sugiere diferir la reconstrucción, cerrar la cavidad (piel, saco o malla absorbible) y derivar a un centro experto.","fuente":"EHS 2026, hernia ventral de urgencia"}]},{"id":"biliar-08","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Sepsis en un paciente de terapia intensiva","vineta":"Varón de 70 años en terapia intensiva por un politraumatismo hace 10 días, con nutrición parenteral. Fiebre y aumento de los requerimientos de vasopresor sin otro foco. Ecografía: vesícula distendida sin cálculos, pared de 6 mm, líquido perivesicular.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Colecistitis alitiásica","Colecistitis litiásica","Colangitis","Hallazgo normal en terapia intensiva"],"explicacion":"En el paciente crítico (trauma, quemaduras, ayuno, nutrición parenteral, vasopresores), la sepsis sin otro foco con vesícula distendida y alterada sugiere colecistitis alitiásica. La pared engrosada aislada no alcanza para el diagnóstico.","fuente":"Hermes: Colecistitis alitiásica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás en este paciente inestable?","opciones":["Colecistostomía percutánea","Colecistectomía abierta inmediata","Solo antibióticos","CPRE"],"explicacion":"En el paciente inestable la colecistostomía drena el foco con poco riesgo. La colecistectomía es definitiva cuando la fisiología lo permite.","fuente":"Hermes: Colecistitis alitiásica y Drenaje de la vesícula biliar"},{"tipo":"Medidas generales","pregunta":"No mejora a las 48 horas del drenaje. ¿Qué hacés?","opciones":["Buscar necrosis, perforación u otro foco, y considerar cirugía","Esperar una semana más con el drenaje y el mismo antibiótico","Retirar el drenaje y repetir la ecografía","Cambiar el antibiótico a un carbapenémico y esperar otras 72 horas"],"explicacion":"El drenaje no corrige una vesícula necrótica o perforada; si no hay mejoría hay que reevaluar con imagen y considerar la colecistectomía.","fuente":"Hermes: Colecistitis alitiásica"}]},{"id":"venosa-02","tema":"Enfermedad venosa crónica","anio":2,"titulo":"Cordón doloroso en el muslo","vineta":"Mujer de 52 años con várices. Desde hace 3 días tiene un cordón doloroso, caliente y enrojecido sobre la safena interna en la cara interna del muslo. Sin cáncer conocido ni embarazo.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["Eco Doppler venoso del miembro","Dímero D como único estudio","Flebografía con contraste","TC de abdomen y pelvis"],"explicacion":"La ecografía define la longitud del trombo, su distancia a la unión safenofemoral, si hay trombosis profunda asociada y diagnósticos alternativos; con eso se decide el tratamiento.","fuente":"Pascarella y Marston, Sabiston 2022, cap. 65; Hermes: Tromboflebitis superficial"},{"tipo":"Fármaco","pregunta":"El trombo mide 9 cm, termina lejos de la unión safenofemoral y no hay trombosis profunda. ¿Qué indicás?","opciones":["Fondaparinux en dosis profiláctica","Solo AINE tópicos y calor local","Anticoagulación oral por 6 meses","Ligadura urgente del cayado de la safena"],"explicacion":"En CALISTO, en trombosis venosa superficial sintomática de los miembros inferiores sin trombosis profunda, el fondaparinux redujo 85 % el evento compuesto de embolia, trombosis profunda, extensión a la unión o recurrencia, sin aumentar el sangrado mayor.","fuente":"CALISTO (Decousus, NEJM 2010;363:1222); Hermes: Tromboflebitis superficial"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["2,5 mg subcutáneo una vez por día durante 45 días","2,5 mg subcutáneo una vez por día durante 7 días","7,5 mg subcutáneo cada 12 horas durante 45 días","25 mg subcutáneo en dosis única"],"explicacion":"CALISTO usó fondaparinux 2,5 mg subcutáneo una vez por día durante 45 días.","fuente":"CALISTO (Decousus, NEJM 2010;363:1222)"},{"tipo":"Conducta quirúrgica","pregunta":"Si la ecografía mostrara que el trombo ya entró en la vena femoral común, ¿qué cambiaría?","opciones":["Se trata como una trombosis venosa profunda","Sigue tratándose como trombosis superficial","Se indica ligadura del cayado y alta","Se suspende todo anticoagulante"],"explicacion":"La extensión al sistema profundo se trata como trombosis venosa profunda, con anticoagulación terapéutica.","fuente":"Pascarella y Marston, Sabiston 2022, cap. 65; Hermes: Tromboflebitis superficial"}]},{"id":"venosa-03","tema":"Enfermedad venosa crónica","anio":2,"titulo":"Úlcera venosa que cerró","vineta":"Varón de 61 años al que le cicatrizó una úlcera venosa maleolar con vendaje multicapa. El eco Doppler muestra reflujo de la safena interna con sistema profundo competente y el índice tobillo-brazo es normal.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué indicás para mantenerla cerrada?","opciones":["Medias de compresión por debajo de la rodilla","Suspender toda compresión al cicatrizar","Reposo en cama con las piernas elevadas","Apósitos de plata sobre la cicatriz"],"explicacion":"Después de la cicatrización se continúa con medias de compresión (en ESCHAR, clase 2 por debajo de la rodilla), además de ejercicio y elevación.","fuente":"ESCHAR (Barwell, Lancet 2004;363:1854); Hermes: Úlcera venosa"},{"tipo":"Conducta quirúrgica","pregunta":"¿Tratás el reflujo superficial?","opciones":["Sí, porque reduce la recurrencia de la úlcera","No, porque la úlcera ya cicatrizó con compresión","Solo si la úlcera vuelve a abrirse más adelante","No, porque empeora el retorno venoso profundo de la pierna"],"explicacion":"En ESCHAR, agregar cirugía del reflujo superficial a la compresión no cambió la cicatrización, pero redujo la recurrencia a 12 meses (12 % frente a 28 %).","fuente":"ESCHAR (Barwell, Lancet 2004;363:1854)"},{"tipo":"Diagnóstico","pregunta":"En ESCHAR, ¿qué resultado no mejoró al agregar la cirugía?","opciones":["La cicatrización de la úlcera a las 24 semanas","La recurrencia de la úlcera a los 12 meses","El reflujo en la safena interna","La recurrencia en pacientes con reflujo superficial aislado"],"explicacion":"La tasa de cicatrización a 24 semanas fue igual con y sin cirugía (65 %): la compresión es lo que cicatriza; la cirugía del reflujo previene que vuelva.","fuente":"ESCHAR (Barwell, Lancet 2004;363:1854)"}]},{"id":"panc-04","tema":"Pancreatitis crónica","anio":2,"titulo":"Masa en la cabeza del páncreas en un bebedor","vineta":"Varón de 52 años con pancreatitis crónica alcohólica conocida. Dolor diario que no cede con analgésicos, ictericia leve y pérdida de 7 kg. TC: cabeza pancreática agrandada con calcificaciones, Wirsung corporocaudal de 7 mm y estenosis del colédoco distal.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio es prioritario?","opciones":["Ecoendoscopia con punción para excluir cáncer","CPRE diagnóstica con cepillado de rutina","Dosaje de amilasa y lipasa séricas","Centellograma con octreótido"],"explicacion":"Una masa cefálica con ictericia y pérdida de peso obliga a excluir cáncer; la ecoendoscopia detecta cambios y permite biopsia.","fuente":"Fisher y col., Schwartz 2006, cap. 32; Hermes: Pancreatitis crónica"},{"tipo":"Conducta quirúrgica","pregunta":"La biopsia es benigna. Con dolor intratable y masa cefálica, ¿qué operación indicás?","opciones":["Operación de Frey o de Beger (cabeza)","Derivación longitudinal sola (Partington)","Pancreatectomía total con autotrasplante de islotes","Prótesis biliar permanente como única medida"],"explicacion":"Con masa cefálica se prefieren Frey (excavación de la cabeza con drenaje del conducto) o Beger (resección de la cabeza conservando el duodeno). La derivación longitudinal sola no trata la cabeza y la pancreatectomía total es excepcional.","fuente":"Fisher y col., Schwartz 2006, cap. 32; Hermes: Pancreatitis crónica y Pancreatectomía con conservación duodenal"},{"tipo":"Conducta quirúrgica","pregunta":"Si no se pudiera excluir un cáncer, ¿qué operación correspondería?","opciones":["Duodenopancreatectomía cefálica","Operación de Frey","Derivación biliodigestiva sola","Pancreatectomía distal"],"explicacion":"La duodenopancreatectomía cefálica se reserva para cuando no se puede excluir un cáncer u otras indicaciones específicas: reseca la cabeza con criterio oncológico.","fuente":"Hermes: Pancreatitis crónica"},{"tipo":"Medidas generales","pregunta":"Además de la cirugía, ¿cuál es la base del tratamiento?","opciones":["Dejar alcohol y tabaco, enzimas, nutrición y analgesia","Dieta sin grasas estricta y ayuno durante las crisis","Corticoides para frenar la fibrosis","Antibióticos profilácticos en ciclos mensuales"],"explicacion":"Dejar el alcohol y el tabaco, la nutrición, las enzimas y la analgesia forman la base; los corticoides solo sirven en la pancreatitis autoinmune.","fuente":"Hermes: Pancreatitis crónica"}]},{"id":"panc-05","tema":"Pancreatitis crónica","anio":2,"titulo":"Seudoquiste hallado en un control","vineta":"Mujer de 45 años con pancreatitis crónica alcohólica. En una TC de control aparece un seudoquiste encapsulado de 7 cm, de contenido líquido, en contacto con la pared posterior del estómago. No tiene síntomas.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué conducta indicás?","opciones":["Observación, porque no da síntomas ni complicaciones","Drenaje endoscópico, porque mide más de 6 cm","Cistogastrostomía quirúrgica programada por el tamaño","Drenaje percutáneo preventivo de la colección"],"explicacion":"El seudoquiste asintomático y sin complicaciones se observa: no se drena solo por el tamaño o la duración, criterios históricos que las guías actuales abandonaron.","fuente":"iLATAM-AP 2026; Hermes: Pseudocisto pancreático"},{"tipo":"Conducta quirúrgica","pregunta":"Meses después tiene saciedad precoz y vómitos por compresión gástrica. ¿Qué drenaje preferís?","opciones":["Drenaje ecoendoscópico transgástrico","Drenaje percutáneo con catéter externo","Cistogastrostomía abierta","Aspiración percutánea simple"],"explicacion":"Si está encapsulado y es accesible, el drenaje ecoendoscópico se prefiere al percutáneo; la cirugía queda para la anatomía no tratable por endoscopia o el fracaso.","fuente":"iLATAM-AP 2026; Hermes: Pseudocisto pancreático"},{"tipo":"Estudios","pregunta":"¿Qué confirmás con la ecoendoscopia antes de drenar?","opciones":["Aposición a la pared y vasos interpuestos","La función exocrina del páncreas residual","El nivel de CA 19-9 en el líquido del quiste","La permeabilidad de la vía biliar distal"],"explicacion":"Antes del drenaje se confirma que el seudoquiste está adosado a la pared, que el contenido es líquido y que no hay vasos interpuestos ni un seudoaneurisma.","fuente":"Hermes: Pseudocisto pancreático"},{"tipo":"Diagnóstico","pregunta":"Antes del drenaje tiene melena y caída de la hemoglobina; la TC muestra contraste dentro del seudoquiste. ¿Qué sospechás?","opciones":["Seudoaneurisma por erosión arterial","Úlcera duodenal por estrés","Várices esofágicas por cirrosis","Infección del seudoquiste"],"explicacion":"La erosión de una arteria vecina por el seudoquiste produce un seudoaneurisma que puede sangrar dentro del quiste o al tubo digestivo; se estudia y trata por angiografía.","fuente":"Hermes: Pseudocisto pancreático"}]},{"id":"pilo-02","tema":"Quiste pilonidal","anio":2,"titulo":"Fositas en el pliegue sin síntomas","vineta":"Varón de 19 años que consulta porque en un control deportivo le vieron dos fositas en la línea media del pliegue interglúteo. Nunca tuvo dolor, supuración ni abscesos.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo lo clasificás?","opciones":["Enfermedad pilonidal asintomática","Absceso pilonidal en formación","Fístula anorrectal baja","Hidradenitis supurativa"],"explicacion":"Las fositas medias sin dolor ni secreción son enfermedad pilonidal asintomática; la fístula anal se distingue por su relación con el ano.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Indicás cirugía?","opciones":["No: las fositas asintomáticas no se operan","Sí, escisión amplia y cierre abierto","Sí, escisión y cierre en la línea media","Sí, colgajo romboidal preventivo"],"explicacion":"Las fositas asintomáticas no necesitan cirugía; operarlas crea una herida en una zona de mala cicatrización sin beneficio.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Medidas generales","pregunta":"¿Qué le recomendás?","opciones":["Higiene y mantener el pliegue libre de pelo suelto","Afeitado diario a ras con hoja de afeitar","Antibiótico tópico diario sobre las fositas","Evitar la actividad física y el deporte"],"explicacion":"La higiene y mantener el surco libre de pelo suelto (con depilación en casos seleccionados) pueden reducir problemas; el afeitado traumático puede causar foliculitis.","fuente":"Hermes: Quiste pilonidal"}]},{"id":"pilo-03","tema":"Quiste pilonidal","anio":2,"titulo":"Después del drenaje de un absceso pilonidal","vineta":"Varón de 22 años al que le drenaron un absceso pilonidal con una incisión lateral a la línea media. No tiene celulitis extensa, fiebre ni inmunosupresión.","pasos":[{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos después del drenaje?","opciones":["No, salvo celulitis, sepsis o inmunosupresión","Sí, amoxicilina-clavulánico durante 10 días","Sí, clindamicina tópica durante un mes","Sí, una dosis de ceftriaxona intramuscular"],"explicacion":"El absceso se trata con incisión y drenaje; los antibióticos se reservan para celulitis, sepsis o inmunosupresión.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Programás de rutina una cirugía definitiva?","opciones":["No: se reevalúan los síntomas y la cicatrización","Sí, a las 2 semanas del drenaje, de rutina","Sí, en la misma semana, antes del alta","Sí, apenas cierre la herida del drenaje"],"explicacion":"Tras el drenaje muchos pacientes no necesitan otra operación: en una cohorte prospectiva, 91,2 % no requirió cirugía adicional en el primer año. Se reevalúa y se opera la enfermedad crónica sintomática.","fuente":"Huurman, cohorte prospectiva; Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"Meses después tiene enfermedad crónica limitada, con dos fositas y secreción intermitente. ¿Qué opción es razonable?","opciones":["Pit-picking o destechado del trayecto","Escisión amplia hasta la fascia sacra","Escisión y cierre primario en la línea media","Colgajo de rotación glúteo bilateral"],"explicacion":"En la enfermedad crónica limitada son opciones el pit-picking, el destechado o procedimientos mínimamente invasivos; la escisión amplia abierta deja una herida prolongada y el cierre medio recidiva más.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Técnica","pregunta":"Si la enfermedad fuera extensa con un pliegue profundo, ¿qué técnica preferirías?","opciones":["Colgajo fuera de la línea media (Bascom)","Escisión y cierre directo en la línea media","Escisión amplia abierta como primera opción","Inyección de fenol en las fositas de la línea media"],"explicacion":"Las técnicas que sacan la cicatriz de la línea media y aplanan el surco, como el cleft lift de Bascom o Karydakis, mejoran el entorno mecánico de la herida.","fuente":"ASCRS 2019, enfermedad pilonidal; Hermes: Quiste pilonidal"}]},{"id":"pared-04","tema":"Eventraciones","anio":2,"titulo":"Eventración gigante con el intestino afuera","vineta":"Varón de 60 años con una eventración mediana de 18 cm de ancho que contiene gran parte del intestino delgado. Obeso y fumador. Programado para reparación electiva.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís para planificar?","opciones":["TC para medir el defecto y el volumen del saco","Ecografía de pared como único estudio","Radiografía de abdomen de frente y perfil","Tránsito intestinal con bario"],"explicacion":"La TC mide ancho y área del defecto, contenido, músculos y el volumen del saco frente a la cavidad, que define la pérdida de dominio.","fuente":"EHS 2023; Hermes: Eventración de la pared abdominal"},{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene reintroducir todo el contenido en la cavidad?","opciones":["Hipertensión intraabdominal y restricción ventilatoria","Hipotermia por la exposición prolongada del intestino","Íleo biliar por compresión de la vesícula biliar","Isquemia mesentérica por embolia arterial"],"explicacion":"Con pérdida de dominio, devolver el contenido a una cavidad retraída aumenta la presión abdominal, compromete la ventilación y puede producir síndrome compartimental.","fuente":"Hermes: Eventración de la pared abdominal"},{"tipo":"Medidas generales","pregunta":"¿Qué adyuvante preoperatorio puede ayudar en este caso seleccionado?","opciones":["Toxina botulínica o neumoperitoneo progresivo","Faja compresiva permanente durante 6 meses","Dieta hiperproteica sin otra preparación","Antibióticos orales una semana antes"],"explicacion":"La toxina botulínica en los músculos anchos y el neumoperitoneo progresivo son adyuvantes selectivos para la pérdida de dominio, no requisitos para toda hernia grande.","fuente":"Hermes: Eventración de la pared abdominal"},{"tipo":"Medidas generales","pregunta":"¿Qué optimización exigís antes de operar?","opciones":["Dejar de fumar al menos 4 semanas y bajar de peso","Operar ya, porque la cirugía no puede esperar","Control de la presión arterial, sin otra preparación","Dejar de fumar el día anterior a la cirugía"],"explicacion":"En la cirugía electiva se recomienda abstinencia de tabaco de al menos 4 semanas y descenso de peso supervisado; la abstinencia más corta no reduce complicaciones.","fuente":"EHS 2023; Hermes: Eventración de la pared abdominal"}]},{"id":"ano-06","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Fístulas perianales en un joven con Crohn","vineta":"Varón de 26 años con enfermedad de Crohn ileocolónica. Dolor perianal, fiebre y dos orificios que supuran a cada lado del ano. Tiene proctitis en la endoscopia.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo definís la anatomía de las fístulas?","opciones":["RM pélvica y examen bajo anestesia","Fistulografía con contraste","Sondaje enérgico de los trayectos en consultorio","Ecografía abdominal"],"explicacion":"La mejor cartografía combina RM pélvica y examen bajo anestesia; el sondaje agresivo crea falsas vías.","fuente":"Hermes: Enfermedad de Crohn perianal"},{"tipo":"Técnica","pregunta":"Hay un absceso y una fístula transesfinteriana alta. ¿Qué hacés en el examen bajo anestesia?","opciones":["Drenaje del absceso y sedal no cortante","Fistulotomía de toda la fístula","Colgajo de avance en el mismo acto","Sedal cortante ajustado cada semana"],"explicacion":"Se drenan las colecciones y se coloca un sedal laxo que mantiene el trayecto abierto mientras actúa el tratamiento médico; con proctitis y sepsis no se hacen reparaciones ni se divide esfínter.","fuente":"Hermes: Enfermedad de Crohn perianal"},{"tipo":"Fármaco","pregunta":"Controlada la sepsis, ¿qué tratamiento médico cierra las fístulas?","opciones":["Infliximab IV","Mesalazina oral","Corticoides sistémicos","Loperamida para reducir la diarrea"],"explicacion":"Infliximab cerró todas las fístulas en 55 % de los pacientes con 5 mg/kg frente a 13 % con placebo. Primero se drena la sepsis y después se intensifica la inmunosupresión.","fuente":"Present 1999 (NEJM 340:1398); Hermes: Enfermedad de Crohn perianal"},{"tipo":"Dosis","pregunta":"¿Con qué esquema de inducción?","opciones":["5 mg/kg IV en las semanas 0, 2 y 6","5 mg/kg IV una vez por mes durante un año","50 mg/kg IV en dosis única de carga","0,5 mg/kg IV en las semanas 0, 2 y 6"],"explicacion":"En el ensayo se dio infliximab 5 mg/kg IV en las semanas 0, 2 y 6; la dosis de 10 mg/kg no fue mejor.","fuente":"Present 1999 (NEJM 340:1398)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Por qué no hacés una fistulotomía?","opciones":["Por el riesgo de incontinencia y mala cicatrización","Porque las fístulas de Crohn cierran solas","Porque la fistulotomía empeora la proctitis","Porque está contraindicada con infliximab"],"explicacion":"Con diarrea, proctitis y fístulas altas, dividir esfínter tiene alto riesgo de incontinencia y la herida cicatriza mal; la fistulotomía queda para trayectos realmente bajos sin proctitis.","fuente":"Hermes: Enfermedad de Crohn perianal"}]},{"id":"hernia-06","tema":"Hernias recidivadas","anio":2,"titulo":"Dolor inguinal que no se va","vineta":"Varón de 40 años operado hace 8 meses con técnica de Lichtenstein. Desde entonces tiene dolor quemante en la ingle que se irradia al escroto y empeora al caminar. No palpa bulto.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Dolor inguinal crónico neuropático","Recurrencia de la hernia, aunque no se palpe","Infección crónica de la malla","Dolor normal del posoperatorio"],"explicacion":"El dolor que persiste más de 3 meses después de la reparación, quemante e irradiado al territorio genital, sugiere dolor crónico neuropático; antes hay que excluir una recurrencia.","fuente":"HerniaSurge 2018 (Hernia 22:1)"},{"tipo":"Estudios","pregunta":"¿Qué hacés antes de tratar el dolor?","opciones":["Imagen para descartar una recurrencia","Reexploración inmediata de la ingle","Retiro de la malla de entrada","Tratarlo directamente como neuropático"],"explicacion":"La guía propone una fase expectante y, después de excluir la recurrencia por imagen, derivar a un equipo multidisciplinario del dolor.","fuente":"HerniaSurge 2018"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el primer tratamiento?","opciones":["Analgésicos y bloqueos con equipo del dolor","Triple neurectomía en la primera consulta","Reposo laboral por 6 meses","Antibióticos por si hay infección"],"explicacion":"Se recomienda un abordaje escalonado y multidisciplinario, empezando por analgésicos y bloqueos nerviosos.","fuente":"HerniaSurge 2018"},{"tipo":"Conducta quirúrgica","pregunta":"El dolor persiste pese al tratamiento escalonado. ¿Qué cirugía considerás?","opciones":["Triple neurectomía, con o sin retiro de malla","Nueva hernioplastia por vía laparoscópica con malla","Orquiectomía del lado afectado por el dolor testicular","Infiltración repetida con corticoides de por vida"],"explicacion":"Si el tratamiento farmacológico e intervencionista fracasa, en casos seleccionados se indica triple neurectomía (ilioinguinal, iliohipogástrico y rama genital del genitofemoral) y retiro de la malla, por un cirujano experto en hernias.","fuente":"HerniaSurge 2018"}]},{"id":"panc-06","tema":"Pancreatitis aguda","anio":2,"titulo":"Pancreatitis grave con el abdomen tenso","vineta":"Varón de 48 años con pancreatitis aguda grave alcohólica, tercer día en terapia intensiva, intubado y con mucho volumen de cristaloides recibido. Abdomen tenso, presión vesical de 24 mmHg y oliguria reciente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué complicación tiene?","opciones":["Síndrome compartimental abdominal","Necrosis pancreática infectada","Íleo paralítico sin repercusión","Perforación de víscera hueca"],"explicacion":"Una presión intraabdominal sostenida mayor de 20 mmHg con una nueva disfunción orgánica (aquí la oliguria) define el síndrome compartimental abdominal; la sobrecarga de líquidos lo favorece.","fuente":"WSES 2019, pancreatitis aguda grave (Leppäniemi)"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas no quirúrgicas indicás primero?","opciones":["Limitar líquidos, más sedación y drenar la ascitis","Más cristaloides para mejorar la diuresis","Nutrición parenteral total y ayuno","Furosemida en altas dosis como única medida"],"explicacion":"Se limitan líquidos, sedación y vasoactivos a lo mínimo necesario, se drena el líquido intraperitoneal por vía percutánea y, si no alcanza, se profundiza la sedación con relajación antes de descomprimir.","fuente":"WSES 2019, pancreatitis aguda grave"},{"tipo":"Conducta quirúrgica","pregunta":"Pese a esas medidas sigue empeorando. ¿Qué indicás?","opciones":["Laparotomía descompresiva con abdomen abierto","Necrosectomía abierta en el mismo acto","Esperar la cuarta semana para operar","Colecistectomía de urgencia"],"explicacion":"Si el síndrome compartimental no responde al manejo conservador, la descompresión quirúrgica con abdomen abierto es eficaz; sin tratamiento es mortal. No se aprovecha para hacer necrosectomía temprana.","fuente":"WSES 2019, pancreatitis aguda grave"},{"tipo":"Medidas generales","pregunta":"¿Cómo lo alimentás?","opciones":["Nutrición enteral, evitando la parenteral total","Nutrición parenteral total exclusiva por 2 semanas","Ayuno hasta que se normalice la lipasa","Dieta oral normal desde hoy"],"explicacion":"La nutrición enteral previene la falla intestinal y las infecciones y reduce la mortalidad frente a la parenteral total, que debe evitarse; la parenteral parcial completa lo que no se tolera.","fuente":"WSES 2019, pancreatitis aguda grave"}]},{"id":"mama-06","tema":"Patología mamaria","anio":2,"titulo":"Biopsia benigna de un nódulo espiculado","vineta":"Mujer de 49 años. Mamografía: nódulo espiculado de 1,5 cm, BI-RADS 5. La biopsia con aguja gruesa guiada por ecografía informa tejido mamario con fibrosis, sin atipia.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo interpretás el resultado?","opciones":["Discordante con la imagen","Benigno y concordante con la clínica","Diagnóstico de mastopatía fibroquística","Suficiente para dar el alta"],"explicacion":"Una lesión BI-RADS 5 con un resultado benigno inespecífico es discordante: la biopsia probablemente no tomó la lesión.","fuente":"Klimberg y Hunt, Sabiston 2022, cap. 35; Hermes: Evaluación de la patología mamaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Repito la biopsia o indico escisión","Control mamográfico en 6 meses","Alta con mamografía anual","Mastectomía sin diagnóstico"],"explicacion":"Ante una discordancia no se acepta el resultado benigno: se revisa, se repite la muestra o se reseca la lesión.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"¿Qué exige la concordancia triple?","opciones":["Clínica, imagen y patología coherentes entre sí","Tres biopsias de la misma lesión con aguja gruesa","Tres estudios de imagen distintos de la mama","Tres controles anuales sin cambios"],"explicacion":"La concordancia triple exige que el examen, la imagen y la anatomía patológica expliquen la misma lesión; si no, no se acepta un benigno sin revisión.","fuente":"Hermes: Evaluación de la patología mamaria"}]},{"id":"tep-03","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Embolia en una paciente con cáncer de colon","vineta":"Mujer de 63 años con cáncer de colon en quimioterapia. Trombosis venosa profunda proximal y embolia pulmonar segmentaria, hemodinámicamente estable. Función renal normal, sin sangrado activo ni tumor luminal sangrante.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué anticoagulante oral mostró no ser inferior a la dalteparina en el tromboembolismo asociado al cáncer?","opciones":["Apixabán","Warfarina","Aspirina en dosis alta","Clopidogrel"],"explicacion":"En Caravaggio, el apixabán oral no fue inferior a la dalteparina subcutánea para prevenir la recurrencia en el tromboembolismo asociado al cáncer, sin más sangrado mayor.","fuente":"Caravaggio (Agnelli, NEJM 2020;382:1599); Hermes: Tromboembolia venosa perioperatoria"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["10 mg cada 12 horas por 7 días y luego 5 mg cada 12 horas","5 mg cada 12 horas desde el inicio y luego 2,5 mg","10 mg una vez por día durante 6 meses","2,5 mg cada 12 horas por 7 días y luego 10 mg por día"],"explicacion":"Caravaggio usó apixabán 10 mg cada 12 horas durante los primeros 7 días y después 5 mg cada 12 horas.","fuente":"Caravaggio (Agnelli, NEJM 2020;382:1599)"},{"tipo":"Medidas generales","pregunta":"¿Cuánto tiempo se trató en el ensayo?","opciones":["6 meses","7 días","6 semanas","3 años"],"explicacion":"El tratamiento en Caravaggio duró 6 meses; con cáncer activo la anticoagulación suele prolongarse y se reevalúa en forma periódica.","fuente":"Caravaggio (Agnelli, NEJM 2020;382:1599)"}]},{"id":"vb-06","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Colecistitis con ictericia y un cálculo en el bacinete","vineta":"Mujer de 58 años con colecistitis crónica reagudizada e ictericia (bilirrubina 4 mg/dl). La colangiorresonancia muestra un cálculo impactado en el bacinete que comprime el hepático común desde afuera, sin litiasis coledociana.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Síndrome de Mirizzi","Coledocolitiasis impactada","Colangiocarcinoma hiliar","Colangitis esclerosante"],"explicacion":"La compresión extrínseca del hepático común por un cálculo impactado en el bacinete o el cístico, con ictericia, define el Mirizzi. Si hay erosión de la pared y fístula colecistobiliar, se clasifica en tipos más avanzados.","fuente":"Hermes: Síndrome de Mirizzi"},{"tipo":"Conducta quirúrgica","pregunta":"En la cirugía encontrás inflamación densa del triángulo hepatocístico sin poder lograr la visión crítica. ¿Qué hacés?","opciones":["Colecistectomía subtotal o conversión, sin disecar a ciegas","Seguir disecando el triángulo hasta encontrar el cístico","Clipar y seccionar la estructura tubular más gruesa que llegue","Cerrar y derivar sin drenar la vesícula"],"explicacion":"En el Mirizzi el hepático común está pegado al bacinete y es fácil lesionarlo. Sin visión crítica se recurre a una estrategia de rescate: colecistectomía subtotal, conversión o, en tipos con fístula, reparación de la vía biliar.","fuente":"SAGES Safe Cholecystectomy; Hermes: Síndrome de Mirizzi y Colecistectomía subtotal"},{"tipo":"Técnica","pregunta":"Si hubiera una fístula que comprometa más de la mitad de la circunferencia del hepático, ¿qué reparación es la habitual?","opciones":["Hepaticoyeyunostomía en Y de Roux","Sutura primaria del hepático sin tubo","Ligadura del hepático y drenaje externo","Drenaje subhepático sin reparar la vía"],"explicacion":"Las fístulas grandes dejan un defecto que no se cierra sin estenosis; la reconstrucción con hepaticoyeyunostomía es la opción habitual. Los defectos pequeños pueden cerrarse sobre un tubo o con un colgajo de vesícula.","fuente":"Hermes: Síndrome de Mirizzi; Técnica de la anastomosis biliodigestiva"}]},{"id":"lap-01","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Neumoperitoneo en un paciente con cirugías previas","vineta":"Varón de 55 años con laparotomía mediana previa por una perforación. Se programa colecistectomía laparoscópica por litiasis sintomática.","pasos":[{"tipo":"Técnica","pregunta":"¿Cómo hacés el acceso inicial?","opciones":["Técnica abierta de Hasson o acceso en el punto de Palmer","Aguja de Veress umbilical a ciegas, como de rutina","Trocar óptico directo sobre la cicatriz de la laparotomía","Contraindicar la laparoscopia y operar por laparotomía"],"explicacion":"Con cirugía previa hay riesgo de adherencias bajo la cicatriz; se entra con técnica abierta o en un sitio alejado, como el cuadrante superior izquierdo (punto de Palmer).","fuente":"Hermes: Neumoperitoneo con técnica abierta de Hasson; Principios de cirugía laparoscópica"},{"tipo":"Medidas generales","pregunta":"¿Con qué presión de neumoperitoneo trabajás habitualmente?","opciones":["12 a 15 mmHg","25 a 30 mmHg","2 a 4 mmHg","40 mmHg"],"explicacion":"Entre 12 y 15 mmHg se logra espacio de trabajo con repercusión hemodinámica y respiratoria tolerable; presiones mayores reducen el retorno venoso y la ventilación.","fuente":"Hermes: Principios de cirugía laparoscópica"},{"tipo":"Diagnóstico","pregunta":"Al insuflar cae bruscamente la capnografía, hay hipotensión y un soplo en rueda de molino. ¿Qué sospechás?","opciones":["Embolia gaseosa de CO2","Neumotórax a tensión izquierdo","Reacción anafiláctica","Hipotermia grave"],"explicacion":"La caída del CO2 espirado con colapso hemodinámico y soplo en rueda de molino al insuflar indican embolia gaseosa: se suspende la insuflación, se desinfla, se coloca al paciente en decúbito lateral izquierdo con Trendelenburg y se ventila con oxígeno al 100 %.","fuente":"Hermes: Principios de cirugía laparoscópica"}]},{"id":"lap-02","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Identificación segura antes de clipar","vineta":"Colecistectomía laparoscópica programada en una mujer de 45 años. Disecaste el triángulo hepatocístico.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué tres criterios definen la visión crítica de seguridad?","opciones":["Triángulo limpio, tercio inferior separado del lecho y dos estructuras","Ver el colédoco, el hepático común y la arteria hepática propia en el campo","Colangiografía normal, cístico corto y una sola arteria cística","Vesícula vacía, cístico clipado y lecho hepático seco"],"explicacion":"La visión crítica de Strasberg tiene tres criterios; se documenta con foto o video antes de clipar. Su objetivo es evitar la falsa identificación del colédoco como cístico.","fuente":"SAGES Safe Cholecystectomy; Hermes: Prevención de lesiones durante la colecistectomía"},{"tipo":"Estudios","pregunta":"La anatomía sigue dudosa. ¿Qué podés agregar para aclararla?","opciones":["Colangiografía intraoperatoria o fluorescencia con indocianina","Ecografía abdominal de control en la mañana siguiente a la cirugía","TC de abdomen intraoperatoria con contraste","Clipar igual: la visión parcial alcanza"],"explicacion":"Cuando la anatomía no es clara, la colangiografía o la fluorescencia ayudan a identificar los conductos. No sustituyen la visión crítica pero suman información.","fuente":"Hermes: Colangiografía peroperatoria por fluoroscopia y Colangiografía fluorescente con indocianina verde"},{"tipo":"Conducta quirúrgica","pregunta":"Si aun así no lográs la visión crítica, ¿qué hacés?","opciones":["Rescate: colecistectomía subtotal, colecistostomía o conversión","Clipar la estructura que más se parece al cístico y seguir con la disección","Seguir disecando el triángulo el tiempo que haga falta","Seccionar las estructuras que entran en la vesícula"],"explicacion":"Las estrategias de rescate evitan la lesión biliar cuando el triángulo es inseguro. Convertir no siempre resuelve el problema; la subtotal es muchas veces la opción más segura.","fuente":"SAGES Safe Cholecystectomy; Hermes: Colecistectomía subtotal"}]},{"id":"lesbil-01","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"Bilis por el drenaje al segundo día","vineta":"Mujer de 50 años en el día 2 de una colecistectomía laparoscópica. Por el drenaje salen 300 ml/día de bilis. Afebril, sin ictericia, abdomen blando. La colangiorresonancia muestra una vía biliar continua y sin estenosis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué lesión es la más probable?","opciones":["Fuga del cístico o de un conducto de Luschka (Strasberg A)","Sección completa del colédoco (Strasberg E)","Ligadura del hepático común (Strasberg E2)","Lesión lateral del hepático común con estenosis (Strasberg D)"],"explicacion":"Una fuga con vía biliar continua y sin estenosis es una lesión menor, generalmente del muñón cístico o de un conducto accesorio del lecho.","fuente":"WSES 2020, lesión biliar; Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Conducta quirúrgica","pregunta":"La fuga no disminuye. ¿Qué indicás?","opciones":["CPRE con esfinterotomía y prótesis biliar","Hepaticoyeyunostomía en Y de Roux","Relaparotomía y sutura del colédoco","Retirar el drenaje y repetir la ecografía"],"explicacion":"La CPRE baja la presión de la vía biliar y la fuga cierra en la gran mayoría; si hay una colección sin drenaje, se drena por vía percutánea.","fuente":"WSES 2020, lesión biliar"}]},{"id":"lesbil-02","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"Ictericia progresiva y clips sobre el hepático","vineta":"Varón de 42 años, 5 días después de una colecistectomía laparoscópica dificultosa. Ictericia progresiva (bilirrubina 8 mg/dl), fiebre y dolor. Ecografía: vía biliar intrahepática dilatada y colección subhepática. Colangiorresonancia: interrupción completa del hepático común a 2 cm de la confluencia.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tipo de lesión es?","opciones":["Lesión mayor, Strasberg E2","Lesión menor, Strasberg A","Lesión lateral, Strasberg D","Coledocolitiasis residual"],"explicacion":"La pérdida de continuidad de la vía principal es una lesión tipo E; el subtipo depende de la distancia a la confluencia (E1 más de 2 cm, E2 menos de 2 cm).","fuente":"Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés primero?","opciones":["Controlar la sepsis: drenaje percutáneo, antibióticos y soporte","Hepaticoyeyunostomía inmediata en el mismo hospital donde ocurrió la lesión","Observar con antibióticos y repetir la ecografía","Colocar una prótesis por CPRE para unir los extremos"],"explicacion":"Pasadas las primeras 72 horas, con colección e infección, primero se controla la sepsis y se define la anatomía; la reparación se hace con los tejidos en condiciones y por un equipo con experiencia.","fuente":"WSES 2020, lesión biliar; Hermes: Manejo percutáneo de la lesión biliar iatrogénica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es la reparación definitiva?","opciones":["Hepaticoyeyunostomía en Y de Roux, en un centro con experiencia","Anastomosis terminoterminal del colédoco sobre un tubo en T de Kehr","Coledocoduodenostomía laterolateral","Prótesis biliar plástica permanente con recambios por CPRE"],"explicacion":"La hepaticoyeyunostomía en Y de Roux, con mucosa sana y sin tensión, es la reparación estándar de las lesiones tipo E; la anastomosis terminoterminal tiene alta tasa de estenosis.","fuente":"WSES 2020, lesión biliar; Hermes: Hepaticoyeyunostomía"},{"tipo":"Estudios","pregunta":"¿Qué estudio agregás antes de reparar?","opciones":["Angio-TC para evaluar la arteria hepática derecha","Endoscopia digestiva alta para descartar úlcera","Colonoscopia completa para descartar un tumor sincrónico","Gammagrafía ósea corporal total"],"explicacion":"La lesión combinada de la arteria hepática derecha es frecuente en las lesiones altas y condiciona el nivel de la reconstrucción.","fuente":"Hermes: Lesión de la vía biliar principal en colecistectomía"}]},{"id":"tiroides-01","tema":"Patología tiroidea","anio":3,"titulo":"Nódulo tiroideo en una ecografía","vineta":"Mujer de 45 años con un nódulo tiroideo de 1,8 cm, sólido, hipoecoico, con microcalcificaciones y bordes irregulares. TSH normal. Sin adenopatías palpables.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["Punción con aguja fina guiada por ecografía","Centellograma tiroideo con tecnecio","Tiroidectomía total directa sin punción","Control ecográfico en 2 años y luego decidir"],"explicacion":"Un nódulo sólido hipoecoico con microcalcificaciones y bordes irregulares es de alta sospecha; se punza desde 1 cm. El centellograma solo se pide con TSH baja.","fuente":"ATA 2015, nódulo tiroideo; Hermes: Nódulo tiroideo"},{"tipo":"Diagnóstico","pregunta":"La citología es Bethesda VI. ¿Qué significa?","opciones":["Maligno (habitualmente carcinoma papilar)","Benigno (nódulo coloide)","No diagnóstico (muestra insuficiente)","Atipia de significado incierto"],"explicacion":"Bethesda VI es maligno, con más del 95 % de riesgo; la mayoría corresponde a carcinoma papilar.","fuente":"Sistema Bethesda; Hermes: Nódulo tiroideo"},{"tipo":"Estudios","pregunta":"¿Qué estudio hacés antes de operar?","opciones":["Ecografía de los compartimentos ganglionares del cuello","PET-TC de cuerpo entero para estadificar de rutina antes de operar","Tiroglobulina sérica para confirmar el diagnóstico","Centellograma corporal total con yodo"],"explicacion":"La ecografía cervical preoperatoria busca metástasis ganglionares que cambiarían la extensión de la cirugía.","fuente":"ATA 2015, cáncer diferenciado de tiroides"},{"tipo":"Conducta quirúrgica","pregunta":"Es un tumor de 1,8 cm sin extensión extratiroidea ni ganglios. ¿Qué cirugía es aceptable?","opciones":["Lobectomía o tiroidectomía total, decidida con la paciente","Solo tiroidectomía total con vaciamiento central y lateral","Enucleación del nódulo","Vigilancia activa con ecografía cada 6 meses"],"explicacion":"Para tumores de 1 a 4 cm sin extensión extratiroidea ni ganglios, ATA 2015 acepta tanto la lobectomía como la tiroidectomía total; el vaciamiento se reserva para ganglios comprometidos.","fuente":"ATA 2015, cáncer diferenciado de tiroides"}]},{"id":"tiroides-02","tema":"Patología tiroidea","anio":3,"titulo":"Hormigueos después de una tiroidectomía total","vineta":"Mujer de 40 años en el primer día de una tiroidectomía total por bocio. Refiere parestesias peribucales y en los dedos. Signo de Chvostek positivo. Calcio total 7,0 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hipocalcemia por hipoparatiroidismo posoperatorio","Lesión bilateral del nervio laríngeo recurrente","Crisis tirotóxica por manipulación de la glándula","Hematoma cervical con compresión de la vía aérea"],"explicacion":"Parestesias, Chvostek positivo y calcio bajo tras una tiroidectomía total indican hipoparatiroidismo, por lesión o desvascularización de las paratiroides.","fuente":"Hermes: Tiroidectomía"},{"tipo":"Fármaco","pregunta":"Con síntomas y calcio de 7 mg/dl, ¿qué indicás?","opciones":["Gluconato de calcio IV","Calcio oral sin vía IV","Levotiroxina oral","Furosemida y solución salina"],"explicacion":"La hipocalcemia sintomática o grave se trata con calcio IV y monitoreo electrocardiográfico; luego se pasa a calcio oral con calcitriol.","fuente":"Society for Endocrinology 2016, hipocalcemia aguda"},{"tipo":"Dosis","pregunta":"¿Con qué dosis inicial?","opciones":["10 a 20 ml al 10 % diluidos, en unos 10 minutos","100 ml al 10 % en bolo rápido sin diluir","1 ml al 10 % por vía subcutánea, repetible","500 mg de carbonato por vía oral, dosis única"],"explicacion":"Se administran 10 a 20 ml de gluconato de calcio al 10 % en 50 a 100 ml de dextrosa al 5 % en unos 10 minutos, con monitoreo, seguido de una infusión si persiste.","fuente":"Society for Endocrinology 2016, hipocalcemia aguda"},{"tipo":"Medidas generales","pregunta":"Para el alta, ¿qué indicás?","opciones":["Calcio oral y calcitriol, con control de calcio y PTH","Alta sin tratamiento, porque se recupera sola en pocos días","Dieta rica en lácteos sin suplementos","Una dosis única de vitamina D en megadosis"],"explicacion":"El hipoparatiroidismo posoperatorio se maneja con calcio oral y calcitriol; la mayoría es transitorio, y se define como permanente si persiste más de 6 a 12 meses.","fuente":"Hermes: Tiroidectomía"}]},{"id":"tiroides-03","tema":"Patología tiroidea","anio":3,"titulo":"Enfermedad de Graves para cirugía","vineta":"Mujer de 30 años con enfermedad de Graves, bocio grande y oftalmopatía moderada. Recibe metimazol y está eutiroidea. Se decide tiroidectomía total.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué agregás en los días previos a la cirugía?","opciones":["Yoduro de potasio (Lugol o SSKI)","Levotiroxina en dosis supresiva","Iodo radiactivo en dosis baja","Corticoides en dosis altas"],"explicacion":"En la enfermedad de Graves, el yoduro preoperatorio reduce la vascularización de la glándula y el sangrado intraoperatorio.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Medidas generales","pregunta":"¿En qué momento lo indicás?","opciones":["En el preoperatorio inmediato, ya eutiroidea","Un mes antes, en lugar de los antitiroideos","Después de la cirugía, para frenar la tormenta","Solo si sigue hipertiroidea el día de la cirugía"],"explicacion":"ATA 2016 indica un preparado con yoduro de potasio en el preoperatorio inmediato, una vez lograda la eutiroidea con antitiroideos: no los reemplaza. Los esquemas clásicos de unos 10 días son práctica histórica y las gotas varían según el preparado.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Tiroidectomía total","Lobectomía unilateral","Tiroidectomía subtotal bilateral","Istmectomía con biopsia"],"explicacion":"En la enfermedad de Graves se prefiere la tiroidectomía total, porque elimina el riesgo de recurrencia con complicaciones similares a la subtotal.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Dosis","pregunta":"Después, ¿con qué dosis inicial de levotiroxina la reemplazás?","opciones":["Alrededor de 1,6 µg/kg/día, ajustada por TSH","10 µg/kg/día desde el primer día","25 µg por semana, en una sola toma","No necesita reemplazo si queda eutiroidea"],"explicacion":"La dosis de reemplazo completa es cercana a 1,6 µg/kg/día; se ajusta con la TSH a las 6 a 8 semanas.","fuente":"Revisión de levotiroxina tras tiroidectomía (Front Endocrinol 2020;11:626268): dosis empírica de alrededor de 1,6 µg/kg en enfermedad benigna"}]},{"id":"ulcera-01","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Melena y un coágulo en la úlcera","vineta":"Varón de 67 años que toma ibuprofeno por artrosis. Melena e hipotensión que responde a cristaloides. Hemoglobina 7,8 g/dl. Endoscopia a las 12 horas: úlcera bulbar posterior de 1,5 cm con vaso visible no sangrante.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué clasificación de Forrest tiene?","opciones":["Forrest IIa (vaso visible)","Forrest Ia (sangrado en chorro)","Forrest IIc (base pigmentada)","Forrest III (base limpia, sin estigmas)"],"explicacion":"El vaso visible no sangrante es Forrest IIa, de alto riesgo de resangrado, por lo que requiere tratamiento endoscópico.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa; Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Medidas generales","pregunta":"¿Con qué umbral transfundís glóbulos rojos?","opciones":["Hemoglobina menor de 7 g/dl (8 si es cardiópata)","Hemoglobina menor de 10 g/dl, por la edad","Si persiste la hipotensión, sin mirar la hemoglobina","Si la hemoglobina baja de 5 g/dl"],"explicacion":"La estrategia restrictiva, con umbral de 7 g/dl y objetivo de 7 a 9, reduce la mortalidad y el resangrado; en cardiópatas se usa un umbral más alto.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Fármaco","pregunta":"Después de la terapia endoscópica, ¿qué indicás?","opciones":["Inhibidor de la bomba de protones en dosis altas","Antiácidos orales cada 4 horas","Bloqueante H2 (ranitidina) en dosis estándar por vía oral","Sucralfato como protector de la mucosa"],"explicacion":"Tras la hemostasia
