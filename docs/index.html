<title>Pase de sala</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: historia clínica de guardia. Una columna angosta; cada paso es una hoja con su margen rotulado por tipo. */
:root {
  --bg: #EEF3F1;
  --sheet: #FFFFFF;
  --ink: #142320;
  --muted: #586A66;
  --line: #CBD8D4;
  --scrub: #0F5C52;
  --scrub-soft: #DCEBE7;
  --iodine: #B8661A;
  --ok: #2D7A4B;
  --ok-soft: #E1F1E7;
  --bad: #B3261E;
  --bad-soft: #F8E2DF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1513; --sheet: #15201D; --ink: #E3ECE9; --muted: #98ABA6; --line: #2A3A36;
  --scrub: #5FC2B0; --scrub-soft: #1C3530; --iodine: #E8A15A; --ok: #6CCB8E; --ok-soft: #173126;
  --bad: #F08A80; --bad-soft: #3A1C1A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1513; --sheet: #15201D; --ink: #E3ECE9; --muted: #98ABA6; --line: #2A3A36;
  --scrub: #5FC2B0; --scrub-soft: #1C3530; --iodine: #E8A15A; --ok: #6CCB8E; --ok-soft: #173126;
  --bad: #F08A80; --bad-soft: #3A1C1A; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--f-body); margin: 0 }
.app { max-width: 620px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); padding-block: calc(18px + env(safe-area-inset-top)) calc(48px + env(safe-area-inset-bottom)); display: grid; gap: 18px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em }
h2 { font-size: 1.35rem; font-weight: 800 }
h3 { font-size: 1.05rem; font-weight: 600 }
p { margin: 0 }
.eyebrow { font: 600 0.75rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted) }
.muted { color: var(--muted) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--iodine); outline-offset: 2px }
.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-weight: 700; background: var(--scrub); color: var(--sheet); width: 100% }
.btn.sec { background: transparent; color: var(--scrub); box-shadow: inset 0 0 0 2px var(--scrub) }
.btn[disabled] { opacity: .45; cursor: default }
.row { display: flex; gap: 10px; flex-wrap: wrap }
.row > * { flex: 1 1 160px }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap }
.badge { font: 500 0.8rem/1 var(--f-mono); color: var(--scrub); background: var(--scrub-soft); padding: 6px 9px; border-radius: 6px; white-space: nowrap }

/* Resumen de progreso */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px }
.stat b { font: 800 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums }
.stat span { font-size: .82rem; color: var(--muted) }
.bars { display: grid; gap: 12px }
.bar { display: grid; gap: 5px }
.bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem }
.bar-head span:last-child { font: 500 .82rem var(--f-mono); color: var(--muted); white-space: nowrap }
.track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex }
.track i { display: block; height: 100% }
.track .dom { background: var(--scrub) }
.track .vis { background: var(--iodine); opacity: .55 }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px }
.temas { display: grid; gap: 8px }
.tema { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.tema small { display: block; color: var(--muted); font-size: .8rem }
.tema .badge { flex: none }

/* Caso */
.vineta { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; border-top: 6px solid var(--scrub) }
.pasos { display: flex; gap: 5px }
.pasos i { flex: 1; height: 5px; border-radius: 3px; background: var(--line) }
.pasos i.ok { background: var(--ok) } .pasos i.no { background: var(--bad) } .pasos i.act { background: var(--iodine) }
.hoja { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: 30px 1fr; overflow: hidden }
.margen { background: var(--scrub-soft); color: var(--scrub); writing-mode: vertical-rl; transform: rotate(180deg); font: 700 .72rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; padding: 10px 0 }
.hoja-body { padding: 16px; display: grid; gap: 12px; min-width: 0 }
.ops { display: grid; gap: 8px }
.op { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; line-height: 1.35 }
.op.dosis { font-family: var(--f-mono); font-size: .92rem }
.op:not([disabled]):hover { border-color: var(--scrub) }
.op.ok { border-color: var(--ok); background: var(--ok-soft) }
.op.no { border-color: var(--bad); background: var(--bad-soft) }
.op[disabled] { cursor: default }
.feedback { border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: var(--bg); border-left: 4px solid var(--ok) }
.feedback.no { border-left-color: var(--bad) }
.feedback strong { font-family: var(--f-display) }
.fuente { font-size: .85rem; color: var(--muted) }
.fuente::before { content: "Fuente: "; font-weight: 700; color: var(--ink) }

/* Resumen del caso */
.res-list { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.res-list li { display: flex; gap: 10px; align-items: baseline }
.res-list .m { font: 500 .82rem var(--f-mono); flex: none; width: 1.4em }
.res-list .ok { color: var(--ok) } .res-list .no { color: var(--bad) }
.next-review { font: 500 .9rem var(--f-mono); color: var(--scrub) }
details { font-size: .9rem }
summary { cursor: pointer; color: var(--muted) }
textarea { width: 100%; min-height: 80px; font: .8rem var(--f-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px }
.msg { font-size: .85rem; color: var(--scrub) }
@media (prefers-reduced-motion: no-preference) { .hoja, .feedback { animation: in .18s ease-out } @keyframes in { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }
</style>

<script>
const CASOS = [{"id":"base-01","tema":"Respuesta a la injuria y medio interno","anio":1,"titulo":"Hiperglucemia en el posoperatorio","vineta":"Varón de 61 años sin diabetes conocida, en el día 1 de una hemicolectomía derecha. Glucemias capilares de 220 y 245 mg/dl. Hemodinámicamente estable, tolera líquidos.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo interpretás la hiperglucemia?","opciones":["Hiperglucemia de estrés por la respuesta a la agresión quirúrgica","Diabetes tipo 1 de debut desencadenada por la cirugía","Un valor esperable y sin importancia clínica en el posoperatorio inmediato","Efecto de la solución glucosada de mantenimiento que recibe"],"explicacion":"La cirugía activa el eje hipotálamo-hipofisario-suprarrenal y la respuesta inflamatoria: suben cortisol, catecolaminas y glucagón, y aparece resistencia a la insulina. La hiperglucemia resultante se asocia con más infección y complicaciones aunque el paciente no sea diabético.","fuente":"Hermes: Respuesta inflamatoria a la agresión quirúrgica"},{"tipo":"Fármaco","pregunta":"¿Cómo la tratás?","opciones":["Insulina basal con correcciones, con objetivo de 140 a 180 mg/dl","Metformina oral desde hoy y control con endocrinología después del alta","Escala de insulina corriente sola, cuando supere 300 mg/dl","Infusión de insulina para mantener entre 80 y 110 mg/dl"],"explicacion":"En pacientes internados no críticos el objetivo es 140 a 180 mg/dl con insulina basal y correcciones. Las escalas reactivas solas tienen peor control, la metformina no se usa en el posoperatorio inmediato y el control estricto (80 a 110) aumentó la hipoglucemia y la mortalidad en el ensayo NICE-SUGAR.","fuente":"ADA Standards of Care, atención hospitalaria; ensayo NICE-SUGAR"},{"tipo":"Medidas generales","pregunta":"¿Qué medida perioperatoria contribuye a limitar la respuesta metabólica?","opciones":["Recuperación mejorada: ayuno corto, alimentación y movilización tempranas","Ayuno hasta que aparezcan ruidos intestinales y eliminación de gases","Reposo en cama durante las primeras 72 horas para reducir el gasto energético","Sonda nasogástrica de rutina hasta que disminuya el débito"],"explicacion":"Los protocolos de recuperación mejorada reducen la resistencia a la insulina y el catabolismo evitando el ayuno prolongado, sondas y reposo innecesarios, e iniciando alimentación y movilización tempranas.","fuente":"Hermes: Recuperación perioperatoria en cirugía digestiva"}]},{"id":"base-02","tema":"Respuesta a la injuria y medio interno","anio":1,"titulo":"Debilidad y ondas T picudas","vineta":"Mujer de 74 años con insuficiencia renal crónica, en el día 2 de una laparotomía por oclusión. Diuresis 15 ml/h en las últimas 6 horas, debilidad. Potasio 7,1 mEq/l; el ECG muestra ondas T picudas y QRS ensanchado.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y qué urgencia tiene?","opciones":["Hiperpotasemia grave con cambios en el ECG: emergencia","Hiperpotasemia leve: repetir el ionograma de control en 24 horas","Probable muestra hemolizada: repetir antes de tratar","Hipopotasemia por pérdidas digestivas posoperatorias"],"explicacion":"Un potasio de 6,5 mEq/l o más, o cualquier valor elevado con cambios en el ECG (T picudas, QRS ancho), es una emergencia por riesgo de arritmia. Se trata sin esperar una nueva muestra, aunque se puede confirmar en paralelo.","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"},{"tipo":"Fármaco","pregunta":"¿Qué indicás primero para proteger el miocardio?","opciones":["Gluconato de calcio al 10 %","Furosemida","Resina de intercambio (poliestireno sulfonato)","Bicarbonato de sodio como única medida"],"explicacion":"El calcio estabiliza la membrana del miocardio en minutos, pero no baja el potasio. Después se desplaza el potasio al interior de la célula (insulina con glucosa, salbutamol) y se elimina (diálisis, diuréticos si hay diuresis, resinas).","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"},{"tipo":"Dosis","pregunta":"¿Con qué dosis?","opciones":["30 ml de gluconato de calcio al 10 % IV en 10 minutos","3 ml de gluconato de calcio al 10 % IV","30 ml de gluconato de calcio al 10 % por vía oral","100 ml de gluconato de calcio al 10 % en bolo rápido"],"explicacion":"La guía británica indica 30 ml de gluconato de calcio al 10 % IV en 10 minutos, repetible si persisten los cambios del ECG. La vía oral no sirve y un bolo masivo rápido arriesga arritmia.","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"},{"tipo":"Fármaco","pregunta":"¿Cómo bajás el potasio rápidamente?","opciones":["10 U de insulina corriente con 25 g de glucosa IV, controlando glucemias","10 U de insulina corriente IV sin glucosa, para no elevar todavía más la glucemia","100 U de insulina corriente IV en bolo, con controles horarios","25 g de glucosa IV sola, para estimular la insulina endógena"],"explicacion":"La insulina mete el potasio en la célula; la glucosa evita la hipoglucemia. Si la glucemia previa es menor de 7 mmol/l (126 mg/dl), se continúa con glucosa al 10 % a 50 ml/h durante 5 horas. Con oliguria y falla renal, planificar diálisis.","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"}]},{"id":"base-03","tema":"Respuesta a la injuria y medio interno","anio":1,"titulo":"Confusión y convulsión después de una resección","vineta":"Mujer de 58 años en el día 1 de una resección de colon, con hidratación por solución glucosada hipotónica. Presenta confusión, vómitos y una convulsión breve. Sodio 118 mEq/l; el día previo era 136 mEq/l.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hiponatremia aguda con síntomas graves","Hiponatremia crónica asintomática","Hipernatremia por deshidratación","Pseudohiponatremia por hiperlipidemia"],"explicacion":"Una caída de 18 mEq/l en menos de 48 horas es aguda. Vómitos, convulsiones, somnolencia o distrés cardiorrespiratorio son síntomas graves por edema cerebral, y cambian la conducta: se corrige de inmediato con solución hipertónica.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"},{"tipo":"Fármaco","pregunta":"¿Qué indicás?","opciones":["Solución salina hipertónica al 3 %","Restricción hídrica sola","Solución fisiológica al 0,9 % a 42 ml/h","Tolvaptán"],"explicacion":"Con síntomas graves se usa solución al 3 % en bolos. La restricción hídrica o la solución fisiológica son lentas e insuficientes, y los vaptanes no están indicados en la emergencia. Suspendé las soluciones hipotónicas.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["150 ml al 3 % en 20 minutos, repetible según el sodio","500 ml al 3 % en 1 hora y control a las 6 horas","1000 ml al 3 % en infusión continua durante las próximas 24 horas","50 ml al 3 % por día hasta normalizar el sodio"],"explicacion":"Se administran bolos de 150 ml de solución al 3 % en 20 minutos, controlando el sodio entre bolos, hasta lograr una suba de 5 mEq/l o mejoría de los síntomas.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el límite de corrección?","opciones":["No más de 10 mEq/l en 24 horas y 8 mEq/l en las 24 siguientes","Normalizar el sodio dentro de las primeras 6 horas","No hay límite porque la hiponatremia es aguda","Hasta 20 mEq/l en las primeras 24 horas si persisten los síntomas graves"],"explicacion":"Superar 10 mEq/l en 24 horas aumenta el riesgo de desmielinización osmótica. Tras la mejoría se mantiene una vía con solución fisiológica mínima y se trata la causa.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"}]},{"id":"base-04","tema":"Shock","anio":1,"titulo":"Fiebre e hipotensión en el día 5","vineta":"Varón de 66 años en el día 5 de una gastrectomía. Fiebre de 39 °C, frecuencia cardíaca 118, presión 82/45 mmHg, frecuencia respiratoria 26, confuso. Lactato 4,6 mmol/l. Peso 80 kg.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tipo de shock es más probable?","opciones":["Shock séptico de probable origen abdominal","Shock cardiogénico por infarto perioperatorio","Shock hipovolémico por hemorragia digestiva","Shock neurogénico por la analgesia peridural"],"explicacion":"Fiebre, taquicardia, hipotensión, confusión e hiperlactatemia en el día 5 de una anastomosis digestiva sugieren sepsis por fuga. El mecanismo es distributivo, aunque puede coexistir con hipovolemia.","fuente":"Hermes: Shock en el paciente quirúrgico"},{"tipo":"Medidas generales","pregunta":"¿Qué reposición inicial indicás?","opciones":["Cristaloides 30 ml/kg (unos 2,4 l) en 3 horas, reevaluando la respuesta","Un litro de coloide en 24 horas, para limitar el edema intestinal","Restricción de líquidos por riesgo de edema de la anastomosis","Albúmina al 20 % como primera elección, con 200 ml en la primera hora y reevaluar"],"explicacion":"La Surviving Sepsis Campaign sugiere al menos 30 ml/kg de cristaloides en las primeras 3 horas en la hipoperfusión por sepsis, preferentemente balanceados, reevaluando la respuesta para evitar la sobrecarga.","fuente":"Surviving Sepsis Campaign 2021"},{"tipo":"Fármaco","pregunta":"Persiste con presión arterial media de 58 mmHg tras los líquidos. ¿Qué agregás?","opciones":["Noradrenalina con objetivo de PAM de 65 mmHg","Dopamina como primera elección por su efecto inotrópico","Dobutamina sola en infusión continua titulada","Más cristaloides, hasta normalizar el lactato"],"explicacion":"La noradrenalina es el vasopresor de primera línea y el objetivo inicial es una PAM de 65 mmHg. Puede iniciarse por vía periférica mientras se coloca un acceso central.","fuente":"Surviving Sepsis Campaign 2021"},{"tipo":"Fármaco","pregunta":"¿Cuándo iniciás el antibiótico?","opciones":["Dentro de la primera hora, tras hemocultivos si no lo demoran","Después de la TC, una vez identificado y drenado el foco abdominal","Después de confirmar la fuga en la cirugía","Cuando lleguen los cultivos, para dirigir el tratamiento"],"explicacion":"En el shock séptico el antibiótico se administra idealmente dentro de la primera hora. Los cultivos se toman antes solo si no lo demoran. Cada hora de retraso aumenta la mortalidad.","fuente":"Surviving Sepsis Campaign 2021"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué es lo que define el pronóstico además del soporte?","opciones":["El control temprano del foco (drenaje o reoperación)","La duración total del esquema antibiótico","La corrección del lactato con bicarbonato de sodio","La monitorización con catéter de arteria pulmonar desde el ingreso"],"explicacion":"Sin control del foco el antibiótico y los vasopresores no alcanzan. Se busca la fuente con TC si la estabilidad lo permite y se drena o reopera lo antes posible.","fuente":"Surviving Sepsis Campaign 2021; Hermes: Infección intraabdominal y peritonitis"}]},{"id":"base-05","tema":"Shock","anio":1,"titulo":"Hipotensión después del antibiótico","vineta":"Mujer de 35 años en quirófano. A los 2 minutos de recibir cefazolina presenta eritema generalizado, broncoespasmo y presión de 70/40 mmHg.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué ocurre?","opciones":["Anafilaxia (shock distributivo)","Hipovolemia por el ayuno preoperatorio","Reacción vasovagal","Neumotórax a tensión"],"explicacion":"Compromiso cutáneo, respiratorio y cardiovascular minutos después de un fármaco es anafilaxia. En quirófano los desencadenantes más frecuentes son relajantes musculares, antibióticos, clorhexidina y látex.","fuente":"WAO, guía de anafilaxia 2020"},{"tipo":"Fármaco","pregunta":"¿Cuál es el fármaco de primera línea?","opciones":["Adrenalina","Difenhidramina","Hidrocortisona","Salbutamol inhalado"],"explicacion":"La adrenalina es el único fármaco que revierte la anafilaxia y no debe demorarse. Antihistamínicos y corticoides son coadyuvantes que no tratan el shock.","fuente":"WAO, guía de anafilaxia 2020"},{"tipo":"Dosis","pregunta":"¿Qué dosis inicial de adrenalina si no tiene vía de infusión titulada?","opciones":["0,5 mg IM en el muslo, repetible a los 5 minutos","1 mg IV en bolo, como en el paro cardiorrespiratorio","5 mg IM en el deltoides, en dosis única y sin repetir","0,05 mg subcutáneo en el brazo, repetible cada hora"],"explicacion":"La dosis IM en adultos es 0,01 mg/kg hasta 0,5 mg, en el muslo, repetible cada 5 a 15 minutos. El bolo IV de 1 mg es la dosis de paro cardíaco y en un paciente con pulso puede causar arritmias; en quirófano el anestesiólogo puede titular bolos IV pequeños.","fuente":"WAO, guía de anafilaxia 2020"},{"tipo":"Medidas generales","pregunta":"¿Qué más hacés?","opciones":["Suspender el agente, oxígeno, cristaloides en bolo y documentar el evento","Seguir con la cirugía sin cambios en cuanto se estabilice la presión arterial","Administrar el mismo antibiótico, pero en infusión más lenta","Dar el alta al recuperarse, sin necesidad de documentar"],"explicacion":"Se retira el desencadenante, se administra oxígeno y volumen y, si se recupera, se documenta el evento y se solicita triptasa y estudio alergológico para evitar la reexposición.","fuente":"WAO, guía de anafilaxia 2020"}]},{"id":"base-06","tema":"Infección en cirugía","anio":1,"titulo":"Herida enrojecida en el día 5","vineta":"Mujer de 52 años en el día 5 de una laparotomía mediana. Dolor, eritema y secreción purulenta en el tercio inferior de la herida. Temperatura 37,6 °C, sin taquicardia ni hipotensión. Fascia íntegra al examen.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Infección superficial del sitio quirúrgico","Infección de órgano o espacio (absceso profundo)","Dehiscencia aponeurótica con evisceración contenida","Fascitis necrosante de la pared abdominal anterior"],"explicacion":"Pus en la piel y el celular subcutáneo dentro de los 30 días, con fascia íntegra, define la infección incisional superficial. Si se sospecha disrupción de la fascia o colección profunda, hay que estudiarla.","fuente":"Hermes: Infección del sitio quirúrgico; WSES/SIS-E 2018"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Abrir la herida, drenar, irrigar y curar","Antibióticos orales sin abrir la herida y control en 48 horas","Punzar con aguja y dejar cerrada","Reoperar para lavado peritoneal"],"explicacion":"La infección superficial se trata abriendo amplia y rápidamente la incisión. Sin la apertura, el antibiótico solo no resuelve la colección.","fuente":"WSES/SIS-E 2018, infecciones de piel y partes blandas"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No, salvo signos sistémicos o inmunocompromiso","Sí, cefalexina por vía oral durante 7 días","Sí, vancomicina empírica por el riesgo de SAMR","Sí, una dosis única de cefazolina antes de abrirla"],"explicacion":"Abierta la herida, la infección superficial suele manejarse sin antibióticos. Se reservan para signos sistémicos, falla orgánica o inmunocompromiso, cubriendo cocos grampositivos o la flora del sitio operado.","fuente":"WSES/SIS-E 2018, recomendación 1C"},{"tipo":"Medidas generales","pregunta":"¿Cómo seguís la herida?","opciones":["Curaciones con lavado; cierre diferido o presión negativa cuando esté limpia","Cerrarla de inmediato con puntos de colchonero para acortar la internación","Dejarla expuesta y sin curaciones, para que se seque y granule más rápido","Rellenarla con gasa seca y no cambiarla por una semana"],"explicacion":"La herida abierta cicatriza por segunda intención o se cierra en forma diferida cuando está limpia. La presión negativa reduce el tamaño y los cambios de curación en heridas grandes.","fuente":"Hermes: Infección del sitio quirúrgico"}]},{"id":"base-07","tema":"Infección en cirugía","anio":1,"titulo":"Dolor desproporcionado en un muslo","vineta":"Varón de 55 años diabético. Dolor intenso en el muslo derecho de 24 horas, mucho mayor que lo que muestra el eritema, con edema que lo excede, una bulla violácea y crepitación. Presión 88/50 mmHg. Leucocitos 22.000/mm³, sodio 131 mEq/l.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Infección necrosante de partes blandas","Celulitis simple de miembro inferior","Trombosis venosa profunda femoral","Erisipela ampollar"],"explicacion":"Dolor desproporcionado, edema más allá del eritema, bullas, crepitación e hipotensión son signos de alarma de infección necrosante. La piel inicial puede parecer una celulitis y la ausencia de gas no la excluye.","fuente":"WSES/SIS-E 2018; Hermes: Infecciones necrosantes de tejidos blandos"},{"tipo":"Estudios","pregunta":"¿Necesitás una TC o el puntaje LRINEC antes de operar?","opciones":["No: la imagen o un puntaje no deben demorar la cirugía","Sí, un LRINEC de 6 o más para confirmar la indicación quirúrgica","Sí, una TC para buscar gas antes de operar","Sí, una resonancia para definir la extensión"],"explicacion":"El LRINEC no sirve para descartar (sensibilidad cercana al 68 %) y la imagen solo se usa si no demora la operación. Ante alta sospecha clínica y shock, el diagnóstico se confirma en el quirófano.","fuente":"WSES/SIS-E 2018"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Desbridamiento quirúrgico inmediato con reexploración a las 24 a 48 horas","Antibióticos de amplio espectro y reevaluar a las 24 horas","Oxigenoterapia hiperbárica como tratamiento principal y cirugía si progresa","Drenaje percutáneo guiado por ecografía de la colección"],"explicacion":"El desbridamiento temprano y completo es lo que cambia la mortalidad; la demora de más de 12 horas la aumenta. Se reexplora hasta controlar la progresión. El oxígeno hiperbárico nunca reemplaza la cirugía.","fuente":"WSES/SIS-E 2018, recomendación 1B"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico empírico usás?","opciones":["Piperacilina-tazobactam más vancomicina más clindamicina","Cefalexina por vía oral más trimetoprima-sulfametoxazol","Ciprofloxacina IV más metronidazol","Metronidazol IV en monoterapia"],"explicacion":"Se necesita cobertura amplia contra grampositivos incluido SAMR, gramnegativos y anaerobios. La clindamicina se agrega para inhibir la producción de toxinas del estreptococo y el clostridio.","fuente":"IDSA 2014, infecciones de piel y partes blandas; WSES/SIS-E 2018"},{"tipo":"Dosis","pregunta":"¿Qué dosis de clindamicina?","opciones":["600 a 900 mg IV cada 8 horas","150 mg VO cada 12 horas","2 g IV cada 24 horas","300 mg IM en dosis única"],"explicacion":"Para la infección necrosante se usan 600 a 900 mg IV cada 8 horas, combinados con los demás agentes; las dosis orales o únicas no alcanzan.","fuente":"IDSA 2014, infecciones de piel y partes blandas"}]},{"id":"base-08","tema":"Infección en cirugía","anio":1,"titulo":"Celulitis de una pierna","vineta":"Mujer de 45 años sin comorbilidades. Eritema caliente y doloroso en la pierna izquierda de 2 días, de bordes poco definidos, sin colección ni puerta purulenta. Afebril, signos vitales normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Celulitis no purulenta leve","Absceso subcutáneo en formación","Infección necrosante de partes blandas","Tromboflebitis superficial de la safena"],"explicacion":"Eritema y calor sin colección ni pus, en una paciente sin toxicidad, es una celulitis no purulenta leve, causada habitualmente por estreptococo.","fuente":"IDSA 2014, infecciones de piel y partes blandas"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás?","opciones":["Cefalexina por vía oral","Vancomicina IV","Ciprofloxacina","No requiere antibiótico"],"explicacion":"En la celulitis leve sin comorbilidad y donde el SAMR comunitario no es prevalente, alcanza un betalactámico oral activo contra estreptococo. Las quinolonas no son primera línea.","fuente":"WSES/SIS-E 2018; IDSA 2014"},{"tipo":"Dosis","pregunta":"¿Con qué esquema y duración?","opciones":["500 mg VO cada 6 horas durante 5 días","250 mg VO cada 24 horas durante 3 días","1 g VO cada 6 horas durante 21 días seguidos","500 mg VO una vez por día durante 10 días"],"explicacion":"La IDSA recomienda 5 días de tratamiento, extendiéndolo si la infección no mejoró. La cefalexina se indica 500 mg cada 6 horas.","fuente":"IDSA 2014, infecciones de piel y partes blandas"},{"tipo":"Medidas generales","pregunta":"¿Qué medida agregás?","opciones":["Elevar el miembro y tratar el intertrigo o las fisuras","Reposo en cama con vendaje compresivo ajustado sobre la zona","Aplicar calor seco intenso varias veces por día sobre el eritema","No agrego medidas locales: alcanza con el antibiótico oral"],"explicacion":"La elevación acelera la resolución del edema, y tratar el intertrigo o las fisuras interdigitales reduce las recurrencias.","fuente":"IDSA 2014, infecciones de piel y partes blandas"}]},{"id":"base-09","tema":"Soporte nutricional","anio":1,"titulo":"Desnutrición antes de una gastrectomía","vineta":"Varón de 68 años con adenocarcinoma gástrico que obstruye parcialmente el píloro. Perdió 14 % del peso en 3 meses, IMC 18, come menos de la mitad de lo habitual. Programado para gastrectomía.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es su riesgo nutricional?","opciones":["Riesgo grave por pérdida de peso e IMC bajo","Riesgo bajo: la albúmina define el estado nutricional","Sin riesgo nutricional, porque el IMC es mayor de 17","Riesgo moderado sin necesidad de intervención"],"explicacion":"Pérdida de peso mayor del 10 al 15 % en 6 meses, IMC menor de 18,5 o ingesta muy reducida definen riesgo grave. La albúmina refleja inflamación más que reservas y no sirve sola para diagnosticar desnutrición.","fuente":"ESPEN 2017, nutrición clínica en cirugía; Hermes: Soporte nutricional del paciente quirúrgico"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés antes de operar?","opciones":["Soporte nutricional 7 a 14 días antes, aunque haya que diferir la cirugía","Operar de inmediato sin soporte y alimentar por yeyunostomía después de la resección","Infundir albúmina hasta normalizarla y operar en la semana","Esperar 3 meses de recuperación del peso antes de operar"],"explicacion":"ESPEN indica que el paciente con riesgo nutricional grave reciba soporte de 7 a 14 días antes de la cirugía mayor, aun demorándola, porque reduce complicaciones. Por obstrucción, la vía puede ser enteral distal o parenteral.","fuente":"ESPEN 2017, nutrición clínica en cirugía"},{"tipo":"Dosis","pregunta":"¿Qué objetivos calórico y proteico indicás?","opciones":["25 a 30 kcal/kg/día y 1,5 g/kg/día de proteínas","40 a 50 kcal/kg/día y 0,5 g/kg/día de proteínas","15 kcal/kg/día y 3 g/kg/día de proteínas","35 kcal/kg/día sin aporte proteico"],"explicacion":"Para el paciente quirúrgico ESPEN propone 25 a 30 kcal/kg/día y alrededor de 1,5 g/kg/día de proteínas, ajustando según la respuesta.","fuente":"ESPEN 2021, guía práctica de nutrición en cirugía"},{"tipo":"Fármaco","pregunta":"Lleva 10 días casi sin comer. ¿Qué precaución tomás al iniciar la nutrición?","opciones":["Aporte inicial bajo, tiamina antes y control de fósforo, potasio y magnesio","Empezar directamente con el aporte total calculado para su peso","Restringir el fósforo de la fórmula para evitar la hiperfosfatemia","Indicar la fórmula completa desde el inicio y controlar electrolitos una vez por semana"],"explicacion":"La realimentación puede causar hipofosfatemia grave, arritmias y falla cardíaca. En pacientes de alto riesgo NICE sugiere empezar con un máximo de 10 kcal/kg/día, suplementar tiamina antes de alimentar y aumentar progresivamente con control de electrolitos.","fuente":"NICE CG32, soporte nutricional en adultos"}]},{"id":"base-10","tema":"Hemostasia y trombosis","anio":1,"titulo":"Tromboprofilaxis tras cirugía oncológica","vineta":"Mujer de 64 años, IMC 32, operada de una resección anterior de recto por cáncer (3 horas de cirugía). Puntaje de Caprini de 7. Sin sangrado activo y función renal normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo de tromboembolismo tiene?","opciones":["Alto (Caprini de 5 o más)","Bajo (Caprini de 1 a 2)","Moderado (Caprini de 3 a 4)","Muy bajo (Caprini de 0)"],"explicacion":"Edad, cáncer, cirugía mayor prolongada y obesidad suman un Caprini de 5 o más, que es riesgo alto. En ese grupo se combina profilaxis farmacológica con métodos mecánicos.","fuente":"ACCP 2012, prevención de TEV en cirugía no ortopédica"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis indicás?","opciones":["Heparina de bajo peso molecular más compresión mecánica","Deambulación temprana y medias elásticas","Aspirina 100 mg más compresión neumática","Warfarina con objetivo de RIN entre 2 y 3 desde el día 1"],"explicacion":"En riesgo alto sin alto riesgo de sangrado se recomienda heparina de bajo peso molecular, agregando medias o compresión neumática intermitente.","fuente":"ACCP 2012, prevención de TEV en cirugía no ortopédica"},{"tipo":"Dosis","pregunta":"¿Qué dosis de enoxaparina?","opciones":["40 mg subcutánea cada 24 horas","1 mg/kg subcutánea cada 12 horas","20 mg subcutánea por semana","80 mg IV cada 6 horas"],"explicacion":"La dosis profiláctica es 40 mg una vez por día. 1 mg/kg cada 12 horas es la dosis terapéutica. En obesidad mórbida o insuficiencia renal se ajusta.","fuente":"ACCP 2012; ficha técnica de enoxaparina"},{"tipo":"Medidas generales","pregunta":"¿Cuánto tiempo la indicás?","opciones":["Durante 4 semanas","Hasta el alta","Hasta que deambule","Durante 6 meses"],"explicacion":"Tras cirugía abdominal o pélvica por cáncer se recomienda prolongar la heparina de bajo peso molecular durante 4 semanas, porque el riesgo persiste después del alta.","fuente":"ACCP 2012, prevención de TEV en cirugía no ortopédica"}]},{"id":"base-11","tema":"Hemostasia y trombosis","anio":1,"titulo":"Paciente anticoagulado que se opera","vineta":"Varón de 70 años con fibrilación auricular tratado con apixabán 5 mg cada 12 horas, función renal normal. Programado para una hemicolectomía (cirugía de alto riesgo de sangrado).","pasos":[{"tipo":"Medidas generales","pregunta":"¿Cuándo suspendés el apixabán?","opciones":["2 días antes (última dosis 3 días antes)","El mismo día de la cirugía, a la mañana","7 días antes, como con la aspirina","No se suspende: se opera anticoagulado"],"explicacion":"En el estudio PAUSE, para cirugía de alto riesgo de sangrado se omitió el apixabán 2 días antes de la cirugía, sin puente con heparina, con baja tasa de sangrado y de tromboembolia.","fuente":"Estudio PAUSE (Douketis, 2019)"},{"tipo":"Fármaco","pregunta":"¿Indicás puente con heparina?","opciones":["No: los anticoagulantes directos no requieren puente","Sí, enoxaparina terapéutica hasta 24 horas antes","Sí, heparina no fraccionada en infusión continua","Sí, vitamina K para revertir el efecto antes de operar"],"explicacion":"Por su vida media corta, los anticoagulantes directos se suspenden y se reinician sin puente. El puente aumenta el sangrado sin reducir los eventos tromboembólicos.","fuente":"Estudio PAUSE (Douketis, 2019)"},{"tipo":"Medidas generales","pregunta":"¿Cuándo lo reiniciás?","opciones":["A las 48 a 72 horas, con hemostasia asegurada","A las 6 horas de terminada la cirugía","A los 30 días, cuando vuelva al control posoperatorio","Lo reemplazo por aspirina tras la cirugía"],"explicacion":"Tras cirugía de alto riesgo de sangrado el anticoagulante se reinicia a las 48 a 72 horas; mientras tanto se usa profilaxis de TEV a dosis profiláctica si corresponde.","fuente":"Estudio PAUSE (Douketis, 2019)"}]},{"id":"base-12","tema":"Anestesia y dolor","anio":1,"titulo":"Lipoma bajo anestesia local","vineta":"Varón de 70 kg al que vas a resecar un lipoma de 6 cm en la espalda con lidocaína. Durante la infiltración refiere sabor metálico, parestesias peribucales y luego convulsiona.","pasos":[{"tipo":"Dosis","pregunta":"Antes de infiltrar: ¿cuál es la dosis máxima de lidocaína con adrenalina?","opciones":["7 mg/kg (unos 490 mg)","4,5 mg/kg (unos 315 mg)","15 mg/kg (unos 1.050 mg)","1 mg/kg (unos 70 mg en total)"],"explicacion":"La dosis máxima de lidocaína es 4,5 mg/kg sin adrenalina (hasta 300 mg) y 7 mg/kg con adrenalina (hasta 500 mg). Lidocaína al 1 % tiene 10 mg/ml: en 70 kg, unos 49 ml con adrenalina.","fuente":"Ficha técnica de lidocaína; ASRA 2020"},{"tipo":"Diagnóstico","pregunta":"¿Qué ocurre?","opciones":["Toxicidad sistémica por anestésico local","Crisis de ansiedad con hiperventilación","Hipoglucemia por ayuno prolongado","Reacción alérgica a la lidocaína"],"explicacion":"Sabor metálico, parestesias peribucales, acúfenos, agitación y convulsiones, que pueden seguir de arritmias y paro, son la toxicidad sistémica por inyección intravascular o sobredosis.","fuente":"ASRA 2020, toxicidad sistémica por anestésicos locales"},{"tipo":"Fármaco","pregunta":"Además de detener la infiltración y asegurar la vía aérea, ¿qué tratamiento específico indicás?","opciones":["Emulsión lipídica al 20 %","Lidocaína IV como antiarrítmico","Propofol a dosis altas como antídoto","Flumazenil"],"explicacion":"La emulsión lipídica al 20 % es el tratamiento específico. Las convulsiones se tratan con benzodiacepinas; se evitan la lidocaína como antiarrítmico y las dosis altas de propofol, que deprimen el miocardio.","fuente":"ASRA 2020, toxicidad sistémica por anestésicos locales"},{"tipo":"Dosis","pregunta":"¿Con qué dosis inicial?","opciones":["Bolo de 1,5 ml/kg en 2 a 3 minutos y luego infusión","10 ml en bolo único, sin infusión posterior","500 ml en 1 minuto y repetir si no responde","0,1 ml/kg en bolo, repetido cada 30 minutos hasta 3 dosis"],"explicacion":"ASRA indica un bolo de 1,5 ml/kg de emulsión al 20 % (100 ml en mayores de 70 kg) seguido de infusión de 0,25 ml/kg/min, repitiendo el bolo si persiste la inestabilidad.","fuente":"ASRA 2020, toxicidad sistémica por anestésicos locales"}]},{"id":"base-13","tema":"Anestesia y dolor","anio":1,"titulo":"Analgesia y náuseas en el posoperatorio","vineta":"Mujer de 34 años, no fumadora, con antecedente de náuseas tras una cirugía previa. Le van a hacer una colecistectomía laparoscópica. Peso 62 kg, función renal y hepática normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo de náuseas y vómitos posoperatorios tiene?","opciones":["Alto: suma varios factores de Apfel","Bajo: tiene un solo factor de Apfel","Nulo, porque la cirugía es corta","Depende solo de si recibe óxido nitroso"],"explicacion":"El puntaje de Apfel suma sexo femenino, no fumar, antecedente de náuseas posoperatorias o cinetosis y uso de opioides. Con 3 o 4 factores el riesgo supera el 60 % y se usan dos o más antieméticos profilácticos.","fuente":"Cuarto consenso de náuseas y vómitos posoperatorios (Gan, 2020)"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis indicás?","opciones":["Dexametasona en la inducción y ondansetrón al final","Ondansetrón solo si vomita en recuperación","Metoclopramida 10 mg única al despertar","Sin profilaxis: se tratan los vómitos si aparecen"],"explicacion":"En riesgo alto se combinan al menos dos antieméticos de distinta clase. La dexametasona se da en la inducción y el ondansetrón al final de la cirugía.","fuente":"Cuarto consenso de náuseas y vómitos posoperatorios (Gan, 2020)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de ondansetrón?","opciones":["4 mg IV","40 mg IV","0,4 mg IV","16 mg IV cada 4 horas"],"explicacion":"La dosis profiláctica de ondansetrón es 4 mg IV al final de la cirugía; la de dexametasona, 4 a 8 mg IV en la inducción.","fuente":"Cuarto consenso de náuseas y vómitos posoperatorios (Gan, 2020)"},{"tipo":"Fármaco","pregunta":"¿Qué analgesia base indicás?","opciones":["Paracetamol 1 g cada 6 horas más un AINE, con opioide de rescate","Morfina en horario fijo cada 4 horas como analgesia principal del posoperatorio","Paracetamol 2 g cada 4 horas más tramadol de rescate","Sin analgesia pautada: opioides a demanda si refiere dolor"],"explicacion":"La analgesia multimodal combina paracetamol (1 g cada 6 horas, máximo 4 g/día) con AINE y anestesia local en los trocares, dejando los opioides para el rescate; reduce náuseas, íleo y sedación.","fuente":"Hermes: Dolor perioperatorio; ficha técnica de paracetamol"}]},{"id":"base-14","tema":"Heridas y cicatrización","anio":1,"titulo":"Herida sucia en un trabajador rural","vineta":"Varón de 50 años, trabajador rural. Herida cortante de 6 cm en la pierna con un alambre, contaminada con tierra, de 4 horas de evolución. No recuerda haber recibido vacunas en la adultez.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Cómo manejás la herida?","opciones":["Irrigación abundante, desbridamiento y cierre si queda limpia","Sutura inmediata sin lavar para reducir el tiempo de exposición","Vendaje oclusivo sin explorar y control a las 72 horas","Alcohol yodado puro dentro de la herida y sutura primaria"],"explicacion":"La irrigación con volumen generoso y el desbridamiento son las medidas más importantes para prevenir la infección. Una herida limpia de pocas horas puede cerrarse en forma primaria; si queda contaminada, cierre diferido.","fuente":"Hermes: Manejo de heridas traumáticas agudas"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis antitetánica indicás?","opciones":["Vacuna (Td o dTpa) más inmunoglobulina antitetánica","Vacuna (Td o dTpa) sin inmunoglobulina","Inmunoglobulina antitetánica sin vacuna","Antibiótico (penicilina) sin vacuna ni inmunoglobulina"],"explicacion":"En una herida sucia o con tierra y vacunación desconocida o incompleta (menos de 3 dosis), se indican vacuna e inmunoglobulina, en sitios distintos, y se completa el esquema.","fuente":"CDC/ACIP, profilaxis del tétanos en el manejo de heridas"},{"tipo":"Dosis","pregunta":"¿Qué dosis de inmunoglobulina antitetánica?","opciones":["250 UI IM","25 UI IM en dosis única","5000 UI IV","250 UI subcutánea en la herida"],"explicacion":"La dosis profiláctica es 250 UI por vía intramuscular, en un sitio distinto al de la vacuna.","fuente":"CDC/ACIP, profilaxis del tétanos en el manejo de heridas"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás al alta?","opciones":["Control de la herida en 48 horas y pautas de alarma","Antibióticos de amplio espectro por 14 días","Reposo en cama por 2 semanas con la pierna elevada","Retirar los puntos a las 24 horas para evitar infección"],"explicacion":"Se controla en 48 horas buscando signos de infección. No hay indicación de antibióticos prolongados en una herida bien lavada y desbridada sin infección.","fuente":"Hermes: Manejo de heridas traumáticas agudas"}]},{"id":"base-15","tema":"Heridas y cicatrización","anio":1,"titulo":"Quemadura por agua hirviendo","vineta":"Varón de 40 años, 80 kg, con quemaduras de espesor parcial profundo y total en todo el miembro superior derecho y la cara anterior del tronco por un accidente con agua hirviendo hace una hora. Sin lesión inhalatoria.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué superficie corporal quemada tiene según la regla de los nueve?","opciones":["27 %","9 %","45 %","18 %"],"explicacion":"En el adulto, cada miembro superior es 9 %, la cara anterior del tronco 18 %, la posterior 18 %, cada miembro inferior 18 %, la cabeza 9 % y el periné 1 %. Las quemaduras de primer grado no se cuentan.","fuente":"ATLS 10.ª ed., lesiones térmicas"},{"tipo":"Medidas generales","pregunta":"¿Qué reposición inicial indicás?","opciones":["Ringer lactato 2 ml × kg × % en 24 h, la mitad en las primeras 8 h","Ringer lactato 4 ml × kg × % en 8 h, y el resto según diuresis","Líquidos por vía oral a demanda, con control de diuresis","Coloides desde la primera hora, 1 ml × kg × % en 24 h"],"explicacion":"ATLS 10 indica comenzar en el adulto con 2 ml × kg × % de superficie quemada (4320 ml en este paciente), la mitad en las primeras 8 horas contadas desde la quemadura, y titular según la diuresis.","fuente":"ATLS 10.ª ed., lesiones térmicas"},{"tipo":"Medidas generales","pregunta":"¿Con qué objetivo ajustás el ritmo?","opciones":["Diuresis de 0,5 ml/kg/h (unos 40 ml/h)","Diuresis de 3 ml/kg/h (unos 240 ml/h)","Presión venosa central de 20 cmH2O","Frecuencia cardíaca menor de 60 por minuto"],"explicacion":"En el adulto se busca una diuresis de 0,5 ml/kg/h; por encima de ese valor se reduce el aporte para evitar la sobrecarga y el síndrome compartimental.","fuente":"ATLS 10.ª ed., lesiones térmicas"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés si el antebrazo, quemado circunferencialmente, se pone frío y sin pulsos?","opciones":["Escarotomía en las caras medial y lateral","Elevar el miembro y esperar 24 horas","Injerto de piel inmediato sobre la escara","Fasciotomía de rutina sin escarotomía"],"explicacion":"Una escara circunferencial inextensible comprime los vasos; la escarotomía libera la constricción. Se indica ante compromiso circulatorio o ventilatorio.","fuente":"ATLS 10.ª ed., lesiones térmicas; Hermes: Evaluación y manejo inicial de quemaduras"}]},{"id":"base-16","tema":"Heridas y cicatrización","anio":1,"titulo":"Mordedura de perro en la mano","vineta":"Mujer de 30 años mordida por un perro conocido y vacunado en el dorso de la mano hace 3 horas. Herida punzante de 1 cm, sin compromiso tendinoso.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Suturás la herida?","opciones":["No: es punzante y en la mano; se irriga y se deja abierta","Sí, cierre primario para mejorar la cicatriz","Sí, con sutura intradérmica y antibiótico","Resección de los bordes de la herida y cierre primario inmediato con nailon"],"explicacion":"Las mordeduras punzantes y las de la mano tienen alto riesgo de infección y no se cierran en forma primaria. Se irrigan, se desbrida lo desvitalizado y se cubren.","fuente":"IDSA 2014, infecciones de piel y partes blandas (mordeduras)"},{"tipo":"Fármaco","pregunta":"¿Indicás antibiótico?","opciones":["Sí, profilaxis con amoxicilina-clavulánico","No, porque el perro está vacunado","Sí, cefalexina por vía oral","Sí, vancomicina por el riesgo de SAMR"],"explicacion":"IDSA recomienda profilaxis anticipada en mordeduras de alto riesgo: mano, heridas punzantes, inmunocompromiso o cerca de articulaciones. La amoxicilina-clavulánico cubre Pasteurella, anaerobios y estafilococo; la cefalexina no cubre Pasteurella.","fuente":"IDSA 2014, infecciones de piel y partes blandas (mordeduras)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["875/125 mg VO cada 12 horas, de 3 a 5 días","875/125 mg VO en dosis única","500/125 mg VO cada 8 horas durante 21 días","250/62,5 mg VO una vez por día"],"explicacion":"La profilaxis anticipada se indica de 3 a 5 días. La amoxicilina-clavulánico se usa a 875/125 mg cada 12 horas.","fuente":"IDSA 2014, infecciones de piel y partes blandas (mordeduras)"},{"tipo":"Medidas generales","pregunta":"¿Necesita profilaxis antirrábica?","opciones":["No: el perro es conocido y vacunado; se observa 10 días","Sí, vacuna e inmunoglobulina antirrábica de inmediato","Sí, inmunoglobulina antirrábica sin vacuna","No, y tampoco hace falta observar al animal"],"explicacion":"Con un perro identificado y sano que puede observarse durante 10 días, la profilaxis se difiere y solo se indica si el animal enferma. Se evalúa la vacuna antitetánica.","fuente":"Normas de profilaxis antirrábica (OMS)"}]},{"id":"base-17","tema":"Bioseguridad y aspectos médico-legales","anio":1,"titulo":"Pinchazo en quirófano","vineta":"Sos residente y te pinchás con la aguja de sutura después de usarla en un paciente con infección por VIH con carga viral desconocida. Tenés el esquema de hepatitis B completo con anticuerpos positivos.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés primero?","opciones":["Lavar con agua y jabón, sin exprimir, y reportar de inmediato","Exprimir la herida y aplicar lavandina antes de reportar el accidente","Terminar la cirugía y consultar al día siguiente","Esperar la serología del paciente antes de consultar"],"explicacion":"Se lava con agua y jabón y se informa enseguida al servicio de salud ocupacional. Exprimir o usar cáusticos no reduce la transmisión y daña el tejido. La consulta debe ser inmediata porque la profilaxis tiene una ventana corta.","fuente":"CDC, manejo de la exposición ocupacional a sangre"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis indicás?","opciones":["Profilaxis antirretroviral cuanto antes (idealmente en 2 horas) por 28 días","Profilaxis solo si el test del paciente vuelve positivo en 7 días","Gammaglobulina contra hepatitis B y vacuna de refuerzo, con control serológico","Sin profilaxis: control serológico a las 6 semanas"],"explicacion":"La profilaxis posexposición para VIH se inicia cuanto antes (idealmente en horas) y se mantiene 28 días con controles serológicos. Con anticuerpos contra hepatitis B protectores no hace falta profilaxis para hepatitis B.","fuente":"CDC, profilaxis posexposición ocupacional al VIH"},{"tipo":"Medidas generales","pregunta":"¿Qué medida reduce estos accidentes?","opciones":["Zona neutra para pasar cortopunzantes y no recapuchar agujas","Doble guante, sin cambiar la forma de pasar el instrumental","Pasar el bisturí de mano en mano avisando en voz alta","Recapuchar las agujas con dos manos antes de descartarlas"],"explicacion":"La técnica sin manos (zona neutra), no recapuchar y descartar en contenedores rígidos reducen los pinchazos. El doble guante disminuye la exposición a sangre pero no reemplaza esas prácticas.","fuente":"CDC, prevención de lesiones cortopunzantes"}]},{"id":"base-18","tema":"Bioseguridad y aspectos médico-legales","anio":1,"titulo":"Consentimiento para una cirugía programada","vineta":"Tenés que obtener el consentimiento de un paciente de 60 años, lúcido, para una colecistectomía laparoscópica programada en un hospital de la Argentina.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué forma debe tener?","opciones":["Escrito y firmado, porque es una intervención quirúrgica","Verbal, alcanza con anotarlo en la historia","No hace falta si el paciente se internó voluntariamente","Lo firma un familiar aunque el paciente esté lúcido"],"explicacion":"La Ley 26.529 de Derechos del Paciente exige consentimiento informado por escrito y firmado para internación, intervenciones quirúrgicas y procedimientos invasivos.","fuente":"Ley 26.529 de Derechos del Paciente (Argentina), artículo 7"},{"tipo":"Medidas generales","pregunta":"¿Qué información debe incluir?","opciones":["Procedimiento, beneficios, riesgos, alternativas y consecuencias de no hacerlo","Nombre de la operación y fecha, sin detallar riesgos para no asustar al paciente","Complicaciones graves y mortalidad, sin mencionar alternativas","Beneficios y fecha de cirugía; los riesgos se explican solo si pregunta"],"explicacion":"La ley enumera el diagnóstico y el procedimiento propuesto, sus objetivos, beneficios esperados, riesgos y efectos adversos, alternativas con sus riesgos y beneficios, y las consecuencias de no realizarlo. Para la colecistectomía incluye conversión y lesión biliar.","fuente":"Ley 26.529 de Derechos del Paciente (Argentina), artículo 5"},{"tipo":"Medidas generales","pregunta":"¿Cuándo podés operar sin consentimiento?","opciones":["Emergencia con riesgo vital, si no puede darlo él ni un representante","Cuando el paciente se niega pero vos considerás que es lo mejor","Cuando hay poco tiempo de quirófano y el paciente está sedado","Cuando el procedimiento es de bajo riesgo y ya fue explicado"],"explicacion":"La ley prevé excepciones: grave peligro para la salud pública o situación de emergencia con riesgo para la vida cuando no puede darlo el paciente ni sus representantes. Se documenta en la historia clínica.","fuente":"Ley 26.529 de Derechos del Paciente (Argentina), artículo 9"}]},{"id":"base-19","tema":"Principios de oncología y técnica","anio":1,"titulo":"Masa profunda en el muslo","vineta":"Mujer de 47 años con una masa de 8 cm, profunda a la fascia, en la cara anterior del muslo, que creció en 4 meses. Indolora, sin antecedente traumático.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Sarcoma de partes blandas hasta demostrar lo contrario","Lipoma profundo: observar con control clínico","Hematoma organizado por un traumatismo menor inadvertido","Quiste epidermoide de inclusión"],"explicacion":"Toda masa de partes blandas de más de 5 cm, profunda a la fascia o que crece debe estudiarse como posible sarcoma antes de cualquier resección.","fuente":"ESMO, guía de sarcomas de partes blandas"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["RM de la lesión y biopsia con aguja gruesa en un centro de sarcomas","Biopsia escisional directa en la guardia para tener el diagnóstico","Punción con aguja fina y resección en el mismo centro si es benigna","Ecografía de partes blandas y nuevo control en 6 meses"],"explicacion":"La resonancia define relaciones y planifica la biopsia. La biopsia con aguja gruesa, por un trayecto que luego se reseca con la pieza, es el estándar; idealmente se hace en el centro que va a operar.","fuente":"ESMO, guía de sarcomas de partes blandas"},{"tipo":"Técnica","pregunta":"¿Qué error técnico debés evitar?","opciones":["Resecarla sin estudio previo o con incisiones transversales","Hacer la biopsia en el eje longitudinal del miembro","Marcar el trayecto de la biopsia para incluirlo en la resección","Pedir una TC de tórax para estadificar antes de operar"],"explicacion":"La resección no planificada deja márgenes positivos y contamina planos, obligando a cirugías mayores. Las incisiones de biopsia deben ser longitudinales y ubicarse donde puedan incluirse en la resección definitiva.","fuente":"ESMO, guía de sarcomas de partes blandas; Hermes: Principios de oncología quirúrgica"}]},{"id":"base-20","tema":"Preoperatorio y posoperatorio","anio":1,"titulo":"Evaluación antes de una hernioplastia","vineta":"Varón de 72 años, hipertenso y diabético, que sube dos pisos por escalera sin síntomas. Programado para una hernioplastia inguinal. Toma aspirina por prevención primaria.","pasos":[{"tipo":"Estudios","pregunta":"¿Necesita estudios cardiológicos antes de operar?","opciones":["No: cirugía de bajo riesgo y buena capacidad funcional","Sí, ecocardiograma de estrés por la edad y la diabetes","Sí, cinecoronariografía por ser diabético","Sí, Holter de 24 horas por la hipertensión"],"explicacion":"Con buena capacidad funcional (subir dos pisos equivale a 4 o más METs) y una cirugía de bajo riesgo, la evaluación cardiológica adicional no cambia la conducta y puede demorarla.","fuente":"ESC 2022, evaluación cardiovascular para cirugía no cardíaca"},{"tipo":"Medidas generales","pregunta":"¿Qué ayuno indicás?","opciones":["6 horas para comida liviana y 2 horas para líquidos claros","Ayuno desde la medianoche para sólidos y líquidos","12 horas sin sólidos ni líquidos antes de la cirugía","24 horas de dieta líquida y luego ayuno de 8 horas"],"explicacion":"La ASA permite líquidos claros hasta 2 horas antes y comida liviana hasta 6 horas antes (8 horas para comidas grasas). El ayuno prolongado aumenta la resistencia a la insulina y el malestar sin reducir la aspiración.","fuente":"ASA 2017, ayuno preoperatorio"},{"tipo":"Fármaco","pregunta":"¿Qué hacés con la aspirina de prevención primaria?","opciones":["Suspenderla al menos 3 días antes de operar","Seguirla sin cambios, como si fuera prevención secundaria","Reemplazarla por clopidogrel hasta el día de la cirugía","Suspenderla y agregar heparina de bajo peso como puente"],"explicacion":"ESC 2022 recomienda suspender la aspirina de prevención primaria antes de la cirugía no cardíaca; cuando se interrumpe, al menos 3 días antes y 7 en cirugías de alto riesgo de sangrado. En prevención secundaria, sobre todo con angioplastia previa, suele mantenerse si el riesgo de sangrado es bajo.","fuente":"ESC 2022, evaluación cardiovascular para cirugía no cardíaca"}]},{"id":"base-21","tema":"Canalizaciones venosas","anio":1,"titulo":"Acceso venoso central","vineta":"Paciente de 58 años en shock séptico que requiere noradrenalina y un acceso venoso central. Coagulación normal, sin contraindicaciones anatómicas.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué técnica reduce las complicaciones mecánicas?","opciones":["Punción guiada por ecografía en tiempo real","Punción por reparos anatómicos con múltiples intentos","Punción a ciegas sin control radiológico","Disección venosa como primera elección"],"explicacion":"La guía ecográfica en tiempo real reduce las punciones arteriales, el neumotórax y los intentos fallidos, sobre todo en la vena yugular interna.","fuente":"CDC 2011, prevención de infecciones de catéteres intravasculares"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas previenen la infección del catéter?","opciones":["Máxima barrera estéril, clorhexidina alcohólica y retiro precoz","Antibiótico profiláctico sistémico durante la colocación y 48 horas después","Recambio rutinario del catéter cada 3 días sobre guía","Povidona acuosa y guantes estériles, sin camisolín"],"explicacion":"Máxima barrera (gorro, barbijo, camisolín, guantes y campo grande), clorhexidina alcohólica y retiro temprano reducen la bacteriemia. No se recomiendan antibióticos profilácticos ni recambios programados.","fuente":"CDC 2011, prevención de infecciones de catéteres intravasculares"},{"tipo":"Técnica","pregunta":"¿Qué sitio tiene menor riesgo de infección?","opciones":["Subclavio","Femoral común","Yugular interno","Es similar en los tres sitios"],"explicacion":"En el estudio 3SITES el acceso subclavio tuvo menos infecciones y trombosis que el yugular y el femoral, a costa de más neumotórax. La elección integra experiencia, coagulación y anatomía.","fuente":"Estudio 3SITES (Parienti, 2015)"},{"tipo":"Estudios","pregunta":"Colocaste un catéter subclavio. ¿Qué controlás antes de usarlo para vasopresores?","opciones":["Punta en la cava superior y ausencia de neumotórax","Que refluya sangre por las tres luces del catéter","Una TC de tórax con contraste por la vía colocada","Un ecocardiograma transesofágico para ver la punta"],"explicacion":"Se confirma que la punta esté en la vena cava superior y que no haya neumotórax, con radiografía o ecografía según la disponibilidad.","fuente":"Hermes: Procedimientos quirúrgicos junto a la cama"}]},{"id":"trauma-01","tema":"Manejo inicial del politraumatizado","anio":1,"titulo":"Motociclista hipotenso","vineta":"Varón de 28 años, choque de moto. Llega con vía aérea permeable, frecuencia respiratoria 24, saturación 95 %. Frecuencia cardíaca 130, presión 80/50 mmHg, piel fría. FAST con líquido en el espacio de Morison. Pelvis estable. Glasgow 14.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Shock hemorrágico por sangrado intraabdominal","Shock neurogénico por lesión medular","Taponamiento cardíaco por contusión","Shock séptico por perforación de víscera hueca"],"explicacion":"Taquicardia, hipotensión y frialdad con FAST positivo en un traumatizado inestable indican hemorragia intraabdominal. El shock neurogénico cursa con bradicardia y piel caliente.","fuente":"ATLS 10.ª ed.; Hermes: Atención inicial del paciente traumatizado"},{"tipo":"Medidas generales","pregunta":"¿Cómo empezás la reanimación?","opciones":["Hasta 1 litro de cristaloide tibio, sangre precoz e hipotensión permisiva","4 litros de cristaloide antes de transfundir, para restaurar la presión arterial","Coloides como primera elección hasta normalizar la presión arterial","Esperar el hematocrito para decidir si transfundir"],"explicacion":"ATLS 10 indica un bolo inicial de 1 litro de cristaloide tibio en el adulto y transfusión temprana si no responde. El exceso de cristaloides diluye factores y empeora la coagulopatía.","fuente":"ATLS 10.ª ed., shock"},{"tipo":"Fármaco","pregunta":"¿Qué antifibrinolítico indicás?","opciones":["Ácido tranexámico dentro de las primeras 3 horas","Ácido tranexámico recién a las 8 horas del trauma","Vitamina K intravenosa en dosis alta","Desmopresina en infusión continua"],"explicacion":"En el ensayo CRASH-2, el ácido tranexámico redujo la muerte por sangrado si se administraba dentro de las 3 horas; después de ese plazo no beneficia e incluso puede ser perjudicial.","fuente":"Ensayo CRASH-2"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["1 g IV en 10 minutos y luego 1 g en 8 horas","1 g por vía oral cada 8 horas durante 3 días","10 g IV en bolo único en la guardia","100 mg IV en dosis única al ingreso"],"explicacion":"El esquema de CRASH-2 es una carga de 1 g en 10 minutos seguida de 1 g en 8 horas.","fuente":"Ensayo CRASH-2"},{"tipo":"Conducta quirúrgica","pregunta":"No responde a la reanimación inicial. ¿Qué hacés?","opciones":["Laparotomía de urgencia, con control de daños si hace falta","TC de abdomen con contraste para definir la lesión","Manejo no operatorio con observación en terapia intensiva","Embolización como primera opción en un paciente sin respuesta"],"explicacion":"Un paciente inestable con FAST positivo que no responde va directo al quirófano. La TC y el manejo no operatorio son para el paciente estable o que responde.","fuente":"ATLS 10.ª ed.; Hermes: Abdomen abierto y cierre temporal"}]},{"id":"trauma-02","tema":"Manejo inicial del politraumatizado","anio":1,"titulo":"Disnea súbita tras un choque","vineta":"Varón de 35 años, choque frontal. Disnea intensa, frecuencia respiratoria 36, saturación 82 %, presión 75/40 mmHg, ingurgitación yugular, desviación traqueal a la izquierda y ausencia de murmullo vesicular en el hemitórax derecho.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Neumotórax a tensión derecho","Hemotórax masivo izquierdo","Taponamiento cardíaco agudo","Contusión pulmonar bilateral"],"explicacion":"Hipotensión, yugulares ingurgitadas, tráquea desviada al lado contrario y ausencia de murmullo del lado afectado son un neumotórax a tensión, un diagnóstico clínico.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Estudios","pregunta":"¿Pedís una radiografía de tórax antes de tratar?","opciones":["No: se descomprime de inmediato","Sí, para confirmar el lado afectado","Sí, una TC de tórax sin contraste","Sí, una ecografía formal por radiología"],"explicacion":"El neumotórax a tensión se trata antes de cualquier imagen; esperar una radiografía puede llevar al paro.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Técnica","pregunta":"¿Dónde descomprimís con aguja en el adulto?","opciones":["Cuarto o quinto espacio, línea axilar media o anterior","Segundo espacio intercostal, línea medioclavicular","Séptimo espacio, línea escapular posterior","Subxifoideo, dirigido al hombro izquierdo"],"explicacion":"ATLS 10 recomienda en el adulto el cuarto o quinto espacio en la línea axilar media o anterior, porque en el segundo espacio la pared suele ser demasiado gruesa para la aguja. Luego se coloca un tubo de tórax.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Técnica","pregunta":"¿Dónde colocás el tubo de tórax definitivo?","opciones":["Triángulo de seguridad, por encima del borde superior de la costilla","Segundo espacio anterior, por debajo del borde inferior de la costilla","Por debajo del octavo espacio intercostal, en la línea escapular","En el espacio donde se palpe más enfisema subcutáneo de la pared"],"explicacion":"El triángulo de seguridad (borde del pectoral mayor, borde del dorsal ancho y quinto espacio) evita la mama, los músculos grandes y el diafragma. Entrar por encima de la costilla evita el paquete vasculonervioso.","fuente":"ATLS 10.ª ed.; Hermes: Trauma torácico"}]},{"id":"trauma-03","tema":"Manejo inicial del politraumatizado","anio":1,"titulo":"Hemotórax después de una puñalada","vineta":"Varón de 24 años con herida de arma blanca en el hemitórax izquierdo, lateral. Hemodinámicamente estable. Radiografía: hemotórax izquierdo. Colocás un tubo de tórax y drena 1700 ml de sangre de inmediato.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo lo clasificás?","opciones":["Hemotórax masivo","Hemotórax pequeño","Derrame pleural paraneumónico","Neumotórax simple"],"explicacion":"Un drenaje inicial de 1500 ml o más, o un tercio de la volemia, define el hemotórax masivo.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Toracotomía de urgencia","Segundo tubo de tórax de mayor calibre","Observación con control del débito","Fibrinolíticos intrapleurales"],"explicacion":"Un drenaje inmediato de 1500 ml o más, o más de 200 ml/h durante 2 a 4 horas, o la necesidad persistente de transfusión indican toracotomía.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Medidas generales","pregunta":"Si el drenaje hubiera sido de 400 ml y luego mínimo, ¿qué harías con el tubo?","opciones":["Mantenerlo hasta la reexpansión y buscar hemotórax retenido","Retirarlo a las 2 horas si el débito es bajo","Clamparlo en forma permanente para favorecer la hemostasia del parénquima","Recambiarlo cada 24 horas para evitar la infección"],"explicacion":"Un hemotórax no masivo se maneja con el tubo hasta la reexpansión. Si queda un hemotórax retenido, la videotoracoscopia temprana reduce el empiema y el fibrotórax.","fuente":"ATLS 10.ª ed.; Hermes: Trauma torácico"}]},{"id":"aa-01","tema":"Abdomen agudo","anio":1,"titulo":"Vómitos y distensión con cicatriz previa","vineta":"Mujer de 60 años con histerectomía hace 10 años. Dolor cólico, vómitos y ausencia de gases desde hace 24 horas. Abdomen distendido, timpánico, sin defensa ni peritonismo. Afebril. Lactato normal. TC: asas de delgado dilatadas con cambio de calibre, sin signos de isquemia ni asa cerrada.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Oclusión de delgado por bridas, sin estrangulación","Íleo paralítico por trastorno electrolítico","Vólvulo de sigmoides con asa cerrada","Pseudoobstrucción colónica aguda (Ogilvie)"],"explicacion":"Cirugía abdominal previa, vómitos y distensión con cambio de calibre en la TC indican oclusión por bridas. Sin peritonismo, fiebre, lactato elevado ni signos tomográficos de isquemia, se puede intentar manejo no operatorio.","fuente":"Guías de Bologna 2017 (WSES); Hermes: Oclusión por bridas"},{"tipo":"Medidas generales","pregunta":"¿Qué manejo inicial indicás?","opciones":["Ayuno, sonda nasogástrica, hidratación IV y electrolitos","Laxantes osmóticos y dieta líquida para movilizar el tránsito","Cirugía inmediata para liberar las bridas","Proquinéticos IV y movilización precoz"],"explicacion":"El manejo no operatorio consiste en descompresión con sonda nasogástrica, reposición de líquidos y electrolitos y vigilancia clínica estrecha.","fuente":"Guías de Bologna 2017 (WSES)"},{"tipo":"Fármaco","pregunta":"¿Qué estudio terapéutico agregás?","opciones":["Contraste hidrosoluble por la sonda y radiografía a las 24 horas","Bario por vía oral y radiografías seriadas cada 6 horas","Enema de bario para descartar una obstrucción colónica asociada","Neostigmina 2 mg IV con monitoreo cardíaco continuo"],"explicacion":"El contraste hidrosoluble predice la resolución si llega al colon en 24 horas y reduce la necesidad de cirugía y la estancia. El bario está contraindicado por riesgo de peritonitis si hay perforación.","fuente":"Guías de Bologna 2017 (WSES)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hasta cuándo esperás?","opciones":["Hasta 72 horas, o antes si aparecen signos de isquemia","Hasta 10 días, mientras la sonda siga drenando","Hasta 6 horas, y si no resolvió, cirugía exploradora","Hasta que la paciente acepte la cirugía por el malestar"],"explicacion":"Si no resuelve en 72 horas, o aparecen fiebre, peritonismo, leucocitosis o lactato en aumento, está indicada la cirugía. Prolongar el manejo conservador aumenta la morbimortalidad.","fuente":"Guías de Bologna 2017 (WSES)"}]},{"id":"aa-02","tema":"Abdomen agudo","anio":1,"titulo":"Neumoperitoneo con dolor epigástrico súbito","vineta":"Varón de 50 años, fumador, consumidor de AINE. Dolor epigástrico súbito e intenso de 6 horas que se generalizó, abdomen en tabla. Radiografía de tórax de pie: neumoperitoneo. Presión 105/70 mmHg, frecuencia 110.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Úlcera péptica perforada","Pancreatitis aguda","Cólico renal","Infarto agudo de miocardio"],"explicacion":"Dolor epigástrico súbito con abdomen en tabla y neumoperitoneo en un consumidor de AINE es una úlcera perforada hasta que se demuestre otra cosa.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas iniciales indicás?","opciones":["Reanimación, sonda, IBP IV, antibióticos y cirugía urgente","Antiácidos orales, analgesia y alta con control ambulatorio","Observación 24 horas con sonda y repetir la radiografía","Endoscopia diagnóstica urgente para localizar la úlcera"],"explicacion":"Con peritonitis difusa se reanima, se descomprime, se inician inhibidor de la bomba de protones IV y antibióticos, y se opera sin demora. La endoscopia está contraindicada con perforación.","fuente":"WSES 2020, úlcera péptica perforada y sangrante"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué operación indicás para una perforación prepilórica de 8 mm?","opciones":["Rafia simple con parche de epiplón y lavado","Gastrectomía subtotal con reconstrucción Billroth II","Vagotomía troncular y piloroplastia","Gastrectomía total con esofagoyeyunostomía"],"explicacion":"Para perforaciones menores de 2 cm, la rafia con epiploplastia es suficiente; la cirugía ácido reductora ya no se indica de rutina. Se toma biopsia si hay sospecha de malignidad (sobre todo en úlceras gástricas).","fuente":"WSES 2020, úlcera péptica perforada y sangrante"},{"tipo":"Fármaco","pregunta":"¿Qué indicás después para evitar la recidiva?","opciones":["Erradicar H. pylori, inhibidor de bomba y suspender AINE y tabaco","Antiácidos a demanda y continuar los AINE a la menor dosis posible","Corticoides en dosis bajas para cicatrizar la mucosa","No hace falta tratamiento médico después de la rafia"],"explicacion":"La erradicación del Helicobacter pylori, el inhibidor de bomba y la suspensión de AINE y tabaco previenen la recidiva y hacen innecesaria la cirugía ácido reductora.","fuente":"WSES 2020, úlcera péptica perforada y sangrante"}]},{"id":"pleura-01","tema":"Manejo del espacio pleural","anio":1,"titulo":"Neumotórax en un joven alto","vineta":"Varón de 22 años, alto y delgado, fumador, sin enfermedad pulmonar. Dolor pleurítico izquierdo desde ayer con disnea leve. Saturación 97 %, estable. Radiografía: neumotórax izquierdo de 3 cm en el ápice.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Neumotórax espontáneo primario","Neumotórax espontáneo secundario","Neumotórax a tensión","Neumotórax traumático"],"explicacion":"Sin enfermedad pulmonar previa, en un joven alto y fumador, es primario. El secundario aparece sobre una enfermedad pulmonar (EPOC, fibrosis) y se maneja de forma más agresiva.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás si tiene pocos síntomas?","opciones":["Manejo conservador o ambulatorio, según el paciente","Tubo de tórax de 28 Fr con aspiración continua","Cirugía videotoracoscópica inmediata con pleurodesis","Pleurodesis química con talco de entrada"],"explicacion":"BTS 2023 considera el manejo conservador en adultos con síntomas mínimos sin importar el tamaño, y el ambulatorio cuando hay buen apoyo y seguimiento. Si no son aptos, aspiración con aguja o drenaje.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Medidas generales","pregunta":"¿Qué le indicás al alta?","opciones":["Dejar de fumar; no volar hasta la resolución ni bucear sin cirugía","Puede viajar en avión al día siguiente del alta","Reposo en cama durante un mes y suspender la actividad física y el trabajo","Puede bucear al mes si la radiografía es normal"],"explicacion":"Fumar aumenta la recurrencia. No se vuela hasta confirmar la resolución y el buceo se desaconseja de por vida salvo pleurectomía bilateral.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Conducta quirúrgica","pregunta":"Si tuviera una recurrencia homolateral, ¿qué indicás?","opciones":["Videotoracoscopia con resección de bullas y pleurodesis","Otra aspiración y seguimiento con radiografías","Toracotomía posterolateral con resección de bullas","Oxígeno a alto flujo y observación"],"explicacion":"Tras una recurrencia (o en profesiones de riesgo) se indica cirugía definitiva por videotoracoscopia, que reduce la recurrencia a valores bajos.","fuente":"BTS 2023, enfermedad pleural"}]},{"id":"pleura-02","tema":"Manejo del espacio pleural","anio":1,"titulo":"Derrame tabicado con fiebre","vineta":"Varón de 60 años con neumonía hace 10 días que persiste febril. Derrame pleural derecho; la punción da líquido turbio con pH 6,9 y glucosa 30 mg/dl. La ecografía muestra tabiques.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Derrame paraneumónico complicado o empiema","Derrame paraneumónico simple","Trasudado por insuficiencia cardíaca","Hemotórax coagulado"],"explicacion":"Un pH menor de 7,2, glucosa baja, pus o tabiques definen el derrame complicado o empiema y obligan a drenar.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Drenaje con tubo de tórax y antibióticos","Antibióticos solos durante 6 semanas por vía IV","Punciones evacuadoras semanales con antibióticos","Decorticación abierta como primera opción"],"explicacion":"El derrame complicado necesita drenaje además de antibióticos. La cirugía (videotoracoscopia) se reserva para el fracaso del drenaje y del tratamiento intrapleural.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"El drenaje es insuficiente por los tabiques. ¿Qué tratamiento intrapleural agregás?","opciones":["Alteplasa más desoxirribonucleasa (DNasa)","Estreptoquinasa sola en dosis alta","Talco para pleurodesis","Solución salina hipertónica en lavado"],"explicacion":"En el ensayo MIST-2, la combinación de alteplasa y DNasa mejoró el drenaje radiológico y redujo la necesidad de cirugía; cada fármaco solo no fue eficaz.","fuente":"Ensayo MIST-2 (Rahman, 2011)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Alteplasa 10 mg más DNasa 5 mg cada 12 horas, 6 dosis","Alteplasa 100 mg IV en 2 horas, dosis única","Alteplasa 1 mg intrapleural en dosis única","DNasa 50 mg intrapleural sola, cada 8 horas durante 7 días"],"explicacion":"El esquema de MIST-2 es alteplasa 10 mg y DNasa 5 mg por el tubo, dos veces por día durante 3 días, clampeando 1 hora tras cada dosis.","fuente":"Ensayo MIST-2 (Rahman, 2011)"}]},{"id":"traq-01","tema":"Traqueostomías","anio":1,"titulo":"Cánula desplazada al tercer día","vineta":"Paciente con traqueostomía quirúrgica hecha hace 3 días en terapia intensiva. Desaturación súbita, la cánula está fuera del estoma. Tiene vía aérea superior permeable e intubación orotraqueal factible.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés?","opciones":["Oxígeno por boca y estoma; si no recupera, intubación orotraqueal","Reintroducir a ciegas una cánula del mismo tamaño por el estoma, con mandril","Llamar al cirujano y esperar sin manipular la vía aérea","Agrandar el estoma con bisturí para reintroducir la cánula"],"explicacion":"Antes de los 7 días el trayecto no está maduro y reintroducir a ciegas puede crear una falsa vía. Se oxigena por la boca y el estoma, y si no alcanza se intuba por boca; el reemplazo se hace con visión.","fuente":"National Tracheostomy Safety Project"},{"tipo":"Medidas generales","pregunta":"¿Qué debe haber en la cabecera de todo paciente traqueostomizado?","opciones":["Cánulas de repuesto, aspiración y datos de la vía aérea","Un ambú con máscara y un laringoscopio","Una jeringa y un tubo endotraqueal número 8","Un equipo de tubo de tórax y un set de cricotiroidotomía"],"explicacion":"Se recomienda tener cánula de repuesto y una de menor calibre, dilatador, aspiración y un cartel con el tipo de traqueostomía y si la vía aérea superior es intubable.","fuente":"National Tracheostomy Safety Project"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hacer la traqueostomía temprana (antes de los 4 días de intubación) mejora la mortalidad?","opciones":["No: en el ensayo TracMan no redujo la mortalidad","Sí, la reduce a la mitad a 30 días","Sí, en los pacientes con más de 7 días de ventilación","Sí, pero solo en pacientes quirúrgicos"],"explicacion":"En TracMan, la traqueostomía temprana no mejoró la mortalidad a 30 días ni la estancia en terapia; muchos pacientes del grupo tardío nunca la necesitaron.","fuente":"Ensayo TracMan (Young, 2013)"}]},{"id":"pared-02","tema":"Pared abdominal y laparotomías","anio":1,"titulo":"Cierre de una laparotomía mediana","vineta":"Terminás una resección de colon electiva por laparotomía mediana de 20 cm en una paciente de 64 años, IMC 29, sin otros factores de riesgo de eventración.","pasos":[{"tipo":"Técnica","pregunta":"¿Cómo cerrás la aponeurosis?","opciones":["Continua, puntos pequeños, monofilamento de absorción lenta","Puntos separados, material trenzado de absorción rápida","Continua, puntos grandes a 2 cm del borde, absorción lenta","Cierre en masa con nailon y puntos separados cada 2 cm"],"explicacion":"La técnica de puntos pequeños (small bites) con sutura continua de absorción lenta, relación largo de sutura y largo de herida de al menos 4:1, reduce la eventración frente a los puntos grandes.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía; Hermes: Cicatrización y prevención de la hernia incisional"},{"tipo":"Dosis","pregunta":"¿Qué relación largo de sutura y largo de herida buscás?","opciones":["Al menos 4:1","Cerca de 1:1","Cerca de 2:1","No más de 3:1"],"explicacion":"Una relación de al menos 4:1 se asocia con menos eventración; con puntos pequeños suele superar 5:1.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía"},{"tipo":"Medidas generales","pregunta":"¿Cuándo considerarías malla profiláctica?","opciones":["En alto riesgo (obesidad, aneurisma de aorta), onlay o retromuscular","En las laparotomías contaminadas, con malla biológica intraperitoneal","En reoperaciones, con malla intraperitoneal de PTFE","En pacientes delgados con cierre a tensión, con malla en puente"],"explicacion":"La guía EHS/AHS 2022 sugiere considerar malla sintética permanente profiláctica en laparotomías medianas electivas de pacientes de alto riesgo, en posición onlay o retromuscular; no se recomienda intraperitoneal.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía"}]},{"id":"apend-01","tema":"Apendicitis aguda","anio":1,"titulo":"Dolor en fosa ilíaca derecha","vineta":"Varón de 24 años. Dolor periumbilical que migró a la fosa ilíaca derecha hace 18 horas, anorexia, náuseas, temperatura 37,9 °C, defensa en la fosa ilíaca derecha. Leucocitos 14.500/mm³ con neutrofilia. Ecografía: apéndice de 9 mm no compresible, sin colección ni apendicolito.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico?","opciones":["Apendicitis aguda no complicada","Apendicitis complicada con absceso","Linfadenitis mesentérica","Ileítis por Crohn"],"explicacion":"Migración del dolor, signos inflamatorios y un apéndice mayor de 6 mm no compresible confirman la apendicitis. Sin colección, perforación ni apendicolito, es no complicada.","fuente":"WSES 2020, apendicitis aguda; Hermes: Apendicitis aguda"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Apendicectomía laparoscópica; antibióticos solos como alternativa","Antibióticos solos, sin ofrecer la cirugía por el riesgo anestésico","Observación sin antibióticos con ecografía a las 24 horas","Apendicectomía por laparotomía mediana exploradora"],"explicacion":"La apendicectomía laparoscópica es el tratamiento de elección. En la no complicada sin apendicolito, los antibióticos solos son una alternativa segura en pacientes informados, con recurrencia cercana al 40 % a 5 años.","fuente":"WSES 2020; ensayo APPAC a 5 años"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás alrededor de la cirugía?","opciones":["Una dosis preoperatoria, sin antibióticos posoperatorios","Antibióticos IV posoperatorios d
