cómo lo confirmás?","opciones":["Carcinoma escamoso de lengua; biopsia de la lesión","Úlcera traumática por la prótesis; observar 6 meses","Afta mayor; corticoides tópicos y control","Leucoplasia benigna; alta con control anual"],"explicacion":"Una úlcera indurada persistente en un fumador y bebedor es un carcinoma escamoso hasta demostrar lo contrario. La leucoplasia y sobre todo la eritroplasia son lesiones precancerosas que se biopsian.","fuente":"Hermes: Glosectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Con qué margen resecás el tumor primario?","opciones":["Alrededor de 1 cm de tejido sano","Alrededor de 1 mm de tejido sano","Alrededor de 5 cm de tejido sano","Sin margen: legrado de la úlcera"],"explicacion":"La glosectomía parcial busca márgenes de alrededor de 1 cm, que se acortan en la pieza por retracción; un margen cercano o positivo empeora el control local.","fuente":"Hermes: Glosectomía"},{"tipo":"Conducta quirúrgica","pregunta":"La profundidad de invasión es de 6 mm y el cuello es clínicamente negativo. ¿Qué hacés con el cuello?","opciones":["Vaciamiento cervical electivo (niveles I a III)","Observación del cuello con ecografías seriadas cada 3 meses","Vaciamiento radical clásico bilateral","Radioterapia sola sin cirugía del primario"],"explicacion":"Con profundidad de invasión mayor de 3 a 4 mm el riesgo de metástasis ocultas es alto; en el ensayo de D'Cruz, el vaciamiento electivo mejoró la supervivencia frente a esperar.","fuente":"Ensayo de D'Cruz 2015; Hermes: Vaciamiento ganglionar cervical"}]},{"id":"cyc-04","tema":"Vaciamiento ganglionar cervical","anio":4,"titulo":"Metástasis cervical y hombro caído","vineta":"Varón de 58 años con metástasis de carcinoma escamoso en niveles II y III izquierdos. Se planifica vaciamiento cervical.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué conserva el vaciamiento radical modificado tipo III frente al radical clásico?","opciones":["Espinal accesorio, yugular interna y esternocleidomastoideo","La carótida externa y la glándula submaxilar","Los ganglios de los niveles II y V con su grasa","La glándula tiroides y las paratiroides inferiores del lado operado"],"explicacion":"El radical clásico reseca niveles I a V con el espinal, la yugular interna y el esternocleidomastoideo; el modificado preserva una o más de esas estructuras no linfáticas.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Si después tiene dolor de hombro, escápula alada y no puede abducir por encima de 90°, ¿qué estructura se lesionó?","opciones":["Nervio espinal accesorio","Nervio frénico","Hipogloso","Rama marginal mandibular"],"explicacion":"La lesión del espinal denerva el trapecio y produce el síndrome del hombro doloroso, con caída del hombro y limitación de la abducción.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Al reiniciar la dieta sale líquido lechoso por el drenaje izquierdo. ¿Qué es?","opciones":["Fístula quilosa por lesión del conducto torácico","Fístula salival de la glándula submaxilar por el drenaje","Infección de la herida con pus fluido","Seroma normal del lecho del vaciamiento"],"explicacion":"El conducto torácico termina en el confluente yugulosubclavio izquierdo; su lesión en el nivel IV da salida de quilo con la alimentación.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Medidas generales","pregunta":"¿Cómo la manejás inicialmente si el débito es bajo?","opciones":["Dieta con triglicéridos de cadena media y drenaje","Reexploración inmediata para ligar el conducto torácico","Retirar el drenaje y vendaje compresivo","Dieta rica en grasas para identificar la fuga"],"explicacion":"La mayoría de las fístulas de bajo débito cierran con dieta con triglicéridos de cadena media (que se absorben por vía portal), compresión y drenaje; la reexploración se reserva para alto débito persistente.","fuente":"Hermes: Vaciamiento ganglionar cervical"}]},{"id":"torax-01","tema":"Empiema y decorticación","anio":4,"titulo":"Neumonía con derrame tabicado","vineta":"Varón de 55 años con neumonía de 7 días que sigue febril con antibióticos. Ecografía: derrame pleural derecho moderado con tabiques. Toracocentesis: líquido turbio, pH 7,05, glucosa 30 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Derrame complicado o empiema en fase fibrinopurulenta","Derrame paraneumónico simple en fase exudativa","Trasudado por insuficiencia cardíaca descompensada","Empiema crónico organizado con coraza fibrosa"],"explicacion":"pH menor de 7,2, glucosa baja y tabiques indican derrame complicado en fase fibrinopurulenta; la fase organizada tiene una cáscara pleural que atrapa el pulmón.","fuente":"BTS 2023, enfermedad pleural; Hermes: Empiema pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Tubo de drenaje guiado por imagen, más antibióticos","Cambiar el antibiótico y repetir la ecografía","Toracocentesis evacuadora semanal hasta secar la cavidad pleural","Decorticación abierta como primera opción"],"explicacion":"El pH menor de 7,2 o el pus son indicación de drenaje; los antibióticos solos no resuelven un espacio pleural infectado.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"¿Qué espectro deben cubrir los antibióticos en la infección pleural adquirida en la comunidad?","opciones":["Incluir anaerobios (amoxicilina-clavulánico)","Gramnegativos con un aminoglucósido","Hongos, agregando fluconazol empírico","Atípicos, con un macrólido solo"],"explicacion":"La infección pleural comunitaria es frecuentemente polimicrobiana con anaerobios; BTS indica cubrirlos salvo infección neumocócica demostrada. Los aminoglucósidos no penetran bien la pleura.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"A las 48 horas el tubo drena poco y persiste la colección tabicada. Si no va a cirugía, ¿qué tratamiento intrapleural indicás?","opciones":["Alteplasa más DNasa intrapleurales","Estreptoquinasa intrapleural sola","Antibióticos intrapleurales","Corticoides intrapleurales"],"explicacion":"En MIST-2, la combinación de alteplasa y DNasa mejoró el drenaje y redujo la derivación a cirugía; cada fármaco solo no fue eficaz.","fuente":"Ensayo MIST-2; BTS 2023"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Alteplasa 10 mg y DNasa 5 mg cada 12 horas, 3 días","Alteplasa 100 mg intrapleural en dosis única","DNasa 50 mg intrapleural por día durante un mes completo","Alteplasa 1 mg intrapleural una vez por semana"],"explicacion":"El esquema de MIST-2 es alteplasa 10 mg y DNasa 5 mg por el tubo, dos veces por día durante 3 días (6 dosis), clampeando el tubo 1 hora.","fuente":"Ensayo MIST-2"},{"tipo":"Conducta quirúrgica","pregunta":"Si el pulmón quedara atrapado por una coraza fibrosa con sepsis persistente, ¿qué indicás?","opciones":["Decorticación por videotoracoscopia (o abierta)","Mantener el tubo y agregar más días de antibiótico","Neumonectomía derecha reglada","Pleurodesis con talco por el tubo"],"explicacion":"La decorticación remueve la coraza para que el pulmón reexpanda y se controle la infección; se prefiere por videotoracoscopia cuando es posible.","fuente":"Hermes: Empiema pleural"}]},{"id":"torax-02","tema":"Cáncer de pulmón","anio":4,"titulo":"Nódulo pulmonar que creció","vineta":"Mujer de 66 años, exfumadora. Nódulo sólido de 1,8 cm periférico en el lóbulo superior derecho que creció en 6 meses. PET-TC: captación en el nódulo, sin ganglios ni metástasis.","pasos":[{"tipo":"Estudios","pregunta":"Si en la TC o el PET hubiera ganglios mediastinales sospechosos, ¿cómo los estadificarías?","opciones":["EBUS con punción o mediastinoscopia","Con la TC de tórax con contraste","Resonancia de tórax con gadolinio","Operar y evaluarlos en la pieza"],"explicacion":"Los ganglios mediastinales sospechosos deben confirmarse con muestra de tejido antes de decidir la cirugía, porque el N2 cambia el tratamiento.","fuente":"Hermes: Cáncer de pulmón; Estadificación TNM del cáncer torácico"},{"tipo":"Estudios","pregunta":"¿Qué evaluación funcional pedís antes de resecar?","opciones":["Espirometría y DLCO con predichos posoperatorios","Radiografía de tórax y gasometría arterial en reposo","Electrocardiograma y ecocardiograma","Prueba de caminata de 6 minutos aislada"],"explicacion":"El VEF1 y la DLCO predichos posoperatorios estiman el riesgo; si ambos superan el 60 % el riesgo es bajo, y si no se agrega una prueba de esfuerzo.","fuente":"ERS/ESTS 2009, evaluación funcional; Hermes: Evaluación fisiológica para resección pulmonar"},{"tipo":"Estudios","pregunta":"Con valores predichos bajos, ¿qué consumo máximo de oxígeno contraindica una resección mayor?","opciones":["Menor de 10 ml/kg/min","Menor de 40 ml/kg/min","Mayor de 20 ml/kg/min","Menor de 30 ml/kg/min"],"explicacion":"Un consumo máximo de oxígeno menor de 10 ml/kg/min indica riesgo muy alto para resecciones mayores; mayor de 20 indica riesgo bajo.","fuente":"ERS/ESTS 2009, evaluación funcional"},{"tipo":"Conducta quirúrgica","pregunta":"Función adecuada y diagnóstico de adenocarcinoma periférico de 1,8 cm, N0. ¿Qué resección es aceptable además de la lobectomía?","opciones":["Segmentectomía anatómica con estudio ganglionar","Resección en cuña sin estudio ganglionar asociado","Bilobectomía superior y media","Radioterapia estereotáctica sin cirugía"],"explicacion":"En tumores periféricos de 2 cm o menos y N0, los ensayos JCOG0802 y CALGB 140503 mostraron resultados oncológicos no inferiores con resección sublobar frente a lobectomía.","fuente":"Ensayos JCOG0802 y CALGB 140503"},{"tipo":"Técnica","pregunta":"¿Qué hacés siempre con los ganglios durante la resección?","opciones":["Muestreo o disección ganglionar mediastinal sistemática","No los evalúo porque el PET fue negativo","Reseco solo los ganglios hiliares que se ven aumentados","Vaciamiento cervical y supraclavicular"],"explicacion":"El PET puede no detectar metástasis ganglionares; la evaluación ganglionar sistemática estadifica y define la adyuvancia.","fuente":"Hermes: Resección pulmonar anatómica"}]},{"id":"higado-01","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Lesión hepática en una mujer que toma anticonceptivos","vineta":"Mujer de 32 años que toma anticonceptivos orales hace 10 años. Resonancia: lesión de 6 cm en el segmento VI compatible con adenoma hepatocelular. Asintomática.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero?","opciones":["Suspender los anticonceptivos y bajar de peso si corresponde","Seguir con los anticonceptivos y repetir la resonancia en 6 meses","Cambiar a un anticonceptivo de mayor dosis","Resección inmediata sin suspender las hormonas"],"explicacion":"Los adenomas dependen de estrógenos; suspender los anticonceptivos puede reducirlos.","fuente":"Hermes: Tumores benignos del hígado"},{"tipo":"Conducta quirúrgica","pregunta":"A los 6 meses sigue midiendo más de 5 cm. ¿Qué hacés?","opciones":["Resección hepática","Observación indefinida","Trasplante","Ablación de rutina"],"explicacion":"Los adenomas que persisten mayores de 5 cm tras suspender los estrógenos tienen riesgo de sangrado y transformación maligna y se resecan; en el varón se resecan siempre.","fuente":"Hermes: Tumores benignos del hígado"},{"tipo":"Diagnóstico","pregunta":"En comparación, ¿qué conducta tiene un hemangioma típico asintomático de 6 cm?","opciones":["No necesita tratamiento ni seguimiento","Resección por el tamaño mayor de 5 cm","Embolización arterial preventiva","Biopsia percutánea para confirmar"],"explicacion":"El hemangioma típico asintomático no requiere tratamiento, independientemente del tamaño; la biopsia está contraindicada por riesgo de sangrado.","fuente":"Hermes: Tumores benignos del hígado"}]},{"id":"higado-02","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Nódulo en un cirrótico","vineta":"Varón de 58 años con cirrosis por hepatitis C tratada, Child-Pugh A, sin várices ni plaquetas bajas. En la vigilancia aparece un nódulo único de 3,5 cm en el segmento VI con realce arterial y lavado portal. AFP 120 ng/ml. Buen estado general.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo se confirma el diagnóstico?","opciones":["Con la imagen típica, sin biopsia","Con biopsia percutánea del nódulo","Con la AFP mayor de 100 ng/ml","Con laparoscopia y biopsia"],"explicacion":"En el hígado cirrótico, un nódulo de 1 cm o más con realce arterial y lavado es diagnóstico de carcinoma hepatocelular sin biopsia.","fuente":"Hermes: Carcinoma hepatocelular"},{"tipo":"Conducta quirúrgica","pregunta":"Nódulo único, función preservada y sin hipertensión portal. ¿Qué tratamiento indicás?","opciones":["Resección hepática (BCLC A)","Sorafenib (BCLC C)","Cuidados paliativos (BCLC D)","Quimioembolización (BCLC B)"],"explicacion":"En BCLC, el tumor único con función preservada y sin hipertensión portal clínicamente significativa es candidato ideal a resección; la ablación es alternativa en tumores pequeños.","fuente":"BCLC 2022; Hermes: Carcinoma hepatocelular"},{"tipo":"Medidas generales","pregunta":"¿Qué remanente hepático mínimo necesitás en un hígado cirrótico?","opciones":["Alrededor del 40 %","5 %","20 % igual que en hígado sano","10 %"],"explicacion":"El remanente mínimo es cercano al 20 % en hígado sano, 30 % en hígado dañado por quimioterapia y 40 % en cirrosis.","fuente":"Hermes: Evaluación y principios de la hepatectomía"},{"tipo":"Conducta quirúrgica","pregunta":"Si tuviera hipertensión portal, ¿qué criterios usarías para indicar un trasplante?","opciones":["Milán: 1 nódulo de hasta 5 cm o hasta 3 de hasta 3 cm","Hasta 5 nódulos de hasta 5 cm, con invasión portal permitida","Tumor único mayor de 10 cm sin otros nódulos","Invasión portal segmentaria sin metástasis"],"explicacion":"Los criterios de Milán seleccionan pacientes con resultados de trasplante similares a los de cirróticos sin tumor.","fuente":"Criterios de Milán; Hermes: Carcinoma hepatocelular"}]},{"id":"higado-03","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Metástasis hepáticas de cáncer de colon","vineta":"Mujer de 60 años operada de un cáncer de sigma hace 1 año. TC: tres metástasis en el hígado derecho, sin enfermedad extrahepática. Hígado izquierdo libre.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué define si son resecables?","opciones":["Resecar toda la enfermedad con margen y un remanente suficiente","Que sean menos de 4 metástasis y que cada una mida menos de 5 cm","Que la mayor mida menos de 5 cm de diámetro","Que estén en un solo lóbulo, sin cruzar la línea de Cantlie"],"explicacion":"El criterio actual no es el número ni el tamaño sino la posibilidad de una resección R0 con un remanente funcional suficiente, con flujo y drenaje biliar.","fuente":"Hermes: Metástasis hepáticas"},{"tipo":"Medidas generales","pregunta":"El remanente estimado es del 18 % en hígado sano. ¿Qué podés hacer para operarla?","opciones":["Embolización portal derecha para hipertrofiar el remanente","Operar igual, porque el hígado es sano y regenera","Descartar la cirugía y seguir solo con quimioterapia sistémica","Radioterapia hepática total como alternativa curativa"],"explicacion":"La embolización portal del lado a resecar hipertrofia el remanente en algunas semanas; si no crece lo suficiente, se replantea la estrategia.","fuente":"Hermes: Evaluación y principios de la hepatectomía"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento sistémico perioperatorio mostró beneficio en supervivencia libre de progresión?","opciones":["FOLFOX perioperatorio","Cirugía sin quimioterapia","Tamoxifeno adyuvante","Gemcitabina sola"],"explicacion":"En el ensayo EORTC 40983, 6 ciclos de FOLFOX antes y 6 después de la resección mejoraron la supervivencia libre de progresión.","fuente":"Ensayo EORTC 40983"}]},{"id":"hidatid-01","tema":"Quiste hidatídico hepático","anio":4,"titulo":"Quiste hepático en un trabajador rural","vineta":"Varón de 40 años de zona rural con perros. Dolor en hipocondrio derecho. Ecografía: quiste de 9 cm en el segmento VII con membranas desprendidas flotando (signo del camalote). Serología positiva.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué estadio de la OMS tiene?","opciones":["CE3a (membrana desprendida)","CE1 (unilocular, pared visible)","CE4 (contenido heterogéneo)","CE5 (pared calcificada)"],"explicacion":"La membrana desprendida dentro del quiste (camalote) define CE3a; CE1 es unilocular con pared visible, CE2 multivesicular, y CE4-CE5 son inactivos y calcificados.","fuente":"WHO-IWGE 2010; Hermes: Equinococosis hepática"},{"tipo":"Fármaco","pregunta":"¿Qué antiparasitario indicás alrededor de la cirugía o la punción?","opciones":["Albendazol","Metronidazol","Ivermectina","Nitazoxanida"],"explicacion":"El albendazol perioperatorio reduce el riesgo de hidatidosis secundaria por derrame de escólices.","fuente":"WHO-IWGE 2010; Hermes: Equinococosis hepática"},{"tipo":"Dosis","pregunta":"¿Con qué dosis?","opciones":["10 a 15 mg/kg/día en dos tomas con comida grasa","1 g en dosis única el día de la cirugía","50 mg/kg/día en cuatro tomas en ayunas","400 mg una vez por semana durante 6 meses seguidos"],"explicacion":"La dosis es de 10 a 15 mg/kg/día divididos en dos tomas, con comidas ricas en grasas para mejorar la absorción. Se controlan las enzimas hepáticas y el hemograma.","fuente":"WHO-IWGE 2010"},{"tipo":"Técnica","pregunta":"En la cirugía, ¿qué hacés antes de abrir el quiste?","opciones":["Aislar el campo con compresas con escolicida y aspirar","Abrirlo directamente y vaciar las membranas con la mano","Inyectar formol al 10 % en la cavidad sin aspirar","Puncionarlo sin proteger el campo para ganar tiempo"],"explicacion":"Se aísla el campo con compresas embebidas en escolicida para evitar la siembra peritoneal y la anafilaxia. No se inyecta escolicida si hay comunicación biliar, porque puede producir colangitis esclerosante.","fuente":"Hermes: Equinococosis hepática"},{"tipo":"Diagnóstico","pregunta":"Al vaciar la cavidad aparece bilis. ¿Qué significa y qué hacés?","opciones":["Fístula quistobiliar: suturarla y evaluar la vía biliar","Es un hallazgo esperable en los quistes grandes; cerrar la cavidad","Hepatectomía derecha mayor en el mismo acto","Ligadura del colédoco y hepaticoyeyunostomía"],"explicacion":"Las fístulas quistobiliares son frecuentes; se identifican y suturan, y si hay material hidatídico en la vía biliar se la explora o se drena por CPRE.","fuente":"Hermes: Equinococosis hepática"}]},{"id":"biliar-ca-01","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Hallazgo de cáncer después de una colecistectomía","vineta":"Mujer de 64 años operada de colecistectomía laparoscópica por litiasis. La anatomía patológica informa adenocarcinoma que invade la capa muscular (pT1b), con margen cístico negativo.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué hacés primero?","opciones":["Estadificar con TC o resonancia de tórax y abdomen","Alta sin estudios, porque el margen cístico fue negativo","Quimioterapia adyuvante sin estudios previos","Reoperar de inmediato sin estudios de extensión"],"explicacion":"Antes de reoperar se busca enfermedad residual o metastásica que contraindique la re-resección.","fuente":"Hermes: Cáncer de vesícula biliar"},{"tipo":"Conducta quirúrgica","pregunta":"Sin metástasis, ¿qué indicás?","opciones":["Re-resección del lecho (IVb y V) con linfadenectomía","Seguimiento: la colecistectomía con margen negativo alcanza","Hepatectomía derecha ampliada de rutina con resección biliar","Radioterapia del lecho sin cirugía"],"explicacion":"En T1a con margen negativo alcanza la colecistectomía; desde T1b se indica re-resección del lecho y linfadenectomía porque hay riesgo de enfermedad residual.","fuente":"Hermes: Cáncer de vesícula biliar; Vaciamiento ganglionar en el cáncer de vesícula"},{"tipo":"Fármaco","pregunta":"Tras la resección, ¿qué adyuvancia se recomienda en el cáncer de vías biliares y vesícula?","opciones":["Capecitabina durante 6 meses","Seguimiento sin adyuvancia","Tamoxifeno por 5 años","Imatinib durante un año"],"explicacion":"Tras el ensayo BILCAP, ASCO 2019 recomienda capecitabina adyuvante por 6 meses en el cáncer biliar resecado.","fuente":"Ensayo BILCAP; ASCO 2019, cáncer biliar"},{"tipo":"Dosis","pregunta":"¿Con qué esquema se administró en BILCAP?","opciones":["1250 mg/m² cada 12 h, días 1 a 14 cada 21 días, 8 ciclos","500 mg por día en forma continua durante 2 años","1250 mg/m² en dosis única mensual durante un año","100 mg/m² IV una vez por semana, 12 semanas"],"explicacion":"BILCAP usó capecitabina 1250 mg/m² dos veces por día los días 1 a 14 cada 3 semanas, durante 8 ciclos (24 semanas).","fuente":"Ensayo BILCAP"}]},{"id":"biliar-ca-02","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Ictericia indolora y vesícula pequeña","vineta":"Varón de 68 años con ictericia indolora y prurito, bilirrubina 14 mg/dl. Ecografía: vía biliar intrahepática dilatada en ambos lóbulos, colédoco normal y vesícula colapsada. Colangiorresonancia: estenosis de la confluencia que se extiende a ambos hepáticos.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Colangiocarcinoma perihiliar (Klatskin)","Adenocarcinoma de cabeza de páncreas","Coledocolitiasis con síndrome de Mirizzi","Hepatitis viral aguda colestásica"],"explicacion":"Vía intrahepática dilatada con colédoco y vesícula no dilatados ubica la obstrucción en el hilio; una estenosis de la confluencia en un adulto mayor con ictericia indolora es un Klatskin hasta demostrar lo contrario.","fuente":"Hermes: Cáncer de la vía biliar principal"},{"tipo":"Diagnóstico","pregunta":"Si compromete la confluencia y llega a las ramas de segundo orden derechas, ¿qué tipo de Bismuth-Corlette es?","opciones":["IIIa","IIIb","II","IV"],"explicacion":"Tipo I: debajo de la confluencia; II: compromete la confluencia; IIIa y IIIb: llegan a las ramas de segundo orden derechas o izquierdas; IV: ambas.","fuente":"Hermes: Cáncer de la vía biliar principal"},{"tipo":"Conducta quirúrgica","pregunta":"Es resecable. ¿Qué cirugía corresponde?","opciones":["Hepatectomía derecha ampliada con caudado y vía biliar","Resección de la vía biliar sola con hepaticoyeyunostomía","Prótesis biliar como tratamiento definitivo","Duodenopancreatectomía cefálica con linfadenectomía"],"explicacion":"En el tipo IIIa se reseca la vía con el hígado derecho y el caudado (por sus conductos que drenan en la confluencia), con reconstrucción biliodigestiva.","fuente":"Hermes: Cáncer de la vía biliar principal; Hepatectomía derecha ampliada al segmento IV"},{"tipo":"Medidas generales","pregunta":"Antes de una hepatectomía mayor con bilirrubina de 14, ¿qué hacés con la vía biliar?","opciones":["Drenar el lado del futuro remanente","Drenar el lado que se va a resecar primero","No drenar y operar con la bilirrubina alta","Esperar que la bilirrubina baje sola"],"explicacion":"La ictericia empeora la regeneración del remanente; en el perihiliar se drena el lóbulo que va a quedar antes de una hepatectomía mayor.","fuente":"Hermes: Cáncer de la vía biliar principal"}]},{"id":"pancreas-ca-01","tema":"Cáncer de páncreas","anio":4,"titulo":"Ictericia indolora con vesícula palpable","vineta":"Varón de 66 años con ictericia indolora, pérdida de peso y vesícula palpable. Bilirrubina 9 mg/dl, CA 19-9 elevado. TC con protocolo pancreático: tumor de 2,5 cm en la cabeza con contacto con la vena mesentérica superior menor de 180°, sin contacto arterial ni metástasis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué significa la vesícula palpable con ictericia indolora?","opciones":["Obstrucción maligna distal (Courvoisier-Terrier)","Colecistitis aguda alitiásica por la ictericia","Coledocolitiasis con vesícula hidrópica","Hepatitis colestásica con hepatomegalia"],"explicacion":"La obstrucción lenta y progresiva distal al cístico distiende una vesícula sana; la litiasis suele dar vesícula escleroatrófica.","fuente":"Hermes: Adenocarcinoma ductal de páncreas"},{"tipo":"Diagnóstico","pregunta":"¿Cómo lo clasificás según resecabilidad?","opciones":["Resecable","Irresecable localmente avanzado","Metastásico","Limítrofe arterial"],"explicacion":"Según NCCN, sin contacto arterial y con contacto venoso de 180° o menos sin irregularidad de la vena es resecable; el contacto arterial define limítrofe o localmente avanzado.","fuente":"Hermes: Adenocarcinoma ductal de páncreas; Riesgo vascular en DPC"},{"tipo":"Medidas generales","pregunta":"¿Drenás la vía biliar antes de operar?","opciones":["No de rutina; solo si hay colangitis o se retrasará la cirugía","Sí, con prótesis plástica por CPRE antes de operar","Sí, con colecistostomía percutánea por 4 semanas","No, aunque tenga colangitis, para no demorar la cirugía"],"explicacion":"En el ensayo DROP, el drenaje preoperatorio de rutina aumentó las complicaciones frente a la cirugía temprana; se reserva para indicaciones específicas.","fuente":"Ensayo DROP (van der Gaag 2010)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Duodenopancreatectomía cefálica","Pancreatectomía distal","Derivación biliodigestiva paliativa","Enucleación"],"explicacion":"El adenocarcinoma de la cabeza resecable se trata con duodenopancreatectomía cefálica con linfadenectomía estándar.","fuente":"Hermes: Duodenopancreatectomía cefálica"},{"tipo":"Fármaco","pregunta":"Se recupera bien y tiene buen estado general. ¿Qué adyuvancia indicás?","opciones":["mFOLFIRINOX durante 6 meses","Seguimiento sin adyuvancia","Radioterapia sola del lecho","Tamoxifeno durante 5 años"],"explicacion":"En PRODIGE 24, mFOLFIRINOX adyuvante por 6 meses (12 ciclos) aumentó la supervivencia frente a gemcitabina en pacientes con buen estado funcional.","fuente":"Ensayo PRODIGE 24"}]},{"id":"pancreas-ca-02","tema":"Cáncer de páncreas","anio":4,"titulo":"Drenaje con amilasa alta después de un Whipple","vineta":"Varón de 62 años en el día 3 de una duodenopancreatectomía. El drenaje peripancreático aporta 150 ml/día con amilasa 5 veces mayor que el límite superior normal de la sérica. Afebril, buen estado, tolera dieta.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás?","opciones":["Fuga bioquímica, sin repercusión clínica","Fístula grado C (con falla orgánica)","Fístula grado B (cambia el manejo)","No es fístula: es un débito normal"],"explicacion":"ISGPS 2016 define fístula como amilasa en el drenaje mayor de 3 veces el límite superior normal sérico desde el día 3; si no cambia el manejo es una fuga bioquímica, y pasa a grado B o C según repercusión e intervenciones.","fuente":"ISGPS 2016, fístula pancreática"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés?","opciones":["Mantener el drenaje y retirarlo cuando baje, con dieta oral","Relaparotomía para revisar la anastomosis","Completar la pancreatectomía para evitar la fístula","Ayuno, nutrición parenteral y octreótido subcutáneo por 7 días"],"explicacion":"La fuga bioquímica no requiere cambios de conducta; se retira el drenaje cuando el débito disminuye.","fuente":"ISGPS 2016, fístula pancreática"},{"tipo":"Diagnóstico","pregunta":"En el día 10 aparece sangre por el drenaje y hematemesis leve, autolimitadas, con fístula conocida. ¿Qué sospechás?","opciones":["Sangrado centinela por pseudoaneurisma","Gastritis por estrés sin importancia","Úlcera de la anastomosis gastroyeyunal","Coagulopatía por déficit de vitamina K"],"explicacion":"Un sangrado menor tardío en un paciente con fístula suele anunciar la rotura de un pseudoaneurisma; se pide angio-TC urgente y se trata con angiografía y embolización o stent.","fuente":"Hermes: Duodenopancreatectomía cefálica"}]},{"id":"pancreas-ca-03","tema":"Cáncer de páncreas","anio":4,"titulo":"Cáncer de páncreas metastásico con ictericia y vómitos","vineta":"Mujer de 72 años con adenocarcinoma de cabeza de páncreas y metástasis hepáticas. Ictericia con prurito y, en las últimas semanas, vómitos por obstrucción duodenal. Expectativa de vida estimada de meses.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo tratás la ictericia?","opciones":["Prótesis biliar metálica por vía endoscópica","Duodenopancreatectomía paliativa","Colecistostomía percutánea definitiva","Prótesis plástica por CPRE con recambio cada 3 meses"],"explicacion":"En la paliación, la prótesis metálica por CPRE alivia la ictericia con menos morbilidad que la derivación quirúrgica y dura más que la plástica.","fuente":"Hermes: Paliación del cáncer de páncreas; Paliación de las neoplasias biliopancreáticas"},{"tipo":"Conducta quirúrgica","pregunta":"¿Y la obstrucción duodenal?","opciones":["Prótesis duodenal o gastroyeyunostomía, según expectativa de vida","Sonda nasogástrica permanente con aspiración","Gastrectomía total paliativa con Y de Roux","Yeyunostomía de alimentación sin descomprimir el estómago"],"explicacion":"Con expectativa corta suele preferirse la prótesis duodenal; con expectativa mayor, la gastroyeyunostomía da una paliación más duradera.","fuente":"Hermes: Paliación del cáncer de páncreas"},{"tipo":"Medidas generales","pregunta":"Tiene dolor epigástrico irradiado al dorso que no cede con opioides. ¿Qué podés ofrecer?","opciones":["Neurólisis del plexo celíaco","Duplicar la dosis de opioides","Pancreatectomía paliativa","Radioterapia hepática"],"explicacion":"La neurólisis celíaca, guiada por ecoendoscopia o percutánea, mejora el dolor y reduce el consumo de opioides, dentro de un abordaje de cuidados paliativos.","fuente":"Hermes: Paliación del cáncer de páncreas; Cuidados paliativos en cirugía"}]},{"id":"cyc-05","tema":"Cáncer de cavidad oral","anio":4,"titulo":"Tumor del piso de la boca pegado a la mandíbula","vineta":"Varón de 64 años, fumador y bebedor. Carcinoma escamoso de 3 cm del piso de la boca anterior, confirmado por biopsia, adherido a la cara lingual del reborde alveolar. Sin adenopatías palpables.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís para decidir si resecás hueso y cuánto?","opciones":["TC o RM para ver invasión de la cortical y la medular","Ortopantomografía, que alcanza para decidir","Centellograma óseo con tecnecio para ver captación","Ecografía del piso de la boca con Doppler color"],"explicacion":"La TC o la RM definen la profundidad, la invasión ósea y la extensión cervical, que deciden la resección mandibular. La radiografía panorámica subestima la invasión inicial y el centellograma es inespecífico.","fuente":"Marandas, EMC 2006, cáncer del piso de la boca; Hermes: Cáncer del piso de la boca"},{"tipo":"Conducta quirúrgica","pregunta":"La TC muestra erosión de la cortical sin invasión de la medular. ¿Qué resección mandibular indicás?","opciones":["Mandibulectomía marginal, conservando la continuidad del hueso","Mandibulectomía segmentaria del cuerpo mandibular","Resección de partes blandas, sin incluir hueso","Hemimandibulectomía con desarticulación temporomandibular"],"explicacion":"La extensión de la resección ósea se decide por el compromiso de la cortical o de la medular, no por la sola cercanía: con compromiso cortical sin invasión medular se reseca un borde (marginal) y se conserva la continuidad; la invasión medular exige la segmentaria. Dejar el hueso adherido compromete el margen.","fuente":"Marandas, EMC 2006; Hermes: Cáncer del piso de la boca"},{"tipo":"Técnica","pregunta":"Si hubiera hecho falta una mandibulectomía segmentaria, ¿cómo reconstruirías?","opciones":["Colgajo libre óseo vascularizado, por ejemplo de peroné","Cierre primario de la mucosa sin reponer hueso","Placa de titanio sola cubierta con mucosa","Injerto de piel parcial sobre el defecto"],"explicacion":"Cuando se pierde la continuidad mandibular hace falta reconstrucción ósea con tejido vascularizado, que además separa la boca del cuello y conserva la deglución y el habla. Una placa sola o el cierre de partes blandas dejan deformidad y riesgo de exposición.","fuente":"Marandas, EMC 2006; Hermes: Cáncer del piso de la boca"},{"tipo":"Medidas generales","pregunta":"La pieza informa margen microscópico positivo y extensión extracapsular en un ganglio. ¿Qué tratamiento complementario indicás?","opciones":["Radioterapia posoperatoria con quimioterapia concurrente","Radioterapia posoperatoria sola","Seguimiento clínico sin tratamiento complementario","Quimioterapia sola, sin radioterapia"],"explicacion":"En el análisis conjunto de los ensayos EORTC 22931 y RTOG 9501, el margen microscópicamente comprometido y la extensión extracapsular fueron los factores en los que agregar cisplatino a la radioterapia posoperatoria mejoró el resultado.","fuente":"Bernier 2005, análisis conjunto EORTC 22931 y RTOG 9501 (Head Neck 27:843)"},{"tipo":"Fármaco","pregunta":"¿Qué fármaco se da concurrente con la radioterapia?","opciones":["Cisplatino","Cetuximab semanal","Gemcitabina","Capecitabina"],"explicacion":"Ambos ensayos usaron cisplatino en dosis altas concurrente con la radioterapia posoperatoria. Cetuximab no es el estándar en el paciente que puede recibir cisplatino.","fuente":"Cooper 2004 (RTOG 9501) y Bernier 2004 (EORTC 22931), NEJM 350"},{"tipo":"Dosis","pregunta":"¿Con qué esquema de cisplatino?","opciones":["100 mg/m² IV los días 1, 22 y 43","100 mg/m² IV una vez por semana","10 mg/m² IV los días 1, 22 y 43","300 mg/m² IV en dosis única"],"explicacion":"Los dos ensayos dieron 100 mg/m² IV los días 1, 22 y 43 de la radioterapia (60 a 66 Gy). Las dosis semanales de 100 mg/m² serían tóxicas y una dosis única de 300 mg/m² excede cualquier esquema.","fuente":"Cooper 2004 (RTOG 9501) y Bernier 2004 (EORTC 22931), NEJM 350"}]},{"id":"cyc-06","tema":"Cáncer de cavidad oral","anio":4,"titulo":"Úlcera de la mejilla junto al conducto de Stensen","vineta":"Mujer de 70 años, fumadora y usuaria de prótesis dental, con un carcinoma escamoso de 2,5 cm en la mucosa yugal derecha que llega al orificio del conducto de Stensen. Abre bien la boca. Cuello sin adenopatías palpables.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué tiene que definir la imagen antes de operar?","opciones":["Profundidad, invasión ósea, espacio masticador y cuello","Metástasis pulmonares, antes que la extensión local","Cálculos dentro del conducto parotídeo homolateral","Función secretora de la glándula parótida derecha"],"explicacion":"La extensión de la mucosa yugal hacia el buccinador, el hueso, el espacio masticador y el cuello cambia la resección, el acceso y la reconstrucción. La función parotídea o los cálculos no definen la conducta oncológica.","fuente":"Lefebvre, EMC 1995, cáncer de la mejilla; Hermes: Cáncer de mucosa yugal"},{"tipo":"Técnica","pregunta":"El margen incluye el orificio del Stensen. ¿Qué hacés con el conducto?","opciones":["Lo reimplanto en la mucosa si queda en la resección","Lo ligo y dejo la glándula parótida sin drenaje","Agrego una parotidectomía total en el mismo acto","Lo aboco a la piel de la mejilla como fístula dirigida"],"explicacion":"El conducto parotídeo se conserva o se reimplanta cuando es posible, para evitar el sialocele, la fístula y la parotiditis obstructiva. No hay indicación oncológica de parotidectomía rutinaria.","fuente":"Lefebvre, EMC 1995; Hermes: Cáncer de mucosa yugal"},{"tipo":"Técnica","pregunta":"Queda un defecto de espesor completo de 5 cm. ¿Cómo lo reconstruís?","opciones":["Colgajo local o libre que aporte revestimiento y volumen","Cierre primario de los bordes, aunque quede a tensión","Cicatrización dirigida, sin cobertura","Injerto de piel parcial sobre el músculo expuesto"],"explicacion":"Los defectos pequeños se cierran o se injertan; los mayores necesitan un colgajo local o libre que reponga revestimiento y volumen y mantenga la apertura bucal. El cierre a tensión o la cicatrización dirigida dejan una cicatriz que retrae.","fuente":"Lefebvre, EMC 1995; Hermes: Cáncer de mucosa yugal"},{"tipo":"Diagnóstico","pregunta":"Meses después abre la boca apenas 1,5 cm y no tiene dolor articular. ¿Qué pasó?","opciones":["Trismus por retracción de la cicatriz","Luxación de la articulación temporomandibular","Parálisis de la rama bucal del nervio facial","Sialolitiasis del conducto reimplantado"],"explicacion":"La cicatriz contráctil de la mejilla limita la apertura bucal; por eso la reconstrucción busca evitarla. La parálisis facial no impide abrir la boca y la luxación da dolor y desviación.","fuente":"Lefebvre, EMC 1995; Hermes: Cáncer de mucosa yugal"}]},{"id":"cyc-07","tema":"Vaciamiento ganglionar cervical","anio":4,"titulo":"Bulto cervical duro en un exfumador","vineta":"Varón de 56 años, exfumador, con una masa cervical derecha de 3 cm en el nivel II, dura e indolora, que nota hace 5 semanas y no cambió de tamaño. Sin fiebre ni infección dental o respiratoria reciente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la considerás?","opciones":["Masa con riesgo aumentado de malignidad","Adenitis reactiva que se va a resolver sola","Quiste branquial benigno sin más estudios","Lipoma cervical profundo"],"explicacion":"Una masa de más de 2 semanas sin causa infecciosa, firme y de más de 1,5 cm en un adulto tiene riesgo aumentado de malignidad; en el adulto la causa más frecuente de una masa cervical persistente es una neoplasia, muchas veces una metástasis de carcinoma escamoso.","fuente":"AAO-HNS 2017, evaluación de la masa cervical del adulto; Hermes: Cáncer de cabeza y cuello"},{"tipo":"Fármaco","pregunta":"¿Indicás un antibiótico de prueba antes de estudiarla?","opciones":["No, porque no hay signos de infección bacteriana","Sí, amoxicilina-clavulánico 10 días y control","Sí, cefalexina 2 semanas antes de estudiar","Sí, clindamicina por un posible foco dental"],"explicacion":"La guía recomienda no indicar antibióticos de rutina sin signos de infección bacteriana: demoran el diagnóstico de un cáncer.","fuente":"AAO-HNS 2017, evaluación de la masa cervical del adulto"},{"tipo":"Estudios","pregunta":"¿Qué imagen pedís?","opciones":["TC (o RM) de cuello con contraste","Radiografía de cuello y de tórax","PET-TC como primer estudio","Centellograma tiroideo con tecnecio"],"explicacion":"En la masa de riesgo aumentado se pide TC o RM de cuello con contraste (recomendación fuerte). El PET-TC se reserva para buscar un primario que no aparece.","fuente":"AAO-HNS 2017, evaluación de la masa cervical del adulto"},{"tipo":"Estudios","pregunta":"¿Cómo obtenés el diagnóstico histológico?","opciones":["Punción con aguja fina de la masa","Biopsia escisional abierta del ganglio","Biopsia incisional abierta en quirófano","Esperar 6 semanas para ver si involuciona"],"explicacion":"Se hace punción con aguja fina en lugar de biopsia abierta (recomendación fuerte): la biopsia abierta de una metástasis de carcinoma escamoso contamina el cuello y complica el tratamiento.","fuente":"AAO-HNS 2017, evaluación de la masa cervical del adulto; Hermes: Cáncer de cabeza y cuello"},{"tipo":"Conducta quirúrgica","pregunta":"La punción informa carcinoma escamoso y ni el examen ni la TC muestran el primario. ¿Qué hacés antes de cualquier biopsia abierta?","opciones":["Examen de la vía aerodigestiva superior bajo anestesia","Vaciamiento cervical radical de entrada","Biopsia abierta del ganglio para confirmar","Radioterapia del cuello sin buscar el primario"],"explicacion":"Si después de la punción y la imagen no hay primario, se recomienda examinar la vía aerodigestiva superior bajo anestesia antes de una biopsia abierta, para encontrarlo y planificar el tratamiento.","fuente":"AAO-HNS 2017, evaluación de la masa cervical del adulto"}]},{"id":"cyc-08","tema":"Vaciamiento ganglionar cervical","anio":4,"titulo":"Anatomía de un vaciamiento selectivo","vineta":"Varón de 60 años con carcinoma escamoso del piso de la boca y cuello clínicamente negativo. Se le hace un vaciamiento selectivo de los niveles I a III del lado derecho.","pasos":[{"tipo":"Técnica","pregunta":"Al disecar el nivel IB, ¿qué nervio corre bajo el platisma cerca del borde de la mandíbula?","opciones":["Rama marginal mandibular del facial","Nervio hipogloso mayor, sobre el hiogloso","Nervio lingual, junto al conducto de Wharton","Nervio auricular mayor"],"explicacion":"La rama marginal corre bajo el platisma, superficial a los vasos faciales, y su lesión deja caída de la comisura. El hipogloso y el lingual están en la profundidad del triángulo submaxilar, y el auricular mayor cruza el esternocleidomastoideo.","fuente":"Skandalakis 2013, cap. 1; Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Técnica","pregunta":"En la profundidad del cuello, bajo la fascia prevertebral, ¿sobre qué músculo desciende el nervio frénico?","opciones":["Escaleno anterior","Escaleno medio","Esternocleidomastoideo","Omohioideo"],"explicacion":"El frénico desciende sobre la cara anterior del escaleno anterior, cubierto por la fascia prevertebral; no se diseca por debajo de ese plano. El plexo braquial sale entre los escalenos anterior y medio.","fuente":"Skandalakis 2013, cap. 1; Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Después de la cirugía tiene ptosis leve y miosis del lado derecho. ¿Qué estructura se lesionó?","opciones":["Cadena simpática cervical (Horner)","Rama marginal mandibular del facial","Nervio espinal accesorio en el nivel II","Nervio hipogloso mayor"],"explicacion":"La ptosis y la miosis homolaterales son un síndrome de Horner por lesión de la cadena simpática, que está detrás de la carótida, sobre los músculos prevertebrales.","fuente":"Pelliccia, EMC 2015, vaciamiento cervical; Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Medidas generales","pregunta":"Otro paciente, con el espinal conservado, tiene dolor y debilidad del hombro al mes. ¿Qué indicás?","opciones":["Rehabilitación precoz del hombro","Cabestrillo e inmovilización por 6 semanas","Reexploración para hacer una neurorrafia","Esperar un año sin tratamiento ni controles"],"explicacion":"Conservar el nervio no garantiza la función: la tracción durante la disección causa disfunción del trapecio. La manipulación mínima del nervio y la rehabilitación precoz son las medidas útiles; inmovilizar empeora la rigidez.","fuente":"Pelliccia, EMC 2015; Hermes: Vaciamiento ganglionar cervical"}]},{"id":"torax-03","tema":"Empiema y decorticación","anio":4,"titulo":"Hemotórax que no terminó de salir","vineta":"Varón de 32 años con fracturas costales derechas por un choque. Se colocó un tubo de tórax por un hemotórax. Al tercer día está estable, el tubo dejó de drenar y la TC muestra unos 500 ml de hemotórax coagulado retenido.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué complicación favorece este hallazgo?","opciones":["Empiema pleural postraumático","Quilotórax tardío por lesión del conducto","Hernia diafragmática traumática","Neumotórax a tensión diferido"],"explicacion":"El hemotórax residual, sobre todo de más de 300 ml, es el principal factor de riesgo de empiema postraumático; por eso hay que asegurar la evacuación completa.","fuente":"WSES-AAST 2025, trauma torácico; Hermes: Trauma torácico y Empiema pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Videotoracoscopia para evacuar el coágulo","Fibrinolíticos intrapleurales y esperar 2 semanas","Observar y repetir la TC en un mes","Toracotomía posterolateral de entrada"],"explicacion":"En el hemotórax retenido la guía EAST recomienda la videotoracoscopia antes que intentar fibrinolíticos, que se asociaron con más demora y complicaciones. La toracotomía queda si la toracoscopia no alcanza.","fuente":"EAST 2021, hemotórax simple y retenido; Hermes: Trauma torácico"},{"tipo":"Medidas generales","pregunta":"¿En qué momento conviene hacerla?","opciones":["Dentro de los primeros 4 días","Después de la segunda semana","Al mes, cuando el coágulo se organice","Cuando aparezca fiebre"],"explicacion":"La guía recomienda la videotoracoscopia temprana, dentro de los 4 días: después el coágulo se organiza, la evacuación es más difícil y aumentan el empiema y la conversión.","fuente":"EAST 2021, hemotórax simple y retenido"},{"tipo":"Fármaco","pregunta":"¿Indicás antibiótico al drenar el hemotórax retenido?","opciones":["Sí, profilaxis antibiótica sistémica","No, salvo que tenga fiebre documentada","Sí, antibióticos intrapleurales","No, porque es un hematoma estéril"],"explicacion":"WSES-AAST indica profilaxis antibiótica en el drenaje del hemotórax retenido y en toda cirugía torácica por trauma. Los antibióticos intrapleurales no se recomiendan.","fuente":"WSES-AAST 2025, trauma torácico; Hermes: Trauma torácico"}]},{"id":"torax-04","tema":"Empiema y decorticación","anio":4,"titulo":"Fiebre después de un tubo de tórax","vineta":"Mujer de 45 años internada desde hace 12 días por un hemotórax traumático drenado con tubo en otro hospital. Fiebre, leucocitosis y derrame pleural derecho tabicado en la ecografía.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué análisis pedís del líquido pleural?","opciones":["pH, glucosa, LDH y cultivo","Hematocrito del líquido y triglicéridos","Citología oncológica y ADA","Amilasa y bilirrubina"],"explicacion":"El pH, la glucosa, la LDH y el cultivo confirman el empiema y orientan el antibiótico (recomendación fuerte). Los triglicéridos sirven para el quilotórax y la amilasa para la perforación esofágica o el páncreas.","fuente":"WSES-AAST 2025, trauma torácico; Hermes: Empiema pleural"},{"tipo":"Fármaco","pregunta":"Es un empiema posprocedimiento, adquirido en la internación. ¿Qué tiene que cubrir el antibiótico empírico?","opciones":["Cobertura de SAMR y Pseudomonas aeruginosa","Gérmenes comunitarios con ceftriaxona y metronidazol","Anaerobios con ampicilina-sulbactam sola","Hongos, agregando fluconazol empírico"],"explicacion":"En el empiema hospitalario o posprocedimiento se cubren SAMR y Pseudomonas; la ceftriaxona con metronidazol o la ampicilina-sulbactam son para el adquirido en la comunidad.","fuente":"WSES-AAST 2025, trauma torácico; Hermes: Empiema pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés con el espacio pleural?","opciones":["Drenaje pleural, con cirugía si no se resuelve","Antibióticos solos, sin drenar el espacio","Punciones evacuadoras semanales con aguja","Lavado pleural diario con antibióticos"],"explicacion":"El empiema se trata con antibióticos y drenaje; si el drenaje fracasa se pasa a toracoscopia, toracotomía con decorticación o ventana torácica.","fuente":"WSES-AAST 2025, trauma torácico; Hermes: Empiema pleural"},{"tipo":"Técnica","pregunta":"Sigue séptica y la TC muestra el pulmón atrapado por una cáscara pleural. ¿Qué cirugía indicás?","opciones":["Decorticación, por toracoscopia o toracotomía","Pleurodesis con talco por el tubo","Lobectomía del lóbulo inferior derecho","Recambio por un tubo de mayor calibre"],"explicacion":"Con sepsis persistente y pulmón atrapado, la decorticación remueve la cáscara para que el pulmón se expanda y se controle la infección. La pleurodesis está contraindicada con infección y un tubo más grueso no libera el pulmón.","fuente":"Wald, Izhar y Sugarbaker, Sabiston 2022, cap. 58; Hermes: Empiema pleural"}]},{"id":"torax-05","tema":"Cáncer de pulmón","anio":4,"titulo":"Nódulo de 7 mm en un fumador","vineta":"Varón de 61 años, fumador de 40 paquetes-año. En una TC por un traumatismo aparece un nódulo pulmonar sólido único de 7 mm en el lóbulo superior derecho. No tiene antecedente de cáncer ni inmunosupresión.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿En qué categoría de riesgo lo ubicás según Fleischner?","opciones":["Alto riesgo, por el tabaquismo intenso","Bajo riesgo, porque mide menos de 1 cm","No aplica Fleischner a un hallazgo incidental","Riesgo intermedio, por la edad mayor de 60"],"explicacion":"Fleischner clasifica al paciente como de alto riesgo por antecedentes como un tabaquismo importante, y como de bajo riesgo si no los tiene. La guía es justamente para nódulos incidentales; no se aplica al cribado ni a pacientes con cáncer o inmunosupresión.","fuente":"Fleischner 2017 (MacMahon, Radiology 284:228)"},{"tipo":"Estudios","pregunta":"¿Qué seguimiento indicás?","opciones":["TC a los 6-12 meses y otra a los 18-24 meses","TC a los 6-12 meses y alta si no cambia","Sin seguimiento por ser menor de 8 mm","Biopsia percutánea en esta semana"],"explicacion":"Para un nódulo sólido único de 6 a 8 mm en un paciente de alto riesgo: TC a los 6-12 meses y otra a los 18-24 meses. En el de bajo riesgo la segunda TC es opcional.","fuente":"Fleischner 2017 (MacMahon, Radiology 284:228)"},{"tipo":"Conducta quirúrgica","pregunta":"A los 12 meses mide 13 mm y tiene bordes espiculados. ¿Qué indicás?","opciones":["PET-TC y muestra de tejido o resección","Repetir la TC dentro de 2 años","Antibióticos y nueva TC en un mes","Alta porque ya cumplió el seguimiento"],"explicacion":"Un nódulo que crece por encima de 8 mm, con bordes espiculados, se estudia con PET-TC y muestra de tejido, o se reseca; esperar más arriesga progresión.","fuente":"Fleischner 2017; Hermes: Cáncer de pulmón"},{"tipo":"Medidas generales","pregunta":"Se programa la resección. ¿Qué medida preoperatoria reduce las complicaciones respiratorias?","opciones":["Dejar de fumar y rehabilitación respiratoria","Reposo en cama la semana previa","Antibiótico profiláctico 7 días antes","Corticoides inhalados de rutina"],"explicacion":"Dejar de fumar y optimizar las secreciones, el broncoespasmo, la nutrición y la movilidad reducen las complicaciones pulmonares; el reposo las aumenta y no hay indicación de antibióticos o corticoides de rutina.","fuente":"Wald, Izhar y Sugarbaker, Sabiston 2022, cap. 58; Hermes: Evaluación fisiológica para resección pulmonar"}]},{"id":"torax-06","tema":"Cáncer de pulmón","anio":4,"titulo":"Adenocarcinoma operado en una mujer que nunca fumó","vineta":"Mujer de 58 años, nunca fumadora, operada de una lobectomía superior izquierda con disección ganglionar. Anatomía patológica: adenocarcinoma de 4,5 cm con un ganglio hiliar positivo (estadio II), márgenes libres. Buen estado general.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio molecular pedís en la pieza?","opciones":["Mutaciones de EGFR en el tumor","Mutación germinal de BRCA1","Inestabilidad de microsatélites","HER2 por inmunohistoquímica"],"explicacion":"En el carcinoma no escamoso resecado en estadio IB a IIIA, buscar mutaciones de EGFR define la adyuvancia con osimertinib.","fuente":"ADAURA (Wu, NEJM 2020;383:1711); Hermes: Cáncer de pulmón"},{"tipo":"Fármaco","pregunta":"Tiene una deleción del exón 19 de EGFR. Después de la quimioterapia adyuvante, ¿qué agregás?","opciones":["Osimertinib","Trastuzumab","Imatinib","Tamoxifeno"],"explicacion":"En ADAURA, osimertinib adyuvante en pacientes con mutación de EGFR (deleción del exón 19 o L858R) resecados en estadio IB a IIIA prolongó mucho la supervivencia libre de enfermedad (90 % frente a 44 % a 2 años en estadio II-IIIA) y luego la global. La quimioterapia previa era opcional según indicación.","fuente":"ADAURA (Wu, NEJM 2020;383:1711)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["80 mg VO una vez por día durante 3 años","80 mg VO una vez por día durante 3 meses","800 mg VO por día durante 1 año completo","40 mg IV una vez por semana durante 3 años"],"explicacion":"En ADAURA se dio osimertinib 80 mg por vía oral una vez por día durante 3 años.","fuente":"ADAURA (Wu, NEJM 2020;383:1711)"}]},{"id":"hidatid-02","tema":"Quiste hidatídico hepático","anio":4,"titulo":"Quiste hepático unilocular en una mujer de campo","vineta":"Mujer de 34 años de una zona rural ganadera, con dolor leve en hipocondrio derecho. Ecografía: quiste hepático unilocular de 7 cm en el segmento VI, con pared doble visible y contenido anecoico, rodeado de parénquima. Serología positiva.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué estadio de la OMS (WHO-IWGE) tiene?","opciones":["CE1, activo y unilocular","CE2, activo y multivesicular","CE4, inactivo y heterogéneo","CE5, inactivo y calcificado"],"explicacion":"Un quiste unilocular anecoico con pared doble visible es CE1, activo. CE2 tiene vesículas hijas, CE3 membranas desprendidas o matriz sólida, y CE4 y CE5 son inactivos.","fuente":"WHO-IWGE 2010 según la revisión de 2026 (World J Radiol); Hermes: Equinococosis hepática"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento es una opción de primera línea para este quiste?","opciones":["PAIR percutánea con albendazol","Albendazol solo durante 1 mes","Observación sin tratamiento","Hepatectomía derecha reglada"],"explicacion":"La PAIR (punción, aspiración, inyección y reaspiración) está indicada en los quistes CE1 y CE3a, en general de más de 5 cm. Combinada con albendazol tiene una eficacia comparable a la cirugía con menos complicaciones, y supera al albendazol solo. La observación es para quistes inactivos.","fuente":"Revisión de radiología intervencionista en hidatidosis hepática, World J Radiol 2026; Hermes: Equinococosis hepática"},{"tipo":"Técnica","pregunta":"¿Qué escolicida se prefiere para la PAIR?","opciones":["Etanol (alcohol) al 95 %","Formol al 10 % en la cavidad","Agua oxigenada al 3 %","Iodopovidona al 1 %"],"explicacion":"En la PAIR se inyecta preferentemente etanol al 95 % y se reaspira después de un tiempo determinado.","fuente":"Revisión de equinococosis quística, Trop Med Infect Dis 2024"},{"tipo":"Diagnóstico","pregunta":"El líquido aspirado es amarillo y la tira de bilirrubina da positiva. ¿Qué hacés?","opciones":["No inyecto escolicida: suspendo o paso a catéter","Inyecto el doble de escolicida","Sigo con la PAIR como estaba planeada","Dejo el escolicida 24 horas en la cavidad"],"explicacion":"La bilis en el aspirado indica comunicación quistobiliar: el escolicida no debe llegar a la vía biliar, así que la PAIR se suspende o se convierte en drenaje con catéter.","fuente":"Revisión de radiología intervencionista, World J Radiol 2026; Hermes: Equinococosis hepática"}]},{"id":"hidatid-03","tema":"Quiste hidatídico hepático","anio":4,"titulo":"Quiste calcificado hallado de casualidad","vineta":"Varón de 66 años al que, en una ecografía por litiasis renal, le encuentran un quiste hepático de 4 cm con pared densamente calcificada y contenido sólido, sin dilatación de la vía biliar. Asintomático; hepatograma normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué estadio de la OMS tiene?","opciones":["CE5, inactivo y calcificado","CE1, activo y unilocular","CE3a, con membrana desprendida","CE2, con vesículas hijas"],"explicacion":"La pared densamente calcificada con contenido sólido corresponde a CE5, un quiste inactivo.","fuente":"WHO-IWGE 2010 según la revisión de 2026 (World J Radiol); Hermes: Equinococosis hepática"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué conducta indicás?","opciones":["Vigilancia ecográfica sin tratamiento","PAIR con albendazol","Quistoperiquistectomía programada","Albendazol durante 3 meses"],"explicacion":"WHO-IWGE recomienda vigilar sin tratar («watch and wait») los quistes inactivos (CE4 y CE5), no complicados y asintomáticos; el albendazol no se recomienda en quistes inactivos o calcificados.","fuente":"WHO-IWGE 2010 según la revisión de 2024 (Trop Med Infect Dis 9:36); Hermes: Equinococosis hepática"},{"tipo":"Fármaco","pregunta":"Si tuviera que tratar a otra paciente con albendazol, ¿en qué situación está contraindicado?","opciones":["En el primer trimestre del embarazo","En mayores de 60 años","En la hipertensión arterial controlada","Cuando la serología es negativa"],"explicacion":"El albendazol está contraindicado en el primer trimestre del embarazo y en quistes con riesgo de rotura; tampoco se recomienda en la hepatopatía crónica grave. La edad y la serología no lo contraindican.","fuente":"Revisiones de 2024 (Trop Med Infect Dis 9:36) y 2026 (World J Radiol)"}]},{"id":"biliar-01","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Dolor posprandial en hipocondrio derecho","vineta":"Mujer de 38 años. Dolor epigástrico y en hipocondrio derecho de 3 horas, iniciado después de una cena abundante, con náuseas. Afebril. Dolor leve en hipocondrio derecho, Murphy negativo. Leucocitos 8.200/mm³; hepatograma y lipasa normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Cólico biliar no complicado","Colecistitis aguda grado I (leve)","Coledocolitiasis sin colangitis","Pancreatitis aguda biliar leve"],"explicacion":"Dolor de pocas horas sin fiebre, sin Murphy y con laboratorio normal es dolor biliar no complicado. La colecistitis exige signos locales (Murphy, masa) más signos sistémicos (fiebre, leucocitosis, PCR) e imagen compatible; un hepatograma normal hace improbable la coledocolitiasis y la lipasa normal descarta pancreatitis.","fuente":"Hermes: Colelitiasis y cólico biliar; criterios diagnósticos TG18"},{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía abdominal","TC de abdomen con contraste","Colangiorresonancia","CPRE"],"explicacion":"La ecografía es el estudio inicial: muestra los cálculos o el barro y busca pared engrosada, líquido, Murphy ecográfico y dilatación de la vía biliar. Colangiorresonancia y CPRE se reservan para sospecha de vía biliar; la TC, para complicaciones o diagnósticos alternativos.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Fármaco","pregunta":"¿Qué analgésico indicás como primera línea?","opciones":["AINE (ketorolac)","Antiespasmódico solo (butilescopolamina)","Antibiótico (ceftriaxona)","Omeprazol solo"],"explicacion":"Los AINE alivian el cólico biliar más que el placebo y que los antiespasmódicos, y redujeron las complicaciones a corto plazo (colecistitis, pancreatitis, ictericia). Los opioides dan un alivio similar y quedan para dolor refractario o contraindicación de AINE. Sin infección no hay indicación de antibiótico.","fuente":"Cochrane 2016, AINE en cólico biliar (Fraquelli, CD006390)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de ketorolac indicás en esta paciente de 38 años con función renal normal?","opciones":["30 mg IV en dosis única","10 mg IV cada 4 horas","60 mg IV cada 6 horas","120 mg IV en dosis única"],"explicacion":"La dosis IV única en adultos menores de 65 años es 30 mg; se reduce a 15 mg en mayores de 65 años, peso menor de 50 kg o insuficiencia renal. El máximo diario es 120 mg y no debe superarse con dosis de 60 mg IV repetidas ni en un solo bolo.","fuente":"Ficha técnica de ketorolac trometamina (FDA)"},{"tipo":"Medidas generales","pregunta":"Cede el dolor. ¿Qué indicás al alta?","opciones":["Alta con analgesia y pautas de alarma: fiebre, ictericia o dolor persistente","Internación y colecistectomía de urgencia dentro de las 24 horas, aunque haya cedido el dolor","Ácido ursodesoxicólico para disolver los cálculos y evitar la cirugía","Ayuno e hidratación intravenosa hasta la cirugía programada"],"explicacion":"El cólico no complicado se maneja en forma ambulatoria. Fiebre, ictericia, hipotensión o dolor persistente sugieren una complicación y obligan a consultar. La disolución farmacológica tiene utilidad excepcional y no reemplaza la cirugía.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es el tratamiento definitivo?","opciones":["Colecistectomía laparoscópica electiva","Observación: es una litiasis asintomática","Colecistectomía abierta de urgencia","CPRE con esfinterotomía"],"explicacion":"El dolor biliar típico indica colecistectomía laparoscópica programada. Solo la litiasis verdaderamente asintomática se observa; no hay indicación de urgencia ni de CPRE sin compromiso de la vía biliar.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Técnica","pregunta":"En la colecistectomía, ¿qué condición tenés que cumplir antes de clipar y seccionar?","opciones":["Obtener la visión crítica de seguridad de Strasberg","Identificar el cístico por la forma de embudo del infundíbulo","Seccionar la primera estructura tubular que llega a la vesícula","Disecar primero la vía biliar principal para localizarla"],"explicacion":"La visión crítica exige triángulo hepatocístico limpio de grasa, tercio inferior de la vesícula separado del lecho y solo dos estructuras entrando a la vesícula. El \"signo del embudo\" es la ilusión que explica la mayoría de las lesiones biliares; disecar la vía principal aumenta el riesgo de lesionarla.","fuente":"Guía multisocietaria de colecistectomía segura 2020; Hermes: Técnica de colecistectomía laparoscópica"}]},{"id":"biliar-02","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Fiebre y Murphy positivo de 30 horas","vineta":"Varón de 52 años, sin comorbilidades. Dolor en hipocondrio derecho de 30 horas, temperatura 38,1 °C, Murphy positivo, sin masa palpable. Leucocitos 13.500/mm³, PCR elevada, bilirrubina normal. Ecografía: cálculo impactado en el bacinete, pared de 5 mm, escaso líquido perivesicular.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad?","opciones":["Colecistitis aguda grado I (leve)","Colecistitis aguda grado II (moderada)","Colecistitis aguda grado III (grave)","Cólico biliar no complicado por litiasis"],"explicacion":"Cumple signos locales, sistémicos e imagen. No tiene criterios de grado II (leucocitos > 18.000, masa palpable, más de 72 horas o inflamación local marcada) ni disfunción orgánica (grado III), así que es grado I.","fuente":"TG18, criterios diagnósticos y de gravedad; Hermes: Colecistitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Cefazolina","Ampicilina-sulbactam","Ciprofloxacina","Meropenem"],"explicacion":"TG18 propone para el grado I comunitario cefalosporinas como cefazolina. Ampicilina-sulbactam no se recomienda si la resistencia local de E. coli supera el 20 %. Las quinolonas se usan solo con sensibilidad conocida o alergia a betalactámicos, y los carbapenémicos se reservan.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Cefazolina 2 g IV cada 8 horas","Cefazolina 1 g IV cada 24 horas","Cefazolina 500 mg VO cada 6 horas","Cefazolina 4 g IV cada 6 horas por 7 días"],"explicacion":"La dosis IV para adultos es 1 a 2 g cada 8 horas. Cada 24 horas no alcanza niveles útiles por su vida media corta; no se administra por vía oral y 4 g cada 6 horas excede la dosis recomendada.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo operás?","opciones":["Colecistectomía laparoscópica temprana en esta internación","Antibióticos y colecistectomía diferida a las 6 a 8 semanas","Colecistostomía percutánea y antibióticos hasta que se resuelva","Tratamiento médico con antibióticos, sin cirugía posterior programada"],"explicacion":"WSES 2020 recomienda colecistectomía laparoscópica temprana, dentro de los 7 días del ingreso y 10 del inicio de síntomas. La estrategia diferida aumenta la morbilidad acumulada y la estancia. La colecistostomía es para fisiología prohibitiva.","fuente":"WSES 2020; Hermes: Colecistitis aguda"},{"tipo":"Medidas generales","pregunta":"Operado sin complicaciones, ¿cuánto dura el antibiótico?","opciones":["Se suspende dentro de las 24 horas de la colecistectomía","Se completan 7 días desde el inicio del tratamiento","Se completan 14 días, pasando a vía oral después del alta","Se mantiene de 4 a 7 días después de la cirugía"],"explicacion":"En los grados I y II, TG18 indica suspender el antibiótico dentro de las 24 horas de la colecistectomía. Los 4 a 7 días tras controlar el foco corresponden a la colangitis y a la colecistitis grado III.","fuente":"TG18 antimicrobianos, duración (Gomi 2018)"},{"tipo":"Técnica","pregunta":"El triángulo hepatocístico está bloqueado por la inflamación y no lográs la visión crítica. ¿Qué hacés?","opciones":["Colecistectomía subtotal u otra técnica de rescate, sin seguir disecando a ciegas","Clipar la estructura más evidente y continuar con la disección","Seccionar el infundíbulo y considerar cístico lo que sale de él","Insistir en la disección del triángulo hasta encontrar el cístico, aunque lleve más tiempo"],"explicacion":"Sin visión crítica no se corta. Las alternativas son colecistectomía subtotal, fondo primero, conversión, colecistostomía o pedir ayuda. La guía multisocietaria favorece la subtotal sobre la total por fondo primero cuando la anatomía no puede definirse.","fuente":"Guía multisocietaria de colecistectomía segura 2020; Hermes: Colecistectomía subtotal"}]},{"id":"biliar-03","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Cuatro días de dolor y masa palpable","vineta":"Mujer de 67 años, hipertensa controlada, sin alergias. Dolor en hipocondrio derecho de 96 horas, temperatura 38,6 °C y masa dolorosa palpable. Leucocitos 19.800/mm³. Presión, creatinina y plaquetas normales. Ecografía: pared de 8 mm, líquido perivesicular y cálculo en el bacinete.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado de Tokio tiene?","opciones":["Grado II (moderado)","Grado I (leve)","Grado III (grave)","No cumple criterios de colecistitis"],"explicacion":"Tiene criterios de grado II: leucocitos mayores de 18.000, masa palpable y más de 72 horas de evolución. No hay disfunción cardiovascular, renal, respiratoria, neurológica, hepática ni hematológica, que definirían el grado III.","fuente":"TG18, gravedad de la colecistitis; Hermes: Colecistitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Ceftriaxona","Cefazolina IV","Ampicilina-sulbactam","Ciprofloxacina"],"explicacion":"TG18 propone para el grado II cefalosporinas de tercera generación como ceftriaxona. La cefazolina figura para el grado I; ampicilina-sulbactam no se recomienda con resistencia de E. coli mayor del 20 %; la quinolona solo con sensibilidad conocida o alergia. El metronidazol se agrega únicamente si hay anastomosis biliodigestiva.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Ceftriaxona 2 g IV cada 24 horas","Ceftriaxona 500 mg IM en dosis única","Ceftriaxona 2 g IV cada 6 horas por 10 días","Ceftriaxona 250 mg VO cada 12 horas"],"explicacion":"La dosis IV para adultos es de 1 a 2 g cada 12 a 24 horas; 2 g cada 24 horas es un esquema habitual. Una dosis única IM es la de gonococia, cada 6 horas es sobredosis y no existe la vía oral.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"Paciente operable y centro con experiencia. ¿Qué indicás?","opciones":["Colecistectomía laparoscópica temprana en esta internación","Antibióticos, alta y colecistectomía diferida a las 6 semanas","Colecistostomía percutánea y colecistectomía diferida","Colecistectomía abierta, porque ya pasaron más de 72 horas"],"explicacion":"Superar las 72 horas no contraindica la cirugía. En un ensayo con pacientes de más de 72 horas, operar en la internación redujo la morbilidad acumulada (14 % frente a 39 %) y la estancia. La colecistostomía es para quien no tolera la cirugía.","fuente":"WSES 2020; ensayo de Roulin; Hermes: Colecistitis aguda"},{"tipo":"Estudios","pregunta":"¿Qué muestra tomás en la cirugía?","opciones":["Cultivo de la bilis vesicular","No tomo cultivos: no cambian la conducta","Biopsia hepática en cuña del lecho","Cultivo solo si encontrás pus franco"],"explicacion":"TG18 recomienda cultivar la bilis vesicular en toda colecistitis excepto el grado I, para dirigir el tratamiento si la evolución no es la esperada.","fuente":"TG18 antimicrobianos, recomendación 1C (Gomi 2018)"}]},{"id":"biliar-04","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Colecistitis con shock en un paciente frágil","vineta":"Varón de 84 años con insuficiencia cardíaca (fracción de eyección 25 %) y EPOC con oxígeno domiciliario, ASA IV. Tres días de dolor en hipocondrio derecho, temperatura 38,9 °C, presión 85/50 mmHg que requiere noradrenalina tras la reanimación, creatinina 2,4 mg/dl. Ecografía: colecistitis litiásica con pared de 9 mm.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado de Tokio tiene?","opciones":["Grado III (grave)","Grado II (moderado)","Grado I (leve) de Tokio","Colangitis aguda grado III"],"explicacion":"La necesidad de vasopresores (disfunción cardiovascular) y la creatinina mayor de 2 mg/dl (disfunción renal) definen el grado III. No hay ictericia ni dilatación biliar que sugieran colangitis.","fuente":"TG18, gravedad de la colecistitis"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico empírico indicás?","opciones":["Piperacilina-tazobactam más vancomicina","Ceftriaxona sola","Cefazolina en monoterapia","Ampicilina-sulbactam en monoterapia"],"explicacion":"Para el grado III, TG18 propone piperacilina-tazobactam, cefepime o carbapenémicos, y agrega vancomicina para cubrir Enterococcus en la infección comunitaria grave. Ceftriaxona y cefazolina corresponden a grados menores.","fuente":"TG18 antimicrobianos, tabla 3 y nota a (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de piperacilina-tazobactam indicás?","opciones":["4,5 g IV cada 6 horas","4,5 g IV cada 24 horas","2,25 g VO cada 12 horas","1 g IV cada 8 horas por 3 días"],"explicacion":"La dosis estándar es 3,375 g cada 6 horas y se aumenta a 4,5 g cada 6 horas cuando se busca cubrir Pseudomonas, como en la infección grave. No hay presentación oral y cada 24 horas es insuficiente.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Drenaje percutáneo urgente de la vesícula y soporte intensivo","Colecistectomía laparoscópica inmediata, apenas se estabilice la presión","Antibióticos y soporte en terapia intensiva, sin drenaje","Colecistectomía abierta de urgencia como primer gesto"],"explicacion":"En el grado III con falla orgánica no rápidamente reversible y comorbilidad grave, TG18 indica soporte y drenaje urgente o temprano. El drenaje es el puente o la alternativa cuando la fisiología es prohibitiva; no debe usarse solo por una etiqueta inespecífica de alto riesgo.","fuente":"TG18 flujograma de grado III; Hermes: Colecistitis aguda y Drenaje de la vesícula biliar"},{"tipo":"Estudios","pregunta":"¿Qué cultivos pedís?","opciones":["Hemocultivos y cultivo de la bilis del drenaje","No pido cultivos porque no cambian el antibiótico empírico","Urocultivo, para descartar un foco urinario de la sepsis","Hemocultivos, y espero el resultado para iniciar el antibiótico"],"explicacion":"Los hemocultivos no se recomiendan de rutina solo en el grado I comunitario; en el grave sí. La bilis se cultiva al inicio de todo procedimiento. Los cultivos nunca deben demorar el antibiótico en un paciente en shock.","fuente":"TG18 antimicrobianos (Gomi 2018)"}]},{"id":"biliar-05","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Ictericia con cálculo en el colédoco","vineta":"Mujer de 49 años con cólicos biliares previos. Ictericia de 3 días y coluria, afebril y estable. Bilirrubina total 5,2 mg/dl, fosfatasa alcalina triplicada. Ecografía: colelitiasis, colédoco de 10 mm con imagen de cálculo distal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué probabilidad de coledocolitiasis tiene?","opciones":["Alta: el cálculo se ve en la ecografía","Intermedia: requiere colangiorresonancia","Baja: alcanza con la colecistectomía","Es una colangitis aguda"],"explicacion":"ASGE 2019 considera alto riesgo el cálculo visto en imágenes, la colangitis o la bilirrubina mayor de 4 mg/dl con colédoco dilatado; esta paciente cumple dos. Sin fiebre ni signos inflamatorios no es colangitis.","fuente":"ASGE 2019; Hermes: Coledocolitiasis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué estrategia indicás?","opciones":["Extraer el cálculo (CPRE o exploración laparoscópica) y colecistectomía","Colangiorresonancia y ecoendoscopia para confirmar el cálculo antes de decidir","Colecistectomía sola, esperando que el cálculo migre al duodeno","Ácido ursodesoxicólico y nueva ecografía de control en 3 meses"],"explicacion":"En alto riesgo se va directo al tratamiento: CPRE con esfinterotomía o exploración laparoscópica de la vía biliar según experiencia, y colecistectomía para evitar la recurrencia. Repetir estudios diagnósticos solo demora; el cálculo con ictericia no se deja librado a la migración.","fuente":"ASGE 2019 y ESGE 2019; Hermes: Coledocolitiasis"},{"tipo":"Fármaco","pregunta":"Antes de la CPRE, ¿qué indicás para prevenir la pancreatitis posprocedimiento?","opciones":["Diclofenac o indometacina 100 mg rectal, justo antes de la CPRE","Indometacina 25 mg por vía oral cada 8 horas durante los 3 días previos","Octreótido 100 µg subcutáneo antes de la CPRE y cada 8 horas después","Diclofenac 100 mg por vía rectal, solo si aparece dolor después de la CPRE"],"explicacion":"ESGE 2020 recomienda 100 mg de diclofenac o indometacina rectal de rutina, inmediatamente antes de la CPRE, en todos los pacientes sin contraindicación para AINE. Su efecto es preventivo: darlo al aparecer el dolor no sirve, y la vía oral u octreótido no demostraron beneficio.","fuente":"ESGE 2020, profilaxis de pancreatitis pos-CPRE; Hermes: Complicaciones de la CPRE y la esfinterotomía"},{"tipo":"Técnica","pregunta":"El cálculo mide 18 mm y no sale con balón ni canastilla. ¿Qué hacés?","opciones":["Esfinterotomía limitada y dilatación con balón grande; si falla, prótesis","Terminar la CPRE sin drenaje y reintentar la extracción en otra sesión","Ampliar la esfinterotomía al máximo posible hasta lograr extraer el cálculo entero","Indicar ursodesoxicólico y repetir la CPRE en 6 meses sin dejar prótesis"],"explicacion":"ESGE propone esfinterotomía limitada con dilatación con balón grande para cálculos difíciles, y litotricia guiada por colangioscopia si está disponible. Si no se logra la limpieza, una prótesis temporal asegura el drenaje hasta un nuevo intento. Una esfinterotomía excesiva aumenta el riesgo de perforación y sangrado.","fuente":"ESGE 2019; Hermes: Coledocolitiasis"}]},{"id":"biliar-06","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Fiebre con escalofríos e ictericia en un anciano","vineta":"Varón de 78 años. Fiebre de 39,2 °C con escalofríos, ictericia y dolor en hipocondrio derecho. Lúcido, presión 120/75 mmHg, creatinina normal. Leucocitos 16.000/mm³, bilirrubina 4,1 mg/dl, albúmina normal. Ecografía: colédoco de 12 mm con litiasis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad?","opciones":["Colangitis aguda grado II (moderada)","Colangitis aguda grado I (leve)","Colangitis aguda grado III (grave)","Colecistitis aguda litiásica grado II"],"explicacion":"Es grado II por tener al menos dos criterios: leucocitos mayores de 12.000, fiebre de 39 °C o más y edad de 75 años o más. No hay disfunción orgánica (hipotensión, confusión, falla renal), que definiría el grado III.","fuente":"TG18, gravedad de la colangitis; Hermes: Clasificación de gravedad de Tokio"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Drenaje biliar por CPRE dentro de las 48 horas, con antibióticos","Antibióticos solos y CPRE electiva a las 2 semanas si persiste la ictericia","Colecistectomía de urgencia con exploración de la vía biliar","Drenaje percutáneo como primera opción aunque la papila sea accesible"],"explicacion":"En el grado II el drenaje temprano o urgente (dentro de las 48 horas) reduce la mortalidad. La CPRE es la primera opción si el acceso papilar es posible; la vía percutánea, ecoendoscópica o quirúrgica son rescates.","fuente":"TG18; Hermes: Colangitis aguda y Clasificación de gravedad de Tokio"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Ceftriaxona","Cefazolina IV","Ampicilina-sulbactam","Amoxicilina por vía oral"],"explicacion":"Para la colangitis grado II comunitaria TG18 propone cefalosporinas de tercera generación como ceftriaxona. La cefazolina es para el grado I y la ampicilina-sulbactam no se recomienda con resistencia mayor del 20 %.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Medidas generales","pregunta":"Después de drenar la vía, ¿cuánto dura el antibiótico?","opciones":["De 4 a 7 días una vez controlado el foco","Se suspende a las 24 horas del drenaje","Completar 14 días desde el drenaje","Hasta que se normalice la bilirrubina sérica"],"explicacion":"TG18 recomienda 4 a 7 días tras el control del foco. Solo se prolonga a un mínimo de 2 semanas si hay bacteriemia por Enterococcus o Streptococcus, por el riesgo de endocarditis.","fuente":"TG18 antimicrobianos, duración (Gomi 2018)"},{"tipo":"Estudios","pregunta":"¿Qué muestra tomás durante la CPRE?","opciones":["Cultivo de la bilis al inicio del procedimiento","Biopsia de la papila para descartar ampuloma","Citología de la bilis para descartar neoplasia","No tomo muestras: el antibiótico ya está indicado"],"explicacion":"TG18 recomienda obtener cultivo de bilis al comienzo de todo procedimiento biliar para orientar el tratamiento dirigido y la desescalada.","fuente":"TG18 antimicrobianos, recomendación 1C (Gomi 2018)"}]},{"id":"biliar-07","tema":"Pancreatitis aguda","anio":2,"titulo":"Dolor epigástrico transfixiante","vineta":"Mujer de 44 años. Dolor epigástrico transfixiante de 8 horas con vómitos. Lipasa 1.900 U/l (más de tres veces el límite superior). Ecografía: colelitiasis, colédoco de 5 mm. Bilirrubina 1,3 mg/dl. Afebril, sin hipotensión, oxigenación ni función renal alteradas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad inicial?","opciones":["Pancreatitis aguda biliar leve (por ahora)","Pancreatitis aguda biliar moderadamente grave","Pancreatitis aguda biliar grave","Colangitis aguda grado I"],"explicacion":"Cumple dos de tres criterios (dolor típico y lipasa mayor del triple). Sin falla orgánica ni complicaciones locales se considera leve, y se reclasifica a las 24, 48 horas y 7 días. No hay fiebre ni colestasis para pensar en colangitis.","fuente":"Atlanta revisada (Banks 2013); Hermes: Pancreatitis aguda"},{"tipo":"Estudios","pregunta":"¿Pedís una TC con contraste al ingreso?","opciones":["No: el diagnóstico ya está hecho con clínica y lipasa","Sí, para graduar la gravedad y buscar necrosis desde el inicio","No, pido una CPRE diagnóstica para buscar el cálculo","Sí, junto con una colangiorresonancia urgente"],"explicacion":"Con dolor típico y enzimas elevadas no hace falta TC al ingreso; la TC precoz subestima la necrosis y es más confiable a los 5 a 7 días si la evolución no es buena. La CPRE diagnóstica no está indicada.","fuente":"Atlanta revisada (Banks 2013); Hermes: Pancreatitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué hidratación indicás?","opciones":["Ringer lactato 1,5 ml/kg/h, con bolo de 10 ml/kg solo si hay hipovolemia","Solución fisiológica 20 ml/kg en bolo y luego 3 ml/kg/h durante 48 horas","Restricción hídrica a 1.000 ml/día para evitar el edema pulmonar","Coloides (hidroxietilalmidón) 2 ml/kg/h hasta normalizar la diuresis"],"explicacion":"La reanimación moderada con Ringer lactato redujo la sobrecarga de volumen sin empeorar la evolución frente a la agresiva (ensayo WATERFALL). Se reduce o suspende el aporte si aparecen signos de sobrecarga.","fuente":"iLATAM-AP 2026 y ensayo WATERFALL; Hermes: Pancreatitis aguda"},{"tipo":"Medidas generales","pregunta":"¿Cuándo empieza a comer?","opciones":["Alimentación oral precoz según tolerancia, aun en las primeras 24 horas","Ayuno hasta que se normalice la lipasa y luego dieta líquida progresiva","Nutrición parenteral total hasta que ceda la inflamación","Sonda nasoyeyunal y alimentación enteral por 7 días"],"explicacion":"La alimentación oral se reinicia dentro de las 24 a 48 horas si se tolera, y en los cuadros leves puede comenzar de inmediato. Esperar a que baje la lipasa no tiene fundamento; la nutrición artificial se reserva para quien no tolera la vía oral.","fuente":"Hermes: Pancreatitis aguda"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No, porque no hay infección documentada","Imipenem profiláctico durante 14 días completos","Ceftriaxona durante 7 días por la litiasis","Metronidazol
