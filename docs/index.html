urante 7 días","No indico antibióticos: es una cirugía limpia","Antibióticos orales durante 14 días a partir del alta hospitalaria"],"explicacion":"En la apendicitis no complicada alcanza la profilaxis preoperatoria; los antibióticos posoperatorios no reducen las complicaciones.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Cómo cerrás el muñón apendicular?","opciones":["Ligadura con endoloop o sutura, sin invaginación","Ligadura e invaginación en bolsa de tabaco","Dejarlo abierto con un drenaje en la fosa ilíaca","Engrapadora lineal de rutina en la base"],"explicacion":"La ligadura simple es adecuada y la invaginación no aporta beneficio. La engrapadora se reserva para bases inflamadas o anchas.","fuente":"WSES 2020, apendicitis aguda"}]},{"id":"apend-02","tema":"Apendicitis aguda","anio":1,"titulo":"Apendicitis perforada","vineta":"Mujer de 38 años con 4 días de dolor en fosa ilíaca derecha, fiebre de 38,8 °C y peritonismo localizado. TC: apéndice perforado con líquido libre y gas extraluminal, sin absceso organizado. Estable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Apendicectomía laparoscópica urgente y aspiración","Antibióticos solos y TC de control a las 72 horas","Drenaje percutáneo guiado por TC y antibióticos","Antibióticos y apendicectomía diferida a las 8 semanas"],"explicacion":"La apendicitis perforada con peritonitis requiere control quirúrgico del foco. El drenaje percutáneo es para el absceso organizado en pacientes seleccionados.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Lavado peritoneal abundante?","opciones":["No: se aspira el pus sin lavado de rutina","Sí, con 10 litros de solución tibia","Sí, con iodopovidona diluida","Sí, con antibióticos en el lavado"],"explicacion":"El lavado no redujo los abscesos frente a la aspiración sola en la apendicitis complicada.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico indicás?","opciones":["Ceftriaxona más metronidazol","Ampicilina-sulbactam en monoterapia","Cefalexina por vía oral durante 10 días","Vancomicina IV en monoterapia"],"explicacion":"La infección intraabdominal comunitaria se cubre contra enterobacterias y anaerobios, por ejemplo con cefalosporina de tercera generación más metronidazol. Ampicilina-sulbactam no se recomienda por la resistencia de E. coli.","fuente":"SIS/IDSA 2010, infección intraabdominal complicada"},{"tipo":"Dosis","pregunta":"¿Qué dosis de metronidazol?","opciones":["500 mg IV cada 8 horas","50 mg IV cada 24 horas","2 g IV cada 6 horas","250 mg VO cada 48 horas"],"explicacion":"La dosis IV es 500 mg cada 8 a 12 horas o 1500 mg cada 24 horas.","fuente":"SIS/IDSA 2010, tabla de dosis"},{"tipo":"Medidas generales","pregunta":"¿Cuánto dura el antibiótico tras un buen control del foco?","opciones":["De 3 a 5 días","De 14 días completos","Hasta normalizar los leucocitos","Una dosis única"],"explicacion":"Con control adecuado del foco, WSES 2020 propone 3 a 5 días; en el ensayo STOP-IT, 4 días fueron tan efectivos como tratamientos más largos.","fuente":"WSES 2020; ensayo STOP-IT"}]},{"id":"hernia-03","tema":"Hernia inguinal","anio":1,"titulo":"Bulto inguinal en una mujer","vineta":"Mujer de 52 años con un bulto reducible en la ingle derecha, por debajo de la línea entre la espina ilíaca y el pubis, que molesta al estar de pie.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tenés que descartar especialmente?","opciones":["Hernia crural (femoral)","Hidrocele","Varicocele","Testículo no descendido"],"explicacion":"En las mujeres las hernias crurales son proporcionalmente más frecuentes y tienen alto riesgo de estrangulación; se ubican por debajo del ligamento inguinal.","fuente":"Hermes: Hernia inguinal; Hernia crural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué abordaje preferís?","opciones":["TEP o TAPP, que explora el orificio crural","Lichtenstein con malla, como en el varón","Observación hasta que aparezca dolor","Bassini con refuerzo del ligamento inguinal"],"explicacion":"En la mujer se prefiere el abordaje posterior, que permite ver y reparar una hernia crural oculta; tras un Lichtenstein en mujeres, muchas recurrencias son crurales.","fuente":"HerniaSurge; Hermes: Hernia inguinal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Indicarías espera vigilada?","opciones":["No: en la mujer con sospecha crural se repara","Sí, como en el varón con pocos síntomas","Sí, hasta que aparezca alguna complicación","Sí, con faja y control clínico anual"],"explicacion":"La espera vigilada aceptada en varones con pocos síntomas no se extrapola a mujeres, por la frecuencia de hernias crurales y su riesgo de estrangulación.","fuente":"Hermes: Hernia inguinal"}]},{"id":"umb-01","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical en un cirrótico","vineta":"Varón de 58 años con cirrosis alcohólica, abstinente, ascitis controlada con diuréticos, MELD 12. Hernia umbilical de 2 cm sintomática, con piel sana.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Lo operás en forma programada?","opciones":["Sí, tras optimizar la ascitis, porque el MELD es menor de 15","No, por el alto riesgo de descompensación hepática tras la cirugía","No, se espera y se opera si se complica","Sí, en las próximas horas, sin optimizar"],"explicacion":"La reparación electiva es segura en cirróticos con MELD menor de 15 tras optimizar; la urgencia multiplica por siete la mortalidad, y entre 26 % y 37 % de los no operados termina en una reparación urgente.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales; Hermes: Hernia umbilical del adulto"},{"tipo":"Técnica","pregunta":"¿Qué técnica indicás?","opciones":["Reparación abierta con malla onlay o preperitoneal","Sutura simple con puntos separados","Malla intraperitoneal por vía laparoscópica","Plicatura de la aponeurosis sin malla"],"explicacion":"La sutura recidiva alrededor del 15 % a los 6 meses y la laparoscopia con ascitis aumentó las complicaciones sistémicas y la mortalidad.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Medidas generales","pregunta":"¿Qué medida perioperatoria es clave?","opciones":["Controlar la ascitis antes y después para evitar fuga y recurrencia","Suspender los diuréticos una semana antes de la cirugía","Dieta hiperproteica sin restricción de sodio para mejorar la cicatrización","Paracentesis evacuadora cada día durante un mes"],"explicacion":"La ascitis no controlada aumenta la presión sobre la reparación, la fuga de líquido y la infección; se optimiza con el equipo de hepatología.","fuente":"Hermes: Hernia umbilical del adulto"}]},{"id":"umb-02","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical en edad fértil","vineta":"Mujer de 30 años con una hernia umbilical de 1,5 cm, reducible y poco sintomática. Planea dos embarazos más.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo la operás?","opciones":["Postergarla hasta después del último embarazo, si es posible","Ahora, con malla, antes del próximo embarazo","Durante el próximo embarazo, en el segundo trimestre","No se opera: se cierra sola después del parto"],"explicacion":"Un embarazo posterior aumenta 1,6 veces la recurrencia, y la hernia rara vez se complica durante la gestación. Por eso se sugiere esperar al último embarazo.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Técnica","pregunta":"Si no pudiera esperar, ¿qué técnica sugiere la guía?","opciones":["Sutura del defecto","Malla intraperitoneal","Malla retromuscular amplia","Separación de componentes"],"explicacion":"En mujeres que se van a embarazar, la malla redujo la recurrencia pero casi duplicó el dolor crónico (17,5 % frente a 9,5 %), por lo que se sugiere sutura si la cirugía no puede postergarse.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Medidas generales","pregunta":"¿Qué le indicás mientras espera?","opciones":["Pautas de alarma de incarceración","Faja abdominal durante todo el día","Reposo relativo y evitar levantar peso","Control con ecografía cada 3 meses"],"explicacion":"Con hernia reducible se observa, pero la paciente debe consultar ante dolor persistente, irreductibilidad o vómitos.","fuente":"Hermes: Hernia umbilical del adulto"}]},{"id":"ped-01","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Bulto inguinal en un lactante","vineta":"Lactante de 4 meses, nacido a término, con un bulto inguinal derecho que aparece al llorar y se reduce solo. Examen normal en reposo; testículos en las bolsas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hernia inguinal indirecta","Hidrocele no comunicante","Testículo retráctil","Adenopatía inguinal"],"explicacion":"Un bulto intermitente que aumenta con el llanto y se reduce es una hernia indirecta por un proceso vaginal permeable.","fuente":"Hermes: Hernia inguinal en el niño"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reparación programada pronta","Observar hasta los 2 años","Braguero hasta el cierre","Operar solo si se incarcera"],"explicacion":"Toda hernia inguinal pediátrica se repara porque no se cierra sola y el riesgo de incarceración es alto en lactantes (12 % a término, 39 % en prematuros).","fuente":"Guía EUPSA 2022; Hermes: Hernia inguinal en el niño"},{"tipo":"Técnica","pregunta":"¿En qué consiste la reparación?","opciones":["Ligadura alta del saco, sin malla","Lichtenstein con malla liviana","Reparación de Shouldice","Malla preperitoneal pequeña"],"explicacion":"El defecto es el proceso vaginal permeable: se liga el saco preservando deferente y vasos. No se usa malla. Abierta y laparoscópica tienen resultados similares.","fuente":"Guía EUPSA 2022; Hermes: Hernia inguinal en el niño"}]},{"id":"ped-02","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Bolsa escrotal vacía","vineta":"Lactante de 8 meses con el testículo izquierdo no palpable en la bolsa; se palpa en el conducto inguinal y no desciende con maniobras.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Testículo no descendido palpable","Testículo retráctil inguinal","Hidrocele del cordón","Hernia inguinal irreductible"],"explicacion":"Un testículo palpable en el conducto que no baja a la bolsa con maniobras es un testículo no descendido; el retráctil puede llevarse a la bolsa y se queda.","fuente":"EAU, guías de urología pediátrica"},{"tipo":"Estudios","pregunta":"¿Pedís una ecografía?","opciones":["No: no cambia la conducta","Sí, para medir el volumen testicular","Sí, y una resonancia de pelvis","Sí, junto con un cariotipo"],"explicacion":"La imagen no aporta en el testículo palpable y no localiza de forma confiable el no palpable, que se estudia por laparoscopia.","fuente":"EAU, guías de urología pediátrica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo lo operás?","opciones":["Orquidopexia entre los 6 y los 12 meses","Orquidopexia a los 5 años, antes de la escuela","Orquidopexia en la pubertad","Tratamiento hormonal sin cirugía"],"explicacion":"La cirugía temprana preserva la fertilidad y facilita el control del riesgo tumoral. El tratamiento hormonal no se recomienda como estándar.","fuente":"EAU, guías de urología pediátrica"}]},{"id":"ped-03","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Dolor escrotal súbito en un adolescente","vineta":"Varón de 14 años con dolor escrotal izquierdo súbito e intenso desde hace 3 horas, náuseas. Testículo ascendido, horizontal, reflejo cremastérico ausente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Torsión testicular","Epididimitis","Torsión de hidátide","Orquitis urliana"],"explicacion":"Dolor súbito, testículo alto y horizontal y cremastérico ausente en un adolescente son torsión hasta demostrar lo contrario.","fuente":"Hermes: Torsión testicular"},{"tipo":"Estudios","pregunta":"¿Esperás la ecografía Doppler para decidir?","opciones":["No: con alta sospecha se explora de inmediato","Sí, para confirmar la falta de flujo","Sí, una centellografía testicular","Sí, y un urocultivo para descartar epididimitis"],"explicacion":"Una ecografía normal no descarta la torsión y la demora reduce la viabilidad, que cae mucho después de las 6 horas. Con sospecha alta, el quirófano no espera la imagen.","fuente":"Hermes: Torsión testicular"},{"tipo":"Técnica","pregunta":"El testículo recupera el color tras destorcerlo. ¿Qué hacés?","opciones":["Orquidopexia de ambos testículos","Orquidopexia solo del lado afectado","Orquiectomía del lado afectado","Destorcer y cerrar sin fijar"],"explicacion":"La anomalía de fijación (badajo de campana) suele ser bilateral, por lo que se fijan ambos testículos. Si el testículo no es viable, se extirpa y se fija el contralateral.","fuente":"Hermes: Torsión testicular"}]},{"id":"var-01","tema":"Várices de miembros inferiores","anio":1,"titulo":"Várices sintomáticas","vineta":"Mujer de 48 años con pesadez y edema vespertino en la pierna derecha y várices en el territorio de la safena interna. Eco Doppler: reflujo de la unión safenofemoral y de la safena interna en todo el muslo. Sin úlcera.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás en CEAP clínica?","opciones":["C2 o C3 (várices, edema)","C0 (sin signos visibles)","C5 (úlcera cicatrizada)","C6 (úlcera venosa activa)"],"explicacion":"La clasificación CEAP clínica va de C0 (sin signos) a C6 (úlcera activa): C2 son várices, C3 edema, C4 cambios cutáneos, C5 úlcera cicatrizada.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Medias de compresión, actividad física, control de peso y elevación","Reposo en cama con las piernas en alto durante el día","Calor local y masajes circulares diarios sobre los trayectos varicosos","Anticoagulación oral profiláctica y medias durante 3 meses"],"explicacion":"La compresión alivia los síntomas y el edema, junto con ejercicio, descenso de peso y elevación. No corrige el reflujo.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento definitivo es de primera elección?","opciones":["Ablación térmica endovenosa de la safena interna","Safenectomía con fleboextracción como primera opción","Escleroterapia con espuma de la unión safenofemoral como estándar","Ligadura del cayado sola"],"explicacion":"ESVS 2022 recomienda la ablación térmica endovenosa (láser o radiofrecuencia) sobre la cirugía para la insuficiencia de safena interna, por menor dolor y recuperación más rápida con resultados similares. La cirugía sigue siendo opción donde no hay ablación.","fuente":"ESVS 2022, enfermedad venosa crónica"}]},{"id":"ano-01","tema":"Patología anal","anio":1,"titulo":"Sangrado y prolapso al defecar","vineta":"Varón de 45 años con sangrado rojo rutilante al final de la defecación y prolapso que se reduce solo. Constipación crónica. Anoscopia: hemorroides internas de grado II.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado tienen y qué más evaluás?","opciones":["Grado II; evaluar colonoscopia según edad y síntomas","Grado IV; indicar hemorroidectomía sin más estudios","Grado I; repetir la anoscopia en un año","Grado III; pedir una TC de abdomen"],"explicacion":"Las internas se gradúan de I (no prolapsan) a IV (irreductibles). El sangrado no debe atribuirse a hemorroides sin descartar otras causas según edad y síntomas.","fuente":"ASCRS 2018, hemorroides; Hermes: Enfermedad hemorroidal"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero?","opciones":["Más fibra y agua, y no pujar ni demorar en el inodoro","Hemorroidectomía programada en las próximas semanas, sin otra medida","Dieta sin residuos para disminuir el volumen fecal","Reposo y baños de asiento con agua fría"],"explicacion":"La modificación de la dieta con fibra y líquidos y los hábitos de defecación son la primera línea (recomendación fuerte 1B).","fuente":"ASCRS 2018, hemorroides"},{"tipo":"Conducta quirúrgica","pregunta":"Persisten los síntomas. ¿Qué procedimiento indicás?","opciones":["Ligadura con bandas elásticas en el consultorio","Hemorroidectomía de Milligan-Morgan programada","Esfinterotomía lateral interna","Hemorroidopexia con engrapadora de urgencia"],"explicacion":"Para grados I a III que no responden al tratamiento médico, la ligadura elástica es el procedimiento ambulatorio más eficaz. La hemorroidectomía se reserva para grado III y IV o fracaso.","fuente":"ASCRS 2018, hemorroides"}]},{"id":"ano-02","tema":"Patología anal","anio":1,"titulo":"Dolor anal con bulto azulado","vineta":"Mujer de 33 años con dolor anal intenso de 36 horas y un nódulo azulado, tenso, en el margen anal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hemorroide externa trombosada","Absceso perianal superficial","Fisura anal aguda con pólipo centinela","Prolapso rectal mucoso"],"explicacion":"Un nódulo azulado, tenso y doloroso en el margen anal, de aparición brusca, es una trombosis hemorroidal externa.","fuente":"ASCRS 2018, hemorroides"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás con 36 horas de evolución?","opciones":["Escisión del trombo con anestesia local","Incisión y drenaje simple del coágulo","Ligadura con banda elástica","Hemorroidectomía de urgencia de los tres paquetes"],"explicacion":"En las primeras 72 horas, la escisión resuelve los síntomas más rápido y recurre menos que la incisión simple. Después, el manejo suele ser médico porque el dolor ya está cediendo.","fuente":"ASCRS 2018, hemorroides; revisión AAFP"},{"tipo":"Medidas generales","pregunta":"Si tuviera 6 días de evolución, ¿qué indicarías?","opciones":["Baños de asiento, analgesia, fibra y ablandadores","Escisión urgente del trombo con anestesia local","Antibióticos orales y control en 48 horas","Reposo en cama y hielo local continuo"],"explicacion":"Pasadas las 72 horas la trombosis tiende a resolver sola y se trata en forma conservadora, salvo dolor intenso o necrosis.","fuente":"ASCRS 2018, hemorroides"}]},{"id":"ano-03","tema":"Patología anal","anio":1,"titulo":"Tumefacción perianal fluctuante","vineta":"Varón de 35 años sin comorbilidades. Dolor perianal de 3 días, tumefacción fluctuante a las 5 en posición de litotomía, sin celulitis extensa. Afebril, no diabético.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Absceso perianal","Hemorroide trombosada","Fisura anal","Quiste pilonidal"],"explicacion":"Dolor y tumefacción fluctuante perianal es un absceso de origen criptoglandular.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés y cuándo?","opciones":["Drenaje quirúrgico dentro de las 24 horas","Antibióticos orales y control en una semana","Esperar que fistulice en forma espontánea","Punción con aguja fina y cultivo"],"explicacion":"El absceso se drena siempre. Sin signos sistémicos ni factores de riesgo de infección necrosante, ACPGBI propone operar dentro de las 24 horas de la decisión.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Técnica","pregunta":"¿Cómo lo drenás?","opciones":["Incisión amplia cerca del esfínter, sin buscar el orificio interno","Incisión radial alejada del ano y taponaje apretado con gasa durante 48 horas","Buscar el orificio interno con estilete y abrir la fístula","Drenar y colocar un sedal laxo a través del esfínter"],"explicacion":"En el absceso primario no se busca el orificio interno ni se trata la fístula. La incisión va cerca del esfínter para evitar un trayecto largo, y no se tapona de rutina.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No, si está bien drenado y sin factores de riesgo","Sí, amoxicilina-clavulánico durante 14 días","Sí, ciprofloxacina y metronidazol por 7 días","Sí, una dosis única de vancomicina en el quirófano"],"explicacion":"Los antibióticos y los cultivos tienen poco valor en el absceso no complicado drenado; se reservan para celulitis extensa, inmunosupresión, diabetes o signos sistémicos.","fuente":"ACPGBI 2021, urgencias colorrectales"}]},{"id":"osto-01","tema":"Ostomías","anio":1,"titulo":"Colostomía con bordes oscuros","vineta":"Paciente en el día 1 de una operación de Hartmann. La colostomía está oscura en la mucosa visible. Afebril, abdomen blando.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo evaluás la extensión de la isquemia?","opciones":["Tubo iluminado o endoscopio por el estoma, debajo de la fascia","TC con contraste endovenoso para buscar neumatosis","Esperar a que se desprenda la mucosa y reevaluar en una semana","Biopsia de la mucosa oscura y anatomía patológica urgente"],"explicacion":"La evaluación clínica y endoscópica es más útil que la TC. Lo que define la conducta es si la isquemia llega por debajo de la fascia.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Conducta quirúrgica","pregunta":"La necrosis se extiende por debajo de la fascia. ¿Qué indicás?","opciones":["Reoperación urgente para rehacer el estoma","Observación clínica y nueva evaluación en 48 horas","Curaciones locales y bolsa de estoma más grande","Antibióticos IV solos y control de la temperatura"],"explicacion":"Un estoma no viable por debajo de la fascia puede perforarse dentro del abdomen y causar peritonitis; se reopera para rehacerlo con intestino viable.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Medidas generales","pregunta":"¿Qué medida preoperatoria reduce las complicaciones de los estomas programados?","opciones":["Marcación preoperatoria del sitio por estomaterapia","Hacer el estoma en la línea media para evitar hernias","Ubicarlo en un pliegue cutáneo para disimularlo","Decidir el sitio durante la cirugía sin marcar"],"explicacion":"Marcar un sitio que el paciente vea y maneje, a través del recto anterior y lejos de pliegues y cicatrices, reduce fugas y complicaciones.","fuente":"Hermes: Complicaciones de ostomías"}]},{"id":"osto-02","tema":"Ostomías","anio":1,"titulo":"Ileostomía de alto débito","vineta":"Paciente con ileostomía en asa hace 5 días tras una resección anterior baja. Débito de 2200 ml/día, sed, creatinina en aumento.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Ileostomía de alto débito con deshidratación","Fuga anastomótica con colección pélvica infectada","Íleo posoperatorio prolongado","Obstrucción del estoma por edema"],"explicacion":"Un débito mayor de 1,5 a 2 litros por día con signos de deshidratación y caída de la función renal es una ileostomía de alto débito, causa frecuente de reinternación.","fuente":"Hermes: Ileostomía"},{"tipo":"Medidas generales","pregunta":"¿Qué indicación de líquidos es correcta?","opciones":["Restringir líquidos hipotónicos y dar rehidratación oral con sodio","Tomar abundante agua y té, al menos 3 litros por día, para reponer","Jugos de fruta y bebidas deportivas sin restricción","Suspender la ingesta oral y dar nutrición parenteral"],"explicacion":"El agua y los líquidos hipotónicos aumentan la pérdida de sodio por el estoma. Se restringen y se reemplazan por una solución oral con alta concentración de sodio, con hidratación IV si hace falta.","fuente":"Hermes: Ileostomía"},{"tipo":"Fármaco","pregunta":"¿Qué fármaco reduce el débito?","opciones":["Loperamida antes de las comidas","Metoclopramida antes de las comidas","Laxantes osmóticos por la noche","Eritromicina en dosis bajas"],"explicacion":"La loperamida enlentece el tránsito y reduce el débito; se toma antes de las comidas. Los proquinéticos y laxantes lo empeoran.","fuente":"Hermes: Ileostomía"}]},{"id":"gastro-01","tema":"Ostomías","anio":1,"titulo":"Gastrostomía para alimentación","vineta":"Varón de 72 años con disfagia por un ACV hace 3 semanas, sin recuperación de la deglución prevista en el próximo mes. Necesita alimentación enteral prolongada.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué acceso enteral indicás?","opciones":["Gastrostomía endoscópica percutánea","Sonda nasogástrica indefinida","Nutrición parenteral","Yeyunostomía quirúrgica abierta como primera opción"],"explicacion":"Cuando se prevé alimentación enteral por más de 4 a 6 semanas, la gastrostomía percutánea es la vía de elección por menor desplazamiento y mejor tolerancia que la sonda nasogástrica.","fuente":"Hermes: Gastrostomía"},{"tipo":"Medidas generales","pregunta":"La sonda se sale al 7.º día. ¿Qué hacés?","opciones":["No reintroducirla a ciegas; endoscopia o radiología","Reintroducir una sonda Foley a ciegas y empezar a alimentar","Esperar a que cierre el orificio y colocar otra","Alimentar por la boca de inmediato con espesantes"],"explicacion":"Antes de la maduración del trayecto (unas 4 semanas) el estómago puede separarse de la pared; una sonda reintroducida a ciegas puede quedar en la cavidad peritoneal y causar peritonitis al alimentar.","fuente":"Hermes: Gastrostomía"},{"tipo":"Medidas generales","pregunta":"¿Qué cuidado previene la complicación del tope interno enterrado?","opciones":["Rotar la sonda y moverla, sin apretar el tope externo","Fijar el tope externo bien apretado contra la piel","Dejarla fija, sin rotarla, para no lesionar el trayecto","Cambiarla cada semana por una de mayor calibre"],"explicacion":"Un tope externo demasiado ajustado empuja el interno dentro de la pared gástrica (buried bumper). Se deja un margen de movilidad y se rota la sonda.","fuente":"Hermes: Gastrostomía"}]},{"id":"ano-04","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Dolor anal desgarrante de 3 meses","vineta":"Mujer de 32 años con dolor anal intenso durante y después de defecar desde hace 3 meses, con sangrado escaso. Fisura en la línea media posterior con bordes indurados, colgajo centinela y fibras del esfínter interno visibles. Continencia normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Fisura anal crónica primaria","Fisura anal aguda","Fisura secundaria a enfermedad de Crohn","Fístula perianal"],"explicacion":"Más de 6 semanas de evolución, colgajo centinela, papila hipertrófica y fibras del esfínter interno expuestas definen la cronicidad. La ubicación posterior en la línea media es típica; las laterales obligan a buscar otra causa.","fuente":"WSES-AAST 2021; Hermes: Fisura anal"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Fibra, agua, baños de asiento y analgesia","Dieta sin residuos para defecar menos veces","Laxantes estimulantes diarios por un mes completo","Ir directo a la esfinterotomía sin medidas previas"],"explicacion":"Corregir la consistencia fecal es la base de todo tratamiento: las heces duras perpetúan la lesión.","fuente":"WSES-AAST 2021; Hermes: Fisura anal"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento farmacológico de primera línea indicás?","opciones":["Diltiazem tópico al 2 % (bloqueante cálcico)","Corticoide tópico en crema dos veces por día","Antibiótico oral (metronidazol) por 7 días","Dilatación anal manual bajo anestesia"],"explicacion":"Los bloqueantes cálcicos tópicos tienen eficacia similar a los nitratos con menos cefalea, y son la primera línea en la fisura crónica. La dilatación manual está contraindicada por la incontinencia que causa.","fuente":"ASCRS 2023, fisura anal"},{"tipo":"Dosis","pregunta":"¿Cómo se aplica?","opciones":["Pomada 2 a 3 veces por día durante 6 a 8 semanas","Una única aplicación antes de defecar","Una vez por semana durante un mes completo","Cuando duele, como máximo durante 3 días seguidos"],"explicacion":"La relajación química del esfínter necesita constancia: se aplica varias veces por día durante al menos 6 semanas antes de considerar el fracaso.","fuente":"ASCRS 2023, fisura anal; WSES-AAST 2021"},{"tipo":"Conducta quirúrgica","pregunta":"No cicatriza tras 8 semanas de tratamiento correcto. ¿Qué indicás?","opciones":["Esfinterotomía lateral interna, o toxina botulínica","Fistulotomía de la fisura con sedal cortante en dos tiempos","Dilatación anal forzada bajo anestesia","Hemorroidectomía con resección del colgajo"],"explicacion":"La esfinterotomía lateral interna es el tratamiento más eficaz de la fisura crónica refractaria en pacientes sin incontinencia previa; la toxina botulínica es una alternativa con menos riesgo funcional pero más recurrencia.","fuente":"ASCRS 2023, fisura anal"}]},{"id":"ano-05","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Orificio que supura después de un absceso","vineta":"Varón de 40 años al que le drenaron un absceso perianal hace 4 meses. Persiste un orificio externo a 2 cm del margen anal que supura en forma intermitente. Al tacto se palpa un cordón hacia la línea media posterior.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Fístula perianal","Fisura anal","Quiste pilonidal","Hidradenitis supurativa"],"explicacion":"Un orificio externo que supura tras el drenaje de un absceso, con un trayecto palpable hacia el canal anal, es una fístula de origen criptoglandular.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Estudios","pregunta":"¿Cuándo pedís una resonancia pélvica?","opciones":["Si es compleja, recidivada, anterior en la mujer o con Crohn","De rutina antes de operar una fístula, aunque sea simple y baja","Recién cuando fracasó una fistulotomía previa","Cuando hay fiebre o dolor durante el examen"],"explicacion":"La resonancia es el mapa preferido para fístulas complejas, recurrentes o en Crohn. En una fístula simple baja puede bastar el examen bajo anestesia.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"En el examen bajo anestesia es interesfinteriana baja. ¿Qué hacés?","opciones":["Fistulotomía","Colgajo de avance rectal","Colostomía de protección","Antibióticos prolongados"],"explicacion":"La fistulotomía cura la fístula simple baja con mínimo riesgo para la continencia. Las técnicas que preservan el esfínter (sedal, colgajo, LIFT) se reservan para fístulas que comprometen más esfínter.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Técnica","pregunta":"Si comprometiera más de un tercio del esfínter externo, ¿qué harías en un primer tiempo?","opciones":["Sedal laxo y luego una técnica que preserve el esfínter","Fistulotomía completa igual, en un solo tiempo","Inyectar adhesivo de fibrina en el trayecto y dar el alta definitiva","Colostomía de protección y fistulotomía diferida"],"explicacion":"Seccionar mucho esfínter arriesga incontinencia. El sedal laxo controla la sepsis y permite luego un colgajo de avance, LIFT u otra técnica conservadora.","fuente":"Hermes: Absceso y fístula anorrectal"}]},{"id":"pilo-01","tema":"Quiste pilonidal","anio":2,"titulo":"Dolor sacrococcígeo con tumefacción","vineta":"Varón de 20 años, peludo, con 3 días de dolor y tumefacción fluctuante en el pliegue interglúteo. Se ven dos fositas en la línea media. Afebril.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Absceso pilonidal","Absceso perianal profundo","Hidradenitis supurativa","Quiste dermoide sacro"],"explicacion":"Fositas en la línea media del pliegue con un absceso adyacente son la presentación aguda de la enfermedad pilonidal.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés ahora?","opciones":["Incisión y drenaje lateral a la línea media","Resección amplia del quiste en la misma urgencia","Antibióticos solos y control en 48 horas","Resección y colgajo romboidal de urgencia"],"explicacion":"El absceso se drena; la resección definitiva se planifica después, cuando la inflamación cede. Una incisión fuera de la línea media cicatriza mejor.","fuente":"ASCRS 2019, enfermedad pilonidal; Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"Meses después tiene enfermedad crónica sintomática. ¿Qué técnica evitás?","opciones":["Escisión con cierre primario en la línea media","Técnicas de cierre fuera de la línea media (Karydakis, Bascom)","Pit-picking","Destechado"],"explicacion":"El cierre en la línea media tiene más infección y recurrencia. Las técnicas que aplanan el pliegue y cierran fuera de la línea media son preferibles.","fuente":"ASCRS 2019, enfermedad pilonidal; Hermes: Quiste pilonidal"},{"tipo":"Medidas generales","pregunta":"¿Qué medida puede reducir la recurrencia?","opciones":["Depilación de la región e higiene del pliegue","Reposo prolongado y evitar estar sentado","Antibióticos profilácticos en ciclos mensuales","Dieta hipograsa y descenso de peso estricto"],"explicacion":"Eliminar el pelo de la zona reduce la recurrencia después del tratamiento.","fuente":"ASCRS 2019, enfermedad pilonidal"}]},{"id":"hernia-04","tema":"Hernias recidivadas","anio":2,"titulo":"Recurrencia tras un Lichtenstein","vineta":"Varón de 62 años operado con técnica de Lichtenstein hace 3 años. Presenta recurrencia inguinal derecha sintomática y reducible.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué pedís antes de operar?","opciones":["El protocolo quirúrgico de la operación anterior","Una TC de abdomen y pelvis de rutina","Una resonancia dinámica de la región inguinal con maniobra de Valsalva","Una ecografía para medir el defecto"],"explicacion":"Saber qué técnica, plano y malla se usaron orienta la vía de reparación y ayuda a entender el mecanismo de la falla.","fuente":"Hermes: Hernia inguinal recurrente"},{"tipo":"Conducta quirúrgica","pregunta":"¿Por qué vía la reparás?","opciones":["Posterior (TEP o TAPP), por un plano no operado","Anterior otra vez, con una malla más grande","Shouldice para evitar otra malla","Observación, porque recidivó una vez"],"explicacion":"Se prefiere el plano virgen: posterior tras una reparación anterior y anterior tras una posterior. Así se evita disecar tejido cicatricial con malla.","fuente":"HerniaSurge; Hermes: Hernia inguinal recurrente"},{"tipo":"Medidas generales","pregunta":"¿Cuándo derivarías a un centro especializado?","opciones":["Multirrecurrencia, ambos planos operados o infección de malla","En la primera recurrencia, aunque sea simple, reducible y por un solo plano","Cuando el defecto mida más de 1 cm en la ecografía","Cuando el paciente prefiera operarse en otro hospital"],"explicacion":"Las recurrencias múltiples o con ambos planos operados son técnicamente complejas y deben resolverse en unidades con experiencia en pared.","fuente":"Hermes: Hernia inguinal recurrente"}]},{"id":"hernia-05","tema":"Hernias recidivadas","anio":2,"titulo":"Bulto doloroso debajo del ligamento inguinal","vineta":"Mujer de 78 años con dolor y un bulto irreductible debajo del ligamento inguinal izquierdo desde hace 20 horas, con vómitos. Piel sin cambios. Leucocitos 12.000/mm³.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Hernia crural irreductible con posible estrangulación","Adenopatía inguinal abscedada con linfangitis","Hernia inguinal directa crónicamente irreductible","Aneurisma de la arteria femoral común trombosado"],"explicacion":"Una masa irreductible debajo del ligamento inguinal en una mujer mayor, con vómitos, es una hernia crural complicada hasta demostrar otra cosa; es la hernia con más riesgo de estrangulación.","fuente":"Hermes: Hernia crural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Cirugía de urgencia en las próximas horas","Reducción manual bajo sedación y control ambulatorio","Observación con analgesia","Cirugía programada en un mes"],"explicacion":"Ante vómitos y más de 20 horas de irreductibilidad se opera de urgencia; la reducción manual se intenta solo sin sospecha de isquemia.","fuente":"HerniaSurge 2023, urgencia"},{"tipo":"Técnica","pregunta":"Para liberar el anillo crural, ¿qué estructura debés proteger?","opciones":["La vena femoral, lateral al saco","El nervio ilioinguinal","El conducto deferente","La arteria epigástrica en la línea media"],"explicacion":"El anillo crural tiene la vena femoral por fuera; la sección para liberarlo se hace hacia medial, sobre el ligamento lacunar. La sutura de cierre tampoco debe comprimir la vena.","fuente":"Hermes: Hernia inguinal estrangulada"}]},{"id":"venosa-01","tema":"Enfermedad venosa crónica","anio":2,"titulo":"Úlcera maleolar interna","vineta":"Mujer de 66 años con una úlcera de 4 cm en el maléolo interno izquierdo de 5 meses, con lipodermatoesclerosis. Pulsos pedios palpables, índice tobillo-brazo 1,0. Eco Doppler: reflujo de la safena interna, sistema profundo competente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y en qué CEAP está?","opciones":["Úlcera venosa activa, CEAP C6","Úlcera arterial","Úlcera neuropática","Úlcera venosa cicatrizada, C5"],"explicacion":"Una úlcera maleolar interna con cambios cutáneos crónicos y reflujo venoso, con perfusión arterial normal, es una úlcera venosa activa (C6).","fuente":"ESVS 2022, enfermedad venosa crónica; Hermes: Úlcera venosa"},{"tipo":"Estudios","pregunta":"¿Por qué medís el índice tobillo-brazo antes de comprimir?","opciones":["Para descartar arteriopatía que contraindique la compresión","Para diagnosticar el reflujo de la safena","Para clasificar la úlcera en la CEAP","Para predecir el tiempo de cicatrización de la úlcera venosa activa"],"explicacion":"La compresión intensa sobre un miembro con mala perfusión puede producir necrosis. Un índice bajo obliga a reducir la compresión o evaluar la arteriopatía.","fuente":"ESVS 2022; Hermes: Úlcera venosa"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el tratamiento causal?","opciones":["Compresión multicomponente (40 mmHg en el tobillo)","Apósitos de plata y curaciones diarias, sin compresión","Antibióticos sistémicos por la colonización de la úlcera","Reposo en cama con el miembro elevado durante semanas"],"explicacion":"La compresión es lo que cicatriza la úlcera venosa. Ningún apósito la reemplaza, y los antibióticos solo se usan si hay infección clínica.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo tratás el reflujo de la safena?","opciones":["En forma temprana, junto con la compresión","Solo después de que cicatrice, si recidiva","No se trata: la compresión alcanza","Cuando la úlcera tenga más de 2 años"],"explicacion":"En el ensayo EVRA, la ablación temprana del reflujo superficial más compresión aceleró la cicatrización y redujo la recurrencia frente a diferirla.","fuente":"Ensayo EVRA; ESVS 2022"}]},{"id":"tep-01","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Disnea súbita en el día 6","vineta":"Mujer de 59 años en el día 6 de una histerectomía por cáncer. Disnea súbita, frecuencia 112, saturación 89 %, presión 125/80 mmHg. Angio-TC: embolia pulmonar segmentaria bilateral; sin dilatación del ventrículo derecho y troponina normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo estratificás el riesgo?","opciones":["Riesgo bajo o intermedio-bajo","Riesgo alto, por la hipoxemia","Riesgo intermedio-alto","No hace falta estratificar"],"explicacion":"El riesgo alto es la embolia con inestabilidad hemodinámica. En el estable, la disfunción del ventrículo derecho y la troponina elevada definen el intermedio-alto; esta paciente no tiene ninguna de las dos.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Heparina de bajo peso molecular a dosis terapéutica","Trombólisis sistémica con alteplasa","Filtro de vena cava inferior y luego anticoagulación","Aspirina más medias de compresión"],"explicacion":"La embolia estable se trata con anticoagulación. La trombólisis se reserva para el riesgo alto y el filtro, para la contraindicación absoluta de anticoagular.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Dosis","pregunta":"¿Con qué dosis de enoxaparina?","opciones":["1 mg/kg subcutánea cada 12 horas","40 mg subcutánea cada 24 horas","100 mg IV en bolo","0,5 mg/kg cada 48 horas"],"explicacion":"La dosis terapéutica es 1 mg/kg cada 12 horas (o 1,5 mg/kg cada 24 horas), ajustada a la función renal. 40 mg por día es la dosis profiláctica.","fuente":"ESC 2019, embolia pulmonar; ficha técnica de enoxaparina"},{"tipo":"Medidas generales","pregunta":"¿Cuánto dura la anticoagulación en esta paciente con cáncer activo?","opciones":["Al menos 3 a 6 meses, y mientras el cáncer esté activo","7 días, hasta el alta hospitalaria","Durante la internación y un mes más","De por vida, sin reevaluar el riesgo de sangrado"],"explicacion":"Tras una embolia con factor transitorio quirúrgico se anticoagula al menos 3 meses, pero con cáncer activo se extiende y se reevalúa periódicamente.","fuente":"ESC 2019, embolia pulmonar"}]},{"id":"tep-02","tema":"Tromboembolismo pulmonar","anio":2,"titulo":"Embolia con hipotensión","vineta":"Varón de 64 años, 3 semanas después de una fractura de cadera. Disnea súbita, presión 78/50 mmHg pese a líquidos, ventrículo derecho dilatado en la ecografía. No operado recientemente ni con sangrado activo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene?","opciones":["Riesgo alto","Riesgo intermedio-bajo","Riesgo bajo, por la edad","Riesgo intermedio-alto"],"explicacion":"La hipotensión persistente o el shock definen la embolia de riesgo alto, con mortalidad elevada a corto plazo.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Trombólisis sistémica con heparina no fraccionada","Heparina de bajo peso molecular sin trombólisis","Aspirina y oxígeno a alto flujo","Diuréticos IV para descargar el ventrículo derecho dilatado"],"explicacion":"En la embolia de riesgo alto sin contraindicación se indica trombólisis sistémica con heparina no fraccionada. Si está contraindicada o falla, embolectomía quirúrgica o tratamiento por catéter.","fuente":"ESC 2019, embolia pulmonar"},{"tipo":"Dosis","pregunta":"¿Qué esquema de alteplasa?","opciones":["100 mg IV en 2 horas","10 mg IV en bolo único","1 g IV","100 mg IV en 24 horas"],"explicacion":"El esquema habitual es 100 mg de alteplasa en 2 horas; en el paro cardíaco se usa un esquema acelerado.","fuente":"ESC 2019, embolia pulmonar"}]},{"id":"arteria-01","tema":"Patología arterial periférica","anio":2,"titulo":"Dolor en la pantorrilla al caminar","vineta":"Varón de 64 años, fumador, hipertenso y dislipémico. Dolor en la pantorrilla derecha que aparece a las 3 cuadras y cede al detenerse. Pulsos femoral presente y poplíteo y distales ausentes. Índice tobillo-brazo 0,65.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Claudicación intermitente por arteriopatía periférica","Claudicación neurógena por estenosis del conducto lumbar","Isquemia crónica amenazante de la extremidad","Insuficiencia venosa crónica sintomática"],"explicacion":"Dolor reproducible con el ejercicio que cede con el reposo, con índice tobillo-brazo menor de 0,9 y pulsos ausentes desde el poplíteo, es claudicación por arteriopatía. Sin dolor de reposo ni lesiones, no es amenazante.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica; Hermes: Enfermedad arterial periférica"},{"tipo":"Medidas generales","pregunta":"¿Qué indicación es la más eficaz para mejorar la distancia de marcha?","opciones":["Dejar de fumar y ejercicio supervisado durante 3 meses","Reposo y caminar lo mínimo para no provocar dolor","Medias de compresión elástica de alta presión","Revascularización inmediata por vía endovascular del eje femoropoplíteo"],"explicacion":"El ejercicio supervisado mejora la distancia de marcha tanto como la revascularización en la claudicación, y dejar de fumar reduce la progresión y los eventos cardiovasculares.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento médico indicás para reducir eventos cardiovasculares?","opciones":["Antiagregante y estatina de alta intensidad","Anticoagulación con warfarina, RIN 2 a 3","Vasodilatadores periféricos (pentoxifilina)","Estatina sola si el colesterol está alto"],"explicacion":"Todo paciente con arteriopatía sintomática recibe antiagregación (aspirina o clopidogrel), estatina de alta intensidad y control de la presión y la diabetes.","fuente":"ESC 2024 y ESVS 2024, arteriopatía periférica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo revascularizás?","opciones":["Si sigue limitado tras 3 meses de tratamiento óptimo","Ahora, para evitar la progresión a amputación","Solo si aparece una úlcera en el pie","Cuando el índice tobillo-brazo baje de 0,2"],"explicacion":"La claudicación se revasculariza solo si persiste la limitación con tratamiento médico y ejercicio, porque la amputación es rara en este estadio.","fuente":"ESC 2024 y ESVS 2024; Hermes: Enfermedad arterial periférica"}]},{"id":"arteria-02","tema":"Patología arterial periférica","anio":2,"titulo":"Pierna fría y dolorosa de golpe","vineta":"Mujer de 76 años con fibrilación auricular sin anticoagular. Dolor súbito en la pierna izquierda de 4 horas, pierna fría y pálida, sin pulso femoral, hipoestesia en el pie y movilidad de los dedos conservada.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y qué categoría de Rutherford?","opciones":["Isquemia aguda embólica, Rutherford IIa o IIb","Isquemia crónica agudizada, Rutherford I","Flegmasía cerulea dolens por trombosis venosa","Isquemia irreversible, Rutherford III"],"explicacion":"Dolor, palidez, ausencia de pulso y frialdad súbitos en una paciente con fibrilación auricular son embolia arterial. Con déficit sensitivo y motricidad conservada la extremidad está amenazada pero recuperable; la parálisis y el rigor serían irreversibles.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Fármaco","pregunta":"¿Qué indicás de inmediato?","opciones":["Heparina no fraccionada IV en bolo","Aspirina sola","Trombólisis sistémica","Esperar la angio-TC para iniciar tratamiento"],"explicacion":"Se anticoagula de inmediato con heparina IV para limitar la propagación del trombo, mientras se planifica la revascularización.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Embolectomía urgente con catéter de Fogarty","Observación con heparina IV y Doppler a las 24 horas","Amputación primaria supracondílea","Tratamiento médico y control ambulatorio"],"explicacion":"Una extremidad amenazada se revasculariza con urgencia; en una embolia femoral, la embolectomía con Fogarty es rápida y eficaz.","fuente":"ESVS 2020, isquemia aguda de miembros"},{"tipo":"Técnica","pregunta":"Tras revascularizar, la pantorrilla está tensa y duele al estirar los dedos. ¿Qué hacés?","opciones":["Fasciotomía de los cuatro compartimentos","Elevar el miembro y observar la evolución","Vendaje compresivo y analgesia con opioides","Esperar la medición de presiones a las 24 horas"],"explicacion":"El síndrome compartimental por reperfusión se trata con fasciotomía completa de los cuatro compartimentos, sin esperar déficit motor ni ausencia de pulso.","fuente":"ESVS 2020; Hermes: Síndrome compartimental agudo de las extremidades"}]},{"id":"arteria-03","tema":"Patología arterial periférica","anio":2,"titulo":"Úlcera infectada en un pie diabético","vineta":"Varón de 68 años diabético. Úlcera plantar bajo la cabeza del primer metatarsiano con celulitis de 3 cm alrededor, sin signos sistémicos. La sonda toca hueso. Pulsos pedios ausentes, índice tobillo-brazo 0,6.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué problemas tiene que ordenar?","opciones":["Infección moderada, probable osteomielitis e isquemia","Úlcera neuropática pura sin infección ni isquemia","Celulitis leve sin osteomielitis ni isquemia","Gangrena húmeda del antepié con sepsis"],"explicacion":"Celulitis de más de 2 cm o compromiso profundo define infección moderada; el contacto con hueso sugiere osteomielitis y el índice bajo indica isquemia. Hay que tratar las tres cosas.","fuente":"IWGDF/IDSA 2023, infección del pie diabético; Hermes: Pie diabético"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Radiografía, cultivo de tejido profundo y evaluación vascular","Hisopado superficial de la úlcera y radiografía","Hemograma y eritrosedimentación seriados","Gammagrafía ósea con leucocitos marcados como primer estudio y luego biopsia"],"explicacion":"La radiografía busca osteomielitis y gas; el cultivo de tejido profundo o hueso (no el hisopado) orienta el antibiótico, y la evaluación vascular decide la revascularización.","fuente":"IWGDF/IDSA 2023"},{"tipo":"Medidas generales","pregunta":"¿Qué medida es indispensable para cicatrizar?","opciones":["Descarga efectiva de la presión plantar","Caminar normalmente para estimular la circulación","Reposo relativo con calzado habitual","Apósitos con plata o hidrocoloide"],"explicacion":"Sin quitar la presión de la úlcera plantar no cicatriza; la descarga se adapta para que el paciente la cumpla.","fuente":"Hermes: Pie diabético"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés con la isquemia?","opciones":["Revascularizar para permitir la cicatrización","Amputación mayor directa por debajo de la rodilla","Antibióticos prolongados sin revascularizar","Observar la evolución con curaciones"],"explicacion":"Una úlcera con isquemia no cicatriza solo con antibióticos ni curaciones; la revascularización temprana mejora la cicatrización y el salvamento de la extremidad.","fuente":"IWGDF/IDSA 2023; Hermes: Isquemia crónica amenazante de la extremidad"}]},{"id":"mama-01","tema":"Patología mamaria","anio":2,"titulo":"Nódulo mamario en una mujer joven","vineta":"Mujer de 24 años con un nódulo de 2 cm en la mama derecha, móvil, elástico, indoloro, de bordes netos. Sin antecedentes familiares.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía mamaria","Mamografía","Resonancia","Biopsia quirúrgica directa"],"explicacion":"En mujeres menores de 30 a 35 años la ecografía es el estudio inicial por la densidad mamaria; la mamografía tiene baja sensibilidad a esa edad.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"La ecografía muestra un nódulo oval, circunscripto, paralelo a la piel. ¿Qué es lo más probable?","opciones":["Fibroadenoma (BI-RADS 3)","Carcinoma ductal (BI-RADS 5)","Quiste complicado","Mastitis granulomatosa"],"explicacion":"Una lesión sólida oval, circunscripta y paralela a la piel en una mujer joven es típica de fibroadenoma, categoría probablemente benigna (BI-RADS 3).","fuente":"ACR BI-RADS; Hermes: Evaluación de la patología mamaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Control ecográfico en 6 meses, o biopsia si crece","Mastectomía subcutánea preventiva","Resección quirúrgica en la próxima semana","Alta sin controles, por ser una lesión benigna"],"explicacion":"BI-RADS 3 tiene menos de 2 % de riesgo de malignidad y se controla a corto plazo. Se biopsia si crece, cambia o hay discordancia clínica.","fuente":"ACR BI-RADS"}]},{"id":"mama-02","tema":"Patología mamaria","anio":2,"titulo":"Nódulo sospechoso en una mujer de 56 años","vineta":"Mujer de 56 años con un nódulo de 1,8 cm en el cuadrante superoexterno derecho, duro e irregular. Mamografía: masa espiculada BI-RADS 5. Axila clínica y ecográficamente negativa.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo confirmás el diagnóstico?","opciones":["Biopsia con aguja gruesa guiada por imagen","Biopsia escisional con márgenes amplios","Punción con aguja fina para citología","Resonancia mamaria y luego cirugía"],"explicacion":"La biopsia con aguja gruesa confirma la invasión y da receptores hormonales y HER2, que definen el tratamiento antes de cualquier cirugía.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"Es un carcinoma ductal invasor, receptores positivos, HER2 negativo. ¿Qué cirugía indicás?","opciones":["Cirugía conservadora, ganglio centinela y radioterapia","Mastectomía radical modificada con vaciamiento","Cirugía conservadora con vaciamiento axilar completo de los tres niveles","Hormonoterapia primaria sin cirugía"],"explicacion":"Un tumor de 1,8 cm en una mama de tamaño adecuado permite cirugía conservadora más radioterapia, con supervivencia equivalente a la mastectomía. La axila clínicamente negativa se estadifica con ganglio centinela.","fuente":"Hermes: Cáncer de mama; Cirugía axilar en cáncer de mama"},{"tipo":"Técnica","pregunta":"El ganglio centinela tiene metástasis en 1 de 2 ganglios. ¿Completás el vaciamiento?","opciones":["No: con 1 o 2 ganglios y radioterapia, Z0011 no mostró beneficio","Sí, porque el ganglio centinela es positivo","Sí, y además convertir a mastectomía","Sí, con vaciamiento y radioterapia axilar complementaria"],"explicacion":"En el ACOSOG Z0011, en tumores T1-T2 con 1 o 2 ganglios centinela positivos tratados con cirugía conservadora y radioterapia, el vaciamiento no mejoró la supervivencia y aumentó el linfedema.","fuente":"Ensayo ACOSOG Z0011"}]},{"id":"trauma-04","tema":"Trauma avanzado","anio":2,"titulo":"Lesión esplénica en un paciente estable","vineta":"Varón de 25 años, caída de moto. Estable desde el ingreso. TC: laceración esplénica de 4 cm de profundidad (grado III de la AAST), sin extravasación de contraste ni otras lesiones.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué clase WSES tiene?","opciones":["Clase II (moderada)","Clase IV (grave)","Clase I (menor)","Clase III (grave)"],"explicacion":"WSES combina el grado anatómico con la hemodinamia: el grado III de la AAST en un paciente estable es clase II.","fuente":"WSES 2017, trauma esplénico; Hermes: Traumatismo esplénico"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Manejo no operatorio con vigilancia","Esplenectomía laparoscópica programada","Esplenorrafia de rutina por laparotomía","Alta con control ambulatorio en 48 horas"],"explicacion":"El paciente estable sin otra indicación de laparotomía se maneja sin operar, siempre que haya vigilancia, controles seriados y capacidad de rescate.","fuente":"WSES 2017, trauma esplénico"},{"tipo":"Medidas generales","pregunta":"¿Qué controles hacés?","opciones":["Examen y hemoglobina seriados","Sin controles si sigue estable","TC de abdomen con contraste cada 6 horas","Laparoscopia diagnóstica a las 24 h"],"explicacion":"Se vigilan los signos vitales, el abdomen y la hemoglobina; ante deterioro se considera angioembolización o cirugía.","fuente":"WSES 2017, trauma esplénico"},{"tipo":"Fármaco","pregunta":"Si terminara esplenectomizado, ¿qué vacunas indicás?","opciones":["Neumococo, meningococo y Hib","Antigripal anual y hepatitis B","Antitetánica y antigripal anual","BCG y triple viral de refuerzo"],"explicacion":"La asplenia aumenta el riesgo de sepsis fulminante por gérmenes encapsulados; se vacuna contra neumococo, meningococo y Haemophilus, idealmente a partir de las 2 semanas de la cirugía, más antigripal anual.","fuente":"WSES 2017, trauma esplénico"}]},{"id":"trauma-05","tema":"Trauma avanzado","anio":2,"titulo":"Fractura de pelvis en libro abierto","vineta":"Mujer de 45 años atropellada. Presión 75/40 mmHg pese a 1 litro de cristaloides. Dolor pélvico, radiografía con diástasis de la sínfisis (libro abierto). FAST negativo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿De dónde sangra probablemente?","opciones":["De la pelvis (venas y focos de fractura)","Del abdomen, aunque el FAST sea negativo","Del tórax, por un hemotórax no visto","De una fractura de fémur oculta"],"explicacion":"Con FAST negativo y fractura en libro abierto, el shock es probablemente pélvico; el sangrado es mayormente venoso y óseo.","fuente":"WSES 2017, trauma pélvico; Hermes: Trauma pélvico"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés de inmediato?","opciones":["Faja pélvica sobre los trocánteres y transfusión masiva","Laparotomía exploradora para buscar el sangrado","TC de pelvis con contraste para definir la fractura","Colocar sonda vesical y medir la diuresis"],"explicacion":"La faja pélvica reduce el volumen pélvico y el sangrado; se coloca sobre los trocánteres mayores. Se transfunde de forma balanceada y precoz.","fuente":"WSES 2017, trauma pélvico"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste inestable. ¿Qué opciones tenés?","opciones":["Packing preperitoneal, fijación externa y angioembolización","Transfundir y esperar 24 horas para fijar la pelvis en forma definitiva","Más cristaloides hasta normalizar la presión","Laparotomía con exploración del hematoma pélvico"],"explicacion":"En el inestable se combinan el packing preperitoneal, la fijación mecánica y la angioembolización según disponibilidad. Abrir el hematoma pélvico por laparotomía empeora el sangrado.","fuente":"WSES 2017, trauma pélvico"},{"tipo":"Medidas generales","pregunta":"Hay sangre en el meato uretral. ¿Colocás una sonda vesical?","opciones":["No, sin antes hacer una uretrografía retrógrada","Sí, de inmediato, para medir la diuresis horaria","Sí, con fuerza si encuentra resistencia","Sí, una sonda más fina con lubricante"],"explicacion":"La sangre en el meato con fractura pélvica sugiere lesión uretral; una sonda a ciegas puede completar una sección parcial. Se estudia primero y, si hay lesión, se coloca una cistostomía.","fuente":"WSES 2017, trauma pélvico"}]},{"id":"trauma-06","tema":"Trauma avanzado","anio":2,"titulo":"Lesión hepática con respuesta transitoria","vineta":"Varón de 30 años con trauma cerrado. Laceración hepática grado IV en la TC con extravasación de contraste arterial. Respondió a 2 unidades de sangre y se mantiene estable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Angioembolización y continuar el manejo no operatorio","Hepatectomía derecha reglada de urgencia","Observación clínica sin tratar la extravasación arterial","Alta a las 24 horas si la hemoglobina se mantiene"],"explicacion":"En el estable, el grado no obliga a operar. La extravasación arterial en el adulto puede tratarse con angioembolización dentro del manejo no operatorio.","fuente":"WSES 2020, trauma hepático; Hermes: Trauma hepático"},{"tipo":"Conducta quirúrgica","pregunta":"Se descompensa y lo llevás a quirófano con hemorragia hepática masiva. ¿Qué hacés primero?","opciones":["Compresión manual, packing perihepático y maniobra de Pringle","Hepatectomía reglada inmediata del segmento lesionado","Ligadura de la vena cava inferior suprahepática","Sutura profunda de las laceraciones con puntos en U"],"explicacion":"El control de daños hepático empieza por compresión, packing y Pringle para controlar el flujo. Las resecciones regladas en un paciente en shock aumentan la mortalidad.","fuente":"WSES 2020, trauma hepático; Hermes: Trauma hepático"},{"tipo":"Medidas generales","pregunta":"¿Qué complicaciones tardías vigilás?","opciones":["Biliomas, fístula biliar, hemobilia y pseudoaneurismas","Pancreatitis aguda y pseudoquiste pancreático","Úlcera duodenal de estrés con hemorragia digestiva alta","Hernia diafragmática y vólvulo gástrico"],"explicacion":"Las lesiones de alto grado pueden complicarse con colecciones biliares, hemobilia o pseudoaneurismas, que se manejan con drenaje, CPRE o embolización.","fuente":"Hermes: Trauma hepático"}]},{"id":"panc-02","tema":"Pancreatitis aguda","anio":2,"titulo":"Necrosis infectada a las 5 semanas","vineta":"Varón de 50 años con pancreatitis necrotizante hace 5 semanas. Fiebre y deterioro clínico. TC: necrosis encapsulada de 12 cm retrogástrica con burbujas de gas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Necrosis encapsulada infectada","Pseudoquiste no infectado","Colección aguda peripancreática","Absceso hepático"],"explicacion":"Después de 4 semanas, una colección con pared y contenido necrótico es necrosis encapsulada; el gas en su interior con deterioro clínico indica infección.","fuente":"Atlanta revisada; Hermes: Pancreatitis aguda necrotizante"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás?","opciones":["Un carbapenémico, ajustado luego por cultivo","No indico antibiótico hasta tener el cultivo","Cefalexina por vía oral durante 14 días","Ampicilina IV en monoterapia durante 7 días"],"explicacion":"Ante infección de la necrosis se indican antibióticos que penetren el páncreas, como los carbapenémicos, ajustados a los cultivos obtenidos al drenar.","fuente":"WSES 2019, pancreatitis grave"},{"tipo":"Dosis","pregunta":"¿Qué dosis de meropenem?","opciones":["1 g IV cada 8 horas","1 g VO cada 24 horas","100 mg IV cada 12 horas","6 g IV en bolo único diario"],"explicacion":"La dosis de meropenem en infección intraabdominal es 1 g IV cada 8 horas, ajustada a la función renal.","fuente":"SIS/IDSA 2010, tabla de dosis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Abordaje escalonado: drenaje y, si no mejora, necrosectomía","Necrosectomía abierta de entrada con lavado retroperitoneal continuo","Antibióticos prolongados sin drenaje mientras tolere","Pancreatectomía corporocaudal con esplenectomía"],"explicacion":"En los ensayos PANTER y TENSION, el abordaje escalonado redujo las complicaciones mayores frente a la necrosectomía abierta. Una colección retrogástrica es ideal para el drenaje endoscópico.","fuente":"Ensayos PANTER y TENSION; WSES 2019"}]},{"id":"panc-03","tema":"Pancreatitis crónica","anio":2,"titulo":"Dolor y diarrea grasa en un bebedor","vineta":"Varón de 48 años con consumo de alcohol de 20 años y tabaquismo. Dolor epigástrico recurrente, pérdida de peso y deposiciones voluminosas, grasas y malolientes. TC: calcificaciones pancreáticas y Wirsung de 9 mm con litiasis cefálica.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Pancreatitis crónica con insuficiencia exocrina","Pancreatitis aguda recurrente sin cambios crónicos","Adenocarcinoma de cabeza de páncreas con obstrucción","Enfermedad celíaca con malabsorción secundaria grave"],"explicacion":"Calcificaciones, dilatación ductal y esteatorrea en un bebedor indican pancreatitis crónica con insuficiencia exocrina. Hay que excluir cáncer si aparece una masa o cambia el cuadro.","fuente":"Hermes: Pancreatitis crónica"},{"tipo":"Medidas generales","pregunta":"¿Qué medida es fundamental?","opciones":["Abstinencia total de alcohol y tabaco","Dieta con menos de 20 g diarios de grasa","Ayuno durante las crisis de dolor","Analgésicos opioides en horario fijo"],"explicacion":"Dejar el alcohol y el tabaco reduce los episodios de dolor y la progresión. La dieta no debe ser pobre en grasas si se reemplazan las enzimas.","fuente":"UEG HaPanEU 2017, pancreatitis crónica; Hermes: Pancreatitis crónica"},{"tipo":"Fármaco","pregunta":"¿Qué indicás para la esteatorrea?","opciones":["Enzimas pancreáticas con las comidas","Loperamida","Antibióticos","Inhibidor de bomba como único tratamiento"],"explicacion":"La insuficiencia exocrina se trata con enzimas pancreáticas gastrorresistentes tomadas con las comidas.","fuente":"UEG HaPanEU 2017, pancreatitis crónica"},{"tipo":"Dosis","pregunta":"¿Qué dosis inicial de lipasa?","opciones":["40.000 a 50.000 unidades por comida principal","1.000 unidades por día, en el desayuno","500.000 unidades por día, en ayunas","10.000 unidades por semana, con la cena"],"explicacion":"La dosis inicial recomendada es de 40.000 a 50.000 unidades de lipasa en cada comida principal y la mitad en las colaciones, ajustando según la respuesta.","fuente":"UEG HaPanEU 2017, pancreatitis crónica"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste el dolor pese al tratamiento médico. ¿Qué indicás con Wirsung dilatado y litiasis?","opciones":["Drenaje quirúrgico temprano (Partington o Frey) o endoscópico","Pancreatectomía total de entrada con autotrasplante","Opioides en dosis crecientes sin límite de tiempo","Esperar 10 años hasta que el páncreas se agote"],"explicacion":"Con Wirsung dilatado y dolor, el drenaje está indicado; en el ensayo ESCAPE, la cirugía temprana alivió mejor el dolor que el escalonamiento endoscópico. Con masa cefálica se prefiere Frey o Beger.","fuente":"Ensayo ESCAPE; Hermes: Derivación del Wirsung en pancreatitis crónica"}]},{"id":"pared-03","tema":"Eventraciones","anio":2,"titulo":"Eventración irreductible con vómitos","vineta":"Mujer de 70 años con eventración mediana conocida, irreductible y dolorosa desde hace 10 horas, con vómitos. Estable, qSOFA negativo. TC: defecto de 5 cm con asa de delgado incarcerada sin signos de isquemia.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Cirugía urgente, evaluando el asa y reparando el defecto","Reducción manual bajo sedación y alta con faja","Observación 48 horas con sonda nasogástrica","Cirugía programada en 2 meses, tras optimizarla"],"explicacion":"Una eventración irreductible con oclusión se opera de urgencia para evaluar el intestino y reparar el defecto.","fuente":"EHS 2026, hernia ventral de urgencia; Hermes: Hernia ventral complicada y de urgencia"},{"tipo":"Técnica","pregunta":"El asa es viable, sin resección y sin contaminación. ¿Cómo reparás?","opciones":["Malla sintética macroporosa onlay, con cierre del defecto","Sutura simple del defecto sin malla","Malla biológica en posición intraperitoneal","Malla retromuscular con separación de componentes posterior"],"explicacion":"EHS 2026 sugiere reparar con malla en lugar de sutura en el defecto cerrable, y en urgencia prefiere la malla sintética macroporosa en onlay frente al plano retromuscular.","fuente":"EHS 2026, hernia ventral de urgencia"},{"tipo":"Conducta quirúrgica","pregunta":"Si el defecto midiera 14 cm y no pudiera cerrarse sin separación de componentes, ¿qué harías?","opciones":["Cerrar la cavidad y derivar para una reparación planificada","Separación de componentes anterior en la misma urgencia","Abdomen abierto con presión negativa de rutina","Malla puente intraperitoneal permanente de PTFE"],"explicacion":"Ante un defecto no cerrable, EHS 2026 sugiere diferir la reconstrucción, cerrar la cavidad (piel, saco o malla absorbible) y derivar a un centro experto.","fuente":"EHS 2026, hernia ventral de urgencia"}]},{"id":"biliar-08","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Sepsis en un paciente de terapia intensiva","vineta":"Varón de 70 años en terapia intensiva por un politraumatismo hace 10 días, con nutrición parenteral. Fiebre y aumento de los requerimientos de vasopresor sin otro foco. Ecografía: vesícula distendida sin cálculos, pared de 6 mm, líquido perivesicular.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Colecistitis alitiásica","Colecistitis litiásica","Colangitis","Hallazgo normal en terapia intensiva"],"explicacion":"En el paciente crítico (trauma, quemaduras, ayuno, nutrición parenteral, vasopresores), la sepsis sin otro foco con vesícula distendida y alterada sugiere colecistitis alitiásica. La pared engrosada aislada no alcanza para el diagnóstico.","fuente":"Hermes: Colecistitis alitiásica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás en este paciente inestable?","opciones":["Colecistostomía percutánea","Colecistectomía abierta inmediata","Solo antibióticos","CPRE"],"explicacion":"En el paciente inestable la colecistostomía drena el foco con poco riesgo. La colecistectomía es definitiva cuando la fisiología lo permite.","fuente":"Hermes: Colecistitis alitiásica y Drenaje de la vesícula biliar"},{"tipo":"Medidas generales","pregunta":"No mejora a las 48 horas del drenaje. ¿Qué hacés?","opciones":["Buscar necrosis, perforación u otro foco, y considerar cirugía","Esperar una semana más con el drenaje y el mismo antibiótico","Retirar el drenaje y repetir la ecografía","Cambiar el antibiótico a un carbapenémico y esperar otras 72 horas"],"explicacion":"El drenaje no corrige una vesícula necrótica o perforada; si no hay mejoría hay que reevaluar con imagen y considerar la colecistectomía.","fuente":"Hermes: Colecistitis alitiásica"}]},{"id":"vb-06","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Colecistitis con ictericia y un cálculo en el bacinete","vineta":"Mujer de 58 años con colecistitis crónica reagudizada e ictericia (bilirrubina 4 mg/dl). La colangiorresonancia muestra un cálculo impactado en el bacinete que comprime el hepático común desde afuera, sin litiasis coledociana.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Síndrome de Mirizzi","Coledocolitiasis impactada","Colangiocarcinoma hiliar","Colangitis esclerosante"],"explicacion":"La compresión extrínseca del hepático común por un cálculo impactado en el bacinete o el cístico, con ictericia, define el Mirizzi. Si hay erosión de la pared y fístula colecistobiliar, se clasifica en tipos más avanzados.","fuente":"Hermes: Síndrome de Mirizzi"},{"tipo":"Conducta quirúrgica","pregunta":"En la cirugía encontrás inflamación densa del triángulo hepatocístico sin poder lograr la visión crítica. ¿Qué hacés?","opciones":["Colecistectomía subtotal o conversión, sin disecar a ciegas","Seguir disecando el triángulo hasta encontrar el cístico","Clipar y seccionar la estructura tubular más gruesa que llegue","Cerrar y derivar sin drenar la vesícula"],"explicacion":"En el Mirizzi el hepático común está pegado al bacinete y es fácil lesionarlo. Sin visión crítica se recurre a una estrategia de rescate: colecistectomía subtotal, conversión o, en tipos con fístula, reparación de la vía biliar.","fuente":"SAGES Safe Cholecystectomy; Hermes: Síndrome de Mirizzi y Colecistectomía subtotal"},{"tipo":"Técnica","pregunta":"Si hubiera una fístula que comprometa más de la mitad de la circunferencia del hepático, ¿qué reparación es la habitual?","opciones":["Hepaticoyeyunostomía en Y de Roux","Sutura primaria del hepático sin tubo","Ligadura del hepático y drenaje externo","Drenaje subhepático sin reparar la vía"],"explicacion":"Las fístulas grandes dejan un defecto que no se cierra sin estenosis; la reconstrucción con hepaticoyeyunostomía es la opción habitual. Los defectos pequeños pueden cerrarse sobre un tubo o con un colgajo de vesícula.","fuente":"Hermes: Síndrome de Mirizzi; Técnica de la anastomosis biliodigestiva"}]},{"id":"lap-01","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Neumoperitoneo en un paciente con cirugías previas","vineta":"Varón de 55 años con laparotomía mediana previa por una perforación. Se programa colecistectomía laparoscópica por litiasis sintomática.","pasos":[{"tipo":"Técnica","pregunta":"¿Cómo hacés el acceso inicial?","opciones":["Técnica abierta de Hasson o acceso en el punto de Palmer","Aguja de Veress umbilical a ciegas, como de rutina","Trocar óptico directo sobre la cicatriz de la laparotomía","Contraindicar la laparoscopia y operar por laparotomía"],"explicacion":"Con cirugía previa hay riesgo de adherencias bajo la cicatriz; se entra con técnica abierta o en un sitio alejado, como el cuadrante superior izquierdo (punto de Palmer).","fuente":"Hermes: Neumoperitoneo con técnica abierta de Hasson; Principios de cirugía laparoscópica"},{"tipo":"Medidas generales","pregunta":"¿Con qué presión de neumoperitoneo trabajás habitualmente?","opciones":["12 a 15 mmHg","25 a 30 mmHg","2 a 4 mmHg","40 mmHg"],"explicacion":"Entre 12 y 15 mmHg se logra espacio de trabajo con repercusión hemodinámica y respiratoria tolerable; presiones mayores reducen el retorno venoso y la ventilación.","fuente":"Hermes: Principios de cirugía laparoscópica"},{"tipo":"Diagnóstico","pregunta":"Al insuflar cae bruscamente la capnografía, hay hipotensión y un soplo en rueda de molino. ¿Qué sospechás?","opciones":["Embolia gaseosa de CO2","Neumotórax a tensión izquierdo","Reacción anafiláctica","Hipotermia grave"],"explicacion":"La caída del CO2 espirado con colapso hemodinámico y soplo en rueda de molino al insuflar indican embolia gaseosa: se suspende la insuflación, se desinfla, se coloca al paciente en decúbito lateral izquierdo con Trendelenburg y se ventila con oxígeno al 100 %.","fuente":"Hermes: Principios de cirugía laparoscópica"}]},{"id":"lap-02","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Identificación segura antes de clipar","vineta":"Colecistectomía laparoscópica programada en una mujer de 45 años. Disecaste el triángulo hepatocístico.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué tres criterios definen la visión crítica de seguridad?","opciones":["Triángulo limpio, tercio inferior separado del lecho y dos estructuras","Ver el colédoco, el hepático común y la arteria hepática propia en el campo","Colangiografía normal, cístico corto y una sola arteria cística","Vesícula vacía, cístico clipado y lecho hepático seco"],"explicacion":"La visión crítica de Strasberg tiene tres criterios; se documenta con foto o video antes de clipar. Su objetivo es evitar la falsa identificación del colédoco como cístico.","fuente":"SAGES Safe Cholecystectomy; Hermes: Prevención de lesiones durante la colecistectomía"},{"tipo":"Estudios","pregunta":"La anatomía sigue dudosa. ¿Qué podés agregar para aclararla?","opciones":["Colangiografía intraoperatoria o fluorescencia con indocianina","Ecografía abdominal de control en la mañana siguiente a la cirugía","TC de abdomen intraoperatoria con contraste","Clipar igual: la visión parcial alcanza"],"explicacion":"Cuando la anatomía no es clara, la colangiografía o la fluorescencia ayudan a identificar los conductos. No sustituyen la visión crítica pero suman información.","fuente":"Hermes: Colangiografía peroperatoria por fluoroscopia y Colangiografía fluorescente con indocianina verde"},{"tipo":"Conducta quirúrgica","pregunta":"Si aun así no lográs la visión crítica, ¿qué hacés?","opciones":["Rescate: colecistectomía subtotal, colecistostomía o conversión","Clipar la estructura que más se parece al cístico y seguir con la disección","Seguir disecando el triángulo el tiempo que haga falta","Seccionar las estructuras que entran en la vesícula"],"explicacion":"Las estrategias de rescate evitan la lesión biliar cuando el triángulo es inseguro. Convertir no siempre resuelve el problema; la subtotal es muchas veces la opción más segura.","fuente":"SAGES Safe Cholecystectomy; Hermes: Colecistectomía subtotal"}]},{"id":"lesbil-01","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"Bilis por el drenaje al segundo día","vineta":"Mujer de 50 años en el día 2 de una colecistectomía laparoscópica. Por el drenaje salen 300 ml/día de bilis. Afebril, sin ictericia, abdomen blando. La colangiorresonancia muestra una vía biliar continua y sin estenosis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué lesión es la más probable?","opciones":["Fuga del cístico o de un conducto de Luschka (Strasberg A)","Sección completa del colédoco (Strasberg E)","Ligadura del hepático común (Strasberg E2)","Lesión lateral del hepático común con estenosis (Strasberg D)"],"explicacion":"Una fuga con vía biliar continua y sin estenosis es una lesión menor, generalmente del muñón cístico o de un conducto accesorio del lecho.","fuente":"WSES 2020, lesión biliar; Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Conducta quirúrgica","pregunta":"La fuga no disminuye. ¿Qué indicás?","opciones":["CPRE con esfinterotomía y prótesis biliar","Hepaticoyeyunostomía en Y de Roux","Relaparotomía y sutura del colédoco","Retirar el drenaje y repetir la ecografía"],"explicacion":"La CPRE baja la presión de la vía biliar y la fuga cierra en la gran mayoría; si hay una colección sin drenaje, se drena por vía percutánea.","fuente":"WSES 2020, lesión biliar"}]},{"id":"lesbil-02","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"Ictericia progresiva y clips sobre el hepático","vineta":"Varón de 42 años, 5 días después de una colecistectomía laparoscópica dificultosa. Ictericia progresiva (bilirrubina 8 mg/dl), fiebre y dolor. Ecografía: vía biliar intrahepática dilatada y colección subhepática. Colangiorresonancia: interrupción completa del hepático común a 2 cm de la confluencia.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tipo de lesión es?","opciones":["Lesión mayor, Strasberg E2","Lesión menor, Strasberg A","Lesión lateral, Strasberg D","Coledocolitiasis residual"],"explicacion":"La pérdida de continuidad de la vía principal es una lesión tipo E; el subtipo depende de la distancia a la confluencia (E1 más de 2 cm, E2 menos de 2 cm).","fuente":"Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés primero?","opciones":["Controlar la sepsis: drenaje percutáneo, antibióticos y soporte","Hepaticoyeyunostomía inmediata en el mismo hospital donde ocurrió la lesión","Observar con antibióticos y repetir la ecografía","Colocar una prótesis por CPRE para unir los extremos"],"explicacion":"Pasadas las primeras 72 horas, con colección e infección, primero se controla la sepsis y se define la anatomía; la reparación se hace con los tejidos en condiciones y por un equipo con experiencia.","fuente":"WSES 2020, lesión biliar; Hermes: Manejo percutáneo de la lesión biliar iatrogénica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es la reparación definitiva?","opciones":["Hepaticoyeyunostomía en Y de Roux, en un centro con experiencia","Anastomosis terminoterminal del colédoco sobre un tubo en T de Kehr","Coledocoduodenostomía laterolateral","Prótesis biliar plástica permanente con recambios por CPRE"],"explicacion":"La hepaticoyeyunostomía en Y de Roux, con mucosa sana y sin tensión, es la reparación estándar de las lesiones tipo E; la anastomosis terminoterminal tiene alta tasa de estenosis.","fuente":"WSES 2020, lesión biliar; Hermes: Hepaticoyeyunostomía"},{"tipo":"Estudios","pregunta":"¿Qué estudio agregás antes de reparar?","opciones":["Angio-TC para evaluar la arteria hepática derecha","Endoscopia digestiva alta para descartar úlcera","Colonoscopia completa para descartar un tumor sincrónico","Gammagrafía ósea corporal total"],"explicacion":"La lesión combinada de la arteria hepática derecha es frecuente en las lesiones altas y condiciona el nivel de la reconstrucción.","fuente":"Hermes: Lesión de la vía biliar principal en colecistectomía"}]},{"id":"tiroides-01","tema":"Patología tiroidea","anio":3,"titulo":"Nódulo tiroideo en una ecografía","vineta":"Mujer de 45 años con un nódulo tiroideo de 1,8 cm, sólido, hipoecoico, con microcalcificaciones y bordes irregulares. TSH normal. Sin adenopatías palpables.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["Punción con aguja fina guiada por ecografía","Centellograma tiroideo con tecnecio","Tiroidectomía total directa sin punción","Control ecográfico en 2 años y luego decidir"],"explicacion":"Un nódulo sólido hipoecoico con microcalcificaciones y bordes irregulares es de alta sospecha; se punza desde 1 cm. El centellograma solo se pide con TSH baja.","fuente":"ATA 2015, nódulo tiroideo; Hermes: Nódulo tiroideo"},{"tipo":"Diagnóstico","pregunta":"La citología es Bethesda VI. ¿Qué significa?","opciones":["Maligno (habitualmente carcinoma papilar)","Benigno (nódulo coloide)","No diagnóstico (muestra insuficiente)","Atipia de significado incierto"],"explicacion":"Bethesda VI es maligno, con más del 95 % de riesgo; la mayoría corresponde a carcinoma papilar.","fuente":"Sistema Bethesda; Hermes: Nódulo tiroideo"},{"tipo":"Estudios","pregunta":"¿Qué estudio hacés antes de operar?","opciones":["Ecografía de los compartimentos ganglionares del cuello","PET-TC de cuerpo entero para estadificar de rutina antes de operar","Tiroglobulina sérica para confirmar el diagnóstico","Centellograma corporal total con yodo"],"explicacion":"La ecografía cervical preoperatoria busca metástasis ganglionares que cambiarían la extensión de la cirugía.","fuente":"ATA 2015, cáncer diferenciado de tiroides"},{"tipo":"Conducta quirúrgica","pregunta":"Es un tumor de 1,8 cm sin extensión extratiroidea ni ganglios. ¿Qué cirugía es aceptable?","opciones":["Lobectomía o tiroidectomía total, decidida con la paciente","Solo tiroidectomía total con vaciamiento central y lateral","Enucleación del nódulo","Vigilancia ac
