tiva con ecografía cada 6 meses"],"explicacion":"Para tumores de 1 a 4 cm sin extensión extratiroidea ni ganglios, ATA 2015 acepta tanto la lobectomía como la tiroidectomía total; el vaciamiento se reserva para ganglios comprometidos.","fuente":"ATA 2015, cáncer diferenciado de tiroides"}]},{"id":"tiroides-02","tema":"Patología tiroidea","anio":3,"titulo":"Hormigueos después de una tiroidectomía total","vineta":"Mujer de 40 años en el primer día de una tiroidectomía total por bocio. Refiere parestesias peribucales y en los dedos. Signo de Chvostek positivo. Calcio total 7,0 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hipocalcemia por hipoparatiroidismo posoperatorio","Lesión bilateral del nervio laríngeo recurrente","Crisis tirotóxica por manipulación de la glándula","Hematoma cervical con compresión de la vía aérea"],"explicacion":"Parestesias, Chvostek positivo y calcio bajo tras una tiroidectomía total indican hipoparatiroidismo, por lesión o desvascularización de las paratiroides.","fuente":"Hermes: Tiroidectomía"},{"tipo":"Fármaco","pregunta":"Con síntomas y calcio de 7 mg/dl, ¿qué indicás?","opciones":["Gluconato de calcio IV","Calcio oral sin vía IV","Levotiroxina oral","Furosemida y solución salina"],"explicacion":"La hipocalcemia sintomática o grave se trata con calcio IV y monitoreo electrocardiográfico; luego se pasa a calcio oral con calcitriol.","fuente":"Society for Endocrinology 2016, hipocalcemia aguda"},{"tipo":"Dosis","pregunta":"¿Con qué dosis inicial?","opciones":["10 a 20 ml al 10 % diluidos, en unos 10 minutos","100 ml al 10 % en bolo rápido sin diluir","1 ml al 10 % por vía subcutánea, repetible","500 mg de carbonato por vía oral, dosis única"],"explicacion":"Se administran 10 a 20 ml de gluconato de calcio al 10 % en 50 a 100 ml de dextrosa al 5 % en unos 10 minutos, con monitoreo, seguido de una infusión si persiste.","fuente":"Society for Endocrinology 2016, hipocalcemia aguda"},{"tipo":"Medidas generales","pregunta":"Para el alta, ¿qué indicás?","opciones":["Calcio oral y calcitriol, con control de calcio y PTH","Alta sin tratamiento, porque se recupera sola en pocos días","Dieta rica en lácteos sin suplementos","Una dosis única de vitamina D en megadosis"],"explicacion":"El hipoparatiroidismo posoperatorio se maneja con calcio oral y calcitriol; la mayoría es transitorio, y se define como permanente si persiste más de 6 a 12 meses.","fuente":"Hermes: Tiroidectomía"}]},{"id":"tiroides-03","tema":"Patología tiroidea","anio":3,"titulo":"Enfermedad de Graves para cirugía","vineta":"Mujer de 30 años con enfermedad de Graves, bocio grande y oftalmopatía moderada. Recibe metimazol y está eutiroidea. Se decide tiroidectomía total.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué agregás en los días previos a la cirugía?","opciones":["Yoduro de potasio (Lugol o SSKI)","Levotiroxina en dosis supresiva","Iodo radiactivo en dosis baja","Corticoides en dosis altas"],"explicacion":"En la enfermedad de Graves, el yoduro preoperatorio reduce la vascularización de la glándula y el sangrado intraoperatorio.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Lugol 5 a 7 gotas 3 veces por día, 10 días antes","Lugol 1 gota por semana durante los 3 meses previos","Lugol 20 gotas en dosis única el día de la cirugía","Lugol 50 gotas por día durante los 2 días previos"],"explicacion":"ATA 2016 indica Lugol 5 a 7 gotas o SSKI 1 a 2 gotas tres veces por día, diluidas en agua o jugo, durante 10 días antes de la operación.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Tiroidectomía total","Lobectomía unilateral","Tiroidectomía subtotal bilateral","Istmectomía con biopsia"],"explicacion":"En la enfermedad de Graves se prefiere la tiroidectomía total, porque elimina el riesgo de recurrencia con complicaciones similares a la subtotal.","fuente":"ATA 2016, hipertiroidismo"},{"tipo":"Dosis","pregunta":"Después, ¿con qué dosis inicial de levotiroxina la reemplazás?","opciones":["Alrededor de 1,6 µg/kg/día, ajustada por TSH","10 µg/kg/día desde el primer día","25 µg por semana, en una sola toma","No necesita reemplazo si queda eutiroidea"],"explicacion":"La dosis de reemplazo completa es cercana a 1,6 µg/kg/día; se ajusta con la TSH a las 6 a 8 semanas.","fuente":"ATA 2016, hipertiroidismo"}]},{"id":"ulcera-01","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Melena y un coágulo en la úlcera","vineta":"Varón de 67 años que toma ibuprofeno por artrosis. Melena e hipotensión que responde a cristaloides. Hemoglobina 7,8 g/dl. Endoscopia a las 12 horas: úlcera bulbar posterior de 1,5 cm con vaso visible no sangrante.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué clasificación de Forrest tiene?","opciones":["Forrest IIa (vaso visible)","Forrest Ia (sangrado en chorro)","Forrest IIc (base pigmentada)","Forrest III (base limpia, sin estigmas)"],"explicacion":"El vaso visible no sangrante es Forrest IIa, de alto riesgo de resangrado, por lo que requiere tratamiento endoscópico.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa; Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Medidas generales","pregunta":"¿Con qué umbral transfundís glóbulos rojos?","opciones":["Hemoglobina menor de 7 g/dl (8 si es cardiópata)","Hemoglobina menor de 10 g/dl, por la edad","Si persiste la hipotensión, sin mirar la hemoglobina","Si la hemoglobina baja de 5 g/dl"],"explicacion":"La estrategia restrictiva, con umbral de 7 g/dl y objetivo de 7 a 9, reduce la mortalidad y el resangrado; en cardiópatas se usa un umbral más alto.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Fármaco","pregunta":"Después de la terapia endoscópica, ¿qué indicás?","opciones":["Inhibidor de la bomba de protones en dosis altas","Antiácidos orales cada 4 horas","Bloqueante H2 (ranitidina) en dosis estándar por vía oral","Sucralfato como protector de la mucosa"],"explicacion":"Tras la hemostasia endoscópica de una úlcera de alto riesgo, el inhibidor de bomba en dosis altas reduce el resangrado.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["80 mg IV y luego 8 mg/h durante 72 horas","20 mg VO por día durante 8 semanas","40 mg IV por semana durante un mes","80 mg IV en dosis única y luego 20 mg VO por día"],"explicacion":"El esquema es un bolo de 80 mg seguido de infusión de 8 mg/h o bolos intermitentes en dosis altas durante 72 horas, y luego dos dosis diarias por vía oral.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Conducta quirúrgica","pregunta":"Resangra y falla una segunda endoscopia. ¿Qué hacés?","opciones":["Angioembolización o cirugía con ligadura del vaso","Tercera endoscopia con clips y adrenalina","Duplicar la infusión de inhibidor de bomba","Transfundir y esperar que deje de sangrar"],"explicacion":"Si falla el segundo intento endoscópico, la embolización de la gastroduodenal o la cirugía con ligadura del vaso son las opciones de rescate.","fuente":"ESGE 2021; Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Fármaco","pregunta":"La biopsia muestra Helicobacter pylori. ¿Qué tratamiento de erradicación indicás donde no se conoce la resistencia a la claritromicina?","opciones":["Cuádruple con bismuto durante 14 días","Triple con claritromicina durante 7 días","Amoxicilina en dosis altas sola por 14 días","Inhibidor de bomba sin antibióticos por 8 semanas"],"explicacion":"Maastricht VI recomienda la cuádruple con bismuto durante 14 días cuando la resistencia a la claritromicina es alta o desconocida, y confirmar la erradicación con prueba de aliento.","fuente":"Maastricht VI/Florence 2022"}]},{"id":"ulcera-02","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Úlcera gástrica que no cicatriza","vineta":"Varón de 60 años con una úlcera de 2 cm en la curvatura menor del antro. Erradicó H. pylori y recibió inhibidor de bomba 12 semanas, pero la úlcera persiste. Las biopsias fueron negativas.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué hacés antes de decidir la cirugía?","opciones":["Repetir la endoscopia con biopsias múltiples","Operar sin más estudios, por la refractariedad","Suspender el inhibidor de bomba y observar","Una TC de abdomen con contraste"],"explicacion":"Toda úlcera gástrica refractaria obliga a repetir las biopsias, porque puede ser un cáncer; también se revisan el consumo de AINE y la erradicación.","fuente":"Hermes: Enfermedad ulcerosa péptica"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste refractaria y benigna. ¿Qué cirugía indicás?","opciones":["Gastrectomía distal que incluya la úlcera","Vagotomía troncular y piloroplastia","Gastrectomía total con Y de Roux","Fundoplicatura y piloroplastia"],"explicacion":"La úlcera gástrica refractaria se reseca con una gastrectomía distal que la incluya; así se trata y se obtiene diagnóstico histológico completo.","fuente":"Hermes: Gastrectomía; Reconstrucción después de gastrectomía"},{"tipo":"Diagnóstico","pregunta":"Meses después tiene sudoración, palpitaciones y diarrea a los 20 minutos de comer. ¿Qué es?","opciones":["Síndrome de dumping temprano","Dumping tardío por hipoglucemia","Síndrome del asa aferente por obstrucción","Úlcera de la boca anastomótica"],"explicacion":"Los síntomas vasomotores y digestivos en los primeros 30 minutos se deben al paso rápido de contenido hiperosmolar al intestino; el dumping tardío ocurre 1 a 3 horas después por hipoglucemia.","fuente":"Hermes: Complicaciones de gastrectomía"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero para el dumping?","opciones":["Comidas chicas y frecuentes, sin azúcares simples ni líquidos","Reoperación con conversión a Y de Roux en el corto plazo, sin dieta previa","Dieta rica en azúcares para evitar la hipoglucemia","Octreótido subcutáneo antes de cada comida"],"explicacion":"La mayoría mejora con medidas dietéticas; el octreótido o la reoperación se reservan para los casos refractarios.","fuente":"Hermes: Complicaciones de gastrectomía"}]},{"id":"erge-01","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Pirosis de años","vineta":"Varón de 42 años con pirosis y regurgitación desde hace 5 años, sin disfagia, sin pérdida de peso ni anemia. IMC 29.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Bajar de peso, elevar la cabecera y no cenar tarde","Dieta líquida estricta por 4 semanas","Reposo después de cada comida, acostado","Evitar las comidas picantes como medida principal"],"explicacion":"La pérdida de peso, la elevación de la cabecera y evitar comer antes de acostarse tienen respaldo para mejorar el reflujo.","fuente":"Hermes: Enfermedad por reflujo gastroesofágico"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento farmacológico inicial indicás?","opciones":["Inhibidor de bomba antes del desayuno por 8 semanas","Antiácidos a demanda después de cada comida","Procinéticos (domperidona) antes de cada comida, por 8 semanas","Antibióticos para erradicar H. pylori"],"explicacion":"El inhibidor de bomba en dosis estándar, tomado 30 a 60 minutos antes del desayuno durante 8 semanas, es el tratamiento inicial del reflujo típico sin síntomas de alarma.","fuente":"Hermes: Enfermedad por reflujo gastroesofágico"},{"tipo":"Estudios","pregunta":"Persiste regurgitación pese al tratamiento y quiere operarse. ¿Qué estudios pedís?","opciones":["Endoscopia, pH-metría sin inhibidor de bomba y manometría","Radiografía de tórax y seriada esofagogastroduodenal con bario","Endoscopia y pH-metría bajo inhibidor de bomba","TC de abdomen y endoscopia"],"explicacion":"Antes de la cirugía hay que demostrar el reflujo en forma objetiva (esofagitis grave o tiempo de exposición ácida elevado) y descartar con manometría un trastorno motor como la acalasia.","fuente":"Lyon 2.0 (2023); Hermes: Fundoplicatura laparoscópica"},{"tipo":"Diagnóstico","pregunta":"¿Qué tiempo de exposición ácida en la pH-metría es concluyente de reflujo según Lyon?","opciones":["Más del 6 %","Más del 1 %","Más del 30 %","Más del 15 %"],"explicacion":"Según el consenso de Lyon, un tiempo de exposición ácida mayor del 6 % es concluyente, menor del 4 % es normal y entre 4 y 6 % es indeterminado.","fuente":"Lyon 2.0 (2023)"},{"tipo":"Técnica","pregunta":"Los estudios confirman reflujo con motilidad normal. ¿Qué cirugía indicás?","opciones":["Fundoplicatura laparoscópica con cierre de pilares","Gastrectomía subtotal con Y de Roux","Esofagectomía distal con anastomosis","Miotomía de Heller con funduplicatura parcial"],"explicacion":"La fundoplicatura laparoscópica con cierre crural es el tratamiento quirúrgico estándar; la miotomía es para acalasia.","fuente":"Hermes: Fundoplicatura laparoscópica"}]},{"id":"erge-02","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Hernia paraesofágica sintomática","vineta":"Mujer de 74 años con plenitud posprandial, dolor torácico al comer y anemia ferropénica. TC: hernia paraesofágica con más de la mitad del estómago en el tórax.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué explica la anemia?","opciones":["Erosiones de Cameron en el cuello herniario","Cáncer gástrico del fundus herniado","Hemorroides internas sangrantes","Gastritis atrófica con déficit de B12"],"explicacion":"Las lesiones de Cameron, erosiones lineales en el cuello de la hernia, causan pérdida crónica de sangre; igual corresponde la endoscopia para descartar otras causas.","fuente":"Hermes: Hernia hiatal y paraesofágica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reparación laparoscópica programada con fundoplicatura","Observación y control endoscópico anual","Gastrectomía total con esofagoyeyunostomía","Hierro endovenoso e inhibidor de bomba de por vida, sin cirugía"],"explicacion":"La hernia paraesofágica sintomática se repara; los pasos clave son reducir el estómago, resecar el saco, lograr esófago intraabdominal sin tensión, cerrar los pilares y agregar una fundoplicatura.","fuente":"Hermes: Hernia hiatal y paraesofágica"},{"tipo":"Diagnóstico","pregunta":"Si llegara con dolor intenso, arcadas sin vómito e imposibilidad de pasar una sonda nasogástrica, ¿qué sospecharías?","opciones":["Vólvulo gástrico agudo (tríada de Borchardt)","Infarto agudo de miocardio inferior","Pancreatitis aguda necrotizante","Perforación esofágica (síndrome de Boerhaave)"],"explicacion":"La tríada de Borchardt (dolor epigástrico, arcadas improductivas e imposibilidad de pasar la sonda) indica vólvulo gástrico, una urgencia por riesgo de isquemia.","fuente":"Hermes: Hernia hiatal y paraesofágica"}]},{"id":"mama-03","tema":"Patología mamaria y cáncer de mama","anio":3,"titulo":"Microcalcificaciones en un control","vineta":"Mujer de 52 años asintomática. Mamografía de control: microcalcificaciones finas lineales agrupadas en 2 cm del cuadrante superoexterno izquierdo (BI-RADS 4C).","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo obtenés el diagnóstico?","opciones":["Biopsia asistida por vacío guiada por estereotaxia","Control mamográfico con magnificación en 6 meses","Ecografía dirigida y alta si es normal","Mastectomía simple sin biopsia previa"],"explicacion":"Las microcalcificaciones sospechosas sin masa se biopsian con guía estereotáxica, habitualmente con sistemas asistidos por vacío; se deja un marcador.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"Informa carcinoma ductal in situ de alto grado. ¿Qué significa?","opciones":["Cáncer confinado a los conductos, sin invasión","Cáncer invasor con alto riesgo de metástasis ganglionares","Lesión benigna sin riesgo de progresar a cáncer invasor","Mastopatía fibroquística con hiperplasia atípica"],"explicacion":"El carcinoma in situ no atraviesa la membrana basal y por eso no da metástasis ganglionares, pero puede progresar a invasor.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Técnica","pregunta":"¿Cómo lo resecás?","opciones":["Escisión con marcación previa y radiografía de la pieza","Mastectomía radical modificada con vaciamiento","Cuadrantectomía con vaciamiento axilar completo","Resección guiada por palpación, sin marcación previa"],"explicacion":"Las lesiones no palpables se localizan antes de operar y se verifica en la pieza que las calcificaciones fueron resecadas. Después de la cirugía conservadora se indica radioterapia.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hacés biopsia de ganglio centinela en la cirugía conservadora del carcinoma in situ?","opciones":["No de rutina; sí con mastectomía o sospecha de invasión","Sí, porque el carcinoma es de alto grado","No: vaciamiento axilar directo por tratarse de un alto grado","Sí, pero solo si el in situ es de bajo grado"],"explicacion":"Sin invasión no hay metástasis ganglionares; el centinela se agrega en la mastectomía (porque después no puede hacerse) o si se sospecha un componente invasor.","fuente":"Hermes: Cirugía axilar en cáncer de mama"}]},{"id":"uro-01","tema":"Nefrectomías","anio":3,"titulo":"Masa renal incidental","vineta":"Varón de 58 años con una masa sólida de 3 cm en el polo inferior del riñón derecho, con realce, hallada en una TC por otro motivo. Función renal normal y riñón contralateral sano.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué es lo más probable?","opciones":["Carcinoma de células renales (T1a)","Quiste simple","Angiomiolipoma con grasa macroscópica","Absceso renal"],"explicacion":"Una masa sólida que realza es un carcinoma renal hasta demostrar lo contrario; menor de 4 cm es T1a. El angiomiolipoma se reconoce por grasa macroscópica.","fuente":"EAU 2024, carcinoma renal; Hermes: Nefrectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Nefrectomía parcial","Nefrectomía radical","Nefroureterectomía","Vigilancia activa con TC anual"],"explicacion":"Para tumores T1 que técnicamente lo permitan se prefiere la nefrectomía parcial, porque preserva función renal con control oncológico equivalente.","fuente":"EAU 2024, carcinoma renal"},{"tipo":"Técnica","pregunta":"Si hicieras una nefrectomía radical, ¿en qué orden tratás los vasos del pedículo?","opciones":["Primero la arteria y luego la vena","Primero la vena y luego la arteria","Ambos juntos en masa","Es indistinto el orden"],"explicacion":"Ligar primero la arteria evita la congestión y el sangrado del riñón que se produciría al ocluir la vena con la arteria abierta.","fuente":"Hermes: Nefrectomía"}]},{"id":"uro-02","tema":"Histerectomías","anio":3,"titulo":"Uréter seccionado durante una histerectomía","vineta":"Durante una histerectomía abdominal por miomas, al ligar la arteria uterina izquierda notás orina en el campo y un uréter seccionado a 3 cm de la vejiga.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Dónde es más vulnerable el uréter en la histerectomía?","opciones":["Donde cruza por debajo de la arteria uterina","En la unión pieloureteral","En el cruce con el psoas a nivel lumbar","En su entrada al trígono vesical"],"explicacion":"El uréter pasa por debajo de la arteria uterina a unos 1,5 a 2 cm del cuello uterino (\"el agua pasa bajo el puente\"); también es vulnerable en el ligamento infundibulopélvico.","fuente":"Hermes: Histerectomía; Lesión iatrogénica de la vía urinaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo reparás una sección del uréter distal tan cerca de la vejiga?","opciones":["Reimplante ureterovesical sobre un catéter doble J","Ureteroureterostomía terminoterminal espatulada","Ligadura del uréter y nefrostomía definitiva","Nefrectomía izquierda en el mismo acto"],"explicacion":"Las lesiones del tercio distal se reparan con reimplante en la vejiga; el psoas hitch o el colgajo de Boari ganan longitud. La anastomosis terminoterminal es para lesiones cortas del tercio medio o superior.","fuente":"AUA 2017, trauma urológico; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Medidas generales","pregunta":"¿Qué principio general guía la reparación?","opciones":["Repararla en el acto, sin tensión y con drenaje","Esperar a que dé síntomas para confirmar la lesión","Sutura con material no reabsorbible y sin catéter","No drenar el lecho para no favorecer la fístula urinaria"],"explicacion":"La reparación inmediata tiene mejores resultados; se usan anastomosis sin tensión, espatuladas, con sutura reabsorbible, catéter y drenaje.","fuente":"AUA 2017, trauma urológico"}]},{"id":"colon-01","tema":"Cáncer de colon","anio":3,"titulo":"Anemia y tumor en el ciego","vineta":"Mujer de 68 años con anemia ferropénica y astenia. Colonoscopia: tumor ulcerado en el ciego; la biopsia informa adenocarcinoma. El resto del colon está libre.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudios de estadificación pedís?","opciones":["TC de tórax, abdomen y pelvis con contraste y CEA","Ecografía abdominal y radiografía de tórax","PET-TC de cuerpo entero de rutina","Resonancia de abdomen y centellograma óseo"],"explicacion":"La estadificación del cáncer de colon se hace con TC de tórax, abdomen y pelvis y CEA basal; el PET se reserva para situaciones dudosas.","fuente":"ESMO 2023, cáncer de colon localizado; Hermes: Cirugía del cáncer de colon"},{"tipo":"Conducta quirúrgica","pregunta":"No hay metástasis. ¿Qué cirugía indicás?","opciones":["Hemicolectomía derecha con ligadura central y linfadenectomía","Resección segmentaria del ciego con márgenes de 2 cm a cada lado","Colectomía total con ileorrectoanastomosis","Mucosectomía endoscópica y control"],"explicacion":"El cáncer del ciego se trata con hemicolectomía derecha oncológica, con ligadura en el origen de los vasos y resección del mesocolon con sus ganglios.","fuente":"Hermes: Colectomía derecha"},{"tipo":"Técnica","pregunta":"¿Cuántos ganglios como mínimo debe tener la pieza para una estadificación adecuada?","opciones":["12","3","30","6"],"explicacion":"Al menos 12 ganglios en la pieza son necesarios para estadificar con confianza; menos de 12 se considera factor de riesgo en estadio II.","fuente":"ESMO 2023, cáncer de colon localizado"},{"tipo":"Fármaco","pregunta":"La anatomía patológica es pT3 N1 (estadio III). ¿Qué indicás?","opciones":["Quimioterapia adyuvante (CAPOX o FOLFOX)","Seguimiento con CEA y TC, sin adyuvancia","Radioterapia adyuvante sobre el lecho tumoral","Inmunoterapia con anti-PD-1 de rutina"],"explicacion":"El estadio III recibe quimioterapia adyuvante con oxaliplatino y fluoropirimidina; reduce la recurrencia y la mortalidad.","fuente":"ESMO 2023, cáncer de colon localizado"},{"tipo":"Dosis","pregunta":"¿Cuánto dura en un estadio III de bajo riesgo (T1-3 N1) con CAPOX?","opciones":["3 meses","2 semanas","24 meses","12 meses"],"explicacion":"El análisis IDEA mostró que 3 meses de CAPOX son no inferiores a 6 en el estadio III de bajo riesgo, con mucha menos neuropatía; en alto riesgo (T4 o N2) se prefieren 6 meses.","fuente":"Ensayo IDEA; ESMO 2023"}]},{"id":"colon-02","tema":"Cáncer de colon","anio":3,"titulo":"Oclusión por cáncer de sigma","vineta":"Varón de 76 años con distensión, vómitos y sin eliminación de gases desde hace 3 días. TC: tumor estenosante del sigma con colon proximal dilatado (ciego de 9 cm) sin perforación ni metástasis. Estable.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene un ciego tan dilatado con válvula ileocecal competente?","opciones":["Perforación del ciego (asa cerrada)","Vólvulo de sigma secundario","Isquemia del sigma por el tumor","Fístula colovesical"],"explicacion":"Con válvula competente el colon queda en asa cerrada; el ciego es el segmento de mayor diámetro y el que se perfora, sobre todo por encima de 10 a 12 cm.","fuente":"Hermes: Cirugía del cáncer de colon"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué opciones son razonables?","opciones":["Hartmann o, en centros con experiencia, prótesis como puente","Observar con sonda nasogástrica y enemas evacuantes durante una semana","Colonoscopia descompresiva y alta con dieta","Quimioterapia neoadyuvante sin descompresión"],"explicacion":"La obstrucción izquierda se resuelve con resección (Hartmann o anastomosis con o sin ostomía de protección según el paciente) o con prótesis como puente; ambas son aceptables según el contexto y la experiencia.","fuente":"Hermes: Cirugía del cáncer de colon"},{"tipo":"Técnica","pregunta":"En la laparotomía el ciego está isquémico con desgarros serosos. ¿Qué hacés?","opciones":["Colectomía subtotal que incluya el ciego y el tumor","Resección del sigma y observar el ciego","Cecostomía con sonda y resección del sigma","Sutura de los desgarros serosos y operación de Hartmann"],"explicacion":"Si el ciego está comprometido, se incluye en la resección con una colectomía subtotal que también trata el tumor.","fuente":"Hermes: Cirugía del cáncer de colon"}]},{"id":"colon-03","tema":"Cáncer de colon","anio":3,"titulo":"Cáncer de colon en un hombre de 38 años","vineta":"Varón de 38 años con un adenocarcinoma de colon derecho. Su padre tuvo cáncer de colon a los 45 años y una tía, cáncer de endometrio a los 50.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué síndrome sospechás?","opciones":["Síndrome de Lynch hereditario","Poliposis adenomatosa familiar","Síndrome de Peutz-Jeghers","Cáncer esporádico sin estudio"],"explicacion":"Cáncer colorrectal joven, colon derecho y familiares con cáncer de colon y endometrio sugieren síndrome de Lynch (deficiencia de reparación de errores de apareamiento).","fuente":"Hermes: Síndrome de Lynch"},{"tipo":"Estudios","pregunta":"¿Qué pedís sobre el tumor?","opciones":["Estudio de reparación de errores (IHQ o IMS)","Dosaje de CEA y CA 19-9 en la sangre","Mutación de APC en el tejido tumoral resecado","Mutación de BRCA1 y BRCA2 en el tumor"],"explicacion":"Se recomienda estudiar la reparación de errores de apareamiento en todo cáncer colorrectal; si está deficiente, se completa con estudio germinal y asesoramiento genético.","fuente":"Hermes: Síndrome de Lynch"},{"tipo":"Medidas generales","pregunta":"Se confirma Lynch. ¿Cómo vigilás a sus hermanos portadores?","opciones":["Colonoscopia cada 1 a 2 años desde los 20 a 25 años","Colonoscopia cada 10 años desde los 50 años","Sangre oculta en materia fecal anual","Colonoscopia cada 5 años desde los 40 años"],"explicacion":"Los portadores tienen cánceres de intervalo por la carcinogénesis acelerada; la colonoscopia se hace cada 1 a 2 años desde los 20 a 25 años, ajustada según el gen.","fuente":"Hermes: Síndrome de Lynch"}]},{"id":"colon-04","tema":"Cáncer de colon","anio":3,"titulo":"Cientos de pólipos en una joven","vineta":"Mujer de 22 años con rectorragia. Colonoscopia: más de 500 adenomas en todo el colon y el recto. Su madre murió de cáncer de colon a los 40.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Poliposis adenomatosa familiar clásica","Síndrome de Lynch con pólipos múltiples","Poliposis juvenil con hamartomas","Colitis ulcerosa con pseudopólipos"],"explicacion":"Cientos a miles de adenomas por mutación germinal de APC definen la poliposis adenomatosa familiar clásica; el riesgo de cáncer es casi del 100 % sin cirugía.","fuente":"Hermes: Poliposis adenomatosa familiar"},{"tipo":"Conducta quirúrgica","pregunta":"Con el recto tapizado de pólipos, ¿qué cirugía indicás?","opciones":["Proctocolectomía con reservorio ileal y anastomosis ileoanal","Colectomía total con ileorrecto anastomosis y control del recto","Hemicolectomía izquierda con colonoscopias anuales","Polipectomías endoscópicas cada 6 meses sin cirugía"],"explicacion":"Con compromiso rectal importante se reseca el recto con reservorio ileal; la ileorrecto anastomosis se reserva para recto con pocos pólipos.","fuente":"Hermes: Poliposis adenomatosa familiar"},{"tipo":"Medidas generales","pregunta":"¿Qué vigilancia extracolónica es prioritaria?","opciones":["Endoscopia alta con visión lateral (duodeno y papila)","Mamografía y ecografía mamaria anual desde los 20 años","Colangiorresonancia anual por riesgo biliar","TC de cerebro anual por meduloblastoma"],"explicacion":"Tras la colectomía, el cáncer duodenal o periampular y los desmoides son causas principales de muerte; se vigila el duodeno con endoscopio de visión lateral.","fuente":"Hermes: Poliposis adenomatosa familiar"}]},{"id":"recto-01","tema":"Cáncer de recto","anio":3,"titulo":"Tumor de recto medio localmente avanzado","vineta":"Varón de 60 años con rectorragia y cambio del ritmo evacuatorio. Adenocarcinoma a 7 cm del margen anal. Resonancia: T3c N1, fascia mesorrectal amenazada (1 mm). TC sin metástasis.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio define la estadificación local?","opciones":["Resonancia pélvica de alta resolución","TC de abdomen y pelvis con contraste","Ecografía abdominal con Doppler","Colonoscopia virtual por TC"],"explicacion":"La resonancia pélvica define T, N, la distancia a la fascia mesorrectal, la invasión venosa extramural y la relación con el esfínter, que deciden el tratamiento.","fuente":"ESMO 2017, cáncer de recto; Hermes: Cirugía del cáncer de recto"},{"tipo":"Conducta quirúrgica","pregunta":"Con la fascia mesorrectal amenazada, ¿qué indicás antes de la cirugía?","opciones":["Neoadyuvancia (quimiorradioterapia o neoadyuvancia total)","Cirugía inmediata con escisión total del mesorrecto","Quimioterapia paliativa sin intención curativa","Resección local transanal y radioterapia posterior sobre el lecho"],"explicacion":"El margen circunferencial amenazado es indicación de neoadyuvancia; la neoadyuvancia total (ensayos RAPIDO y PRODIGE 23) mejora la respuesta y reduce las metástasis.","fuente":"ESMO 2017; ensayos RAPIDO y PRODIGE 23"},{"tipo":"Técnica","pregunta":"¿Cuál es el principio técnico clave de la resección?","opciones":["Escisión total del mesorrecto en el plano areolar","Disección intramesorrectal para acortar el tiempo","Resección local transanal de espesor completo","Disección por detrás de la fascia presacra"],"explicacion":"La escisión total del mesorrecto en el plano \"sagrado\" reduce la recurrencia local; la calidad del mesorrecto se informa en la pieza. Disecar por detrás de la fascia presacra produce sangrado venoso grave.","fuente":"Hermes: Escisión total del mesorrecto"},{"tipo":"Conducta quirúrgica","pregunta":"Tras la neoadyuvancia hay respuesta clínica completa en endoscopia y resonancia. ¿Qué opción podés ofrecer?","opciones":["Vigilancia estrecha (watch and wait) en un programa","Alta sin seguimiento porque el tumor desapareció","Amputación abdominoperineal igual, a las 8 semanas","Un refuerzo de radioterapia de contacto de rutina"],"explicacion":"Con respuesta clínica completa puede ofrecerse vigilancia intensiva con endoscopia y resonancia; alrededor de un cuarto rebrota, casi siempre rescatable con cirugía.","fuente":"Hermes: Vigilancia y espera en cáncer de recto"}]},{"id":"recto-02","tema":"Cáncer de recto","anio":3,"titulo":"Tumor que invade el esfínter","vineta":"Mujer de 66 años con adenocarcinoma de recto a 2 cm del margen anal que, en la resonancia tras la neoadyuvancia, sigue invadiendo el esfínter externo.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Amputación abdominoperineal con colostomía definitiva","Resección anterior baja con anastomosis coloanal e ileostomía","Resección local transanal de espesor completo","Colostomía de descarga sin resección"],"explicacion":"La invasión del esfínter externo impide preservar el esfínter con márgenes oncológicos; la amputación abdominoperineal es la opción.","fuente":"Hermes: Amputación abdominoperineal; Preservación esfinteriana en cáncer de recto"},{"tipo":"Técnica","pregunta":"¿Qué evita la \"cintura\" de la pieza en el plano del elevador?","opciones":["Resección extraelevadora (cilíndrica)","Disección más cerca de la pared rectal","Disección interesfinteriana del canal","Cierre perineal sin drenaje"],"explicacion":"La disección que sigue el mesorrecto hasta el elevador deja una pieza con cintura y riesgo de margen positivo y perforación; la técnica extraelevadora incluye los elevadores.","fuente":"Hermes: Amputación abdominoperineal"},{"tipo":"Medidas generales","pregunta":"Antes de la cirugía, ¿qué hacés con la ostomía?","opciones":["Marcar el sitio sentada y parada, con estomaterapia","Elegir el sitio en el quirófano con la paciente acostada","Ubicarla en la cicatriz mediana para no abrir otra incisión","Esperar a ver la longitud del colon disponible en la cirugía"],"explicacion":"La marcación preoperatoria por estomaterapia reduce las complicaciones y mejora la calidad de vida.","fuente":"Hermes: Amputación abdominoperineal"}]},{"id":"gastrico-01","tema":"Cáncer gástrico","anio":3,"titulo":"Adenocarcinoma gástrico localmente avanzado","vineta":"Varón de 62 años con pérdida de peso y anemia. Endoscopia: tumor ulcerado de antro. Biopsia: adenocarcinoma. TC: engrosamiento parietal con ganglios perigástricos, sin metástasis visibles.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio agregás a la estadificación en un tumor avanzado (cT3 o mayor)?","opciones":["Laparoscopia con citología peritoneal","Colonoscopia para descartar tumor sincrónico","Centellograma óseo corporal total de rutina","Resonancia de cerebro con gadolinio de rutina"],"explicacion":"La laparoscopia detecta metástasis peritoneales que la TC no ve, evitando laparotomías innecesarias; la citología positiva equivale a enfermedad M1.","fuente":"Hermes: Cáncer gástrico"},{"tipo":"Fármaco","pregunta":"Sin carcinomatosis, ¿qué tratamiento sistémico perioperatorio indicás?","opciones":["Quimioterapia perioperatoria con FLOT","Cirugía sola, sin quimioterapia","Radioterapia preoperatoria sola","Inmunoterapia sola sin quimioterapia"],"explicacion":"En el ensayo FLOT4, la quimioterapia perioperatoria con 5-FU, leucovorina, oxaliplatino y docetaxel mejoró la supervivencia frente a ECF/ECX.","fuente":"Ensayo FLOT4"},{"tipo":"Dosis","pregunta":"¿Cuántos ciclos de FLOT se dan?","opciones":["4 ciclos antes y 4 después de la cirugía","1 ciclo antes y 6 después de la cirugía","12 ciclos después de la cirugía","8 ciclos antes de la cirugía"],"explicacion":"El esquema FLOT4 son 4 ciclos preoperatorios y 4 posoperatorios, cada 2 semanas.","fuente":"Ensayo FLOT4"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás para un cáncer de antro?","opciones":["Gastrectomía subtotal con linfadenectomía D2","Gastrectomía total con linfadenectomía D1","Resección en cuña con margen de 2 cm","Gastroyeyunostomía de derivación"],"explicacion":"El tumor distal con margen proximal adecuado se trata con gastrectomía subtotal y D2, con la misma supervivencia que la total y mejor calidad de vida.","fuente":"Hermes: Gastrectomía; Linfadenectomía D2 gástrica"},{"tipo":"Técnica","pregunta":"¿Cuántos ganglios como mínimo debe tener la pieza?","opciones":["16 o más","5 o más","2 o más","10 o más"],"explicacion":"Se requieren al menos 16 ganglios para una estadificación N adecuada; la D2 bien hecha suele obtener más.","fuente":"Hermes: Linfadenectomía D2 gástrica"}]},{"id":"esofago-01","tema":"Cáncer esofágico","anio":3,"titulo":"Disfagia progresiva en un hombre con Barrett","vineta":"Varón de 64 años con Barrett conocido sin control, disfagia progresiva a sólidos y pérdida de 8 kg. Endoscopia: tumor de esófago distal y unión gastroesofágica. Biopsia: adenocarcinoma. TC y PET: T3 N1, sin metástasis.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés con el estado nutricional antes del tratamiento?","opciones":["Evaluación y soporte nutricional, enteral si hace falta","Operar primero y nutrir después","Ayuno hasta la cirugía para no aspirar","Nutrición parenteral total de rutina por la disfagia"],"explicacion":"La desnutrición es frecuente por la disfagia y aumenta las complicaciones; se prioriza la vía enteral.","fuente":"Hermes: Cirugía del cáncer de esófago"},{"tipo":"Fármaco","pregunta":"Para un adenocarcinoma localmente avanzado, ¿qué tratamiento preoperatorio mostró mejor supervivencia en el ensayo ESOPEC?","opciones":["Quimioterapia perioperatoria FLOT","Quimiorradioterapia preoperatoria CROSS","Cirugía sola sin neoadyuvancia","Inmunoterapia con nivolumab sola"],"explicacion":"En ESOPEC, en adenocarcinoma esofágico resecable, FLOT perioperatorio logró mayor supervivencia que CROSS. CROSS sigue siendo estándar en el carcinoma escamoso.","fuente":"Ensayo ESOPEC; ensayo CROSS"},{"tipo":"Técnica","pregunta":"¿Qué abordaje se usa habitualmente para un tumor del esófago distal?","opciones":["Esofagectomía de Ivor Lewis (abdomen y tórax derecho)","Esofagectomía transhiatal sin toracotomía","Resección endoscópica submucosa","Gastrectomía total ampliada al esófago abdominal por vía transhiatal"],"explicacion":"Ivor Lewis permite linfadenectomía en dos campos y anastomosis intratorácica para tumores distales; el abordaje en tres campos (McKeown) se prefiere en tumores más altos.","fuente":"Hermes: Esofagectomía"},{"tipo":"Diagnóstico","pregunta":"En el día 6 posoperatorio aparece fiebre, taquicardia y derrame pleural derecho con líquido turbio. ¿Qué sospechás?","opciones":["Fuga de la anastomosis intratorácica","Neumonía aspirativa del lóbulo inferior","Quilotórax por lesión del conducto torácico","Atelectasia del lóbulo inferior con derrame reactivo"],"explicacion":"Fiebre, taquicardia y derrame turbio tras una anastomosis intratorácica son fuga hasta demostrar lo contrario; se confirma con endoscopia o TC con contraste oral.","fuente":"Hermes: Esofagectomía"}]},{"id":"cyc-01","tema":"Glándulas salivales","anio":4,"titulo":"Tumor parotídeo de crecimiento lento","vineta":"Mujer de 45 años con un nódulo de 2,5 cm en la parótida derecha, móvil, indoloro, de 3 años de evolución. Función facial normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué es lo más probable?","opciones":["Adenoma pleomorfo","Carcinoma mucoepidermoide de alto grado","Linfoma","Parotiditis"],"explicacion":"El adenoma pleomorfo es el tumor parotídeo más frecuente: indoloro, de crecimiento lento y sin parálisis facial. Dolor, fijación o parálisis sugieren malignidad.","fuente":"Hermes: Parotidectomía"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Ecografía o resonancia y punción con aguja fina","Biopsia incisional abierta bajo anestesia general","Sialografía y cultivo de saliva","Parotidectomía sin estudios previos"],"explicacion":"La imagen define extensión y lóbulo, y la punción orienta la histología. La biopsia abierta está contraindicada por el riesgo de siembra y de lesión del nervio.","fuente":"Hermes: Parotidectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Parotidectomía superficial preservando el nervio facial","Enucleación del tumor siguiendo la pseudocápsula","Parotidectomía total con sacrificio del tronco del nervio facial","Observación con ecografía anual hasta que duela"],"explicacion":"La enucleación deja restos de la pseudocápsula y tiene alta recurrencia; se reseca con un margen de tejido sano preservando el nervio facial.","fuente":"Hermes: Parotidectomía"},{"tipo":"Técnica","pregunta":"¿Qué reparos usás para encontrar el tronco del nervio facial?","opciones":["Puntero tragal, vientre posterior del digástrico y sutura timpanomastoidea","La arteria facial en el borde de la mandíbula","El conducto de Stensen, disecándolo desde su desembocadura en la mucosa yugal","La vena yugular externa y el músculo esternocleidomastoideo"],"explicacion":"El tronco se busca con varios reparos concordantes: profundo e inferior al puntero tragal, a nivel del vientre posterior del digástrico y por delante de la sutura timpanomastoidea.","fuente":"Hermes: Parotidectomía"},{"tipo":"Diagnóstico","pregunta":"Meses después suda y se enrojece la mejilla al comer. ¿Qué es?","opciones":["Síndrome de Frey (sudoración gustatoria)","Recidiva tumoral en el lecho parotídeo","Fístula salival cutánea persistente","Paresia de la rama cigomática del facial"],"explicacion":"Las fibras parasimpáticas seccionadas regeneran hacia las glándulas sudoríparas de la piel; la toxina botulínica es un tratamiento eficaz.","fuente":"Hermes: Parotidectomía"}]},{"id":"cyc-02","tema":"Glándulas salivales","anio":4,"titulo":"Tumefacción submaxilar al comer","vineta":"Varón de 50 años con episodios de tumefacción dolorosa submaxilar izquierda al comer. Ecografía: cálculo de 8 mm dentro de la glándula submaxilar, con sialoadenitis crónica.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Sialolitiasis submaxilar con sialoadenitis crónica","Tumor submaxilar benigno (adenoma pleomorfo)","Adenopatía metastásica del nivel IB de un primario oral","Quiste branquial del segundo arco infectado"],"explicacion":"El cólico salival con las comidas y un cálculo indican sialolitiasis; la submaxilar es la glándula más afectada por su saliva más viscosa y su conducto ascendente.","fuente":"Hermes: Cirugía submandibular y sublingual"},{"tipo":"Conducta quirúrgica","pregunta":"El cálculo es intraglandular y las crisis se repiten. ¿Qué indicás?","opciones":["Submaxilectomía","Extracción transoral del cálculo","Parotidectomía superficial","Antibióticos de por vida"],"explicacion":"Los cálculos distales del conducto se extraen por vía oral, pero los intraglandulares con sialoadenitis recurrente se tratan con resección de la glándula (o sialendoscopia donde esté disponible).","fuente":"Hermes: Cirugía submandibular y sublingual"},{"tipo":"Técnica","pregunta":"¿Qué nervios debés proteger en la submaxilectomía?","opciones":["Rama marginal del facial, nervio lingual e hipogloso","Nervio laríngeo recurrente, vago y laríngeo superior","Nervio frénico y plexo cervical profundo","Nervio espinal y plexo braquial"],"explicacion":"La incisión se hace 2 a 3 cm debajo de la mandíbula para proteger la rama marginal; en la profundidad, el lingual se separa del ganglio submaxilar y el hipogloso corre bajo la glándula.","fuente":"Hermes: Cirugía submandibular y sublingual; Anatomía quirúrgica del cuello"}]},{"id":"cyc-03","tema":"Cáncer de cavidad oral","anio":4,"titulo":"Úlcera en el borde lingual","vineta":"Varón de 62 años fumador y bebedor con una úlcera indurada de 2 cm en el borde lateral de la lengua de 2 meses. No hay adenopatías palpables. Antes tuvo una placa blanca en la misma zona.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás y cómo lo confirmás?","opciones":["Carcinoma escamoso de lengua; biopsia de la lesión","Úlcera traumática por la prótesis; observar 6 meses","Afta mayor; corticoides tópicos y control","Leucoplasia benigna; alta con control anual"],"explicacion":"Una úlcera indurada persistente en un fumador y bebedor es un carcinoma escamoso hasta demostrar lo contrario. La leucoplasia y sobre todo la eritroplasia son lesiones precancerosas que se biopsian.","fuente":"Hermes: Glosectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Con qué margen resecás el tumor primario?","opciones":["Alrededor de 1 cm de tejido sano","Alrededor de 1 mm de tejido sano","Alrededor de 5 cm de tejido sano","Sin margen: legrado de la úlcera"],"explicacion":"La glosectomía parcial busca márgenes de alrededor de 1 cm, que se acortan en la pieza por retracción; un margen cercano o positivo empeora el control local.","fuente":"Hermes: Glosectomía"},{"tipo":"Conducta quirúrgica","pregunta":"La profundidad de invasión es de 6 mm y el cuello es clínicamente negativo. ¿Qué hacés con el cuello?","opciones":["Vaciamiento cervical electivo (niveles I a III)","Observación del cuello con ecografías seriadas cada 3 meses","Vaciamiento radical clásico bilateral","Radioterapia sola sin cirugía del primario"],"explicacion":"Con profundidad de invasión mayor de 3 a 4 mm el riesgo de metástasis ocultas es alto; en el ensayo de D'Cruz, el vaciamiento electivo mejoró la supervivencia frente a esperar.","fuente":"Ensayo de D'Cruz 2015; Hermes: Vaciamiento ganglionar cervical"}]},{"id":"cyc-04","tema":"Vaciamiento ganglionar cervical","anio":4,"titulo":"Metástasis cervical y hombro caído","vineta":"Varón de 58 años con metástasis de carcinoma escamoso en niveles II y III izquierdos. Se planifica vaciamiento cervical.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué conserva el vaciamiento radical modificado tipo III frente al radical clásico?","opciones":["Espinal accesorio, yugular interna y esternocleidomastoideo","La carótida externa y la glándula submaxilar","Los ganglios de los niveles II y V con su grasa","La glándula tiroides y las paratiroides inferiores del lado operado"],"explicacion":"El radical clásico reseca niveles I a V con el espinal, la yugular interna y el esternocleidomastoideo; el modificado preserva una o más de esas estructuras no linfáticas.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Si después tiene dolor de hombro, escápula alada y no puede abducir por encima de 90°, ¿qué estructura se lesionó?","opciones":["Nervio espinal accesorio","Nervio frénico","Hipogloso","Rama marginal mandibular"],"explicacion":"La lesión del espinal denerva el trapecio y produce el síndrome del hombro doloroso, con caída del hombro y limitación de la abducción.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Al reiniciar la dieta sale líquido lechoso por el drenaje izquierdo. ¿Qué es?","opciones":["Fístula quilosa por lesión del conducto torácico","Fístula salival de la glándula submaxilar por el drenaje","Infección de la herida con pus fluido","Seroma normal del lecho del vaciamiento"],"explicacion":"El conducto torácico termina en el confluente yugulosubclavio izquierdo; su lesión en el nivel IV da salida de quilo con la alimentación.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Medidas generales","pregunta":"¿Cómo la manejás inicialmente si el débito es bajo?","opciones":["Dieta con triglicéridos de cadena media y drenaje","Reexploración inmediata para ligar el conducto torácico","Retirar el drenaje y vendaje compresivo","Dieta rica en grasas para identificar la fuga"],"explicacion":"La mayoría de las fístulas de bajo débito cierran con dieta con triglicéridos de cadena media (que se absorben por vía portal), compresión y drenaje; la reexploración se reserva para alto débito persistente.","fuente":"Hermes: Vaciamiento ganglionar cervical"}]},{"id":"torax-01","tema":"Empiema y decorticación","anio":4,"titulo":"Neumonía con derrame tabicado","vineta":"Varón de 55 años con neumonía de 7 días que sigue febril con antibióticos. Ecografía: derrame pleural derecho moderado con tabiques. Toracocentesis: líquido turbio, pH 7,05, glucosa 30 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Derrame complicado o empiema en fase fibrinopurulenta","Derrame paraneumónico simple en fase exudativa","Trasudado por insuficiencia cardíaca descompensada","Empiema crónico organizado con coraza fibrosa"],"explicacion":"pH menor de 7,2, glucosa baja y tabiques indican derrame complicado en fase fibrinopurulenta; la fase organizada tiene una cáscara pleural que atrapa el pulmón.","fuente":"BTS 2023, enfermedad pleural; Hermes: Empiema pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Tubo de drenaje guiado por imagen, más antibióticos","Cambiar el antibiótico y repetir la ecografía","Toracocentesis evacuadora semanal hasta secar la cavidad pleural","Decorticación abierta como primera opción"],"explicacion":"El pH menor de 7,2 o el pus son indicación de drenaje; los antibióticos solos no resuelven un espacio pleural infectado.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"¿Qué espectro deben cubrir los antibióticos en la infección pleural adquirida en la comunidad?","opciones":["Incluir anaerobios (amoxicilina-clavulánico)","Gramnegativos con un aminoglucósido","Hongos, agregando fluconazol empírico","Atípicos, con un macrólido solo"],"explicacion":"La infección pleural comunitaria es frecuentemente polimicrobiana con anaerobios; BTS indica cubrirlos salvo infección neumocócica demostrada. Los aminoglucósidos no penetran bien la pleura.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"A las 48 horas el tubo drena poco y persiste la colección tabicada. Si no va a cirugía, ¿qué tratamiento intrapleural indicás?","opciones":["Alteplasa más DNasa intrapleurales","Estreptoquinasa intrapleural sola","Antibióticos intrapleurales","Corticoides intrapleurales"],"explicacion":"En MIST-2, la combinación de alteplasa y DNasa mejoró el drenaje y redujo la derivación a cirugía; cada fármaco solo no fue eficaz.","fuente":"Ensayo MIST-2; BTS 2023"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Alteplasa 10 mg y DNasa 5 mg cada 12 horas, 3 días","Alteplasa 100 mg intrapleural en dosis única","DNasa 50 mg intrapleural por día durante un mes completo","Alteplasa 1 mg intrapleural una vez por semana"],"explicacion":"El esquema de MIST-2 es alteplasa 10 mg y DNasa 5 mg por el tubo, dos veces por día durante 3 días (6 dosis), clampeando el tubo 1 hora.","fuente":"Ensayo MIST-2"},{"tipo":"Conducta quirúrgica","pregunta":"Si el pulmón quedara atrapado por una coraza fibrosa con sepsis persistente, ¿qué indicás?","opciones":["Decorticación por videotoracoscopia (o abierta)","Mantener el tubo y agregar más días de antibiótico","Neumonectomía derecha reglada","Pleurodesis con talco por el tubo"],"explicacion":"La decorticación remueve la coraza para que el pulmón reexpanda y se controle la infección; se prefiere por videotoracoscopia cuando es posible.","fuente":"Hermes: Empiema pleural"}]},{"id":"torax-02","tema":"Cáncer de pulmón","anio":4,"titulo":"Nódulo pulmonar que creció","vineta":"Mujer de 66 años, exfumadora. Nódulo sólido de 1,8 cm periférico en el lóbulo superior derecho que creció en 6 meses. PET-TC: captación en el nódulo, sin ganglios ni metástasis.","pasos":[{"tipo":"Estudios","pregunta":"Si en la TC o el PET hubiera ganglios mediastinales sospechosos, ¿cómo los estadificarías?","opciones":["EBUS con punción o mediastinoscopia","Con la TC de tórax con contraste","Resonancia de tórax con gadolinio","Operar y evaluarlos en la pieza"],"explicacion":"Los ganglios mediastinales sospechosos deben confirmarse con muestra de tejido antes de decidir la cirugía, porque el N2 cambia el tratamiento.","fuente":"Hermes: Cáncer de pulmón; Estadificación TNM del cáncer torácico"},{"tipo":"Estudios","pregunta":"¿Qué evaluación funcional pedís antes de resecar?","opciones":["Espirometría y DLCO con predichos posoperatorios","Radiografía de tórax y gasometría arterial en reposo","Electrocardiograma y ecocardiograma","Prueba de caminata de 6 minutos aislada"],"explicacion":"El VEF1 y la DLCO predichos posoperatorios estiman el riesgo; si ambos superan el 60 % el riesgo es bajo, y si no se agrega una prueba de esfuerzo.","fuente":"ERS/ESTS 2009, evaluación funcional; Hermes: Evaluación fisiológica para resección pulmonar"},{"tipo":"Estudios","pregunta":"Con valores predichos bajos, ¿qué consumo máximo de oxígeno contraindica una resección mayor?","opciones":["Menor de 10 ml/kg/min","Menor de 40 ml/kg/min","Mayor de 20 ml/kg/min","Menor de 30 ml/kg/min"],"explicacion":"Un consumo máximo de oxígeno menor de 10 ml/kg/min indica riesgo muy alto para resecciones mayores; mayor de 20 indica riesgo bajo.","fuente":"ERS/ESTS 2009, evaluación funcional"},{"tipo":"Conducta quirúrgica","pregunta":"Función adecuada y diagnóstico de adenocarcinoma periférico de 1,8 cm, N0. ¿Qué resección es aceptable además de la lobectomía?","opciones":["Segmentectomía anatómica con estudio ganglionar","Resección en cuña sin estudio ganglionar asociado","Bilobectomía superior y media","Radioterapia estereotáctica sin cirugía"],"explicacion":"En tumores periféricos de 2 cm o menos y N0, los ensayos JCOG0802 y CALGB 140503 mostraron resultados oncológicos no inferiores con resección sublobar frente a lobectomía.","fuente":"Ensayos JCOG0802 y CALGB 140503"},{"tipo":"Técnica","pregunta":"¿Qué hacés siempre con los ganglios durante la resección?","opciones":["Muestreo o disección ganglionar mediastinal sistemática","No los evalúo porque el PET fue negativo","Reseco solo los ganglios hiliares que se ven aumentados","Vaciamiento cervical y supraclavicular"],"explicacion":"El PET puede no detectar metástasis ganglionares; la evaluación ganglionar sistemática estadifica y define la adyuvancia.","fuente":"Hermes: Resección pulmonar anatómica"}]},{"id":"higado-01","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Lesión hepática en una mujer que toma anticonceptivos","vineta":"Mujer de 32 años que toma anticonceptivos orales hace 10 años. Resonancia: lesión de 6 cm en el segmento VI compatible con adenoma hepatocelular. Asintomática.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero?","opciones":["Suspender los anticonceptivos y bajar de peso si corresponde","Seguir con los anticonceptivos y repetir la resonancia en 6 meses","Cambiar a un anticonceptivo de mayor dosis","Resección inmediata sin suspender las hormonas"],"explicacion":"Los adenomas dependen de estrógenos; suspender los anticonceptivos puede reducirlos.","fuente":"Hermes: Tumores benignos del hígado"},{"tipo":"Conducta quirúrgica","pregunta":"A los 6 meses sigue midiendo más de 5 cm. ¿Qué hacés?","opciones":["Resección hepática","Observación indefinida","Trasplante","Ablación de rutina"],"explicacion":"Los adenomas que persisten mayores de 5 cm tras suspender los estrógenos tienen riesgo de sangrado y transformación maligna y se resecan; en el varón se resecan siempre.","fuente":"Hermes: Tumores benignos del hígado"},{"tipo":"Diagnóstico","pregunta":"En comparación, ¿qué conducta tiene un hemangioma típico asintomático de 6 cm?","opciones":["No necesita tratamiento ni seguimiento","Resección por el tamaño mayor de 5 cm","Embolización arterial preventiva","Biopsia percutánea para confirmar"],"explicacion":"El hemangioma típico asintomático no requiere tratamiento, independientemente del tamaño; la biopsia está contraindicada por riesgo de sangrado.","fuente":"Hermes: Tumores benignos del hígado"}]},{"id":"higado-02","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Nódulo en un cirrótico","vineta":"Varón de 58 años con cirrosis por hepatitis C tratada, Child-Pugh A, sin várices ni plaquetas bajas. En la vigilancia aparece un nódulo único de 3,5 cm en el segmento VI con realce arterial y lavado portal. AFP 120 ng/ml. Buen estado general.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo se confirma el diagnóstico?","opciones":["Con la imagen típica, sin biopsia","Con biopsia percutánea del nódulo","Con la AFP mayor de 100 ng/ml","Con laparoscopia y biopsia"],"explicacion":"En el hígado cirrótico, un nódulo de 1 cm o más con realce arterial y lavado es diagnóstico de carcinoma hepatocelular sin biopsia.","fuente":"Hermes: Carcinoma hepatocelular"},{"tipo":"Conducta quirúrgica","pregunta":"Nódulo único, función preservada y sin hipertensión portal. ¿Qué tratamiento indicás?","opciones":["Resección hepática (BCLC A)","Sorafenib (BCLC C)","Cuidados paliativos (BCLC D)","Quimioembolización (BCLC B)"],"explicacion":"En BCLC, el tumor único con función preservada y sin hipertensión portal clínicamente significativa es candidato ideal a resección; la ablación es alternativa en tumores pequeños.","fuente":"BCLC 2022; Hermes: Carcinoma hepatocelular"},{"tipo":"Medidas generales","pregunta":"¿Qué remanente hepático mínimo necesitás en un hígado cirrótico?","opciones":["Alrededor del 40 %","5 %","20 % igual que en hígado sano","10 %"],"explicacion":"El remanente mínimo es cercano al 20 % en hígado sano, 30 % en hígado dañado por quimioterapia y 40 % en cirrosis.","fuente":"Hermes: Evaluación y principios de la hepatectomía"},{"tipo":"Conducta quirúrgica","pregunta":"Si tuviera hipertensión portal, ¿qué criterios usarías para indicar un trasplante?","opciones":["Milán: 1 nódulo de hasta 5 cm o hasta 3 de hasta 3 cm","Hasta 5 nódulos de hasta 5 cm, con invasión portal permitida","Tumor único mayor de 10 cm sin otros nódulos","Invasión portal segmentaria sin metástasis"],"explicacion":"Los criterios de Milán seleccionan pacientes con resultados de trasplante similares a los de cirróticos sin tumor.","fuente":"Criterios de Milán; Hermes: Carcinoma hepatocelular"}]},{"id":"higado-03","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Metástasis hepáticas de cáncer de colon","vineta":"Mujer de 60 años operada de un cáncer de sigma hace 1 año. TC: tres metástasis en el hígado derecho, sin enfermedad extrahepática. Hígado izquierdo libre.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué define si son resecables?","opciones":["Resecar toda la enfermedad con margen y un remanente suficiente","Que sean menos de 4 metástasis y que cada una mida menos de 5 cm","Que la mayor mida menos de 5 cm de diámetro","Que estén en un solo lóbulo, sin cruzar la línea de Cantlie"],"explicacion":"El criterio actual no es el número ni el tamaño sino la posibilidad de una resección R0 con un remanente funcional suficiente, con flujo y drenaje biliar.","fuente":"Hermes: Metástasis hepáticas"},{"tipo":"Medidas generales","pregunta":"El remanente estimado es del 18 % en hígado sano. ¿Qué podés hacer para operarla?","opciones":["Embolización portal derecha para hipertrofiar el remanente","Operar igual, porque el hígado es sano y regenera","Descartar la cirugía y seguir solo con quimioterapia sistémica","Radioterapia hepática total como alternativa curativa"],"explicacion":"La embolización portal del lado a resecar hipertrofia el remanente en algunas semanas; si no crece lo suficiente, se replantea la estrategia.","fuente":"Hermes: Evaluación y principios de la hepatectomía"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento sistémico perioperatorio mostró beneficio en supervivencia libre de progresión?","opciones":["FOLFOX perioperatorio","Cirugía sin quimioterapia","Tamoxifeno adyuvante","Gemcitabina sola"],"explicacion":"En el ensayo EORTC 40983, 6 ciclos de FOLFOX antes y 6 después de la resección mejoraron la supervivencia libre de progresión.","fuente":"Ensayo EORTC 40983"}]},{"id":"hidatid-01","tema":"Quiste hidatídico hepático","anio":4,"titulo":"Quiste hepático en un trabajador rural","vineta":"Varón de 40 años de zona rural con perros. Dolor en hipocondrio derecho. Ecografía: quiste de 9 cm en el segmento VII con membranas desprendidas flotando (signo del camalote). Serología positiva.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué estadio de la OMS tiene?","opciones":["CE3a (membrana desprendida)","CE1 (unilocular, pared visible)","CE4 (contenido heterogéneo)","CE5 (pared calcificada)"],"explicacion":"La membrana desprendida dentro del quiste (camalote) define CE3a; CE1 es unilocular con pared visible, CE2 multivesicular, y CE4-CE5 son inactivos y calcificados.","fuente":"WHO-IWGE 2010; Hermes: Equinococosis hepática"},{"tipo":"Fármaco","pregunta":"¿Qué antiparasitario indicás alrededor de la cirugía o la punción?","opciones":["Albendazol","Metronidazol","Ivermectina","Nitazoxanida"],"explicacion":"El albendazol perioperatorio reduce el riesgo de hidatidosis secundaria por derrame de escólices.","fuente":"WHO-IWGE 2010; Hermes: Equinococosis hepática"},{"tipo":"Dosis","pregunta":"¿Con qué dosis?","opciones":["10 a 15 mg/kg/día en dos tomas con comida grasa","1 g en dosis única el día de la cirugía","50 mg/kg/día en cuatro tomas en ayunas","400 mg una vez por semana durante 6 meses seguidos"],"explicacion":"La dosis es de 10 a 15 mg/kg/día divididos en dos tomas, con comidas ricas en grasas para mejorar la absorción. Se controlan las enzimas hepáticas y el hemograma.","fuente":"WHO-IWGE 2010"},{"tipo":"Técnica","pregunta":"En la cirugía, ¿qué hacés antes de abrir el quiste?","opciones":["Aislar el campo con compresas con escolicida y aspirar","Abrirlo directamente y vaciar las membranas con la mano","Inyectar formol al 10 % en la cavidad sin aspirar","Puncionarlo sin proteger el campo para ganar tiempo"],"explicacion":"Se aísla el campo con compresas embebidas en escolicida para evitar la siembra peritoneal y la anafilaxia. No se inyecta escolicida si hay comunicación biliar, porque puede producir colangitis esclerosante.","fuente":"Hermes: Equinococosis hepática"},{"tipo":"Diagnóstico","pregunta":"Al vaciar la cavidad aparece bilis. ¿Qué significa y qué hacés?","opciones":["Fístula quistobiliar: suturarla y evaluar la vía biliar","Es un hallazgo esperable en los quistes grandes; cerrar la cavidad","Hepatectomía derecha mayor en el mismo acto","Ligadura del colédoco y hepaticoyeyunostomía"],"explicacion":"Las fístulas quistobiliares son frecuentes; se identifican y suturan, y si hay material hidatídico en la vía biliar se la explora o se drena por CPRE.","fuente":"Hermes: Equinococosis hepática"}]},{"id":"biliar-ca-01","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Hallazgo de cáncer después de una colecistectomía","vineta":"Mujer de 64 años operada de colecistectomía laparoscópica por litiasis. La anatomía patológica informa adenocarcinoma que invade la capa muscular (pT1b), con margen cístico negativo.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué hacés primero?","opciones":["Estadificar con TC o resonancia de tórax y abdomen","Alta sin estudios, porque el margen cístico fue negativo","Quimioterapia adyuvante sin estudios previos","Reoperar de inmediato sin estudios de extensión"],"explicacion":"Antes de reoperar se busca enfermedad residual o metastásica que contraindique la re-resección.","fuente":"Hermes: Cáncer de vesícula biliar"},{"tipo":"Conducta quirúrgica","pregunta":"Sin metástasis, ¿qué indicás?","opciones":["Re-resección del lecho (IVb y V) con linfadenectomía","Seguimiento: la colecistectomía con margen negativo alcanza","Hepatectomía derecha ampliada de rutina con resección biliar","Radioterapia del lecho sin cirugía"],"explicacion":"En T1a con margen negativo alcanza la colecistectomía; desde T1b se indica re-resección del lecho y linfadenectomía porque hay riesgo de enfermedad residual.","fuente":"Hermes: Cáncer de vesícula biliar; Vaciamiento ganglionar en el cáncer de vesícula"},{"tipo":"Fármaco","pregunta":"Tras la resección, ¿qué adyuvancia se recomienda en el cáncer de vías biliares y vesícula?","opciones":["Capecitabina durante 6 meses","Seguimiento sin adyuvancia","Tamoxifeno por 5 años","Imatinib durante un año"],"explicacion":"Tras el ensayo BILCAP, ASCO 2019 recomienda capecitabina adyuvante por 6 meses en el cáncer biliar resecado.","fuente":"Ensayo BILCAP; ASCO 2019, cáncer biliar"},{"tipo":"Dosis","pregunta":"¿Con qué esquema se administró en BILCAP?","opciones":["1250 mg/m² cada 12 h, días 1 a 14 cada 21 días, 8 ciclos","500 mg por día en forma continua durante 2 años","1250 mg/m² en dosis única mensual durante un año","100 mg/m² IV una vez por semana, 12 semanas"],"explicacion":"BILCAP usó capecitabina 1250 mg/m² dos veces por día los días 1 a 14 cada 3 semanas, durante 8 ciclos (24 semanas).","fuente":"Ensayo BILCAP"}]},{"id":"biliar-ca-02","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Ictericia indolora y vesícula pequeña","vineta":"Varón de 68 años con ictericia indolora y prurito, bilirrubina 14 mg/dl. Ecografía: vía biliar intrahepática dilatada en ambos lóbulos, colédoco normal y vesícula colapsada. Colangiorresonancia: estenosis de la confluencia que se extiende a ambos hepáticos.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Colangiocarcinoma perihiliar (Klatskin)","Adenocarcinoma de cabeza de páncreas","Coledocolitiasis con síndrome de Mirizzi","Hepatitis viral aguda colestásica"],"explicacion":"Vía intrahepática dilatada con colédoco y vesícula no dilatados ubica la obstrucción en el hilio; una estenosis de la confluencia en un adulto mayor con ictericia indolora es un Klatskin hasta demostrar lo contrario.","fuente":"Hermes: Cáncer de la vía biliar principal"},{"tipo":"Diagnóstico","pregunta":"Si compromete la confluencia y llega a las ramas de segundo orden derechas, ¿qué tipo de Bismuth-Corlette es?","opciones":["IIIa","IIIb","II","IV"],"explicacion":"Tipo I: debajo de la confluencia; II: compromete la confluencia; IIIa y IIIb: llegan a las ramas de segundo orden derechas o izquierdas; IV: ambas.","fuente":"Hermes: Cáncer de la vía biliar principal"},{"tipo":"Conducta quirúrgica","pregunta":"Es resecable. ¿Qué cirugía corresponde?","opciones":["Hepatectomía derecha ampliada con caudado y vía biliar","Resección de la vía biliar sola con hepaticoyeyunostomía","Prótesis biliar como tratamiento definitivo","Duodenopancreatectomía cefálica con linfadenectomía"],"explicacion":"En el tipo IIIa se reseca la vía con el hígado derecho y el caudado (por sus conductos que drenan en la confluencia), con reconstrucción biliodigestiva.","fuente":"Hermes: Cáncer de la vía biliar principal; Hepatectomía derecha ampliada al segmento IV"},{"tipo":"Medidas generales","pregunta":"Antes de una hepatectomía mayor con bilirrubina de 14, ¿qué hacés con la vía biliar?","opciones":["Drenar el lado del futuro remanente","Drenar el lado que se va a resecar primero","No drenar y operar con la bilirrubina alta","Esperar que la bilirrubina baje sola"],"explicacion":"La ictericia empeora la regeneración del remanente; en el perihiliar se drena el lóbulo que va a quedar antes de una hepatectomía mayor.","fuente":"Hermes: Cáncer de la vía biliar principal"}]},{"id":"pancreas-ca-01","tema":"Cáncer de páncreas","anio":4,"titulo":"Ictericia indolora con vesícula palpable","vineta":"Varón de 66 años con ictericia indolora, pérdida de peso y vesícula palpable. Bilirrubina 9 mg/dl, CA 19-9 elevado. TC con protocolo pancreático: tumor de 2,5 cm en la cabeza con contacto con la vena mesentérica superior menor de 180°, sin contacto arterial ni metástasis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué significa la vesícula palpable con ictericia indolora?","opciones":["Obstrucción maligna distal (Courvoisier-Terrier)","Colecistitis aguda alitiásica por la ictericia","Coledocolitiasis con vesícula hidrópica","Hepatitis colestásica con hepatomegalia"],"explicacion":"La obstrucción lenta y progresiva distal al cístico distiende una vesícula sana; la litiasis suele dar vesícula escleroatrófica.","fuente":"Hermes: Adenocarcinoma ductal de páncreas"},{"tipo":"Diagnóstico","pregunta":"¿Cómo lo clasificás según resecabilidad?","opciones":["Resecable","Irresecable localmente avanzado","Metastásico","Limítrofe arterial"],"explicacion":"Según NCCN, sin contacto arterial y con contacto venoso de 180° o menos sin irregularidad de la vena es resecable; el contacto arterial define limítrofe o localmente avanzado.","fuente":"Hermes: Adenocarcinoma ductal de páncreas; Riesgo vascular en DPC"},{"tipo":"Medidas generales","pregunta":"¿Drenás la vía biliar antes de operar?","opciones":["No de rutina; solo si hay colangitis o se retrasará la cirugía","Sí, con prótesis plástica por CPRE antes de operar","Sí, con colecistostomía percutánea por 4 semanas","No, aunque tenga colangitis, para no demorar la cirugía"],"explicacion":"En el ensayo DROP, el drenaje preoperatorio de rutina aumentó las complicaciones frente a la cirugía temprana; se reserva para indicaciones específicas.","fuente":"Ensayo DROP (van der Gaag 2010)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Duodenopancreatectomía cefálica","Pancreatectomía distal","Derivación biliodigestiva paliativa","Enucleación"],"explicacion":"El adenocarcinoma de la cabeza resecable se trata con duodenopancreatectomía cefálica con linfadenectomía estándar.","fuente":"Hermes: Duodenopancreatectomía cefálica"},{"tipo":"Fármaco","pregunta":"Se recupera bien y tiene buen estado general. ¿Qué adyuvancia indicás?","opciones":["mFOLFIRINOX durante 6 meses","Seguimiento sin adyuvancia","Radioterapia sola del lecho","Tamoxifeno durante 5 años"],"explicacion":"En PRODIGE 24, mFOLFIRINOX adyuvante por 6 meses (12 ciclos) aumentó la supervivencia frente a gemcitabina en pacientes con buen estado funcional.","fuente":"Ensayo PRODIGE 24"}]},{"id":"pancreas-ca-02","tema":"Cáncer de páncreas","anio":4,"titulo":"Drenaje con amilasa alta después de un Whipple","vineta":"Varón de 62 años en el día 3 de una duodenopancreatectomía. El drenaje peripancreático aporta 150 ml/día con amilasa 5 veces mayor que el límite superior normal de la sérica. Afebril, buen estado, tolera dieta.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás?","opciones":["Fuga bioquímica, sin repercusión clínica","Fístula grado C (con falla orgánica)","Fístula grado B (cambia el manejo)","No es fístula: es un débito normal"],"explicacion":"ISGPS 2016 define fístula como amilasa en el drenaje mayor de 3 veces el límite superior normal sérico desde el día 3; si no cambia el manejo es una fuga bioquímica, y pasa a grado B o C según repercusión e intervenciones.","fuente":"ISGPS 2016, fístula pancreática"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés?","opciones":["Mantener el drenaje y retirarlo cuando baje, con dieta oral","Relaparotomía para revisar la anastomosis","Completar la pancreatectomía para evitar la fístula","Ayuno, nutrición parenteral y octreótido subcutáneo por 7 días"],"explicacion":"La fuga bioquímica no requiere cambios de conducta; se retira el drenaje cuando el débito disminuye.","fuente":"ISGPS 2016, fístula pancreática"},{"tipo":"Diagnóstico","pregunta":"En el día 10 aparece sangre por el drenaje y hematemesis leve, autolimitadas, con fístula conocida. ¿Qué sospechás?","opciones":["Sangrado centinela por pseudoaneurisma","Gastritis por estrés sin importancia","Úlcera de la anastomosis gastroyeyunal","Coagulopatía por déficit de vitamina K"],"explicacion":"Un sangrado menor tardío en un paciente con fístula suele anunciar la rotura de un pseudoaneurisma; se pide angio-TC urgente y se trata con angiografía y embolización o stent.","fuente":"Hermes: Duodenopancreatectomía cefálica"}]},{"id":"pancreas-ca-03","tema":"Cáncer de páncreas","anio":4,"titulo":"Cáncer de páncreas metastásico con ictericia y vómitos","vineta":"Mujer de 72 años con adenocarcinoma de cabeza de páncreas y metástasis hepáticas. Ictericia con prurito y, en las últimas semanas, vómitos por obstrucción duodenal. Expectativa de vida estimada de meses.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo tratás la ictericia?","opciones":["Prótesis biliar metálica por vía endoscópica","Duodenopancreatectomía paliativa","Colecistostomía percutánea definitiva","Prótesis plástica por CPRE con recambio cada 3 meses"],"explicacion":"En la paliación, la prótesis metálica por CPRE alivia la ictericia con menos morbilidad que la derivación quirúrgica y dura más que la plástica.","fuente":"Hermes: Paliación del cáncer de páncreas; Paliación de las neoplasias biliopancreáticas"},{"tipo":"Conducta quirúrgica","pregunta":"¿Y la obstrucción duodenal?","opciones":["Prótesis duodenal o gastroyeyunostomía, según expectativa de vida","Sonda nasogástrica permanente con aspiración","Gastrectomía total paliativa con Y de Roux","Yeyunostomía de alimentación sin descomprimir el estómago"],"explicacion":"Con expectativa corta suele preferirse la prótesis duodenal; con expectativa mayor, la gastroyeyunostomía da una paliación más duradera.","fuente":"Hermes: Paliación del cáncer de páncreas"},{"tipo":"Medidas generales","pregunta":"Tiene dolor epigástrico irradiado al dorso que no cede con opioides. ¿Qué podés ofrecer?","opciones":["Neurólisis del plexo celíaco","Duplicar la dosis de opioides","Pancreatectomía paliativa","Radioterapia hepática"],"explicacion":"La neurólisis celíaca, guiada por ecoendoscopia o percutánea, mejora el dolor y reduce el consumo de opioides, dentro de un abordaje de cuidados paliativos.","fuente":"Hermes: Paliación del cáncer de páncreas; Cuidados paliativos en cirugía"}]},{"id":"biliar-01","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Dolor posprandial en hipocondrio derecho","vineta":"Mujer de 38 años. Dolor epigástrico y en hipocondrio derecho de 3 horas, iniciado después de una cena abundante, con náuseas. Afebril. Dolor leve en hipocondrio derecho, Murphy negativo. Leucocitos 8.200/mm³; hepatograma y lipasa normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Cólico biliar no complicado","Colecistitis aguda grado I (leve)","Coledocolitiasis sin colangitis","Pancreatitis aguda biliar leve"],"explicacion":"Dolor de pocas horas sin fiebre, sin Murphy y con laboratorio normal es dolor biliar no complicado. La colecistitis exige signos locales (Murphy, masa) más signos sistémicos (fiebre, leucocitosis, PCR) e imagen compatible; un hepatograma normal hace improbable la coledocolitiasis y la lipasa normal descarta pancreatitis.","fuente":"Hermes: Colelitiasis y cólico biliar; criterios diagnósticos TG18"},{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía abdominal","TC de abdomen con contraste","Colangiorresonancia","CPRE"],"explicacion":"La ecografía es el estudio inicial: muestra los cálculos o el barro y busca pared engrosada, líquido, Murphy ecográfico y dilatación de la vía biliar. Colangiorresonancia y CPRE se reservan para sospecha de vía biliar; la TC, para complicaciones o diagnósticos alternativos.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Fármaco","pregunta":"¿Qué analgésico indicás como primera línea?","opciones":["AINE (ketorolac)","Antiespasmódico solo (butilescopolamina)","Antibiótico (ceftriaxona)","Omeprazol solo, sin analgésico"],"explicacion":"Los AINE alivian el cólico biliar más que el placebo y que los antiespasmódicos, y redujeron las complicaciones a corto plazo (colecistitis, pancreatitis, ictericia). Los opioides dan un alivio similar y quedan para dolor refractario o contraindicación de AINE. Sin infección no hay indicación de antibiótico.","fuente":"Cochrane 2016, AINE en cólico biliar (Fraquelli, CD006390)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de ketorolac indicás en esta paciente de 38 años con función renal normal?","opciones":["30 mg IV en dosis única","10 mg IV cada 4 horas","60 mg IV cada 6 horas","120 mg IV en dosis única"],"explicacion":"La dosis IV única en adultos menores de 65 años es 30 mg; se reduce a 15 mg en mayores de 65 años, peso menor de 50 kg o insuficiencia renal. El máximo diario es 120 mg y no debe superarse con dosis de 60 mg IV repetidas ni en un solo bolo.","fuente":"Ficha técnica de ketorolac trometamina (FDA)"},{"tipo":"Medidas generales","pregunta":"Cede el dolor. ¿Qué indicás al alta?","opciones":["Alta con analgesia y pautas de alarma: fiebre, ictericia o dolor persistente","Internación y colecistectomía de urgencia dentro de las 24 horas, aunque haya cedido el dolor","Ácido ursodesoxicólico para disolver los cálculos y evitar la cirugía","Ayuno e hidratación intravenosa hasta la cirugía programada"],"explicacion":"El cólico no complicado se maneja en forma ambulatoria. Fiebre, ictericia, hipotensión o dolor persistente sugieren una complicación y obligan a consultar. La disolución farmacológica tiene utilidad excepcional y no reemplaza la cirugía.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es el tratamiento definitivo?","opciones":["Colecistectomía laparoscópica electiva","Observación: es una litiasis asintomática","Colecistectomía abierta de urgencia","CPRE con esfinterotomía"],"explicacion":"El dolor biliar típico indica colecistectomía laparoscópica programada. Solo la litiasis verdaderamente asintomática se observa; no hay indicación de urgencia ni de CPRE sin compromiso de la vía biliar.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Técnica","pregunta":"En la colecistectomía, ¿qué condición tenés que cumplir antes de clipar y seccionar?","opciones":["Obtener la visión crítica de seguridad de Strasberg","Identificar el cístico por la forma de embudo del infundíbulo","Seccionar la primera estructura tubular que llega a la vesícula","Disecar primero la vía biliar principal para localizarla"],"explicacion":"La visión crítica exige triángulo hepatocístico limpio de grasa, tercio inferior de la vesícula separado del lecho y solo dos estructuras entrando a la vesícula. El \"signo del embudo\" es la ilusión que explica la mayoría de las lesiones biliares; disecar la vía principal aumenta el riesgo de lesionarla.","fuente":"Guía multisocietaria de colecistectomía segura 2020; Hermes: Técnica de colecistectomía laparoscópica"}]},{"id":"biliar-02","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Fiebre y Murphy positivo de 30 horas","vineta":"Varón de 52 años, sin comorbilidades. Dolor en hipocondrio derecho de 30 horas, temperatura 38,1 °C, Murphy positivo, sin masa palpable. Leucocitos 13.500/mm³, PCR elevada, bilirrubina normal. Ecografía: cálculo impactado en el bacinete, pared de 5 mm, escaso líquido perivesicular.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad?","opciones":["Colecistitis aguda grado I (leve)","Colecistitis aguda grado II (moderada)","Colecistitis aguda grado III (grave)","Cólico biliar no complicado por litiasis"],"explicacion":"Cumple signos locales, sistémicos e imagen. No tiene criterios de grado II (leucocitos > 18.000, masa palpable, más de 72 horas o inflamación local marcada) ni disfunción orgánica (grado III), así que es grado I.","fuente":"TG18, criterios diagnósticos y de gravedad; Hermes: Colecistitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Cefazolina","Ampicilina-sulbactam","Ciprofloxacina","Meropenem empírico"],"explicacion":"TG18 propone para el grado I comunitario cefalosporinas como cefazolina. Ampicilina-sulbactam no se recomienda si la resistencia local de E. coli supera el 20 %. Las quinolonas se usan solo con sensibilidad conocida o alergia a betalactámicos, y los carbapenémicos se reservan.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Cefazolina 2 g IV cada 8 horas","Cefazolina 1 g IV cada 24 horas","Cefazolina 500 mg VO cada 6 horas","Cefazolina 4 g IV cada 6 horas por 7 días"],"explicacion":"La dosis IV para adultos es 1 a 2 g cada 8 horas. Cada 24 horas no alcanza niveles útiles por su vida media corta; no se administra por vía oral y 4 g cada 6 horas excede la dosis recomendada.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo operás?","opciones":["Colecistectomía laparoscópica temprana en esta internación","Antibióticos y colecistectomía diferida a las 6 a 8 semanas","Colecistostomía percutánea y antibióticos hasta que se resuelva","Tratamiento médico con antibióticos, sin cirugía posterior programada"],"explicacion":"WSES 2020 recomienda colecistectomía laparoscópica temprana, dentro de los 7 días del ingreso y 10 del inicio de síntomas. La estrategia diferida aumenta la morbilidad acumulada y la estancia. La colecistostomía es para fisiología prohibitiva.","fuente":"WSES 2020; Hermes: Colecistitis aguda"},{"tipo":"Medidas generales","pregunta":"Operado sin complicaciones, ¿cuánto dura el antibiótico?","opciones":["Se suspende dentro de las 24 horas de la colecistectomía","Se completan 7 días desde el inicio del tratamiento","Se completan 14 días, pasando a vía oral después del alta","Se mantiene de 4 a 7 días después de la cirugía"],"explicacion":"En los grados I y II, TG18 indica suspender el antibiótico dentro de las 24 horas de la colecistectomía. Los 4 a 7 días tras controlar el foco corresponden a la colangitis y a la colecistitis grado III.","fuente":"TG18 antimicrobianos, duración (Gomi 2018)"},{"tipo":"Técnica","pregunta":"El triángulo hepatocístico está bloqueado por la inflamación y no lográs la visión crítica. ¿Qué hacés?","opciones":["Colecistec
