tomía subtotal u otra técnica de rescate, sin seguir disecando a ciegas","Clipar la estructura más evidente y continuar con la disección","Seccionar el infundíbulo y considerar cístico lo que sale de él","Insistir en la disección del triángulo hasta encontrar el cístico, aunque lleve más tiempo"],"explicacion":"Sin visión crítica no se corta. Las alternativas son colecistectomía subtotal, fondo primero, conversión, colecistostomía o pedir ayuda. La guía multisocietaria favorece la subtotal sobre la total por fondo primero cuando la anatomía no puede definirse.","fuente":"Guía multisocietaria de colecistectomía segura 2020; Hermes: Colecistectomía subtotal"}]},{"id":"biliar-03","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Cuatro días de dolor y masa palpable","vineta":"Mujer de 67 años, hipertensa controlada, sin alergias. Dolor en hipocondrio derecho de 96 horas, temperatura 38,6 °C y masa dolorosa palpable. Leucocitos 19.800/mm³. Presión, creatinina y plaquetas normales. Ecografía: pared de 8 mm, líquido perivesicular y cálculo en el bacinete.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado de Tokio tiene?","opciones":["Grado II (moderado)","Grado I (leve)","Grado III (grave)","No cumple criterios de colecistitis"],"explicacion":"Tiene criterios de grado II: leucocitos mayores de 18.000, masa palpable y más de 72 horas de evolución. No hay disfunción cardiovascular, renal, respiratoria, neurológica, hepática ni hematológica, que definirían el grado III.","fuente":"TG18, gravedad de la colecistitis; Hermes: Colecistitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Ceftriaxona","Cefazolina IV","Ampicilina-sulbactam","Ciprofloxacina"],"explicacion":"TG18 propone para el grado II cefalosporinas de tercera generación como ceftriaxona. La cefazolina figura para el grado I; ampicilina-sulbactam no se recomienda con resistencia de E. coli mayor del 20 %; la quinolona solo con sensibilidad conocida o alergia. El metronidazol se agrega únicamente si hay anastomosis biliodigestiva.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Ceftriaxona 2 g IV cada 24 horas","Ceftriaxona 500 mg IM en dosis única","Ceftriaxona 2 g IV cada 6 horas por 10 días","Ceftriaxona 250 mg VO cada 12 horas"],"explicacion":"La dosis IV para adultos es de 1 a 2 g cada 12 a 24 horas; 2 g cada 24 horas es un esquema habitual. Una dosis única IM es la de gonococia, cada 6 horas es sobredosis y no existe la vía oral.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"Paciente operable y centro con experiencia. ¿Qué indicás?","opciones":["Colecistectomía laparoscópica temprana en esta internación","Antibióticos, alta y colecistectomía diferida a las 6 semanas","Colecistostomía percutánea y colecistectomía diferida","Colecistectomía abierta, porque ya pasaron más de 72 horas"],"explicacion":"Superar las 72 horas no contraindica la cirugía. En un ensayo con pacientes de más de 72 horas, operar en la internación redujo la morbilidad acumulada (14 % frente a 39 %) y la estancia. La colecistostomía es para quien no tolera la cirugía.","fuente":"WSES 2020; ensayo de Roulin; Hermes: Colecistitis aguda"},{"tipo":"Estudios","pregunta":"¿Qué muestra tomás en la cirugía?","opciones":["Cultivo de la bilis vesicular","No tomo cultivos: no cambian la conducta","Biopsia hepática en cuña del lecho","Cultivo solo si encontrás pus franco"],"explicacion":"TG18 recomienda cultivar la bilis vesicular en toda colecistitis excepto el grado I, para dirigir el tratamiento si la evolución no es la esperada.","fuente":"TG18 antimicrobianos, recomendación 1C (Gomi 2018)"}]},{"id":"biliar-04","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Colecistitis con shock en un paciente frágil","vineta":"Varón de 84 años con insuficiencia cardíaca (fracción de eyección 25 %) y EPOC con oxígeno domiciliario, ASA IV. Tres días de dolor en hipocondrio derecho, temperatura 38,9 °C, presión 85/50 mmHg que requiere noradrenalina tras la reanimación, creatinina 2,4 mg/dl. Ecografía: colecistitis litiásica con pared de 9 mm.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado de Tokio tiene?","opciones":["Grado III (grave)","Grado II (moderado)","Grado I (leve) de Tokio","Colangitis aguda grado III"],"explicacion":"La necesidad de vasopresores (disfunción cardiovascular) y la creatinina mayor de 2 mg/dl (disfunción renal) definen el grado III. No hay ictericia ni dilatación biliar que sugieran colangitis.","fuente":"TG18, gravedad de la colecistitis"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico empírico indicás?","opciones":["Piperacilina-tazobactam más vancomicina","Ceftriaxona sola","Cefazolina en monoterapia","Ampicilina-sulbactam en monoterapia"],"explicacion":"Para el grado III, TG18 propone piperacilina-tazobactam, cefepime o carbapenémicos, y agrega vancomicina para cubrir Enterococcus en la infección comunitaria grave. Ceftriaxona y cefazolina corresponden a grados menores.","fuente":"TG18 antimicrobianos, tabla 3 y nota a (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de piperacilina-tazobactam indicás?","opciones":["4,5 g IV cada 6 horas","4,5 g IV cada 24 horas","2,25 g VO cada 12 horas","1 g IV cada 8 horas por 3 días"],"explicacion":"La dosis estándar es 3,375 g cada 6 horas y se aumenta a 4,5 g cada 6 horas cuando se busca cubrir Pseudomonas, como en la infección grave. No hay presentación oral y cada 24 horas es insuficiente.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Drenaje percutáneo urgente de la vesícula y soporte intensivo","Colecistectomía laparoscópica inmediata, apenas se estabilice la presión","Antibióticos y soporte en terapia intensiva, sin drenaje","Colecistectomía abierta de urgencia como primer gesto"],"explicacion":"En el grado III con falla orgánica no rápidamente reversible y comorbilidad grave, TG18 indica soporte y drenaje urgente o temprano. El drenaje es el puente o la alternativa cuando la fisiología es prohibitiva; no debe usarse solo por una etiqueta inespecífica de alto riesgo.","fuente":"TG18 flujograma de grado III; Hermes: Colecistitis aguda y Drenaje de la vesícula biliar"},{"tipo":"Estudios","pregunta":"¿Qué cultivos pedís?","opciones":["Hemocultivos y cultivo de la bilis del drenaje","No pido cultivos porque no cambian el antibiótico empírico","Urocultivo, para descartar un foco urinario de la sepsis","Hemocultivos, y espero el resultado para iniciar el antibiótico"],"explicacion":"Los hemocultivos no se recomiendan de rutina solo en el grado I comunitario; en el grave sí. La bilis se cultiva al inicio de todo procedimiento. Los cultivos nunca deben demorar el antibiótico en un paciente en shock.","fuente":"TG18 antimicrobianos (Gomi 2018)"}]},{"id":"biliar-05","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Ictericia con cálculo en el colédoco","vineta":"Mujer de 49 años con cólicos biliares previos. Ictericia de 3 días y coluria, afebril y estable. Bilirrubina total 5,2 mg/dl, fosfatasa alcalina triplicada. Ecografía: colelitiasis, colédoco de 10 mm con imagen de cálculo distal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué probabilidad de coledocolitiasis tiene?","opciones":["Alta: el cálculo se ve en la ecografía","Intermedia: requiere colangiorresonancia","Baja: alcanza con la colecistectomía","Es una colangitis aguda"],"explicacion":"ASGE 2019 considera alto riesgo el cálculo visto en imágenes, la colangitis o la bilirrubina mayor de 4 mg/dl con colédoco dilatado; esta paciente cumple dos. Sin fiebre ni signos inflamatorios no es colangitis.","fuente":"ASGE 2019; Hermes: Coledocolitiasis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué estrategia indicás?","opciones":["Extraer el cálculo (CPRE o exploración laparoscópica) y colecistectomía","Colangiorresonancia y ecoendoscopia para confirmar el cálculo antes de decidir","Colecistectomía sola, esperando que el cálculo migre al duodeno","Ácido ursodesoxicólico y nueva ecografía de control en 3 meses"],"explicacion":"En alto riesgo se va directo al tratamiento: CPRE con esfinterotomía o exploración laparoscópica de la vía biliar según experiencia, y colecistectomía para evitar la recurrencia. Repetir estudios diagnósticos solo demora; el cálculo con ictericia no se deja librado a la migración.","fuente":"ASGE 2019 y ESGE 2019; Hermes: Coledocolitiasis"},{"tipo":"Fármaco","pregunta":"Antes de la CPRE, ¿qué indicás para prevenir la pancreatitis posprocedimiento?","opciones":["Diclofenac o indometacina 100 mg rectal, inmediatamente antes o después","Indometacina 25 mg por vía oral cada 8 horas durante los 3 días previos","Octreótido 100 µg subcutáneo antes de la CPRE y cada 8 horas después","Diclofenac 100 mg por vía rectal, solo si aparece dolor después de la CPRE"],"explicacion":"ESGE recomienda 100 mg de diclofenac o indometacina rectal de rutina en todos los pacientes sin contraindicación, inmediatamente antes o después de la CPRE. Su efecto es preventivo: darlo al aparecer el dolor no sirve, y la vía oral u octreótido no demostraron beneficio.","fuente":"ESGE 2020, profilaxis de pancreatitis pos-CPRE; Hermes: Complicaciones de la CPRE y la esfinterotomía"},{"tipo":"Técnica","pregunta":"El cálculo mide 18 mm y no sale con balón ni canastilla. ¿Qué hacés?","opciones":["Esfinterotomía limitada y dilatación con balón grande; si falla, prótesis","Terminar la CPRE sin drenaje y reintentar la extracción en otra sesión","Ampliar la esfinterotomía al máximo posible hasta lograr extraer el cálculo entero","Indicar ursodesoxicólico y repetir la CPRE en 6 meses sin dejar prótesis"],"explicacion":"ESGE propone esfinterotomía limitada con dilatación con balón grande para cálculos difíciles, y litotricia guiada por colangioscopia si está disponible. Si no se logra la limpieza, una prótesis temporal asegura el drenaje hasta un nuevo intento. Una esfinterotomía excesiva aumenta el riesgo de perforación y sangrado.","fuente":"ESGE 2019; Hermes: Coledocolitiasis"}]},{"id":"biliar-06","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Fiebre con escalofríos e ictericia en un anciano","vineta":"Varón de 78 años. Fiebre de 39,2 °C con escalofríos, ictericia y dolor en hipocondrio derecho. Lúcido, presión 120/75 mmHg, creatinina normal. Leucocitos 16.000/mm³, bilirrubina 4,1 mg/dl, albúmina normal. Ecografía: colédoco de 12 mm con litiasis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad?","opciones":["Colangitis aguda grado II (moderada)","Colangitis aguda grado I (leve)","Colangitis aguda grado III (grave)","Colecistitis aguda litiásica grado II"],"explicacion":"Es grado II por tener al menos dos criterios: leucocitos mayores de 12.000, fiebre de 39 °C o más y edad de 75 años o más. No hay disfunción orgánica (hipotensión, confusión, falla renal), que definiría el grado III.","fuente":"TG18, gravedad de la colangitis; Hermes: Clasificación de gravedad de Tokio"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Drenaje biliar por CPRE dentro de las 48 horas, con antibióticos","Antibióticos solos y CPRE electiva a las 2 semanas si persiste la ictericia","Colecistectomía de urgencia con exploración de la vía biliar","Drenaje percutáneo como primera opción aunque la papila sea accesible"],"explicacion":"En el grado II el drenaje temprano o urgente (dentro de las 48 horas) reduce la mortalidad. La CPRE es la primera opción si el acceso papilar es posible; la vía percutánea, ecoendoscópica o quirúrgica son rescates.","fuente":"TG18; Hermes: Colangitis aguda y Clasificación de gravedad de Tokio"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Ceftriaxona","Cefazolina IV","Ampicilina-sulbactam","Amoxicilina por vía oral"],"explicacion":"Para la colangitis grado II comunitaria TG18 propone cefalosporinas de tercera generación como ceftriaxona. La cefazolina es para el grado I y la ampicilina-sulbactam no se recomienda con resistencia mayor del 20 %.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Medidas generales","pregunta":"Después de drenar la vía, ¿cuánto dura el antibiótico?","opciones":["De 4 a 7 días una vez controlado el foco","Se suspende a las 24 horas del drenaje","Completar 14 días desde el drenaje","Hasta que se normalice la bilirrubina sérica"],"explicacion":"TG18 recomienda 4 a 7 días tras el control del foco. Solo se prolonga a un mínimo de 2 semanas si hay bacteriemia por Enterococcus o Streptococcus, por el riesgo de endocarditis.","fuente":"TG18 antimicrobianos, duración (Gomi 2018)"},{"tipo":"Estudios","pregunta":"¿Qué muestra tomás durante la CPRE?","opciones":["Cultivo de la bilis al inicio del procedimiento","Biopsia de la papila para descartar ampuloma","Citología de la bilis para descartar neoplasia","No tomo muestras: el antibiótico ya está indicado"],"explicacion":"TG18 recomienda obtener cultivo de bilis al comienzo de todo procedimiento biliar para orientar el tratamiento dirigido y la desescalada.","fuente":"TG18 antimicrobianos, recomendación 1C (Gomi 2018)"}]},{"id":"biliar-07","tema":"Pancreatitis aguda","anio":2,"titulo":"Dolor epigástrico transfixiante","vineta":"Mujer de 44 años. Dolor epigástrico transfixiante de 8 horas con vómitos. Lipasa 1.900 U/l (más de tres veces el límite superior). Ecografía: colelitiasis, colédoco de 5 mm. Bilirrubina 1,3 mg/dl. Afebril, sin hipotensión, oxigenación ni función renal alteradas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad inicial?","opciones":["Pancreatitis aguda biliar leve (por ahora)","Pancreatitis aguda biliar moderadamente grave","Pancreatitis aguda biliar grave","Colangitis aguda grado I"],"explicacion":"Cumple dos de tres criterios (dolor típico y lipasa mayor del triple). Sin falla orgánica ni complicaciones locales se considera leve, y se reclasifica a las 24, 48 horas y 7 días. No hay fiebre ni colestasis para pensar en colangitis.","fuente":"Atlanta revisada (Banks 2013); Hermes: Pancreatitis aguda"},{"tipo":"Estudios","pregunta":"¿Pedís una TC con contraste al ingreso?","opciones":["No: el diagnóstico ya está hecho con clínica y lipasa","Sí, para graduar la gravedad y buscar necrosis desde el inicio","No, pido una CPRE diagnóstica para buscar el cálculo","Sí, junto con una colangiorresonancia urgente"],"explicacion":"Con dolor típico y enzimas elevadas no hace falta TC al ingreso; la TC precoz subestima la necrosis y es más confiable a los 5 a 7 días si la evolución no es buena. La CPRE diagnóstica no está indicada.","fuente":"Atlanta revisada (Banks 2013); Hermes: Pancreatitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué hidratación indicás?","opciones":["Ringer lactato 1,5 ml/kg/h, con bolo de 10 ml/kg solo si hay hipovolemia","Solución fisiológica 20 ml/kg en bolo y luego 3 ml/kg/h durante 48 horas","Restricción hídrica a 1.000 ml/día para evitar el edema pulmonar","Coloides (hidroxietilalmidón) 2 ml/kg/h hasta normalizar la diuresis"],"explicacion":"La reanimación moderada con Ringer lactato redujo la sobrecarga de volumen sin empeorar la evolución frente a la agresiva (ensayo WATERFALL). Se reduce o suspende el aporte si aparecen signos de sobrecarga.","fuente":"iLATAM-AP 2026 y ensayo WATERFALL; Hermes: Pancreatitis aguda"},{"tipo":"Medidas generales","pregunta":"¿Cuándo empieza a comer?","opciones":["Alimentación oral precoz según tolerancia, aun en las primeras 24 horas","Ayuno hasta que se normalice la lipasa y luego dieta líquida progresiva","Nutrición parenteral total hasta que ceda la inflamación","Sonda nasoyeyunal y alimentación enteral por 7 días"],"explicacion":"La alimentación oral se reinicia dentro de las 24 a 48 horas si se tolera, y en los cuadros leves puede comenzar de inmediato. Esperar a que baje la lipasa no tiene fundamento; la nutrición artificial se reserva para quien no tolera la vía oral.","fuente":"Hermes: Pancreatitis aguda"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No, porque no hay infección documentada","Imipenem profiláctico durante 14 días completos","Ceftriaxona durante 7 días por la litiasis","Metronidazol para cubrir anaerobios intestinales"],"explicacion":"No se indican antibióticos profilácticos en pancreatitis, ni siquiera necrotizante. Se reservan para necrosis infectada, colangitis u otra infección documentada.","fuente":"Hermes: Pancreatitis aguda"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo hacés la colecistectomía?","opciones":["En la misma internación","A las 6 a 8 semanas del alta","No hace falta si la lipasa se normaliza","Solo después de una CPRE con esfinterotomía de rutina"],"explicacion":"En la pancreatitis biliar leve, la colecistectomía en la internación índice redujo los eventos biliares recurrentes de 17 % a 5 % (ensayo PONCHO). La CPRE se reserva para colangitis o cálculo confirmado.","fuente":"Ensayo PONCHO; Hermes: Manejo de la pancreatitis biliar"}]},{"id":"hernia-01","tema":"Hernia inguinal","anio":1,"titulo":"Bulto inguinal que molesta al esfuerzo","vineta":"Varón de 42 años, albañil, ASA I, sin cirugías pélvicas previas. Tumoración inguinal derecha reducible desde hace 8 meses, que le molesta al hacer fuerza. Examen: hernia inguinal indirecta derecha reducible; lado izquierdo normal.","pasos":[{"tipo":"Estudios","pregunta":"¿Necesitás imágenes antes de operar?","opciones":["No: el diagnóstico es clínico","Sí, una ecografía inguinal dinámica","Sí, una TC de abdomen y pelvis","Sí, una resonancia de la región inguinal"],"explicacion":"El diagnóstico de la hernia inguinal es clínico en la mayoría de los casos. La ecografía dinámica, TC o RM se reservan para hernia oculta, obesidad, recurrencia o diagnóstico dudoso.","fuente":"Hermes: Hernia inguinal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué reparación indicás si contás con experiencia y recursos?","opciones":["Reparación laparoendoscópica (TEP o TAPP) con malla","Espera vigilada hasta que aparezcan síntomas mayores","Reparación de Shouldice como primera elección","Herniorrafia de Bassini sin malla"],"explicacion":"HerniaSurge 2023 recomienda la vía laparoendoscópica en la hernia primaria unilateral por menos dolor posoperatorio y crónico, con experiencia y recursos. Al ser sintomática, se opera; la reparación sin malla queda para casos seleccionados.","fuente":"HerniaSurge 2023; Hermes: Hernia inguinal"},{"tipo":"Técnica","pregunta":"¿Qué malla usás por vía laparoendoscópica?","opciones":["Malla de polipropileno pesada (más de 70 g/m²)","Malla de polipropileno liviana (menos de 50 g/m²)","Malla parcialmente absorbible de bajo peso","Sin malla: cierre del orificio con sutura"],"explicacion":"En la vía laparoendoscópica HerniaSurge recomienda malla pesada, sobre todo en hernias grandes y directas: la liviana no reduce el dolor y aumenta la recurrencia. La liviana se recomienda en Lichtenstein.","fuente":"HerniaSurge 2023, capítulo de mallas"},{"tipo":"Fármaco","pregunta":"¿Indicás profilaxis antibiótica?","opciones":["No: no se sugiere en la vía laparoendoscópica","Sí, cefazolina 2 g IV antes de la incisión","Sí, ceftriaxona durante 3 días posoperatorios","Sí, amoxicilina-clavulánico durante 7 días"],"explicacion":"HerniaSurge 2023 no sugiere profilaxis antibiótica en la reparación laparoendoscópica en ningún paciente ni ambiente. En la reparación abierta con malla solo se sugiere en pacientes de alto riesgo o ambientes con alta infección.","fuente":"HerniaSurge 2023, capítulo de profilaxis"},{"tipo":"Técnica","pregunta":"¿Dónde no podés fijar la malla en un TEP o TAPP?","opciones":["En los triángulos del dolor y funesto, bajo el tracto iliopúbico","En el ligamento de Cooper, medial a los vasos ilíacos","En la pared abdominal anterior por encima del tracto iliopúbico","En el tubérculo púbico y la sínfisis del pubis"],"explicacion":"Por debajo del tracto iliopúbico están el triángulo funesto (vasos ilíacos externos) y el del dolor (ramo genital del genitofemoral y nervio cutáneo femoral lateral). Fijar ahí produce hemorragia grave o neuralgia crónica.","fuente":"Fromont 2006 (EMC TAPP); Hermes: Reparación preperitoneal de hernia inguinal"}]},{"id":"hernia-02","tema":"Hernia inguinal","anio":1,"titulo":"Hernia que no entra hace 30 horas","vineta":"Varón de 76 años con hernia inguinal derecha conocida. Hace 30 horas quedó irreductible y dolorosa, con vómitos. La piel sobre la hernia está eritematosa y caliente. Leucocitos 15.000/mm³.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás según HerniaSurge 2023?","opciones":["Hernia agudamente irreductible, sospecha de estrangulación","Hernia incarcerada con edema del saco, sin compromiso vascular","Hernia crónicamente irreductible con dolor agudo sobreagregado","Hernia estrangulada confirmada por los signos clínicos"],"explicacion":"HerniaSurge 2023 propone abandonar el término \"incarcerada\". \"Estrangulada\" se reserva para cuando la imagen o la cirugía la confirman. Es agudamente irreductible porque antes se reducía y los síntomas son de inicio agudo.","fuente":"HerniaSurge 2023, capítulo de urgencia; Hermes: Hernia inguinal estrangulada"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Cirugía inmediata, sin intentar la reducción manual","Intentar la reducción manual bajo sedación y observar 24 horas","Antibióticos IV y reevaluar a las 24 horas","TC de abdomen y cirugía programada en la semana"],"explicacion":"Cambios en la piel, más de 24 horas de evolución y leucocitosis son signos de estrangulación. La reducción manual se intenta solo sin sospecha de isquemia; con sospecha, la cirugía es inmediata (recomendación fuerte).","fuente":"HerniaSurge 2023, algoritmo de la hernia agudamente irreductible"},{"tipo":"Técnica","pregunta":"El asa parece violácea. ¿Cómo decidís si resecar?","opciones":["Liberar el anillo, calentar el asa y reevaluar color, peristaltismo y pulsos","Resecar de entrada el segmento violáceo con márgenes amplios","Reducir el asa al abdomen sin evaluarla y revisar en una segunda mirada a las 48 horas","Decidir por el sangrado arterial del borde de sección, sin esperar"],"explicacion":"Primero se libera el cuello y se da tiempo a la recuperación con fisiología corregida; luego se valoran color, peristaltismo y pulsos mesentéricos. Ningún signo aislado garantiza viabilidad, y reducir sin evaluar oculta un asa necrótica.","fuente":"Hermes: Hernia inguinal estrangulada y Resección intestinal en isquemia"},{"tipo":"Técnica","pregunta":"Resecaste un asa necrótica con anastomosis, sin derrame fecal. ¿Cómo reparás la hernia?","opciones":["Malla plana de polipropileno macroporosa","Malla biológica de origen porcino","Herniorrafia sin malla y reparación diferida","Malla microporosa de PTFE expandido"],"explicacion":"Con estrangulación o resección intestinal (campo limpio-contaminado), HerniaSurge 2023 sugiere malla macroporosa de polipropileno. WSES 2017 coincide en permitir malla sintética sin derrame entérico macroscópico.","fuente":"HerniaSurge 2023; WSES 2017; Hermes: Hernia inguinal estrangulada"}]},{"id":"pared-01","tema":"Eventraciones","anio":2,"titulo":"Eventración en una fumadora diabética","vineta":"Mujer de 58 años con eventración supraumbilical sintomática, 2 años después de una laparotomía mediana. IMC 33, fuma 20 cigarrillos por día, diabetes tipo 2 con HbA1c de 8,4 %. Defecto palpable de unos 6 cm.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís para planificar la cirugía?","opciones":["TC (o RM) de la pared abdominal","No hace falta: alcanza con el examen físico","Ecografía de partes blandas","Radiografía de abdomen de pie"],"explicacion":"EHS 2023 recomienda TC o RM antes de operar una eventración: define ancho y área del defecto, contenido, músculos y otros defectos, y anticipa si la fascia cerrará sin separación de componentes.","fuente":"EHS 2023, eventración de línea media; Hermes: Eventración de la pared abdominal"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás antes de operar?","opciones":["Dejar de fumar 4 semanas antes, HbA1c menor de 7 % y bajar de peso","Operar ya, sin optimizar, porque la hernia es sintomática","Dejar de fumar el día anterior y ajustar la insulina en el posoperatorio","Exigir un IMC menor de 25 antes de programar la cirugía"],"explicacion":"EHS 2023 recomienda preoptimizar: la abstinencia de menos de 4 semanas no reduce complicaciones, el objetivo glucémico es HbA1c menor de 7 % y el descenso de peso es dirigido. Exigir un IMC normal puede demorar indefinidamente una cirugía sintomática.","fuente":"EHS 2023; Hermes: Optimización preoperatoria en hernia ventral"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué reparación indicás?","opciones":["Malla retromuscular con cierre del defecto","Sutura simple del defecto con puntos separados","Malla intraperitoneal en puente sin cerrar el defecto","Malla onlay prefascial como primera elección"],"explicacion":"EHS 2023 recomienda malla (la sutura sola recidiva 30 %), cierre del defecto en vez de puente y plano retromuscular, que tuvo menos recurrencia y seroma que el onlay. El onlay se prefiere en la urgencia, no en la cirugía electiva.","fuente":"EHS 2023, eventración de línea media"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis antibiótica indicás?","opciones":["Cefazolina (cefalosporina de primera generación)","Vancomicina de rutina por la obesidad","No indico profilaxis en cirugía limpia","Ceftriaxona más metronidazol durante 5 días"],"explicacion":"EHS 2023 sugiere una dosis única de profilaxis en la reparación de eventraciones. La cefazolina es el agente de elección para la cirugía limpia de pared; la vancomicina se reserva para colonización por SAMR o alergia grave.","fuente":"EHS 2023; ASHP/IDSA/SIS/SHEA 2013"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["2 g IV en los 60 minutos previos a la incisión; repetir pasadas 4 horas","1 g IV al cerrar la piel, con una segunda dosis a las 8 horas de la primera","2 g IV al inducir la anestesia y cada 8 horas durante 7 días","500 mg por vía oral la noche anterior y 500 mg la mañana de la cirugía"],"explicacion":"La dosis es de 2 g (3 g si pesa 120 kg o más) dentro de la hora previa a la incisión, para tener niveles en el tejido al cortar. EHS 2023 sugiere una segunda dosis si la cirugía dura más de 4 horas. Prolongarla no reduce la infección.","fuente":"ASHP/IDSA/SIS/SHEA 2013; EHS 2023"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás después de la cirugía?","opciones":["Movilizarse desde el inicio y evitar cargas y Valsalva durante 4 semanas","Reposo en cama durante 2 semanas y luego caminar con faja hasta el control","Faja elástica permanente durante 6 meses para evitar la recidiva","Volver a levantar peso a la semana si no hay dolor"],"explicacion":"EHS 2023 sugiere movilizarse activamente desde el inicio, evitar cargas y ejercicios con Valsalva durante 4 semanas (tiempo de integración de la malla) y usar faja solo por comodidad durante 6 semanas.","fuente":"EHS 2023, cuidados posoperatorios"}]}];
const INTERVALOS = [0, 1, 3, 7, 16, 35]; // días por nivel de repetición espaciada
const DIA = 86400000;
const CLAVE = 'pase-de-sala-progreso-v1';
const SESION = 5;

function leer() { try { return JSON.parse(localStorage.getItem(CLAVE)) || {} } catch (e) { return {} } }
function guardar(p) { try { localStorage.setItem(CLAVE, JSON.stringify(p)) } catch (e) {} }
let prog = leer();
let estado = { pantalla: 'inicio' };

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ahora = () => Date.now();
const mezclar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]] } return b };
const fecha = t => new Date(t).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });

function nivel(id) { return (prog[id] && prog[id].nivel) || 0 }
function pendiente(id) { const p = prog[id]; return p && p.vence <= ahora() }
function dominado(id) { return nivel(id) >= 3 }

function colaSesion() {
  const vencidos = CASOS.filter(c => pendiente(c.id)).sort((a, b) => prog[a.id].vence - prog[b.id].vence);
  const nuevos = CASOS.filter(c => !prog[c.id]);
  return mezclar(vencidos).concat(mezclar(nuevos)).slice(0, SESION).map(c => c.id);
}

function agrupar(clave) {
  const g = {};
  CASOS.forEach(c => { const k = c[clave]; (g[k] = g[k] || []).push(c) });
  return g;
}

function barra(nombre, lista) {
  const n = lista.length, d = lista.filter(c => dominado(c.id)).length, v = lista.filter(c => prog[c.id] && !dominado(c.id)).length;
  return `<div class="bar"><div class="bar-head"><span>${esc(nombre)}</span><span>${d}/${n} dominados</span></div>
  <div class="track" role="img" aria-label="${d} dominados y ${v} en práctica de ${n}"><i class="dom" style="width:${d / n * 100}%"></i><i class="vis" style="width:${v / n * 100}%"></i></div></div>`;
}

function inicio() {
  const cola = colaSesion();
  const vencidos = CASOS.filter(c => pendiente(c.id)).length;
  const nuevos = CASOS.filter(c => !prog[c.id]).length;
  const dom = CASOS.filter(c => dominado(c.id)).length;
  const porAnio = agrupar('anio'), porTema = agrupar('tema');
  const proximo = CASOS.map(c => prog[c.id]).filter(p => p && p.vence > ahora()).sort((a, b) => a.vence - b.vence)[0];
  $('#app').innerHTML = `
  <header class="top"><div><p class="eyebrow">Residencia de cirugía general</p><h1>Pase de sala</h1></div><span class="badge">${CASOS.length} casos</span></header>
  <div class="stats">
    <div class="stat"><b>${vencidos}</b><span>para repasar hoy</span></div>
    <div class="stat"><b>${nuevos}</b><span>sin ver</span></div>
    <div class="stat"><b>${dom}</b><span>dominados</span></div>
  </div>
  <div class="row">
    <button class="btn" id="b-sesion" ${cola.length ? '' : 'disabled'}>${cola.length ? `Empezar sesión · ${cola.length} caso${cola.length > 1 ? 's' : ''}` : 'Nada pendiente hoy'}</button>
  </div>
  ${!cola.length && proximo ? `<p class="muted">El próximo repaso vence el ${fecha(proximo.vence)}. Mientras, podés repasar un tema.</p>` : ''}
  <section class="panel" aria-labelledby="t-tema"><h2 id="t-tema">Repasar un tema</h2>
    <div class="temas">${Object.entries(porTema).map(([t, l]) => `<button class="tema" data-tema="${esc(t)}"><span>${esc(t)}<small>${l.length} ${l.length === 1 ? 'caso' : 'casos'} · ${l[0].anio}.º año</small></span><span class="badge">${l.filter(c => dominado(c.id)).length}/${l.length}</span></button>`).join('')}</div>
  </section>
  <section class="panel" aria-labelledby="t-av"><h2 id="t-av">Avance por año del programa</h2>
    <div class="bars">${Object.keys(porAnio).sort().map(a => barra(a + '.º año', porAnio[a])).join('')}</div>
    <div class="legend"><span><i style="background:var(--scrub)"></i>Dominado (3 aciertos espaciados)</span><span><i style="background:var(--iodine);opacity:.55"></i>En práctica</span></div>
  </section>
  <details><summary>Respaldo del progreso</summary>
    <div style="display:grid;gap:8px;margin-top:10px">
      <p class="muted">El progreso queda guardado en este teléfono. Copiá este código para respaldarlo o pegá uno anterior para restaurarlo.</p>
      <textarea id="respaldo" aria-label="Código de respaldo">${esc(JSON.stringify(prog))}</textarea>
      <div class="row"><button class="btn sec" id="b-copiar">Copiar código</button><button class="btn sec" id="b-restaurar">Restaurar desde el código</button></div>
      <p class="msg" id="msg-resp"></p>
    </div></details>`;
  $('#b-sesion').onclick = () => cola.length && empezar(cola, 'Sesión del día');
  document.querySelectorAll('.tema').forEach(b => b.onclick = () => empezar(mezclar(CASOS.filter(c => c.tema === b.dataset.tema)).map(c => c.id), b.dataset.tema));
  $('#b-copiar').onclick = () => { const t = $('#respaldo'); navigator.clipboard && navigator.clipboard.writeText(t.value).then(() => $('#msg-resp').textContent = 'Código copiado.', () => { t.select(); $('#msg-resp').textContent = 'Seleccioné el código: copialo manualmente.' }) || (t.select(), $('#msg-resp').textContent = 'Seleccioné el código: copialo manualmente.') };
  $('#b-restaurar').onclick = () => { try { const p = JSON.parse($('#respaldo').value); if (typeof p !== 'object' || !p) throw 0; prog = p; guardar(prog); inicio(); $('#msg-resp') && ($('#msg-resp').textContent = 'Progreso restaurado.') } catch (e) { $('#msg-resp').textContent = 'El código no es válido: copiá el texto completo del respaldo.' } };
}

function empezar(ids, etiqueta) {
  estado = { pantalla: 'caso', cola: ids, i: 0, etiqueta, paso: 0, res: [], orden: null };
  caso();
}

function caso() {
  const c = CASOS.find(x => x.id === estado.cola[estado.i]);
  const p = c.pasos[estado.paso];
  if (!estado.orden) estado.orden = mezclar(p.opciones.map((t, k) => ({ t, k })));
  const resp = estado.respondido;
  const pasos = c.pasos.map((_, k) => `<i class="${k < estado.res.length ? (estado.res[k] ? 'ok' : 'no') : k === estado.paso ? 'act' : ''}"></i>`).join('');
  const esDosis = p.tipo === 'Dosis';
  $('#app').innerHTML = `
  <header class="top"><div><p class="eyebrow">${esc(estado.etiqueta)} · caso ${estado.i + 1} de ${estado.cola.length}</p><h2>${esc(c.titulo)}</h2></div><button class="badge" id="b-salir" style="border:0">Salir</button></header>
  <article class="vineta"><p class="eyebrow">${esc(c.tema)} · ${c.anio}.º año</p><p>${esc(c.vineta)}</p><div class="pasos" aria-label="Paso ${estado.paso + 1} de ${c.pasos.length}">${pasos}</div></article>
  <section class="hoja"><div class="margen" aria-hidden="true">${esc(p.tipo)}</div><div class="hoja-body">
    <p class="eyebrow">Paso ${estado.paso + 1} de ${c.pasos.length} · ${esc(p.tipo)}</p>
    <h3>${esc(p.pregunta)}</h3>
    <div class="ops">${estado.orden.map(o => {
      let cl = 'op' + (esDosis ? ' dosis' : '');
      if (resp) { if (o.k === 0) cl += ' ok'; else if (o.k === resp.k) cl += ' no' }
      return `<button class="${cl}" data-k="${o.k}" ${resp ? 'disabled' : ''}>${esc(o.t)}</button>`
    }).join('')}</div>
    ${resp ? `<div class="feedback ${resp.k === 0 ? '' : 'no'}"><strong>${resp.k === 0 ? 'Correcto.' : 'La respuesta es: ' + esc(p.opciones[0])}</strong><p>${esc(p.explicacion)}</p><p class="fuente">${esc(p.fuente)}</p></div>
    <button class="btn" id="b-sig">${estado.paso + 1 < c.pasos.length ? 'Siguiente paso' : 'Ver resultado del caso'}</button>` : ''}
  </div></section>`;
  $('#b-salir').onclick = () => { estado = { pantalla: 'inicio' }; inicio() };
  document.querySelectorAll('.op:not([disabled])').forEach(b => b.onclick = () => { estado.respondido = { k: +b.dataset.k }; estado.res.push(+b.dataset.k === 0); caso(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }) });
  if (resp) $('#b-sig').onclick = () => {
    estado.respondido = null; estado.orden = null;
    if (estado.paso + 1 < c.pasos.length) { estado.paso++; caso(); window.scrollTo(0, 0) } else cierre(c);
  };
}

function cierre(c) {
  const ok = estado.res.filter(Boolean).length, n = estado.res.length, pct = ok / n;
  const prev = prog[c.id] || { nivel: 0, intentos: 0 };
  let nivelN = prev.nivel;
  if (pct >= 0.85) nivelN = Math.min(prev.nivel + 1, INTERVALOS.length - 1);
  else if (pct < 0.6) nivelN = 1;
  else nivelN = Math.max(prev.nivel, 1);
  const vence = ahora() + INTERVALOS[nivelN] * DIA;
  prog[c.id] = { nivel: nivelN, vence, intentos: prev.intentos + 1, ultimo: Math.round(pct * 100), fallos: c.pasos.map((p, k) => estado.res[k] ? null : p.tipo).filter(Boolean) };
  guardar(prog);
  const quedan = estado.i + 1 < estado.cola.length;
  $('#app').innerHTML = `
  <header class="top"><div><p class="eyebrow">${esc(estado.etiqueta)} · caso ${estado.i + 1} de ${estado.cola.length}</p><h2>${esc(c.titulo)}</h2></div></header>
  <section class="panel"><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${ok}/${n}</b><span>pasos correctos</span></div><div class="stat"><b>${Math.round(pct * 100)}%</b><span>del caso</span></div></div>
    <ul class="res-list">${c.pasos.map((p, k) => `<li><span class="m ${estado.res[k] ? 'ok' : 'no'}">${estado.res[k] ? '✓' : '✗'}</span><span>${esc(p.tipo)}: ${esc(p.opciones[0])}</span></li>`).join('')}</ul>
    <p class="next-review">Vuelve ${INTERVALOS[nivelN] === 0 ? 'hoy' : INTERVALOS[nivelN] === 1 ? 'mañana' : 'en ' + INTERVALOS[nivelN] + ' días (' + fecha(vence) + ')'}</p>
  </section>
  <div class="row">${quedan ? '<button class="btn" id="b-otro">Siguiente caso</button>' : ''}<button class="btn ${quedan ? 'sec' : ''}" id="b-ini">Volver al inicio</button></div>`;
  if (quedan) $('#b-otro').onclick = () => { estado.i++; estado.paso = 0; estado.res = []; caso(); window.scrollTo(0, 0) };
  $('#b-ini').onclick = () => { estado = { pantalla: 'inicio' }; inicio(); window.scrollTo(0, 0) };
}

function arrancar(datos) {
  if (datos && datos.estado && datos.estado.pantalla === 'caso') { estado = datos.estado; caso() } else inicio();
}
window.claude?.hot?.snapshot?.(() => ({ estado }));
window.claude?.hot?.ready ? window.claude.hot.ready(arrancar) : arrancar(window.claude?.hot?.data ?? {});
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
</body>
</html>
