<title>Pase de sala</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: historia clínica de guardia. Una columna angosta; cada paso es una hoja con su margen rotulado por tipo. */
:root {
  --bg: #EEF3F1;
  --sheet: #FFFFFF;
  --ink: #142320;
  --muted: #586A66;
  --line: #CBD8D4;
  --scrub: #0F5C52;
  --scrub-soft: #DCEBE7;
  --iodine: #B8661A;
  --ok: #2D7A4B;
  --ok-soft: #E1F1E7;
  --bad: #B3261E;
  --bad-soft: #F8E2DF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1513; --sheet: #15201D; --ink: #E3ECE9; --muted: #98ABA6; --line: #2A3A36;
  --scrub: #5FC2B0; --scrub-soft: #1C3530; --iodine: #E8A15A; --ok: #6CCB8E; --ok-soft: #173126;
  --bad: #F08A80; --bad-soft: #3A1C1A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1513; --sheet: #15201D; --ink: #E3ECE9; --muted: #98ABA6; --line: #2A3A36;
  --scrub: #5FC2B0; --scrub-soft: #1C3530; --iodine: #E8A15A; --ok: #6CCB8E; --ok-soft: #173126;
  --bad: #F08A80; --bad-soft: #3A1C1A; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--f-body); margin: 0 }
.app { max-width: 620px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); padding-block: calc(18px + env(safe-area-inset-top)) calc(48px + env(safe-area-inset-bottom)); display: grid; gap: 18px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em }
h2 { font-size: 1.35rem; font-weight: 800 }
h3 { font-size: 1.05rem; font-weight: 600 }
p { margin: 0 }
.eyebrow { font: 600 0.75rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted) }
.muted { color: var(--muted) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--iodine); outline-offset: 2px }
.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-weight: 700; background: var(--scrub); color: var(--sheet); width: 100% }
.btn.sec { background: transparent; color: var(--scrub); box-shadow: inset 0 0 0 2px var(--scrub) }
.btn[disabled] { opacity: .45; cursor: default }
.row { display: flex; gap: 10px; flex-wrap: wrap }
.row > * { flex: 1 1 160px }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap }
.badge { font: 500 0.8rem/1 var(--f-mono); color: var(--scrub); background: var(--scrub-soft); padding: 6px 9px; border-radius: 6px; white-space: nowrap }

/* Resumen de progreso */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px }
.stat b { font: 800 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums }
.stat span { font-size: .82rem; color: var(--muted) }
.bars { display: grid; gap: 12px }
.bar { display: grid; gap: 5px }
.bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem }
.bar-head span:last-child { font: 500 .82rem var(--f-mono); color: var(--muted); white-space: nowrap }
.track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex }
.track i { display: block; height: 100% }
.track .dom { background: var(--scrub) }
.track .vis { background: var(--iodine); opacity: .55 }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px }
.temas { display: grid; gap: 8px }
.tema { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.tema small { display: block; color: var(--muted); font-size: .8rem }
.tema .badge { flex: none }

/* Caso */
.vineta { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; border-top: 6px solid var(--scrub) }
.pasos { display: flex; gap: 5px }
.pasos i { flex: 1; height: 5px; border-radius: 3px; background: var(--line) }
.pasos i.ok { background: var(--ok) } .pasos i.no { background: var(--bad) } .pasos i.act { background: var(--iodine) }
.hoja { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: 30px 1fr; overflow: hidden }
.margen { background: var(--scrub-soft); color: var(--scrub); writing-mode: vertical-rl; transform: rotate(180deg); font: 700 .72rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; padding: 10px 0 }
.hoja-body { padding: 16px; display: grid; gap: 12px; min-width: 0 }
.ops { display: grid; gap: 8px }
.op { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; line-height: 1.35 }
.op.dosis { font-family: var(--f-mono); font-size: .92rem }
.op:not([disabled]):hover { border-color: var(--scrub) }
.op.ok { border-color: var(--ok); background: var(--ok-soft) }
.op.no { border-color: var(--bad); background: var(--bad-soft) }
.op[disabled] { cursor: default }
.feedback { border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: var(--bg); border-left: 4px solid var(--ok) }
.feedback.no { border-left-color: var(--bad) }
.feedback strong { font-family: var(--f-display) }
.fuente { font-size: .85rem; color: var(--muted) }
.fuente::before { content: "Fuente: "; font-weight: 700; color: var(--ink) }

/* Resumen del caso */
.res-list { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.res-list li { display: flex; gap: 10px; align-items: baseline }
.res-list .m { font: 500 .82rem var(--f-mono); flex: none; width: 1.4em }
.res-list .ok { color: var(--ok) } .res-list .no { color: var(--bad) }
.next-review { font: 500 .9rem var(--f-mono); color: var(--scrub) }
details { font-size: .9rem }
summary { cursor: pointer; color: var(--muted) }
textarea { width: 100%; min-height: 80px; font: .8rem var(--f-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px }
.msg { font-size: .85rem; color: var(--scrub) }
@media (prefers-reduced-motion: no-preference) { .hoja, .feedback { animation: in .18s ease-out } @keyframes in { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }
</style>

<script>
const CASOS = [{"id":"base-01","tema":"Respuesta a la injuria y medio interno","anio":1,"titulo":"Hiperglucemia en el posoperatorio","vineta":"Varón de 61 años sin diabetes conocida, en el día 1 de una hemicolectomía derecha. Glucemias capilares de 220 y 245 mg/dl. Hemodinámicamente estable, tolera líquidos.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo interpretás la hiperglucemia?","opciones":["Hiperglucemia de estrés por la respuesta endocrina a la agresión quirúrgica, que igual debe tratarse","Diabetes tipo 1 de debut","Un valor sin importancia clínica en el posoperatorio","Efecto exclusivo de la solución de mantenimiento"],"explicacion":"La cirugía activa el eje hipotálamo-hipofisario-suprarrenal y la respuesta inflamatoria: suben cortisol, catecolaminas y glucagón, y aparece resistencia a la insulina. La hiperglucemia resultante se asocia con más infección y complicaciones aunque el paciente no sea diabético.","fuente":"Hermes: Respuesta inflamatoria a la agresión quirúrgica"},{"tipo":"Fármaco","pregunta":"¿Cómo la tratás?","opciones":["Insulina subcutánea programada (basal más correcciones), con objetivo de 140 a 180 mg/dl","Metformina oral desde hoy","Escala de insulina corriente sola, solo si supera 300 mg/dl","Infusión de insulina para lograr 80 a 110 mg/dl"],"explicacion":"En pacientes internados no críticos el objetivo es 140 a 180 mg/dl con insulina basal y correcciones. Las escalas reactivas solas tienen peor control, la metformina no se usa en el posoperatorio inmediato y el control estricto (80 a 110) aumentó la hipoglucemia y la mortalidad en el ensayo NICE-SUGAR.","fuente":"ADA Standards of Care, atención hospitalaria; ensayo NICE-SUGAR"},{"tipo":"Medidas generales","pregunta":"¿Qué medida perioperatoria contribuye a limitar la respuesta metabólica?","opciones":["Recuperación mejorada: ayuno corto, alimentación y movilización tempranas y analgesia sin exceso de opioides","Ayuno hasta que haya ruidos intestinales","Reposo en cama durante 72 horas","Sonda nasogástrica de rutina"],"explicacion":"Los protocolos de recuperación mejorada reducen la resistencia a la insulina y el catabolismo evitando el ayuno prolongado, sondas y reposo innecesarios, e iniciando alimentación y movilización tempranas.","fuente":"Hermes: Recuperación perioperatoria en cirugía digestiva"}]},{"id":"base-02","tema":"Respuesta a la injuria y medio interno","anio":1,"titulo":"Debilidad y ondas T picudas","vineta":"Mujer de 74 años con insuficiencia renal crónica, en el día 2 de una laparotomía por oclusión. Diuresis 15 ml/h en las últimas 6 horas, debilidad. Potasio 7,1 mEq/l; el ECG muestra ondas T picudas y QRS ensanchado.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene y qué urgencia tiene?","opciones":["Hiperpotasemia grave con cambios electrocardiográficos: emergencia","Hiperpotasemia leve: repetir en 24 horas","Muestra hemolizada: no requiere conducta","Hipopotasemia por pérdidas digestivas"],"explicacion":"Un potasio de 6,5 mEq/l o más, o cualquier valor elevado con cambios en el ECG (T picudas, QRS ancho), es una emergencia por riesgo de arritmia. Se trata sin esperar una nueva muestra, aunque se puede confirmar en paralelo.","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"},{"tipo":"Fármaco","pregunta":"¿Qué indicás primero para proteger el miocardio?","opciones":["Gluconato de calcio al 10 %","Furosemida","Resina de intercambio (poliestireno sulfonato)","Bicarbonato de sodio como única medida"],"explicacion":"El calcio estabiliza la membrana del miocardio en minutos, pero no baja el potasio. Después se desplaza el potasio al interior de la célula (insulina con glucosa, salbutamol) y se elimina (diálisis, diuréticos si hay diuresis, resinas).","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"},{"tipo":"Dosis","pregunta":"¿Con qué dosis?","opciones":["30 ml de gluconato de calcio al 10 % IV en 10 minutos","3 ml de gluconato de calcio al 10 % IV","30 ml de gluconato de calcio al 10 % por vía oral","100 ml de gluconato de calcio al 10 % en bolo rápido"],"explicacion":"La guía británica indica 30 ml de gluconato de calcio al 10 % IV en 10 minutos, repetible si persisten los cambios del ECG. La vía oral no sirve y un bolo masivo rápido arriesga arritmia.","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"},{"tipo":"Fármaco","pregunta":"¿Cómo bajás el potasio rápidamente?","opciones":["10 U de insulina corriente con 25 g de glucosa IV en 15 a 30 minutos, controlando glucemias","10 U de insulina corriente IV sin glucosa","100 U de insulina corriente IV","25 g de glucosa sola"],"explicacion":"La insulina mete el potasio en la célula; la glucosa evita la hipoglucemia. Si la glucemia previa es menor de 7 mmol/l (126 mg/dl), se continúa con glucosa al 10 % a 50 ml/h durante 5 horas. Con oliguria y falla renal, planificar diálisis.","fuente":"UK Kidney Association, hiperpotasemia aguda en adultos"}]},{"id":"base-03","tema":"Respuesta a la injuria y medio interno","anio":1,"titulo":"Confusión y convulsión después de una resección","vineta":"Mujer de 58 años en el día 1 de una resección de colon, con hidratación por solución glucosada hipotónica. Presenta confusión, vómitos y una convulsión breve. Sodio 118 mEq/l; el día previo era 136 mEq/l.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hiponatremia aguda con síntomas graves","Hiponatremia crónica asintomática","Hipernatremia por deshidratación","Pseudohiponatremia por hiperlipidemia"],"explicacion":"Una caída de 18 mEq/l en menos de 48 horas es aguda. Vómitos, convulsiones, somnolencia o distrés cardiorrespiratorio son síntomas graves por edema cerebral, y cambian la conducta: se corrige de inmediato con solución hipertónica.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"},{"tipo":"Fármaco","pregunta":"¿Qué indicás?","opciones":["Solución salina hipertónica al 3 %","Restricción hídrica sola","Solución fisiológica al 0,9 % a 42 ml/h","Tolvaptán"],"explicacion":"Con síntomas graves se usa solución al 3 % en bolos. La restricción hídrica o la solución fisiológica son lentas e insuficientes, y los vaptanes no están indicados en la emergencia. Suspendé las soluciones hipotónicas.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["150 ml al 3 % en 20 minutos, repetible, hasta subir 5 mEq/l","500 ml al 3 % en 1 hora","1000 ml al 3 % en 24 horas","50 ml al 3 % por día"],"explicacion":"Se administran bolos de 150 ml de solución al 3 % en 20 minutos, controlando el sodio entre bolos, hasta lograr una suba de 5 mEq/l o mejoría de los síntomas.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el límite de corrección?","opciones":["No más de 10 mEq/l en las primeras 24 horas y 8 mEq/l en cada 24 horas siguientes","Normalizar el sodio en 6 horas","No hay límite si la hiponatremia es aguda","Hasta 20 mEq/l en las primeras 24 horas"],"explicacion":"Superar 10 mEq/l en 24 horas aumenta el riesgo de desmielinización osmótica. Tras la mejoría se mantiene una vía con solución fisiológica mínima y se trata la causa.","fuente":"Guía europea de hiponatremia (ESE y ERA-EDTA, 2014)"}]},{"id":"base-04","tema":"Shock","anio":1,"titulo":"Fiebre e hipotensión en el día 5","vineta":"Varón de 66 años en el día 5 de una gastrectomía. Fiebre de 39 °C, frecuencia cardíaca 118, presión 82/45 mmHg, frecuencia respiratoria 26, confuso. Lactato 4,6 mmol/l. Peso 80 kg.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tipo de shock es más probable?","opciones":["Shock séptico de probable origen abdominal (fuga anastomótica)","Shock cardiogénico","Shock hipovolémico por hemorragia","Shock neurogénico"],"explicacion":"Fiebre, taquicardia, hipotensión, confusión e hiperlactatemia en el día 5 de una anastomosis digestiva sugieren sepsis por fuga. El mecanismo es distributivo, aunque puede coexistir con hipovolemia.","fuente":"Hermes: Shock en el paciente quirúrgico"},{"tipo":"Medidas generales","pregunta":"¿Qué reposición inicial indicás?","opciones":["Cristaloides a 30 ml/kg (unos 2,4 litros) en las primeras 3 horas, reevaluando la respuesta","Un litro de coloide en 24 horas","Restricción de líquidos por riesgo de edema anastomótico","Albúmina al 20 % como primera elección"],"explicacion":"La Surviving Sepsis Campaign sugiere al menos 30 ml/kg de cristaloides en las primeras 3 horas en la hipoperfusión por sepsis, preferentemente balanceados, reevaluando la respuesta para evitar la sobrecarga.","fuente":"Surviving Sepsis Campaign 2021"},{"tipo":"Fármaco","pregunta":"Persiste con presión arterial media de 58 mmHg tras los líquidos. ¿Qué agregás?","opciones":["Noradrenalina para una presión arterial media de 65 mmHg","Dopamina como primera elección","Dobutamina sola","Más cristaloides sin límite"],"explicacion":"La noradrenalina es el vasopresor de primera línea y el objetivo inicial es una PAM de 65 mmHg. Puede iniciarse por vía periférica mientras se coloca un acceso central.","fuente":"Surviving Sepsis Campaign 2021"},{"tipo":"Fármaco","pregunta":"¿Cuándo iniciás el antibiótico?","opciones":["Dentro de la primera hora, tras tomar hemocultivos sin demorarlo","Después de la TC","Después de confirmar la fuga en la cirugía","Cuando lleguen los cultivos"],"explicacion":"En el shock séptico el antibiótico se administra idealmente dentro de la primera hora. Los cultivos se toman antes solo si no lo demoran. Cada hora de retraso aumenta la mortalidad.","fuente":"Surviving Sepsis Campaign 2021"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué es lo que define el pronóstico además del soporte?","opciones":["El control temprano del foco (drenaje o reoperación)","La duración del antibiótico","La corrección del lactato con bicarbonato","La colocación de un catéter de arteria pulmonar"],"explicacion":"Sin control del foco el antibiótico y los vasopresores no alcanzan. Se busca la fuente con TC si la estabilidad lo permite y se drena o reopera lo antes posible.","fuente":"Surviving Sepsis Campaign 2021; Hermes: Infección intraabdominal y peritonitis"}]},{"id":"base-05","tema":"Shock","anio":1,"titulo":"Hipotensión después del antibiótico","vineta":"Mujer de 35 años en quirófano. A los 2 minutos de recibir cefazolina presenta eritema generalizado, broncoespasmo y presión de 70/40 mmHg.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué ocurre?","opciones":["Anafilaxia (shock distributivo)","Hipovolemia por ayuno","Reacción vasovagal","Neumotórax a tensión"],"explicacion":"Compromiso cutáneo, respiratorio y cardiovascular minutos después de un fármaco es anafilaxia. En quirófano los desencadenantes más frecuentes son relajantes musculares, antibióticos, clorhexidina y látex.","fuente":"WAO, guía de anafilaxia 2020"},{"tipo":"Fármaco","pregunta":"¿Cuál es el fármaco de primera línea?","opciones":["Adrenalina","Difenhidramina","Hidrocortisona","Salbutamol inhalado"],"explicacion":"La adrenalina es el único fármaco que revierte la anafilaxia y no debe demorarse. Antihistamínicos y corticoides son coadyuvantes que no tratan el shock.","fuente":"WAO, guía de anafilaxia 2020"},{"tipo":"Dosis","pregunta":"¿Qué dosis inicial de adrenalina si no tiene vía de infusión titulada?","opciones":["0,5 mg IM (0,5 ml de solución 1 mg/ml) en la cara anterolateral del muslo, repetible a los 5 minutos","1 mg IV en bolo","5 mg IM","0,05 mg subcutáneo"],"explicacion":"La dosis IM en adultos es 0,01 mg/kg hasta 0,5 mg, en el muslo, repetible cada 5 a 15 minutos. El bolo IV de 1 mg es la dosis de paro cardíaco y en un paciente con pulso puede causar arritmias; en quirófano el anestesiólogo puede titular bolos IV pequeños.","fuente":"WAO, guía de anafilaxia 2020"},{"tipo":"Medidas generales","pregunta":"¿Qué más hacés?","opciones":["Suspender el agente, oxígeno, cristaloides en bolo y documentar para estudio alergológico","Seguir con la cirugía sin cambios","Administrar el mismo antibiótico más lento","Dar el alta al recuperarse sin documentar"],"explicacion":"Se retira el desencadenante, se administra oxígeno y volumen y, si se recupera, se documenta el evento y se solicita triptasa y estudio alergológico para evitar la reexposición.","fuente":"WAO, guía de anafilaxia 2020"}]},{"id":"base-06","tema":"Infección en cirugía","anio":1,"titulo":"Herida enrojecida en el día 5","vineta":"Mujer de 52 años en el día 5 de una laparotomía mediana. Dolor, eritema y secreción purulenta en el tercio inferior de la herida. Temperatura 37,6 °C, sin taquicardia ni hipotensión. Fascia íntegra al examen.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Infección superficial del sitio quirúrgico","Infección de órgano o espacio","Dehiscencia aponeurótica","Fascitis necrosante"],"explicacion":"Pus en la piel y el celular subcutáneo dentro de los 30 días, con fascia íntegra, define la infección incisional superficial. Si se sospecha disrupción de la fascia o colección profunda, hay que estudiarla.","fuente":"Hermes: Infección del sitio quirúrgico; WSES/SIS-E 2018"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés?","opciones":["Abrir la herida, drenar, irrigar y curar","Antibióticos orales sin abrir la herida","Punzar con aguja y dejar cerrada","Reoperar para lavado peritoneal"],"explicacion":"La infección superficial se trata abriendo amplia y rápidamente la incisión. Sin la apertura, el antibiótico solo no resuelve la colección.","fuente":"WSES/SIS-E 2018, infecciones de piel y partes blandas"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No: solo si hay respuesta inflamatoria sistémica, falla orgánica o inmunocompromiso","Sí, siempre por 7 días","Sí, vancomicina empírica","Sí, una dosis única"],"explicacion":"Abierta la herida, la infección superficial suele manejarse sin antibióticos. Se reservan para signos sistémicos, falla orgánica o inmunocompromiso, cubriendo cocos grampositivos o la flora del sitio operado.","fuente":"WSES/SIS-E 2018, recomendación 1C"},{"tipo":"Medidas generales","pregunta":"¿Cómo seguís la herida?","opciones":["Curaciones con lavado y cobertura; considerar presión negativa o cierre diferido cuando esté limpia","Cerrarla de inmediato con puntos","Dejarla expuesta sin curar","Rellenarla con gasa seca sin cambiarla por una semana"],"explicacion":"La herida abierta cicatriza por segunda intención o se cierra en forma diferida cuando está limpia. La presión negativa reduce el tamaño y los cambios de curación en heridas grandes.","fuente":"Hermes: Infección del sitio quirúrgico"}]},{"id":"base-07","tema":"Infección en cirugía","anio":1,"titulo":"Dolor desproporcionado en un muslo","vineta":"Varón de 55 años diabético. Dolor intenso en el muslo derecho de 24 horas, mucho mayor que lo que muestra el eritema, con edema que lo excede, una bulla violácea y crepitación. Presión 88/50 mmHg. Leucocitos 22.000/mm³, sodio 131 mEq/l.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Infección necrosante de partes blandas","Celulitis simple","Trombosis venosa profunda","Erisipela"],"explicacion":"Dolor desproporcionado, edema más allá del eritema, bullas, crepitación e hipotensión son signos de alarma de infección necrosante. La piel inicial puede parecer una celulitis y la ausencia de gas no la excluye.","fuente":"WSES/SIS-E 2018; Hermes: Infecciones necrosantes de tejidos blandos"},{"tipo":"Estudios","pregunta":"¿Necesitás una TC o el puntaje LRINEC antes de operar?","opciones":["No: con este cuadro, la imagen o un puntaje no deben demorar la cirugía","Sí, LRINEC de 6 o más es obligatorio","Sí, TC siempre antes de operar","Sí, resonancia magnética"],"explicacion":"El LRINEC no sirve para descartar (sensibilidad cercana al 68 %) y la imagen solo se usa si no demora la operación. Ante alta sospecha clínica y shock, el diagnóstico se confirma en el quirófano.","fuente":"WSES/SIS-E 2018"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Desbridamiento quirúrgico inmediato de todo el tejido no viable, con reexploración en 24 a 48 horas","Antibióticos y reevaluar a las 24 horas","Oxigenoterapia hiperbárica como tratamiento principal","Drenaje percutáneo"],"explicacion":"El desbridamiento temprano y completo es lo que cambia la mortalidad; la demora de más de 12 horas la aumenta. Se reexplora hasta controlar la progresión. El oxígeno hiperbárico nunca reemplaza la cirugía.","fuente":"WSES/SIS-E 2018, recomendación 1B"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico empírico usás?","opciones":["Piperacilina-tazobactam más vancomicina más clindamicina","Cefalexina por vía oral","Ciprofloxacina sola","Metronidazol solo"],"explicacion":"Se necesita cobertura amplia contra grampositivos incluido SAMR, gramnegativos y anaerobios. La clindamicina se agrega para inhibir la producción de toxinas del estreptococo y el clostridio.","fuente":"IDSA 2014, infecciones de piel y partes blandas; WSES/SIS-E 2018"},{"tipo":"Dosis","pregunta":"¿Qué dosis de clindamicina?","opciones":["600 a 900 mg IV cada 8 horas","150 mg VO cada 12 horas","2 g IV cada 24 horas","300 mg IM en dosis única"],"explicacion":"Para la infección necrosante se usan 600 a 900 mg IV cada 8 horas, combinados con los demás agentes; las dosis orales o únicas no alcanzan.","fuente":"IDSA 2014, infecciones de piel y partes blandas"}]},{"id":"base-08","tema":"Infección en cirugía","anio":1,"titulo":"Celulitis de una pierna","vineta":"Mujer de 45 años sin comorbilidades. Eritema caliente y doloroso en la pierna izquierda de 2 días, de bordes poco definidos, sin colección ni puerta purulenta. Afebril, signos vitales normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Celulitis no purulenta leve","Absceso","Infección necrosante","Tromboflebitis superficial"],"explicacion":"Eritema y calor sin colección ni pus, en una paciente sin toxicidad, es una celulitis no purulenta leve, causada habitualmente por estreptococo.","fuente":"IDSA 2014, infecciones de piel y partes blandas"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás?","opciones":["Cefalexina por vía oral","Vancomicina IV","Ciprofloxacina","No requiere antibiótico"],"explicacion":"En la celulitis leve sin comorbilidad y donde el SAMR comunitario no es prevalente, alcanza un betalactámico oral activo contra estreptococo. Las quinolonas no son primera línea.","fuente":"WSES/SIS-E 2018; IDSA 2014"},{"tipo":"Dosis","pregunta":"¿Con qué esquema y duración?","opciones":["500 mg VO cada 6 horas durante 5 días, prolongando si no mejora","250 mg VO cada 24 horas durante 3 días","1 g VO cada 6 horas durante 21 días","500 mg VO en dosis única"],"explicacion":"La IDSA recomienda 5 días de tratamiento, extendiéndolo si la infección no mejoró. La cefalexina se indica 500 mg cada 6 horas.","fuente":"IDSA 2014, infecciones de piel y partes blandas"},{"tipo":"Medidas generales","pregunta":"¿Qué medida agregás?","opciones":["Elevar el miembro y tratar puertas de entrada (intertrigo, fisuras)","Reposo absoluto con vendaje compresivo apretado","Aplicar calor seco intenso","Ninguna"],"explicacion":"La elevación acelera la resolución del edema, y tratar el intertrigo o las fisuras interdigitales reduce las recurrencias.","fuente":"IDSA 2014, infecciones de piel y partes blandas"}]},{"id":"base-09","tema":"Soporte nutricional","anio":1,"titulo":"Desnutrición antes de una gastrectomía","vineta":"Varón de 68 años con adenocarcinoma gástrico que obstruye parcialmente el píloro. Perdió 14 % del peso en 3 meses, IMC 18, come menos de la mitad de lo habitual. Programado para gastrectomía.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es su riesgo nutricional?","opciones":["Riesgo nutricional grave","Riesgo bajo: la albúmina define el estado nutricional","Sin riesgo porque el IMC es mayor de 17","Riesgo moderado sin necesidad de intervención"],"explicacion":"Pérdida de peso mayor del 10 al 15 % en 6 meses, IMC menor de 18,5 o ingesta muy reducida definen riesgo grave. La albúmina refleja inflamación más que reservas y no sirve sola para diagnosticar desnutrición.","fuente":"ESPEN 2017, nutrición clínica en cirugía; Hermes: Soporte nutricional del paciente quirúrgico"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés antes de operar?","opciones":["Soporte nutricional durante 7 a 14 días antes de la cirugía, aunque haya que diferirla","Operar de inmediato sin soporte","Infundir albúmina hasta normalizarla","Esperar 3 meses de recuperación del peso"],"explicacion":"ESPEN indica que el paciente con riesgo nutricional grave reciba soporte de 7 a 14 días antes de la cirugía mayor, aun demorándola, porque reduce complicaciones. Por obstrucción, la vía puede ser enteral distal o parenteral.","fuente":"ESPEN 2017, nutrición clínica en cirugía"},{"tipo":"Dosis","pregunta":"¿Qué objetivos calórico y proteico indicás?","opciones":["25 a 30 kcal/kg/día y 1,5 g/kg/día de proteínas","40 a 50 kcal/kg/día y 0,5 g/kg/día de proteínas","15 kcal/kg/día y 3 g/kg/día de proteínas","35 kcal/kg/día sin aporte proteico"],"explicacion":"Para el paciente quirúrgico ESPEN propone 25 a 30 kcal/kg/día y alrededor de 1,5 g/kg/día de proteínas, ajustando según la respuesta.","fuente":"ESPEN 2021, guía práctica de nutrición en cirugía"},{"tipo":"Fármaco","pregunta":"Lleva 10 días casi sin comer. ¿Qué precaución tomás al iniciar la nutrición?","opciones":["Empezar con aporte bajo, dar tiamina antes y controlar fósforo, potasio y magnesio por riesgo de realimentación","Empezar directamente con el aporte total","Restringir el fósforo","No controlar electrolitos"],"explicacion":"La realimentación puede causar hipofosfatemia grave, arritmias y falla cardíaca. En pacientes de alto riesgo NICE sugiere empezar con un máximo de 10 kcal/kg/día, suplementar tiamina antes de alimentar y aumentar progresivamente con control de electrolitos.","fuente":"NICE CG32, soporte nutricional en adultos"}]},{"id":"base-10","tema":"Hemostasia y trombosis","anio":1,"titulo":"Tromboprofilaxis tras cirugía oncológica","vineta":"Mujer de 64 años, IMC 32, operada de una resección anterior de recto por cáncer (3 horas de cirugía). Puntaje de Caprini de 7. Sin sangrado activo y función renal normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo de tromboembolismo tiene?","opciones":["Alto (Caprini de 5 o más)","Bajo","Moderado sin indicación de profilaxis","Muy bajo: solo deambulación"],"explicacion":"Edad, cáncer, cirugía mayor prolongada y obesidad suman un Caprini de 5 o más, que es riesgo alto. En ese grupo se combina profilaxis farmacológica con métodos mecánicos.","fuente":"ACCP 2012, prevención de TEV en cirugía no ortopédica"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis indicás?","opciones":["Heparina de bajo peso molecular más compresión mecánica","Solo deambulación temprana","Aspirina sola","Warfarina con RIN entre 2 y 3"],"explicacion":"En riesgo alto sin alto riesgo de sangrado se recomienda heparina de bajo peso molecular, agregando medias o compresión neumática intermitente.","fuente":"ACCP 2012, prevención de TEV en cirugía no ortopédica"},{"tipo":"Dosis","pregunta":"¿Qué dosis de enoxaparina?","opciones":["40 mg subcutánea cada 24 horas","1 mg/kg subcutánea cada 12 horas","20 mg subcutánea por semana","80 mg IV cada 6 horas"],"explicacion":"La dosis profiláctica es 40 mg una vez por día. 1 mg/kg cada 12 horas es la dosis terapéutica. En obesidad mórbida o insuficiencia renal se ajusta.","fuente":"ACCP 2012; ficha técnica de enoxaparina"},{"tipo":"Medidas generales","pregunta":"¿Cuánto tiempo la indicás?","opciones":["Profilaxis extendida durante 4 semanas","Solo mientras esté internada","Hasta que deambule","6 meses"],"explicacion":"Tras cirugía abdominal o pélvica por cáncer se recomienda prolongar la heparina de bajo peso molecular durante 4 semanas, porque el riesgo persiste después del alta.","fuente":"ACCP 2012, prevención de TEV en cirugía no ortopédica"}]},{"id":"base-11","tema":"Hemostasia y trombosis","anio":1,"titulo":"Paciente anticoagulado que se opera","vineta":"Varón de 70 años con fibrilación auricular tratado con apixabán 5 mg cada 12 horas, función renal normal. Programado para una hemicolectomía (cirugía de alto riesgo de sangrado).","pasos":[{"tipo":"Medidas generales","pregunta":"¿Cuándo suspendés el apixabán?","opciones":["2 días antes (última dosis 3 días antes de la cirugía)","El día de la cirugía","7 días antes","No se suspende"],"explicacion":"En el estudio PAUSE, para cirugía de alto riesgo de sangrado se omitió el apixabán 2 días antes de la cirugía, sin puente con heparina, con baja tasa de sangrado y de tromboembolia.","fuente":"Estudio PAUSE (Douketis, 2019)"},{"tipo":"Fármaco","pregunta":"¿Indicás puente con heparina?","opciones":["No: los anticoagulantes directos no requieren puente","Sí, enoxaparina terapéutica","Sí, heparina no fraccionada en infusión","Sí, vitamina K"],"explicacion":"Por su vida media corta, los anticoagulantes directos se suspenden y se reinician sin puente. El puente aumenta el sangrado sin reducir los eventos tromboembólicos.","fuente":"Estudio PAUSE (Douketis, 2019)"},{"tipo":"Medidas generales","pregunta":"¿Cuándo lo reiniciás?","opciones":["A las 48 a 72 horas, con hemostasia asegurada","A las 6 horas de terminada la cirugía","A los 30 días","Nunca más"],"explicacion":"Tras cirugía de alto riesgo de sangrado el anticoagulante se reinicia a las 48 a 72 horas; mientras tanto se usa profilaxis de TEV a dosis profiláctica si corresponde.","fuente":"Estudio PAUSE (Douketis, 2019)"}]},{"id":"base-12","tema":"Anestesia y dolor","anio":1,"titulo":"Lipoma bajo anestesia local","vineta":"Varón de 70 kg al que vas a resecar un lipoma de 6 cm en la espalda con lidocaína. Durante la infiltración refiere sabor metálico, parestesias peribucales y luego convulsiona.","pasos":[{"tipo":"Dosis","pregunta":"Antes de infiltrar: ¿cuál es la dosis máxima de lidocaína con adrenalina?","opciones":["7 mg/kg (unos 490 mg en 70 kg)","4,5 mg/kg","15 mg/kg","1 mg/kg"],"explicacion":"La dosis máxima de lidocaína es 4,5 mg/kg sin adrenalina (hasta 300 mg) y 7 mg/kg con adrenalina (hasta 500 mg). Lidocaína al 1 % tiene 10 mg/ml: en 70 kg, unos 49 ml con adrenalina.","fuente":"Ficha técnica de lidocaína; ASRA 2020"},{"tipo":"Diagnóstico","pregunta":"¿Qué ocurre?","opciones":["Toxicidad sistémica por anestésico local","Crisis de ansiedad","Hipoglucemia","Reacción alérgica a la lidocaína"],"explicacion":"Sabor metálico, parestesias peribucales, acúfenos, agitación y convulsiones, que pueden seguir de arritmias y paro, son la toxicidad sistémica por inyección intravascular o sobredosis.","fuente":"ASRA 2020, toxicidad sistémica por anestésicos locales"},{"tipo":"Fármaco","pregunta":"Además de detener la infiltración y asegurar la vía aérea, ¿qué tratamiento específico indicás?","opciones":["Emulsión lipídica al 20 %","Lidocaína IV como antiarrítmico","Propofol a dosis altas como antídoto","Flumazenil"],"explicacion":"La emulsión lipídica al 20 % es el tratamiento específico. Las convulsiones se tratan con benzodiacepinas; se evitan la lidocaína como antiarrítmico y las dosis altas de propofol, que deprimen el miocardio.","fuente":"ASRA 2020, toxicidad sistémica por anestésicos locales"},{"tipo":"Dosis","pregunta":"¿Con qué dosis inicial?","opciones":["Bolo de 1,5 ml/kg en 2 a 3 minutos (100 ml si pesa más de 70 kg) y luego infusión","10 ml en bolo único","500 ml en 1 minuto","0,1 ml/kg"],"explicacion":"ASRA indica un bolo de 1,5 ml/kg de emulsión al 20 % (100 ml en mayores de 70 kg) seguido de infusión de 0,25 ml/kg/min, repitiendo el bolo si persiste la inestabilidad.","fuente":"ASRA 2020, toxicidad sistémica por anestésicos locales"}]},{"id":"base-13","tema":"Anestesia y dolor","anio":1,"titulo":"Analgesia y náuseas en el posoperatorio","vineta":"Mujer de 34 años, no fumadora, con antecedente de náuseas tras una cirugía previa. Le van a hacer una colecistectomía laparoscópica. Peso 62 kg, función renal y hepática normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo de náuseas y vómitos posoperatorios tiene?","opciones":["Alto: tiene varios factores de Apfel (mujer, no fumadora, antecedente y opioides posoperatorios)","Bajo","Nulo","Solo si recibe óxido nitroso"],"explicacion":"El puntaje de Apfel suma sexo femenino, no fumar, antecedente de náuseas posoperatorias o cinetosis y uso de opioides. Con 3 o 4 factores el riesgo supera el 60 % y se usan dos o más antieméticos profilácticos.","fuente":"Cuarto consenso de náuseas y vómitos posoperatorios (Gan, 2020)"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis indicás?","opciones":["Dexametasona en la inducción más ondansetrón al final de la cirugía","Ondansetrón solo si vomita","Metoclopramida 10 mg única","Ninguna"],"explicacion":"En riesgo alto se combinan al menos dos antieméticos de distinta clase. La dexametasona se da en la inducción y el ondansetrón al final de la cirugía.","fuente":"Cuarto consenso de náuseas y vómitos posoperatorios (Gan, 2020)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de ondansetrón?","opciones":["4 mg IV","40 mg IV","0,4 mg IV","16 mg IV cada 4 horas"],"explicacion":"La dosis profiláctica de ondansetrón es 4 mg IV al final de la cirugía; la de dexametasona, 4 a 8 mg IV en la inducción.","fuente":"Cuarto consenso de náuseas y vómitos posoperatorios (Gan, 2020)"},{"tipo":"Fármaco","pregunta":"¿Qué analgesia base indicás?","opciones":["Paracetamol 1 g cada 6 horas más un AINE, con opioide solo de rescate","Morfina en horario fijo como única analgesia","Paracetamol 2 g cada 4 horas","Sin analgesia pautada, solo a demanda"],"explicacion":"La analgesia multimodal combina paracetamol (1 g cada 6 horas, máximo 4 g/día) con AINE y anestesia local en los trocares, dejando los opioides para el rescate; reduce náuseas, íleo y sedación.","fuente":"Hermes: Dolor perioperatorio; ficha técnica de paracetamol"}]},{"id":"base-14","tema":"Heridas y cicatrización","anio":1,"titulo":"Herida sucia en un trabajador rural","vineta":"Varón de 50 años, trabajador rural. Herida cortante de 6 cm en la pierna con un alambre, contaminada con tierra, de 4 horas de evolución. No recuerda haber recibido vacunas en la adultez.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Cómo manejás la herida?","opciones":["Irrigación abundante, desbridamiento del tejido desvitalizado y cierre si queda limpia","Sutura inmediata sin lavar","Dejar cerrada con vendaje oclusivo sin explorar","Aplicar alcohol yodado puro dentro de la herida y suturar"],"explicacion":"La irrigación con volumen generoso y el desbridamiento son las medidas más importantes para prevenir la infección. Una herida limpia de pocas horas puede cerrarse en forma primaria; si queda contaminada, cierre diferido.","fuente":"Hermes: Manejo de heridas traumáticas agudas"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis antitetánica indicás?","opciones":["Vacuna (Td o dTpa) más inmunoglobulina antitetánica","Solo vacuna","Solo inmunoglobulina","Nada si no tiene fiebre"],"explicacion":"En una herida sucia o con tierra y vacunación desconocida o incompleta (menos de 3 dosis), se indican vacuna e inmunoglobulina, en sitios distintos, y se completa el esquema.","fuente":"CDC/ACIP, profilaxis del tétanos en el manejo de heridas"},{"tipo":"Dosis","pregunta":"¿Qué dosis de inmunoglobulina antitetánica?","opciones":["250 UI IM","25 UI IM","5000 UI IV","250 UI subcutánea en la herida"],"explicacion":"La dosis profiláctica es 250 UI por vía intramuscular, en un sitio distinto al de la vacuna.","fuente":"CDC/ACIP, profilaxis del tétanos en el manejo de heridas"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás al alta?","opciones":["Control de la herida en 48 horas y pautas de alarma de infección","Antibióticos de amplio espectro por 14 días","Reposo absoluto por 2 semanas","Retirar los puntos a las 24 horas"],"explicacion":"Se controla en 48 horas buscando signos de infección. No hay indicación de antibióticos prolongados en una herida bien lavada y desbridada sin infección.","fuente":"Hermes: Manejo de heridas traumáticas agudas"}]},{"id":"base-15","tema":"Heridas y cicatrización","anio":1,"titulo":"Quemadura por agua hirviendo","vineta":"Varón de 40 años, 80 kg, con quemaduras de espesor parcial profundo y total en todo el miembro superior derecho y la cara anterior del tronco por un accidente con agua hirviendo hace una hora. Sin lesión inhalatoria.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué superficie corporal quemada tiene según la regla de los nueve?","opciones":["27 % (miembro superior 9 % más cara anterior del tronco 18 %)","9 %","45 %","18 %"],"explicacion":"En el adulto, cada miembro superior es 9 %, la cara anterior del tronco 18 %, la posterior 18 %, cada miembro inferior 18 %, la cabeza 9 % y el periné 1 %. Las quemaduras de primer grado no se cuentan.","fuente":"ATLS 10.ª ed., lesiones térmicas"},{"tipo":"Medidas generales","pregunta":"¿Qué reposición inicial indicás?","opciones":["Ringer lactato a 2 ml × kg × % de superficie en 24 horas, la mitad en las primeras 8 horas desde la quemadura","Ringer lactato a 4 ml × kg × % en 8 horas","Solo líquidos por vía oral","Coloides desde la primera hora"],"explicacion":"ATLS 10 indica comenzar en el adulto con 2 ml × kg × % de superficie quemada (4320 ml en este paciente), la mitad en las primeras 8 horas contadas desde la quemadura, y titular según la diuresis.","fuente":"ATLS 10.ª ed., lesiones térmicas"},{"tipo":"Medidas generales","pregunta":"¿Con qué objetivo ajustás el ritmo?","opciones":["Diuresis de 0,5 ml/kg/h (unos 40 ml/h)","Diuresis de 3 ml/kg/h","Presión venosa central de 20 cmH2O","Frecuencia cardíaca menor de 60"],"explicacion":"En el adulto se busca una diuresis de 0,5 ml/kg/h; por encima de ese valor se reduce el aporte para evitar la sobrecarga y el síndrome compartimental.","fuente":"ATLS 10.ª ed., lesiones térmicas"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés si el antebrazo, quemado circunferencialmente, se pone frío y sin pulsos?","opciones":["Escarotomía","Elevar y esperar 24 horas","Injerto de piel inmediato","Fasciotomía de rutina sin escarotomía"],"explicacion":"Una escara circunferencial inextensible comprime los vasos; la escarotomía libera la constricción. Se indica ante compromiso circulatorio o ventilatorio.","fuente":"ATLS 10.ª ed., lesiones térmicas; Hermes: Evaluación y manejo inicial de quemaduras"}]},{"id":"base-16","tema":"Heridas y cicatrización","anio":1,"titulo":"Mordedura de perro en la mano","vineta":"Mujer de 30 años mordida por un perro conocido y vacunado en el dorso de la mano hace 3 horas. Herida punzante de 1 cm, sin compromiso tendinoso.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Suturás la herida?","opciones":["No: herida punzante de la mano, se irriga y se deja abierta","Sí, cierre primario siempre","Sí, con sutura intradérmica","Se reseca toda la piel alrededor"],"explicacion":"Las mordeduras punzantes y las de la mano tienen alto riesgo de infección y no se cierran en forma primaria. Se irrigan, se desbrida lo desvitalizado y se cubren.","fuente":"IDSA 2014, infecciones de piel y partes blandas (mordeduras)"},{"tipo":"Fármaco","pregunta":"¿Indicás antibiótico?","opciones":["Sí, profilaxis con amoxicilina-clavulánico","No, nunca en mordeduras","Sí, cefalexina sola","Sí, vancomicina"],"explicacion":"IDSA recomienda profilaxis anticipada en mordeduras de alto riesgo: mano, heridas punzantes, inmunocompromiso o cerca de articulaciones. La amoxicilina-clavulánico cubre Pasteurella, anaerobios y estafilococo; la cefalexina no cubre Pasteurella.","fuente":"IDSA 2014, infecciones de piel y partes blandas (mordeduras)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["875/125 mg VO cada 12 horas durante 3 a 5 días","875/125 mg en dosis única","500/125 mg cada 8 horas durante 21 días","250/62,5 mg por día"],"explicacion":"La profilaxis anticipada se indica de 3 a 5 días. La amoxicilina-clavulánico se usa a 875/125 mg cada 12 horas.","fuente":"IDSA 2014, infecciones de piel y partes blandas (mordeduras)"},{"tipo":"Medidas generales","pregunta":"¿Necesita profilaxis antirrábica?","opciones":["No: el perro es conocido, vacunado y se puede observar 10 días","Sí, vacuna e inmunoglobulina en todos los casos","Sí, solo inmunoglobulina","No hace falta controlar al animal"],"explicacion":"Con un perro identificado y sano que puede observarse durante 10 días, la profilaxis se difiere y solo se indica si el animal enferma. Se evalúa la vacuna antitetánica.","fuente":"Normas de profilaxis antirrábica (OMS)"}]},{"id":"base-17","tema":"Bioseguridad y aspectos médico-legales","anio":1,"titulo":"Pinchazo en quirófano","vineta":"Sos residente y te pinchás con la aguja de sutura después de usarla en un paciente con infección por VIH con carga viral desconocida. Tenés el esquema de hepatitis B completo con anticuerpos positivos.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés primero?","opciones":["Lavar con agua y jabón, sin exprimir ni usar sustancias cáusticas, y reportar de inmediato","Exprimir la herida y aplicar lavandina","Terminar la cirugía y consultar al día siguiente","No hacer nada porque el riesgo es bajo"],"explicacion":"Se lava con agua y jabón y se informa enseguida al servicio de salud ocupacional. Exprimir o usar cáusticos no reduce la transmisión y daña el tejido. La consulta debe ser inmediata porque la profilaxis tiene una ventana corta.","fuente":"CDC, manejo de la exposición ocupacional a sangre"},{"tipo":"Fármaco","pregunta":"¿Qué profilaxis indicás?","opciones":["Profilaxis antirretroviral lo antes posible, idealmente en las primeras 2 horas y no más allá de 72 horas, durante 28 días","Profilaxis solo si el test del paciente vuelve positivo en 7 días","Gammaglobulina contra hepatitis B","Ninguna"],"explicacion":"La profilaxis posexposición para VIH se inicia cuanto antes (idealmente en horas) y se mantiene 28 días con controles serológicos. Con anticuerpos contra hepatitis B protectores no hace falta profilaxis para hepatitis B.","fuente":"CDC, profilaxis posexposición ocupacional al VIH"},{"tipo":"Medidas generales","pregunta":"¿Qué medida reduce estos accidentes?","opciones":["Zona neutra para pasar instrumental cortopunzante y no recapuchar agujas","Doble guante como única medida","Pasar el bisturí de mano en mano","Recapuchar las agujas con dos manos"],"explicacion":"La técnica sin manos (zona neutra), no recapuchar y descartar en contenedores rígidos reducen los pinchazos. El doble guante disminuye la exposición a sangre pero no reemplaza esas prácticas.","fuente":"CDC, prevención de lesiones cortopunzantes"}]},{"id":"base-18","tema":"Bioseguridad y aspectos médico-legales","anio":1,"titulo":"Consentimiento para una cirugía programada","vineta":"Tenés que obtener el consentimiento de un paciente de 60 años, lúcido, para una colecistectomía laparoscópica programada en un hospital de la Argentina.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué forma debe tener?","opciones":["Escrito y firmado, porque es una intervención quirúrgica","Verbal, alcanza con anotarlo en la historia","No hace falta si el paciente se internó voluntariamente","Lo firma un familiar aunque el paciente esté lúcido"],"explicacion":"La Ley 26.529 de Derechos del Paciente exige consentimiento informado por escrito y firmado para internación, intervenciones quirúrgicas y procedimientos invasivos.","fuente":"Ley 26.529 de Derechos del Paciente (Argentina), artículo 7"},{"tipo":"Medidas generales","pregunta":"¿Qué información debe incluir?","opciones":["Procedimiento, objetivo, beneficios, riesgos y molestias, alternativas y consecuencias de no hacerlo","Solo el nombre de la operación","Solo las complicaciones graves","Solo la fecha de cirugía"],"explicacion":"La ley enumera el diagnóstico y el procedimiento propuesto, sus objetivos, beneficios esperados, riesgos y efectos adversos, alternativas con sus riesgos y beneficios, y las consecuencias de no realizarlo. Para la colecistectomía incluye conversión y lesión biliar.","fuente":"Ley 26.529 de Derechos del Paciente (Argentina), artículo 5"},{"tipo":"Medidas generales","pregunta":"¿Cuándo podés operar sin consentimiento?","opciones":["En una urgencia con grave peligro para la salud o la vida, sin posibilidad de obtenerlo del paciente ni de sus representantes","Cuando el paciente se niega pero vos considerás que es lo mejor","Cuando hay poco tiempo de quirófano","Nunca"],"explicacion":"La ley prevé excepciones: grave peligro para la salud pública o situación de emergencia con riesgo para la vida cuando no puede darlo el paciente ni sus representantes. Se documenta en la historia clínica.","fuente":"Ley 26.529 de Derechos del Paciente (Argentina), artículo 9"}]},{"id":"base-19","tema":"Principios de oncología y técnica","anio":1,"titulo":"Masa profunda en el muslo","vineta":"Mujer de 47 años con una masa de 8 cm, profunda a la fascia, en la cara anterior del muslo, que creció en 4 meses. Indolora, sin antecedente traumático.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Sarcoma de partes blandas hasta que se demuestre lo contrario","Lipoma: observar","Hematoma organizado","Quiste sebáceo"],"explicacion":"Toda masa de partes blandas de más de 5 cm, profunda a la fascia o que crece debe estudiarse como posible sarcoma antes de cualquier resección.","fuente":"ESMO, guía de sarcomas de partes blandas"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Resonancia magnética de la lesión y biopsia con aguja gruesa en un centro de sarcomas","Biopsia escisional directa en la guardia","Punción con aguja fina como único estudio","Ecografía y control en 6 meses"],"explicacion":"La resonancia define relaciones y planifica la biopsia. La biopsia con aguja gruesa, por un trayecto que luego se reseca con la pieza, es el estándar; idealmente se hace en el centro que va a operar.","fuente":"ESMO, guía de sarcomas de partes blandas"},{"tipo":"Técnica","pregunta":"¿Qué error técnico debés evitar?","opciones":["Resecar la masa sin estudio previo (\"whoops procedure\") o con incisiones transversales","Hacer la biopsia en el eje longitudinal del miembro","Marcar el trayecto de la biopsia","Pedir una TC de tórax para estadificar"],"explicacion":"La resección no planificada deja márgenes positivos y contamina planos, obligando a cirugías mayores. Las incisiones de biopsia deben ser longitudinales y ubicarse donde puedan incluirse en la resección definitiva.","fuente":"ESMO, guía de sarcomas de partes blandas; Hermes: Principios de oncología quirúrgica"}]},{"id":"base-20","tema":"Preoperatorio y posoperatorio","anio":1,"titulo":"Evaluación antes de una hernioplastia","vineta":"Varón de 72 años, hipertenso y diabético, que sube dos pisos por escalera sin síntomas. Programado para una hernioplastia inguinal. Toma aspirina por prevención primaria.","pasos":[{"tipo":"Estudios","pregunta":"¿Necesita estudios cardiológicos antes de operar?","opciones":["No: cirugía de riesgo bajo y buena capacidad funcional","Sí, ecocardiograma de estrés","Sí, cinecoronariografía","Sí, Holter de 24 horas"],"explicacion":"Con buena capacidad funcional (subir dos pisos equivale a 4 o más METs) y una cirugía de bajo riesgo, la evaluación cardiológica adicional no cambia la conducta y puede demorarla.","fuente":"ESC 2022, evaluación cardiovascular para cirugía no cardíaca"},{"tipo":"Medidas generales","pregunta":"¿Qué ayuno indicás?","opciones":["6 horas para comida liviana y hasta 2 horas antes para líquidos claros","Ayuno desde la medianoche para todo","12 horas de ayuno absoluto","24 horas de dieta líquida"],"explicacion":"La ASA permite líquidos claros hasta 2 horas antes y comida liviana hasta 6 horas antes (8 horas para comidas grasas). El ayuno prolongado aumenta la resistencia a la insulina y el malestar sin reducir la aspiración.","fuente":"ASA 2017, ayuno preoperatorio"},{"tipo":"Fármaco","pregunta":"¿Qué hacés con la aspirina de prevención primaria?","opciones":["Suspenderla antes de operar (al menos 3 días; 7 si el riesgo de sangrado es alto)","Seguirla sin cambios como si fuera prevención secundaria","Reemplazarla por clopidogrel","Agregar heparina como puente"],"explicacion":"ESC 2022 recomienda suspender la aspirina de prevención primaria antes de la cirugía no cardíaca; cuando se interrumpe, al menos 3 días antes y 7 en cirugías de alto riesgo de sangrado. En prevención secundaria, sobre todo con angioplastia previa, suele mantenerse si el riesgo de sangrado es bajo.","fuente":"ESC 2022, evaluación cardiovascular para cirugía no cardíaca"}]},{"id":"base-21","tema":"Canalizaciones venosas","anio":1,"titulo":"Acceso venoso central","vineta":"Paciente de 58 años en shock séptico que requiere noradrenalina y un acceso venoso central. Coagulación normal, sin contraindicaciones anatómicas.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué técnica reduce las complicaciones mecánicas?","opciones":["Punción guiada por ecografía en tiempo real","Punción por reparos anatómicos con múltiples intentos","Punción a ciegas sin control radiológico","Disección venosa como primera elección"],"explicacion":"La guía ecográfica en tiempo real reduce las punciones arteriales, el neumotórax y los intentos fallidos, sobre todo en la vena yugular interna.","fuente":"CDC 2011, prevención de infecciones de catéteres intravasculares"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas previenen la infección del catéter?","opciones":["Máxima barrera estéril, antisepsia con clorhexidina alcohólica mayor de 0,5 % y retiro cuando ya no se necesita","Antibiótico profiláctico sistémico","Recambio rutinario del catéter cada 3 días","Povidona acuosa y guantes estériles solos"],"explicacion":"Máxima barrera (gorro, barbijo, camisolín, guantes y campo grande), clorhexidina alcohólica y retiro temprano reducen la bacteriemia. No se recomiendan antibióticos profilácticos ni recambios programados.","fuente":"CDC 2011, prevención de infecciones de catéteres intravasculares"},{"tipo":"Técnica","pregunta":"¿Qué sitio tiene menor riesgo de infección?","opciones":["Subclavio","Femoral","Yugular interno","Todos tienen el mismo riesgo"],"explicacion":"En el estudio 3SITES el acceso subclavio tuvo menos infecciones y trombosis que el yugular y el femoral, a costa de más neumotórax. La elección integra experiencia, coagulación y anatomía.","fuente":"Estudio 3SITES (Parienti, 2015)"},{"tipo":"Estudios","pregunta":"Colocaste un catéter subclavio. ¿Qué controlás antes de usarlo para vasopresores?","opciones":["Posición de la punta y ausencia de neumotórax (radiografía o ecografía)","Nada","Una TC de tórax","Un ecocardiograma transesofágico"],"explicacion":"Se confirma que la punta esté en la vena cava superior y que no haya neumotórax, con radiografía o ecografía según la disponibilidad.","fuente":"Hermes: Procedimientos quirúrgicos junto a la cama"}]},{"id":"trauma-01","tema":"Manejo inicial del politraumatizado","anio":1,"titulo":"Motociclista hipotenso","vineta":"Varón de 28 años, choque de moto. Llega con vía aérea permeable, frecuencia respiratoria 24, saturación 95 %. Frecuencia cardíaca 130, presión 80/50 mmHg, piel fría. FAST con líquido en el espacio de Morison. Pelvis estable. Glasgow 14.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Shock hemorrágico por sangrado intraabdominal","Shock neurogénico","Taponamiento cardíaco","Shock séptico"],"explicacion":"Taquicardia, hipotensión y frialdad con FAST positivo en un traumatizado inestable indican hemorragia intraabdominal. El shock neurogénico cursa con bradicardia y piel caliente.","fuente":"ATLS 10.ª ed.; Hermes: Atención inicial del paciente traumatizado"},{"tipo":"Medidas generales","pregunta":"¿Cómo empezás la reanimación?","opciones":["Hasta 1 litro de cristaloide tibio y sangre precoz, con hipotensión permisiva hasta el control del sangrado","4 litros de cristaloide antes de transfundir","Coloides como primera elección","Esperar el hematocrito para decidir"],"explicacion":"ATLS 10 indica un bolo inicial de 1 litro de cristaloide tibio en el adulto y transfusión temprana si no responde. El exceso de cristaloides diluye factores y empeora la coagulopatía.","fuente":"ATLS 10.ª ed., shock"},{"tipo":"Fármaco","pregunta":"¿Qué antifibrinolítico indicás?","opciones":["Ácido tranexámico dentro de las primeras 3 horas","Ácido tranexámico a las 8 horas","Vitamina K","Desmopresina"],"explicacion":"En el ensayo CRASH-2, el ácido tranexámico redujo la muerte por sangrado si se administraba dentro de las 3 horas; después de ese plazo no beneficia e incluso puede ser perjudicial.","fuente":"Ensayo CRASH-2"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["1 g IV en 10 minutos y luego 1 g en infusión durante 8 horas","1 g VO cada 8 horas","10 g IV en bolo","100 mg IV en dosis única"],"explicacion":"El esquema de CRASH-2 es una carga de 1 g en 10 minutos seguida de 1 g en 8 horas.","fuente":"Ensayo CRASH-2"},{"tipo":"Conducta quirúrgica","pregunta":"No responde a la reanimación inicial. ¿Qué hacés?","opciones":["Laparotomía de urgencia con control de daños si la fisiología lo exige","TC de abdomen con contraste","Manejo no operatorio con observación","Embolización como primera opción en un paciente sin respuesta"],"explicacion":"Un paciente inestable con FAST positivo que no responde va directo al quirófano. La TC y el manejo no operatorio son para el paciente estable o que responde.","fuente":"ATLS 10.ª ed.; Hermes: Abdomen abierto y cierre temporal"}]},{"id":"trauma-02","tema":"Manejo inicial del politraumatizado","anio":1,"titulo":"Disnea súbita tras un choque","vineta":"Varón de 35 años, choque frontal. Disnea intensa, frecuencia respiratoria 36, saturación 82 %, presión 75/40 mmHg, ingurgitación yugular, desviación traqueal a la izquierda y ausencia de murmullo vesicular en el hemitórax derecho.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Neumotórax a tensión derecho","Hemotórax masivo izquierdo","Taponamiento cardíaco","Contusión pulmonar"],"explicacion":"Hipotensión, yugulares ingurgitadas, tráquea desviada al lado contrario y ausencia de murmullo del lado afectado son un neumotórax a tensión, un diagnóstico clínico.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Estudios","pregunta":"¿Pedís una radiografía de tórax antes de tratar?","opciones":["No: se descomprime de inmediato","Sí, siempre","Sí, una TC de tórax","Sí, una ecografía formal por radiología"],"explicacion":"El neumotórax a tensión se trata antes de cualquier imagen; esperar una radiografía puede llevar al paro.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Técnica","pregunta":"¿Dónde descomprimís con aguja en el adulto?","opciones":["Cuarto o quinto espacio intercostal, línea axilar media o anterior","Segundo espacio, línea medioclavicular, siempre","Séptimo espacio, línea escapular","Subxifoideo"],"explicacion":"ATLS 10 recomienda en el adulto el cuarto o quinto espacio en la línea axilar media o anterior, porque en el segundo espacio la pared suele ser demasiado gruesa para la aguja. Luego se coloca un tubo de tórax.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Técnica","pregunta":"¿Dónde colocás el tubo de tórax definitivo?","opciones":["En el triángulo de seguridad: quinto espacio, entre las líneas axilares anterior y media, por encima del borde superior de la costilla","Segundo espacio anterior por debajo de la costilla","Debajo del octavo espacio, línea escapular","Por cualquier espacio donde se palpe aire"],"explicacion":"El triángulo de seguridad (borde del pectoral mayor, borde del dorsal ancho y quinto espacio) evita la mama, los músculos grandes y el diafragma. Entrar por encima de la costilla evita el paquete vasculonervioso.","fuente":"ATLS 10.ª ed.; Hermes: Trauma torácico"}]},{"id":"trauma-03","tema":"Manejo inicial del politraumatizado","anio":1,"titulo":"Hemotórax después de una puñalada","vineta":"Varón de 24 años con herida de arma blanca en el hemitórax izquierdo, lateral. Hemodinámicamente estable. Radiografía: hemotórax izquierdo. Colocás un tubo de tórax y drena 1700 ml de sangre de inmediato.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo lo clasificás?","opciones":["Hemotórax masivo","Hemotórax pequeño","Derrame pleural paraneumónico","Neumotórax simple"],"explicacion":"Un drenaje inicial de 1500 ml o más, o un tercio de la volemia, define el hemotórax masivo.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Toracotomía","Segundo tubo de tórax","Observación con control del débito","Fibrinolíticos intrapleurales"],"explicacion":"Un drenaje inmediato de 1500 ml o más, o más de 200 ml/h durante 2 a 4 horas, o la necesidad persistente de transfusión indican toracotomía.","fuente":"ATLS 10.ª ed., trauma torácico"},{"tipo":"Medidas generales","pregunta":"Si el drenaje hubiera sido de 400 ml y luego mínimo, ¿qué harías con el tubo?","opciones":["Mantenerlo hasta que deje de drenar y el pulmón esté expandido, y buscar hemotórax retenido","Retirarlo a las 2 horas","Clamparlo en forma permanente","Recambiarlo cada 24 horas"],"explicacion":"Un hemotórax no masivo se maneja con el tubo hasta la reexpansión. Si queda un hemotórax retenido, la videotoracoscopia temprana reduce el empiema y el fibrotórax.","fuente":"ATLS 10.ª ed.; Hermes: Trauma torácico"}]},{"id":"aa-01","tema":"Abdomen agudo","anio":1,"titulo":"Vómitos y distensión con cicatriz previa","vineta":"Mujer de 60 años con histerectomía hace 10 años. Dolor cólico, vómitos y ausencia de gases desde hace 24 horas. Abdomen distendido, timpánico, sin defensa ni peritonismo. Afebril. Lactato normal. TC: asas de delgado dilatadas con cambio de calibre, sin signos de isquemia ni asa cerrada.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Oclusión de intestino delgado por bridas, sin signos de estrangulación","Íleo paralítico","Vólvulo de sigmoides","Pseudoobstrucción colónica"],"explicacion":"Cirugía abdominal previa, vómitos y distensión con cambio de calibre en la TC indican oclusión por bridas. Sin peritonismo, fiebre, lactato elevado ni signos tomográficos de isquemia, se puede intentar manejo no operatorio.","fuente":"Guías de Bologna 2017 (WSES); Hermes: Oclusión por bridas"},{"tipo":"Medidas generales","pregunta":"¿Qué manejo inicial indicás?","opciones":["Ayuno, sonda nasogástrica, hidratación IV y corrección de electrolitos","Laxantes y dieta","Cirugía inmediata","Proquinéticos"],"explicacion":"El manejo no operatorio consiste en descompresión con sonda nasogástrica, reposición de líquidos y electrolitos y vigilancia clínica estrecha.","fuente":"Guías de Bologna 2017 (WSES)"},{"tipo":"Fármaco","pregunta":"¿Qué estudio terapéutico agregás?","opciones":["Contraste hidrosoluble por la sonda (50 a 150 ml) con radiografía a las 24 horas","Bario por vía oral","Enema de bario","Neostigmina"],"explicacion":"El contraste hidrosoluble predice la resolución si llega al colon en 24 horas y reduce la necesidad de cirugía y la estancia. El bario está contraindicado por riesgo de peritonitis si hay perforación.","fuente":"Guías de Bologna 2017 (WSES)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hasta cuándo esperás?","opciones":["Hasta 72 horas sin resolución, o antes si aparecen signos de isquemia","Hasta 10 días","Solo 6 horas","Hasta que la paciente pida operarse"],"explicacion":"Si no resuelve en 72 horas, o aparecen fiebre, peritonismo, leucocitosis o lactato en aumento, está indicada la cirugía. Prolongar el manejo conservador aumenta la morbimortalidad.","fuente":"Guías de Bologna 2017 (WSES)"}]},{"id":"aa-02","tema":"Abdomen agudo","anio":1,"titulo":"Neumoperitoneo con dolor epigástrico súbito","vineta":"Varón de 50 años, fumador, consumidor de AINE. Dolor epigástrico súbito e intenso de 6 horas que se generalizó, abdomen en tabla. Radiografía de tórax de pie: neumoperitoneo. Presión 105/70 mmHg, frecuencia 110.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Úlcera péptica perforada","Pancreatitis aguda","Cólico renal","Infarto agudo de miocardio"],"explicacion":"Dolor epigástrico súbito con abdomen en tabla y neumoperitoneo en un consumidor de AINE es una úlcera perforada hasta que se demuestre otra cosa.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas iniciales indicás?","opciones":["Reanimación, sonda nasogástrica, inhibidor de bomba IV, antibióticos y cirugía urgente","Antiácidos orales y alta","Observación 24 horas","Endoscopia diagnóstica urgente"],"explicacion":"Con peritonitis difusa se reanima, se descomprime, se inician inhibidor de la bomba de protones IV y antibióticos, y se opera sin demora. La endoscopia está contraindicada con perforación.","fuente":"WSES 2020, úlcera péptica perforada y sangrante"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué operación indicás para una perforación prepilórica de 8 mm?","opciones":["Rafia simple con parche de epiplón (laparoscópica o abierta) y lavado","Gastrectomía subtotal","Vagotomía troncular y piloroplastia","Gastrectomía total"],"explicacion":"Para perforaciones menores de 2 cm, la rafia con epiploplastia es suficiente; la cirugía ácido reductora ya no se indica de rutina. Se toma biopsia si hay sospecha de malignidad (sobre todo en úlceras gástricas).","fuente":"WSES 2020, úlcera péptica perforada y sangrante"},{"tipo":"Fármaco","pregunta":"¿Qué indicás después para evitar la recidiva?","opciones":["Buscar y erradicar Helicobacter pylori, inhibidor de bomba y suspender AINE y tabaco","Solo antiácidos a demanda","Corticoides","No hace falta tratamiento médico"],"explicacion":"La erradicación del Helicobacter pylori, el inhibidor de bomba y la suspensión de AINE y tabaco previenen la recidiva y hacen innecesaria la cirugía ácido reductora.","fuente":"WSES 2020, úlcera péptica perforada y sangrante"}]},{"id":"pleura-01","tema":"Manejo del espacio pleural","anio":1,"titulo":"Neumotórax en un joven alto","vineta":"Varón de 22 años, alto y delgado, fumador, sin enfermedad pulmonar. Dolor pleurítico izquierdo desde ayer con disnea leve. Saturación 97 %, estable. Radiografía: neumotórax izquierdo de 3 cm en el ápice.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Neumotórax espontáneo primario","Neumotórax espontáneo secundario","Neumotórax a tensión","Neumotórax traumático"],"explicacion":"Sin enfermedad pulmonar previa, en un joven alto y fumador, es primario. El secundario aparece sobre una enfermedad pulmonar (EPOC, fibrosis) y se maneja de forma más agresiva.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás si tiene pocos síntomas?","opciones":["Manejo conservador con control, o tratamiento ambulatorio, decidido con el paciente","Tubo de tórax de 28 Fr obligatorio","Cirugía videotoracoscópica inmediata","Pleurodesis química de entrada"],"explicacion":"BTS 2023 considera el manejo conservador en adultos con síntomas mínimos sin importar el tamaño, y el ambulatorio cuando hay buen apoyo y seguimiento. Si no son aptos, aspiración con aguja o drenaje.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Medidas generales","pregunta":"¿Qué le indicás al alta?","opciones":["Dejar de fumar y no viajar en avión ni bucear hasta la resolución; el buceo, en forma permanente salvo cirugía definitiva","Puede viajar en avión al día siguiente","Reposo absoluto un mes","Ninguna indicación especial"],"explicacion":"Fumar aumenta la recurrencia. No se vuela hasta confirmar la resolución y el buceo se desaconseja de por vida salvo pleurectomía bilateral.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Conducta quirúrgica","pregunta":"Si tuviera una recurrencia homolateral, ¿qué indicás?","opciones":["Videotoracoscopia con resección de bullas y pleurodesis o pleurectomía","Otra aspiración y seguimiento indefinido","Toracotomía posterolateral de rutina","Solo oxígeno"],"explicacion":"Tras una recurrencia (o en profesiones de riesgo) se indica cirugía definitiva por videotoracoscopia, que reduce la recurrencia a valores bajos.","fuente":"BTS 2023, enfermedad pleural"}]},{"id":"pleura-02","tema":"Manejo del espacio pleural","anio":1,"titulo":"Derrame tabicado con fiebre","vineta":"Varón de 60 años con neumonía hace 10 días que persiste febril. Derrame pleural derecho; la punción da líquido turbio con pH 6,9 y glucosa 30 mg/dl. La ecografía muestra tabiques.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Derrame paraneumónico complicado o empiema","Derrame paraneumónico simple","Trasudado por insuficiencia cardíaca","Hemotórax"],"explicacion":"Un pH menor de 7,2, glucosa baja, pus o tabiques definen el derrame complicado o empiema y obligan a drenar.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Drenaje con tubo de tórax y antibióticos","Antibióticos solos","Punciones evacuadoras semanales","Decorticación abierta como primera opción en todos"],"explicacion":"El derrame complicado necesita drenaje además de antibióticos. La cirugía (videotoracoscopia) se reserva para el fracaso del drenaje y del tratamiento intrapleural.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"El drenaje es insuficiente por los tabiques. ¿Qué tratamiento intrapleural agregás?","opciones":["Activador tisular del plasminógeno más desoxirribonucleasa","Estreptoquinasa sola","Talco","Solución salina hipertónica"],"explicacion":"En el ensayo MIST-2, la combinación de alteplasa y DNasa mejoró el drenaje radiológico y redujo la necesidad de cirugía; cada fármaco solo no fue eficaz.","fuente":"Ensayo MIST-2 (Rahman, 2011)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Alteplasa 10 mg más DNasa 5 mg intrapleurales cada 12 horas, 6 dosis en 3 días","Alteplasa 100 mg IV","Alteplasa 1 mg intrapleural única","DNasa 50 mg cada 8 horas por 7 días"],"explicacion":"El esquema de MIST-2 es alteplasa 10 mg y DNasa 5 mg por el tubo, dos veces por día durante 3 días, clampeando 1 hora tras cada dosis.","fuente":"Ensayo MIST-2 (Rahman, 2011)"}]},{"id":"traq-01","tema":"Traqueostomías","anio":1,"titulo":"Cánula desplazada al tercer día","vineta":"Paciente con traqueostomía quirúrgica hecha hace 3 días en terapia intensiva. Desaturación súbita, la cánula está fuera del estoma. Tiene vía aérea superior permeable e intubación orotraqueal factible.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés?","opciones":["Oxígeno por boca y estoma, y si no recupera, intubación orotraqueal","Reintroducir a ciegas una cánula del mismo tamaño","Esperar al cirujano sin oxigenar","Agrandar el estoma con bisturí"],"explicacion":"Antes de los 7 días el trayecto no está maduro y reintroducir a ciegas puede crear una falsa vía. Se oxigena por la boca y el estoma, y si no alcanza se intuba por boca; el reemplazo se hace con visión.","fuente":"National Tracheostomy Safety Project"},{"tipo":"Medidas generales","pregunta":"¿Qué debe haber en la cabecera de todo paciente traqueostomizado?","opciones":["Cánula de repuesto del mismo tamaño y una más chica, aspiración y la información de la vía aérea","Solo un ambú","Nada especial","Un tubo de tórax"],"explicacion":"Se recomienda tener cánula de repuesto y una de menor calibre, dilatador, aspiración y un cartel con el tipo de traqueostomía y si la vía aérea superior es intubable.","fuente":"National Tracheostomy Safety Project"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hacer la traqueostomía temprana (antes de los 4 días de intubación) mejora la mortalidad?","opciones":["No: en el ensayo TracMan no redujo la mortalidad frente a la tardía","Sí, la reduce a la mitad","Sí, en todos los pacientes","Solo en pacientes quirúrgicos"],"explicacion":"En TracMan, la traqueostomía temprana no mejoró la mortalidad a 30 días ni la estancia en terapia; muchos pacientes del grupo tardío nunca la necesitaron.","fuente":"Ensayo TracMan (Young, 2013)"}]},{"id":"pared-02","tema":"Pared abdominal y laparotomías","anio":1,"titulo":"Cierre de una laparotomía mediana","vineta":"Terminás una resección de colon electiva por laparotomía mediana de 20 cm en una paciente de 64 años, IMC 29, sin otros factores de riesgo de eventración.","pasos":[{"tipo":"Técnica","pregunta":"¿Cómo cerrás la aponeurosis?","opciones":["Sutura continua con puntos pequeños: 5 a 8 mm del borde y cada 5 mm, con monofilamento de absorción lenta","Puntos separados de material de absorción rápida","Sutura continua con puntos grandes a 2 cm del borde","Cierre en masa con nailon y puntos cada 2 cm"],"explicacion":"La técnica de puntos pequeños (small bites) con sutura continua de absorción lenta, relación largo de sutura y largo de herida de al menos 4:1, reduce la eventración frente a los puntos grandes.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía; Hermes: Cicatrización y prevención de la hernia incisional"},{"tipo":"Dosis","pregunta":"¿Qué relación largo de sutura y largo de herida buscás?","opciones":["Al menos 4:1 (al menos 80 cm de sutura para 20 cm de herida)","1:1","2:1","10:1"],"explicacion":"Una relación de al menos 4:1 se asocia con menos eventración; con puntos pequeños suele superar 5:1.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía"},{"tipo":"Medidas generales","pregunta":"¿Cuándo considerarías malla profiláctica?","opciones":["En pacientes de alto riesgo de eventración (por ejemplo obesidad o aneurisma de aorta), malla sintética onlay o retromuscular","En todas las laparotomías","Nunca","Malla intraperitoneal en todos los pacientes"],"explicacion":"La guía EHS/AHS 2022 sugiere considerar malla sintética permanente profiláctica en laparotomías medianas electivas de pacientes de alto riesgo, en posición onlay o retromuscular; no se recomienda intraperitoneal.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía"}]},{"id":"apend-01","tema":"Apendicitis aguda","anio":1,"titulo":"Dolor en fosa ilíaca derecha","vineta":"Varón de 24 años. Dolor periumbilical que migró a la fosa ilíaca derecha hace 18 horas, anorexia, náuseas, temperatura 37,9 °C, defensa en la fosa ilíaca derecha. Leucocitos 14.500/mm³ con neutrofilia. Ecografía: apéndice de 9 mm no compresible, sin colección ni apendicolito.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico?","opciones":["Apendicitis aguda no complicada","Apendicitis complicada con absceso","Linfadenitis mesentérica","Ileítis por Crohn"],"explicacion":"Migración del dolor, signos inflamatorios y un apéndice mayor de 6 mm no compresible confirman la apendicitis. Sin colección, perforación ni apendicolito, es no complicada.","fuente":"WSES 2020, apendicitis aguda; Hermes: Apendicitis aguda"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Apendicectomía laparoscópica, discutiendo el tratamiento antibiótico solo como alternativa","Antibióticos solos como única opción posible","Observación sin antibióticos","Laparotomía mediana"],"explicacion":"La apendicectomía laparoscópica es el tratamiento de elección. En la no complicada sin apendicolito, los antibióticos solos son una alternativa segura en pacientes informados, con recurrencia cercana al 40 % a 5 años.","fuente":"WSES 2020; ensayo APPAC a 5 años"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás alrededor de la cirugía?","opciones":["Una dosis profiláctica preoperatoria, sin antibióticos posoperatorios","Antibióticos posoperatorios durante 7 días","Ninguno","Antibióticos orales durante 14 días"],"explicacion":"En la apendicitis no complicada alcanza la profilaxis preoperatoria; los antibióticos posoperatorios no reducen las complicaciones.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Cómo cerrás el muñón apendicular?","opciones":["Ligadura con endoloop o sutura, sin invaginación rutinaria","Invaginación en bolsa de tabaco siempre","Dejarlo abierto","Engrapadora obligatoria en todos los casos"],"explicacion":"La ligadura simple es adecuada y la invaginación no aporta beneficio. La engrapadora se reserva para bases inflamadas o anchas.","fuente":"WSES 2020, apendicitis aguda"}]},{"id":"apend-02","tema":"Apendicitis aguda","anio":1,"titulo":"Apendicitis perforada","vineta":"Mujer de 38 años con 4 días de dolor en fosa ilíaca derecha, fiebre de 38,8 °C y peritonismo localizado. TC: apéndice perforado con líquido libre y gas extraluminal, sin absceso organizado. Estable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Apendicectomía laparoscópica urgente con aspiración del líquido","Antibióticos solos","Drenaje percutáneo","Cirugía diferida a las 8 semanas"],"explicacion":"La apendicitis perforada con peritonitis requiere control quirúrgico del foco. El drenaje percutáneo es para el absceso organizado en pacientes seleccionados.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Lavado peritoneal abundante?","opciones":["No: se aspira el líquido purulento sin lavado de rutina","Sí, 10 litros siempre","Sí, con iodopovidona","Sí, con antibióticos en el lavado"],"explicacion":"El lavado no redujo los abscesos frente a la aspiración sola en la apendicitis complicada.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico indicás?","opciones":["Ceftriaxona más metronidazol","Ampicilina-sulbactam","Cefalexina por vía oral","Vancomicina sola"],"explicacion":"La infección intraabdominal comunitaria se cubre contra enterobacterias y anaerobios, por ejemplo con cefalosporina de tercera generación más metronidazol. Ampicilina-sulbactam no se recomienda por la resistencia de E. coli.","fuente":"SIS/IDSA 2010, infección intraabdominal complicada"},{"tipo":"Dosis","pregunta":"¿Qué dosis de metronidazol?","opciones":["500 mg IV cada 8 horas","50 mg IV cada 24 horas","2 g IV cada 6 horas","250 mg VO cada 48 horas"],"explicacion":"La dosis IV es 500 mg cada 8 a 12 horas o 1500 mg cada 24 horas.","fuente":"SIS/IDSA 2010, tabla de dosis"},{"tipo":"Medidas generales","pregunta":"¿Cuánto dura el antibiótico tras un buen control del foco?","opciones":["De 3 a 5 días","14 días","Hasta normalizar los leucocitos sin límite","Una sola dosis"],"explicacion":"Con control adecuado del foco, WSES 2020 propone 3 a 5 días; en el ensayo STOP-IT, 4 días fueron tan efectivos como tratamientos más largos.","fuente":"WSES 2020; ensayo STOP-IT"}]},{"id":"hernia-03","tema":"Hernia inguinal","anio":1,"titulo":"Bulto inguinal en una mujer","vineta":"Mujer de 52 años con un bulto reducible en la ingle derecha, por debajo de la línea entre la espina ilíaca y el pubis, que molesta al estar de pie.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tenés que descartar especialmente?","opciones":["Hernia crural (femoral)","Hidrocele","Varicocele","Testículo no descendido"],"explicacion":"En las mujeres las hernias crurales son proporcionalmente más frecuentes y tienen alto riesgo de estrangulación; se ubican por debajo del ligamento inguinal.","fuente":"Hermes: Hernia inguinal; Hernia crural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué abordaje preferís?","opciones":["Laparoendoscópico (TEP o TAPP), que explora y cubre el orificio crural","Lichtenstein sistemático","Observación","Bassini"],"explicacion":"En la mujer se prefiere el abordaje posterior, que permite ver y reparar una hernia crural oculta; tras un Lichtenstein en mujeres, muchas recurrencias son crurales.","fuente":"HerniaSurge; Hermes: Hernia inguinal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Indicarías espera vigilada?","opciones":["No: en la mujer, sobre todo con sospecha crural, se indica reparación","Sí, como en el varón asintomático","Sí, hasta que se complique","Sí, con faja"],"explicacion":"La espera vigilada aceptada en varones con pocos síntomas n
