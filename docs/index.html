paso rápido de contenido hiperosmolar al intestino; el dumping tardío ocurre 1 a 3 horas después por hipoglucemia.","fuente":"Hermes: Complicaciones de gastrectomía"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero para el dumping?","opciones":["Comidas pequeñas y frecuentes, pobres en azúcares simples, sin líquidos durante la comida","Reoperación","Dieta rica en azúcares","Ayuno"],"explicacion":"La mayoría mejora con medidas dietéticas; el octreótido o la reoperación se reservan para los casos refractarios.","fuente":"Hermes: Complicaciones de gastrectomía"}]},{"id":"erge-01","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Pirosis de años","vineta":"Varón de 42 años con pirosis y regurgitación desde hace 5 años, sin disfagia, sin pérdida de peso ni anemia. IMC 29.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Bajar de peso, elevar la cabecera de la cama y no cenar en las 2 a 3 horas previas a acostarse","Dieta líquida","Reposo","Ninguna"],"explicacion":"La pérdida de peso, la elevación de la cabecera y evitar comer antes de acostarse tienen respaldo para mejorar el reflujo.","fuente":"Hermes: Enfermedad por reflujo gastroesofágico"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento farmacológico inicial indicás?","opciones":["Inhibidor de la bomba de protones en dosis estándar, antes del desayuno, durante 8 semanas","Antiácidos a demanda solamente","Procinéticos solos","Antibióticos"],"explicacion":"El inhibidor de bomba en dosis estándar, tomado 30 a 60 minutos antes del desayuno durante 8 semanas, es el tratamiento inicial del reflujo típico sin síntomas de alarma.","fuente":"Hermes: Enfermedad por reflujo gastroesofágico"},{"tipo":"Estudios","pregunta":"Persiste regurgitación pese al tratamiento y quiere operarse. ¿Qué estudios pedís?","opciones":["Endoscopia, pH-metría (o pH-impedancia) sin inhibidor de bomba y manometría","Solo una radiografía de tórax","Solo endoscopia","TC de abdomen"],"explicacion":"Antes de la cirugía hay que demostrar el reflujo en forma objetiva (esofagitis grave o tiempo de exposición ácida elevado) y descartar con manometría un trastorno motor como la acalasia.","fuente":"Lyon 2.0 (2023); Hermes: Fundoplicatura laparoscópica"},{"tipo":"Diagnóstico","pregunta":"¿Qué tiempo de exposición ácida en la pH-metría es concluyente de reflujo según Lyon?","opciones":["Más del 6 %","Más del 1 %","Más del 30 %","Cualquier valor"],"explicacion":"Según el consenso de Lyon, un tiempo de exposición ácida mayor del 6 % es concluyente, menor del 4 % es normal y entre 4 y 6 % es indeterminado.","fuente":"Lyon 2.0 (2023)"},{"tipo":"Técnica","pregunta":"Los estudios confirman reflujo con motilidad normal. ¿Qué cirugía indicás?","opciones":["Fundoplicatura laparoscópica con cierre de pilares","Gastrectomía","Esofagectomía","Miotomía de Heller"],"explicacion":"La fundoplicatura laparoscópica con cierre crural es el tratamiento quirúrgico estándar; la miotomía es para acalasia.","fuente":"Hermes: Fundoplicatura laparoscópica"}]},{"id":"erge-02","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Hernia paraesofágica sintomática","vineta":"Mujer de 74 años con plenitud posprandial, dolor torácico al comer y anemia ferropénica. TC: hernia paraesofágica con más de la mitad del estómago en el tórax.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué explica la anemia?","opciones":["Úlceras o erosiones de Cameron en el cuello herniario","Cáncer gástrico seguro","Hemorroides","Déficit de vitamina B12"],"explicacion":"Las lesiones de Cameron, erosiones lineales en el cuello de la hernia, causan pérdida crónica de sangre; igual corresponde la endoscopia para descartar otras causas.","fuente":"Hermes: Hernia hiatal y paraesofágica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reparación laparoscópica programada: reducción, resección del saco, cierre de pilares y fundoplicatura","Observación","Gastrectomía total","Solo hierro"],"explicacion":"La hernia paraesofágica sintomática se repara; los pasos clave son reducir el estómago, resecar el saco, lograr esófago intraabdominal sin tensión, cerrar los pilares y agregar una fundoplicatura.","fuente":"Hermes: Hernia hiatal y paraesofágica"},{"tipo":"Diagnóstico","pregunta":"Si llegara con dolor intenso, arcadas sin vómito e imposibilidad de pasar una sonda nasogástrica, ¿qué sospecharías?","opciones":["Vólvulo gástrico agudo (tríada de Borchardt)","Infarto de miocardio","Pancreatitis","Cólico biliar"],"explicacion":"La tríada de Borchardt (dolor epigástrico, arcadas improductivas e imposibilidad de pasar la sonda) indica vólvulo gástrico, una urgencia por riesgo de isquemia.","fuente":"Hermes: Hernia hiatal y paraesofágica"}]},{"id":"mama-03","tema":"Patología mamaria y cáncer de mama","anio":3,"titulo":"Microcalcificaciones en un control","vineta":"Mujer de 52 años asintomática. Mamografía de control: microcalcificaciones finas lineales agrupadas en 2 cm del cuadrante superoexterno izquierdo (BI-RADS 4C).","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo obtenés el diagnóstico?","opciones":["Biopsia asistida por vacío guiada por estereotaxia","Control en 6 meses","Ecografía y alta","Mastectomía directa"],"explicacion":"Las microcalcificaciones sospechosas sin masa se biopsian con guía estereotáxica, habitualmente con sistemas asistidos por vacío; se deja un marcador.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"Informa carcinoma ductal in situ de alto grado. ¿Qué significa?","opciones":["Proliferación maligna confinada a los conductos, sin invasión de la membrana basal","Cáncer invasor con metástasis","Lesión benigna sin riesgo","Mastopatía fibroquística"],"explicacion":"El carcinoma in situ no atraviesa la membrana basal y por eso no da metástasis ganglionares, pero puede progresar a invasor.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Técnica","pregunta":"¿Cómo lo resecás?","opciones":["Escisión localizada con marcación (arpón o semilla) y márgenes negativos, con radiografía de la pieza","Mastectomía radical modificada","Vaciamiento axilar","Resección sin marcación"],"explicacion":"Las lesiones no palpables se localizan antes de operar y se verifica en la pieza que las calcificaciones fueron resecadas. Después de la cirugía conservadora se indica radioterapia.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hacés biopsia de ganglio centinela en la cirugía conservadora del carcinoma in situ?","opciones":["No de rutina; sí si se hace mastectomía o hay sospecha de invasión","Sí, siempre","Vaciamiento axilar siempre","Solo si es bajo grado"],"explicacion":"Sin invasión no hay metástasis ganglionares; el centinela se agrega en la mastectomía (porque después no puede hacerse) o si se sospecha un componente invasor.","fuente":"Hermes: Cirugía axilar en cáncer de mama"}]},{"id":"uro-01","tema":"Nefrectomías","anio":3,"titulo":"Masa renal incidental","vineta":"Varón de 58 años con una masa sólida de 3 cm en el polo inferior del riñón derecho, con realce, hallada en una TC por otro motivo. Función renal normal y riñón contralateral sano.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué es lo más probable?","opciones":["Carcinoma de células renales (T1a)","Quiste simple","Angiomiolipoma con grasa macroscópica","Absceso renal"],"explicacion":"Una masa sólida que realza es un carcinoma renal hasta demostrar lo contrario; menor de 4 cm es T1a. El angiomiolipoma se reconoce por grasa macroscópica.","fuente":"EAU 2024, carcinoma renal; Hermes: Nefrectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Nefrectomía parcial","Nefrectomía radical","Nefroureterectomía","Observación obligatoria"],"explicacion":"Para tumores T1 que técnicamente lo permitan se prefiere la nefrectomía parcial, porque preserva función renal con control oncológico equivalente.","fuente":"EAU 2024, carcinoma renal"},{"tipo":"Técnica","pregunta":"Si hicieras una nefrectomía radical, ¿en qué orden tratás los vasos del pedículo?","opciones":["Primero la arteria y luego la vena","Primero la vena y luego la arteria","Ambos juntos en masa","No importa"],"explicacion":"Ligar primero la arteria evita la congestión y el sangrado del riñón que se produciría al ocluir la vena con la arteria abierta.","fuente":"Hermes: Nefrectomía"}]},{"id":"uro-02","tema":"Histerectomías","anio":3,"titulo":"Uréter seccionado durante una histerectomía","vineta":"Durante una histerectomía abdominal por miomas, al ligar la arteria uterina izquierda notás orina en el campo y un uréter seccionado a 3 cm de la vejiga.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Dónde es más vulnerable el uréter en la histerectomía?","opciones":["Donde cruza por debajo de la arteria uterina, cerca del cuello","En la pelvis renal","En el cruce con el psoas a nivel lumbar","En el hilio renal"],"explicacion":"El uréter pasa por debajo de la arteria uterina a unos 1,5 a 2 cm del cuello uterino (\"el agua pasa bajo el puente\"); también es vulnerable en el ligamento infundibulopélvico.","fuente":"Hermes: Histerectomía; Lesión iatrogénica de la vía urinaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo reparás una sección del uréter distal tan cerca de la vejiga?","opciones":["Reimplante ureterovesical (con psoas hitch si hace falta), sobre un catéter doble J","Ureteroureterostomía terminoterminal","Ligadura del uréter","Nefrectomía"],"explicacion":"Las lesiones del tercio distal se reparan con reimplante en la vejiga; el psoas hitch o el colgajo de Boari ganan longitud. La anastomosis terminoterminal es para lesiones cortas del tercio medio o superior.","fuente":"AUA 2017, trauma urológico; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Medidas generales","pregunta":"¿Qué principio general guía la reparación?","opciones":["Reconocerla en la misma cirugía y repararla sin tensión, con espatulado, sutura reabsorbible y drenaje","Esperar a que dé síntomas","Sutura con material no reabsorbible","No drenar"],"explicacion":"La reparación inmediata tiene mejores resultados; se usan anastomosis sin tensión, espatuladas, con sutura reabsorbible, catéter y drenaje.","fuente":"AUA 2017, trauma urológico"}]},{"id":"colon-01","tema":"Cáncer de colon","anio":3,"titulo":"Anemia y tumor en el ciego","vineta":"Mujer de 68 años con anemia ferropénica y astenia. Colonoscopia: tumor ulcerado en el ciego; la biopsia informa adenocarcinoma. El resto del colon está libre.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudios de estadificación pedís?","opciones":["TC de tórax, abdomen y pelvis con contraste y CEA","Solo ecografía","PET-TC de rutina","Resonancia de cerebro"],"explicacion":"La estadificación del cáncer de colon se hace con TC de tórax, abdomen y pelvis y CEA basal; el PET se reserva para situaciones dudosas.","fuente":"ESMO 2023, cáncer de colon localizado; Hermes: Cirugía del cáncer de colon"},{"tipo":"Conducta quirúrgica","pregunta":"No hay metástasis. ¿Qué cirugía indicás?","opciones":["Hemicolectomía derecha con ligadura central de los vasos ileocólicos y linfadenectomía","Resección segmentaria del ciego","Colectomía total","Polipectomía endoscópica"],"explicacion":"El cáncer del ciego se trata con hemicolectomía derecha oncológica, con ligadura en el origen de los vasos y resección del mesocolon con sus ganglios.","fuente":"Hermes: Colectomía derecha"},{"tipo":"Técnica","pregunta":"¿Cuántos ganglios como mínimo debe tener la pieza para una estadificación adecuada?","opciones":["12","3","30","No importa"],"explicacion":"Al menos 12 ganglios en la pieza son necesarios para estadificar con confianza; menos de 12 se considera factor de riesgo en estadio II.","fuente":"ESMO 2023, cáncer de colon localizado"},{"tipo":"Fármaco","pregunta":"La anatomía patológica es pT3 N1 (estadio III). ¿Qué indicás?","opciones":["Quimioterapia adyuvante con fluoropirimidina y oxaliplatino (CAPOX o FOLFOX)","Solo seguimiento","Radioterapia adyuvante","Inmunoterapia de rutina"],"explicacion":"El estadio III recibe quimioterapia adyuvante con oxaliplatino y fluoropirimidina; reduce la recurrencia y la mortalidad.","fuente":"ESMO 2023, cáncer de colon localizado"},{"tipo":"Dosis","pregunta":"¿Cuánto dura en un estadio III de bajo riesgo (T1-3 N1) con CAPOX?","opciones":["3 meses","2 semanas","2 años","12 meses"],"explicacion":"El análisis IDEA mostró que 3 meses de CAPOX son no inferiores a 6 en el estadio III de bajo riesgo, con mucha menos neuropatía; en alto riesgo (T4 o N2) se prefieren 6 meses.","fuente":"Ensayo IDEA; ESMO 2023"}]},{"id":"colon-02","tema":"Cáncer de colon","anio":3,"titulo":"Oclusión por cáncer de sigma","vineta":"Varón de 76 años con distensión, vómitos y sin eliminación de gases desde hace 3 días. TC: tumor estenosante del sigma con colon proximal dilatado (ciego de 9 cm) sin perforación ni metástasis. Estable.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene un ciego tan dilatado con válvula ileocecal competente?","opciones":["Perforación del ciego por la obstrucción en asa cerrada","Ninguno","Vólvulo de sigma","Pancreatitis"],"explicacion":"Con válvula competente el colon queda en asa cerrada; el ciego es el segmento de mayor diámetro y el que se perfora, sobre todo por encima de 10 a 12 cm.","fuente":"Hermes: Cirugía del cáncer de colon"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué opciones son razonables?","opciones":["Resección con colostomía terminal (Hartmann) o, en centros con experiencia, prótesis como puente a la cirugía","Observar con sonda nasogástrica una semana","Colonoscopia y alta","Quimioterapia sin descompresión"],"explicacion":"La obstrucción izquierda se resuelve con resección (Hartmann o anastomosis con o sin ostomía de protección según el paciente) o con prótesis como puente; ambas son aceptables según el contexto y la experiencia.","fuente":"Hermes: Cirugía del cáncer de colon"},{"tipo":"Técnica","pregunta":"En la laparotomía el ciego está isquémico con desgarros serosos. ¿Qué hacés?","opciones":["Colectomía subtotal o total incluyendo el ciego y el tumor","Solo resección del sigma","Cecostomía","Sutura de los desgarros y Hartmann"],"explicacion":"Si el ciego está comprometido, se incluye en la resección con una colectomía subtotal que también trata el tumor.","fuente":"Hermes: Cirugía del cáncer de colon"}]},{"id":"colon-03","tema":"Cáncer de colon","anio":3,"titulo":"Cáncer de colon en un hombre de 38 años","vineta":"Varón de 38 años con un adenocarcinoma de colon derecho. Su padre tuvo cáncer de colon a los 45 años y una tía, cáncer de endometrio a los 50.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué síndrome sospechás?","opciones":["Síndrome de Lynch","Poliposis adenomatosa familiar","Síndrome de Peutz-Jeghers","Cáncer esporádico sin estudio"],"explicacion":"Cáncer colorrectal joven, colon derecho y familiares con cáncer de colon y endometrio sugieren síndrome de Lynch (deficiencia de reparación de errores de apareamiento).","fuente":"Hermes: Síndrome de Lynch"},{"tipo":"Estudios","pregunta":"¿Qué pedís sobre el tumor?","opciones":["Inmunohistoquímica de las proteínas de reparación (MLH1, MSH2, MSH6, PMS2) o inestabilidad de microsatélites","Solo CEA","Mutación APC en el tumor","Nada"],"explicacion":"Se recomienda estudiar la reparación de errores de apareamiento en todo cáncer colorrectal; si está deficiente, se completa con estudio germinal y asesoramiento genético.","fuente":"Hermes: Síndrome de Lynch"},{"tipo":"Medidas generales","pregunta":"Se confirma Lynch. ¿Cómo vigilás a sus hermanos portadores?","opciones":["Colonoscopia cada 1 a 2 años desde los 20 a 25 años (o según gen)","Colonoscopia cada 10 años desde los 50","Sangre oculta anual","Ninguna"],"explicacion":"Los portadores tienen cánceres de intervalo por la carcinogénesis acelerada; la colonoscopia se hace cada 1 a 2 años desde los 20 a 25 años, ajustada según el gen.","fuente":"Hermes: Síndrome de Lynch"}]},{"id":"colon-04","tema":"Cáncer de colon","anio":3,"titulo":"Cientos de pólipos en una joven","vineta":"Mujer de 22 años con rectorragia. Colonoscopia: más de 500 adenomas en todo el colon y el recto. Su madre murió de cáncer de colon a los 40.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Poliposis adenomatosa familiar clásica","Síndrome de Lynch","Poliposis juvenil","Colitis ulcerosa"],"explicacion":"Cientos a miles de adenomas por mutación germinal de APC definen la poliposis adenomatosa familiar clásica; el riesgo de cáncer es casi del 100 % sin cirugía.","fuente":"Hermes: Poliposis adenomatosa familiar"},{"tipo":"Conducta quirúrgica","pregunta":"Con el recto tapizado de pólipos, ¿qué cirugía indicás?","opciones":["Proctocolectomía total con reservorio ileal y anastomosis ileoanal","Colectomía total con ileorrecto anastomosis","Hemicolectomía izquierda","Polipectomías endoscópicas periódicas"],"explicacion":"Con compromiso rectal importante se reseca el recto con reservorio ileal; la ileorrecto anastomosis se reserva para recto con pocos pólipos.","fuente":"Hermes: Poliposis adenomatosa familiar"},{"tipo":"Medidas generales","pregunta":"¿Qué vigilancia extracolónica es prioritaria?","opciones":["Endoscopia alta con visión lateral por los adenomas duodenales y de la papila","Mamografía anual desde los 20","Colangiorresonancia anual","Ninguna"],"explicacion":"Tras la colectomía, el cáncer duodenal o periampular y los desmoides son causas principales de muerte; se vigila el duodeno con endoscopio de visión lateral.","fuente":"Hermes: Poliposis adenomatosa familiar"}]},{"id":"recto-01","tema":"Cáncer de recto","anio":3,"titulo":"Tumor de recto medio localmente avanzado","vineta":"Varón de 60 años con rectorragia y cambio del ritmo evacuatorio. Adenocarcinoma a 7 cm del margen anal. Resonancia: T3c N1, fascia mesorrectal amenazada (1 mm). TC sin metástasis.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio define la estadificación local?","opciones":["Resonancia magnética pélvica de alta resolución","Solo TC","Ecografía abdominal","Colonoscopia virtual"],"explicacion":"La resonancia pélvica define T, N, la distancia a la fascia mesorrectal, la invasión venosa extramural y la relación con el esfínter, que deciden el tratamiento.","fuente":"ESMO 2017, cáncer de recto; Hermes: Cirugía del cáncer de recto"},{"tipo":"Conducta quirúrgica","pregunta":"Con la fascia mesorrectal amenazada, ¿qué indicás antes de la cirugía?","opciones":["Tratamiento neoadyuvante (quimiorradioterapia o neoadyuvancia total)","Cirugía inmediata sin neoadyuvancia","Solo quimioterapia paliativa","Polipectomía"],"explicacion":"El margen circunferencial amenazado es indicación de neoadyuvancia; la neoadyuvancia total (ensayos RAPIDO y PRODIGE 23) mejora la respuesta y reduce las metástasis.","fuente":"ESMO 2017; ensayos RAPIDO y PRODIGE 23"},{"tipo":"Técnica","pregunta":"¿Cuál es el principio técnico clave de la resección?","opciones":["Escisión total del mesorrecto en el plano areolar entre fascia propia y presacra, con mesorrecto intacto","Disección intramesorrectal rápida","Resección local transanal","Disección por fuera de la fascia presacra"],"explicacion":"La escisión total del mesorrecto en el plano \"sagrado\" reduce la recurrencia local; la calidad del mesorrecto se informa en la pieza. Disecar por detrás de la fascia presacra produce sangrado venoso grave.","fuente":"Hermes: Escisión total del mesorrecto"},{"tipo":"Conducta quirúrgica","pregunta":"Tras la neoadyuvancia hay respuesta clínica completa en endoscopia y resonancia. ¿Qué opción podés ofrecer?","opciones":["Vigilancia estrecha (\"watch and wait\") en un programa estructurado, explicando el riesgo de rebrote","Alta sin seguimiento","Amputación abdominoperineal obligatoria","Más radioterapia de rutina"],"explicacion":"Con respuesta clínica completa puede ofrecerse vigilancia intensiva con endoscopia y resonancia; alrededor de un cuarto rebrota, casi siempre rescatable con cirugía.","fuente":"Hermes: Vigilancia y espera en cáncer de recto"}]},{"id":"recto-02","tema":"Cáncer de recto","anio":3,"titulo":"Tumor que invade el esfínter","vineta":"Mujer de 66 años con adenocarcinoma de recto a 2 cm del margen anal que, en la resonancia tras la neoadyuvancia, sigue invadiendo el esfínter externo.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Amputación abdominoperineal con colostomía terminal definitiva","Resección anterior baja con anastomosis","Resección local transanal","Solo colostomía"],"explicacion":"La invasión del esfínter externo impide preservar el esfínter con márgenes oncológicos; la amputación abdominoperineal es la opción.","fuente":"Hermes: Amputación abdominoperineal; Preservación esfinteriana en cáncer de recto"},{"tipo":"Técnica","pregunta":"¿Qué evita la \"cintura\" de la pieza en el plano del elevador?","opciones":["Resección extraelevadora (cilíndrica), con los elevadores en la pieza","Disección más cerca del tumor","Disección intraesfinteriana","No dejar drenaje"],"explicacion":"La disección que sigue el mesorrecto hasta el elevador deja una pieza con cintura y riesgo de margen positivo y perforación; la técnica extraelevadora incluye los elevadores.","fuente":"Hermes: Amputación abdominoperineal"},{"tipo":"Medidas generales","pregunta":"Antes de la cirugía, ¿qué hacés con la ostomía?","opciones":["Marcar el sitio con la paciente sentada y parada, con estomaterapia","Elegir el sitio en el quirófano","Ubicarla en la cicatriz mediana","Nada"],"explicacion":"La marcación preoperatoria por estomaterapia reduce las complicaciones y mejora la calidad de vida.","fuente":"Hermes: Amputación abdominoperineal"}]},{"id":"gastrico-01","tema":"Cáncer gástrico","anio":3,"titulo":"Adenocarcinoma gástrico localmente avanzado","vineta":"Varón de 62 años con pérdida de peso y anemia. Endoscopia: tumor ulcerado de antro. Biopsia: adenocarcinoma. TC: engrosamiento parietal con ganglios perigástricos, sin metástasis visibles.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio agregás a la estadificación en un tumor avanzado (cT3 o mayor)?","opciones":["Laparoscopia de estadificación con citología peritoneal","Colonoscopia","Centellograma óseo de rutina","Ninguno"],"explicacion":"La laparoscopia detecta metástasis peritoneales que la TC no ve, evitando laparotomías innecesarias; la citología positiva equivale a enfermedad M1.","fuente":"Hermes: Cáncer gástrico"},{"tipo":"Fármaco","pregunta":"Sin carcinomatosis, ¿qué tratamiento sistémico perioperatorio indicás?","opciones":["Quimioterapia perioperatoria con FLOT","Ninguno","Solo radioterapia","Hormonoterapia"],"explicacion":"En el ensayo FLOT4, la quimioterapia perioperatoria con 5-FU, leucovorina, oxaliplatino y docetaxel mejoró la supervivencia frente a ECF/ECX.","fuente":"Ensayo FLOT4"},{"tipo":"Dosis","pregunta":"¿Cuántos ciclos de FLOT se dan?","opciones":["4 ciclos antes y 4 después de la cirugía","1 ciclo antes","12 ciclos solo después","2 años de mantenimiento"],"explicacion":"El esquema FLOT4 son 4 ciclos preoperatorios y 4 posoperatorios, cada 2 semanas.","fuente":"Ensayo FLOT4"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás para un cáncer de antro?","opciones":["Gastrectomía distal (subtotal) con linfadenectomía D2","Gastrectomía total con D1","Resección en cuña","Gastroyeyunostomía"],"explicacion":"El tumor distal con margen proximal adecuado se trata con gastrectomía subtotal y D2, con la misma supervivencia que la total y mejor calidad de vida.","fuente":"Hermes: Gastrectomía; Linfadenectomía D2 gástrica"},{"tipo":"Técnica","pregunta":"¿Cuántos ganglios como mínimo debe tener la pieza?","opciones":["16 o más","5","2","No importa"],"explicacion":"Se requieren al menos 16 ganglios para una estadificación N adecuada; la D2 bien hecha suele obtener más.","fuente":"Hermes: Linfadenectomía D2 gástrica"}]},{"id":"esofago-01","tema":"Cáncer esofágico","anio":3,"titulo":"Disfagia progresiva en un hombre con Barrett","vineta":"Varón de 64 años con Barrett conocido sin control, disfagia progresiva a sólidos y pérdida de 8 kg. Endoscopia: tumor de esófago distal y unión gastroesofágica. Biopsia: adenocarcinoma. TC y PET: T3 N1, sin metástasis.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés con el estado nutricional antes del tratamiento?","opciones":["Evaluación y soporte nutricional, por vía enteral si hace falta","Nada","Ayuno hasta la cirugía","Nutrición parenteral de rutina"],"explicacion":"La desnutrición es frecuente por la disfagia y aumenta las complicaciones; se prioriza la vía enteral.","fuente":"Hermes: Cirugía del cáncer de esófago"},{"tipo":"Fármaco","pregunta":"Para un adenocarcinoma localmente avanzado, ¿qué tratamiento preoperatorio mostró mejor supervivencia en el ensayo ESOPEC?","opciones":["Quimioterapia perioperatoria FLOT","Quimiorradioterapia CROSS","Ninguno","Inmunoterapia sola"],"explicacion":"En ESOPEC, en adenocarcinoma esofágico resecable, FLOT perioperatorio logró mayor supervivencia que CROSS. CROSS sigue siendo estándar en el carcinoma escamoso.","fuente":"Ensayo ESOPEC; ensayo CROSS"},{"tipo":"Técnica","pregunta":"¿Qué abordaje se usa habitualmente para un tumor del esófago distal?","opciones":["Esofagectomía de Ivor Lewis (abdominal y torácica derecha, anastomosis intratorácica)","Esofagectomía transhiatal obligatoria","Resección endoscópica","Gastrectomía total sola"],"explicacion":"Ivor Lewis permite linfadenectomía en dos campos y anastomosis intratorácica para tumores distales; el abordaje en tres campos (McKeown) se prefiere en tumores más altos.","fuente":"Hermes: Esofagectomía"},{"tipo":"Diagnóstico","pregunta":"En el día 6 posoperatorio aparece fiebre, taquicardia y derrame pleural derecho con líquido turbio. ¿Qué sospechás?","opciones":["Fuga de la anastomosis intratorácica","Neumonía sin relación","Quilotórax","Atelectasia"],"explicacion":"Fiebre, taquicardia y derrame turbio tras una anastomosis intratorácica son fuga hasta demostrar lo contrario; se confirma con endoscopia o TC con contraste oral.","fuente":"Hermes: Esofagectomía"}]},{"id":"cyc-01","tema":"Glándulas salivales","anio":4,"titulo":"Tumor parotídeo de crecimiento lento","vineta":"Mujer de 45 años con un nódulo de 2,5 cm en la parótida derecha, móvil, indoloro, de 3 años de evolución. Función facial normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué es lo más probable?","opciones":["Adenoma pleomorfo","Carcinoma mucoepidermoide de alto grado","Linfoma","Parotiditis"],"explicacion":"El adenoma pleomorfo es el tumor parotídeo más frecuente: indoloro, de crecimiento lento y sin parálisis facial. Dolor, fijación o parálisis sugieren malignidad.","fuente":"Hermes: Parotidectomía"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Ecografía o resonancia y punción con aguja fina","Biopsia incisional abierta","Sialografía","Ninguno"],"explicacion":"La imagen define extensión y lóbulo, y la punción orienta la histología. La biopsia abierta está contraindicada por el riesgo de siembra y de lesión del nervio.","fuente":"Hermes: Parotidectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Parotidectomía superficial (o parcial) con identificación y preservación del nervio facial","Enucleación del tumor","Parotidectomía total con sacrificio del nervio","Observación"],"explicacion":"La enucleación deja restos de la pseudocápsula y tiene alta recurrencia; se reseca con un margen de tejido sano preservando el nervio facial.","fuente":"Hermes: Parotidectomía"},{"tipo":"Técnica","pregunta":"¿Qué reparos usás para encontrar el tronco del nervio facial?","opciones":["El puntero tragal, el vientre posterior del digástrico y la sutura timpanomastoidea, combinados","La arteria facial","El conducto de Stensen en su desembocadura","La vena yugular externa como único reparo"],"explicacion":"El tronco se busca con varios reparos concordantes: profundo e inferior al puntero tragal, a nivel del vientre posterior del digástrico y por delante de la sutura timpanomastoidea.","fuente":"Hermes: Parotidectomía"},{"tipo":"Diagnóstico","pregunta":"Meses después suda y se enrojece la mejilla al comer. ¿Qué es?","opciones":["Síndrome de Frey (sudoración gustatoria)","Recidiva tumoral","Fístula salival","Parálisis facial"],"explicacion":"Las fibras parasimpáticas seccionadas regeneran hacia las glándulas sudoríparas de la piel; la toxina botulínica es un tratamiento eficaz.","fuente":"Hermes: Parotidectomía"}]},{"id":"cyc-02","tema":"Glándulas salivales","anio":4,"titulo":"Tumefacción submaxilar al comer","vineta":"Varón de 50 años con episodios de tumefacción dolorosa submaxilar izquierda al comer. Ecografía: cálculo de 8 mm dentro de la glándula submaxilar, con sialoadenitis crónica.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Sialolitiasis submaxilar con sialoadenitis crónica","Tumor submaxilar","Adenopatía metastásica","Quiste branquial"],"explicacion":"El cólico salival con las comidas y un cálculo indican sialolitiasis; la submaxilar es la glándula más afectada por su saliva más viscosa y su conducto ascendente.","fuente":"Hermes: Cirugía submandibular y sublingual"},{"tipo":"Conducta quirúrgica","pregunta":"El cálculo es intraglandular y las crisis se repiten. ¿Qué indicás?","opciones":["Submaxilectomía","Extracción transoral del cálculo","Parotidectomía","Antibióticos de por vida"],"explicacion":"Los cálculos distales del conducto se extraen por vía oral, pero los intraglandulares con sialoadenitis recurrente se tratan con resección de la glándula (o sialendoscopia donde esté disponible).","fuente":"Hermes: Cirugía submandibular y sublingual"},{"tipo":"Técnica","pregunta":"¿Qué nervios debés proteger en la submaxilectomía?","opciones":["Rama marginal mandibular del facial, nervio lingual e hipogloso","Nervio laríngeo recurrente y vago","Nervio frénico","Nervio espinal y plexo braquial"],"explicacion":"La incisión se hace 2 a 3 cm debajo de la mandíbula para proteger la rama marginal; en la profundidad, el lingual se separa del ganglio submaxilar y el hipogloso corre bajo la glándula.","fuente":"Hermes: Cirugía submandibular y sublingual; Anatomía quirúrgica del cuello"}]},{"id":"cyc-03","tema":"Cáncer de cavidad oral","anio":4,"titulo":"Úlcera en el borde lingual","vineta":"Varón de 62 años fumador y bebedor con una úlcera indurada de 2 cm en el borde lateral de la lengua de 2 meses. No hay adenopatías palpables. Antes tuvo una placa blanca en la misma zona.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás y cómo lo confirmás?","opciones":["Carcinoma escamoso de lengua; biopsia de la lesión","Úlcera traumática; observar 6 meses","Aftas; corticoides tópicos","Leucoplasia sin riesgo; alta"],"explicacion":"Una úlcera indurada persistente en un fumador y bebedor es un carcinoma escamoso hasta demostrar lo contrario. La leucoplasia y sobre todo la eritroplasia son lesiones precancerosas que se biopsian.","fuente":"Hermes: Glosectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Con qué margen resecás el tumor primario?","opciones":["Alrededor de 1 cm de tejido sano en todas las direcciones","1 mm","5 cm","Sin margen; solo raspado"],"explicacion":"La glosectomía parcial busca márgenes de alrededor de 1 cm, que se acortan en la pieza por retracción; un margen cercano o positivo empeora el control local.","fuente":"Hermes: Glosectomía"},{"tipo":"Conducta quirúrgica","pregunta":"La profundidad de invasión es de 6 mm y el cuello es clínicamente negativo. ¿Qué hacés con el cuello?","opciones":["Vaciamiento cervical electivo (niveles I a III)","Observación del cuello","Vaciamiento radical clásico","Radioterapia sola sin cirugía del primario"],"explicacion":"Con profundidad de invasión mayor de 3 a 4 mm el riesgo de metástasis ocultas es alto; en el ensayo de D'Cruz, el vaciamiento electivo mejoró la supervivencia frente a esperar.","fuente":"Ensayo de D'Cruz 2015; Hermes: Vaciamiento ganglionar cervical"}]},{"id":"cyc-04","tema":"Vaciamiento ganglionar cervical","anio":4,"titulo":"Metástasis cervical y hombro caído","vineta":"Varón de 58 años con metástasis de carcinoma escamoso en niveles II y III izquierdos. Se planifica vaciamiento cervical.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué conserva el vaciamiento radical modificado tipo III frente al radical clásico?","opciones":["El nervio espinal accesorio, la vena yugular interna y el músculo esternocleidomastoideo","Solo la carótida","Los ganglios del nivel II","La glándula tiroides"],"explicacion":"El radical clásico reseca niveles I a V con el espinal, la yugular interna y el esternocleidomastoideo; el modificado preserva una o más de esas estructuras no linfáticas.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Si después tiene dolor de hombro, escápula alada y no puede abducir por encima de 90°, ¿qué estructura se lesionó?","opciones":["Nervio espinal accesorio","Nervio frénico","Hipogloso","Rama marginal mandibular"],"explicacion":"La lesión del espinal denerva el trapecio y produce el síndrome del hombro doloroso, con caída del hombro y limitación de la abducción.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Diagnóstico","pregunta":"Al reiniciar la dieta sale líquido lechoso por el drenaje izquierdo. ¿Qué es?","opciones":["Fístula quilosa por lesión del conducto torácico en el nivel IV","Fístula salival","Infección de la herida","Seroma normal"],"explicacion":"El conducto torácico termina en el confluente yugulosubclavio izquierdo; su lesión en el nivel IV da salida de quilo con la alimentación.","fuente":"Hermes: Vaciamiento ganglionar cervical"},{"tipo":"Medidas generales","pregunta":"¿Cómo la manejás inicialmente si el débito es bajo?","opciones":["Dieta sin grasas o con triglicéridos de cadena media, drenaje y compresión","Reexploración inmediata siempre","Retirar el drenaje","Dieta rica en grasas"],"explicacion":"La mayoría de las fístulas de bajo débito cierran con dieta con triglicéridos de cadena media (que se absorben por vía portal), compresión y drenaje; la reexploración se reserva para alto débito persistente.","fuente":"Hermes: Vaciamiento ganglionar cervical"}]},{"id":"torax-01","tema":"Empiema y decorticación","anio":4,"titulo":"Neumonía con derrame tabicado","vineta":"Varón de 55 años con neumonía de 7 días que sigue febril con antibióticos. Ecografía: derrame pleural derecho moderado con tabiques. Toracocentesis: líquido turbio, pH 7,05, glucosa 30 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Derrame paraneumónico complicado o empiema en fase fibrinopurulenta","Derrame paraneumónico simple","Trasudado por insuficiencia cardíaca","Empiema organizado con coraza fibrosa"],"explicacion":"pH menor de 7,2, glucosa baja y tabiques indican derrame complicado en fase fibrinopurulenta; la fase organizada tiene una cáscara pleural que atrapa el pulmón.","fuente":"BTS 2023, enfermedad pleural; Hermes: Empiema pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Drenaje pleural con tubo, guiado por imagen, además de antibióticos","Solo cambiar el antibiótico","Toracocentesis evacuadora semanal","Observar"],"explicacion":"El pH menor de 7,2 o el pus son indicación de drenaje; los antibióticos solos no resuelven un espacio pleural infectado.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"¿Qué espectro deben cubrir los antibióticos en la infección pleural adquirida en la comunidad?","opciones":["Incluir anaerobios (por ejemplo, amoxicilina-clavulánico)","Solo gramnegativos","Solo antifúngicos","No hacen falta"],"explicacion":"La infección pleural comunitaria es frecuentemente polimicrobiana con anaerobios; BTS indica cubrirlos salvo infección neumocócica demostrada. Los aminoglucósidos no penetran bien la pleura.","fuente":"BTS 2023, enfermedad pleural"},{"tipo":"Fármaco","pregunta":"A las 48 horas el tubo drena poco y persiste la colección tabicada. Si no va a cirugía, ¿qué tratamiento intrapleural indicás?","opciones":["Alteplasa más DNasa intrapleurales","Estreptoquinasa sola","Antibióticos intrapleurales","Corticoides intrapleurales"],"explicacion":"En MIST-2, la combinación de alteplasa y DNasa mejoró el drenaje y redujo la derivación a cirugía; cada fármaco solo no fue eficaz.","fuente":"Ensayo MIST-2; BTS 2023"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Alteplasa 10 mg y DNasa 5 mg cada 12 horas durante 3 días","Alteplasa 100 mg en dosis única","DNasa 50 mg por día durante 1 mes","Alteplasa 1 mg semanal"],"explicacion":"El esquema de MIST-2 es alteplasa 10 mg y DNasa 5 mg por el tubo, dos veces por día durante 3 días (6 dosis), clampeando el tubo 1 hora.","fuente":"Ensayo MIST-2"},{"tipo":"Conducta quirúrgica","pregunta":"Si el pulmón quedara atrapado por una coraza fibrosa con sepsis persistente, ¿qué indicás?","opciones":["Decorticación por videotoracoscopia (o abierta)","Más días de tubo","Neumonectomía","Pleurodesis"],"explicacion":"La decorticación remueve la coraza para que el pulmón reexpanda y se controle la infección; se prefiere por videotoracoscopia cuando es posible.","fuente":"Hermes: Empiema pleural"}]},{"id":"torax-02","tema":"Cáncer de pulmón","anio":4,"titulo":"Nódulo pulmonar que creció","vineta":"Mujer de 66 años, exfumadora. Nódulo sólido de 1,8 cm periférico en el lóbulo superior derecho que creció en 6 meses. PET-TC: captación en el nódulo, sin ganglios ni metástasis.","pasos":[{"tipo":"Estudios","pregunta":"Si en la TC o el PET hubiera ganglios mediastinales sospechosos, ¿cómo los estadificarías?","opciones":["Punción guiada por ecoendoscopia bronquial (EBUS) o mediastinoscopia","Solo con la TC","Resonancia de tórax","No importa el mediastino"],"explicacion":"Los ganglios mediastinales sospechosos deben confirmarse con muestra de tejido antes de decidir la cirugía, porque el N2 cambia el tratamiento.","fuente":"Hermes: Cáncer de pulmón; Estadificación TNM del cáncer torácico"},{"tipo":"Estudios","pregunta":"¿Qué evaluación funcional pedís antes de resecar?","opciones":["Espirometría y difusión de monóxido de carbono, calculando los valores predichos posoperatorios","Solo una radiografía","Un electrocardiograma alcanza","Ninguna"],"explicacion":"El VEF1 y la DLCO predichos posoperatorios estiman el riesgo; si ambos superan el 60 % el riesgo es bajo, y si no se agrega una prueba de esfuerzo.","fuente":"ERS/ESTS 2009, evaluación funcional; Hermes: Evaluación fisiológica para resección pulmonar"},{"tipo":"Estudios","pregunta":"Con valores predichos bajos, ¿qué consumo máximo de oxígeno contraindica una resección mayor?","opciones":["Menor de 10 ml/kg/min","Menor de 40 ml/kg/min","Mayor de 20 ml/kg/min","Ninguno; no se mide"],"explicacion":"Un consumo máximo de oxígeno menor de 10 ml/kg/min indica riesgo muy alto para resecciones mayores; mayor de 20 indica riesgo bajo.","fuente":"ERS/ESTS 2009, evaluación funcional"},{"tipo":"Conducta quirúrgica","pregunta":"Función adecuada y diagnóstico de adenocarcinoma periférico de 1,8 cm, N0. ¿Qué resección es aceptable además de la lobectomía?","opciones":["Segmentectomía anatómica con márgenes adecuados y estudio ganglionar","Resección en cuña sin ganglios","Neumonectomía","Ninguna; solo radioterapia"],"explicacion":"En tumores periféricos de 2 cm o menos y N0, los ensayos JCOG0802 y CALGB 140503 mostraron resultados oncológicos no inferiores con resección sublobar frente a lobectomía.","fuente":"Ensayos JCOG0802 y CALGB 140503"},{"tipo":"Técnica","pregunta":"¿Qué hacés siempre con los ganglios durante la resección?","opciones":["Muestreo o disección ganglionar mediastinal sistemática","Nada si el PET fue negativo","Solo los ganglios hiliares visibles","Vaciamiento cervical"],"explicacion":"El PET puede no detectar metástasis ganglionares; la evaluación ganglionar sistemática estadifica y define la adyuvancia.","fuente":"Hermes: Resección pulmonar anatómica"}]},{"id":"higado-01","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Lesión hepática en una mujer que toma anticonceptivos","vineta":"Mujer de 32 años que toma anticonceptivos orales hace 10 años. Resonancia: lesión de 6 cm en el segmento VI compatible con adenoma hepatocelular. Asintomática.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero?","opciones":["Suspender los anticonceptivos y bajar de peso si corresponde","Nada","Aumentar la dosis hormonal","Quimioterapia"],"explicacion":"Los adenomas dependen de estrógenos; suspender los anticonceptivos puede reducirlos.","fuente":"Hermes: Tumores benignos del hígado"},{"tipo":"Conducta quirúrgica","pregunta":"A los 6 meses sigue midiendo más de 5 cm. ¿Qué hacés?","opciones":["Resección","Observación indefinida","Trasplante","Ablación de rutina"],"explicacion":"Los adenomas que persisten mayores de 5 cm tras suspender los estrógenos tienen riesgo de sangrado y transformación maligna y se resecan; en el varón se resecan siempre.","fuente":"Hermes: Tumores benignos del hígado"},{"tipo":"Diagnóstico","pregunta":"En comparación, ¿qué conducta tiene un hemangioma típico asintomático de 6 cm?","opciones":["Ninguna: no se trata ni necesita seguimiento","Resección","Embolización","Biopsia percutánea"],"explicacion":"El hemangioma típico asintomático no requiere tratamiento, independientemente del tamaño; la biopsia está contraindicada por riesgo de sangrado.","fuente":"Hermes: Tumores benignos del hígado"}]},{"id":"higado-02","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Nódulo en un cirrótico","vineta":"Varón de 58 años con cirrosis por hepatitis C tratada, Child-Pugh A, sin várices ni plaquetas bajas. En la vigilancia aparece un nódulo único de 3,5 cm en el segmento VI con realce arterial y lavado portal. AFP 120 ng/ml. Buen estado general.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo se confirma el diagnóstico?","opciones":["Con la imagen típica en un cirrótico, sin biopsia","Biopsia obligatoria","Solo con la AFP","Laparoscopia diagnóstica"],"explicacion":"En el hígado cirrótico, un nódulo de 1 cm o más con realce arterial y lavado es diagnóstico de carcinoma hepatocelular sin biopsia.","fuente":"Hermes: Carcinoma hepatocelular"},{"tipo":"Conducta quirúrgica","pregunta":"Nódulo único, función preservada y sin hipertensión portal. ¿Qué tratamiento indicás?","opciones":["Resección hepática (BCLC estadio A)","Sorafenib","Solo cuidados paliativos","Quimioembolización paliativa"],"explicacion":"En BCLC, el tumor único con función preservada y sin hipertensión portal clínicamente significativa es candidato ideal a resección; la ablación es alternativa en tumores pequeños.","fuente":"BCLC 2022; Hermes: Carcinoma hepatocelular"},{"tipo":"Medidas generales","pregunta":"¿Qué remanente hepático mínimo necesitás en un hígado cirrótico?","opciones":["Alrededor del 40 %","5 %","20 % igual que en hígado sano","No importa"],"explicacion":"El remanente mínimo es cercano al 20 % en hígado sano, 30 % en hígado dañado por quimioterapia y 40 % en cirrosis.","fuente":"Hermes: Evaluación y principios de la hepatectomía"},{"tipo":"Conducta quirúrgica","pregunta":"Si tuviera hipertensión portal, ¿qué criterios usarías para indicar un trasplante?","opciones":["Milán: un nódulo de hasta 5 cm o hasta 3 nódulos de hasta 3 cm, sin invasión vascular ni metástasis","Cualquier tamaño","Solo tumores mayores de 10 cm","Invasión portal"],"explicacion":"Los criterios de Milán seleccionan pacientes con resultados de trasplante similares a los de cirróticos sin tumor.","fuente":"Criterios de Milán; Hermes: Carcinoma hepatocelular"}]},{"id":"higado-03","tema":"Tumores hepáticos y hepatectomías","anio":4,"titulo":"Metástasis hepáticas de cáncer de colon","vineta":"Mujer de 60 años operada de un cáncer de sigma hace 1 año. TC: tres metástasis en el hígado derecho, sin enfermedad extrahepática. Hígado izquierdo libre.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué define si son resecables?","opciones":["Poder resecar toda la enfermedad con margen dejando un remanente suficiente y bien irrigado","Que sean menos de 4","Que midan menos de 5 cm","Que estén en un solo lóbulo"],"explicacion":"El criterio actual no es el número ni el tamaño sino la posibilidad de una resección R0 con un remanente funcional suficiente, con flujo y drenaje biliar.","fuente":"Hermes: Metástasis hepáticas"},{"tipo":"Medidas generales","pregunta":"El remanente estimado es del 18 % en hígado sano. ¿Qué podés hacer para operarla?","opciones":["Embolización portal derecha para hipertrofiar el remanente","Operar igual","Descartar la cirugía","Radioterapia hepática total"],"explicacion":"La embolización portal del lado a resecar hipertrofia el remanente en algunas semanas; si no crece lo suficiente, se replantea la estrategia.","fuente":"Hermes: Evaluación y principios de la hepatectomía"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento sistémico perioperatorio mostró beneficio en supervivencia libre de progresión?","opciones":["FOLFOX perioperatorio","Ninguno","Tamoxifeno","Gemcitabina sola"],"explicacion":"En el ensayo EORTC 40983, 6 ciclos de FOLFOX antes y 6 después de la resección mejoraron la supervivencia libre de progresión.","fuente":"Ensayo EORTC 40983"}]},{"id":"hidatid-01","tema":"Quiste hidatídico hepático","anio":4,"titulo":"Quiste hepático en un trabajador rural","vineta":"Varón de 40 años de zona rural con perros. Dolor en hipocondrio derecho. Ecografía: quiste de 9 cm en el segmento VII con membranas desprendidas flotando (signo del camalote). Serología positiva.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué estadio de la OMS tiene?","opciones":["CE3a (activo transicional, membrana desprendida)","CE1","CE4","CE5"],"explicacion":"La membrana desprendida dentro del quiste (camalote) define CE3a; CE1 es unilocular con pared visible, CE2 multivesicular, y CE4-CE5 son inactivos y calcificados.","fuente":"WHO-IWGE 2010; Hermes: Equinococosis hepática"},{"tipo":"Fármaco","pregunta":"¿Qué antiparasitario indicás alrededor de la cirugía o la punción?","opciones":["Albendazol","Metronidazol","Ivermectina","Ninguno"],"explicacion":"El albendazol perioperatorio reduce el riesgo de hidatidosis secundaria por derrame de escólices.","fuente":"WHO-IWGE 2010; Hermes: Equinococosis hepática"},{"tipo":"Dosis","pregunta":"¿Con qué dosis?","opciones":["10 a 15 mg/kg/día en dos tomas con comidas grasas (en el adulto, habitualmente 400 mg cada 12 horas)","1 g en dosis única","50 mg/kg/día","400 mg por semana"],"explicacion":"La dosis es de 10 a 15 mg/kg/día divididos en dos tomas, con comidas ricas en grasas para mejorar la absorción. Se controlan las enzimas hepáticas y el hemograma.","fuente":"WHO-IWGE 2010"},{"tipo":"Técnica","pregunta":"En la cirugía, ¿qué hacés antes de abrir el quiste?","opciones":["Proteger el campo con compresas embebidas en escolicida (solución salina hipertónica) y aspirar el contenido","Abrirlo directamente y vaciarlo con la mano","Inyectar formol","Nada especial"],"explicacion":"Se aísla el campo con compresas embebidas en escolicida para evitar la siembra peritoneal y la anafilaxia. No se inyecta escolicida si hay comunicación biliar, porque puede producir colangitis esclerosante.","fuente":"Hermes: Equinococosis hepática"},{"tipo":"Diagnóstico","pregunta":"Al vaciar la cavidad aparece bilis. ¿Qué significa y qué hacés?","opciones":["Comunicación quistobiliar: suturarla y evaluar la vía biliar","Es normal; cerrar","Hepatectomía mayor de urgencia","Ligadura del colédoco"],"explicacion":"Las fístulas quistobiliares son frecuentes; se identifican y suturan, y si hay material hidatídico en la vía biliar se la explora o se drena por CPRE.","fuente":"Hermes: Equinococosis hepática"}]},{"id":"biliar-ca-01","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Hallazgo de cáncer después de una colecistectomía","vineta":"Mujer de 64 años operada de colecistectomía laparoscópica por litiasis. La anatomía patológica informa adenocarcinoma que invade la capa muscular (pT1b), con margen cístico negativo.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué hacés primero?","opciones":["Estadificar con TC o resonancia de tórax y abdomen","Alta sin estudios","Quimioterapia sin estudios","Repetir la colecistectomía"],"explicacion":"Antes de reoperar se busca enfermedad residual o metastásica que contraindique la re-resección.","fuente":"Hermes: Cáncer de vesícula biliar"},{"tipo":"Conducta quirúrgica","pregunta":"Sin metástasis, ¿qué indicás?","opciones":["Re-resección: lecho hepático (segmentos IVb y V) y linfadenectomía del ligamento hepatoduodenal","Nada; la colecistectomía alcanza","Hepatectomía derecha ampliada de rutina","Solo radioterapia"],"explicacion":"En T1a con margen negativo alcanza la colecistectomía; desde T1b se indica re-resección del lecho y linfadenectomía porque hay riesgo de enfermedad residual.","fuente":"Hermes: Cáncer de vesícula biliar; Vaciamiento ganglionar en el cáncer de vesícula"},{"tipo":"Fármaco","pregunta":"Tras la resección, ¿qué adyuvancia se recomienda en el cáncer de vías biliares y vesícula?","opciones":["Capecitabina durante 6 meses","Ninguna","Tamoxifeno","Imatinib"],"explicacion":"Tras el ensayo BILCAP, ASCO 2019 recomienda capecitabina adyuvante por 6 meses en el cáncer biliar resecado.","fuente":"Ensayo BILCAP; ASCO 2019, cáncer biliar"},{"tipo":"Dosis","pregunta":"¿Con qué esquema se administró en BILCAP?","opciones":["1250 mg/m² cada 12 horas los días 1 a 14 de ciclos de 21 días, 8 ciclos","500 mg por día continuo durante 2 años","1250 mg/m² en dosis única mensual","100 mg/m² IV semanal"],"explicacion":"BILCAP usó capecitabina 1250 mg/m² dos veces por día los días 1 a 14 cada 3 semanas, durante 8 ciclos (24 semanas).","fuente":"Ensayo BILCAP"}]},{"id":"biliar-ca-02","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Ictericia indolora y vesícula pequeña","vineta":"Varón de 68 años con ictericia indolora y prurito, bilirrubina 14 mg/dl. Ecografía: vía biliar intrahepática dilatada en ambos lóbulos, colédoco normal y vesícula colapsada. Colangiorresonancia: estenosis de la confluencia que se extiende a ambos hepáticos.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Colangiocarcinoma perihiliar (tumor de Klatskin)","Cáncer de cabeza de páncreas","Coledocolitiasis","Hepatitis viral"],"explicacion":"Vía intrahepática dilatada con colédoco y vesícula no dilatados ubica la obstrucción en el hilio; una estenosis de la confluencia en un adulto mayor con ictericia indolora es un Klatskin hasta demostrar lo contrario.","fuente":"Hermes: Cáncer de la vía biliar principal"},{"tipo":"Diagnóstico","pregunta":"Si compromete la confluencia y llega a las ramas de segundo orden derechas, ¿qué tipo de Bismuth-Corlette es?","opciones":["IIIa","I","II","IV"],"explicacion":"Tipo I: debajo de la confluencia; II: compromete la confluencia; IIIa y IIIb: llegan a las ramas de segundo orden derechas o izquierdas; IV: ambas.","fuente":"Hermes: Cáncer de la vía biliar principal"},{"tipo":"Conducta quirúrgica","pregunta":"Es resecable. ¿Qué cirugía corresponde?","opciones":["Resección de la vía biliar con hepatectomía derecha ampliada (incluyendo el lóbulo caudado) y hepaticoyeyunostomía","Resección de la vía biliar sola","Prótesis biliar como tratamiento definitivo","Duodenopancreatectomía"],"explicacion":"En el tipo IIIa se reseca la vía con el hígado derecho y el caudado (por sus conductos que drenan en la confluencia), con reconstrucción biliodigestiva.","fuente":"Hermes: Cáncer de la vía biliar principal; Hepatectomía derecha ampliada al segmento IV"},{"tipo":"Medidas generales","pregunta":"Antes de una hepatectomía mayor con bilirrubina de 14, ¿qué hacés con la vía biliar?","opciones":["Drenar el lado del futuro remanente","Drenar solo el lado a resecar","No drenar nunca","Esperar que baje sola"],"explicacion":"La ictericia empeora la regeneración del remanente; en el perihiliar se drena el lóbulo que va a quedar antes de una hepatectomía mayor.","fuente":"Hermes: Cáncer de la vía biliar principal"}]},{"id":"pancreas-ca-01","tema":"Cáncer de páncreas","anio":4,"titulo":"Ictericia indolora con vesícula palpable","vineta":"Varón de 66 años con ictericia indolora, pérdida de peso y vesícula palpable. Bilirrubina 9 mg/dl, CA 19-9 elevado. TC con protocolo pancreático: tumor de 2,5 cm en la cabeza con contacto con la vena mesentérica superior menor de 180°, sin contacto arterial ni metástasis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué significa la vesícula palpable con ictericia indolora?","opciones":["Obstrucción maligna distal probable (signo de Courvoisier-Terrier)","Colecistitis aguda","Litiasis coledociana segura","Hepatitis"],"explicacion":"La obstrucción lenta y progresiva distal al cístico distiende una vesícula sana; la litiasis suele dar vesícula escleroatrófica.","fuente":"Hermes: Adenocarcinoma ductal de páncreas"},{"tipo":"Diagnóstico","pregunta":"¿Cómo lo clasificás según resecabilidad?","opciones":["Resecable (contacto venoso menor de 180° sin deformación y sin contacto arterial)","Irresecable localmente avanzado","Metastásico","Limítrofe arterial"],"explicacion":"Según NCCN, sin contacto arterial y con contacto venoso de 180° o menos sin irregularidad de la vena es resecable; el contacto arterial define limítrofe o localmente avanzado.","fuente":"Hermes: Adenocarcinoma ductal de páncreas; Riesgo vascular en DPC"},{"tipo":"Medidas generales","pregunta":"¿Drenás la vía biliar antes de operar?","opciones":["No de rutina; solo si hay colangitis, ictericia muy intensa o se retrasará la cirugía (por ejemplo, por neoadyuvancia)","Sí, siempre","Sí, con colecistostomía","Nunca, en ningún caso"],"explicacion":"En el ensayo DROP, el drenaje preoperatorio de rutina aumentó las complicaciones frente a la cirugía temprana; se reserva para indicaciones específicas.","fuente":"Ensayo DROP (van der Gaag 2010)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Duodenopancreatectomía cefálica","Pancreatectomía distal","Derivación biliodigestiva paliativa","Enucleación"],"explicacion":"El adenocarcinoma de la cabeza resecable se trata con duodenopancreatectomía cefálica con linfadenectomía estándar.","fuente":"Hermes: Duodenopancreatectomía cefálica"},{"tipo":"Fármaco","pregunta":"Se recupera bien y tiene buen estado general. ¿Qué adyuvancia indicás?","opciones":["mFOLFIRINOX durante 6 meses","Ninguna","Radioterapia sola","Tamoxifeno"],"explicacion":"En PRODIGE 24, mFOLFIRINOX adyuvante por 6 meses (12 ciclos) aumentó la supervivencia frente a gemcitabina en pacientes con buen estado funcional.","fuente":"Ensayo PRODIGE 24"}]},{"id":"pancreas-ca-02","tema":"Cáncer de páncreas","anio":4,"titulo":"Drenaje con amilasa alta después de un Whipple","vineta":"Varón de 62 años en el día 3 de una duodenopancreatectomía. El drenaje peripancreático aporta 150 ml/día con amilasa 5 veces mayor que el límite superior normal de la sérica. Afebril, buen estado, tolera dieta.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás?","opciones":["Fuga bioquímica (antes llamada grado A), sin repercusión clínica","Fístula grado C","Fístula grado B","No es fístula"],"explicacion":"ISGPS 2016 define fístula como amilasa en el drenaje mayor de 3 veces el límite superior normal sérico desde el día 3; si no cambia el manejo es una fuga bioquímica, y pasa a grado B o C según repercusión e intervenciones.","fuente":"ISGPS 2016, fístula pancreática"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés?","opciones":["Mantener el drenaje y retirarlo progresivamente si el débito baja, con alimentación oral","Relaparotomía","Completar la pancreatectomía","Nutrición parenteral y ayuno obligatorios"],"explicacion":"La fuga bioquímica no requiere cambios de conducta; se retira el drenaje cuando el débito disminuye.","fuente":"ISGPS 2016, fístula pancreática"},{"tipo":"Diagnóstico","pregunta":"En el día 10 aparece sangre por el drenaje y hematemesis leve, autolimitadas, con fístula conocida. ¿Qué sospechás?","opciones":["Sangrado centinela por pseudoaneurisma (por ejemplo, de la gastroduodenal)","Gastritis por estrés sin importancia","Úlcera duodenal","Coagulopatía"],"explicacion":"Un sangrado menor tardío en un paciente con fístula suele anunciar la rotura de un pseudoaneurisma; se pide angio-TC urgente y se trata con angiografía y embolización o stent.","fuente":"Hermes: Duodenopancreatectomía cefálica"}]},{"id":"pancreas-ca-03","tema":"Cáncer de páncreas","anio":4,"titulo":"Cáncer de páncreas metastásico con ictericia y vómitos","vineta":"Mujer de 72 años con adenocarcinoma de cabeza de páncreas y metástasis hepáticas. Ictericia con prurito y, en las últimas semanas, vómitos por obstrucción duodenal. Expectativa de vida estimada de meses.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo tratás la ictericia?","opciones":["Prótesis biliar metálica autoexpandible por vía endoscópica","Duodenopancreatectomía","Colecistectomía","Nada"],"explicacion":"En la paliación, la prótesis metálica por CPRE alivia la ictericia con menos morbilidad que la derivación quirúrgica y dura más que la plástica.","fuente":"Hermes: Paliación del cáncer de páncreas; Paliación de las neoplasias biliopancreáticas"},{"tipo":"Conducta quirúrgica","pregunta":"¿Y la obstrucción duodenal?","opciones":["Prótesis duodenal o gastroyeyunostomía (o gastroenteroanastomosis guiada por ecoendoscopia), según expectativa de vida","Sonda nasogástrica permanente","Gastrectomía total","Nada"],"explicacion":"Con expectativa corta suele preferirse la prótesis duodenal; con expectativa mayor, la gastroyeyunostomía da una paliación más duradera.","fuente":"Hermes: Paliación del cáncer de páncreas"},{"tipo":"Medidas generales","pregunta":"Tiene dolor epigástrico irradiado al dorso que no cede con opioides. ¿Qué podés ofrecer?","opciones":["Neurólisis del plexo celíaco","Más opioides sin límite","Pancreatectomía","Nada"],"explicacion":"La neurólisis celíaca, guiada por ecoendoscopia o percutánea, mejora el dolor y reduce el consumo de opioides, dentro de un abordaje de cuidados paliativos.","fuente":"Hermes: Paliación del cáncer de páncreas; Cuidados paliativos en cirugía"}]},{"id":"biliar-01","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Dolor posprandial en hipocondrio derecho","vineta":"Mujer de 38 años. Dolor epigástrico y en hipocondrio derecho de 3 horas, iniciado después de una cena abundante, con náuseas. Afebril. Dolor leve en hipocondrio derecho, Murphy negativo. Leucocitos 8.200/mm³; hepatograma y lipasa normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico más probable?","opciones":["Cólico biliar no complicado","Colecistitis aguda grado I","Coledocolitiasis","Pancreatitis aguda"],"explicacion":"Dolor de pocas horas sin fiebre, sin Murphy y con laboratorio normal es dolor biliar no complicado. La colecistitis exige signos locales (Murphy, masa) más signos sistémicos (fiebre, leucocitosis, PCR) e imagen compatible; un hepatograma normal hace improbable la coledocolitiasis y la lipasa normal descarta pancreatitis.","fuente":"Hermes: Colelitiasis y cólico biliar; criterios diagnósticos TG18"},{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía abdominal","TC de abdomen con contraste","Colangiorresonancia","CPRE"],"explicacion":"La ecografía es el estudio inicial: muestra los cálculos o el barro y busca pared engrosada, líquido, Murphy ecográfico y dilatación de la vía biliar. Colangiorresonancia y CPRE se reservan para sospecha de vía biliar; la TC, para complicaciones o diagnósticos alternativos.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Fármaco","pregunta":"¿Qué analgésico indicás como primera línea?","opciones":["AINE (ketorolac)","Antiespasmódico solo (butilescopolamina)","Antibiótico (ceftriaxona)","Omeprazol solo"],"explicacion":"Los AINE alivian el cólico biliar más que el placebo y que los antiespasmódicos, y redujeron las complicaciones a corto plazo (colecistitis, pancreatitis, ictericia). Los opioides dan un alivio similar y quedan para dolor refractario o contraindicación de AINE. Sin infección no hay indicación de antibiótico.","fuente":"Cochrane 2016, AINE en cólico biliar (Fraquelli, CD006390)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de ketorolac indicás en esta paciente de 38 años con función renal normal?","opciones":["30 mg IV en dosis única","10 mg IV cada 4 horas","60 mg IV cada 6 horas","120 mg IV en dosis única"],"explicacion":"La dosis IV única en adultos menores de 65 años es 30 mg; se reduce a 15 mg en mayores de 65 años, peso menor de 50 kg o insuficiencia renal. El máximo diario es 120 mg y no debe superarse con dosis de 60 mg IV repetidas ni en un solo bolo.","fuente":"Ficha técnica de ketorolac trometamina (FDA)"},{"tipo":"Medidas generales","pregunta":"Cede el dolor. ¿Qué indicás al alta?","opciones":["Alta con analgesia y pautas de alarma: fiebre, ictericia o dolor que persiste","Internación para colecistectomía de urgencia","Ácido ursodesoxicólico para disolver los cálculos","Ayuno estricto hasta la cirugía"],"explicacion":"El cólico no complicado se maneja en forma ambulatoria. Fiebre, ictericia, hipotensión o dolor persistente sugieren una complicación y obligan a consultar. La disolución farmacológica tiene utilidad excepcional y no reemplaza la cirugía.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es el tratamiento definitivo?","opciones":["Colecistectomía laparoscópica electiva","Observación: es una litiasis asintomática","Colecistectomía abierta de urgencia","CPRE con esfinterotomía"],"explicacion":"El dolor biliar típico indica colecistectomía laparoscópica programada. Solo la litiasis verdaderamente asintomática se observa; no hay indicación de urgencia ni de CPRE sin compromiso de la vía biliar.","fuente":"Hermes: Colelitiasis y cólico biliar"},{"tipo":"Técnica","pregunta":"En la colecistectomía, ¿qué condición tenés que cumplir antes de clipar y seccionar?","opciones":["Obtener la visión crítica de seguridad","Identificar el cístico por la forma de embudo del infundíbulo","Seccionar la primera estructura tubular que llega a la vesícula","Disecar primero la vía biliar principal para localizarla"],"explicacion":"La visión crítica exige triángulo hepatocístico limpio de grasa, tercio inferior de la vesícula separado del lecho y solo dos estructuras entrando a la vesícula. El \"signo del embudo\" es la ilusión que explica la mayoría de las lesiones biliares; disecar la vía principal aumenta el riesgo de lesionarla.","fuente":"Guía multisocietaria de colecistectomía segura 2020; Hermes: Técnica de colecistectomía laparoscópica"}]},{"id":"biliar-02","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Fiebre y Murphy positivo de 30 horas","vineta":"Varón de 52 años, sin comorbilidades. Dolor en hipocondrio derecho de 30 horas, temperatura 38,1 °C, Murphy positivo, sin masa palpable. Leucocitos 13.500/mm³, PCR elevada, bilirrubina normal. Ecografía: cálculo impactado en el bacinete, pared de 5 mm, escaso líquido perivesicular.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad?","opciones":["Colecistitis aguda litiásica grado I (leve) de Tokio","Colecistitis aguda grado II (moderada)","Colecistitis aguda grado III (grave)","Cólico biliar no complicado"],"explicacion":"Cumple signos locales, sistémicos e imagen. No tiene criterios de grado II (leucocitos > 18.000, masa palpable, más de 72 horas o inflamación local marcada) ni disfunción orgánica (grado III), así que es grado I.","fuente":"TG18, criterios diagnósticos y de gravedad; Hermes: Colecistitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Cefazolina","Ampicilina-sulbactam","Ciprofloxacina","Meropenem"],"explicacion":"TG18 propone para el grado I comunitario cefalosporinas como cefazolina. Ampicilina-sulbactam no se recomienda si la resistencia local de E. coli supera el 20 %. Las quinolonas se usan solo con sensibilidad conocida o alergia a betalactámicos, y los carbapenémicos se reservan.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Cefazolina 2 g IV cada 8 horas","Cefazolina 1 g IV cada 24 horas","Cefazolina 500 mg VO cada 6 horas","Cefazolina 4 g IV cada 6 horas"],"explicacion":"La dosis IV para adultos es 1 a 2 g cada 8 horas. Cada 24 horas no alcanza niveles útiles por su vida media corta; no se administra por vía oral y 4 g cada 6 horas excede la dosis recomendada.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo operás?","opciones":["Colecistectomía laparoscópica temprana en la misma internación","Antibióticos y colecistectomía diferida a las 6 a 8 semanas","Colecistostomía percutánea","Tratamiento médico sin cirugía"],"explicacion":"WSES 2020 recomienda colecistectomía laparoscópica temprana, dentro de los 7 días del ingreso y 10 del inicio de síntomas. La estrategia diferida aumenta la morbilidad acumulada y la estancia. La colecistostomía es para fisiología prohibitiva.","fuente":"WSES 2020; Hermes: Colecistitis aguda"},{"tipo":"Medidas generales","pregunta":"Operado sin complicaciones, ¿cuánto dura el antibiótico?","opciones":["Se suspende dentro de las 24 horas posteriores a la colecistectomía","Se completan 7 días","Se completan 14 días","De 4 a 7 días después de la cirugía"],"explicacion":"En los grados I y II, TG18 indica suspender el antibiótico dentro de las 24 horas de la colecistectomía. Los 4 a 7 días tras controlar el foco corresponden a la colangitis y a la colecistitis grado III.","fuente":"TG18 antimicrobianos, duración (Gomi 2018)"},{"tipo":"Técnica","pregunta":"El triángulo hepatocístico está bloqueado por la inflamación y no lográs la visión crítica. ¿Qué hacés?","opciones":["Colecistectomía subtotal u otra técnica de rescate, sin seguir disecando a ciegas","Clipar la estructura más evidente y continuar","Seccionar el infundíbulo y considerar cístico lo que sale","Insistir en la disección del triángulo hasta encontrar el cístico"],"explicacion":"Sin visión crítica no se corta. Las alternativas son colecistectomía subtotal, fondo primero, conversión, colecistostomía o pedir ayuda. La guía multisocietaria favorece la subtotal sobre la total por fondo primero cuando la anatomía no puede definirse.","fuente":"Guía multisocietaria de colecistectomía segura 2020; Hermes: Colecistectomía subtotal"}]},{"id":"biliar-03","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Cuatro días de dolor y masa palpable","vineta":"Mujer de 67 años, hipertensa controlada, sin alergias. Dolor en hipocondrio derecho de 96 horas, temperatura 38,6 °C y masa dolorosa palpable. Leucocitos 19.800/mm³. Presión, creatinina y plaquetas normales. Ecografía: pared de 8 mm, líquido perivesicular y cálculo en el bacinete.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado de Tokio tiene?","opciones":["Grado II (moderado)","Grado I (leve)","Grado III (grave)","No cumple criterios de colecistitis"],"explicacion":"Tiene criterios de grado II: leucocitos mayores de 18.000, masa palpable y más de 72 horas de evolución. No hay disfunción cardiovascular, renal, respiratoria, neurológica, hepática ni hematológica, que definirían el grado III.","fuente":"TG18, gravedad de la colecistitis; Hermes: Colecistitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Ceftriaxona","Cefazolina","Ampicilina-sulbactam","Ciprofloxacina"],"explicacion":"TG18 propone para el grado II cefalosporinas de tercera generación como ceftriaxona. La cefazolina figura para el grado I; ampicilina-sulbactam no se recomienda con resistencia de E. coli mayor del 20 %; la quinolona solo con sensibilidad conocida o alergia. El metronidazol se agrega únicamente si hay anastomosis biliodigestiva.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Ceftriaxona 2 g IV cada 24 horas","Ceftriaxona 500 mg IM en dosis única","Ceftriaxona 2 g IV cada 6 horas","Ceftriaxona 250 mg VO cada 12 horas"],"explicacion":"La dosis IV para adultos es de 1 a 2 g cada 12 a 24 horas; 2 g cada 24 horas es un esquema habitual. Una dosis única IM es la de gonococia, cada 6 horas es sobredosis y no existe la vía oral.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"Paciente operable y centro con experiencia. ¿Qué indicás?","opciones":["Colecistectomía laparoscópica temprana durante la internación","Antibióticos y cirugía diferida a las 6 semanas","Colecistostomía percutánea de rutina","Colecistectomía abierta obligada por superar las 72 horas"],"explicacion":"Superar las 72 horas no contraindica la cirugía. En un ensayo con pacientes de más de 72 horas, operar en la internación redujo la morbilidad acumulada (14 % frente a 39 %) y la estancia. La colecistostomía es para quien no tolera la cirugía.","fuente":"WSES 2020; ensayo de Roulin; Hermes: Colecistitis aguda"},{"tipo":"Estudios","pregunta":"¿Qué muestra tomás en la cirugía?","opciones":["Cultivo de la bilis vesicular","Ninguna: los cultivos no cambian la conducta","Biopsia hepática","Cultivo solo si encontrás pus franco"],"explicacion":"TG18 recomienda cultivar la bilis vesicular en toda colecistitis excepto el grado I, para dirigir el tratamiento si la evolución no es la esperada.","fuente":"TG18 antimicrobianos, recomendación 1C (Gomi 2018)"}]},{"id":"biliar-04","tema":"Litiasis vesicular y colecistitis","anio":2,"titulo":"Colecistitis con shock en un paciente frágil","vineta":"Varón de 84 años con insuficiencia cardíaca (fracción de eyección 25 %) y EPOC con oxígeno domiciliario, ASA IV. Tres días de dolor en hipocondrio derecho, temperatura 38,9 °C, presión 85/50 mmHg que requiere noradrenalina tras la reanimación, creatinina 2,4 mg/dl. Ecografía: colecistitis litiásica con pared de 9 mm.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado de Tokio tiene?","opciones":["Grado III (grave)","Grado II (moderado)","Grado I (leve)","Colangitis aguda grado III"],"explicacion":"La necesidad de vasopresores (disfunción cardiovascular) y la creatinina mayor de 2 mg/dl (disfunción renal) definen el grado III. No hay ictericia ni dilatación biliar que sugieran colangitis.","fuente":"TG18, gravedad de la colecistitis"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico empírico indicás?","opciones":["Piperacilina-tazobactam más vancomicina","Ceftriaxona sola","Cefazolina","Ampicilina-sulbactam"],"explicacion":"Para el grado III, TG18 propone piperacilina-tazobactam, cefepime o carbapenémicos, y agrega vancomicina para cubrir Enterococcus en la infección comunitaria grave. Ceftriaxona y cefazolina corresponden a grados menores.","fuente":"TG18 antimicrobianos, tabla 3 y nota a (Gomi 2018)"},{"tipo":"Dosis","pregunta":"¿Qué dosis de piperacilina-tazobactam indicás?","opciones":["4,5 g IV cada 6 horas","4,5 g IV cada 24 horas","2,25 g VO cada 12 horas","1 g IV cada 8 horas"],"explicacion":"La dosis estándar es 3,375 g cada 6 horas y se aumenta a 4,5 g cada 6 horas cuando se busca cubrir Pseudomonas, como en la infección grave. No hay presentación oral y cada 24 horas es insuficiente.","fuente":"SIS/IDSA 2010, tabla 6 de dosis (Solomkin)"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Drenaje vesicular percutáneo urgente con soporte y cirugía diferida si mejora","Colecistectomía laparoscópica inmediata","Solo antibióticos sin drenaje","Colecistectomía abierta de urgencia"],"explicacion":"En el grado III con falla orgánica no rápidamente reversible y comorbilidad grave, TG18 indica soporte y drenaje urgente o temprano. El drenaje es el puente o la alternativa cuando la fisiología es prohibitiva; no debe usarse solo por una etiqueta inespecífica de alto riesgo.","fuente":"TG18 flujograma de grado III; Hermes: Colecistitis aguda y Drenaje de la vesícula biliar"},{"tipo":"Estudios","pregunta":"¿Qué cultivos pedís?","opciones":["Hemocultivos y cultivo de la bilis obtenida en el drenaje","Ninguno, porque no cambian la conducta","Solo urocultivo","Esperar los cultivos para iniciar el antibiótico"],"explicacion":"Los hemocultivos no se recomiendan de rutina solo en el grado I comunitario; en el grave sí. La bilis se cultiva al inicio de todo procedimiento. Los cultivos nunca deben demorar el antibiótico en un paciente en shock.","fuente":"TG18 antimicrobianos (Gomi 2018)"}]},{"id":"biliar-05","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Ictericia con cálculo en el colédoco","vineta":"Mujer de 49 años con cólicos biliares previos. Ictericia de 3 días y coluria, afebril y estable. Bilirrubina total 5,2 mg/dl, fosfatasa alcalina triplicada. Ecografía: colelitiasis, colédoco de 10 mm con imagen de cálculo distal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué probabilidad de coledocolitiasis tiene?","opciones":["Alta: el cálculo se ve en la ecografía","Intermedia: requiere colangiorresonancia","Baja: alcanza con la colecistectomía","Es una colangitis aguda"],"explicacion":"ASGE 2019 considera alto riesgo el cálculo visto en imágenes, la colangitis o la bilirrubina mayor de 4 mg/dl con colédoco dilatado; esta paciente cumple dos. Sin fiebre ni signos inflamatorios no es colangitis.","fuente":"ASGE 2019; Hermes: Coledocolitiasis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué estrategia indicás?","opciones":["Extraer el cálculo (CPRE preoperatoria o exploración laparoscópica de la vía) y hacer la colecistectomía","Colangiorresonancia y ecoendoscopia antes de decidir","Colecistectomía sola esperando que el cálculo migre","Ácido ursodesoxicólico y control en 3 meses"],"explicacion":"En alto riesgo se va directo al tratamiento: CPRE con esfinterotomía o exploración laparoscópica de la vía biliar según experiencia, y colecistectomía para evitar la recurrencia. Repetir estudios diagnósticos solo demora; el cálculo con ictericia no se deja librado a la migración.","fuente":"ASGE 2019 y ESGE 2019; Hermes: Coledocolitiasis"},{"tipo":"Fármaco","pregunta":"Antes de la CPRE, ¿qué indicás para prevenir la pancreatitis posprocedimiento?","opciones":["Diclofenac o indometacina 100 mg por vía rectal, justo antes o después de la CPRE","Indometacina 25 mg VO cada 8 horas durante 3 días","Octreótido 100 µg subcutáneo","Diclofenac 100 mg rectal solo si aparece dolor después"],"explicacion":"ESGE recomienda 100 mg de diclofenac o indometacina rectal de rutina en todos los pacientes sin contraindicación, inmediatamente antes o después de la CPRE. Su efecto es preventivo: darlo al aparecer el dolor no sirve, y la vía oral u octreótido no demostraron beneficio.","fuente":"ESGE 2020, profilaxis de pancreatitis pos-CPRE; Hermes: Complicaciones de la CPRE y la esfinterotomía"},{"tipo":"Técnica","pregunta":"El cálculo mide 18 mm y no sale con balón ni canastilla. ¿Qué hacés?","opciones":["Esfinterotomía limitada más dilatación papilar con balón grande; si no se limpia, prótesis biliar temporal","Terminar la CPRE sin dejar drenaje","Ampliar la esfinterotomía todo lo posible","Indicar ursodesoxicólico y repetir en 6 meses"],"explicacion":"ESGE propone esfinterotomía limitada con dilatación con balón grande para cálculos difíciles, y litotricia guiada por colangioscopia si está disponible. Si no se logra la limpieza, una prótesis temporal asegura el drenaje hasta un nuevo intento. Una esfinterotomía excesiva aumenta el riesgo de perforación y sangrado.","fuente":"ESGE 2019; Hermes: Coledocolitiasis"}]},{"id":"biliar-06","tema":"Vía biliar principal y síndrome coledociano","anio":3,"titulo":"Fiebre con escalofríos e ictericia en un anciano","vineta":"Varón de 78 años. Fiebre de 39,2 °C con escalofríos, ictericia y dolor en hipocondrio derecho. Lúcido, presión 120/75 mmHg, creatinina normal. Leucocitos 16.000/mm³, bilirrubina 4,1 mg/dl, albúmina normal. Ecografía: colédoco de 12 mm con litiasis.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad?","opciones":["Colangitis aguda grado II (moderada)","Colangitis aguda grado I (leve)","Colangitis aguda grado III (grave)","Colecistitis aguda grado II"],"explicacion":"Es grado II por tener al menos dos criterios: leucocitos mayores de 12.000, fiebre de 39 °C o más y edad de 75 años o más. No hay disfunción orgánica (hipotensión, confusión, falla renal), que definiría el grado III.","fuente":"TG18, gravedad de la colangitis; Hermes: Clasificación de gravedad de Tokio"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo controlás el foco?","opciones":["Drenaje biliar temprano por CPRE, dentro de las 48 horas, junto con antibióticos","Antibióticos solos y CPRE electiva en 2 semanas","Colecistectomía de urgencia con exploración de la vía","Drenaje percutáneo como primera opción con la papila accesible"],"explicacion":"En el grado II el drenaje temprano o urgente (dentro de las 48 horas) reduce la mortalidad. La CPRE es la primera opción si el acceso papilar es posible; la vía percutánea, ecoendoscópica o quirúrgica son rescates.","fuente":"TG18; Hermes: Colangitis aguda y Clasificación de gravedad de Tokio"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico empírico indicás?","opciones":["Ceftriaxona","Cefazolina","Ampicilina-sulbactam","Amoxicilina por vía oral"],"explicacion":"Para la colangitis grado II comunitaria TG18 propone cefalosporinas de tercera generación como ceftriaxona. La cefazolina es para el grado I y la ampicilina-sulbactam no se recomienda con resistencia mayor del 20 %.","fuente":"TG18 antimicrobianos, tabla 3 (Gomi 2018)"},{"tipo":"Medidas generales","pregunta":"Después de drenar la vía, ¿cuánto dura el antibiótico?","opciones":["De 4 a 7 días una vez controlado el foco","Se suspende a las 24 horas del drenaje","14 días en todos los casos","Hasta que se normalice la bilirrubina"],"explicacion":"TG18 recomienda 4 a 7 días tras el control del foco. Solo se prolonga a un mínimo de 2 semanas si hay bacteriemia por Enterococcus o Streptococcus, por el riesgo de endocarditis.","fuente":"TG18 antimicrobianos, duración (Gomi 2018)"},{"tipo":"Estudios","pregunta":"¿Qué muestra tomás durante la CPRE?","opciones":["Cultivo de la bilis al inicio del procedimiento","Biopsia de la papila","Citología de la bilis","Ninguna"],"explicacion":"TG18 recomienda obtener cultivo de bilis al comienzo de todo procedimiento biliar para orientar el tratamiento dirigido y la desescalada.","fuente":"TG18 antimicrobianos, recomendación 1C (Gomi 2018)"}]},{"id":"biliar-07","tema":"Pancreatitis aguda","anio":2,"titulo":"Dolor epigástrico transfixiante","vineta":"Mujer de 44 años. Dolor epigástrico transfixiante de 8 horas con vómitos. Lipasa 1.900 U/l (más de tres veces el límite superior). Ecografía: colelitiasis, colédoco de 5 mm. Bilirrubina 1,3 mg/dl. Afebril, sin hipotensión, oxigenación ni función renal alteradas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Diagnóstico y gravedad inicial?","opciones":["Pancreatitis aguda biliar, leve por ahora (Atlanta revisada)","Pancreatitis aguda moderadamente grave","Pancreatitis aguda grave","Colangitis aguda"],"explicacion":"Cumple dos de tres criterios (dolor típico y lipasa mayor del triple). Sin falla orgánica ni complicaciones locales se considera leve, y se reclasifica a las 24, 48 horas y 7 días. No hay fiebre ni colestasis para pensar en colangitis.","fuente":"Atlanta revisada (Banks 2013); Hermes: Pancreatitis aguda"},{"tipo":"Estudios","pregunta":"¿Pedís una TC con contraste al ingreso?","opciones":["No: el diagnóstico ya está hecho con la clínica y la lipasa","Sí, para graduar la gravedad en las primeras horas","No, pido una CPRE diagnóstica","Sí, junto con una colangiorresonancia urgente"],"explicacion":"Con dolor típico y enzimas elevadas no hace falt
