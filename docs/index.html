qué esquema?","opciones":["Alteplasa 10 mg más DNasa 5 mg cada 12 horas, 6 dosis","Alteplasa 100 mg IV en 2 horas, dosis única","Alteplasa 1 mg intrapleural en dosis única","DNasa 50 mg intrapleural sola, cada 8 horas durante 7 días"],"explicacion":"El esquema de MIST-2 es alteplasa 10 mg y DNasa 5 mg por el tubo, dos veces por día durante 3 días, clampeando 1 hora tras cada dosis.","fuente":"Ensayo MIST-2 (Rahman, 2011)"}]},{"id":"traq-01","tema":"Traqueostomías","anio":1,"titulo":"Cánula desplazada al tercer día","vineta":"Paciente con traqueostomía quirúrgica hecha hace 3 días en terapia intensiva. Desaturación súbita, la cánula está fuera del estoma. Tiene vía aérea superior permeable e intubación orotraqueal factible.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés?","opciones":["Oxígeno por boca y estoma; si no recupera, intubación orotraqueal","Reintroducir a ciegas una cánula del mismo tamaño por el estoma, con mandril","Llamar al cirujano y esperar sin manipular la vía aérea","Agrandar el estoma con bisturí para reintroducir la cánula"],"explicacion":"Antes de los 7 días el trayecto no está maduro y reintroducir a ciegas puede crear una falsa vía. Se oxigena por la boca y el estoma, y si no alcanza se intuba por boca; el reemplazo se hace con visión.","fuente":"National Tracheostomy Safety Project"},{"tipo":"Medidas generales","pregunta":"¿Qué debe haber en la cabecera de todo paciente traqueostomizado?","opciones":["Cánulas de repuesto, aspiración y datos de la vía aérea","Un ambú con máscara y un laringoscopio","Una jeringa y un tubo endotraqueal número 8","Un equipo de tubo de tórax y un set de cricotiroidotomía"],"explicacion":"Se recomienda tener cánula de repuesto y una de menor calibre, dilatador, aspiración y un cartel con el tipo de traqueostomía y si la vía aérea superior es intubable.","fuente":"National Tracheostomy Safety Project"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hacer la traqueostomía temprana (antes de los 4 días de intubación) mejora la mortalidad?","opciones":["No: en el ensayo TracMan no redujo la mortalidad","Sí, la reduce a la mitad a 30 días","Sí, en los pacientes con más de 7 días de ventilación","Sí, pero solo en pacientes quirúrgicos"],"explicacion":"En TracMan, la traqueostomía temprana no mejoró la mortalidad a 30 días ni la estancia en terapia; muchos pacientes del grupo tardío nunca la necesitaron.","fuente":"Ensayo TracMan (Young, 2013)"}]},{"id":"pared-02","tema":"Pared abdominal y laparotomías","anio":1,"titulo":"Cierre de una laparotomía mediana","vineta":"Terminás una resección de colon electiva por laparotomía mediana de 20 cm en una paciente de 64 años, IMC 29, sin otros factores de riesgo de eventración.","pasos":[{"tipo":"Técnica","pregunta":"¿Cómo cerrás la aponeurosis?","opciones":["Continua, puntos pequeños, monofilamento de absorción lenta","Puntos separados, material trenzado de absorción rápida","Continua, puntos grandes a 2 cm del borde, absorción lenta","Cierre en masa con nailon y puntos separados cada 2 cm"],"explicacion":"La técnica de puntos pequeños (small bites) con sutura continua de absorción lenta, relación largo de sutura y largo de herida de al menos 4:1, reduce la eventración frente a los puntos grandes.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía; Hermes: Cicatrización y prevención de la hernia incisional"},{"tipo":"Dosis","pregunta":"¿Qué relación largo de sutura y largo de herida buscás?","opciones":["Al menos 4:1","Cerca de 1:1","Cerca de 2:1","No más de 3:1"],"explicacion":"Una relación de al menos 4:1 se asocia con menos eventración; con puntos pequeños suele superar 5:1.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía"},{"tipo":"Medidas generales","pregunta":"¿Cuándo considerarías malla profiláctica?","opciones":["En alto riesgo (obesidad, aneurisma de aorta), onlay o retromuscular","En las laparotomías contaminadas, con malla biológica intraperitoneal","En reoperaciones, con malla intraperitoneal de PTFE","En pacientes delgados con cierre a tensión, con malla en puente"],"explicacion":"La guía EHS/AHS 2022 sugiere considerar malla sintética permanente profiláctica en laparotomías medianas electivas de pacientes de alto riesgo, en posición onlay o retromuscular; no se recomienda intraperitoneal.","fuente":"Guía EHS/AHS 2022 de cierre de laparotomía"}]},{"id":"apend-01","tema":"Apendicitis aguda","anio":1,"titulo":"Dolor en fosa ilíaca derecha","vineta":"Varón de 24 años. Dolor periumbilical que migró a la fosa ilíaca derecha hace 18 horas, anorexia, náuseas, temperatura 37,9 °C, defensa en la fosa ilíaca derecha. Leucocitos 14.500/mm³ con neutrofilia. Ecografía: apéndice de 9 mm no compresible, sin colección ni apendicolito.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cuál es el diagnóstico?","opciones":["Apendicitis aguda no complicada","Apendicitis complicada con absceso","Linfadenitis mesentérica","Ileítis por Crohn"],"explicacion":"Migración del dolor, signos inflamatorios y un apéndice mayor de 6 mm no compresible confirman la apendicitis. Sin colección, perforación ni apendicolito, es no complicada.","fuente":"WSES 2020, apendicitis aguda; Hermes: Apendicitis aguda"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Apendicectomía laparoscópica; antibióticos solos como alternativa","Antibióticos solos, sin ofrecer la cirugía por el riesgo anestésico","Observación sin antibióticos con ecografía a las 24 horas","Apendicectomía por laparotomía mediana exploradora"],"explicacion":"La apendicectomía laparoscópica es el tratamiento de elección. En la no complicada sin apendicolito, los antibióticos solos son una alternativa segura en pacientes informados, con recurrencia cercana al 40 % a 5 años.","fuente":"WSES 2020; ensayo APPAC a 5 años"},{"tipo":"Fármaco","pregunta":"¿Qué antibiótico indicás alrededor de la cirugía?","opciones":["Una dosis preoperatoria, sin antibióticos posoperatorios","Antibióticos IV posoperatorios durante 7 días","No indico antibióticos: es una cirugía limpia","Antibióticos orales durante 14 días a partir del alta hospitalaria"],"explicacion":"En la apendicitis no complicada alcanza la profilaxis preoperatoria; los antibióticos posoperatorios no reducen las complicaciones.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Cómo cerrás el muñón apendicular?","opciones":["Ligadura con endoloop o sutura, sin invaginación","Ligadura e invaginación en bolsa de tabaco","Dejarlo abierto con un drenaje en la fosa ilíaca","Engrapadora lineal de rutina en la base"],"explicacion":"La ligadura simple es adecuada y la invaginación no aporta beneficio. La engrapadora se reserva para bases inflamadas o anchas.","fuente":"WSES 2020, apendicitis aguda"}]},{"id":"apend-02","tema":"Apendicitis aguda","anio":1,"titulo":"Apendicitis perforada","vineta":"Mujer de 38 años con 4 días de dolor en fosa ilíaca derecha, fiebre de 38,8 °C y peritonismo localizado. TC: apéndice perforado con líquido libre y gas extraluminal, sin absceso organizado. Estable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Apendicectomía laparoscópica urgente y aspiración","Antibióticos solos y TC de control a las 72 horas","Drenaje percutáneo guiado por TC y antibióticos","Antibióticos y apendicectomía diferida a las 8 semanas"],"explicacion":"La apendicitis perforada con peritonitis requiere control quirúrgico del foco. El drenaje percutáneo es para el absceso organizado en pacientes seleccionados.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Lavado peritoneal abundante?","opciones":["No: se aspira el pus sin lavado de rutina","Sí, con 10 litros de solución tibia","Sí, con iodopovidona diluida","Sí, con antibióticos en el lavado"],"explicacion":"El lavado no redujo los abscesos frente a la aspiración sola en la apendicitis complicada.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Fármaco","pregunta":"¿Qué esquema antibiótico indicás?","opciones":["Ceftriaxona más metronidazol","Ampicilina-sulbactam en monoterapia","Cefalexina por vía oral durante 10 días","Vancomicina IV en monoterapia"],"explicacion":"La infección intraabdominal comunitaria se cubre contra enterobacterias y anaerobios, por ejemplo con cefalosporina de tercera generación más metronidazol. Ampicilina-sulbactam no se recomienda por la resistencia de E. coli.","fuente":"SIS/IDSA 2010, infección intraabdominal complicada"},{"tipo":"Dosis","pregunta":"¿Qué dosis de metronidazol?","opciones":["500 mg IV cada 8 horas","50 mg IV cada 24 horas","2 g IV cada 6 horas","250 mg VO cada 48 horas"],"explicacion":"La dosis IV es 500 mg cada 8 a 12 horas o 1500 mg cada 24 horas.","fuente":"SIS/IDSA 2010, tabla de dosis"},{"tipo":"Medidas generales","pregunta":"¿Cuánto dura el antibiótico tras un buen control del foco?","opciones":["De 3 a 5 días","De 14 días completos","Hasta normalizar los leucocitos","Una dosis única"],"explicacion":"Con control adecuado del foco, WSES 2020 propone 3 a 5 días; en el ensayo STOP-IT, 4 días fueron tan efectivos como tratamientos más largos.","fuente":"WSES 2020; ensayo STOP-IT"}]},{"id":"hernia-03","tema":"Hernia inguinal","anio":1,"titulo":"Bulto inguinal en una mujer","vineta":"Mujer de 52 años con un bulto reducible en la ingle derecha, por debajo de la línea entre la espina ilíaca y el pubis, que molesta al estar de pie.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tenés que descartar especialmente?","opciones":["Hernia crural (femoral)","Hidrocele","Varicocele","Testículo no descendido"],"explicacion":"En las mujeres las hernias crurales son proporcionalmente más frecuentes y tienen alto riesgo de estrangulación; se ubican por debajo del ligamento inguinal.","fuente":"Hermes: Hernia inguinal; Hernia crural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué abordaje preferís?","opciones":["TEP o TAPP, que explora el orificio crural","Lichtenstein con malla, como en el varón","Observación hasta que aparezca dolor","Bassini con refuerzo del ligamento inguinal"],"explicacion":"En la mujer se prefiere el abordaje posterior, que permite ver y reparar una hernia crural oculta; tras un Lichtenstein en mujeres, muchas recurrencias son crurales.","fuente":"HerniaSurge; Hermes: Hernia inguinal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Indicarías espera vigilada?","opciones":["No: en la mujer con sospecha crural se repara","Sí, como en el varón con pocos síntomas","Sí, hasta que aparezca alguna complicación","Sí, con faja y control clínico anual"],"explicacion":"La espera vigilada aceptada en varones con pocos síntomas no se extrapola a mujeres, por la frecuencia de hernias crurales y su riesgo de estrangulación.","fuente":"Hermes: Hernia inguinal"}]},{"id":"umb-01","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical en un cirrótico","vineta":"Varón de 58 años con cirrosis alcohólica, abstinente, ascitis controlada con diuréticos, MELD 12. Hernia umbilical de 2 cm sintomática, con piel sana.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Lo operás en forma programada?","opciones":["Sí, tras optimizar la ascitis, porque el MELD es menor de 15","No, por el alto riesgo de descompensación hepática tras la cirugía","No, se espera y se opera si se complica","Sí, en las próximas horas, sin optimizar"],"explicacion":"La reparación electiva es segura en cirróticos con MELD menor de 15 tras optimizar; la urgencia multiplica por siete la mortalidad, y entre 26 % y 37 % de los no operados termina en una reparación urgente.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales; Hermes: Hernia umbilical del adulto"},{"tipo":"Técnica","pregunta":"¿Qué técnica indicás?","opciones":["Reparación abierta con malla onlay o preperitoneal","Sutura simple con puntos separados","Malla intraperitoneal por vía laparoscópica","Plicatura de la aponeurosis sin malla"],"explicacion":"La sutura recidiva alrededor del 15 % a los 6 meses y la laparoscopia con ascitis aumentó las complicaciones sistémicas y la mortalidad.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Medidas generales","pregunta":"¿Qué medida perioperatoria es clave?","opciones":["Controlar la ascitis antes y después para evitar fuga y recurrencia","Suspender los diuréticos una semana antes de la cirugía","Dieta hiperproteica sin restricción de sodio para mejorar la cicatrización","Paracentesis evacuadora cada día durante un mes"],"explicacion":"La ascitis no controlada aumenta la presión sobre la reparación, la fuga de líquido y la infección; se optimiza con el equipo de hepatología.","fuente":"Hermes: Hernia umbilical del adulto"}]},{"id":"umb-02","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical en edad fértil","vineta":"Mujer de 30 años con una hernia umbilical de 1,5 cm, reducible y poco sintomática. Planea dos embarazos más.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo la operás?","opciones":["Postergarla hasta después del último embarazo, si es posible","Ahora, con malla, antes del próximo embarazo","Durante el próximo embarazo, en el segundo trimestre","No se opera: se cierra sola después del parto"],"explicacion":"Un embarazo posterior aumenta 1,6 veces la recurrencia, y la hernia rara vez se complica durante la gestación. Por eso se sugiere esperar al último embarazo.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Técnica","pregunta":"Si no pudiera esperar, ¿qué técnica sugiere la guía?","opciones":["Sutura del defecto","Malla intraperitoneal","Malla retromuscular amplia","Separación de componentes"],"explicacion":"En mujeres que se van a embarazar, la malla redujo la recurrencia pero casi duplicó el dolor crónico (17,5 % frente a 9,5 %), por lo que se sugiere sutura si la cirugía no puede postergarse.","fuente":"Guía EHS/AHS 2020 de circunstancias especiales"},{"tipo":"Medidas generales","pregunta":"¿Qué le indicás mientras espera?","opciones":["Pautas de alarma de incarceración","Faja abdominal durante todo el día","Reposo relativo y evitar levantar peso","Control con ecografía cada 3 meses"],"explicacion":"Con hernia reducible se observa, pero la paciente debe consultar ante dolor persistente, irreductibilidad o vómitos.","fuente":"Hermes: Hernia umbilical del adulto"}]},{"id":"ped-01","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Bulto inguinal en un lactante","vineta":"Lactante de 4 meses, nacido a término, con un bulto inguinal derecho que aparece al llorar y se reduce solo. Examen normal en reposo; testículos en las bolsas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hernia inguinal indirecta","Hidrocele no comunicante","Testículo retráctil","Adenopatía inguinal"],"explicacion":"Un bulto intermitente que aumenta con el llanto y se reduce es una hernia indirecta por un proceso vaginal permeable.","fuente":"Hermes: Hernia inguinal en el niño"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reparación programada pronta","Observar hasta los 2 años","Braguero hasta el cierre","Operar solo si se incarcera"],"explicacion":"Toda hernia inguinal pediátrica se repara porque no se cierra sola y el riesgo de incarceración es alto en lactantes (12 % a término, 39 % en prematuros).","fuente":"Guía EUPSA 2022; Hermes: Hernia inguinal en el niño"},{"tipo":"Técnica","pregunta":"¿En qué consiste la reparación?","opciones":["Ligadura alta del saco, sin malla","Lichtenstein con malla liviana","Reparación de Shouldice","Malla preperitoneal pequeña"],"explicacion":"El defecto es el proceso vaginal permeable: se liga el saco preservando deferente y vasos. No se usa malla. Abierta y laparoscópica tienen resultados similares.","fuente":"Guía EUPSA 2022; Hermes: Hernia inguinal en el niño"}]},{"id":"ped-02","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Bolsa escrotal vacía","vineta":"Lactante de 8 meses con el testículo izquierdo no palpable en la bolsa; se palpa en el conducto inguinal y no desciende con maniobras.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Testículo no descendido palpable","Testículo retráctil inguinal","Hidrocele del cordón","Hernia inguinal irreductible"],"explicacion":"Un testículo palpable en el conducto que no baja a la bolsa con maniobras es un testículo no descendido; el retráctil puede llevarse a la bolsa y se queda.","fuente":"EAU, guías de urología pediátrica"},{"tipo":"Estudios","pregunta":"¿Pedís una ecografía?","opciones":["No: no cambia la conducta","Sí, para medir el volumen testicular","Sí, y una resonancia de pelvis","Sí, junto con un cariotipo"],"explicacion":"La imagen no aporta en el testículo palpable y no localiza de forma confiable el no palpable, que se estudia por laparoscopia.","fuente":"EAU, guías de urología pediátrica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo lo operás?","opciones":["Orquidopexia entre los 6 y los 12 meses","Orquidopexia a los 5 años, antes de la escuela","Orquidopexia en la pubertad","Tratamiento hormonal sin cirugía"],"explicacion":"La cirugía temprana preserva la fertilidad y facilita el control del riesgo tumoral. El tratamiento hormonal no se recomienda como estándar.","fuente":"EAU, guías de urología pediátrica"}]},{"id":"ped-03","tema":"Hernias y patología genital en niños","anio":1,"titulo":"Dolor escrotal súbito en un adolescente","vineta":"Varón de 14 años con dolor escrotal izquierdo súbito e intenso desde hace 3 horas, náuseas. Testículo ascendido, horizontal, reflejo cremastérico ausente.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Torsión testicular","Epididimitis","Torsión de hidátide","Orquitis urliana"],"explicacion":"Dolor súbito, testículo alto y horizontal y cremastérico ausente en un adolescente son torsión hasta demostrar lo contrario.","fuente":"Hermes: Torsión testicular"},{"tipo":"Estudios","pregunta":"¿Esperás la ecografía Doppler para decidir?","opciones":["No: con alta sospecha se explora de inmediato","Sí, para confirmar la falta de flujo","Sí, una centellografía testicular","Sí, y un urocultivo para descartar epididimitis"],"explicacion":"Una ecografía normal no descarta la torsión y la demora reduce la viabilidad, que cae mucho después de las 6 horas. Con sospecha alta, el quirófano no espera la imagen.","fuente":"Hermes: Torsión testicular"},{"tipo":"Técnica","pregunta":"El testículo recupera el color tras destorcerlo. ¿Qué hacés?","opciones":["Orquidopexia de ambos testículos","Orquidopexia solo del lado afectado","Orquiectomía del lado afectado","Destorcer y cerrar sin fijar"],"explicacion":"La anomalía de fijación (badajo de campana) suele ser bilateral, por lo que se fijan ambos testículos. Si el testículo no es viable, se extirpa y se fija el contralateral.","fuente":"Hermes: Torsión testicular"}]},{"id":"var-01","tema":"Várices de miembros inferiores","anio":1,"titulo":"Várices sintomáticas","vineta":"Mujer de 48 años con pesadez y edema vespertino en la pierna derecha y várices en el territorio de la safena interna. Eco Doppler: reflujo de la unión safenofemoral y de la safena interna en todo el muslo. Sin úlcera.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo la clasificás en CEAP clínica?","opciones":["C2 o C3 (várices, edema)","C0 (sin signos visibles)","C5 (úlcera cicatrizada)","C6 (úlcera venosa activa)"],"explicacion":"La clasificación CEAP clínica va de C0 (sin signos) a C6 (úlcera activa): C2 son várices, C3 edema, C4 cambios cutáneos, C5 úlcera cicatrizada.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Medias de compresión, actividad física, control de peso y elevación","Reposo en cama con las piernas en alto durante el día","Calor local y masajes circulares diarios sobre los trayectos varicosos","Anticoagulación oral profiláctica y medias durante 3 meses"],"explicacion":"La compresión alivia los síntomas y el edema, junto con ejercicio, descenso de peso y elevación. No corrige el reflujo.","fuente":"ESVS 2022, enfermedad venosa crónica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento definitivo es de primera elección?","opciones":["Ablación térmica endovenosa de la safena interna","Safenectomía con fleboextracción como primera opción","Escleroterapia con espuma de la unión safenofemoral como estándar","Ligadura del cayado sola"],"explicacion":"ESVS 2022 recomienda la ablación térmica endovenosa (láser o radiofrecuencia) sobre la cirugía para la insuficiencia de safena interna, por menor dolor y recuperación más rápida con resultados similares. La cirugía sigue siendo opción donde no hay ablación.","fuente":"ESVS 2022, enfermedad venosa crónica"}]},{"id":"ano-01","tema":"Patología anal","anio":1,"titulo":"Sangrado y prolapso al defecar","vineta":"Varón de 45 años con sangrado rojo rutilante al final de la defecación y prolapso que se reduce solo. Constipación crónica. Anoscopia: hemorroides internas de grado II.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué grado tienen y qué más evaluás?","opciones":["Grado II; evaluar colonoscopia según edad y síntomas","Grado IV; indicar hemorroidectomía sin más estudios","Grado I; repetir la anoscopia en un año","Grado III; pedir una TC de abdomen"],"explicacion":"Las internas se gradúan de I (no prolapsan) a IV (irreductibles). El sangrado no debe atribuirse a hemorroides sin descartar otras causas según edad y síntomas.","fuente":"ASCRS 2018, hemorroides; Hermes: Enfermedad hemorroidal"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero?","opciones":["Más fibra y agua, y no pujar ni demorar en el inodoro","Hemorroidectomía programada en las próximas semanas, sin otra medida","Dieta sin residuos para disminuir el volumen fecal","Reposo y baños de asiento con agua fría"],"explicacion":"La modificación de la dieta con fibra y líquidos y los hábitos de defecación son la primera línea (recomendación fuerte 1B).","fuente":"ASCRS 2018, hemorroides"},{"tipo":"Conducta quirúrgica","pregunta":"Persisten los síntomas. ¿Qué procedimiento indicás?","opciones":["Ligadura con bandas elásticas en el consultorio","Hemorroidectomía de Milligan-Morgan programada","Esfinterotomía lateral interna","Hemorroidopexia con engrapadora de urgencia"],"explicacion":"Para grados I a III que no responden al tratamiento médico, la ligadura elástica es el procedimiento ambulatorio más eficaz. La hemorroidectomía se reserva para grado III y IV o fracaso.","fuente":"ASCRS 2018, hemorroides"}]},{"id":"ano-02","tema":"Patología anal","anio":1,"titulo":"Dolor anal con bulto azulado","vineta":"Mujer de 33 años con dolor anal intenso de 36 horas y un nódulo azulado, tenso, en el margen anal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Hemorroide externa trombosada","Absceso perianal superficial","Fisura anal aguda con pólipo centinela","Prolapso rectal mucoso"],"explicacion":"Un nódulo azulado, tenso y doloroso en el margen anal, de aparición brusca, es una trombosis hemorroidal externa.","fuente":"ASCRS 2018, hemorroides"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás con 36 horas de evolución?","opciones":["Escisión del trombo con anestesia local","Incisión y drenaje simple del coágulo","Ligadura con banda elástica","Hemorroidectomía de urgencia de los tres paquetes"],"explicacion":"En las primeras 72 horas, la escisión resuelve los síntomas más rápido y recurre menos que la incisión simple. Después, el manejo suele ser médico porque el dolor ya está cediendo.","fuente":"ASCRS 2018, hemorroides; revisión AAFP"},{"tipo":"Medidas generales","pregunta":"Si tuviera 6 días de evolución, ¿qué indicarías?","opciones":["Baños de asiento, analgesia, fibra y ablandadores","Escisión urgente del trombo con anestesia local","Antibióticos orales y control en 48 horas","Reposo en cama y hielo local continuo"],"explicacion":"Pasadas las 72 horas la trombosis tiende a resolver sola y se trata en forma conservadora, salvo dolor intenso o necrosis.","fuente":"ASCRS 2018, hemorroides"}]},{"id":"ano-03","tema":"Patología anal","anio":1,"titulo":"Tumefacción perianal fluctuante","vineta":"Varón de 35 años sin comorbilidades. Dolor perianal de 3 días, tumefacción fluctuante a las 5 en posición de litotomía, sin celulitis extensa. Afebril, no diabético.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Absceso perianal","Hemorroide trombosada","Fisura anal","Quiste pilonidal"],"explicacion":"Dolor y tumefacción fluctuante perianal es un absceso de origen criptoglandular.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés y cuándo?","opciones":["Drenaje quirúrgico dentro de las 24 horas","Antibióticos orales y control en una semana","Esperar que fistulice en forma espontánea","Punción con aguja fina y cultivo"],"explicacion":"El absceso se drena siempre. Sin signos sistémicos ni factores de riesgo de infección necrosante, ACPGBI propone operar dentro de las 24 horas de la decisión.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Técnica","pregunta":"¿Cómo lo drenás?","opciones":["Incisión amplia cerca del esfínter, sin buscar el orificio interno","Incisión radial alejada del ano y taponaje apretado con gasa durante 48 horas","Buscar el orificio interno con estilete y abrir la fístula","Drenar y colocar un sedal laxo a través del esfínter"],"explicacion":"En el absceso primario no se busca el orificio interno ni se trata la fístula. La incisión va cerca del esfínter para evitar un trayecto largo, y no se tapona de rutina.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Fármaco","pregunta":"¿Indicás antibióticos?","opciones":["No, si está bien drenado y sin factores de riesgo","Sí, amoxicilina-clavulánico durante 14 días","Sí, ciprofloxacina y metronidazol por 7 días","Sí, una dosis única de vancomicina en el quirófano"],"explicacion":"Los antibióticos y los cultivos tienen poco valor en el absceso no complicado drenado; se reservan para celulitis extensa, inmunosupresión, diabetes o signos sistémicos.","fuente":"ACPGBI 2021, urgencias colorrectales"}]},{"id":"osto-01","tema":"Ostomías","anio":1,"titulo":"Colostomía con bordes oscuros","vineta":"Paciente en el día 1 de una operación de Hartmann. La colostomía está oscura en la mucosa visible. Afebril, abdomen blando.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo evaluás la extensión de la isquemia?","opciones":["Tubo iluminado o endoscopio por el estoma, debajo de la fascia","TC con contraste endovenoso para buscar neumatosis","Esperar a que se desprenda la mucosa y reevaluar en una semana","Biopsia de la mucosa oscura y anatomía patológica urgente"],"explicacion":"La evaluación clínica y endoscópica es más útil que la TC. Lo que define la conducta es si la isquemia llega por debajo de la fascia.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Conducta quirúrgica","pregunta":"La necrosis se extiende por debajo de la fascia. ¿Qué indicás?","opciones":["Reoperación urgente para rehacer el estoma","Observación clínica y nueva evaluación en 48 horas","Curaciones locales y bolsa de estoma más grande","Antibióticos IV solos y control de la temperatura"],"explicacion":"Un estoma no viable por debajo de la fascia puede perforarse dentro del abdomen y causar peritonitis; se reopera para rehacerlo con intestino viable.","fuente":"ACPGBI 2021, urgencias colorrectales"},{"tipo":"Medidas generales","pregunta":"¿Qué medida preoperatoria reduce las complicaciones de los estomas programados?","opciones":["Marcación preoperatoria del sitio por estomaterapia","Hacer el estoma en la línea media para evitar hernias","Ubicarlo en un pliegue cutáneo para disimularlo","Decidir el sitio durante la cirugía sin marcar"],"explicacion":"Marcar un sitio que el paciente vea y maneje, a través del recto anterior y lejos de pliegues y cicatrices, reduce fugas y complicaciones.","fuente":"Hermes: Complicaciones de ostomías"}]},{"id":"osto-02","tema":"Ostomías","anio":1,"titulo":"Ileostomía de alto débito","vineta":"Paciente con ileostomía en asa hace 5 días tras una resección anterior baja. Débito de 2200 ml/día, sed, creatinina en aumento.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Ileostomía de alto débito con deshidratación","Fuga anastomótica con colección pélvica infectada","Íleo posoperatorio prolongado","Obstrucción del estoma por edema"],"explicacion":"Un débito mayor de 1,5 a 2 litros por día con signos de deshidratación y caída de la función renal es una ileostomía de alto débito, causa frecuente de reinternación.","fuente":"Hermes: Ileostomía"},{"tipo":"Medidas generales","pregunta":"¿Qué indicación de líquidos es correcta?","opciones":["Restringir líquidos hipotónicos y dar rehidratación oral con sodio","Tomar abundante agua y té, al menos 3 litros por día, para reponer","Jugos de fruta y bebidas deportivas sin restricción","Suspender la ingesta oral y dar nutrición parenteral"],"explicacion":"El agua y los líquidos hipotónicos aumentan la pérdida de sodio por el estoma. Se restringen y se reemplazan por una solución oral con alta concentración de sodio, con hidratación IV si hace falta.","fuente":"Hermes: Ileostomía"},{"tipo":"Fármaco","pregunta":"¿Qué fármaco reduce el débito?","opciones":["Loperamida antes de las comidas","Metoclopramida antes de las comidas","Laxantes osmóticos por la noche","Eritromicina en dosis bajas"],"explicacion":"La loperamida enlentece el tránsito y reduce el débito; se toma antes de las comidas. Los proquinéticos y laxantes lo empeoran.","fuente":"Hermes: Ileostomía"}]},{"id":"gastro-01","tema":"Ostomías","anio":1,"titulo":"Gastrostomía para alimentación","vineta":"Varón de 72 años con disfagia por un ACV hace 3 semanas, sin recuperación de la deglución prevista en el próximo mes. Necesita alimentación enteral prolongada.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué acceso enteral indicás?","opciones":["Gastrostomía endoscópica percutánea","Sonda nasogástrica indefinida","Nutrición parenteral","Yeyunostomía quirúrgica abierta como primera opción"],"explicacion":"Cuando se prevé alimentación enteral por más de 4 a 6 semanas, la gastrostomía percutánea es la vía de elección por menor desplazamiento y mejor tolerancia que la sonda nasogástrica.","fuente":"Hermes: Gastrostomía"},{"tipo":"Medidas generales","pregunta":"La sonda se sale al 7.º día. ¿Qué hacés?","opciones":["No reintroducirla a ciegas; endoscopia o radiología","Reintroducir una sonda Foley a ciegas y empezar a alimentar","Esperar a que cierre el orificio y colocar otra","Alimentar por la boca de inmediato con espesantes"],"explicacion":"Antes de la maduración del trayecto (unas 4 semanas) el estómago puede separarse de la pared; una sonda reintroducida a ciegas puede quedar en la cavidad peritoneal y causar peritonitis al alimentar.","fuente":"Hermes: Gastrostomía"},{"tipo":"Medidas generales","pregunta":"¿Qué cuidado previene la complicación del tope interno enterrado?","opciones":["Rotar la sonda y moverla, sin apretar el tope externo","Fijar el tope externo bien apretado contra la piel","Dejarla fija, sin rotarla, para no lesionar el trayecto","Cambiarla cada semana por una de mayor calibre"],"explicacion":"Un tope externo demasiado ajustado empuja el interno dentro de la pared gástrica (buried bumper). Se deja un margen de movilidad y se rota la sonda.","fuente":"Hermes: Gastrostomía"}]},{"id":"cana-02","tema":"Canalizaciones venosas","anio":1,"titulo":"Sangre roja que late por el dilatador","vineta":"Varón de 70 años en terapia intensiva. Al colocar un catéter en la yugular interna derecha se pasó el dilatador de 8 Fr y sale sangre roja brillante y pulsátil; el transductor muestra una curva arterial.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué pasó?","opciones":["Se canuló la carótida","Se perforó la vena yugular","Hay un neumotórax a tensión","La vía quedó en la subclavia"],"explicacion":"La sangre roja pulsátil y la curva arterial en el transductor indican que el dilatador está en una arteria, en este sitio la carótida.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés con el dilatador?","opciones":["Lo dejo y consulto de urgencia a vascular","Lo retiro y comprimo el cuello durante 10 minutos","Lo cambio por el catéter y lo uso igual, sin consultar","Lo retiro y repito la punción del lado opuesto"],"explicacion":"Una vía o un dilatador de 6 Fr o más colocados por error en una arteria se dejan en su lugar y su retiro se discute de urgencia con radiología intervencionista o cirugía vascular; retirarlo y comprimir puede causar hematoma, seudoaneurisma o ACV.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"},{"tipo":"Técnica","pregunta":"¿Qué paso previene este error?","opciones":["Confirmar con ecografía que la guía está en la vena","Punzar más lateral, guiándose solo por los reparos","Usar un dilatador más largo y más fino","Dilatar el trayecto antes de pasar la guía"],"explicacion":"La punción se hace con ecografía en tiempo real viendo entrar la aguja en la vena, y se confirma que la guía sigue en la vena antes de dilatar.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"},{"tipo":"Medidas generales","pregunta":"¿Qué medida evita olvidar la guía metálica dentro del paciente?","opciones":["Contar y documentar el retiro de la guía","Dejar la guía dentro hasta confirmar la punta","Usar guías más cortas","Pedir una radiografía al día siguiente"],"explicacion":"La guía retenida es un evento evitable que suele deberse a un error humano: se previene con conteo y registro testificado de su retiro y, si hay, dispositivos antirretención.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"}]},{"id":"cana-03","tema":"Canalizaciones venosas","anio":1,"titulo":"Brazo hinchado con un catéter central periférico","vineta":"Mujer de 58 años en quimioterapia con un catéter central de inserción periférica en el brazo derecho. Edema y dolor del brazo desde ayer. El catéter refluye y funciona bien y lo sigue necesitando. Sin fiebre.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["Eco Doppler venoso del miembro superior","Radiografía de tórax para ver la punta","Hemocultivos tomados por el catéter","Flebografía con contraste del brazo"],"explicacion":"El edema y el dolor del brazo con un catéter sugieren trombosis venosa asociada al catéter, que se confirma con eco Doppler.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"},{"tipo":"Conducta quirúrgica","pregunta":"Se confirma trombosis de la vena axilar. ¿Qué hacés con el catéter?","opciones":["Lo dejo, porque funciona y sigue siendo necesario","Lo retiro de inmediato por la trombosis","Lo recambio sobre una guía por uno nuevo","Lo cierro y no lo uso hasta el próximo control"],"explicacion":"Si el catéter sigue siendo necesario, está bien ubicado, no infectado, funciona y el miembro no está amenazado, puede quedar colocado mientras se anticoagula.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento indicás?","opciones":["Anticoagulación según el protocolo local","Antibióticos por si está infectado","Trombólisis sistémica","Solo elevación y calor local"],"explicacion":"La trombosis venosa asociada al catéter se trata con anticoagulación según los protocolos locales; no hay indicación de antibióticos sin infección.","fuente":"Association of Anaesthetists, acceso vascular seguro 2025"}]},{"id":"pared-05","tema":"Pared abdominal y laparotomías","anio":1,"titulo":"Asas en la herida al séptimo día","vineta":"Varón de 70 años, desnutrido, en el séptimo día de una laparotomía mediana por oclusión. Tras un acceso de tos nota que la gasa se empapa de líquido serohemático y al retirarla se ven asas intestinales en la herida.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Evisceración por dehiscencia aponeurótica","Infección superficial del sitio quirúrgico","Seroma de la herida","Fístula enterocutánea"],"explicacion":"La secreción serohemática súbita, a menudo después de toser, y las vísceras en la herida son una dehiscencia aponeurótica con evisceración.","fuente":"Hermes: Dehiscencia aguda de la pared abdominal"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés de inmediato?","opciones":["Cubro las asas con compresas húmedas y voy a quirófano","Reintroduzco las asas en la cama y vendo bien apretado","Dejo la herida al aire y pido una TC urgente","Coloco una faja compresiva y espero 24 horas"],"explicacion":"Ante una evisceración se cubren las vísceras con compresas estériles húmedas, se reanima y se lleva al quirófano.","fuente":"Hermes: Dehiscencia aguda de la pared abdominal"},{"tipo":"Conducta quirúrgica","pregunta":"En la exploración no hay infección intraabdominal ni adherencias y la fascia se aproxima sin tensión. ¿Qué hacés?","opciones":["Resuturo la fascia sin tensión","Dejo el abdomen abierto de rutina","Coloco una malla en puente sin cerrar","Cierro solo la piel"],"explicacion":"En la dehiscencia precoz, sin infección ni adherencias, ACPGBI recomienda resuturar la fascia sin tensión.","fuente":"ACPGBI 2021; Hermes: Dehiscencia aguda de la pared abdominal"},{"tipo":"Conducta quirúrgica","pregunta":"Si hubiera infección intraabdominal y la fascia no se aproximara, ¿qué harías?","opciones":["Manejo como abdomen abierto con cierre temporal","Cierre forzado con puntos de retención","Malla de polipropileno puenteando el defecto","Cierre de piel sola sobre las asas"],"explicacion":"Si la dehiscencia es tardía, hay infección o adherencias o la fascia no se aproxima, se maneja como abdomen abierto; ningún recurso debe forzar un cierre que cause hipertensión intraabdominal.","fuente":"ACPGBI 2021; Hermes: Dehiscencia aguda de la pared abdominal"}]},{"id":"pared-06","tema":"Pared abdominal y laparotomías","anio":1,"titulo":"Cierre de los trocares","vineta":"Terminás una colecistectomía laparoscópica en una mujer obesa con trocares de 12 mm en el ombligo y en el epigastrio y dos de 5 mm en el flanco derecho.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué orificios aponeuróticos cerrás?","opciones":["Los de 10 mm o más, sobre todo el umbilical","Los de 5 mm del flanco, que son más laterales","No cierro la fascia en la cirugía laparoscópica","Cada orificio, cerrado con una malla pequeña de refuerzo"],"explicacion":"Se sugiere suturar la fascia de los trocares de 10 mm o más, especialmente en el ombligo y después de la cirugía por incisión única, donde el riesgo de hernia es mayor.","fuente":"EHS/AHS 2022, cierre de incisiones abdominales"},{"tipo":"Diagnóstico","pregunta":"¿Qué factor aumenta el riesgo de hernia en el sitio de un trocar?","opciones":["Trocar de 10 mm o más en el ombligo","Trocar de 5 mm en el flanco derecho, lateral","Neumoperitoneo de 12 mmHg durante la cirugía","Cirugía de menos de una hora de duración"],"explicacion":"El riesgo de hernia aumenta con trocares de 10 mm o más, con los de incisión única y con los ubicados en el ombligo.","fuente":"EHS/AHS 2022, cierre de incisiones abdominales"},{"tipo":"Técnica","pregunta":"Si en otra paciente hicieras una laparotomía mediana electiva, ¿cómo cerrarías la fascia?","opciones":["Sutura continua de puntos pequeños, absorción lenta","Puntos separados grandes de absorción rápida","Puntos totales de retención en la piel","Sutura continua de nailon a 2 cm del borde"],"explicacion":"Para la laparotomía mediana electiva se recomienda la sutura continua de puntos pequeños con material de absorción lenta, que reduce la hernia incisional.","fuente":"EHS/AHS 2022, cierre de incisiones abdominales; Hermes: Dehiscencia aguda de la pared abdominal"}]},{"id":"base-22","tema":"Preoperatorio y posoperatorio","anio":1,"titulo":"Anciana confusa y somnolienta al segundo día","vineta":"Mujer de 82 años en el segundo día de una hemicolectomía. Ayer estaba lúcida; hoy está somnolienta, no sostiene la atención y por momentos se desorienta. No usa sus anteojos ni su audífono. Tiene sonda vesical y recibe morfina en horario fijo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Delirium posoperatorio hipoactivo","Demencia que se desenmascaró","Depresión reactiva","Sueño normal por la cirugía"],"explicacion":"El inicio agudo, el curso fluctuante, la inatención y el nivel de conciencia alterado definen el delirium; la forma hipoactiva suele pasar inadvertida.","fuente":"ESAIC 2024, delirium posoperatorio; Hermes: Delirium postoperatorio"},{"tipo":"Estudios","pregunta":"¿Qué buscás primero?","opciones":["Causas tratables: dolor, hipoxemia, infección, fármacos","Una TC de cerebro sin contraste como primer estudio","Un electroencefalograma de rutina para descartar crisis","Una punción lumbar para descartar meningitis"],"explicacion":"El delirium es un síndrome: siempre se buscan causas orgánicas y reversibles, como dolor, hipoxemia, infección, retención urinaria, fecaloma, deshidratación, alteraciones metabólicas y fármacos.","fuente":"Hermes: Delirium postoperatorio"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas indicás?","opciones":["Anteojos, audífono, orientación y movilización","Sujeción mecánica para evitar caídas de la cama","Una benzodiacepina para que duerma de noche","Habitación a oscuras durante todo el día"],"explicacion":"Las medidas no farmacológicas multicomponente (orientación, luz diurna y sueño, anteojos y audífonos, analgesia con mínima sedación, movilización, hidratación y retiro de sondas) previenen y tratan el delirium; las sujeciones y las benzodiacepinas lo empeoran.","fuente":"ESAIC 2024; Hermes: Delirium postoperatorio"},{"tipo":"Fármaco","pregunta":"¿Cuándo usarías un antipsicótico?","opciones":["Si fallan las medidas no farmacológicas","De rutina para prevenir el delirium","Antes de la cirugía en mayores de 80 años","En dosis altas, ante el primer signo"],"explicacion":"La guía sugiere haloperidol en dosis bajas para tratar el delirium cuando fallan las medidas no farmacológicas; dado en forma preventiva no redujo su incidencia.","fuente":"ESAIC 2024, delirium posoperatorio"}]},{"id":"base-23","tema":"Preoperatorio y posoperatorio","anio":1,"titulo":"Hipotensión que no responde en un paciente con corticoides","vineta":"Varón de 64 años con artritis reumatoidea que toma prednisona 20 mg/día desde hace 2 años. Se opera de una sigmoidectomía por diverticulitis perforada.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué hacés con la prednisona en el perioperatorio?","opciones":["La mantengo en su dosis habitual","La suspendo el día de la cirugía","La reemplazo por dexametasona","La duplico durante un mes"],"explicacion":"WSES 2021 no halló evidencia que respalde la dosis de estrés rutinaria en quien recibe corticoides: se mantiene la dosis habitual sin suspenderla.","fuente":"WSES 2021, abdomen agudo en inmunocomprometidos; Hermes: Insuficiencia suprarrenal perioperatoria"},{"tipo":"Diagnóstico","pregunta":"En el posoperatorio tiene hipotensión que no responde a los líquidos, sin otra causa evidente. ¿Qué sospechás?","opciones":["Insuficiencia suprarrenal aguda","Hipotensión por la anestesia peridural","Reacción a la transfusión","Hipovolemia por el ayuno"],"explicacion":"Con corticoides crónicos, la hipotensión inexplicada y refractaria a los líquidos debe hacer sospechar insuficiencia suprarrenal; no se demora el tratamiento para confirmarla.","fuente":"Hermes: Insuficiencia suprarrenal perioperatoria"},{"tipo":"Fármaco","pregunta":"¿Qué administrás?","opciones":["Hidrocortisona IV","Fludrocortisona oral","Dexametasona por vía oral","Prednisona oral en dosis doble"],"explicacion":"Ante hipotensión refractaria se administra hidrocortisona intravenosa sin esperar confirmación.","fuente":"WSES 2021; Hermes: Insuficiencia suprarrenal perioperatoria"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["100 mg IV y luego 50 mg cada 6 horas","10 mg IV una vez por día","1 g IV en dosis única","25 mg por vía oral cada 12 horas"],"explicacion":"WSES 2021 propone hidrocortisona 100 mg intravenosa seguida de 50 mg cada 6 horas.","fuente":"WSES 2021; Hermes: Insuficiencia suprarrenal perioperatoria"}]},{"id":"base-24","tema":"Principios de oncología y técnica","anio":1,"titulo":"Un CEA alto sin lesión","vineta":"Varón de 59 años, fumador, al que en un chequeo le encontraron un CEA de 9 ng/ml. Está asintomático; el examen y la colonoscopia completa son normales.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué significa el CEA elevado?","opciones":["No diagnostica cáncer por sí solo","Confirma un cáncer de colon oculto","Indica metástasis hepáticas ocultas","Obliga a una laparotomía exploradora"],"explicacion":"Un marcador tumoral aislado no diagnostica ni descarta cáncer: el tabaquismo y otras causas benignas lo elevan. Se usa sobre todo para el seguimiento de un cáncer ya diagnosticado.","fuente":"Hermes: Principios de oncología quirúrgica"},{"tipo":"Medidas generales","pregunta":"Otro paciente tiene un tumor de recto confirmado. ¿Cuándo se discute el plan en un comité multidisciplinario?","opciones":["Antes de cualquier tratamiento que cierre opciones","Después de la cirugía, con la pieza en la mano","Solo si la cirugía fracasa o hay recaída","Solo si aparecen metástasis a distancia"],"explicacion":"La discusión multidisciplinaria debe ocurrir antes de una intervención que cierre alternativas, porque la secuencia de cirugía, radioterapia y tratamiento sistémico cambia el resultado.","fuente":"Hermes: Principios de oncología quirúrgica"},{"tipo":"Técnica","pregunta":"En la cirugía, ¿qué hacés con la pieza?","opciones":["La oriento y marco los márgenes para el patólogo","La abro para ver el tumor antes de mandarla","La mando fragmentada para que se procese rápido","La guardo en formol sin indicaciones"],"explicacion":"Se preserva la orientación y se comunican sitio, márgenes y piezas al patólogo; abrir o fragmentar la pieza impide evaluar los márgenes.","fuente":"Hermes: Principios de oncología quirúrgica"}]},{"id":"base-25","tema":"Principios de oncología y técnica","anio":1,"titulo":"Resecable, operable y beneficioso","vineta":"Mujer de 76 años, frágil, con un cáncer gástrico con carcinomatosis peritoneal, que tolera la dieta y no sangra. El tumor primario es técnicamente resecable.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Indicás la gastrectomía?","opciones":["No: resecable no equivale a beneficioso","Sí, porque el tumor es técnicamente resecable","Sí, con peritonectomía y quimioterapia intraperitoneal","Sí, para mejorar la supervivencia global"],"explicacion":"Hay que separar resecable, técnicamente operable y clínicamente beneficioso. Con enfermedad metastásica, sin síntomas que tratar, una resección no ofrece beneficio y agrega morbilidad.","fuente":"Hermes: Principios de oncología quirúrgica"},{"tipo":"Conducta quirúrgica","pregunta":"Meses después tiene vómitos por obstrucción del antro. ¿Qué objetivo tendría una intervención?","opciones":["Paliar la obstrucción","Curar la enfermedad","Estadificar el tumor","Reducir la carga tumoral peritoneal"],"explicacion":"La cirugía o los procedimientos pueden tener un fin paliativo: aliviar una obstrucción, una hemorragia o el dolor, sin intención curativa.","fuente":"Hermes: Principios de oncología quirúrgica"},{"tipo":"Diagnóstico","pregunta":"En otro paciente operado, el patólogo informa tumor microscópico en el margen. ¿Cómo se clasifica la resección?","opciones":["R1","R0","R2","RX"],"explicacion":"R0 es sin tumor residual, R1 con tumor microscópico en el margen, R2 con tumor macroscópico residual y RX cuando no puede evaluarse.","fuente":"Clasificación R de la UICC; Hermes: Principios de oncología quirúrgica"}]},{"id":"base-26","tema":"Soporte nutricional","anio":1,"titulo":"¿Cuándo come después de una colectomía?","vineta":"Varón de 66 años, bien nutrido, operado de una hemicolectomía derecha laparoscópica con anastomosis. Primer día posoperatorio, sin náuseas, abdomen blando.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Cuándo empieza a comer?","opciones":["Ya, por vía oral según tolerancia","Cuando elimine gases","A los 5 días, por la anastomosis","Cuando se normalice la albúmina"],"explicacion":"Si el tubo digestivo funciona se evita el ayuno posoperatorio: la alimentación oral precoz es segura y una anastomosis no exige por sí sola varios días de dieta absoluta.","fuente":"Hermes: Soporte nutricional del paciente quirúrgico y Recuperación perioperatoria en cirugía digestiva"},{"tipo":"Estudios","pregunta":"¿Sirve la albúmina para decidir su soporte nutricional?","opciones":["No: refleja inflamación más que reservas","Sí: por debajo de 3,5 g/dl indica nutrición parenteral","Sí: es el mejor marcador nutricional","Sí: se corrige con infusión de albúmina"],"explicacion":"La albúmina y la prealbúmina se relacionan con el pronóstico, pero en la inflamación reflejan redistribución y gravedad; no diagnostican desnutrición ni se corrigen como objetivo aislado.","fuente":"Hermes: Soporte nutricional del paciente quirúrgico"},{"tipo":"Medidas generales","pregunta":"Si no pudiera comer por un íleo prolongado, ¿qué vía preferirías?","opciones":["Enteral, si el intestino es utilizable","Parenteral desde el primer día","Esperar sin aporte hasta que coma","Sueros glucosados prolongados"],"explicacion":"Se prefiere la vía enteral cuando es viable y se reserva la parenteral para la imposibilidad, la insuficiencia de la enteral o el riesgo nutricional alto.","fuente":"Hermes: Soporte nutricional del paciente quirúrgico"}]},{"id":"base-27","tema":"Soporte nutricional","anio":1,"titulo":"Nutrición en un paciente en shock","vineta":"Varón de 55 años en terapia intensiva tras una laparotomía por peritonitis fecal. Requiere dosis crecientes de noradrenalina y tiene lactato en aumento. Tiene una sonda nasogástrica.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Iniciás la nutrición enteral ahora?","opciones":["No, la difiero hasta recuperar la perfusión","Sí, a dosis plena por la sonda nasogástrica","Sí, con fórmula hipercalórica desde hoy","Sí, en bolos de 300 ml cada 4 horas"],"explicacion":"Durante el shock no controlado o con vasopresores en aumento no se inicia o se suspende la nutrición enteral por riesgo de isquemia intestinal; se reconsidera con cautela al recuperar la perfusión.","fuente":"Hermes: Soporte nutricional del paciente quirúrgico"},{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene la sobrealimentación en este paciente?","opciones":["Hiperglucemia y más producción de CO₂","Pérdida acelerada de masa muscular","Hipoglucemia de rebote al suspenderla","Menor riesgo de infección del catéter"],"explicacion":"La sobrealimentación aumenta la hiperglucemia, la producción de CO₂, la lipogénesis y las complicaciones; el aporte no suprime el catabolismo de la agresión.","fuente":"Hermes: Soporte nutricional del paciente quirúrgico"},{"tipo":"Técnica","pregunta":"En la relaparotomía se prevé soporte prolongado. ¿Colocás una yeyunostomía de alimentación?","opciones":["Según anatomía y duración prevista","Sí, en toda relaparotomía por peritonitis","No, la nutrición debe ser parenteral","Sí, junto con una gastrostomía de rutina"],"explicacion":"El acceso enteral se planifica según la anatomía, el riesgo de aspiración, la obstrucción distal y la duración prevista, sin colocar una ostomía de alimentación de manera automática.","fuente":"Hermes: Soporte nutricional del paciente quirúrgico"}]},{"id":"traq-02","tema":"Traqueostomías","anio":1,"titulo":"Cuidados y retiro de la cánula","vineta":"Varón de 60 años con traqueostomía desde hace 3 semanas por ventilación prolongada. Ya no está ventilado, respira por la cánula y se está recuperando.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué cuidados diarios son esenciales?","opciones":["Humidificar, aspirar suave y controlar el manguito","Cambiar la cánula una vez por día","Mantener el manguito inflado al máximo posible","Aspiración profunda de rutina cada hora"],"explicacion":"Humidificar, aspirar sin traumatizar, fijar bien la cánula, controlar la presión del manguito y vigilar el estoma son los cuidados esenciales.","fuente":"Hermes: Traqueotomía"},{"tipo":"Diagnóstico","pregunta":"¿Qué condiciones tiene que cumplir para decanularlo?","opciones":["Vía aérea permeable, tos eficaz y deglución segura","Que hayan pasado 30 días de la traqueostomía","Saturación normal con oxígeno a alto flujo","Que esté sin secreciones durante una semana"],"explicacion":"La decanulación requiere vía aérea superior permeable, tos eficaz, manejo de secreciones y deglución segura; no depende de un plazo fijo.","fuente":"Hermes: Traqueotomía"},{"tipo":"Diagnóstico","pregunta":"¿Qué complicación tardía puede dar una cánula con la punta mal posicionada?","opciones":["Erosión traqueal o de un vaso anterior","Neumotórax a tensión por la cánula","Hipocalcemia por lesión paratiroidea","Parálisis del nervio frénico derecho"],"explicacion":"Una cánula que no corresponde a la longitud y la curvatura traqueal puede erosionar la pared posterior o los vasos anteriores, con riesgo de fístula traqueoarterial.","fuente":"Hermes: Traqueotomía"}]},{"id":"traq-03","tema":"Traqueostomías","anio":1,"titulo":"Traqueostomía abierta en un cuello difícil","vineta":"Mujer de 68 años, obesa, con bocio y cuello corto, en ventilación mecánica prolongada. Se planifica la traqueostomía.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué técnica preferís?","opciones":["Abierta, por la anatomía difícil","Percutánea a ciegas en la cama","Cricotiroidotomía programada","Percutánea sin broncoscopia"],"explicacion":"La percutánea se evita cuando la anatomía no es identificable (bocio, obesidad, cuello corto) o el rescate es insuficiente; la técnica abierta permite exposición y control anatómico.","fuente":"Hermes: Traqueotomía"},{"tipo":"Técnica","pregunta":"¿En qué nivel abrís la tráquea?","opciones":["Entre el segundo y el cuarto anillo","A través del cartílago cricoides, más arriba","Por debajo del sexto anillo traqueal","En la membrana cricotiroidea, más alta"],"explicacion":"Se abre habitualmente entre el segundo y el cuarto anillo; se evita lesionar el cricoides (estenosis) y una apertura demasiado baja (vasos).","fuente":"Hermes: Traqueotomía"},{"tipo":"Técnica","pregunta":"¿Qué estructuras anticipás en la línea media?","opciones":["Istmo tiroideo y venas tiroideas inferiores","Nervios laríngeos recurrentes a ambos lados","Arterias carótidas comunes por delante","Conducto torácico en el ángulo venoso"],"explicacion":"En la línea media se anticipan el istmo tiroideo, las venas tiroideas inferiores, una eventual arteria tiroidea ima y, en niños o deformidades, grandes vasos altos.","fuente":"Hermes: Traqueotomía"}]},{"id":"var-02","tema":"Várices de miembros inferiores","anio":1,"titulo":"Ablación endovenosa de la safena interna","vineta":"Mujer de 50 años con várices sintomáticas y reflujo de la safena interna desde la unión safenofemoral hasta la pierna. Se planifica una ablación térmica endovenosa.","pasos":[{"tipo":"Técnica","pregunta":"¿Para qué sirve la anestesia tumescente alrededor de la vena?","opciones":["Protege piel y nervios del calor","Reemplaza la anestesia general","Dilata la vena para facilitar la punción","Evita la necesidad de ecografía"],"explicacion":"La anestesia tumescente perivenosa protege la piel y los nervios del calor, comprime la vena contra el catéter y da analgesia.","fuente":"Hermes: Várices de miembros inferiores"},{"tipo":"Estudios","pregunta":"¿Qué control hacés después?","opciones":["Eco Doppler para buscar trombosis","Dímero D seriado durante el primer mes","Flebografía de rutina al día siguiente","Radiografía de la pierna para ver el trayecto"],"explicacion":"Se vigila con ecografía la trombosis inducida por calor que progresa hacia la vena femoral, la trombosis venosa profunda y la recanalización.","fuente":"Hermes: Várices de miembros inferiores"},{"tipo":"Diagnóstico","pregunta":"Tras tratar la safena por debajo de la rodilla, tiene parestesias en la cara interna de la pierna. ¿Qué nervio se afectó?","opciones":["Nervio safeno, sensitivo","Nervio peroneo común","Nervio sural en la pantorrilla","Nervio tibial posterior"],"explicacion":"El nervio safeno acompaña a la safena interna en la pierna; su lesión térmica da parestesias en la cara interna. El sural acompaña a la safena externa.","fuente":"Hermes: Várices de miembros inferiores"}]},{"id":"var-03","tema":"Várices de miembros inferiores","anio":1,"titulo":"Várices sin reflujo de la safena","vineta":"Varón de 58 años con várices tributarias en la pantorrilla, molestas, sin reflujo de las safenas en el eco Doppler. Es diabético y fumador.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás para las tributarias?","opciones":["Flebectomía o escleroterapia","Safenectomía interna completa","Ablación térmica de la safena","Ligadura del cayado safenofemoral"],"explicacion":"Las tributarias se tratan con flebectomía o escleroterapia; sin reflujo safeno no hay indicación de tratar la safena.","fuente":"Hermes: Várices de miembros inferiores"},{"tipo":"Medidas generales","pregunta":"¿Por qué conviene preservar una safena sana en este paciente?","opciones":["Puede servir para un bypass en el futuro","Porque es la única vía de drenaje de la pierna","Porque su resección causa linfedema crónico","Porque evita la trombosis venosa profunda"],"explicacion":"La estrategia debe tratar la fuente de reflujo y respetar venas potencialmente útiles para bypass, sobre todo en un diabético fumador con riesgo arterial.","fuente":"Hermes: Várices de miembros inferiores"},{"tipo":"Medidas generales","pregunta":"¿Qué logran las medias de compresión?","opciones":["Alivian los síntomas, sin eliminar el reflujo","Curan las várices en 6 meses","Reemplazan a la cirugía de las várices","Previenen la aparición de nuevas várices"],"explicacion":"La compresión alivia los síntomas pero no elimina el reflujo ni las várices existentes.","fuente":"Hermes: Várices de miembros inferiores"}]},{"id":"aa-03","tema":"Abdomen agudo","anio":1,"titulo":"Dolor desproporcionado en un paciente con fibrilación auricular","vineta":"Mujer de 79 años con fibrilación auricular sin anticoagulación. Dolor abdominal súbito e intenso de 4 horas, con abdomen blando y poco doloroso a la palpación. Creatinina de 1,9 mg/dl.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Isquemia mesentérica aguda embólica","Cólico renal derecho complicado","Gastroenteritis aguda infecciosa","Pancreatitis aguda alcohólica"],"explicacion":"El dolor súbito y desproporcionado al examen en un paciente con fibrilación auricular sugiere embolia de la arteria mesentérica superior.","fuente":"WSES 2022, isquemia mesentérica aguda; Hermes: Isquemia mesentérica aguda"},{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["Angio-TC sin demora, aunque tenga la creatinina alta","Ecografía abdominal y esperar el lactato","Radiografía simple de abdomen","Angio-TC recién cuando mejore la función renal"],"explicacion":"La angio-TC debe hacerse sin demora ante la sospecha, aun con insuficiencia renal aguda: la demora en el diagnóstico explica la mortalidad del 30 al 70 % y es más perjudicial que el contraste.","fuente":"WSES 2022, isquemia mesentérica aguda"},{"tipo":"Estudios","pregunta":"El lactato es normal. ¿Descarta la isquemia?","opciones":["No: ningún marcador la descarta","Sí: un lactato normal la excluye","Sí, si además el dímero D es normal","Sí, si se mide en las primeras 6 horas"],"explicacion":"Ningún parámetro de laboratorio es lo bastante exacto para confirmar o descartar isquemia; el lactato puede ser normal al principio.","fuente":"WSES 2022, isquemia mesentérica aguda"},{"tipo":"Fármaco","pregunta":"La angio-TC confirma la embolia. ¿Qué anticoagulante indicás mientras se revasculariza?","opciones":["Heparina no fraccionada IV","Apixabán oral en dosis plena","Aspirina y clopidogrel","Warfarina oral con RIN 2-3"],"explicacion":"La heparina no fraccionada es eficaz y fácil de manejar, sobre todo con insuficiencia renal, mientras se organiza la revascularización.","fuente":"WSES 2022, isquemia mesentérica aguda"},{"tipo":"Conducta quirúrgica","pregunta":"Se revasculariza y queda intestino de viabilidad dudosa. ¿Qué hacés?","opciones":["Cierre temporal y reexploración programada","Resección de todo el intestino dudoso","Cierre definitivo y alta de terapia","Anastomosis primaria de los cabos"],"explicacion":"Con viabilidad dudosa se deja el abdomen con cierre temporal para una segunda mirada, que puede hacerse incluso por laparoscopia.","fuente":"WSES 2022, isquemia mesentérica aguda; Hermes: Laparotomía de segunda mirada"}]},{"id":"base-28","tema":"Anestesia y dolor","anio":1,"titulo":"Rigidez y CO2 en aumento en el quirófano","vineta":"Varón de 24 años en una apendicectomía con sevoflurano y succinilcolina para la intubación. A los 20 minutos aumenta el CO2 espirado a 70 mmHg pese a subir la ventilación, aparece taquicardia y rigidez maseterina.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Crisis de hipertermia maligna","Anafilaxia a la succinilcolina","Sepsis por la apendicitis","Hipertiroidismo descompensado"],"explicacion":"La hipercapnia inexplicada (CO2 espirado mayor de 55 mmHg), la taquicardia y la rigidez muscular, sobre todo maseterina, son signos tempranos de hipertermia maligna.","fuente":"JSA 2025, hipertermia maligna"},{"tipo":"Medidas generales","pregunta":"¿Qué hacés primero?","opciones":["Suspender los agentes desencadenantes","Bajar la ventilación por minuto","Agregar más sevoflurano","Esperar la temperatura para confirmar"],"explicacion":"Se suspenden los anestésicos inhalatorios y la succinilcolina, se hiperventila con oxígeno al 100 %, se administra dantrolene y se enfría. La fiebre puede aparecer tarde.","fuente":"JSA 2025, hipertermia maligna"},{"tipo":"Fármaco","pregunta":"¿Qué fármaco específico indicás?","opciones":["Dantrolene IV","Paracetamol IV","Hidrocortisona IV","Adrenalina intramuscular"],"explicacion":"El dantrolene es el tratamiento específico de la crisis; el paracetamol no corrige el mecanismo.","fuente":"JSA 2025 y EMHG 2024, hipertermia maligna"},{"tipo":"Dosis","pregunta":"¿Con qué dosis inicial recomienda el grupo europeo?","opciones":["2 a 2,5 mg/kg IV","0,2 mg/kg IV","10 mg IV fijos","25 mg/kg IV"],"explicacion":"El European Malignant Hyperthermia Group recomienda una dosis inicial de 2 a 2,5 mg/kg IV, que se repite hasta controlar la crisis.","fuente":"EMHG 2024 citado por JSA 2025"}]},{"id":"apend-03","tema":"Apendicitis aguda","anio":1,"titulo":"Dolor en fosa ilíaca derecha en una embarazada","vineta":"Mujer de 29 años con 22 semanas de embarazo, con dolor abdominal derecho de 20 horas, náuseas y febrícula. Leucocitos 15.000/mm³.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís primero?","opciones":["Ecografía con compresión gradual","TC de abdomen con contraste","Radiografía simple de abdomen","Laparoscopia diagnóstica directa"],"explicacion":"La ecografía con compresión gradual es la imagen inicial preferida en la embarazada; los signos clínicos aislados no alcanzan para el diagnóstico.","fuente":"WSES 2020, apendicitis aguda (Jerusalem)"},{"tipo":"Estudios","pregunta":"La ecografía no es concluyente. ¿Qué pedís?","opciones":["Resonancia magnética de abdomen","TC de abdomen y pelvis con contraste IV","Centellograma con leucocitos marcados","Repetir la ecografía en una semana"],"explicacion":"Si la ecografía no es concluyente, la resonancia, si está disponible, es sensible y muy específica para la apendicitis en el embarazo.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Conducta quirúrgica","pregunta":"Se confirma apendicitis. ¿Qué indicás?","opciones":["Apendicectomía urgente","Antibióticos solos","Control hasta el parto","Drenaje percutáneo"],"explicacion":"La guía sugiere no tratar la apendicitis en forma no operatoria durante el embarazo hasta que haya mejor evidencia.","fuente":"WSES 2020, apendicitis aguda"},{"tipo":"Técnica","pregunta":"¿Qué vía preferís?","opciones":["Laparoscópica, con experiencia disponible","Abierta, por incisión de McBurney","Laparotomía mediana infraumbilical","Abierta, por el riesgo para el feto"],"explicacion":"La apendicectomía laparoscópica es segura en el embarazo en cuanto a pérdida fetal y parto prematuro, y se prefiere a la abierta por menor estadía e infección del sitio quirúrgico.","fuente":"WSES 2020, apendicitis aguda; Hermes: Abdomen agudo durante el embarazo"}]},{"id":"base-29","tema":"Bioseguridad y aspectos médico-legales","anio":1,"titulo":"Rechazo de una transfusión","vineta":"Mujer de 45 años, lúcida, testigo de Jehová, con una hemorragia digestiva que cede con tratamiento endoscópico. Hemoglobina 6,5 g/dl. Rechaza en forma informada recibir sangre.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés frente al rechazo?","opciones":["Lo respeto y lo documento en la historia clínica","La transfundo igual por el riesgo de vida","Pido una orden judicial y transfundo","Le pido a la familia que firme por ella"],"explicacion":"La Ley 26.529 reconoce el derecho del paciente a aceptar o rechazar terapias o procedimientos, con o sin expresión de causa. Una paciente capaz e informada puede rechazar la transfusión.","fuente":"Ley 26.529, artículo 2, inciso e"},{"tipo":"Medidas generales","pregunta":"Más tarde cambia de opinión y acepta. ¿Es válido?","opciones":["Sí: la decisión es revocable","No: el rechazo firmado es definitivo","Solo con autorización judicial","Solo si la familia está de acuerdo"],"explicacion":"La decisión de consentir o rechazar un tratamiento puede ser revocada por el paciente.","fuente":"Ley 26.529, artículo 10"},{"tipo":"Medidas generales","pregunta":"¿Cómo puede dejar asentado su rechazo para una futura incapacidad?","opciones":["Con directivas anticipadas por escrito","Con un aviso verbal a la enfermera","Con una nota en el celular","No es posible hacerlo por adelantado"],"explicacion":"Toda persona capaz mayor de edad puede disponer directivas anticipadas sobre su salud, formalizadas por escrito ante escribano o juzgado con dos testigos, y revocables en todo momento.","fuente":"Ley 26.529, artículo 11"}]},{"id":"base-30","tema":"Hemostasia y trombosis","anio":1,"titulo":"Apendicitis en un paciente con dabigatrán","vineta":"Varón de 74 años con fibrilación auricular que toma dabigatrán 150 mg cada 12 horas; la última dosis fue hace 4 horas. Tiene una apendicitis complicada que requiere cirugía urgente.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué agente revierte el dabigatrán?","opciones":["Idarucizumab","Vitamina K","Protamina","Andexanet alfa"],"explicacion":"El idarucizumab es un fragmento de anticuerpo monoclonal que revierte el dabigatrán. La vitamina K revierte la warfarina, la protamina la heparina y el andexanet los inhibidores del factor Xa.","fuente":"RE-VERSE AD (Pollack, NEJM 2017;377:431)"},{"tipo":"Dosis","pregunta":"¿Con qué dosis?","opciones":["5 g por vía intravenosa","0,5 g por vía intravenosa","50 mg/kg por vía intravenosa","5 g por vía oral, en una toma"],"explicacion":"En RE-VERSE AD se administraron 5 g de idarucizumab intravenoso, con reversión completa del efecto en la mediana de los pacientes.","fuente":"RE-VERSE AD (Pollack, NEJM 2017;377:431)"},{"tipo":"Medidas generales","pregunta":"¿Cuánto tardó, en mediana, la cirugía después del idarucizumab en el ensayo?","opciones":["Alrededor de 1,6 horas","Alrededor de 24 horas","Alrededor de 3 días","Alrededor de una semana"],"explicacion":"En el grupo con procedimiento urgente, la mediana hasta empezarlo fue de 1,6 horas, con hemostasia periprocedimiento normal en el 93,4 %.","fuente":"RE-VERSE AD (Pollack, NEJM 2017;377:431)"}]},{"id":"umb-03","tema":"Hernia umbilical y epigástrica","anio":1,"titulo":"Hernia umbilical sintomática en un adulto","vineta":"Varón de 50 años, IMC 27, sin otras enfermedades, con una hernia umbilical de 2 cm, reducible y dolorosa al hacer fuerza.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo la reparás?","opciones":["Con malla protésica","Con sutura simple","Con faja abdominal","Con plicatura sin malla"],"explicacion":"La recomendación principal de la guía es usar malla en la reparación de hernias umbilicales y epigástricas para reducir la recurrencia.","fuente":"EHS/AHS 2020, hernia umbilical y epigástrica (Br J Surg 107:171)"},{"tipo":"Técnica","pregunta":"¿Qué técnica sugiere la guía para la mayoría de los casos?","opciones":["Abierta con malla plana preperitoneal","Laparoscópica intraperitoneal de rutina","Abierta con malla en tapón","Abierta con malla onlay amplia"],"explicacion":"La mayoría puede repararse por vía abierta con una malla plana preperitoneal.","fuente":"EHS/AHS 2020, hernia umbilical y epigástrica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuándo considerarías la vía laparoscópica?","opciones":["Defecto grande o riesgo de complicar la herida","En hernias umbilicales sintomáticas de rutina","Solo en hernias pequeñas, menores de 1 cm","Cuando el paciente prefiere anestesia local"],"explicacion":"La vía laparoscópica puede considerarse si el defecto es grande o el paciente tiene más riesgo de complicaciones de la herida.","fuente":"EHS/AHS 2020, hernia umbilical y epigástrica"}]},{"id":"pleura-03","tema":"Manejo del espacio pleural","anio":1,"titulo":"Derrame maligno que vuelve","vineta":"Mujer de 67 años con cáncer de ovario y derrame pleural derecho maligno que se reproduce a las 2 semanas de cada toracocentesis, con disnea. Tras la última evacuación, el pulmón no se reexpandió.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué significa que el pulmón no se reexpanda?","opciones":["Pulmón atrapado por la pleura visceral","Neumotórax a tensión por la punción","Atelectasia por tapón mucoso","Recidiva tumoral en el bronquio fuente"],"explicacion":"Si el pulmón no se expande después de evacuar el derrame, está atrapado por la pleura visceral engrosada; eso cambia la elección del tratamiento.","fuente":"Hermes: Derrame pleural"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento preferís?","opciones":["Catéter pleural permanente","Pleurodesis con talco","Toracocentesis semanales","Decorticación abierta"],"explicacion":"En el derrame maligno recurrente se elige entre catéter pleural permanente y pleurodesis según la expansión pulmonar, la supervivencia, las preferencias y los recursos; con pulmón atrapado la pleurodesis no funciona y se prefiere el catéter.","fuente":"Hermes: Derrame pleural"},{"tipo":"Estudios","pregunta":"¿Qué estudio guía la punción pleural?","opciones":["Ecografía torácica en la cama","Radiografía de tórax de pie y de perfil","TC de tórax antes de cada punción","Los reparos anatómicos, sin imagen"],"explicacion":"La ecografía confirma el volumen y los tabiques y marca un sitio seguro de punción.","fuente":"Hermes: Derrame pleural"}]},{"id":"base-31","tema":"Shock","anio":1,"titulo":"Taquicardia después de una esplenectomía","vineta":"Varón de 40 años, 6 horas después de una esplenectomía por trauma. Frecuencia cardíaca 128, presión 100/70 mmHg, piel fría, relleno capilar lento. El drenaje aportó 600 ml de sangre en 2 horas.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Shock hemorrágico con presión conservada","Dolor posoperatorio mal controlado","Respuesta a la fiebre por atelectasia","Ansiedad y dolor por la internación"],"explicacion":"La hipotensión es tardía: taquicardia, piel fría, relleno lento y sangrado por el drenaje indican shock hemorrágico aunque la presión se mantenga.","fuente":"Hermes: Shock en el paciente quirúrgico"},{"tipo":"Estudios","pregunta":"¿Qué te orienta mejor sobre la perfusión?","opciones":["Tendencia del lactato y examen clínico","Un hematocrito aislado","La presión arterial sistólica sola","La temperatura central"],"explicacion":"El lactato y el déficit de bases, con su tendencia, junto con el examen, estiman la deuda de oxígeno; un hematocrito inicial puede ser normal durante la pérdida aguda.","fuente":"Hermes: Shock en el paciente quirúrgico"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reanimar y reoperar para controlar el sangrado","Solo cristaloides y observar","Esperar el hematocrito de control","Transfundir y dar el alta de recuperación"],"explicacion":"La reanimación se hace mientras se controla la causa: con sangrado activo por el drenaje y signos de shock, hay que reoperar.","fuente":"Hermes: Hemostasia y transfusión perioperatoria"},{"tipo":"Medidas generales","pregunta":"Si el sangrado fuera masivo, ¿cómo transfundís?","opciones":["Activando el protocolo de transfusión masiva","Solo glóbulos rojos hasta normalizar la hemoglobina","Esperando el coagulograma antes del plasma","Con cristaloides y coloides primero"],"explicacion":"En la hemorragia exanguinante se activa el protocolo institucional de transfusión masiva, con plasma y plaquetas, sin esperar a normalizar el laboratorio.","fuente":"Hermes: Hemostasia y transfusión perioperatoria"}]},{"id":"ano-04","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Dolor anal desgarrante de 3 meses","vineta":"Mujer de 32 años con dolor anal intenso durante y después de defecar desde hace 3 meses, con sangrado escaso. Fisura en la línea media posterior con bordes indurados, colgajo centinela y fibras del esfínter interno visibles. Continencia normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Fisura anal crónica primaria","Fisura anal aguda","Fisura secundaria a enfermedad de Crohn","Fístula perianal"],"explicacion":"Más de 6 semanas de evolución, colgajo centinela, papila hipertrófica y fibras del esfínter interno expuestas definen la cronicidad. La ubicación posterior en la línea media es típica; las laterales obligan a buscar otra causa.","fuente":"WSES-AAST 2021; Hermes: Fisura anal"},{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Fibra, agua, baños de asiento y analgesia","Dieta sin residuos para defecar menos veces","Laxantes estimulantes diarios por un mes completo","Ir directo a la esfinterotomía sin medidas previas"],"explicacion":"Corregir la consistencia fecal es la base de todo tratamiento: las heces duras perpetúan la lesión.","fuente":"WSES-AAST 2021; Hermes: Fisura anal"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento farmacológico de primera línea indicás?","opciones":["Diltiazem tópico al 2 % (bloqueante cálcico)","Corticoide tópico en crema dos veces por día","Antibiótico oral (metronidazol) por 7 días","Dilatación anal manual bajo anestesia"],"explicacion":"Los bloqueantes cálcicos tópicos tienen eficacia similar a los nitratos con menos cefalea, y son la primera línea en la fisura crónica. La dilatación manual está contraindicada por la incontinencia que causa.","fuente":"ASCRS 2023, fisura anal"},{"tipo":"Dosis","pregunta":"¿Cómo se aplica?","opciones":["Pomada 2 veces por día durante 6 a 8 semanas","Una única aplicación antes de defecar","Una vez por semana durante un mes completo","Cuando duele, como máximo durante 3 días seguidos"],"explicacion":"La relajación química del esfínter necesita constancia: se aplica dos veces por día durante 6 a 8 semanas antes de considerar el fracaso.","fuente":"ASCRS 2023, fisura anal; formulario NHS y BMJ Best Practice (gliceril trinitrato 0,4 %)"},{"tipo":"Conducta quirúrgica","pregunta":"No cicatriza tras 8 semanas de tratamiento correcto. ¿Qué indicás?","opciones":["Esfinterotomía lateral interna, o toxina botulínica","Fistulotomía de la fisura con sedal cortante en dos tiempos","Dilatación anal forzada bajo anestesia","Hemorroidectomía con resección del colgajo"],"explicacion":"La esfinterotomía lateral interna es el tratamiento más eficaz de la fisura crónica refractaria en pacientes sin incontinencia previa; la toxina botulínica es una alternativa con menos riesgo funcional pero más recurrencia.","fuente":"ASCRS 2023, fisura anal"}]},{"id":"ano-05","tema":"Fisuras y fístulas anales","anio":2,"titulo":"Orificio que supura después de un absceso","vineta":"Varón de 40 años al que le drenaron un absceso perianal hace 4 meses. Persiste un orificio externo a 2 cm del margen anal que supura en forma intermitente. Al tacto se palpa un cordón hacia la línea media posterior.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Fístula perianal","Fisura anal","Quiste pilonidal","Hidradenitis supurativa"],"explicacion":"Un orificio externo que supura tras el drenaje de un absceso, con un trayecto palpable hacia el canal anal, es una fístula de origen criptoglandular.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Estudios","pregunta":"¿Cuándo pedís una resonancia pélvica?","opciones":["Si es compleja, recidivada, anterior en la mujer o con Crohn","De rutina antes de operar una fístula, aunque sea simple y baja","Recién cuando fracasó una fistulotomía previa","Cuando hay fiebre o dolor durante el examen"],"explicacion":"La resonancia es el mapa preferido para fístulas complejas, recurrentes o en Crohn. En una fístula simple baja puede bastar el examen bajo anestesia.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"En el examen bajo anestesia es interesfinteriana baja. ¿Qué hacés?","opciones":["Fistulotomía en un tiempo","Colgajo de avance rectal","Colostomía de protección","Antibióticos prolongados"],"explicacion":"La fistulotomía cura la fístula simple baja con mínimo riesgo para la continencia. Las técnicas que preservan el esfínter (sedal, colgajo, LIFT) se reservan para fístulas que comprometen más esfínter.","fuente":"Hermes: Absceso y fístula anorrectal"},{"tipo":"Técnica","pregunta":"Si comprometiera más de un tercio del esfínter externo, ¿qué harías en un primer tiempo?","opciones":["Sedal laxo y luego una técnica que preserve el esfínter","Fistulotomía completa igual, en un solo tiempo","Inyectar adhesivo de fibrina en el trayecto y dar el alta definitiva","Colostomía de protección y fistulotomía diferida"],"explicacion":"Seccionar mucho esfínter arriesga incontinencia. El sedal laxo controla la sepsis y permite luego un colgajo de avance, LIFT u otra técnica conservadora.","fuente":"Hermes: Absceso y fístula anorrectal"}]},{"id":"pilo-01","tema":"Quiste pilonidal","anio":2,"titulo":"Dolor sacrococcígeo con tumefacción","vineta":"Varón de 20 años, peludo, con 3 días de dolor y tumefacción fluctuante en el pliegue interglúteo. Se ven dos fositas en la línea media. Afebril.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Absceso pilonidal","Absceso perianal profundo","Hidradenitis supurativa","Quiste dermoide sacro"],"explicacion":"Fositas en la línea media del pliegue con un absceso adyacente son la presentación aguda de la enfermedad pilonidal.","fuente":"Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés ahora?","opciones":["Incisión y drenaje lateral a la línea media","Resección amplia del quiste en la misma urgencia","Antibióticos solos y control en 48 horas","Resección y colgajo romboidal de urgencia"],"explicacion":"El absceso se drena; la resección definitiva se planifica después, cuando la inflamación cede. Una incisión fuera de la línea media cicatriza mejor.","fuente":"ASCRS 2019, enfermedad pilonidal; Hermes: Quiste pilonidal"},{"tipo":"Conducta quirúrgica","pregunta":"Meses después tiene enfermedad crónica sintomática. ¿Qué técnica evitás?","opciones":["Escisión con cierre primario en la línea media","Técnicas de cierre fuera de la línea media (Karydakis, Bascom)","Pit-picking","Destechado"],"explicacion":"El cierre en la línea media tiene más infección y recurrencia. Las técnicas que aplanan el pliegue y cierran fuera de la línea media son preferibles.","fuente":"ASCRS 2
