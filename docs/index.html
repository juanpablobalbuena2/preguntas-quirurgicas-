 endoscópica de una úlcera de alto riesgo, el inhibidor de bomba en dosis altas reduce el resangrado.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["80 mg IV y luego 8 mg/h durante 72 horas","20 mg VO por día durante 8 semanas","40 mg IV por semana durante un mes","80 mg IV en dosis única y luego 20 mg VO por día"],"explicacion":"El esquema es un bolo de 80 mg seguido de infusión de 8 mg/h o bolos intermitentes en dosis altas durante 72 horas, y luego dos dosis diarias por vía oral.","fuente":"ESGE 2021, hemorragia digestiva alta no varicosa"},{"tipo":"Conducta quirúrgica","pregunta":"Resangra y falla una segunda endoscopia. ¿Qué hacés?","opciones":["Angioembolización o cirugía con ligadura del vaso","Tercera endoscopia con clips y adrenalina","Duplicar la infusión de inhibidor de bomba","Transfundir y esperar que deje de sangrar"],"explicacion":"Si falla el segundo intento endoscópico, la embolización de la gastroduodenal o la cirugía con ligadura del vaso son las opciones de rescate.","fuente":"ESGE 2021; Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Fármaco","pregunta":"La biopsia muestra Helicobacter pylori. ¿Qué tratamiento de erradicación indicás en una región con resistencia a la claritromicina del 15 % o más?","opciones":["Cuádruple con bismuto durante 14 días","Triple con claritromicina durante 7 días","Amoxicilina en dosis altas sola por 14 días","Inhibidor de bomba sin antibióticos por 8 semanas"],"explicacion":"Maastricht VI recomienda, donde la resistencia a la claritromicina es del 15 % o más, la cuádruple con bismuto durante 14 días (o la concomitante sin bismuto), y confirmar la erradicación con prueba de aliento.","fuente":"Maastricht VI/Florence 2022"}]},{"id":"ulcera-02","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Úlcera gástrica que no cicatriza","vineta":"Varón de 60 años con una úlcera de 2 cm en la curvatura menor del antro. Erradicó H. pylori y recibió inhibidor de bomba 12 semanas, pero la úlcera persiste. Las biopsias fueron negativas.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué hacés antes de decidir la cirugía?","opciones":["Repetir la endoscopia con biopsias múltiples","Operar sin más estudios, por la refractariedad","Suspender el inhibidor de bomba y observar","Una TC de abdomen con contraste"],"explicacion":"Toda úlcera gástrica refractaria obliga a repetir las biopsias, porque puede ser un cáncer; también se revisan el consumo de AINE y la erradicación.","fuente":"Hermes: Enfermedad ulcerosa péptica"},{"tipo":"Conducta quirúrgica","pregunta":"Persiste refractaria y benigna. ¿Qué cirugía indicás?","opciones":["Gastrectomía distal que incluya la úlcera","Vagotomía troncular y piloroplastia","Gastrectomía total con Y de Roux","Fundoplicatura y piloroplastia"],"explicacion":"La úlcera gástrica refractaria se reseca con una gastrectomía distal que la incluya; así se trata y se obtiene diagnóstico histológico completo.","fuente":"Hermes: Gastrectomía; Reconstrucción después de gastrectomía"},{"tipo":"Diagnóstico","pregunta":"Meses después tiene sudoración, palpitaciones y diarrea a los 20 minutos de comer. ¿Qué es?","opciones":["Síndrome de dumping temprano","Dumping tardío por hipoglucemia","Síndrome del asa aferente por obstrucción","Úlcera de la boca anastomótica"],"explicacion":"Los síntomas vasomotores y digestivos en los primeros 30 minutos se deben al paso rápido de contenido hiperosmolar al intestino; el dumping tardío ocurre 1 a 3 horas después por hipoglucemia.","fuente":"Hermes: Complicaciones de gastrectomía"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás primero para el dumping?","opciones":["Comidas chicas y frecuentes, sin azúcares simples ni líquidos","Reoperación con conversión a Y de Roux en el corto plazo, sin dieta previa","Dieta rica en azúcares para evitar la hipoglucemia","Octreótido subcutáneo antes de cada comida"],"explicacion":"La mayoría mejora con medidas dietéticas; el octreótido o la reoperación se reservan para los casos refractarios.","fuente":"Hermes: Complicaciones de gastrectomía"}]},{"id":"erge-01","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Pirosis de años","vineta":"Varón de 42 años con pirosis y regurgitación desde hace 5 años, sin disfagia, sin pérdida de peso ni anemia. IMC 29.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué medidas generales indicás?","opciones":["Bajar de peso, elevar la cabecera y no cenar tarde","Dieta líquida estricta por 4 semanas","Reposo después de cada comida, acostado","Evitar las comidas picantes como medida principal"],"explicacion":"La pérdida de peso, la elevación de la cabecera y evitar comer antes de acostarse tienen respaldo para mejorar el reflujo.","fuente":"Hermes: Enfermedad por reflujo gastroesofágico"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento farmacológico inicial indicás?","opciones":["Inhibidor de bomba antes del desayuno por 8 semanas","Antiácidos a demanda después de cada comida","Procinéticos (domperidona) antes de cada comida, por 8 semanas","Antibióticos para erradicar H. pylori"],"explicacion":"El inhibidor de bomba en dosis estándar, tomado 30 a 60 minutos antes del desayuno durante 8 semanas, es el tratamiento inicial del reflujo típico sin síntomas de alarma.","fuente":"Hermes: Enfermedad por reflujo gastroesofágico"},{"tipo":"Estudios","pregunta":"Persiste regurgitación pese al tratamiento y quiere operarse. ¿Qué estudios pedís?","opciones":["Endoscopia, pH-metría sin inhibidor de bomba y manometría","Radiografía de tórax y seriada esofagogastroduodenal con bario","Endoscopia y pH-metría bajo inhibidor de bomba","TC de abdomen y endoscopia"],"explicacion":"Antes de la cirugía hay que demostrar el reflujo en forma objetiva (esofagitis grave o tiempo de exposición ácida elevado) y descartar con manometría un trastorno motor como la acalasia.","fuente":"Lyon 2.0 (2023); Hermes: Fundoplicatura laparoscópica"},{"tipo":"Diagnóstico","pregunta":"¿Qué tiempo de exposición ácida en la pH-metría es concluyente de reflujo según Lyon?","opciones":["Más del 6 %","Más del 1 %","Más del 30 %","Más del 15 %"],"explicacion":"Según el consenso de Lyon, un tiempo de exposición ácida mayor del 6 % es concluyente, menor del 4 % es normal y entre 4 y 6 % es indeterminado.","fuente":"Lyon 2.0 (2023)"},{"tipo":"Técnica","pregunta":"Los estudios confirman reflujo con motilidad normal. ¿Qué cirugía indicás?","opciones":["Fundoplicatura laparoscópica con cierre de pilares","Gastrectomía subtotal con Y de Roux","Esofagectomía distal con anastomosis","Miotomía de Heller con funduplicatura parcial"],"explicacion":"La fundoplicatura laparoscópica con cierre crural es el tratamiento quirúrgico estándar; la miotomía es para acalasia.","fuente":"Hermes: Fundoplicatura laparoscópica"}]},{"id":"erge-02","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Hernia paraesofágica sintomática","vineta":"Mujer de 74 años con plenitud posprandial, dolor torácico al comer y anemia ferropénica. TC: hernia paraesofágica con más de la mitad del estómago en el tórax.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué explica la anemia?","opciones":["Erosiones de Cameron en el cuello herniario","Cáncer gástrico del fundus herniado","Hemorroides internas sangrantes","Gastritis atrófica con déficit de B12"],"explicacion":"Las lesiones de Cameron, erosiones lineales en el cuello de la hernia, causan pérdida crónica de sangre; igual corresponde la endoscopia para descartar otras causas.","fuente":"Hermes: Hernia hiatal y paraesofágica"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Reparación laparoscópica programada con fundoplicatura","Observación y control endoscópico anual","Gastrectomía total con esofagoyeyunostomía","Hierro endovenoso e inhibidor de bomba de por vida, sin cirugía"],"explicacion":"La hernia paraesofágica sintomática se repara; los pasos clave son reducir el estómago, resecar el saco, lograr esófago intraabdominal sin tensión, cerrar los pilares y agregar una fundoplicatura.","fuente":"Hermes: Hernia hiatal y paraesofágica"},{"tipo":"Diagnóstico","pregunta":"Si llegara con dolor intenso, arcadas sin vómito e imposibilidad de pasar una sonda nasogástrica, ¿qué sospecharías?","opciones":["Vólvulo gástrico agudo (tríada de Borchardt)","Infarto agudo de miocardio inferior","Pancreatitis aguda necrotizante","Perforación esofágica (síndrome de Boerhaave)"],"explicacion":"La tríada de Borchardt (dolor epigástrico, arcadas improductivas e imposibilidad de pasar la sonda) indica vólvulo gástrico, una urgencia por riesgo de isquemia.","fuente":"Hermes: Hernia hiatal y paraesofágica"}]},{"id":"mama-03","tema":"Patología mamaria y cáncer de mama","anio":3,"titulo":"Microcalcificaciones en un control","vineta":"Mujer de 52 años asintomática. Mamografía de control: microcalcificaciones finas lineales agrupadas en 2 cm del cuadrante superoexterno izquierdo (BI-RADS 4C).","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo obtenés el diagnóstico?","opciones":["Biopsia asistida por vacío guiada por estereotaxia","Control mamográfico con magnificación en 6 meses","Ecografía dirigida y alta si es normal","Mastectomía simple sin biopsia previa"],"explicacion":"Las microcalcificaciones sospechosas sin masa se biopsian con guía estereotáxica, habitualmente con sistemas asistidos por vacío; se deja un marcador.","fuente":"Hermes: Evaluación de la patología mamaria"},{"tipo":"Diagnóstico","pregunta":"Informa carcinoma ductal in situ de alto grado. ¿Qué significa?","opciones":["Cáncer confinado a los conductos, sin invasión","Cáncer invasor con alto riesgo de metástasis ganglionares","Lesión benigna sin riesgo de progresar a cáncer invasor","Mastopatía fibroquística con hiperplasia atípica"],"explicacion":"El carcinoma in situ no atraviesa la membrana basal y por eso no da metástasis ganglionares, pero puede progresar a invasor.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Técnica","pregunta":"¿Cómo lo resecás?","opciones":["Escisión con marcación previa y radiografía de la pieza","Mastectomía radical modificada con vaciamiento","Cuadrantectomía con vaciamiento axilar completo","Resección guiada por palpación, sin marcación previa"],"explicacion":"Las lesiones no palpables se localizan antes de operar y se verifica en la pieza que las calcificaciones fueron resecadas. Después de la cirugía conservadora se indica radioterapia.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"¿Hacés biopsia de ganglio centinela en la cirugía conservadora del carcinoma in situ?","opciones":["No de rutina; sí con mastectomía o sospecha de invasión","Sí, porque el carcinoma es de alto grado","No: vaciamiento axilar directo por tratarse de un alto grado","Sí, pero solo si el in situ es de bajo grado"],"explicacion":"Sin invasión no hay metástasis ganglionares; el centinela se agrega en la mastectomía (porque después no puede hacerse) o si se sospecha un componente invasor.","fuente":"Hermes: Cirugía axilar en cáncer de mama"}]},{"id":"uro-01","tema":"Nefrectomías","anio":3,"titulo":"Masa renal incidental","vineta":"Varón de 58 años con una masa sólida de 3 cm en el polo inferior del riñón derecho, con realce, hallada en una TC por otro motivo. Función renal normal y riñón contralateral sano.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué es lo más probable?","opciones":["Carcinoma de células renales (T1a)","Quiste simple","Angiomiolipoma con grasa macroscópica","Absceso renal"],"explicacion":"Una masa sólida que realza es un carcinoma renal hasta demostrar lo contrario; menor de 4 cm es T1a. El angiomiolipoma se reconoce por grasa macroscópica.","fuente":"EAU 2024, carcinoma renal; Hermes: Nefrectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Nefrectomía parcial","Nefrectomía radical","Nefroureterectomía","Vigilancia activa con TC anual"],"explicacion":"Para tumores T1 que técnicamente lo permitan se prefiere la nefrectomía parcial, porque preserva función renal con control oncológico equivalente.","fuente":"EAU 2024, carcinoma renal"},{"tipo":"Técnica","pregunta":"Si hicieras una nefrectomía radical, ¿en qué orden tratás los vasos del pedículo?","opciones":["Primero la arteria y luego la vena","Primero la vena y luego la arteria","Ambos juntos en masa","Es indistinto el orden"],"explicacion":"Ligar primero la arteria evita la congestión y el sangrado del riñón que se produciría al ocluir la vena con la arteria abierta.","fuente":"Hermes: Nefrectomía"}]},{"id":"uro-02","tema":"Histerectomías","anio":3,"titulo":"Uréter seccionado durante una histerectomía","vineta":"Durante una histerectomía abdominal por miomas, al ligar la arteria uterina izquierda notás orina en el campo y un uréter seccionado a 3 cm de la vejiga.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Dónde es más vulnerable el uréter en la histerectomía?","opciones":["Donde cruza por debajo de la arteria uterina","En la unión pieloureteral","En el cruce con el psoas a nivel lumbar","En su entrada al trígono vesical"],"explicacion":"El uréter pasa por debajo de la arteria uterina a unos 1,5 a 2 cm del cuello uterino (\"el agua pasa bajo el puente\"); también es vulnerable en el ligamento infundibulopélvico.","fuente":"Hermes: Histerectomía; Lesión iatrogénica de la vía urinaria"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cómo reparás una sección del uréter distal tan cerca de la vejiga?","opciones":["Reimplante ureterovesical sobre un catéter doble J","Ureteroureterostomía terminoterminal espatulada","Ligadura del uréter y nefrostomía definitiva","Nefrectomía izquierda en el mismo acto"],"explicacion":"Las lesiones del tercio distal se reparan con reimplante en la vejiga; el psoas hitch o el colgajo de Boari ganan longitud. La anastomosis terminoterminal es para lesiones cortas del tercio medio o superior.","fuente":"AUA 2017, trauma urológico; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Medidas generales","pregunta":"¿Qué principio general guía la reparación?","opciones":["Repararla en el acto, sin tensión y con drenaje","Esperar a que dé síntomas para confirmar la lesión","Sutura con material no reabsorbible y sin catéter","No drenar el lecho para no favorecer la fístula urinaria"],"explicacion":"La reparación inmediata tiene mejores resultados; se usan anastomosis sin tensión, espatuladas, con sutura reabsorbible, catéter y drenaje.","fuente":"AUA 2017, trauma urológico"}]},{"id":"colon-01","tema":"Cáncer de colon","anio":3,"titulo":"Anemia y tumor en el ciego","vineta":"Mujer de 68 años con anemia ferropénica y astenia. Colonoscopia: tumor ulcerado en el ciego; la biopsia informa adenocarcinoma. El resto del colon está libre.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudios de estadificación pedís?","opciones":["TC de tórax, abdomen y pelvis con contraste y CEA","Ecografía abdominal y radiografía de tórax","PET-TC de cuerpo entero de rutina","Resonancia de abdomen y centellograma óseo"],"explicacion":"La estadificación del cáncer de colon se hace con TC de tórax, abdomen y pelvis y CEA basal; el PET se reserva para situaciones dudosas.","fuente":"ESMO 2023, cáncer de colon localizado; Hermes: Cirugía del cáncer de colon"},{"tipo":"Conducta quirúrgica","pregunta":"No hay metástasis. ¿Qué cirugía indicás?","opciones":["Hemicolectomía derecha con ligadura central y linfadenectomía","Resección segmentaria del ciego con márgenes de 2 cm a cada lado","Colectomía total con ileorrectoanastomosis","Mucosectomía endoscópica y control"],"explicacion":"El cáncer del ciego se trata con hemicolectomía derecha oncológica, con ligadura en el origen de los vasos y resección del mesocolon con sus ganglios.","fuente":"Hermes: Colectomía derecha"},{"tipo":"Técnica","pregunta":"¿Cuántos ganglios como mínimo debe tener la pieza para una estadificación adecuada?","opciones":["12","3","30","6"],"explicacion":"Al menos 12 ganglios en la pieza son necesarios para estadificar con confianza; menos de 12 se considera factor de riesgo en estadio II.","fuente":"ESMO 2023, cáncer de colon localizado"},{"tipo":"Fármaco","pregunta":"La anatomía patológica es pT3 N1 (estadio III). ¿Qué indicás?","opciones":["Quimioterapia adyuvante (CAPOX o FOLFOX)","Seguimiento con CEA y TC, sin adyuvancia","Radioterapia adyuvante sobre el lecho tumoral","Inmunoterapia con anti-PD-1 de rutina"],"explicacion":"El estadio III recibe quimioterapia adyuvante con oxaliplatino y fluoropirimidina; reduce la recurrencia y la mortalidad.","fuente":"ESMO 2023, cáncer de colon localizado"},{"tipo":"Dosis","pregunta":"¿Cuánto dura en un estadio III de bajo riesgo (T1-3 N1) con CAPOX?","opciones":["3 meses","2 semanas","24 meses","12 meses"],"explicacion":"El análisis IDEA mostró que 3 meses de CAPOX son no inferiores a 6 en el estadio III de bajo riesgo, con mucha menos neuropatía; en alto riesgo (T4 o N2) se prefieren 6 meses.","fuente":"Ensayo IDEA; ESMO 2023"}]},{"id":"colon-02","tema":"Cáncer de colon","anio":3,"titulo":"Oclusión por cáncer de sigma","vineta":"Varón de 76 años con distensión, vómitos y sin eliminación de gases desde hace 3 días. TC: tumor estenosante del sigma con colon proximal dilatado (ciego de 9 cm) sin perforación ni metástasis. Estable.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué riesgo tiene un ciego tan dilatado con válvula ileocecal competente?","opciones":["Perforación del ciego (asa cerrada)","Vólvulo de sigma secundario","Isquemia del sigma por el tumor","Fístula colovesical"],"explicacion":"Con válvula competente el colon queda en asa cerrada; el ciego es el segmento de mayor diámetro y el que se perfora, sobre todo por encima de 10 a 12 cm.","fuente":"Hermes: Cirugía del cáncer de colon"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué opciones son razonables?","opciones":["Hartmann o, en centros con experiencia, prótesis como puente","Observar con sonda nasogástrica y enemas evacuantes durante una semana","Colonoscopia descompresiva y alta con dieta","Quimioterapia neoadyuvante sin descompresión"],"explicacion":"La obstrucción izquierda se resuelve con resección (Hartmann o anastomosis con o sin ostomía de protección según el paciente) o con prótesis como puente; ambas son aceptables según el contexto y la experiencia.","fuente":"Hermes: Cirugía del cáncer de colon"},{"tipo":"Técnica","pregunta":"En la laparotomía el ciego está isquémico con desgarros serosos. ¿Qué hacés?","opciones":["Colectomía subtotal que incluya el ciego y el tumor","Resección del sigma y observar el ciego","Cecostomía con sonda y resección del sigma","Sutura de los desgarros serosos y operación de Hartmann"],"explicacion":"Si el ciego está comprometido, se incluye en la resección con una colectomía subtotal que también trata el tumor.","fuente":"Hermes: Cirugía del cáncer de colon"}]},{"id":"colon-03","tema":"Cáncer de colon","anio":3,"titulo":"Cáncer de colon en un hombre de 38 años","vineta":"Varón de 38 años con un adenocarcinoma de colon derecho. Su padre tuvo cáncer de colon a los 45 años y una tía, cáncer de endometrio a los 50.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué síndrome sospechás?","opciones":["Síndrome de Lynch hereditario","Poliposis adenomatosa familiar","Síndrome de Peutz-Jeghers","Cáncer esporádico sin estudio"],"explicacion":"Cáncer colorrectal joven, colon derecho y familiares con cáncer de colon y endometrio sugieren síndrome de Lynch (deficiencia de reparación de errores de apareamiento).","fuente":"Hermes: Síndrome de Lynch"},{"tipo":"Estudios","pregunta":"¿Qué pedís sobre el tumor?","opciones":["Estudio de reparación de errores (IHQ o IMS)","Dosaje de CEA y CA 19-9 en la sangre","Mutación de APC en el tejido tumoral resecado","Mutación de BRCA1 y BRCA2 en el tumor"],"explicacion":"Se recomienda estudiar la reparación de errores de apareamiento en todo cáncer colorrectal; si está deficiente, se completa con estudio germinal y asesoramiento genético.","fuente":"Hermes: Síndrome de Lynch"},{"tipo":"Medidas generales","pregunta":"Se confirma Lynch. ¿Cómo vigilás a sus hermanos portadores?","opciones":["Colonoscopia cada 1 a 2 años desde los 20 a 25 años","Colonoscopia cada 10 años desde los 50 años","Sangre oculta en materia fecal anual","Colonoscopia cada 5 años desde los 40 años"],"explicacion":"Los portadores tienen cánceres de intervalo por la carcinogénesis acelerada; la colonoscopia se hace cada 1 a 2 años desde los 20 a 25 años, ajustada según el gen.","fuente":"Hermes: Síndrome de Lynch"}]},{"id":"colon-04","tema":"Cáncer de colon","anio":3,"titulo":"Cientos de pólipos en una joven","vineta":"Mujer de 22 años con rectorragia. Colonoscopia: más de 500 adenomas en todo el colon y el recto. Su madre murió de cáncer de colon a los 40.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Poliposis adenomatosa familiar clásica","Síndrome de Lynch con pólipos múltiples","Poliposis juvenil con hamartomas","Colitis ulcerosa con pseudopólipos"],"explicacion":"Cientos a miles de adenomas por mutación germinal de APC definen la poliposis adenomatosa familiar clásica; el riesgo de cáncer es casi del 100 % sin cirugía.","fuente":"Hermes: Poliposis adenomatosa familiar"},{"tipo":"Conducta quirúrgica","pregunta":"Con el recto tapizado de pólipos, ¿qué cirugía indicás?","opciones":["Proctocolectomía con reservorio ileal y anastomosis ileoanal","Colectomía total con ileorrecto anastomosis y control del recto","Hemicolectomía izquierda con colonoscopias anuales","Polipectomías endoscópicas cada 6 meses sin cirugía"],"explicacion":"Con compromiso rectal importante se reseca el recto con reservorio ileal; la ileorrecto anastomosis se reserva para recto con pocos pólipos.","fuente":"Hermes: Poliposis adenomatosa familiar"},{"tipo":"Medidas generales","pregunta":"¿Qué vigilancia extracolónica es prioritaria?","opciones":["Endoscopia alta con visión lateral (duodeno y papila)","Mamografía y ecografía mamaria anual desde los 20 años","Colangiorresonancia anual por riesgo biliar","TC de cerebro anual por meduloblastoma"],"explicacion":"Tras la colectomía, el cáncer duodenal o periampular y los desmoides son causas principales de muerte; se vigila el duodeno con endoscopio de visión lateral.","fuente":"Hermes: Poliposis adenomatosa familiar"}]},{"id":"recto-01","tema":"Cáncer de recto","anio":3,"titulo":"Tumor de recto medio localmente avanzado","vineta":"Varón de 60 años con rectorragia y cambio del ritmo evacuatorio. Adenocarcinoma a 7 cm del margen anal. Resonancia: T3c N1, fascia mesorrectal amenazada (1 mm). TC sin metástasis.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio define la estadificación local?","opciones":["Resonancia pélvica de alta resolución","TC de abdomen y pelvis con contraste","Ecografía abdominal con Doppler","Colonoscopia virtual por TC"],"explicacion":"La resonancia pélvica define T, N, la distancia a la fascia mesorrectal, la invasión venosa extramural y la relación con el esfínter, que deciden el tratamiento.","fuente":"ESMO 2017, cáncer de recto; Hermes: Cirugía del cáncer de recto"},{"tipo":"Conducta quirúrgica","pregunta":"Con la fascia mesorrectal amenazada, ¿qué indicás antes de la cirugía?","opciones":["Neoadyuvancia (quimiorradioterapia o neoadyuvancia total)","Cirugía inmediata con escisión total del mesorrecto","Quimioterapia paliativa sin intención curativa","Resección local transanal y radioterapia posterior sobre el lecho"],"explicacion":"El margen circunferencial amenazado es indicación de neoadyuvancia; la neoadyuvancia total (ensayos RAPIDO y PRODIGE 23) mejora la respuesta y reduce las metástasis.","fuente":"ESMO 2017; ensayos RAPIDO y PRODIGE 23"},{"tipo":"Técnica","pregunta":"¿Cuál es el principio técnico clave de la resección?","opciones":["Escisión total del mesorrecto en el plano areolar","Disección intramesorrectal para acortar el tiempo","Resección local transanal de espesor completo","Disección por detrás de la fascia presacra"],"explicacion":"La escisión total del mesorrecto en el plano \"sagrado\" reduce la recurrencia local; la calidad del mesorrecto se informa en la pieza. Disecar por detrás de la fascia presacra produce sangrado venoso grave.","fuente":"Hermes: Escisión total del mesorrecto"},{"tipo":"Conducta quirúrgica","pregunta":"Tras la neoadyuvancia hay respuesta clínica completa en endoscopia y resonancia. ¿Qué opción podés ofrecer?","opciones":["Vigilancia estrecha (watch and wait) en un programa","Alta sin seguimiento porque el tumor desapareció","Amputación abdominoperineal igual, a las 8 semanas","Un refuerzo de radioterapia de contacto de rutina"],"explicacion":"Con respuesta clínica completa puede ofrecerse vigilancia intensiva con endoscopia y resonancia; alrededor de un cuarto rebrota, casi siempre rescatable con cirugía.","fuente":"Hermes: Vigilancia y espera en cáncer de recto"}]},{"id":"recto-02","tema":"Cáncer de recto","anio":3,"titulo":"Tumor que invade el esfínter","vineta":"Mujer de 66 años con adenocarcinoma de recto a 2 cm del margen anal que, en la resonancia tras la neoadyuvancia, sigue invadiendo el esfínter externo.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Amputación abdominoperineal con colostomía definitiva","Resección anterior baja con anastomosis coloanal e ileostomía","Resección local transanal de espesor completo","Colostomía de descarga sin resección"],"explicacion":"La invasión del esfínter externo impide preservar el esfínter con márgenes oncológicos; la amputación abdominoperineal es la opción.","fuente":"Hermes: Amputación abdominoperineal; Preservación esfinteriana en cáncer de recto"},{"tipo":"Técnica","pregunta":"¿Qué evita la \"cintura\" de la pieza en el plano del elevador?","opciones":["Resección extraelevadora (cilíndrica)","Disección más cerca de la pared rectal","Disección interesfinteriana del canal","Cierre perineal sin drenaje"],"explicacion":"La disección que sigue el mesorrecto hasta el elevador deja una pieza con cintura y riesgo de margen positivo y perforación; la técnica extraelevadora incluye los elevadores.","fuente":"Hermes: Amputación abdominoperineal"},{"tipo":"Medidas generales","pregunta":"Antes de la cirugía, ¿qué hacés con la ostomía?","opciones":["Marcar el sitio sentada y parada, con estomaterapia","Elegir el sitio en el quirófano con la paciente acostada","Ubicarla en la cicatriz mediana para no abrir otra incisión","Esperar a ver la longitud del colon disponible en la cirugía"],"explicacion":"La marcación preoperatoria por estomaterapia reduce las complicaciones y mejora la calidad de vida.","fuente":"Hermes: Amputación abdominoperineal"}]},{"id":"gastrico-01","tema":"Cáncer gástrico","anio":3,"titulo":"Adenocarcinoma gástrico localmente avanzado","vineta":"Varón de 62 años con pérdida de peso y anemia. Endoscopia: tumor ulcerado de antro. Biopsia: adenocarcinoma. TC: engrosamiento parietal con ganglios perigástricos, sin metástasis visibles.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio agregás a la estadificación en un tumor avanzado (cT3 o mayor)?","opciones":["Laparoscopia con citología peritoneal","Colonoscopia para descartar tumor sincrónico","Centellograma óseo corporal total de rutina","Resonancia de cerebro con gadolinio de rutina"],"explicacion":"La laparoscopia detecta metástasis peritoneales que la TC no ve, evitando laparotomías innecesarias; la citología positiva equivale a enfermedad M1.","fuente":"Hermes: Cáncer gástrico"},{"tipo":"Fármaco","pregunta":"Sin carcinomatosis, ¿qué tratamiento sistémico perioperatorio indicás?","opciones":["Quimioterapia perioperatoria con FLOT","Cirugía sola, sin quimioterapia","Radioterapia preoperatoria sola","Inmunoterapia sola sin quimioterapia"],"explicacion":"En el ensayo FLOT4, la quimioterapia perioperatoria con 5-FU, leucovorina, oxaliplatino y docetaxel mejoró la supervivencia frente a ECF/ECX.","fuente":"Ensayo FLOT4"},{"tipo":"Dosis","pregunta":"¿Cuántos ciclos de FLOT se dan?","opciones":["4 ciclos antes y 4 después de la cirugía","1 ciclo antes y 6 después de la cirugía","12 ciclos después de la cirugía","8 ciclos antes de la cirugía"],"explicacion":"El esquema FLOT4 son 4 ciclos preoperatorios y 4 posoperatorios, cada 2 semanas.","fuente":"Ensayo FLOT4"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás para un cáncer de antro?","opciones":["Gastrectomía subtotal con linfadenectomía D2","Gastrectomía total con linfadenectomía D1","Resección en cuña con margen de 2 cm","Gastroyeyunostomía de derivación"],"explicacion":"El tumor distal con margen proximal adecuado se trata con gastrectomía subtotal y D2, con la misma supervivencia que la total y mejor calidad de vida.","fuente":"Hermes: Gastrectomía; Linfadenectomía D2 gástrica"},{"tipo":"Técnica","pregunta":"¿Cuántos ganglios como mínimo debe tener la pieza?","opciones":["16 o más","5 o más","2 o más","10 o más"],"explicacion":"Se requieren al menos 16 ganglios para una estadificación N adecuada; la D2 bien hecha suele obtener más.","fuente":"Hermes: Linfadenectomía D2 gástrica"}]},{"id":"esofago-01","tema":"Cáncer esofágico","anio":3,"titulo":"Disfagia progresiva en un hombre con Barrett","vineta":"Varón de 64 años con Barrett conocido sin control, disfagia progresiva a sólidos y pérdida de 8 kg. Endoscopia: tumor de esófago distal y unión gastroesofágica. Biopsia: adenocarcinoma. TC y PET: T3 N1, sin metástasis.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés con el estado nutricional antes del tratamiento?","opciones":["Evaluación y soporte nutricional, enteral si hace falta","Operar primero y nutrir después","Ayuno hasta la cirugía para no aspirar","Nutrición parenteral total de rutina por la disfagia"],"explicacion":"La desnutrición es frecuente por la disfagia y aumenta las complicaciones; se prioriza la vía enteral.","fuente":"Hermes: Cirugía del cáncer de esófago"},{"tipo":"Fármaco","pregunta":"Para un adenocarcinoma localmente avanzado, ¿qué tratamiento preoperatorio mostró mejor supervivencia en el ensayo ESOPEC?","opciones":["Quimioterapia perioperatoria FLOT","Quimiorradioterapia preoperatoria CROSS","Cirugía sola sin neoadyuvancia","Inmunoterapia con nivolumab sola"],"explicacion":"En ESOPEC, en adenocarcinoma esofágico resecable, FLOT perioperatorio logró mayor supervivencia que CROSS. CROSS sigue siendo estándar en el carcinoma escamoso.","fuente":"Ensayo ESOPEC; ensayo CROSS"},{"tipo":"Técnica","pregunta":"¿Qué abordaje se usa habitualmente para un tumor del esófago distal?","opciones":["Esofagectomía de Ivor Lewis (abdomen y tórax derecho)","Esofagectomía transhiatal sin toracotomía","Resección endoscópica submucosa","Gastrectomía total ampliada al esófago abdominal por vía transhiatal"],"explicacion":"Ivor Lewis permite linfadenectomía en dos campos y anastomosis intratorácica para tumores distales; el abordaje en tres campos (McKeown) se prefiere en tumores más altos.","fuente":"Hermes: Esofagectomía"},{"tipo":"Diagnóstico","pregunta":"En el día 6 posoperatorio aparece fiebre, taquicardia y derrame pleural derecho con líquido turbio. ¿Qué sospechás?","opciones":["Fuga de la anastomosis intratorácica","Neumonía aspirativa del lóbulo inferior","Quilotórax por lesión del conducto torácico","Atelectasia del lóbulo inferior con derrame reactivo"],"explicacion":"Fiebre, taquicardia y derrame turbio tras una anastomosis intratorácica son fuga hasta demostrar lo contrario; se confirma con endoscopia o TC con contraste oral.","fuente":"Hermes: Esofagectomía"}]},{"id":"lap-03","tema":"Cirugía laparoscópica de la vía biliar","anio":3,"titulo":"Cálculos en la colangiografía intraoperatoria","vineta":"Mujer de 45 años operada por cólicos biliares, con hepatograma levemente alterado y colédoco de 8 mm en la ecografía, sin cálculos visibles en la vía. La colangiografía intraoperatoria muestra dos cálculos de 5 mm en el colédoco distal; el cístico es de buen calibre.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué probabilidad de coledocolitiasis tenía antes de operar?","opciones":["Intermedia, por el hepatograma alterado y el colédoco dilatado","Alta, por la dilatación del colédoco en la ecografía","Baja, porque la ecografía no vio cálculos en la vía biliar","Muy alta, por tener litiasis vesicular sintomática"],"explicacion":"Para ASGE 2019, el hepatograma alterado, la edad mayor de 55 años o la dilatación aislada definen riesgo intermedio, que se estudia con colangiorresonancia, ecoendoscopia o imagen intraoperatoria. Alto riesgo es el cálculo visto, la colangitis o la bilirrubina mayor de 4 mg/dl con colédoco dilatado.","fuente":"ASGE 2019, coledocolitiasis; Hermes: Coledocolitiasis"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué conductas son válidas ahora?","opciones":["Exploración laparoscópica de la vía, o CPRE después","Dejar los cálculos porque van a migrar solos","Convertir y hacer coledocotomía abierta de rutina","Terminar y controlar con colangiorresonancia anual"],"explicacion":"La extracción antes, durante o después de la colecistectomía tiene resultados similares; se elige según los recursos y la experiencia. Dejar cálculos confirmados expone a colangitis o pancreatitis.","fuente":"WSES-SICG 2017 (publicada en 2019); Hermes: Coledocolitiasis"},{"tipo":"Técnica","pregunta":"Con cálculos pequeños y un cístico amplio, ¿por dónde explorás la vía?","opciones":["Por vía transcística","Por coledocotomía","Por vía transduodenal","Por hepaticotomía"],"explicacion":"La vía se elige por el número, el tamaño y la localización de los cálculos, el diámetro del colédoco y la experiencia: con cálculos pequeños y un cístico amplio, la transcística evita abrir el colédoco.","fuente":"Oddsdóttir y Hunter, Schwartz 2006, cap. 31; Hermes: Coledocolitiasis"},{"tipo":"Estudios","pregunta":"¿Cómo confirmás que la vía quedó limpia?","opciones":["Colangiografía o coledocoscopia de control","Ecografía abdominal al día siguiente","Hepatograma a las 6 horas","Palpación del colédoco"],"explicacion":"La limpieza se comprueba en el acto con colangiografía o coledocoscopia; la ecografía no ve bien el colédoco distal y el hepatograma tarda en normalizarse.","fuente":"Hermes: Coledocolitiasis y Coledocoscopia laparoscópica"}]},{"id":"recto-03","tema":"Cáncer de recto","anio":3,"titulo":"Fiebre después de una resección anterior baja","vineta":"Varón de 64 años en el sexto día de una resección anterior baja con anastomosis colorrectal a 5 cm del margen anal e ileostomía de protección. Fiebre, taquicardia, dolor pélvico y proteína C reactiva en aumento. Hemodinámicamente estable.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["TC con contraste rectal","Colonoscopia completa","Ecografía abdominal","Radiografía simple de abdomen"],"explicacion":"La TC con contraste rectal evalúa el defecto anastomótico y las colecciones a la vez; el enema hidrosoluble o la endoscopia cuidadosa pueden resolver dudas sobre isquemia o cavidad.","fuente":"Smallwood y Fleshman, 2017; Hermes: Fuga anastomótica colorrectal"},{"tipo":"Conducta quirúrgica","pregunta":"La TC muestra una colección pélvica contenida de 5 cm junto a la anastomosis. Sigue estable. ¿Qué indicás?","opciones":["Antibióticos y drenaje percutáneo o transanal","Relaparotomía y desmontaje de la anastomosis","Antibióticos solos, sin drenar","Cerrar la ileostomía para mejorar el tránsito"],"explicacion":"Una colección contenida en un paciente estable con derivación se trata con antibióticos y drenaje percutáneo o transanal (también hay opciones endoluminales por vacío). El desmontaje se reserva para necrosis, dehiscencia extensa o shock.","fuente":"Hermes: Fuga anastomótica colorrectal"},{"tipo":"Diagnóstico","pregunta":"¿Qué efecto tiene la ileostomía de protección sobre la fuga?","opciones":["Reduce sus consecuencias, no necesariamente su incidencia","Impide que la anastomosis se filtre en el posoperatorio","Obliga a desmontar la anastomosis si hay fuga","Hace innecesario estudiar la fuga con imágenes"],"explicacion":"La derivación reduce las consecuencias sépticas de una fuga, pero no la previene: la anastomosis puede filtrar igual y hay que diagnosticarla y tratarla.","fuente":"Hermes: Fuga anastomótica colorrectal"},{"tipo":"Medidas generales","pregunta":"¿Qué hay que confirmar antes de cerrar la ileostomía?","opciones":["La resolución clínica y anatómica de la fuga","Que pasaron 2 semanas desde la fuga","Que la proteína C reactiva se normalizó","Que el paciente tolere la dieta oral"],"explicacion":"Antes de cerrar la ostomía hay que demostrar que la fuga se resolvió en la clínica y en la imagen o la endoscopia; una cavidad crónica cerrada a ciegas puede reactivarse.","fuente":"Hermes: Fuga anastomótica colorrectal"}]},{"id":"lesbil-03","tema":"Lesiones quirúrgicas de la vía biliar","anio":3,"titulo":"El cístico era el colédoco","vineta":"En una colecistectomía laparoscópica difícil, el cirujano advierte que clipó y seccionó el colédoco por completo, creyendo que era el cístico, y que resecó un segmento. Es un hospital general sin cirujano hepatobiliar.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tipo de lesión es según Strasberg?","opciones":["E, pérdida de continuidad de la vía principal","A, fuga del cístico o de un conducto de Luschka","C, sección de un conducto aberrante","D, lesión lateral de la vía principal"],"explicacion":"La sección completa de la vía principal con pérdida de tejido es una lesión mayor tipo E, que requiere reconstrucción compleja.","fuente":"WSES 2020, lesión de la vía biliar (de'Angelis); Hermes: Lesión de la vía biliar principal en colecistectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué hacés en este hospital?","opciones":["Drenaje y derivación inmediata a un centro hepatobiliar","Anastomosis terminoterminal del colédoco sobre un tubo en T","Hepaticoyeyunostomía en el acto por el equipo actuante","Cierre del abdomen y control con hepatograma"],"explicacion":"Si no hay experiencia hepatobiliar, se drena y se deriva enseguida: la reparación inmediata por un equipo no experto tiene peores resultados y puede comprometer la reparación definitiva.","fuente":"WSES 2020, lesión de la vía biliar"},{"tipo":"Técnica","pregunta":"En el centro hepatobiliar, ¿cuál es la reparación recomendada?","opciones":["Hepaticoyeyunostomía en Y de Roux","Anastomosis terminoterminal sobre tubo en T","Coledocoduodenostomía","Prótesis plástica por CPRE"],"explicacion":"En la lesión tipo E con pérdida de tejido o sospecha de isquemia se recomienda hepaticoyeyunostomía en Y de Roux; la anastomosis terminoterminal tiene alta tasa de estenosis.","fuente":"WSES 2020, lesión de la vía biliar"},{"tipo":"Conducta quirúrgica","pregunta":"Si hubiera sido una lesión lateral pequeña, sin pérdida de tejido, ¿qué harías?","opciones":["Reparación directa, con o sin tubo en T, y drenaje","Hepaticoyeyunostomía en Y de Roux","Derivación a otro centro sin dejar drenaje","Ligadura del colédoco y drenaje"],"explicacion":"En las lesiones menores (Strasberg A a D) se considera segura la reparación directa, con o sin tubo en T, con drenaje del área.","fuente":"WSES 2020, lesión de la vía biliar"}]},{"id":"erge-03","tema":"Reflujo gastroesofágico y cirugía antirreflujo","anio":3,"titulo":"Disfagia después de un Nissen","vineta":"Mujer de 50 años operada hace 3 semanas de una fundoplicatura de Nissen laparoscópica por reflujo demostrado, con manometría preoperatoria normal. Tiene disfagia a sólidos, tolera líquidos y no perdió peso.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Cómo interpretás la disfagia?","opciones":["Disfagia temprana, en general transitoria","Acalasia que no se diagnosticó antes de operar","Hernia paraesofágica aguda por la válvula tensa","Cáncer de esófago no visto en la endoscopia"],"explicacion":"La disfagia temprana después de una fundoplicatura suele ser transitoria por el edema. La manometría normal previa descarta acalasia; la imposibilidad de tragar líquidos o el dolor intenso obligarían a estudiarla.","fuente":"Hermes: Fundoplicatura laparoscópica"},{"tipo":"Medidas generales","pregunta":"¿Qué indicás?","opciones":["Dieta blanda progresiva y control clínico","Reoperación para aflojar la válvula","Dilatación forzada con balón de 30 mm","Ayuno y nutrición parenteral"],"explicacion":"Con tolerancia a líquidos se maneja con dieta blanda progresiva y control. Una dilatación forzada como la de la acalasia puede romper la válvula o el esófago.","fuente":"Hermes: Fundoplicatura laparoscópica"},{"tipo":"Estudios","pregunta":"A los 4 meses la disfagia persiste y ya le cuesta tragar líquidos. ¿Qué hacés antes de decidir?","opciones":["Endoscopia, estudio contrastado y manometría","Reoperación sin más estudios","Prueba con inhibidor de bomba por 3 meses","Dilatación endoscópica a ciegas"],"explicacion":"Antes de una revisión se reconstruyen la anatomía y la función con endoscopia, estudio contrastado y manometría (y pH-impedancia según el síntoma), porque la reoperación tiene más morbilidad y menos durabilidad.","fuente":"Hermes: Fundoplicatura laparoscópica"},{"tipo":"Técnica","pregunta":"¿Qué defecto técnico predispone a la disfagia persistente?","opciones":["Válvula larga, tensa o torcida","Cerrar los pilares diafragmáticos","Preservar ambos nervios vagos en la disección","Usar el fundus gástrico para la válvula"],"explicacion":"Una válvula tensa, larga, torcida o confeccionada con cuerpo gástrico en vez de fundus, o un cierre crural excesivo, predisponen al fracaso funcional. Cerrar los pilares, usar el fundus y preservar los vagos son pasos correctos.","fuente":"Hermes: Fundoplicatura laparoscópica"}]},{"id":"ulcera-03","tema":"Úlcera gastroduodenal","anio":3,"titulo":"Vómitos de lo que comió el día anterior","vineta":"Varón de 58 años con úlcera duodenal conocida que consume AINE. Hace 2 semanas vomita alimentos ingeridos el día anterior, con saciedad precoz y pérdida de peso. Se oye bazuqueo.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué alteración del medio interno esperás?","opciones":["Alcalosis metabólica hipoclorémica e hipopotasémica","Acidosis metabólica con anión gap aumentado","Hiperpotasemia con acidosis metabólica","Hipernatremia aislada"],"explicacion":"Los vómitos de contenido gástrico pierden ácido clorhídrico y potasio: dan alcalosis metabólica hipoclorémica e hipopotasémica, típica de la obstrucción de salida gástrica.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Medidas generales","pregunta":"¿Cuál es el manejo inicial?","opciones":["Sonda nasogástrica, fisiológica con potasio e IBP IV","Dieta líquida y metoclopramida oral antes de cada comida","Cirugía de urgencia en las próximas horas","Bicarbonato de sodio IV para corregir el pH"],"explicacion":"Se descomprime el estómago, se corrige la volemia y la hipocloremia con solución fisiológica y potasio, y se suprime el ácido. El bicarbonato empeora la alcalosis.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Estudios","pregunta":"¿Qué estudio es indispensable?","opciones":["Endoscopia con biopsias para excluir cáncer","Seriada gastroduodenal como único estudio","Ecografía abdominal","Gastrina sérica"],"explicacion":"La obstrucción exige diferenciar edema de estenosis fibrótica y excluir una neoplasia con endoscopia y biopsia.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Conducta quirúrgica","pregunta":"Es una estenosis péptica benigna. ¿Qué tratamiento indicás primero?","opciones":["IBP, erradicar H. pylori, suspender AINE y dilatar","Gastrectomía subtotal de entrada con Billroth II","Vagotomía troncular y antrectomía programadas","Gastrostomía de alimentación y observación"],"explicacion":"La estenosis se trata con supresión ácida, erradicación de H. pylori, suspensión de AINE y dilatación endoscópica; la piloroplastia o la derivación quedan para el fracaso persistente.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal"},{"tipo":"Conducta quirúrgica","pregunta":"Si fracasan las dilataciones repetidas, ¿qué cirugía indicás?","opciones":["Piloroplastia o gastroenteroanastomosis","Gastrectomía total con reconstrucción en Y de Roux","Fundoplicatura con vagotomía troncular","Duodenopancreatectomía cefálica"],"explicacion":"En la obstrucción fija se hace piloroplastia o gastroenteroanastomosis según la anatomía; la resección mayor no está indicada en una estenosis benigna.","fuente":"Hermes: Complicaciones de la úlcera gastroduodenal y Gastroenteroanastomosis"}]},{"id":"biliar-ca-03","tema":"Cáncer de la vía biliar","anio":4,"titulo":"Pólipo vesicular en una ecografía por dispepsia","vineta":"Mujer de 54 años con una ecografía pedida por dispepsia: pólipo vesicular sésil de 8 mm, sin cálculos. No tuvo cólicos biliares ni tiene colangitis esclerosante.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Tiene factores de riesgo de malignidad del pólipo?","opciones":["Sí: edad mayor de 50 años y pólipo sésil","No, porque mide menos de 10 mm de diámetro","Sí, por el sexo femenino y la dispepsia","No, porque no tiene cálculos asociados"],"explicacion":"La guía europea considera factores de riesgo la edad mayor de 50 años, la colangitis esclerosante primaria, la etnia india y el pólipo sésil (incluido el engrosamiento focal de la pared mayor de 4 mm).","fuente":"ESGAR, EAES, EFISDS y ESGE 2017, pólipos vesiculares (Eur Radiol 27:3856); Hermes: Prevención del cáncer de vesícula"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué indicás?","opciones":["Colecistectomía, si está en condiciones y la acepta","Ecografía a los 6 meses, al año y luego anual","Alta sin seguimiento","Colecistectomía con resección del lecho hepático"],"explicacion":"Con factores de riesgo y un pólipo de 6 a 9 mm se recomienda colecistectomía si la paciente puede operarse y la acepta; el seguimiento ecográfico es para quien no tiene factores de riesgo. No hay indicación de resección hepática sin sospecha de cáncer.","fuente":"ESGAR, EAES, EFISDS y ESGE 2017"},{"tipo":"Estudios","pregunta":"Si fuera un pólipo de 4 mm en una persona sin factores de riesgo, ¿qué seguimiento indicarías?","opciones":["Ecografía al año, a los 3 y a los 5 años","Colecistectomía laparoscópica programada","Ecografía cada 3 meses durante 5 años","Alta sin controles ecográficos"],"explicacion":"Sin factores de riesgo y con un pólipo de 5 mm o menos, la guía sugiere ecografía al año, a los 3 y a los 5 años.","fuente":"ESGAR, EAES, EFISDS y ESGE 2017"},{"tipo":"Conducta quirúrgica","pregunta":"En el seguimiento de un pólipo, ¿qué cambio indica operar?","opciones":["Que crezca 2 mm o más, o llegue a 10 mm","Que crezca 1 mm en un control","Que se vea móvil con el decúbito","Que aparezca artefacto en cola de cometa"],"explicacion":"El crecimiento de 2 mm o más (1 mm puede ser diferencia técnica) o llegar a 10 mm indican colecistectomía. La movilidad y la cola de cometa orientan a barro o colesterolosis, no a neoplasia.","fuente":"ESGAR, EAES, EFISDS y ESGE 2017"}]},{"id":"cyc-09","tema":"Glándulas salivales","anio":4,"titulo":"Nódulo parotídeo con debilidad facial","vineta":"Varón de 68 años con un nódulo parotídeo derecho de 3 cm que creció en 3 meses, doloroso, con debilidad para cerrar el ojo y para levantar la comisura del mismo lado.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Tumor maligno de parótida","Adenoma pleomorfo de crecimiento rápido","Parálisis de Bell coincidente","Parotiditis bacteriana aguda"],"explicacion":"Una parálisis facial con un tumor parotídeo es una señal de alarma oncológica hasta demostrar lo contrario; el dolor y el crecimiento rápido refuerzan la sospecha.","fuente":"Petelle y col., EMC 2004; Hermes: Parotidectomía"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís antes de operar?","opciones":["RM y punción con aguja fina o biopsia con aguja gruesa","Biopsia incisional abierta de la glándula bajo anestesia","Sialografía con contraste y cultivo de saliva","Gammagrafía de glándulas salivales con tecnecio"],"explicacion":"La ecografía y la punción o la biopsia con aguja gruesa orientan la histología, y la RM define el lóbulo profundo, la extensión perineural y el espacio parafaríngeo. La biopsia abierta arriesga siembra y lesión del nervio.","fuente":"Hermes: Parotidectomía"},{"tipo":"Técnica","pregunta":"En la cirugía, el tumor infiltra la rama cervicofacial del nervio. ¿Qué hacés?","opciones":["Reseco la rama invadida y la reconstruyo con injerto","Despego el tumor del nervio para conservarlo","Abandono la resección y solo tomo biopsia","Secciono el tronco del facial completo de rutina"],"explicacion":"Un tumor maligno adherido no se despega del nervio solo para conservar movimiento: se prioriza la resección oncológica y se planifica la reconstrucción nerviosa inmediata cuando es posible.","fuente":"Hermes: Parotidectomía"},{"tipo":"Medidas generales","pregunta":"Después de la cirugía no cierra el ojo derecho. ¿Qué indicás?","opciones":["Proteger la córnea con lubricación y oclusión","Esperar sin medidas hasta que vuelva la función","Corticoides en dosis altas por 3 meses","Masajes faciales desde el primer día"],"explicacion":"Con debilidad del cierre palpebral hay que proteger la córnea para evitar la queratitis por exposición, mientras se espera o se completa la rehabilitación facial.","fuente":"Hermes: Parotidectomía"}]},{"id":"esofago-02","tema":"Cáncer esofágico","anio":3,"titulo":"Nódulo en un Barrett largo","vineta":"Varón de 60 años con reflujo de 20 años y un esófago de Barrett largo que nunca se vigiló. La endoscopia muestra un nódulo de 1 cm dentro del segmento de Barrett; la biopsia informa displasia de alto grado.","pasos":[{"tipo":"Medidas generales","pregunta":"¿Qué hacés con el informe de displasia antes de decidir?","opciones":["Lo hago revisar por un patólogo experto","Lo acepto y programo una esofagectomía","Repito la biopsia dentro de 3 años","Duplico el inhibidor de bomba y doy el alta"],"explicacion":"Toda displasia en el Barrett se confirma con un patólogo experto, porque la inflamación y la variabilidad entre observadores cambian la conducta.","fuente":"Rajaram y col., Sabiston 2022, cap. 42; Hermes: Esófago de Barrett"},{"tipo":"Estudios","pregunta":"¿Cómo estadificás el nódulo?","opciones":["Resección endoscópica de la lesión visible","Ablación por radiofrecuencia del nódulo","Biopsias más profundas con pinza","PET-TC de cuerpo entero"],"explicacion":"Una lesión nodular o elevada se reseca por vía endoscópica para conocer la profundidad, la diferenciación y la invasión linfovascular; no se hace ablación a ciegas, porque destruye el tejido que hay que estadificar.","fuente":"Rajaram y col., Sabiston 2022, cap. 42; Hermes: Esófago de Barrett y Cirugía del cáncer de esófago"},{"tipo":"Conducta quirúrgica","pregunta":"La pieza muestra adenocarcinoma intramucoso (T1a) bien diferenciado, sin invasión linfovascular y con márgenes libres. ¿Qué sigue?","opciones":["Ablación del Barrett residual y vigilancia endoscópica","Esofagectomía de Ivor Lewis con linfadenectomía en dos campos","Quimiorradioterapia según CROSS y luego cirugía de rescate","Fundoplicatura laparoscópica como tratamiento oncológico"],"explicacion":"La displasia de alto grado y el T1a seleccionado se tratan con resección endoscópica de toda lesión visible y erradicación del Barrett residual en un centro experto, con vigilancia posterior.","fuente":"Rajaram y col., Sabiston 2022, cap. 42; Hermes: Cirugía del cáncer de esófago"},{"tipo":"Conducta quirúrgica","pregunta":"Si hubiera invadido la submucosa profunda con invasión linfovascular, ¿qué cambiaría?","opciones":["Se plantea esofagectomía por el riesgo ganglionar","Seguiría igual, con ablación del resto","Se repetiría la resección endoscópica","Se haría fundoplicatura y vigilancia anual"],"explicacion":"La invasión submucosa, la mala diferenciación o la invasión linfovascular aumentan el riesgo de metástasis ganglionares y desplazan la decisión hacia la esofagectomía.","fuente":"Rajaram y col., Sabiston 2022, cap. 42; Hermes: Cirugía del cáncer de esófago"},{"tipo":"Medidas generales","pregunta":"Tiene además una hernia hiatal. ¿Qué logra una fundoplicatura respecto del Barrett?","opciones":["Controla el reflujo, pero la vigilancia sigue","Elimina el Barrett y permite suspender la vigilancia","Reemplaza a la ablación del epitelio residual","Está contraindicada si hay Barrett"],"explicacion":"La cirugía antirreflujo controla la exposición y los síntomas, pero no erradica la metaplasia ni tiene efecto oncológico demostrado: la vigilancia endoscópica continúa.","fuente":"Yates y Oelschlager, Sabiston 2022, cap. 43; Hermes: Esófago de Barrett"}]},{"id":"esofago-03","tema":"Cáncer esofágico","anio":3,"titulo":"Disfagia por un carcinoma escamoso","vineta":"Varón de 66 años, fumador y bebedor, con disfagia a sólidos y pérdida de 6 kg. Carcinoma escamoso del esófago medio, cT3 N1 M0, en un paciente operable.","pasos":[{"tipo":"Fármaco","pregunta":"¿Qué tratamiento preoperatorio indicás?","opciones":["Quimiorradioterapia según CROSS","Quimioterapia perioperatoria FLOT","Cirugía sin tratamiento previo","Inmunoterapia sola"],"explicacion":"CROSS mejoró la supervivencia con quimiorradioterapia preoperatoria e incluyó carcinomas escamosos, en los que tuvo especial beneficio. FLOT superó a CROSS en ESOPEC, pero ese ensayo incluyó solo adenocarcinomas.","fuente":"CROSS (van Hagen, NEJM 2012;366:2074) y ESOPEC (2024); Hermes: Cirugía del cáncer de esófago"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["Carboplatino AUC 2 y paclitaxel 50 mg/m² semanales por 5 semanas, con 41,4 Gy","Carboplatino AUC 6 y paclitaxel 175 mg/m² cada 3 semanas, con 60 Gy","Cisplatino 100 mg/m² los días 1, 22 y 43, sin radioterapia","5-fluorouracilo en infusión continua por 6 meses, con 20 Gy"],"explicacion":"CROSS administró carboplatino (AUC 2 mg/ml/min) y paclitaxel 50 mg/m² una vez por semana durante 5 semanas, con radioterapia concurrente de 41,4 Gy en 23 fracciones, y luego cirugía.","fuente":"CROSS (van Hagen, NEJM 2012;366:2074)"},{"tipo":"Técnica","pregunta":"En la reconstrucción con tubo gástrico, ¿de qué arteria depende el conducto?","opciones":["Gastroepiploica derecha","Gástrica izquierda","Gastroepiploica izquierda","Gástricas cortas"],"explicacion":"El tubo gástrico se basa en la arcada gastroepiploica derecha, que hay que preservar en la gastrolisis; la gástrica izquierda se liga con la linfadenectomía.","fuente":"Sauvanet, EMC 2000; Hermes: Reconstrucción esofágica"},{"tipo":"Diagnóstico","pregunta":"Se hizo una esofagectomía en tres campos con anastomosis cervical. Al despertar tiene disfonía. ¿Qué sospechás?","opciones":["Lesión del nervio laríngeo recurrente","Fuga de la anastomosis cervical","Estenosis temprana de la anastomosis","Lesión del conducto torácico"],"explicacion":"La anastomosis cervical facilita manejar una fuga pero aumenta la lesión del recurrente y la estenosis. La disfonía inmediata orienta al recurrente; la fuga y la estenosis aparecen después.","fuente":"Sauvanet, EMC 2003; Hermes: Cirugía del cáncer de esófago"},{"tipo":"Conducta quirúrgica","pregunta":"Al día 6 sale saliva por la herida cervical; está estable y sin signos de mediastinitis. ¿Qué hacés?","opciones":["Abrir la herida cervical y drenarla","Reoperar por toracotomía derecha","Desmontar el tubo gástrico","Indicar dieta oral y observar"],"explicacion":"La fuga de una anastomosis cervical suele manejarse abriendo y drenando la herida del cuello, con nutrición enteral; es una de las ventajas de ese sitio frente a la intratorácica.","fuente":"Sauvanet, EMC 2000; Hermes: Cirugía del cáncer de esófago"}]},{"id":"gastrico-02","tema":"Cáncer gástrico","anio":3,"titulo":"Cáncer gástrico temprano en una endoscopia de control","vineta":"Mujer de 62 años. Endoscopia de control: lesión elevada de 1,5 cm en el antro, sin úlcera. Biopsia: adenocarcinoma diferenciado. La ecoendoscopia lo muestra limitado a la mucosa (cT1a) y la TC no muestra adenopatías.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué tratamiento indicás?","opciones":["Resección endoscópica (mucosectomía o disección submucosa)","Gastrectomía subtotal laparoscópica con linfadenectomía D2","Gastrectomía total con linfadenectomía D1 y Y de Roux","Quimioterapia perioperatoria FLOT y luego gastrectomía"],"explicacion":"Un adenocarcinoma diferenciado, sin úlcera, cT1a y de hasta 2 cm es indicación absoluta de resección endoscópica (mucosectomía o disección submucosa), porque su riesgo de metástasis ganglionar es menor del 1 %.","fuente":"Guías japonesas de cáncer gástrico 2021 (JGCA, Gastric Cancer 2023;26:1); Hermes: Cáncer gástrico"},{"tipo":"Técnica","pregunta":"¿Qué tiene que lograr la resección para considerarse curativa?","opciones":["En bloque, con márgenes lateral y profundo negativos","Fragmentada, con tal de extraer toda la lesión","Con margen lateral libre aunque el profundo esté tomado","Con biopsias negativas del lecho en lugar de margen"],"explicacion":"La curabilidad endoscópica A exige resección en bloque, margen horizontal y vertical negativos, pT1a y sin invasión linfovascular. Una resección fragmentada no permite evaluar los márgenes.","fuente":"Guías japonesas de cáncer gástrico 2021 (JGCA)"},{"tipo":"Estudios","pregunta":"La pieza cumple todo (curabilidad endoscópica A). ¿Qué seguimiento indicás?","opciones":["Endoscopia una vez por año","TC de abdomen cada 3 meses","Gastrectomía complementaria","Alta sin controles"],"explicacion":"Después de una resección con curabilidad A se recomienda endoscopia anual, sobre todo por el riesgo de lesiones metacrónicas.","fuente":"Guías japonesas de cáncer gástrico 2021 (JGCA)"},{"tipo":"Conducta quirúrgica","pregunta":"Si la pieza hubiera mostrado invasión submucosa profunda con invasión linfovascular, ¿qué indicarías?","opciones":["Gastrectomía con linfadenectomía","Repetir la disección submucosa","Coagular el lecho con argón","Endoscopia anual"],"explicacion":"Esa resección no es curativa (curabilidad C-2) y el estándar es la gastrectomía con linfadenectomía, por el riesgo de metástasis ganglionares residuales.","fuente":"Guías japonesas de cáncer gástrico 2021 (JGCA)"}]},{"id":"gastrico-03","tema":"Cáncer gástrico","anio":3,"titulo":"Gastrectomía total y taquicardia al quinto día","vineta":"Varón de 58 años con adenocarcinoma del cuerpo gástrico alto que completó la quimioterapia perioperatoria preoperatoria. Con una gastrectomía subtotal no se lograría un margen proximal adecuado.","pasos":[{"tipo":"Conducta quirúrgica","pregunta":"¿Qué operación indicás?","opciones":["Gastrectomía total con D2 y reconstrucción en Y de Roux","Gastrectomía subtotal igual, con margen proximal corto","Gastrectomía total con esplenopancreatectomía de rutina","Gastrectomía total con D1 y reconstrucción Billroth II"],"explicacion":"Si la subtotal no logra un R0, se hace gastrectomía total con linfadenectomía D2 y esofagoyeyunostomía en Y de Roux. La D2 actual preserva el bazo y el páncreas salvo invasión directa.","fuente":"Dumont y col., 2018; Hermes: Cáncer gástrico, Gastrectomía y Linfadenectomía D2 gástrica"},{"tipo":"Diagnóstico","pregunta":"Al quinto día tiene taquicardia de 120 y fiebre, con el abdomen blando. ¿Qué sospechás?","opciones":["Fuga de la esofagoyeyunostomía","Ansiedad por el dolor posoperatorio","Infección urinaria por la sonda","Fibrilación auricular aislada sin otra causa"],"explicacion":"Después de una gastrectomía, la taquicardia posoperatoria se trata como una posible fuga anastomótica hasta demostrar lo contrario, aunque el abdomen parezca benigno.","fuente":"Hermes: Gastrectomía"},{"tipo":"Estudios","pregunta":"¿Qué estudio pedís?","opciones":["TC con contraste oral e intravenoso","Hemocultivos, y esperar el resultado","Ecocardiograma transtorácico","Radiografía de tórax"],"explicacion":"La sospecha de fuga se estudia con imagen dirigida (TC con contraste oral e intravenoso) o endoscopia, para drenar o tratar la fuga a tiempo.","fuente":"Hermes: Gastrectomía"},{"tipo":"Medidas generales","pregunta":"Para el seguimiento a largo plazo, ¿qué suplementación necesita?","opciones":["Vitamina B12 parenteral, más hierro y calcio","Vitamina K intramuscular una vez por semana","Ácido fólico oral, sin otros suplementos","Enzimas pancreáticas con cada comida, sin vitaminas"],"explicacion":"Sin estómago falta el factor intrínseco y se absorben mal el hierro y el calcio: se controlan y reponen B12, hierro, calcio y vitamina D de por vida.","fuente":"Hermes: Gastrectomía y Cáncer gástrico"}]},{"id":"mama-04","tema":"Patología mamaria y cáncer de mama","anio":3,"titulo":"Cáncer HER2 positivo con enfermedad residual","vineta":"Mujer de 46 años con carcinoma ductal invasor de 3 cm en la mama izquierda, HER2 positivo y receptores hormonales negativos, con un ganglio axilar comprometido confirmado por punción. Va a recibir quimioterapia neoadyuvante con taxano y trastuzumab.","pasos":[{"tipo":"Técnica","pregunta":"Antes de empezar la neoadyuvancia, ¿qué hacés con el ganglio positivo?","opciones":["Lo marco con un clip para ubicarlo después","Lo extirpo antes de empezar la quimioterapia","No lo marco: después se hace vaciamiento","Lo irradio antes de la cirugía"],"explicacion":"Si habrá tratamiento neoadyuvante, se marcan la lesión y el ganglio positivo para poder localizarlos y resecarlos después aunque respondan.","fuente":"Klimberg y Hunt, Sabiston 2022, cap. 35; Hermes: Cáncer de mama y Cirugía axilar en cáncer de mama"},{"tipo":"Diagnóstico","pregunta":"En la cirugía queda tumor invasor residual en la mama. ¿Qué implica?","opciones":["Mayor riesgo de recaída que con respuesta completa","Que la cirugía fue incompleta","Que el tumor en realidad no era HER2 positivo","Indicación de mastectomía contralateral"],"explicacion":"La enfermedad residual invasora después de quimioterapia y terapia anti-HER2 tiene peor pronóstico que la respuesta patológica completa, y por eso cambia la adyuvancia.","fuente":"KATHERINE (von Minckwitz, NEJM 2019;380:617)"},{"tipo":"Fármaco","pregunta":"¿Qué tratamiento adyuvante indicás?","opciones":["Trastuzumab emtansina (T-DM1)","Trastuzumab solo por 14 ciclos","Tamoxifeno durante 5 años","Capecitabina oral por 6 meses"],"explicacion":"En KATHERINE, T-DM1 adyuvante en enfermedad residual invasora redujo a la mitad el riesgo de recaída invasora o muerte frente a trastuzumab (88,3 % frente a 77 % libres de enfermedad a 3 años). El tamoxifeno no sirve con receptores negativos.","fuente":"KATHERINE (von Minckwitz, NEJM 2019;380:617)"},{"tipo":"Dosis","pregunta":"¿Con qué esquema?","opciones":["3,6 mg/kg IV cada 3 semanas, 14 ciclos","3,6 mg/kg IV una vez por semana, 4 ciclos","6 mg/kg IV cada 3 semanas, 14 ciclos","36 mg/kg IV en una dosis única"],"explicacion":"KATHERINE usó T-DM1 3,6 mg/kg IV cada 3 semanas durante 14 ciclos. 6 mg/kg cada 3 semanas es la dosis de mantenimiento de trastuzumab, el brazo control.","fuente":"KATHERINE (von Minckwitz, NEJM 2019;380:617)"}]},{"id":"mama-05","tema":"Patología mamaria y cáncer de mama","anio":3,"titulo":"Mama roja y con piel de naranja","vineta":"Mujer de 52 años que no amamanta. En 3 semanas aparecieron eritema, edema y piel de naranja en más de un tercio de la mama derecha, que aumentó de tamaño, y una adenopatía axilar. Afebril.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás?","opciones":["Carcinoma inflamatorio de mama","Mastitis infecciosa no puerperal","Absceso subareolar crónico","Celulitis de la pared torácica"],"explicacion":"El eritema y el edema de rápida evolución en más de un tercio de la mama, con piel de naranja y adenopatía, en una mujer que no amamanta y sin fiebre, son un carcinoma inflamatorio hasta demostrar lo contrario.","fuente":"Klimberg y Hunt, Sabiston 2022, cap. 35; Hermes: Cáncer de mama"},{"tipo":"Estudios","pregunta":"¿Cómo confirmás el diagnóstico?","opciones":["Biopsia con aguja gruesa, con receptores y HER2","Mamografía y control en 6 meses","Punción con aguja fina para citología","Biopsia escisional de toda la zona eritematosa"],"explicacion":"La biopsia con aguja gruesa es el método preferido: confirma la invasión y da receptores y HER2, que definen el tratamiento sistémico inicial.","fuente":"Klimberg y Hunt, Sabiston 2022, cap. 35; Hermes: Evaluación de la patología mamaria"},{"tipo":"Estudios","pregunta":"¿Pedís estudios de extensión antes de tratar?","opciones":["Sí, porque es un cáncer localmente avanzado","No, se piden recién después de operar","Solo si aparece dolor óseo","Solo un dosaje de CA 15-3"],"explicacion":"Las imágenes sistémicas se reservan para síntomas o para un estadio que las justifique; el carcinoma inflamatorio es localmente avanzado y se estadifica antes de empezar.","fuente":"Hermes: Cáncer de mama"},{"tipo":"Conducta quirúrgica","pregunta":"¿Cuál es la secuencia de tratamiento?","opciones":["Tratamiento sistémico primario y luego control locorregional","Mastectomía de urgencia como primer paso, y después quimioterapia","Cirugía conservadora seguida de radioterapia de la mama","Antibióticos por 2 semanas y reevaluación en un mes"],"explicacion":"El carcinoma inflamatorio requiere tratamiento sistémico inicial y después control locorregional combinado con cirugía y radioterapia.","fuente":"Klimberg y Hunt, Sabiston 2022, cap. 35; Hermes: Cáncer de mama"}]},{"id":"uro-03","tema":"Histerectomías","anio":3,"titulo":"Vejiga abierta durante una histerectomía","vineta":"Mujer de 48 años con dos cesáreas previas, en una histerectomía abdominal por miomas. Al disecar el espacio vesicouterino se abre la cúpula vesical: lesión de 2 cm, lejos del trígono y de los meatos ureterales.","pasos":[{"tipo":"Estudios","pregunta":"¿Cómo confirmás la extensión de la lesión en el quirófano?","opciones":["Instilo solución teñida por la sonda e inspecciono","TC con contraste en el posoperatorio inmediato","Ecografía intraoperatoria de la vejiga llena","Mido la creatinina del líquido peritoneal aspirado"],"explicacion":"La vejiga se evalúa en la operación con inspección directa (alcanza en la cúpula), instilación de solución teñida por la sonda o cistografía retrógrada, el patrón de referencia.","fuente":"WSES 2023, lesión urinaria iatrogénica; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Técnica","pregunta":"¿Cómo la reparás?","opciones":["Sutura en dos planos con material reabsorbible","Sutura en un plano con material no reabsorbible","Sonda vesical sola, sin suturar","Cistectomía parcial con reimplante ureteral"],"explicacion":"La lesión vesical intraperitoneal se sutura en dos planos con material reabsorbible (recomendación 1B); el éxito de la vesicorrafia supera el 98 %. El material no reabsorbible favorece cálculos.","fuente":"WSES 2023; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Medidas generales","pregunta":"¿Cuánto tiempo dejás la sonda vesical?","opciones":["Al menos 7 días, y se retira con cistografía normal","24 horas, como en una histerectomía sin lesión","3 días, y se retira sin estudio de control previo","30 días, con recambio de la sonda cada semana"],"explicacion":"Después de reparar una lesión intraperitoneal se deja la sonda al menos 7 días y se retira tras una cistografía retrógrada sin fuga.","fuente":"WSES 2023; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Fármaco","pregunta":"¿Indicás un antibiótico por la lesión vesical?","opciones":["No, si se reconoció y reparó en la operación","Sí, ciprofloxacina mientras tenga la sonda","Sí, ceftriaxona durante 7 días","Sí, nitrofurantoína profiláctica por un mes"],"explicacion":"Una lesión urinaria reconocida en la operación no requiere tratamiento antimicrobiano específico, porque la orina suele ser estéril; los antibióticos se reservan para infección o sepsis.","fuente":"WSES 2023; Hermes: Lesión iatrogénica de la vía urinaria"}]},{"id":"uro-04","tema":"Histerectomías","anio":3,"titulo":"Fiebre y drenaje abundante después de una histerectomía","vineta":"Mujer de 52 años en el cuarto día de una histerectomía laparoscópica difícil por endometriosis. Fiebre de 38 °C, íleo y dolor lumbar izquierdo. El drenaje pélvico subió a 600 ml/día de líquido claro.","pasos":[{"tipo":"Estudios","pregunta":"¿Qué medís primero en el líquido del drenaje?","opciones":["Creatinina, comparada con la sérica","Amilasa, comparada con la sérica","Triglicéridos del líquido","Bilirrubina, comparada con la sérica"],"explicacion":"Una creatinina del drenaje claramente mayor que la sérica sugiere fuga urinaria; si es similar, la hace improbable. Es útil sobre todo cuando no hay uro-TC disponible.","fuente":"WSES 2023, lesión urinaria iatrogénica; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Estudios","pregunta":"La creatinina del drenaje es muy superior a la sérica. ¿Qué estudio confirma la lesión?","opciones":["Uro-TC con fase excretora","Ecografía renal y vesical","Radiografía simple de abdomen","Centellograma renal"],"explicacion":"La uro-TC con fases nefrográfica y excretora es el patrón de referencia posoperatorio; la ecografía muestra hidronefrosis o urinoma con menor exactitud.","fuente":"WSES 2023; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Conducta quirúrgica","pregunta":"La uro-TC muestra una sección parcial del uréter distal izquierdo con extravasación. ¿Qué indicás primero?","opciones":["Stent ureteral retrógrado, o nefrostomía con stent anterógrado","Ureteroneocistostomía abierta en las próximas horas, sin intentar stent","Observar con el drenaje hasta que la fístula cierre sola","Nefrectomía izquierda por la pérdida de la vía"],"explicacion":"En la sección parcial se intentan primero las técnicas endoscópicas o radiológicas (stent retrógrado o nefrostomía con stent anterógrado), con seguimiento estricto por el riesgo de estenosis. La reimplantación es para la sección completa del tercio inferior.","fuente":"WSES 2023; Hermes: Lesión iatrogénica de la vía urinaria"},{"tipo":"Medidas generales","pregunta":"Tenía sepsis y ya se drenó la vía urinaria. ¿Cuánto dura el antibiótico?","opciones":["3 a 5 días, con reevaluación temprana","14 días por vía oral","21 días por la presencia del stent","Mientras tenga el stent colocado"],"explicacion":"Con un control adecuado del foco se usan cursos cortos de 3 a 5 días con reevaluación temprana, también en el paciente crítico.","fuente":"WSES 2023; Hermes: Lesión iatrogénica de la vía urinaria"}]},{"id":"uro-05","tema":"Nefrectomías","anio":3,"titulo":"Nefrectomía radical derecha","vineta":"Varón de 63 años con un tumor renal derecho de 8 cm, central, sin trombo venoso; la suprarrenal es normal en la TC y el riñón izquierdo está sano. No es candidato a cirugía parcial.","pasos":[{"tipo":"Técnica","pregunta":"¿Qué estructura tenés que movilizar (maniobra de Kocher) para exponer el pedículo renal derecho?","opciones":["El duodeno descendente","La cola del páncreas","El bazo y su ligamento esplenorrenal","El ángulo esplénico del colon"],"explicacion":"Del lado derecho, el duodeno y la vena cava cubren el pedículo; se movilizan el colon derecho y el duodeno. La cola del páncreas, el bazo y el ángulo esplénico son relaciones del riñón izquierdo.","fuente":"Kim y Belldegrun, Schwartz 2006, cap. 39; Hermes: Anatomía urológica para el cirujano general y Nefrectomía"},{"tipo":"Técnica","pregunta":"¿Dónde desemboca la vena gonadal derecha?","opciones":["En la vena cava inferior","En la vena renal derecha, cerca del hilio","En la vena ilíaca común derecha","En la vena renal izquierda"],"explicacion":"La gonadal derecha desemboca directamente en la cava; la izquierda (como la suprarrenal izquierda) drena en la vena renal izquierda, que por eso es más larga.","fuente":"Kim y Belldegrun, Schwartz 2006, cap. 39; Hermes: Anatomía urológica para el cirujano general"},{"tipo":"Conducta quirúrgica","pregunta":"¿Agregás una suprarrenalectomía?","opciones":["No, si la glándula es normal en la imagen","Sí, porque es una nefrectomía radical","Sí, porque el tumor mide más de 7 cm","Sí, para completar la estadificación del tumor"],"explicacion":"La suprarrenalectomía homolateral es selectiva: se agrega si la imagen o la cirugía muestran compromiso de la glándula, no de rutina.","fuente":"Kim y Belldegrun, Schwartz 2006, cap. 39; Hermes: Nefrectomía"},{"tipo":"Técnica","pregunta":"¿En qué orden controlás los vasos del pedículo?","opciones":["Primero la arteria y después la vena","Primero la vena y después la arteria","Arteria y vena juntas con una sutura mecánica","El orden es indistinto"],"explicacion":"Se controlan arteria y vena por separado, la arteria primero, para no congestionar el riñón al ocluir la vena con la arteria abierta.","fuente":"EMC, nefrectomía laparoscópica transperitoneal 2013; Hermes: Nefrectomía"}]},{"id":"uro-06","tema":"Nefrectomías","anio":3,"titulo":"Nefrectomía izquierda y un drenaje turbio","vineta":"Mujer de 55 años con una nefrectomía radical izquierda laparoscópica por un tumor de 6 cm del polo superior, en contacto con la cola del páncreas.","pasos":[{"tipo":"Técnica","pregunta":"Al liberar el polo superior izquierdo, ¿qué órganos corren riesgo?","opciones":["Bazo y cola del páncreas","Duodeno y vena cava inferior","Hígado y vesícula biliar del lado derecho","Cabeza del páncreas y colédoco"],"explicacion":"El polo superior del riñón izquierdo se relaciona con el bazo y la cola del páncreas; del lado derecho las relaciones de riesgo son el duodeno, la cava y el hígado.","fuente":"Duclos, EMC 2005, nefrectomía difícil; Hermes: Nefrectomía"},{"tipo":"Técnica","pregunta":"¿Qué venas recibe habitualmente la vena renal izquierda?","opciones":["Gonadal y suprarrenal izquierdas","Mesentérica inferior y esplénica","Gástrica izquierda y coronaria","Ilíaca común izquierda y sacra media"],"explicacion":"La vena renal izquierda recibe la suprarrenal y la gonadal izquierdas, que se ligan al controlar el pedículo; la mesentérica inferior drena en la esplénica.","fuente":"Kim y Belldegrun, Schwartz 2006, cap. 39; Hermes: Anatomía urológica para el cirujano general"},{"tipo":"Diagnóstico","pregunta":"Al tercer día el drenaje aporta líquido turbio con amilasa 20 veces mayor que la sérica. ¿Qué sospechás?","opciones":["Fístula pancreática por lesión de la cola","Fístula urinaria del lecho renal","Ascitis quilosa por lesión linfática","Pancreatitis aguda de origen biliar"],"explicacion":"La amilasa del drenaje muy por encima de la sérica tras disecar la cola del páncreas indica fístula pancreática; la fuga urinaria eleva la creatinina y la quilosa los triglicéridos.","fuente":"Duclos, EMC 2005; Hermes: Nefrectomía"},{"tipo":"Diagnóstico","pregunta":"En recuperación desatura y la radiografía muestra un neumotórax izquierdo. ¿Por qué?","opciones":["Lesión del diafragma o la pleura en el polo superior","Barotrauma por el neumoperitoneo a baja presión","Lesión del bronquio por la intubación","Embolia pulmonar por la posición lateral"],"explicacion":"Al disecar el polo superior o por un acceso alto se puede lesionar el diafragma o la pleura; el neumotórax es una complicación reconocida de la nefrectomía.","fuente":"Duclos, EMC 2005; Hermes: Nefrectomía"}]},{"id":"cyc-01","tema":"Glándulas salivales","anio":4,"titulo":"Tumor parotídeo de crecimiento lento","vineta":"Mujer de 45 años con un nódulo de 2,5 cm en la parótida derecha, móvil, indoloro, de 3 años de evolución. Función facial normal.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué es lo más probable?","opciones":["Adenoma pleomorfo","Carcinoma mucoepidermoide de alto grado","Linfoma","Parotiditis"],"explicacion":"El adenoma pleomorfo es el tumor parotídeo más frecuente: indoloro, de crecimiento lento y sin parálisis facial. Dolor, fijación o parálisis sugieren malignidad.","fuente":"Hermes: Parotidectomía"},{"tipo":"Estudios","pregunta":"¿Qué estudios pedís?","opciones":["Ecografía o resonancia y punción con aguja fina","Biopsia incisional abierta bajo anestesia general","Sialografía y cultivo de saliva","Parotidectomía sin estudios previos"],"explicacion":"La imagen define extensión y lóbulo, y la punción orienta la histología. La biopsia abierta está contraindicada por el riesgo de siembra y de lesión del nervio.","fuente":"Hermes: Parotidectomía"},{"tipo":"Conducta quirúrgica","pregunta":"¿Qué cirugía indicás?","opciones":["Parotidectomía superficial preservando el nervio facial","Enucleación del tumor siguiendo la pseudocápsula","Parotidectomía total con sacrificio del tronco del nervio facial","Observación con ecografía anual hasta que duela"],"explicacion":"La enucleación deja restos de la pseudocápsula y tiene alta recurrencia; se reseca con un margen de tejido sano preservando el nervio facial.","fuente":"Hermes: Parotidectomía"},{"tipo":"Técnica","pregunta":"¿Qué reparos usás para encontrar el tronco del nervio facial?","opciones":["Puntero tragal, vientre posterior del digástrico y sutura timpanomastoidea","La arteria facial en el borde de la mandíbula","El conducto de Stensen, disecándolo desde su desembocadura en la mucosa yugal","La vena yugular externa y el músculo esternocleidomastoideo"],"explicacion":"El tronco se busca con varios reparos concordantes: profundo e inferior al puntero tragal, a nivel del vientre posterior del digástrico y por delante de la sutura timpanomastoidea.","fuente":"Hermes: Parotidectomía"},{"tipo":"Diagnóstico","pregunta":"Meses después suda y se enrojece la mejilla al comer. ¿Qué es?","opciones":["Síndrome de Frey (sudoración gustatoria)","Recidiva tumoral en el lecho parotídeo","Fístula salival cutánea persistente","Paresia de la rama cigomática del facial"],"explicacion":"Las fibras parasimpáticas seccionadas regeneran hacia las glándulas sudoríparas de la piel; la toxina botulínica es un tratamiento eficaz.","fuente":"Hermes: Parotidectomía"}]},{"id":"cyc-02","tema":"Glándulas salivales","anio":4,"titulo":"Tumefacción submaxilar al comer","vineta":"Varón de 50 años con episodios de tumefacción dolorosa submaxilar izquierda al comer. Ecografía: cálculo de 8 mm dentro de la glándula submaxilar, con sialoadenitis crónica.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué tiene?","opciones":["Sialolitiasis submaxilar con sialoadenitis crónica","Tumor submaxilar benigno (adenoma pleomorfo)","Adenopatía metastásica del nivel IB de un primario oral","Quiste branquial del segundo arco infectado"],"explicacion":"El cólico salival con las comidas y un cálculo indican sialolitiasis; la submaxilar es la glándula más afectada por su saliva más viscosa y su conducto ascendente.","fuente":"Hermes: Cirugía submandibular y sublingual"},{"tipo":"Conducta quirúrgica","pregunta":"El cálculo es intraglandular y las crisis se repiten. ¿Qué indicás?","opciones":["Submaxilectomía","Extracción transoral del cálculo","Parotidectomía","Antibióticos de por vida"],"explicacion":"Los cálculos distales del conducto se extraen por vía oral, pero los intraglandulares con sialoadenitis recurrente se tratan con resección de la glándula (o sialendoscopia donde esté disponible).","fuente":"Hermes: Cirugía submandibular y sublingual"},{"tipo":"Técnica","pregunta":"¿Qué nervios debés proteger en la submaxilectomía?","opciones":["Rama marginal del facial, nervio lingual e hipogloso","Nervio laríngeo recurrente, vago y laríngeo superior","Nervio frénico y plexo cervical profundo","Nervio espinal y plexo braquial"],"explicacion":"La incisión se hace 2 a 3 cm debajo de la mandíbula para proteger la rama marginal; en la profundidad, el lingual se separa del ganglio submaxilar y el hipogloso corre bajo la glándula.","fuente":"Hermes: Cirugía submandibular y sublingual; Anatomía quirúrgica del cuello"}]},{"id":"cyc-03","tema":"Cáncer de cavidad oral","anio":4,"titulo":"Úlcera en el borde lingual","vineta":"Varón de 62 años fumador y bebedor con una úlcera indurada de 2 cm en el borde lateral de la lengua de 2 meses. No hay adenopatías palpables. Antes tuvo una placa blanca en la misma zona.","pasos":[{"tipo":"Diagnóstico","pregunta":"¿Qué sospechás y
